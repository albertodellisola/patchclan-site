/* ---------- tokens: os mesmos do patchclan.com (build/head.html) ---------- */
:root{
  --ground:#e3dbc8; --ground-2:#eee8d9; --ground-3:#f5f1e6;
  --ink:#191412; --ink-2:#544a3e;
  --rule:#c5bca5; --rule-soft:#d5ccb8;
  --accent:#96251a; --accent-2:#701a12; --gold:#7d5f0d; --chip:#d5cbb4;
  --crt:#0b0b10; --sobre-accent:#fff; --creme-crt:#efe9dc;
  /* os três sinais da conferência (novos, calibrados para >= 4.5:1 sobre --ground-2) */
  --ok:#2c6a27;   --ok-fundo:rgba(44,106,39,.10);
  --warn:#7a5200; --warn-fundo:rgba(160,112,0,.13);
  --err:#a3160b;  --err-fundo:rgba(163,22,11,.09);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pixel:"Press Start 2P","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
    --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
    --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d;
    --sobre-accent:#14110e;
    --ok:#86c77a; --ok-fundo:rgba(134,199,122,.10);
    --warn:#e2b64c; --warn-fundo:rgba(226,182,76,.11);
    --err:#ff8a7a; --err-fundo:rgba(255,138,122,.10);
  }
}
:root[data-theme="dark"]{
  --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
  --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
  --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d;
  --sobre-accent:#14110e;
  --ok:#86c77a; --ok-fundo:rgba(134,199,122,.10);
  --warn:#e2b64c; --warn-fundo:rgba(226,182,76,.11);
  --err:#ff8a7a; --err-fundo:rgba(255,138,122,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.025em;text-wrap:balance;margin:0}
p{margin:0 0 16px} p:last-child{margin-bottom:0}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.faixa{height:7px;background:linear-gradient(90deg,var(--accent-2) 0 62%,var(--gold) 62% 100%)}
.page{max-width:1120px;margin:0 auto;padding:0 28px 96px}

/* ---------- cabeçalho (cópia do site) ---------- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:20px 0 18px;border-bottom:1px solid var(--rule);position:relative}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.marca-txt{display:flex;flex-direction:column;gap:3px}
.wordmark{font-family:var(--sans);font-weight:800;font-size:21px;letter-spacing:-.035em;text-transform:uppercase;line-height:1}
.selo-marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-2);line-height:1}
.mhright{display:flex;align-items:center;gap:26px}
.masthead nav{display:flex;gap:22px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.masthead nav a{color:var(--ink-2);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}
.masthead nav a:hover{color:var(--ink)}
.masthead nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.masthead nav a.apoie{color:var(--sobre-accent);background:var(--accent);border:0;padding:7px 14px;border-radius:3px}
.langsw{position:relative;font-family:var(--mono);font-size:12px}
.langsw summary{list-style:none;cursor:pointer;color:var(--ink-2);padding:6px 9px;min-height:32px;
  border:1px solid var(--rule);border-radius:3px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.langsw summary::-webkit-details-marker{display:none}
.langsw ul{position:absolute;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:5px;list-style:none;
  background:var(--ground-2);border:1px solid var(--rule);border-radius:4px;min-width:148px;box-shadow:0 10px 26px rgba(25,20,18,.18)}
.langsw li button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;color:var(--ink);
  cursor:pointer;padding:11px;border-radius:2px;font-family:var(--mono);font-size:12.5px;text-align:left}
.langsw li button:hover{background:var(--chip)}
.langsw li button[aria-current="true"]{color:var(--accent);font-weight:600}
.burger{display:none;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:3px;
  min-width:44px;min-height:44px;font-size:16px;line-height:1;cursor:pointer}
.tile{display:grid;grid-template-columns:repeat(8,var(--px));grid-auto-rows:var(--px);flex:none}
.tile i{display:block}
.tile i.on{background:var(--tile-ink,var(--accent))}
.mark-tile{--px:3px}

/* ---------- componentes do site reaproveitados ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--mono);font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;padding:14px 24px;min-height:48px;border-radius:3px;
  background:var(--accent);color:var(--sobre-accent);text-decoration:none;border:1px solid var(--accent);
  white-space:nowrap;cursor:pointer}
.bt:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.bt.fora{background:transparent;color:var(--accent)}
.bt.fora:hover{background:var(--accent);color:var(--sobre-accent)}
.bt.pq{padding:10px 17px;font-size:12px;min-height:44px}
.bt[disabled]{opacity:.42;cursor:not-allowed;background:var(--chip);border-color:var(--rule);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;background:var(--chip);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:500;white-space:nowrap}
.pill.on{background:var(--accent);color:var(--sobre-accent)}
.pill.beta{box-shadow:inset 0 0 0 1px var(--rule)}
.pill.alfa{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.label{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  margin:0 0 26px;display:flex;align-items:center;gap:14px}
.label::after{content:"";height:1px;background:var(--rule);flex:1}
.mono{font-family:var(--mono)}

/* ---------- topo: o que é patch ---------- */
.abre{padding:52px 0 36px}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin:0 0 18px}
.abre h1{font-weight:800;font-size:clamp(32px,4.6vw,50px);line-height:1.05;max-width:16em}
.lede{font-size:20px;line-height:1.5;margin:20px 0 0;max-width:34em}
.regras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:34px 0 0;border-top:1px solid var(--rule)}
.regras > div{padding:20px 26px 4px 0}
.regras > div + div{padding-left:26px;border-left:1px solid var(--rule-soft)}
.regras dt{font-family:var(--sans);font-weight:700;font-size:17px;margin:0 0 6px;display:flex;gap:10px;align-items:baseline}
.regras dt .n{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:500}
.regras dd{margin:0;color:var(--ink-2);font-size:16px;line-height:1.55}
.regras .forte dt{color:var(--accent)}

/* ---------- o aplicador ---------- */
.apl{margin-top:40px;background:var(--ground-2);border:1px solid var(--ink);border-radius:2px;
  box-shadow:5px 5px 0 rgba(25,20,18,.09)}
.trava{display:flex;align-items:center;gap:14px;background:var(--crt);color:var(--creme-crt);padding:14px 22px;
  position:sticky;top:0;z-index:15}
.trava .tile{--px:3px;--tile-ink:#d9b04a}
.trava b{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.25}
.trava span{font-family:var(--mono);font-size:12px;color:#b9b0a0;letter-spacing:.02em;display:block;line-height:1.4;margin-top:2px}
.passos{list-style:none;margin:0;padding:0}
.passo{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 18px;padding:26px 26px 28px 22px;border-top:1px solid var(--rule)}
.passo:first-child{border-top:0}
.passo .num{width:40px;height:40px;display:grid;place-items:center;font-family:var(--pixel);font-size:13px;
  border:2px solid var(--ink);color:var(--ink);background:var(--ground-3);border-radius:2px;line-height:1}
.passo.ativo .num{background:var(--accent);border-color:var(--accent);color:var(--sobre-accent)}
.passo.feito .num{background:var(--ink);border-color:var(--ink);color:var(--ground-2)}
.passo.espera .num{border-color:var(--rule);color:var(--ink-2);background:transparent}
.passo h2{font-size:21px;line-height:1.2;margin:8px 0 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.passo.espera h2{color:var(--ink-2)}
.passo .espera-txt{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.passo .corpo{margin-top:18px}
.resumo{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.resumo b{font-family:var(--sans);font-size:16px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.trocar{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  background:none;border:0;cursor:pointer;padding:12px 4px;margin:-12px 0;text-decoration:underline;text-underline-offset:3px}

/* caminhos (a) e (b): segmentado */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:3px;overflow:hidden;max-width:560px}
.seg button{border:0;background:transparent;cursor:pointer;padding:12px 14px;min-height:48px;font-family:var(--mono);
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--ground-2)}
.seg button:hover:not([aria-selected="true"]){background:var(--chip);color:var(--ink)}

/* lista de jogos */
.busca{margin:20px 0 0;display:flex;flex-direction:column;gap:6px;max-width:560px}
.busca label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
input[type=search],input[type=text]{font-family:var(--mono);font-size:16px;padding:12px 14px;min-height:48px;width:100%;
  background:var(--ground-3);color:var(--ink);border:1px solid var(--rule);border-radius:3px}
input[type=search]:focus,input[type=text]:focus{border-color:var(--ink);outline:0;box-shadow:0 0 0 3px rgba(150,37,26,.2)}
.jogos{margin:16px 0 0;max-height:420px;overflow:auto;border:1px solid var(--rule);border-radius:3px;background:var(--ground-3);max-width:760px}
.jogos h3{position:sticky;top:0;z-index:1;margin:0;padding:9px 14px;background:var(--ground-2);border-bottom:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.jogos ul{list-style:none;margin:0;padding:0}
.jogo-bt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--rule-soft);background:transparent;padding:12px 14px;min-height:56px;cursor:pointer}
.jogo-bt:hover{background:var(--ground-2)}
.jogo-bt b{font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.jogo-bt .sis{font-family:var(--mono);font-size:12px;color:var(--ink-2);grid-column:1}
.jogo-bt .dir{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center}
.jogo-bt .fls{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-2)}
.nada{padding:18px 14px;font-family:var(--mono);font-size:13px;color:var(--ink-2)}

/* jogo escolhido */
.escolhido{border:1px solid var(--rule);border-radius:3px;background:var(--ground-3);padding:18px 18px 20px;max-width:760px}
.escolhido .topo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.escolhido h3{font-size:20px;margin:0}
.escolhido .ficha{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.7}
.escolhido .ficha b{color:var(--ink);font-weight:500}
.idiomas{margin:16px 0 0}
.idiomas p{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.idiomas .opts{display:flex;gap:8px;flex-wrap:wrap}
.idiomas button{border:1px solid var(--rule);background:var(--ground-2);border-radius:3px;padding:10px 14px;min-height:44px;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.idiomas button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ground-3);font-weight:600}
.estado-patch{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.estado-patch .ok{color:var(--ok);font-weight:600}
.giro{width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}

/* patreon */
.patreon{margin:18px 0 0;padding:18px;border:1px solid var(--accent);border-radius:3px;background:var(--ground-2)}
.patreon h4{font-family:var(--sans);font-size:16px;margin:0 0 6px}
.patreon p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0 0 14px}

/* zona de soltar */
.solta{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  border:2px dashed var(--rule);border-radius:4px;background:var(--ground-3);padding:28px 18px;min-height:190px;max-width:760px;
  transition:border-color .12s,background .12s}
.solta.pq{min-height:150px;padding:20px 16px}
.solta .tile{--px:5px;--tile-ink:var(--ink-2);margin-bottom:4px}
.solta b{font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:-.015em}
.solta .ou{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.12em}
.solta .fmt{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-2);margin-top:4px}
.solta .local{font-family:var(--mono);font-size:12px;color:var(--ok);display:flex;gap:7px;align-items:center;margin-top:2px}
.solta.sobre{border-color:var(--accent);border-style:solid;background:var(--ground-2)}
.solta.sobre .tile{--tile-ink:var(--accent)}
.solta input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.precisa{max-width:760px;margin:0 0 14px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);line-height:1.7;
  padding:10px 14px;border-left:3px solid var(--ink);background:var(--ground-3)}
.precisa b{color:var(--ink);font-weight:500}

/* cartão de estado (conferência e erros) */
.sinal{--c:var(--ink);--f:transparent;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;max-width:760px;
  border:1px solid var(--c);border-left-width:6px;border-radius:3px;background:var(--f);padding:18px 20px 20px 16px}
.sinal.ok{--c:var(--ok);--f:var(--ok-fundo)}
.sinal.warn{--c:var(--warn);--f:var(--warn-fundo)}
.sinal.err{--c:var(--err);--f:var(--err-fundo)}
.sinal .ico{grid-row:1 / span 2;width:36px;height:36px;display:grid;place-items:center;border-radius:2px;background:var(--c)}
.sinal .ico .tile{--px:3px;--tile-ink:var(--ground-2)}
.sinal h3{font-size:19px;color:var(--c);margin:5px 0 0;line-height:1.25}

<script>
(function(){
'use strict';

/* =====================================================================
   1. TEXTO
   ===================================================================== */
var LANG = 'pt';
function ligarTexto(){
  var X = window.PC_TEXTO; if (!X) return 0;
  var n = 0;
  (function anda(o, pre){
    Object.keys(o).forEach(function(k){
      if (k === '_meta') return;
      var v = o[k], ch = pre ? pre + '.' + k : k;
      if (Array.isArray(v)) { TEXTO[ch] = v; n++; }
      else if (v && typeof v === 'object' && ('en' in v || 'pt' in v || 'es' in v)) { TEXTO[ch] = v; n++; }
      else if (v && typeof v === 'object') anda(v, ch);
    });
  })(X, '');
  return n;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function um(par){ return par ? (par[LANG] || par.en || par.pt || '') : ''; }
/* t(): o modelo do redator pode ter <b>; as variáveis (nome de arquivo, hash) sempre escapadas */
function t(k, v){
  var par = TEXTO[k];
  var s = par && !Array.isArray(par) ? um(par) : '⟦' + k + '⟧';
  s = s.replace(/\{(\w+)\}/g, function(_, n){
    if (!v || v[n] == null) return '{'+n+'}';
    return v[n] === '' ? '\u0000' : '<span class="var">'+esc(v[n])+'</span>';
  });
  /* variável vazia (ex.: patch sem versão) não deixa ", ," nem "( )" no texto */
  return s.replace(/,\s*\u0000/g, '').replace(/\u0000\s*,\s*/g, '').replace(/\s*\(\u0000\)/g, '').replace(/\u0000/g, '');
}
function tp(k, v){ return t(k, v).replace(/<[^>]+>/g, ''); }          /* texto puro, para atributos */
function tl(k){ var a = TEXTO[k]; return Array.isArray(a) ? a.map(um) : []; }
function tem(k){ return !!TEXTO[k]; }

/* =====================================================================
   2. PIXELS (o tile 8x8 da marca do site)
   ===================================================================== */
var PIX = {
  marca:  ['...##...','..#..#..','.#....#.','##....##','##....##','.#....#.','..#..#..','...##...'],
  cadeado:['..####..','.#....#.','.#....#.','########','###..###','###..###','########','########'],
  ok:     ['........','.......#','......##','#....##.','##..##..','.####...','..##....','........'],
  alerta: ['...##...','...##...','...##...','...##...','...##...','........','...##...','...##...'],
  erro:   ['##....##','###..###','.######.','..####..','..####..','.######.','###..###','##....##'],
  arquivo:['#####...','#...##..','#...###.','#.....#.','#.###.#.','#.....#.','#.###.#.','#######.'],
  cartucho:['.######.','.#....#.','.#....#.','.######.','########','#.#.#.##','#.#.#.##','########']
};
function celulas(n){ return PIX[n].join('').split('').map(function(c){ return c === '#' ? '<i class="on"></i>' : '<i></i>'; }).join(''); }
function pix(n){ return '<div class="tile" aria-hidden="true">' + celulas(n) + '</div>'; }

/* =====================================================================
   3. MOTOR — a única costura entre interface e lógica.
   A interface só chama Motor.*; dois motores cumprem o mesmo contrato:
     MotorDemo  finge tudo; SÓ com ?demo=1 explícito (nunca por falha)
     MotorQuebrado  quando o motor real não carregou: tudo recusa, a tela manda recarregar
     MotorReal  embrulha window.PCAplicador (app/aplicador.js)
   ligarMotor() escolhe. Mudou a API do engenheiro? Só MotorReal muda.

   Contrato (formas que a interface desenha):
     catalogo()                    -> Promise<[Jogo]>
        Jogo {slug,nome,sistema,nivel,versao,idiomas[],tamanho{idi:'74 KB'},
              rom{nome,md5}, patreon, manual, itens{idi: item do catálogo}}
     patchDoSite(Jogo, idi)        -> Promise<Patch>
     identificarPatch(File, Jogo|null, idi) -> Promise<Patch>  | rejeita Falha
        Patch {nome,formato,tamanho,origem:'site'|'patreon'|'usuario',conferencia:bool,
               esperado{nome,md5,crc32}|null, idioma, versao, jogo(slug)|null, reconhecido:bool}
     conferirRom(Patch, File)      -> Promise<Conf>
        Conf {status:'ok'|'cabecalho'|'ordem'|'sem'|'bloco'|'errada', jaTraduzida?, rom{nome,tamanho},
              hashes{crc32,md5,sha1}, esperado, bytes(cabeçalho), ordem('.v64'), revisao(nome)}
     aplicar(Patch, Conf, cb(pct|null, feitos, total, etapa)) -> Promise<Saida> | rejeita Falha
        Saida {nome,tamanho,blob,hashes{md5},confereBuild:true|false|null}
     Falha {codigo:'nao_patch'|'zip'|'corrompido'|'patch_nao_e_este'|'saida'|'baixar'|'outro', texto?}
   ===================================================================== */
var MODO = 'demo', MOTIVO_DEMO = '';
var Motor = null;
/* D1 (laudo): a página NUNCA cai sozinha na demonstração. Demonstração só com ?demo=1 explícito,
   e aí a faixa DEMONSTRAÇÃO aparece. Sem ?demo=1 e sem o motor real, a página fica QUEBRADA:
   erro que manda recarregar e nenhum botão de arquivo. */
function ligarMotor(){
  var A = window.PCAplicador;
  var nucleo = typeof RomPatcher !== 'undefined' && typeof BinFile === 'function';
  if (Q.get('demo') === '1' && typeof MotorDemo !== 'undefined') { Motor = MotorDemo; MODO = 'demo'; MOTIVO_DEMO = 'pedido por ?demo=1'; return; }
  if (A && typeof A.aplicar === 'function' && nucleo) { Motor = MotorReal(A); MODO = 'real'; return; }
  Motor = MotorQuebrado; MODO = 'quebrado'; MOTIVO_DEMO = A ? 'núcleo do Rom Patcher ausente' : 'aplicador.js ausente';
}
var MotorQuebrado = (function(){
  function nao(){ return Promise.reject({codigo:'quebrado'}); }
  return { catalogo:function(){ return Promise.resolve([]); }, patchDoSite:nao, identificarPatch:nao, conferirRom:nao, aplicar:nao, cancelar:null };
})();
function decodifica(x){ var d = document.createElement('textarea'); d.innerHTML = String(x == null ? '' : x); return d.value; }

function lerBytes(arq){ return arq.arrayBuffer().then(function(b){ return new Uint8Array(b); }); }
function depoisDaPintura(){ return new Promise(function(ok){ setTimeout(ok, 60); }); }   /* deixa o navegador pintar o 'aplicando' antes do trabalho pesado */

function MotorReal(A){
  var URL_CATALOGO = window.PC_URL_CATALOGO || 'catalogo.json';
  var todos = [];
  function kb(n){ return n == null ? '' : Math.max(1, Math.round(n/1024)) + ' KB'; }
  function agrupa(itens){
    var por = {}, ordem = [];
    itens.forEach(function(it){
      var j = por[it.slug];
      if (!j) { j = por[it.slug] = { slug:it.slug, nome:decodifica(it.jogo), sistema:it.sistema || '', nivel:it.nivel || 'alfa',
        versao:it.versao || '', idiomas:[], tamanho:{}, itens:{}, rom:{nome:it.nome_rom_esperada, md5:it.md5_original},
        patreon:it.url_patreon || 'https://www.patreon.com/patchclan', manual:it.url_manual || null }; ordem.push(j); }
      (it.idiomas || [it.idioma]).forEach(function(i){
        if (j.idiomas.indexOf(i) < 0) j.idiomas.push(i);
        j.itens[i] = it; j.tamanho[i] = kb(it.tamanho_patch);
      });
    });
    ordem.forEach(function(j){ j.idiomas.sort(function(a,b){ return 'enespt'.indexOf(a) - 'enespt'.indexOf(b); }); });
    return ordem;
  }
  function esperadoDe(it){ return it ? {nome:it.nome_rom_esperada, md5:it.md5_original, crc32:it.crc32_original} : null; }
  function falhaDe(e){
    var c = e && e.codigo;
    if (c === 'PATCH_DESCONHECIDO') return {codigo:'nao_patch'};
    if (c === 'PATCH_INVALIDO') return {codigo:'corrompido'};
    if (c === 'PATCH_NAO_E_ESTE') return {codigo:'patch_nao_e_este', texto:e.mensagem};
    if (c === 'SAIDA_NAO_CONFERE') return {codigo:'saida', detalhe:e.detalhe};
    if (c === 'PATCH_INDISPONIVEL' || c === 'PATCH_SO_NO_PATREON') return {codigo:'baixar'};
    if (c === 'CANCELADO') return {codigo:'cancelado'};
    return {codigo:'outro', texto:(e && (e.mensagem || e.message)) || ''};
  }
  function patchDe(u8, nome, it, origem, idi){
    var info = A.identificarPatch(u8, nome);
    return { nome:nome, formato:info.formato, tamanho:u8.length, origem:origem, bytes:u8, info:info,
      item:it || null, conferencia: !!it || !!info.confereEntrada, esperado: it ? esperadoDe(it) : (info.crcEntrada ? {crc32:info.crcEntrada} : null),
      idioma: idi || (it && it.idiomas && it.idiomas[0]) || null, versao: it ? it.versao : '', jogo: it ? it.slug : null, reconhecido: !!it };
  }
  return {
    catalogo: function(){
      return A.carregarCatalogo(URL_CATALOGO).then(function(l){ todos = l || []; return agrupa(todos); });
    },
    patchDoSite: function(j, idi){
      var it = j.itens[idi];
      return A.baixarPatch(it).then(function(u8){ return patchDe(u8, it.arquivo, it, 'site', idi); }, function(e){ throw falhaDe(e); });
    },
    identificarPatch: function(arq, j, idi){
      if (/\.(zip|7z|rar|gz)$/i.test(arq.name)) return Promise.reject({codigo:'zip'});
      return lerBytes(arq).then(function(u8){
        var it = j ? j.itens[idi] : null;
        /* identidade do patch por SHA-256 (o CRC32 de todo BPS/UPS é o mesmo, 2144df1c) */
        return A.util.hashArquivo(u8).then(function(h){
          /* D4: o SHA-256 é procurado no catálogo INTEIRO. Patch do mesmo jogo em outro idioma troca o
             idioma; patch de outro jogo troca o jogo; nos dois casos a tela diz o que mudou. */
          var achado = null, aviso = null;
          todos.forEach(function(x){ if (!achado && x.sha256_patch && x.sha256_patch === h.sha256) achado = x; });
          if (j) {
            if (achado) {
              it = achado;
              var idis = achado.idiomas || [achado.idioma];
              if (achado.slug !== j.slug) { aviso = 'outro_jogo'; idi = idis[0]; }
              else if (idis.indexOf(idi) < 0) { aviso = 'idioma_trocado'; idi = idis[0]; }
            } else if (it && it.sha256_patch) {
              throw {codigo:'patch_nao_e_este'};
            }
          } else it = achado;
          var p;
          try { p = patchDe(u8, arq.name, it, j ? 'patreon' : 'usuario', idi); }
          catch (e) { throw falhaDe(e); }
          p.aviso = aviso; if (it) p.jogoNome = decodifica(it.jogo);
          return p;
        });
      });
    },
    conferirRom: function(p, arq, cbConf){
      return lerBytes(arq).then(function(u8){
        var alvo = p.item || (p.esperado && p.esperado.crc32 ? {crc32:p.esperado.crc32} : null);
        var tam = u8.length;
        /* D6: a ROM vai ao worker por transferência (sem cópia) e a página não guarda os bytes;
           para aplicar, o File é relido. */
        return depoisDaPintura().then(function(){ return A.conferirRom(u8, alvo, arq.name, { transferir:true,
          progresso:function(ev){ if (cbConf) cbConf(ev.pct); } }); }).then(function(r){
          var c = { rom:{nome:arq.name, tamanho:tam}, arquivo:arq, hashes:{crc32:r.crc32, md5:r.md5, sha1:r.sha1},
                    esperado:p.esperado, motivo:r.motivo };
          var cab = r.cabecalho || {};
          c.jaTraduzida = !!r.jaTraduzida;
          /* PPF com bloco de validação: sem hash para conferir antes, mas o aplicador compara o bloco ao aplicar (D10) */
          if (!alvo && p.info && p.info.confereEntrada) c.status = 'bloco';
          else if (!alvo) c.status = 'sem';
          else if (r.ok === false) c.status = 'errada';
          else if (/^N64/.test(cab.tipo || '')) { c.status = 'ordem'; c.ordem = '.' + cab.tipo.split(' ')[1]; }
          else if (cab.tipo) { c.status = 'cabecalho'; c.bytes = {'SNES copiadora':512, 'SMD':512, 'iNES+trainer':528}[cab.tipo] || 16; c.descricao = cab.descricao; }
          else c.status = 'ok';
          return c;
        });
      });
    },
    aplicar: function(p, c, cb){
      cb(0, 0, c.rom.tamanho, 'ler');
      /* o nome do arquivo sai do texto (ui.arquivo_saida_modelo); o aplicador preenche {jogo} {versao}
         do catálogo e põe a extensão certa. O idioma vai escrito no idioma da página. */
      var modelo = TEXTO['ui.arquivo_saida_modelo'] ? tp('ui.arquivo_saida_modelo') : null;
      var idi = p.idioma || (p.item && p.item.idiomas && p.item.idiomas[0]);
      var op = { esperado:p.item || null, nomeRom:c.rom.nome, nomePatch:p.nome, transferir:true,
                 progresso: function(ev){ cb(ev.pct, ev.feitos, ev.total, ev.etapa === 'pronto' ? 'conferir' : ev.etapa); } };
      if (p.item && modelo) { op.modeloNomeSaida = modelo; op.valoresNome = { jogo: decodifica(p.item.jogo) }; if (idi) op.valoresNome.idioma = tp('iu.idioma.' + idi); }
      return depoisDaPintura().then(function(){ return lerBytes(c.arquivo); }).then(function(u8){
        /* o patch vai por cópia (slice) porque a transferência esvazia o buffer e ele serve para aplicar de novo */
        return A.aplicar(u8, p.bytes.slice(), op);
      }).then(function(r){
        var s = r.conferencia && r.conferencia.saida || {};
        /* D5: "idêntica à nossa build" só quando é patch NOSSO conferido pelo md5_resultado do catálogo */
        var build = !!(p.item && s.conferida && s.ok && /cat[aá]logo/i.test(s.metodo || ''));
        return { nome:r.nomeSaida, tamanho:r.bytes.length, blob:new Blob([r.bytes], {type:'application/octet-stream'}),
                 hashes:{md5:s.md5, crc32:s.crc32}, confereBuild: build, conferePatch: !build && s.conferida && s.ok ? (s.metodo || 'patch') : null };
      }, function(e){ throw falhaDe(e); });
    },
    cancelar: function(){ A.cancelar(); }
  };
}

  if (n == null) return '';
  var sep = LANG === 'en' ? '.' : ',';
  if (n < 1024) return n + ' bytes';
  if (n < 1048576) return Math.round(n/1024) + ' KB';
  return (n/1048576).toFixed(1).replace('.', sep) + ' MB';
}

    nivel: j ? nomeNivel(j.nivel) : '', formato: p.formato || '', rom_esperada: e.nome || '', md5_esperado: e.md5 || '',
    md5_encontrado: (c.hashes||{}).md5 || '', crc_esperado: e.crc32 || '', crc_encontrado: (c.hashes||{}).crc32 || '',
    bytes: c.bytes || 512, formato_encontrado: c.ordem || '', formato_esperado: '.z64', rom_encontrada: c.revisao || '',
    md5_saida: S.saida && S.saida.hashes ? S.saida.hashes.md5 : '' };

  var tipos = [['crc32','CRC32'],['md5','MD5'],['sha1','SHA-1']];
  return '<dl class="hashes">' + tipos.filter(function(x){ return h[x[0]]; }).map(function(x){
    return '<div><dt>'+x[1]+'</dt><dd'+(marcar===x[0]?' class="bate"':'')+'>'+grupos(h[x[0]])+'</dd>' +
      '<button type="button" class="copiar" data-copiar="'+esc(h[x[0]])+'">'+t('ui.botao_copiar')+'</button></div>'; }).join('') + '</dl>';
}
function comparaColado(){
  var v = S.hashColado.replace(/^0x/i,'').replace(/[\s:-]/g,'').toLowerCase();
  if (!v) return {cls:'', html:''};
  var tipo = v.length === 8 ? 'crc32' : v.length === 32 ? 'md5' : v.length === 40 ? 'sha1' : null;
  if (!tipo || !/^[0-9a-f]+$/.test(v)) return {cls:'warn', html:'! '+t('ui.erro_hash_invalido')};
  var nome = {crc32:'CRC32', md5:'MD5', sha1:'SHA-1'}[tipo], meu = (S.conf.hashes[tipo]||'').toLowerCase();
  return meu === v ? {cls:'ok', html:'✓ '+t('ui.hash_confere',{tipo_hash:nome}), tipo:tipo, bate:true}
                   : {cls:'err', html:'✕ '+t('ui.erro_hash_nao_bate',{tipo_hash:nome, hash_colado:v, hash_calculado:meu}), tipo:tipo, bate:false};
}

function htmlPasso3(){
  if (!S.conf) return {estado:'espera'};
  var c = S.conf, h, v = V();
  if (c.status === 'ok') h = cartao('ok','ok', t('iu.ok_t'), c.esperado && c.esperado.nome ? t('iu.ok_d', v) : t('ui.patch_confere_sozinho', v), linhasHash({md5:c.hashes.md5}, 'md5'));
  else if (c.status === 'cabecalho') h = cartao('warn','alerta', t('iu.cab_t'), t('ui.rom_cabecalho_removido', v), linhasHash({md5:c.hashes.md5}));
  else if (c.status === 'ordem') h = cartao('warn','alerta', t('iu.ordem_t'), t('ui.rom_ordem_bytes', v), linhasHash({md5:c.hashes.md5}));
  else if (c.status === 'bloco') h = cartao('ok','ok', t('iu.bloco_t'), t('iu.bloco_d', v), linhasHash({md5:c.hashes.md5}));
  else if (c.status === 'sem') {
    var cmp = comparaColado();
    h = cartao('warn','alerta', t('iu.sem_t'), t('ui.aviso_sem_conferencia', v),
      '<p class="rot-hashes">'+t('ui.rotulo_hashes_rom')+'</p>' + linhasHash(c.hashes, cmp.bate ? cmp.tipo : null) +
      '<div class="colar"><label for="colado">'+t('ui.rotulo_hash_autor')+'</label>' +
      '<input type="text" id="colado" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="'+tp('ui.placeholder_hash_autor')+'" value="'+esc(S.hashColado)+'">' +
      '<p class="res '+cmp.cls+'" id="colado-res" aria-live="polite">'+cmp.html+'</p>' +
      '<p class="dica-hash">'+t('ui.dica_hash')+'</p></div>');
  } else {
    var e = c.esperado || {}, txt, mais = '';
    if (c.jaTraduzida) {
      return {estado:'ativo', corpo:cartao('warn','alerta', t('iu.ja_trad_t'), t('iu.ja_trad_d', v),
        '<div style="margin-top:14px"><button type="button" class="bt fora pq" data-acao="trocar-rom">'+t('ui.botao_outra_rom')+'</button></div>', 'alert')};
    }
    if (e.nome) {
      txt = c.revisao ? t('ui.erro_rom_outra_revisao', v) : t('ui.erro_rom_errada', v);
      mais = '<dl class="compara"><div><dt>'+t('iu.esperada')+'</dt><dd>'+esc(e.nome)+'<span class="h">MD5 '+esc(e.md5||'')+'</span></dd></div>' +
        '<div class="errado"><dt>'+t('iu.sua')+'</dt><dd>'+esc(c.rom.nome)+'<span class="h">MD5 '+esc(c.hashes.md5)+'</span></dd></div></dl>' +
        '<p class="dica">'+t('ui.erro_rom_errada_dica')+'</p>';
    } else txt = t('ui.erro_patch_rom_errada', v);
    h = cartao('err','erro', t('iu.errada_t'), txt, mais + '<div style="margin-top:14px"><button type="button" class="bt fora pq" data-acao="trocar-rom">'+t('ui.botao_outra_rom')+'</button></div>', 'alert');
  }
  return {estado: c.status === 'errada' ? 'ativo' : 'feito', corpo:h};
}

function htmlPasso4(){
  if (!S.conf) return {estado:'espera'};
  if (S.fase === 'aplicando') {
    var p = S.prog || {pct:null, feitos:0, total:0, etapa:'aplicar'}, indet = p.pct == null;
    var ord = ['ler','aplicar','conferir'], k = ord.indexOf(p.etapa);
    return {estado:'ativo', corpo:'<div class="prog"><div class="linha"><span>'+t('ui.estado_aplicando')+'</span><b>'+(indet?'':p.pct+'%')+'</b></div>' +
      '<div class="barra'+(indet?' indet':'')+'" role="progressbar" aria-valuemin="0" aria-valuemax="100"'+(indet?'':' aria-valuenow="'+p.pct+'"')+' aria-label="'+tp('ui.estado_aplicando')+'"><i style="width:'+(indet?40:p.pct)+'%"></i></div>' +
      '<div class="linha" style="margin:8px 0 0;color:var(--ink-2)"><span>'+(indet?fmtBytes(p.total):t('iu.de',{a:fmtBytes(p.feitos),b:fmtBytes(p.total)}))+'</span>' +
      (Motor.cancelar ? '<button type="button" class="trocar" data-acao="cancelar">'+t('iu.cancelar')+'</button>' : '') + '</div>' +
      (indet ? '' : '<ol class="etapas-ap">'+ord.map(function(e,i){ return '<li class="'+(i<k?'feito':i===k?'agora':'depois')+'">'+t('iu.etapa.'+e)+'</li>'; }).join('')+'</ol>') +
      (p.total > 4194304 ? '<p class="grande">'+t('iu.grande')+'</p>' : '') + '</div>'};
  }
  if (S.fase === 'pronto' && S.saida) {
    var s = S.saida, j = S.jogo && jogoPorSlug(S.jogo), nosso = !!(j || (S.patch && (S.patch.reconhecido || S.patch.item))), v = V();
    return {estado:'feito', corpo:'<div class="pronto">' + cartao('ok','ok', nosso ? t('ui.sucesso', v) : t('ui.sucesso_outros'),
      s.confereBuild ? t('ui.sucesso_conferido', v) : s.conferePatch ? t('iu.saida_confere_patch', v) : '',
      '<p class="arquivo"><b>'+esc(s.nome)+'</b><span>'+fmtBytes(s.tamanho)+'</span></p>' +
      '<div class="baixa"><button type="button" class="bt" data-acao="baixar">⬇ '+t(nosso?'ui.botao_salvar':'ui.botao_salvar_outros')+'</button>' +
      (j && j.manual ? '<a class="bt fora" href="'+esc(j.manual)+'">'+t('iu.manual')+'</a>' : '') + '</div>' +
      '<p class="prox">'+t('ui.sucesso_dica')+'</p>' +
      '<p style="margin-top:14px"><button type="button" class="trocar" data-acao="recomecar">↺ '+t('ui.botao_recomecar')+'</button></p>') + '</div>'};
  }
  var st = S.conf.status, bloq = st === 'errada', cmp = st === 'sem' ? comparaColado() : null;
  var mesmo = st === 'sem' && !(cmp && cmp.bate);
  var falha = '';
  if (S.falhaAplicar) {
    var f = S.falhaAplicar;
    falha = '<div style="margin-bottom:16px">' + cartao('err','erro', t('iu.falhou_t'),
      f.codigo === 'saida' ? t('ui.erro_saida_nao_confere', V({crc_esperado:(f.detalhe||{}).crc32 ? '' : '', crc_encontrado:(f.detalhe||{}).crc32||''})) : esc(f.texto || ''), '', 'alert') + '</div>';
  }
  return {estado: bloq ? 'espera' : 'ativo', corpo: falha + '<div class="acao">' +
    '<button type="button" class="bt" data-acao="aplicar"'+(bloq?' disabled aria-disabled="true"':'')+'>▶ '+t(mesmo?'ui.botao_aplicar_mesmo_assim':'ui.botao_aplicar')+'</button>' +
    (bloq ? '<p class="nota err">'+t('iu.bloqueado')+'</p>' : mesmo && tem('ui.aviso_mesmo_assim') ? '<p class="nota">'+t('ui.aviso_mesmo_assim')+'</p>' : '') + '</div>'};
}

function desenhaApl(){
  var p1 = htmlPasso1(), p2 = htmlPasso2(), p3 = htmlPasso3(), p4 = htmlPasso4();
  var ae = document.activeElement, foco = ae && ae.id, pos = foco && ae.selectionStart;
  var trava = '<div class="trava" id="apl-trava">'+pix('cadeado')+'<div><b>'+t('ui.privacidade_curta')+'</b></div></div>';
  if (MODO === 'quebrado') {
    /* D1: sem motor não há passo nenhum para clicar. Só o erro e o botão de recarregar. */
    document.getElementById('apl').innerHTML = trava + '<div class="quebrado">' +
      cartao('err','erro', t('iu.quebrado_t'), t('iu.quebrado_d'),
        '<button type="button" class="bt" data-acao="recarregar">↻ '+t('iu.recarregar')+'</button>', 'alert') + '</div>';
    return;
  }
  document.getElementById('apl').innerHTML = trava +
    (MODO === 'demo' ? '<p class="faixa-demo" role="note"><b>'+t('iu.demo')+'</b> '+t('iu.demo_aviso')+'</p>' : '') +
    '<ol class="passos">' +
      passo(1, p1.estado, t('iu.passo.1'), p1.resumo, p1.corpo) +
      passo(2, p2.estado, t('iu.passo.2'), p2.resumo, p2.corpo, 'iu.espera.2') +
      passo(3, p3.estado, t('iu.passo.3'), p3.resumo, p3.corpo, 'iu.espera.3') +
      passo(4, p4.estado, t('iu.passo.4'), p4.resumo, p4.corpo, S.conf && S.conf.status==='errada' ? null : 'iu.espera.4') +
    '</ol>';
  if (foco === 'busca' || foco === 'colado') { var el = document.getElementById(foco); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} } }
}
function desenhaTudo(){ desenhaCabecalho(); desenhaAbre(); desenhaApl(); desenhaSaiba(); if (MODO === 'demo' && typeof desenhaDemo === 'function') desenhaDemo(); }
function fala(html){ var f = document.getElementById('falado'); f.textContent = ''; setTimeout(function(){ f.textContent = String(html).replace(/<[^>]+>/g,''); }, 30); }
function focaPasso(n){ setTimeout(function(){ var h = document.querySelectorAll('.passo h2')[n-1]; if (h) { h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); h.scrollIntoView({block:'nearest', behavior:'smooth'}); } }, 40); }

/* =====================================================================
   6. AÇÕES — iguais para demonstração e API real: tudo passa pelo Motor
   ===================================================================== */
function escolherJogo(slug){
  if (MODO === 'quebrado') return;
  var j = jogoPorSlug(slug); if (!j) return;
  S.jogo = slug; S.idioma = j.idiomas[0]; S.patch = null; S.falhaPatch = null;
  desenhaApl();
  if (j.nivel === 'release') buscarPatchDoSite();
}
function buscarPatchDoSite(){
  var j = jogoPorSlug(S.jogo); S.buscandoPatch = true; S.falhaPatch = null; desenhaApl();
  Motor.patchDoSite(j, S.idioma).then(function(p){
    S.buscandoPatch = false; S.patch = p; desenhaApl(); fala(t('iu.patch_carregado')); focaPasso(2);
  }, function(f){ S.buscandoPatch = false; S.falhaPatch = f || {codigo:'baixar'}; desenhaApl(); });
}
function arquivoPatch(arq){
  if (MODO === 'quebrado') return;
  var j = S.jogo && jogoPorSlug(S.jogo);
  S.falhaPatch = null; S.lendoPatch = true; desenhaApl();
  Motor.identificarPatch(arq, j && j.nivel !== 'release' ? j : null, S.idioma).then(function(p){
    if (p.reconhecido && !j) { var jj = jogoPorSlug(p.jogo); p.jogoNome = jj ? jj.nome : (p.jogoNome || p.jogo); }
    if (j && p.jogo && jogoPorSlug(p.jogo)) { S.jogo = p.jogo; }          /* D4: o arquivo decide o jogo */
    if (j && p.idioma) S.idioma = p.idioma;                                /* D4: e o idioma */
    S.lendoPatch = false; S.patch = p; desenhaApl(); fala(p.formato + ' · ' + p.nome); focaPasso(2);
  }, function(f){
    S.lendoPatch = false; S.patch = null; S.falhaPatch = Object.assign({nome:arq.name}, f || {codigo:'nao_patch'}); desenhaApl(); fala(tp('iu.nao_patch_t'));
  });
}
function arquivoRom(arq){
  if (MODO === 'quebrado' || !S.patch) return;
  S.romNome = arq.name; S.confPct = null; S.conferindo = true; S.conf = null; S.hashColado = ''; S.falhaAplicar = null; desenhaApl();
  var ultimo = 0;
  Motor.conferirRom(S.patch, arq, function(pct){
    var agora = Date.now(); if (pct != null && pct !== S.confPct && agora - ultimo > 150) { ultimo = agora; S.confPct = pct; desenhaApl(); }
  }).then(function(c){
    S.conferindo = false; S.conf = c; desenhaApl(); focaPasso(3);
    fala(tp({ok:'iu.ok_t', cabecalho:'iu.cab_t', ordem:'iu.ordem_t', sem:'iu.sem_t', bloco:'iu.bloco_t', errada:c.jaTraduzida ? 'iu.ja_trad_t' : 'iu.errada_t'}[c.status]));
  }, function(){ S.conferindo = false; desenhaApl(); fala(tp('ui.erro_ler_arquivo')); });
}
function aplicar(){
  if (MODO === 'quebrado' || !S.conf || S.conf.status === 'errada') return;
  S.fase = 'aplicando'; S.falhaAplicar = null; S.prog = {pct:0, feitos:0, total:S.conf.rom.tamanho, etapa:'ler'}; desenhaApl();
  Motor.aplicar(S.patch, S.conf, function(pct, feitos, total, etapa){
    S.prog = {pct:pct, feitos:feitos, total:total, etapa:etapa || 'aplicar'}; desenhaApl();
  }).then(function(s){ S.fase = 'pronto'; S.saida = s; desenhaApl(); fala(t('ui.sucesso', V())); focaPasso(4); },
          function(f){ S.fase = 'montar'; S.prog = null; S.falhaAplicar = f && f.codigo !== 'cancelado' ? f : null; desenhaApl(); });
}
function baixar(){
  var s = S.saida; if (!s) return;
  var url = URL.createObjectURL(s.blob || new Blob(['demo']));
  var a = document.createElement('a'); a.href = url; a.download = s.nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-lang],[data-caminho],[data-jogo],[data-idioma],[data-acao],[data-copiar],[data-abre],[data-demo],#burger');
  if (!el) return;
  if (el.id === 'burger') { var ab = document.body.classList.toggle('menu-aberto'); el.setAttribute('aria-expanded', ab); return; }
  if (el.dataset.lang) { LANG = el.dataset.lang; try { localStorage.setItem('pc-lang', LANG); } catch(_){} document.getElementById('langsw').open = false; desenhaTudo(); return; }
  if (el.dataset.demo) { if (MODO === 'demo' && typeof preset === 'function') preset(el.dataset.demo); return; }
  if (el.dataset.caminho) { S.caminho = el.dataset.caminho; S.jogo = null; S.falhaPatch = null; desenhaApl(); return; }
  if (el.dataset.jogo) { escolherJogo(el.dataset.jogo); return; }
  if (el.dataset.idioma) { S.idioma = el.dataset.idioma; S.patch = null; if (jogoPorSlug(S.jogo).nivel === 'release') buscarPatchDoSite(); else desenhaApl(); return; }
  if (el.dataset.abre) { ev.preventDefault(); var inp = document.getElementById('arq-' + el.dataset.abre); if (inp) inp.click(); return; }
  if (el.dataset.copiar) {
    var v = el.dataset.copiar;
    try { navigator.clipboard.writeText(v).catch(function(){}); } catch(_){}
    el.textContent = tp('ui.copiado'); setTimeout(function(){ el.textContent = tp('ui.botao_copiar'); }, 1400); return;
  }
  var a = el.dataset.acao;
  if (a === 'trocar-patch') { var jj = S.jogo && jogoPorSlug(S.jogo); S.patch = null; S.conf = null; S.falhaPatch = null; S.falhaAplicar = null; if (jj && jj.nivel === 'release') S.jogo = null; }
  else if (a === 'trocar-jogo') { S.jogo = null; S.patch = null; S.conf = null; S.falhaPatch = null; }
  else if (a === 'trocar-rom') { S.conf = null; S.hashColado = ''; S.falhaAplicar = null; desenhaApl(); focaPasso(2); return; }
  else if (a === 'aplicar') { if (S.conf && S.conf.status !== 'errada') aplicar(); return; }
  else if (a === 'cancelar') { if (Motor.cancelar) Motor.cancelar(); return; }
  else if (a === 'baixar') { baixar(); return; }
  else if (a === 'recarregar') { location.reload(); return; }
  else if (a === 'saiba') { document.getElementById('saiba').scrollIntoView({behavior:'smooth'}); return; }
  else if (a === 'recomecar') { zera(); desenhaApl(); focaPasso(1); return; }
  desenhaApl();
});
document.addEventListener('keydown', function(ev){
  var el = ev.target.closest && ev.target.closest('[data-abre]');
  if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); el.click(); }
  if (ev.key === 'Escape') { document.body.classList.remove('menu-aberto'); document.getElementById('langsw').open = false; }
});
document.addEventListener('input', function(ev){
  if (ev.target.id === 'busca') { S.busca = ev.target.value; desenhaApl(); }
  if (ev.target.id === 'colado') { S.hashColado = ev.target.value; desenhaApl(); }
});
document.addEventListener('change', function(ev){
  var k = ev.target.dataset && ev.target.dataset.arq; if (!k || !ev.target.files[0]) return;
  (k === 'rom' ? arquivoRom : arquivoPatch)(ev.target.files[0]);
});
['dragenter','dragover'].forEach(function(n){ document.addEventListener(n, function(ev){
  ev.preventDefault(); var z = ev.target.closest && ev.target.closest('[data-solta]');
  document.querySelectorAll('.solta.sobre').forEach(function(x){ if (x !== z) x.classList.remove('sobre'); });
  if (z) z.classList.add('sobre');
}); });
document.addEventListener('dragleave', function(ev){ var z = ev.target.closest && ev.target.closest('[data-solta]'); if (z && !z.contains(ev.relatedTarget)) z.classList.remove('sobre'); });
document.addEventListener('drop', function(ev){
  ev.preventDefault(); var z = ev.target.closest && ev.target.closest('[data-solta]');
  document.querySelectorAll('.solta.sobre').forEach(function(x){ x.classList.remove('sobre'); });
  var f = ev.dataTransfer && ev.dataTransfer.files[0]; if (!z || !f) return;
  (z.dataset.solta === 'rom' ? arquivoRom : arquivoPatch)(f);
});

/* (demonstração retirada do build do site) */
/* =====================================================================
   8. PARTIDA
   ===================================================================== */
var Q = new URLSearchParams(location.search);
var ESTADO_URL = Q.get('estado');
(function(){
  var n = ligarTexto();
  ligarMotor();
  /* gancho SÓ para o teste automático (app/teste_ui.mjs): ?teste=1 expõe o motor ligado */
  if (Q.get('teste') === '1') window.__PC_TESTE = { Motor: Motor, MODO: MODO, MOTIVO_DEMO: MOTIVO_DEMO, tp: tp };
  var salvo = null; try { salvo = localStorage.getItem('pc-lang'); } catch(_){}
  var nav = (navigator.language || '').toLowerCase();
  LANG = Q.get('lang') || salvo || (nav.indexOf('pt') === 0 ? 'pt' : nav.indexOf('es') === 0 ? 'es' : 'en');
  if (MODO === 'demo') document.body.classList.add('com-demo');         /* a faixa DEMONSTRAÇÃO só existe com ?demo=1 */
  document.body.setAttribute('data-modo', MODO);
  if (Q.get('so') === 'apl') document.body.classList.add('so-apl');   /* só para screenshot: esconde o texto de cima e de baixo */
  if (Q.get('tema')) document.documentElement.setAttribute('data-theme', Q.get('tema'));
  function pronto(){ if (ESTADO_URL && MODO === 'demo' && typeof preset === 'function') preset(ESTADO_URL); else desenhaTudo(); document.body.setAttribute('data-pronto', '1'); }
  Motor.catalogo().then(function(l){ CAT = l || []; pronto(); }, function(e){
    /* catálogo não veio: a API continua ligada (a aba de outro autor funciona) e a lista mostra
       ui.lista_vazia. Nunca vira demonstração (D1). */
    CAT = []; MOTIVO_DEMO = 'catálogo indisponível: ' + ((e && (e.mensagem || e.message)) || '');
    pronto();
  });
  desenhaTudo();
  if (Q.get('teste') === 'fumaca' && typeof testeFumaca === 'function') setTimeout(testeFumaca, 400);
  window.PCInterface = { estado:function(){ return S; }, modo:function(){ return MODO; }, textoCarregado:n,
    /* teste de fumaça: roda o fluxo inteiro com arquivos montados na hora */
    _arquivoPatch:arquivoPatch, _arquivoRom:arquivoRom, _aplicar:aplicar, _caminho:function(c){ S.caminho = c; desenhaApl(); } };
})();
})();
