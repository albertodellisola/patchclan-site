7 mensajes en 15.073 bytes</b>, repartidos en cuatro bloques — descripciones de objeto, frases habladas, nombres de inventario y nombres de escenario. La ROM de fábrica guarda <b>1.578 bytes libres</b> en toda su extensión, sin holgura al final de ningún banco y sin banco duplicado, y la razón del japonés al inglés, medida sobre una muestra de 27 mensajes, es de <b>1,424×</b> — lo que pone el inglés cerca de <b>21,5 KB</b>. Por eso el cartucho se rehízo, de <b>256 a 512 KB</b>. Con el mapper 2 el banco fijo es el <b>último</b>, y no el decimoquinto: el banco 31 nace copia del 15 y todo lo que se escribe ahí hay que escribirlo en los dos. Ahora al motor de texto lo sirve un banco que antes no existía, alcanzado por un <b>trampolín de 14 bytes</b> en el banco fijo — y la prueba es paridad: cambiar el banco del que lee el motor <b>no mueve un solo píxel</b> del cuadro.","La marca de origen está grabada en el propio cartucho, y es una fuente a medio hacer. La de diálogo no tiene ni una letra latina — guarda los <b>46 kana del gojūon</b>, los kana pequeños, el dakuten y el handakuten, las cifras y el marco de la ventana —, y la otra, la latina, <b>va de la A a la T</b>: de la U a la Z no hay nada. El cartucho <b>no sabe escribir katakana</b>, así que <i>cheese</i> se vuelve <code>ちーす゛</code>, la motosierra se vuelve <code>ちぇーんそー</code> y Dave se vuelve <code>て゛いふ゛</code>: el juego entero, nombres extranjeros incluidos, está escrito en el silabario que el niño japonés aprende primero. Ni el panel de comandos es texto — son <b>doce verbos en tres filas de trece casillas</b>, dibujados como <b>tilemap fijo</b>. Y dentro de aquellas 51 casillas el japonés paga un peaje que el inglés no paga, porque el dakuten y el handakuten son <b>caracteres propios</b> y ocupan una casilla cada uno: contado en el guion entero, <b>1.367 de los 12.832 caracteres son solo marca de sonoridad</b> — una casilla de cada diez. Ahora todo lo que el juego escribe está en inglés, y las cinco pantallas que llevaban japonés <b>dibujado</b> se han redibujado. Dos revisores leyeron el guion entero con el japonés al lado; el juego se recorrió por siete caminos — los <b>cuatro finales</b>, el GAME OVER y las contraseñas secretas —, cada uno desde el <i>encendido</i> hasta el final, y los <b>814 textos</b> se vieron en pantalla uno a uno."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"maniac-mansion-en.ips","tamanho":"70 KB"},"pt":null,"es":null},"rom":"Maniac Mansion (Japan).nes","rom_md5":"5835600abb0a8de98d905da545350160"},"fotos":[{"f":"maniac/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo da Lucasfilm no cartucho da Jaleco, com o subtítulo em letra latina.","en":"The Lucasfilm logo on the Jaleco cartridge, with the subtitle in Latin script.","es":"El logo de Lucasfilm en el cartucho de Jaleco, con el subtítulo en letra latina."}},{"f":"maniac/03-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"A tela de abertura da tradução, antes do título.","en":"The translation opening screen, before the title.","es":"La pantalla de apertura de la traducción, antes del título."}},{"f":"maniac/02-selecao.png","t":{"pt":"Escolha de personagem","en":"Character select","es":"Selección de personaje"},"c":{"pt":"A escolha dos garotos, com a biografia em inglês.","en":"The kid select, with the bio in English.","es":"La elección de los chicos, con la biografía en inglés."}},{"f":"maniac/04-jogo.png","t":{"pt":"No portão da mansão","en":"At the mansion gate","es":"En la puerta de la mansión"},"c":{"pt":"A fala e o painel de verbos em inglês.","en":"The line and the verb panel in English.","es":"La frase y el panel de verbos en inglés."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"feito","longplay":"feito"}},{"slug":"yu-yu-hakusho-gaiden","nome":"Yu Yu Hakusho Gaiden","subtitulo":"","jp":"幽☆遊☆白書 外伝","traducao_titulo":"Side Story","publisher":"Sega","dev":"Sega","ano":1994,"data":"28/01/1994","sistema":"Mega Drive","mapper":"2 MB expandidos para 4 MB · SRAM de 16 KB com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"destaque":true,"nivel":"release","versao":"English v1.0","capa":"yyhg/00-capa-patreon.jpg","linha":{"pt":"Nenhum ponteiro de texto existe em claro na ROM: eles moram dentro de scripts comprimidos.","en":"Not one text pointer exists in the open in this ROM: they live inside compressed scripts.","es":"Ningún puntero de texto existe a la vista en la ROM: viven dentro de scripts comprimidos."},"resumo":{"pt":["<i>Yu Yu Hakusho Gaiden</i> se passa dois dias antes do Torneio das Trevas: o Toguro aparece na frente do Yusuke, marca o encontro e vai embora. Daí cada um dos quatro — Yusuke, Kuwabara, Hiei e Kurama — anda pela cidade no seu próprio capítulo, esbarra em demônios que colhem uma emoção humana, e os quatro acabam no Mundo das Trevas. É aventura com menu de <b>Look</b>, <b>Talk</b> e <b>Move</b>, e a briga é de ação, com barra de energia do bicho no alto da tela.","Ele nunca saiu do Japão nem ganhou tradução: o único projeto conhecido, de 2012, parou no despejo do roteiro. O texto é o que prende. Cada fala são <b>códigos de 12 bits</b> empacotados três em quatro, e <b>nenhum ponteiro existe em claro na ROM</b> — eles moram dentro dos vinte scripts de evento, que o jogo descomprime para a RAM. Reponteirar exigiria recomprimir tudo.","A saída foi não tocar em script nenhum: no lugar da primeira palavra de cada fala japonesa entra um <b>desvio de quatro bytes</b> que manda o leitor para o texto novo, lá no fim de uma ROM que passou de 2 para <b>4 MB</b>. As <b>1.531 falas</b> saíram em inglês, com uma fonte de <b>duas letras por célula</b> — assim a caixa de diálogo, de 13 células, passou a caber <b>26 letras por linha</b> sem mexer no desenhador. A batalha também está em inglês: o nome do herói na caixa de status e os <b>36 nomes de inimigo</b> da barra de cima. O logo do título foi redesenhado com <b>GAIDEN</b>, e toda tela com japonês desenhado na imagem foi refeita. Dois revisores leram o roteiro inteiro com o japonês ao lado, e a build foi jogada até os <b>três finais</b>, cada um gravado do power-on."],"en":["<i>Yu Yu Hakusho Gaiden</i> takes place two days before the Dark Tournament: Toguro shows up in front of Yusuke, sets the date and leaves. Then each of the four — Yusuke, Kuwabara, Hiei and Kurama — walks the city in his own chapter, runs into demons harvesting a human emotion, and all four end up in the Demon World. It is an adventure game driven by <b>Look</b>, <b>Talk</b> and <b>Move</b>, and the fighting is action, with the creature's energy bar across the top of the screen.","It never left Japan and was never translated: the only known project, from 2012, stopped at the script dump. The text is what holds it. Every line is <b>12-bit codes</b> packed four to three words, and <b>not one pointer exists in the open in the ROM</b> — they live inside the twenty event scripts, which the game decompresses into RAM. Repointing would mean recompressing everything.","The way out was to touch no script at all: where the first word of each Japanese line used to be there is now a <b>four-byte detour</b> sending the reader to the new text, at the end of a ROM grown from 2 to <b>4 MB</b>. All <b>1,531 lines</b> came out in English, with a font of <b>two letters per cell</b> — so the 13-cell dialogue box now holds <b>26 letters per line</b> with the renderer untouched. Battle is in English too: the hero's name in the status box and the <b>36 enemy names</b> in the top bar. The title logo was redrawn to read <b>GAIDEN</b>, and every screen with Japanese drawn into the image was redone. Two reviewers read the whole script against the Japanese, and the build was played through all <b>three endings</b>, each one recorded from power-on."],"es":["<i>Yu Yu Hakusho Gaiden</i> ocurre dos días antes del Torneo Oscuro: Toguro aparece ante Yusuke, fija la cita y se va. Después cada uno de los cuatro — Yusuke, Kuwabara, Hiei y Kurama — recorre la ciudad en su propio capítulo, se topa con demonios que cosechan una emoción humana, y los cuatro acaban en el Mundo Demoníaco. Es aventura con menú de <b>Look</b>, <b>Talk</b> y <b>Move</b>, y la pelea es de acción, con la barra de energía del bicho arriba de la pantalla.","Nunca salió de Japón ni tuvo traducción: el único proyecto conocido, de 2012, se detuvo en el volcado del guion. Lo que traba es el texto. Cada frase son <b>códigos de 12 bits</b> empaquetados cuatro en tres, y <b>ningún puntero existe a la vista en la ROM</b> — viven dentro de los veinte scripts de evento, que el juego descomprime a la RAM. Repuntear exigiría recomprimirlo todo.","La salida fue no tocar ningún script: donde estaba la primera palabra de cada frase japonesa entra un <b>desvío de cuatro bytes</b> que manda el lector al texto nuevo, al final de una ROM que pasó de 2 a <b>4 MB</b>. Las <b>1.531 frases</b> salieron en inglés, con una fuente de <b>dos letras por celda</b> — así la caja de diálogo, de 13 celdas, pasó a admitir <b>26 letras por línea</b> sin tocar el dibujante. La batalla también está en inglés: el nombre del héroe en la caja de estado y los <b>36 nombres de enemigo</b> de la barra superior. El logo del título se redibujó con <b>GAIDEN</b>, y se rehízo toda pantalla con japonés dibujado en la imagen. Dos revisores leyeron el guion entero con el japonés al lado, y la build se jugó hasta los <b>tres finales</b>, cada uno grabado desde el encendido."]},"numeros":[{"v":"1.531","r":{"pt":"falas do roteiro em inglês","en":"lines of script in English","es":"frases del guion en inglés"}},{"v":"36","r":{"pt":"nomes de inimigo na barra de batalha","en":"enemy names in the battle bar","es":"nombres de enemigo en la barra de batalla"}},{"v":"4 bytes","r":{"pt":"o desvio que dispensou recomprimir os scripts","en":"the detour that spared recompressing the scripts","es":"el desvío que evitó recomprimir los scripts"}}],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"yu-yu-hakusho-gaiden-en.ips","tamanho":"232 KB"},"pt":null,"es":null},"rom":"Yu Yu Hakusho Gaiden (Japan).md","rom_md5":"a339561a0d46fee4c2569de0b237a02b"},"fotos":[{"f":"yyhg/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo novo, com GAIDEN, usa as cores que o jogo já carregava: ele entra no fade e escurece atrás do menu de opções, como o original.","en":"The new GAIDEN logo uses the colours the game already loaded: it joins the fade and dims behind the options menu, like the original.","es":"El logo nuevo, con GAIDEN, usa los colores que el juego ya cargaba: entra en el fundido y se oscurece tras el menú de opciones, como el original."}},{"f":"yyhg/02-dialogo.png","t":{"pt":"A primeira fala do jogo","en":"The first line of the game","es":"La primera frase del juego"},"c":{"pt":"A caixa tem 13 células por linha. Com duas letras por célula, cabem <b>26 letras</b> — e o desenhador do jogo não foi tocado.","en":"The box is 13 cells wide. With two letters per cell it holds <b>26 letters</b> — and the game's renderer was never touched.","es":"La caja tiene 13 celdas por línea. Con dos letras por celda caben <b>26 letras</b> — y el dibujante del juego no se tocó."}},{"f":"yyhg/03-batalha.png","t":{"pt":"Batalha","en":"Battle","es":"Batalla"},"c":{"pt":"O nome do bicho sai de uma fonte de 8×8 que já tinha o alfabeto; o do herói, de uma segunda fonte de 31 glifos, realocada com pares de letras.","en":"The creature's name comes from an 8×8 font that already had the alphabet; the hero's, from a second font of 31 glyphs, relocated with letter pairs.","es":"El nombre del bicho sale de una fuente de 8×8 que ya tenía el alfabeto; el del héroe, de una segunda fuente de 31 glifos, reubicada con pares de letras."}},{"f":"yyhg/04-opcoes.png","t":{"pt":"Opções","en":"Options","es":"Opciones"},"c":{"pt":"Os rótulos já eram ingleses no cartucho japonês. Só a velocidade da mensagem estava em katakana.","en":"The labels were already English on the Japanese cartridge. Only the message speed was in katakana.","es":"Las etiquetas ya eran inglesas en el cartucho japonés. Solo la velocidad del mensaje estaba en katakana."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"feito","longplay":"feito"}},{"slug":"gorilla-man","nome":"The Gorilla Man","subtitulo":"ゴリラーマン","jp":"ゴリラーマン","publisher":"Yonezawa / S’Pal","dev":"Party Room 21","ano":1992,"data":"1992","sistema":"Famicom","mapper":"MMC3 · 512 KB · CHR-RAM de 8 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"release","versao":"English v1.4","capa":"gorilla/00-capa-patreon.jpg","linha":{"pt":"O jogo de tabuleiro do mangá de Harold Sakuishi que nunca saiu do Japão — e que até hoje não tinha patch nenhum, em idioma nenhum.","en":"The board game from Harold Sakuishi’s manga that never left Japan — and until now had no patch at all, in any language.","es":"El juego de mesa del manga de Harold Sakuishi que nunca salió de Japón — y que hasta hoy no tenía ningún parche, en ningún idioma."},"resumo":{"pt":["<i>Gorilla-Man</i> é o mangá de <b>Harold Sakuishi</b> — o mesmo de <i>Beck</i> — sobre um calouro de colégio com cara de gorila e um metro e noventa de altura. O cartucho de 1992 transformou aquilo num <b>jogo de tabuleiro escolar</b>: três cenários, seis personagens, e o dia letivo dividido em casas de evento, minijogos e provas. Nunca saiu do Japão e nunca teve tradução — <b>nem parcial, nem em outro idioma</b>.","O texto do jogo não é um sistema só, são <b>quatro</b>: o motor de mensagens do tabuleiro, o do quiz, o das cartas e o dos minijogos, cada um com a sua tabela de ponteiros e o seu jeito de quebrar linha. Além deles há o que não é texto e sim <b>desenho</b>: os nomes dos personagens em kanji 16×16, os títulos de evento, o cartaz do gorila, o papel de parede do caça-níquel e o logotipo da tela de título. Esses não se traduzem escrevendo — se traduzem redesenhando tile por tile e remontando os metatiles da tela.","Tudo o que o jogo escreve está em inglês: menus, nomes, classificação, cartas, os briefings, o quiz, a briga, <b>todos os minijogos</b>, as telas do modo Party, os 52 títulos de evento, o logotipo do título e as ilustrações dos finais — a urna virou <b>VOTE</b>, o carimbo de expulsão virou <b>EXPELLED</b>. Dois cenários <b>congelavam no final por um bug do próprio cartucho japonês</b>: o jogo trocava de banco de memória e voltava sem religar o anterior. Esse bug foi <b>corrigido</b>. Dois revisores leram os <b>667 textos</b> com o japonês ao lado, e o jogo foi jogado até os <b>três finais</b>, cada um gravado desde o power-on. De quebra, o patch traz <b>SAVE em três espaços</b> e <b>CONTINUE</b> na tela de título. A coluna vertical <code>〇月×日</code> do quadro-negro fica em japonês de propósito: é enfeite de sala de aula."],"en":["<i>Gorilla-Man</i> is the manga by <b>Harold Sakuishi</b> — the author of <i>Beck</i> — about a high-school freshman with a gorilla’s face and a six-foot-three frame. The 1992 cartridge turned that into a <b>school board game</b>: three scenarios, six characters, and the school day split into event squares, minigames and tests. It never left Japan and never had a translation — <b>not even a partial one, in any language</b>.","The game’s text is not one system but <b>four</b>: the board message engine, the quiz engine, the card engine and the minigame engine, each with its own pointer table and its own way of breaking lines. Beyond those there is what is not text at all but <b>artwork</b>: the characters’ names as 16×16 kanji, the event titles, the gorilla poster, the slot machine wallpaper and the title screen logo. Those are not translated by typing — they are redrawn tile by tile and the screen’s metatiles rebuilt.","Everything the game writes is in English: menus, names, standings, cards, the briefings, the quiz, the fight, <b>every minigame</b>, the Party mode screens, the 52 event titles, the title logo and the ending illustrations — the ballot box now reads <b>VOTE</b>, the expulsion stamp <b>EXPELLED</b>. Two scenarios <b>froze at the finish because of a bug in the Japanese cartridge itself</b>: the game switched memory banks and returned without switching the old one back. That bug is <b>fixed</b>. Two reviewers read all <b>667 texts</b> against the Japanese, and the game was played through all <b>three endings</b>, each one recorded from power-on. As a bonus, the patch adds <b>SAVE in three slots</b> and <b>CONTINUE</b> on the title screen. The vertical column <code>〇月×日</code> on the blackboard stays Japanese on purpose: it is classroom decoration."],"es":["<i>Gorilla-Man</i> es el manga de <b>Harold Sakuishi</b> — el mismo de <i>Beck</i> — sobre un novato de instituto con cara de gorila y casi dos metros de altura. El cartucho de 1992 convirtió aquello en un <b>juego de mesa escolar</b>: tres escenarios, seis personajes, y la jornada lectiva dividida en casillas de evento, minijuegos y exámenes. Nunca salió de Japón y nunca tuvo traducción — <b>ni parcial, ni en ningún idioma</b>.","El texto del juego no es un sistema, son <b>cuatro</b>: el motor de mensajes del tablero, el del concurso, el de las cartas y el de los minijuegos, cada uno con su tabla de punteros y su forma de cortar línea. Además está lo que no es texto sino <b>dibujo</b>: los nombres de los personajes en kanji de 16×16, los títulos de evento, el cartel del gorila, el papel pintado de la tragaperras y el logotipo de la pantalla de título. Esos no se traducen escribiendo — se redibujan tile a tile y se rehacen los metatiles de la pantalla.","Todo lo que el juego escribe está en inglés: menús, nombres, clasificación, cartas, los briefings, el concurso, la pelea, <b>todos los minijuegos</b>, las pantallas del modo Party, los 52 títulos de evento, el logotipo del título y las ilustraciones de los finales — la urna ahora dice <b>VOTE</b>, el sello de expulsión <b>EXPELLED</b>. Dos escenarios <b>se congelaban al final por un fallo del propio cartucho japonés</b>: el juego cambiaba de banco de memoria y volvía sin restaurar el anterior. Ese fallo está <b>corregido</b>. Dos revisores leyeron los <b>667 textos</b> con el japonés al lado, y el juego se jugó hasta los <b>tres finales</b>, cada uno grabado desde el encendido. Además, el parche añade <b>SAVE en tres ranuras</b> y <b>CONTINUE</b> en la pantalla de título. La columna vertical <code>〇月×日</code> de la pizarra sigue en japonés a propósito: es decoración de aula."]},"numeros":[{"v":"52","r":{"pt":"títulos de evento redesenhados","en":"event titles redrawn","es":"títulos de evento redibujados"}},{"v":"4","r":{"pt":"motores de texto diferentes","en":"different text engines","es":"motores de texto diferentes"}},{"v":"512 KB","r":{"pt":"de ROM, no teto do mapper","en":"of ROM, at the mapper’s ceiling","es":"de ROM, en el techo del mapper"}},{"v":"0","r":{"pt":"patches anteriores, em idioma nenhum","en":"earlier patches, in any language","es":"parches anteriores, en ningún idioma"}}],"grupos":[{"titulo":{"pt":"O que este cartucho ensinou","en":"What this cartridge taught","es":"Lo que enseñó este cartucho"},"itens":[{"t":{"pt":"<b>Item de bloco de texto sem ponteiro é suspeito de não ser texto.</b> O build reempacotava o texto do tabuleiro por cima de uma <b>tabela de 23 ponteiros</b> que o extrator tinha engolido como se fossem três strings — eram as únicas três, entre 84, sem ponteiro algum apontando para elas. O dado era preservado, mas mudava de lugar: o jogo lia lixo como endereço e travava em laço infinito.","en":"<b>A text-block item with no pointer is suspect of not being text.</b> The build was repacking the board text over a <b>table of 23 pointers</b> that the extractor had swallowed as if they were three strings — the only three, out of 84, with no pointer aiming at them. The data was preserved but moved: the game read garbage as an address and hung in an infinite loop.","es":"<b>Un elemento de bloque de texto sin puntero es sospechoso de no ser texto.</b> El build reempaquetaba el texto del tablero encima de una <b>tabla de 23 punteros</b> que el extractor se había tragado como si fueran tres cadenas — las únicas tres, de 84, sin ningún puntero apuntándolas. El dato se conservaba pero cambiaba de sitio: el juego leía basura como dirección y se colgaba en un bucle infinito."},"foto":"gorilla/03-tabuleiro.png"},{"t":{"pt":"<b>Ponteiro só existe em tabela medida.</b> A busca cega por pares de bytes reescreveu <b>código</b>: um <code>JSR $8099</code> virou <code>ORA</code>, e era ali que o quiz travava. Também desviava um <code>BNE</code> e gravava \"ponteiro\" dentro do próprio texto novo. O conserto não foi pular a faixa que doeu — foi parar de procurar às cegas.","en":"<b>A pointer only exists inside a measured table.</b> Blind searching for byte pairs rewrote <b>code</b>: a <code>JSR $8099</code> became <code>ORA</code>, and that was where the quiz hung. It also redirected a <code>BNE</code> and wrote a \"pointer\" inside the new text itself. The fix was not to skip the range that hurt — it was to stop searching blind.","es":"<b>Un puntero solo existe dentro de una tabla medida.</b> La búsqueda ciega de pares de bytes reescribió <b>código</b>: un <code>JSR $8099</code> se convirtió en <code>ORA</code>, y ahí era donde se colgaba el concurso. También desviaba un <code>BNE</code> y escribía un \"puntero\" dentro del propio texto nuevo. El arreglo no fue saltarse el rango que dolía — fue dejar de buscar a ciegas."}},{"t":{"pt":"<b>Os mesmos oito tiles servem a dois lugares.</b> O nome do personagem aparece numa fileira de oito na barra de status e, <b>partido em quatro e quatro</b>, no balão sobre a peça do tabuleiro. Centralizar em pixel em vez de em tile fazia o balão cortar cada letra ao meio — e só nos nomes de comprimento ímpar, o que escondeu o defeito até um print do dono mostrar <code>ABE</code> virado em pedaços.","en":"<b>The same eight tiles serve two places.</b> A character’s name shows as a row of eight on the status bar and, <b>split four and four</b>, in the balloon above the board piece. Centring by pixel instead of by tile made the balloon cut every letter in half — and only for odd-length names, which hid the defect until a screenshot showed <code>ABE</code> in pieces.","es":"<b>Los mismos ocho tiles sirven a dos sitios.</b> El nombre del personaje aparece en una fila de ocho en la barra de estado y, <b>partido en cuatro y cuatro</b>, en el globo sobre la ficha del tablero. Centrar por píxel en vez de por tile hacía que el globo cortara cada letra por la mitad — y solo en los nombres de longitud impar, lo que escondió el defecto hasta que una captura mostró <code>ABE</code> hecho pedazos."},"foto":"gorilla/02-evento.png"}]},{"titulo":{"pt":"Como foi conferido","en":"How it was checked","es":"Cómo se comprobó"},"itens":[{"t":{"pt":"<b>Os três finais, do power-on.</b> O cenário 1 termina na expulsão do último colocado e na fala do professor; o 2, no encontro do vencedor; o 3, na eleição e no retrato do eleito. Os três foram alcançados na build publicada, e toda tela com texto que o jogo alcança foi vista pelo menos uma vez.","en":"<b>All three endings, from power-on.</b> Scenario 1 ends with the last-placed student expelled and the teacher’s line; scenario 2 with the winner’s date; scenario 3 with the election and the winner’s portrait. All three were reached on the released build, and every screen with text that the game can reach was seen at least once.","es":"<b>Los tres finales, desde el encendido.</b> El escenario 1 termina con la expulsión del último y la frase del profesor; el 2, con la cita del ganador; el 3, con la elección y el retrato del elegido. Los tres se alcanzaron en la build publicada, y toda pantalla con texto que el juego alcanza se vio al menos una vez."}},{"t":{"pt":"<b>O bug do cartucho foi achado jogando o japonês.</b> O congelamento no fim dos cenários 1 e 2 acontece igual na ROM original. Não era a tradução: o tratador de fim de partida troca de banco e retorna sem religar o banco de onde veio. O conserto é de poucos bytes e só age nesse retorno.","en":"<b>The cartridge bug was found by playing the Japanese.</b> The freeze at the end of scenarios 1 and 2 happens the same way on the original ROM. It was not the translation: the end-of-game handler switches banks and returns without switching back the bank it came from. The fix is a few bytes and only acts on that return.","es":"<b>El fallo del cartucho se encontró jugando el japonés.</b> El congelamiento al final de los escenarios 1 y 2 ocurre igual en la ROM original. No era la traducción: el manejador de fin de partida cambia de banco y vuelve sin restaurar el banco del que venía. El arreglo son pocos bytes y solo actúa en ese retorno."}}]}],"patch":{"versoes":{"en":{"arquivo":"gorilla-man-en.ips","tamanho":"118 KB"},"pt":null,"es":null},"rom":"Gorilla Man, The (Japan).nes","rom_md5":"2377df3f6909fa9fd858ab03791e8db9"},"fotos":[{"f":"gorilla/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logotipo redesenhado a partir da arte do dono do projeto.","en":"The logo redrawn from the project owner’s artwork.","es":"El logotipo redibujado a partir del arte del dueño del proyecto."}},{"f":"gorilla/02-evento.png","t":{"pt":"Casa de evento","en":"Event square","es":"Casilla de evento"},"c":{"pt":"Os 52 títulos de evento são desenho, não texto: foram redesenhados um a um.","en":"The 52 event titles are artwork, not text: each one was redrawn.","es":"Los 52 títulos de evento son dibujo, no texto: se redibujaron uno a uno."}},{"f":"gorilla/03-tabuleiro.png","t":{"pt":"O tabuleiro","en":"The board","es":"El tablero"},"c":{"pt":"Menu de comando, barra de status e o nome do personagem, todos em inglês.","en":"Command menu, status bar and the character’s name, all in English.","es":"Menú de comandos, barra de estado y el nombre del personaje, todo en inglés."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"feito","longplay":"feito"}},{"slug":"gorilla-man-bugfix","tipo":"hack","nome":"The Gorilla Man","subtitulo":"Bugfix","jp":"ゴリラーマン","publisher":"Yonezawa / S’Pal","dev":"Party Room 21","ano":1992,"data":"1992","sistema":"Famicom","mapper":"MMC3 · 512 KB · CHR-RAM de 8 KB","categoria":{"pt":"Correção de bugs","en":"Bug fix","es":"Corrección de errores"},"nivel":"release","versao":"Bugfix v1.0","capa":"gorilla/00-capa-patreon.jpg","linha":{"pt":"O cartucho japonês de 1992 sem os dois bugs que impediam de terminar a partida. O jogo continua todo em japonês.","en":"The 1992 Japanese cartridge minus the two bugs that kept a game from reaching its end. Everything stays in Japanese.","es":"El cartucho japonés de 1992 sin los dos fallos que impedían terminar la partida. Todo sigue en japonés."},"resumo":{"pt":["Este patch é para quem quer jogar <i>The Gorilla Man</i> <b>em japonês, como saiu em 1992</b>, e chegar ao fim. Ele não traduz nada e não acrescenta nada: sem save, sem tela nova, sem texto trocado. Muda só o que impedia o cartucho de ser terminado. São <b>34 bytes</b>, em seis pontos da ROM.","<b>1. Dois dos três cenários congelavam no final.</b> Em 「退学なんていやだ！」 e 「謎の美少女」, depois da ilustração do final, o jogo travava ao apertar A. Nenhum emulador contornava: ignorar a instrução inválida só dava tela preta. Só 「めざせ！白武高校革命」 chegava ao fim. A causa: para escrever a última fala, a rotina de fim de partida troca de banco de memória e volta <b>sem religar o banco de onde veio</b>. O retorno cai no meio de outro código e a CPU acaba num byte que não é instrução. Com o patch, a rotina religa o banco antes de voltar, e os três cenários terminam e voltam à tela de título.","<b>2. Um jogador com HP 0 encerrava a partida de todos.</b> Bastava um personagem zerar a vida, num evento ou num minijogo, para a partida acabar para os seis, com uma tela de GAME OVER que não sai nem com A nem com START, só com reset. O cartucho desenha essa tela com capricho, então pode ter sido de propósito. Mas ela tira o jogo de quem estava vivo, e o relato de quem jogou é de bug. Com o patch, a vida continua podendo chegar a zero e todo o resto das regras fica igual. Só não se liga mais a flag que encerrava a partida (quatro pontos: o tabuleiro e as três cópias do motor de minijogo).","Quer o jogo em inglês? A <a href=\"#/jogo/gorilla-man\">tradução do Patch Clan</a> já traz estes dois consertos. Não aplique os dois patches juntos: cada um vai sobre a ROM japonesa original."],"en":["This patch is for anyone who wants to play <i>The Gorilla Man</i> <b>in Japanese, as it shipped in 1992</b>, and actually reach the end. It translates nothing and adds nothing: no save, no new screen, no text changed. It only changes what kept the cartridge from being finished. That is <b>34 bytes</b>, in six places in the ROM.","<b>1. Two of the three scenarios froze at the ending.</b> In 「退学なんていやだ！」 and 「謎の美少女」, after the ending illustration, the game locked up when you pressed A. Emulators could not get around it either: skipping the invalid instruction only gave a black screen. Only 「めざせ！白武高校革命」 made it to the end. The cause: to print the last line, the end-of-game routine switches memory banks and returns <b>without switching back the bank it came from</b>. The return lands in the middle of other code and the CPU ends up on a byte that is not an instruction. With the patch, the routine restores the bank before returning, and all three scenarios end and go back to the title screen.","<b>2. One player at 0 HP ended the game for everyone.</b> A single character running out of HP, in an event or a minigame, was enough to end the match for all six, with a GAME OVER screen that A and START cannot leave, only reset. The cartridge draws that screen with care, so it may have been intentional. But it throws out the players who were still standing, and people who played it report it as a bug. With the patch, HP can still reach zero and every other rule stays the same. The flag that ended the match is simply never set (in four places: the board and the three copies of the minigame engine).","Want the game in English? The <a href=\"#/jogo/gorilla-man\">Patch Clan translation</a> already includes both fixes. Do not stack the two patches: each one goes on the original Japanese ROM."],"es":["Este parche es para quien quiere jugar <i>The Gorilla Man</i> <b>en japonés, tal como salió en 1992</b>, y llegar al final. No traduce nada ni añade nada: sin guardado, sin pantalla nueva, sin texto cambiado. Solo cambia lo que impedía terminar el cartucho. Son <b>34 bytes</b>, en seis puntos de la ROM.","<b>1. Dos de los tres escenarios se congelaban en el final.</b> En 「退学なんていやだ！」 y 「謎の美少女」, después de la ilustración del final, el juego se colgaba al pulsar A. Los emuladores tampoco lo salvaban: ignorar la instrucción inválida solo daba pantalla negra. Solo 「めざせ！白武高校革命」 llegaba al final. La causa: para escribir la última frase, la rutina de fin de partida cambia de banco de memoria y vuelve <b>sin restaurar el banco del que venía</b>. El retorno cae en medio de otro código y la CPU acaba en un byte que no es instrucción. Con el parche, la rutina restaura el banco antes de volver, y los tres escenarios terminan y regresan a la pantalla de título.","<b>2. Un jugador con 0 de vida acababa la partida de todos.</b> Bastaba con que un personaje se quedara sin vida, en un evento o en un minijuego, para que la partida terminara para los seis, con una pantalla de GAME OVER de la que no se sale ni con A ni con START, solo con reset. El cartucho dibuja esa pantalla con cuidado, así que pudo ser intencionado. Pero deja fuera a quien seguía en pie, y quien lo jugó lo describe como fallo. Con el parche, la vida puede seguir llegando a cero y todas las demás reglas se mantienen. Solo deja de activarse la bandera que terminaba la partida (en cuatro puntos: el tablero y las tres copias del motor de minijuegos).","¿Quieres el juego en inglés? La <a href=\"#/jogo/gorilla-man\">traducción de Patch Clan</a> ya trae estos dos arreglos. No apliques los dos parches juntos: cada uno va sobre la ROM japonesa original."]},"numeros":[{"v":"2","r":{"pt":"bugs de fábrica corrigidos","en":"factory bugs fixed","es":"fallos de fábrica corregidos"}},{"v":"34","r":{"pt":"bytes mudados, e só eles","en":"bytes changed, and only those","es":"bytes cambiados, y solo esos"}},{"v":"3/3","r":{"pt":"finais alcançáveis (eram 1 de 3)","en":"endings reachable (it was 1 of 3)","es":"finales alcanzables (era 1 de 3)"}},{"v":"0","r":{"pt":"textos traduzidos: o jogo é o japonês","en":"texts translated: the game stays Japanese","es":"textos traducidos: el juego sigue en japonés"}}],"grupos":[{"titulo":{"pt":"O que foi corrigido, em detalhe","en":"What was fixed, in detail","es":"Qué se corrigió, en detalle"},"itens":[{"t":{"pt":"<b>Final dos cenários 1 e 2.</b> O fim de partida entra pelo banco 60 e salta para o tratador em <code>$D71D</code>. Para imprimir a fala, ele liga os bancos 20/21 (<code>LDA #$0A / JSR $C252</code>) e termina em <code>$D7F1</code> com <code>LDA #$00 / STA $62 / RTS</code>, sem devolver o par 60/61. O <code>RTS</code> cai em <code>$806C</code> do banco 20, no meio de uma instrução, a pilha fica desalinhada e o jogo termina num <code>JAM</code> em <code>$BA08</code>. O cenário 3 escapa porque carrega outra cena antes desse retorno. <b>Conserto:</b> <code>$D7F1</code> vira <code>JMP $FFA4</code>, num trecho vazio do banco fixo, que faz o mesmo <code>LDA/STA</code> e religa o par 60/61 por <code>$C252</code> antes do <code>RTS</code> (com <code>PHP/PLP</code> para devolver os flags como no original).","en":"<b>Ending of scenarios 1 and 2.</b> The end of the match comes in through bank 60 and jumps to the handler at <code>$D71D</code>. To print the line, it maps banks 20/21 (<code>LDA #$0A / JSR $C252</code>) and ends at <code>$D7F1</code> with <code>LDA #$00 / STA $62 / RTS</code>, without restoring the 60/61 pair. The <code>RTS</code> lands at <code>$806C</code> in bank 20, in the middle of an instruction, the stack goes out of step and the game ends on a <code>JAM</code> at <code>$BA08</code>. Scenario 3 escapes because it loads another scene before that return. <b>Fix:</b> <code>$D7F1</code> becomes <code>JMP $FFA4</code>, in an empty stretch of the fixed bank, which does the same <code>LDA/STA</code> and maps the 60/61 pair back through <code>$C252</code> before the <code>RTS</code> (with <code>PHP/PLP</code> so the flags come back as in the original).","es":"<b>Final de los escenarios 1 y 2.</b> El fin de partida entra por el banco 60 y salta al manejador en <code>$D71D</code>. Para escribir la frase, activa los bancos 20/21 (<code>LDA #$0A / JSR $C252</code>) y termina en <code>$D7F1</code> con <code>LDA #$00 / STA $62 / RTS</code>, sin devolver el par 60/61. El <code>RTS</code> cae en <code>$806C</code> del banco 20, en medio de una instrucción, la pila se desalinea y el juego acaba en un <code>JAM</code> en <code>$BA08</code>. El escenario 3 se salva porque carga otra escena antes de ese retorno. <b>Arreglo:</b> <code>$D7F1</code> pasa a ser <code>JMP $FFA4</code>, en un tramo vacío del banco fijo, que hace el mismo <code>LDA/STA</code> y vuelve a activar el par 60/61 por <code>$C252</code> antes del <code>RTS</code> (con <code>PHP/PLP</code> para devolver los flags como en el original)."}},{"t":{"pt":"<b>HP 0.</b> A conta que tira vida (<code>$EBCA</code> no banco fixo e as cópias do motor de minijogo nos bancos 23, 51 e 57) faz <code>SBC</code> e, se der zero, <code>LDA #$01 / STA $04A8</code>. Quem lê <code>$04A8</code> salta para a cena <code>$1B</code> do jogador zerado, e daí para o fim da partida. <b>Conserto:</b> esses 5 bytes viram <code>NOP</code> nos quatro lugares. A vida ainda vai a 0. Nada mais na ROM escreve em <code>$04A8</code> (varredura de <code>STA/INC/STX/STY</code>), e quem lê a flag só testa se é diferente de zero.","en":"<b>HP 0.</b> The HP subtraction (<code>$EBCA</code> in the fixed bank and the minigame engine copies in banks 23, 51 and 57) does <code>SBC</code> and, on zero, <code>LDA #$01 / STA $04A8</code>. Whatever reads <code>$04A8</code> jumps to scene <code>$1B</code> for the fallen player, and from there to the end of the match. <b>Fix:</b> those 5 bytes become <code>NOP</code> in all four places. HP still reaches 0. Nothing else in the ROM writes <code>$04A8</code> (a sweep for <code>STA/INC/STX/STY</code>), and every reader only tests it for non-zero.","es":"<b>HP 0.</b> La resta de vida (<code>$EBCA</code> en el banco fijo y las copias del motor de minijuegos en los bancos 23, 51 y 57) hace <code>SBC</code> y, si da cero, <code>LDA #$01 / STA $04A8</code>. Quien lee <code>$04A8</code> salta a la escena <code>$1B</code> del jugador caído, y de ahí al fin de la partida. <b>Arreglo:</b> esos 5 bytes pasan a <code>NOP</code> en los cuatro sitios. La vida sigue llegando a 0. Nada más en la ROM escribe en <code>$04A8</code> (barrido de <code>STA/INC/STX/STY</code>), y quien lee la bandera solo comprueba si es distinta de cero."}}]},{"titulo":{"pt":"Como foi conferido","en":"How it was checked","es":"Cómo se comprobó"},"itens":[{"t":{"pt":"<b>Os dois bugs foram reproduzidos na ROM japonesa original</b>: os cenários 1 e 2 travaram em <code>$BA08</code> logo depois da ilustração do final, e com vida 1 nos seis personagens o primeiro a zerar levou todos ao GAME OVER.","en":"<b>Both bugs were reproduced on the original Japanese ROM</b>: scenarios 1 and 2 locked up at <code>$BA08</code> right after the ending illustration, and with 1 HP on all six characters the first to fall took everyone to GAME OVER.","es":"<b>Los dos fallos se reprodujeron en la ROM japonesa original</b>: los escenarios 1 y 2 se colgaron en <code>$BA08</code> justo después de la ilustración del final, y con 1 de vida en los seis personajes el primero en caer llevó a todos al GAME OVER."}},{"t":{"pt":"<b>Os consertos são os da tradução, byte a byte.</b> Os mesmos dois consertos estão na tradução inglesa do Patch Clan, que foi jogada até os três finais desde o power-on, com a vida zerada em todos os personagens numa partida inteira sem fim precoce. Este patch aplica só eles sobre a ROM japonesa: fora esses 34 bytes, a ROM é idêntica à original, e o IPS aplicado reproduz a ROM consertada byte a byte.","en":"<b>The fixes are the translation’s, byte for byte.</b> The same two fixes are in the Patch Clan English translation, which was played to all three endings from power-on, including a full match with every character at 0 HP and no early end. This patch applies only them on the Japanese ROM: apart from those 34 bytes the ROM is identical to the original, and the IPS reproduces the fixed ROM byte for byte.","es":"<b>Los arreglos son los de la traducción, byte a byte.</b> Los mismos dos arreglos están en la traducción inglesa de Patch Clan, que se jugó hasta los tres finales desde el encendido, incluida una partida entera con la vida a cero en todos los personajes y sin final anticipado. Este parche aplica solo esos arreglos sobre la ROM japonesa: fuera de esos 34 bytes, la ROM es idéntica a la original, y el IPS reproduce la ROM corregida byte a byte."}}]}],"patch":{"versoes":{"jp":{"arquivo":"gorilla-man-bugfix.ips","tamanho":"73 B"}},"rom":"Gorilla Man, The (Japan).nes","rom_md5":"2377df3f6909fa9fd858ab03791e8db9","nota":{"pt":"ROM com cabeçalho iNES, 524.304 bytes · CRC32 218EAA50 (sem cabeçalho: CRC32 9FD718FD, SHA-1 d477320dc99b294b5d26995f1527eca0233f2f46). Depois do patch: MD5 a56c1a3e679aa61b143e1ccebdfab6aa. Serve em Flips, Lunar IPS ou ROM Patcher JS.","en":"Headered iNES ROM, 524,304 bytes · CRC32 218EAA50 (headerless: CRC32 9FD718FD, SHA-1 d477320dc99b294b5d26995f1527eca0233f2f46). After patching: MD5 a56c1a3e679aa61b143e1ccebdfab6aa. Works with Flips, Lunar IPS or ROM Patcher JS.","es":"ROM con cabecera iNES, 524.304 bytes · CRC32 218EAA50 (sin cabecera: CRC32 9FD718FD, SHA-1 d477320dc99b294b5d26995f1527eca0233f2f46). Tras el parche: MD5 a56c1a3e679aa61b143e1ccebdfab6aa. Sirve con Flips, Lunar IPS o ROM Patcher JS."}},"fotos":[{"f":"gorilla-fix/01-final-cenario1.png","t":{"pt":"Final do cenário 1","en":"Scenario 1 ending","es":"Final del escenario 1"},"c":{"pt":"Onde o cartucho congelava. Com o patch, o jogo segue até a tela de título.","en":"Where the cartridge froze. With the patch, the game carries on to the title screen.","es":"Donde el cartucho se congelaba. Con el parche, el juego sigue hasta la pantalla de título."}},{"f":"gorilla-fix/02-final-cenario2.png","t":{"pt":"Final do cenário 2","en":"Scenario 2 ending","es":"Final del escenario 2"},"c":{"pt":"O segundo final que travava. Também chega à tela de título.","en":"The second ending that froze. It also reaches the title screen.","es":"El segundo final que se colgaba. También llega a la pantalla de título."}},{"f":"gorilla-fix/03-final-cenario3.png","t":{"pt":"Final do cenário 3","en":"Scenario 3 ending","es":"Final del escenario 3"},"c":{"pt":"A eleição: o único final que o cartucho original deixava ver.","en":"The election: the only ending the original cartridge let you see.","es":"La elección: el único final que dejaba ver el cartucho original."}}],"etapas":{"direcao":"feito","testes":"feito"}},{"slug":"maniac-mansion-bugfix","tipo":"hack","nome":"Maniac Mansion","subtitulo":"Bugfix","jp":"マニアックマンション","publisher":"Jaleco","dev":"Lucasfilm Ltd.","ano":1988,"data":"1988","sistema":"Famicom","mapper":"Mapper 2 (UOROM) · 256 KB PRG, sem expandir · CHR-RAM","categoria":{"pt":"Correção de bugs","en":"Bug fix","es":"Corrección de errores"},"nivel":"release","versao":"Bugfix v1.0","capa":"maniac/00-capa-patreon.jpg","linha":{"pt":"O cartucho japonês de 1988 sem três defeitos de fábrica: o objeto que sumia na mão de quem não devia, o あ vermelho na tela de senha e os três meninos mortos sem GAME OVER. O jogo continua todo em japonês.","en":"The 1988 Japanese cartridge minus three factory defects: items vanishing into the wrong hands, the red あ on the password screen, and three dead kids with no GAME OVER. Everything stays in Japanese.","es":"El cartucho japonés de 1988 sin tres defectos de fábrica: el objeto que desaparecía en manos de quien no debía, la あ roja en la pantalla de contraseña y los tres chicos muertos sin GAME OVER. Todo sigue en japonés."},"resumo":{"pt":["Este patch é para quem quer jogar <i>Maniac Mansion</i> <b>em japonês, como a Jaleco lançou em 1988</b>, sem três defeitos do cartucho. Ele não traduz nada e não acrescenta nada: nenhum texto trocado, nenhuma tela nova. São <b>134 bytes</b>, e fora deles a ROM é idêntica à original.","<b>1. わたす dava qualquer objeto a qualquer personagem, e o objeto não voltava.</b> Entregar a chave amarela à Edna, ou o pacote ao tentáculo roxo, funcionava: o objeto passava para o personagem e saía do jogo, sem jeito de pegar de volta. Com a chave amarela ia junto o final do carro-foguete. Só o tentáculo verde e a planta recusavam alguma coisa. Com o patch, cada personagem aceita só o que o próprio jogo sabe tratar: comida, suco, fruta de cera, fita e contrato para o tentáculo verde; comida para a planta; o pacote, a foto e o hamster para o Ed; o distintivo para o tentáculo roxo. O resto é recusado e o objeto fica com o menino. Entre os meninos, tudo continua passando de mão em mão.","<b>2. Um あ vermelho no canto da tela de senha.</b> Nas duas telas de senha, a que abre do título e a que abre com SELECT no meio do jogo, aparece um あ vermelho no canto de cima, à esquerda. A rotina que monta a tela zera a memória dos sprites, e um sprite zerado é o caractere あ, na paleta vermelha, na posição 0,0: são os 64 sprites empilhados ali. A borda de uma TV de tubo costuma escondê-lo; em emulador e em TV moderna ele aparece. Com o patch, depois da mesma limpeza os 64 sprites vão para baixo da área visível.","<b>3. Com os três meninos mortos, o jogo não acabava.</b> A terceira morte deixava a tela com três lápides e nenhuma ação possível. Não vinha GAME OVER, e só o reset tirava dali. O detonado japonês registra isso: 「ゲームオーバーにもならないのでリセットするしかない」. A tela de GAME OVER existe no cartucho, mas só é chamada quando a casa explode. Com o patch, a terceira morte leva a essa mesma tela, com RETRY e PASSWORD, sem a animação da explosão, porque a casa não explodiu.","Quer o jogo em inglês? A <a href=\"#/jogo/maniac-mansion\">tradução do Patch Clan</a> já traz estes três consertos desde a v1.0.1. Não aplique os dois patches juntos: cada um vai sobre a ROM japonesa original."],"en":["This patch is for anyone who wants to play <i>Maniac Mansion</i> <b>in Japanese, as Jaleco released it in 1988</b>, without three defects of the cartridge. It translates nothing and adds nothing: no text changed, no new screen. That is <b>134 bytes</b>, and apart from them the ROM is identical to the original.","<b>1. わたす (give) handed any item to any character, and the item never came back.</b> Giving the yellow key to Edna, or the package to the purple tentacle, simply worked: the item went to that character and left the game, with no way to take it back. The yellow key took the rocket car ending with it. Only the green tentacle and the plant ever refused anything. With the patch, each character accepts only what the game itself knows how to handle: food, juice, the wax fruit, the tape and the contract for the green tentacle; food for the plant; the package, the photo and the hamster for Ed; the badge for the purple tentacle. Anything else is refused and stays with the kid. Between the kids, everything still passes from hand to hand.","<b>2. A red あ in the corner of the password screen.</b> On both password screens, the one opened from the title and the one opened with SELECT during play, a red あ shows up in the top left corner. The routine that builds the screen zeroes sprite memory, and a zeroed sprite is the character あ, in the red palette, at position 0,0: all 64 sprites stacked on that spot. A CRT’s border usually hides it; on emulators and modern TVs it shows. With the patch, after the same clearing the 64 sprites are moved below the visible area.","<b>3. With all three kids dead, the game never ended.</b> The third death left three gravestones on screen and nothing you could do. No GAME OVER came, and only reset got you out. The Japanese walkthrough notes it: 「ゲームオーバーにもならないのでリセットするしかない」. The GAME OVER screen is in the cartridge, but only the house exploding calls it. With the patch, the third death leads to that same screen, with RETRY and PASSWORD, minus the explosion animation, since the house did not blow up.","Want the game in English? The <a href=\"#/jogo/maniac-mansion\">Patch Clan translation</a> has included all three fixes since v1.0.1. Do not stack the two patches: each one goes on the original Japanese ROM."],"es":["Este parche es para quien quiere jugar <i>Maniac Mansion</i> <b>en japonés, tal como lo lanzó Jaleco en 1988</b>, sin tres defectos del cartucho. No traduce nada ni añade nada: ningún texto cambiado, ninguna pantalla nueva. Son <b>134 bytes</b>, y fuera de ellos la ROM es idéntica a la original.","<b>1. わたす (dar) entregaba cualquier objeto a cualquier personaje, y el objeto no volvía.</b> Darle la llave amarilla a Edna, o el paquete al tentáculo morado, funcionaba: el objeto pasaba al personaje y salía del juego, sin forma de recuperarlo. Con la llave amarilla se iba también el final del coche cohete. Solo el tentáculo verde y la planta rechazaban algo. Con el parche, cada personaje acepta solo lo que el propio juego sabe tratar: comida, zumo, la fruta de cera, la cinta y el contrato para el tentáculo verde; comida para la planta; el paquete, la foto y el hámster para Ed; la placa para el tentáculo morado. Lo demás se rechaza y el objeto se queda con el chico. Entre los chicos, todo sigue pasando de mano en mano.","<b>2. Una あ roja en la esquina de la pantalla de contraseña.</b> En las dos pantallas de contraseña, la que se abre desde el título y la que se abre con SELECT en medio del juego, aparece una あ roja en la esquina superior izquierda. La rutina que monta la pantalla pone a cero la memoria de sprites, y un sprite a cero es el carácter あ, en la paleta roja, en la posición 0,0: son los 64 sprites apilados ahí. El borde de un televisor de tubo suele ocultarla; en emulador y en televisores modernos se ve. Con el parche, tras la misma limpieza los 64 sprites pasan por debajo del área visible.","<b>3. Con los tres chicos muertos, el juego no terminaba.</b> La tercera muerte dejaba en pantalla tres lápidas y ninguna acción posible. No llegaba el GAME OVER, y solo el reset sacaba de ahí. La guía japonesa lo recoge: 「ゲームオーバーにもならないのでリセットするしかない」. La pantalla de GAME OVER está en el cartucho, pero solo la llama la explosión de la casa. Con el parche, la tercera muerte lleva a esa misma pantalla, con RETRY y PASSWORD, sin la animación de la explosión, porque la casa no explotó.","¿Quieres el juego en inglés? La <a href=\"#/jogo/maniac-mansion\">traducción de Patch Clan</a> trae estos tres arreglos desde la v1.0.1. No apliques los dos parches juntos: cada uno va sobre la ROM japonesa original."]},"numeros":[{"v":"3","r":{"pt":"bugs de fábrica corrigidos","en":"factory bugs fixed","es":"fallos de fábrica corregidos"}},{"v":"134","r":{"pt":"bytes mudados, e só eles","en":"bytes changed, and only those","es":"bytes cambiados, y solo esos"}},{"v":"7/7","r":{"pt":"caminhos jogados do início ao fim","en":"routes played start to finish","es":"caminos jugados de principio a fin"}},{"v":"0","r":{"pt":"textos traduzidos: o jogo é o japonês","en":"texts translated: the game stays Japanese","es":"textos traducidos: el juego sigue en japonés"}}],"grupos":[{"titulo":{"pt":"O que foi corrigido, em detalhe","en":"What was fixed, in detail","es":"Qué se corrigió, en detalle"},"itens":[{"t":{"pt":"<b>わたす.</b> Toda entrega termina na mesma rotina do banco 11 (<code>$A0ED</code>), chamada do banco fixo em <code>$EE61</code>, que só troca o dono do objeto (<code>$06B0</code> + objeto) sem olhar quem recebe. Os objetos com tratamento próprio chamam essa rotina antes de conferir o destinatário, e por isso o filtro do tentáculo verde só valia no caso genérico. <b>Conserto:</b> o <code>JSR $A0ED</code> de <code>$EE61</code> passa por um filtro de 37 bytes no fim do banco 11 (<code>$BFAE</code>, sobra entre o fim do código e a tabela de bancos). De menino para menino passa sempre; personagem do jogo só recebe os 9 pares da tabela em <code>$F880</code> do banco fixo, que são exatamente os casos que o código do jogo trata. Par aceito segue para a mesma <code>$A0ED</code> do cartucho; par recusado volta sem mexer no dono.","en":"<b>わたす.</b> Every hand-over ends in the same bank 11 routine (<code>$A0ED</code>), called from the fixed bank at <code>$EE61</code>, which just rewrites the item’s owner (<code>$06B0</code> + item) without looking at who receives it. Items with their own handling call that routine before checking the recipient, which is why the green tentacle’s filter only applied in the generic case. <b>Fix:</b> the <code>JSR $A0ED</code> at <code>$EE61</code> goes through a 37-byte filter at the end of bank 11 (<code>$BFAE</code>, spare space between the end of the code and the bank table). Kid to kid always passes; a game character only receives the 9 pairs in the table at <code>$F880</code> in the fixed bank, which are exactly the cases the game’s code handles. An accepted pair goes on to the cartridge’s own <code>$A0ED</code>; a refused one returns without touching the owner.","es":"<b>わたす.</b> Toda entrega acaba en la misma rutina del banco 11 (<code>$A0ED</code>), llamada desde el banco fijo en <code>$EE61</code>, que solo cambia el dueño del objeto (<code>$06B0</code> + objeto) sin mirar quién lo recibe. Los objetos con tratamiento propio llaman a esa rutina antes de comprobar el destinatario, y por eso el filtro del tentáculo verde solo valía en el caso genérico. <b>Arreglo:</b> el <code>JSR $A0ED</code> de <code>$EE61</code> pasa por un filtro de 37 bytes al final del banco 11 (<code>$BFAE</code>, hueco entre el final del código y la tabla de bancos). De chico a chico pasa siempre; un personaje del juego solo recibe los 9 pares de la tabla en <code>$F880</code> del banco fijo, que son justo los casos que trata el código del juego. El par aceptado sigue hacia la misma <code>$A0ED</code> del cartucho; el rechazado vuelve sin tocar el dueño."}},{"t":{"pt":"<b>Tela de senha.</b> As duas telas de senha do banco 7 limpam a página <code>$0200</code> com <code>LDA #0 / JSR $F1D8</code>, e essa é a página que vai para o OAM por DMA (<code>$4014</code>). Com Y, X, tile e atributo em zero, os 64 sprites viram um あ vermelho em 0,0. <b>Conserto:</b> os dois <code>JSR $F1D8</code> (em <code>$8033</code> e <code>$A035</code>) chamam 17 bytes em <code>$BFC0</code> do banco 7, que fazem a mesma limpeza e depois gravam Y = <code>$F0</code> em cada sprite. Ao fechar a tela com SELECT, o jogo volta com o OAM igual ao do original.","en":"<b>Password screen.</b> Both password screens in bank 7 clear page <code>$0200</code> with <code>LDA #0 / JSR $F1D8</code>, and that is the page sent to OAM by DMA (<code>$4014</code>). With Y, X, tile and attribute at zero, the 64 sprites become a red あ at 0,0. <b>Fix:</b> the two <code>JSR $F1D8</code> (at <code>$8033</code> and <code>$A035</code>) call 17 bytes at <code>$BFC0</code> in bank 7, which do the same clearing and then write Y = <code>$F0</code> to every sprite. Closing the screen with SELECT returns to the game with the same OAM as the original.","es":"<b>Pantalla de contraseña.</b> Las dos pantallas de contraseña del banco 7 limpian la página <code>$0200</code> con <code>LDA #0 / JSR $F1D8</code>, y esa es la página que va al OAM por DMA (<code>$4014</code>). Con Y, X, tile y atributo a cero, los 64 sprites se vuelven una あ roja en 0,0. <b>Arreglo:</b> los dos <code>JSR $F1D8</code> (en <code>$8033</code> y <code>$A035</code>) llaman a 17 bytes en <code>$BFC0</code> del banco 7, que hacen la misma limpieza y después escriben Y = <code>$F0</code> en cada sprite. Al cerrar la pantalla con SELECT, el juego vuelve con el mismo OAM que el original."}},{"t":{"pt":"<b>Três mortos.</b> A morte grava <code>$80</code> no estado do menino (<code>$BF</code>, <code>$CF</code>, <code>$DF</code>), mas nada testa os três juntos: o GAME OVER (<code>$EABB</code>, que chama <code>$DCD3</code>) só é chamado pelos cronômetros da explosão e pelo raio. <b>Conserto:</b> o laço principal chama <code>$C78F</code> a cada volta, em <code>$C27C</code>; essa chamada passa por 14 bytes em <code>$C000</code> (sobra no início do banco fixo) que, com o bit 7 ligado nos três, saltam para o mesmo <code>$EABB</code>. Dentro do <code>$DCD3</code>, a carga e a animação do cogumelo (<code>$DD09</code>, <code>$DD12</code>) passam por 27 bytes em <code>$BFC0</code> do banco 9, que as pulam só nesse caso. A explosão da casa continua igual.","en":"<b>Three dead.</b> A death writes <code>$80</code> to the kid’s state (<code>$BF</code>, <code>$CF</code>, <code>$DF</code>), but nothing tests all three together: GAME OVER (<code>$EABB</code>, which calls <code>$DCD3</code>) is only called by the explosion timers and the ray. <b>Fix:</b> the main loop calls <code>$C78F</code> on every pass, at <code>$C27C</code>; that call now goes through 14 bytes at <code>$C000</code> (spare space at the start of the fixed bank) which, with bit 7 set on all three, jump to the same <code>$EABB</code>. Inside <code>$DCD3</code>, loading and animating the mushroom cloud (<code>$DD09</code>, <code>$DD12</code>) go through 27 bytes at <code>$BFC0</code> in bank 9, which skip them in that case only. The house explosion is unchanged.","es":"<b>Tres muertos.</b> La muerte escribe <code>$80</code> en el estado del chico (<code>$BF</code>, <code>$CF</code>, <code>$DF</code>), pero nada comprueba los tres juntos: el GAME OVER (<code>$EABB</code>, que llama a <code>$DCD3</code>) solo lo llaman los cronómetros de la explosión y el rayo. <b>Arreglo:</b> el bucle principal llama a <code>$C78F</code> en cada vuelta, en <code>$C27C</code>; esa llamada pasa por 14 bytes en <code>$C000</code> (hueco al inicio del banco fijo) que, con el bit 7 activo en los tres, saltan al mismo <code>$EABB</code>. Dentro de <code>$DCD3</code>, la carga y la animación del hongo (<code>$DD09</code>, <code>$DD12</code>) pasan por 27 bytes en <code>$BFC0</code> del banco 9, que las saltan solo en ese caso. La explosión de la casa sigue igual."}}]},{"titulo":{"pt":"Como foi conferido","en":"How it was checked","es":"Cómo se comprobó"},"itens":[{"t":{"pt":"<b>Os três defeitos foram reproduzidos na ROM japonesa original</b>: a Edna aceitou a chave amarela e o pacote, o tentáculo roxo aceitou o pacote, e nada os devolveu; a grade de senha mostrou o あ no canto; e com os três meninos mortos o jogo ficou nas lápides por mais de cinco minutos sem chegar ao GAME OVER.","en":"<b>All three defects were reproduced on the original Japanese ROM</b>: Edna took the yellow key and the package, the purple tentacle took the package, and nothing gave them back; the password grid showed the あ in the corner; and with all three kids dead the game sat on the gravestones for more than five minutes without reaching GAME OVER.","es":"<b>Los tres defectos se reprodujeron en la ROM japonesa original</b>: Edna aceptó la llave amarilla y el paquete, el tentáculo morado aceptó el paquete, y nada los devolvió; la cuadrícula de contraseña mostró la あ en la esquina; y con los tres chicos muertos el juego se quedó en las lápidas más de cinco minutos sin llegar al GAME OVER."}},{"t":{"pt":"<b>Com o patch, nas mesmas situações:</b> a Edna e o tentáculo roxo recusam e o objeto fica com o menino; o tentáculo verde recusa o removedor de tinta e aceita a fruta de cera, como antes; a grade de senha sai limpa; e a terceira morte leva ao GAME OVER na hora, com RETRY voltando à escolha de personagem e PASSWORD abrindo a senha.","en":"<b>With the patch, in the same situations:</b> Edna and the purple tentacle refuse and the item stays with the kid; the green tentacle refuses the paint remover and takes the wax fruit, as before; the password grid comes up clean; and the third death goes straight to GAME OVER, with RETRY returning to character select and PASSWORD opening the password screen.","es":"<b>Con el parche, en las mismas situaciones:</b> Edna y el tentáculo morado rechazan y el objeto se queda con el chico; el tentáculo verde rechaza el quitapinturas y acepta la fruta de cera, como antes; la cuadrícula de contraseña sale limpia; y la tercera muerte lleva al GAME OVER al momento, con RETRY volviendo a la selección de personaje y PASSWORD abriendo la contraseña."}},{"t":{"pt":"<b>E o jogo inteiro, na própria ROM consertada:</b> desde o power-on, pelos sete caminhos, que são os quatro finais, o GAME OVER da explosão e as senhas secretas. Todos chegaram ao fim, e todo texto que apareceu na tela saiu idêntico ao da ROM original. Os consertos da tela de senha e dos três mortos são os mesmos bytes da tradução inglesa; o do わたす segue a mesma regra, reescrito para caber na ROM de 256 KB sem expandi-la. O IPS aplicado reproduz a ROM consertada byte a byte.","en":"<b>And the whole game, on the fixed ROM itself:</b> from power-on, along the seven routes, which are the four endings, the explosion GAME OVER and the secret passwords. Every one reached its end, and all text that appeared on screen came out identical to the original ROM. The password screen and three-dead fixes are the same bytes as in the English translation; the わたす fix follows the same rule, rewritten to fit the 256 KB ROM without expanding it. The IPS reproduces the fixed ROM byte for byte.","es":"<b>Y el juego entero, en la propia ROM corregida:</b> desde el encendido, por los siete caminos, que son los cuatro finales, el GAME OVER de la explosión y las contraseñas secretas. Todos llegaron al final, y todo texto que apareció en pantalla salió idéntico al de la ROM original. Los arreglos de la pantalla de contraseña y de los tres muertos son los mismos bytes de la traducción inglesa; el de わたす sigue la misma regla, reescrito para caber en la ROM de 256 KB sin ampliarla. El IPS reproduce la ROM corregida byte a byte."}}]}],"patch":{"versoes":{"jp":{"arquivo":"maniac-mansion-bugfix.ips","tamanho":"199 B"}},"rom":"Maniac Mansion (Japan).nes","rom_md5":"5835600abb0a8de98d905da545350160","nota":{"pt":"ROM com cabeçalho iNES, 262.160 bytes · CRC32 6571F742 (sem cabeçalho: CRC32 3DA2085E, SHA-1 0f90852c9bb9c47419153a262a23e83df314df5c). Depois do patch: MD5 58cc88a97c8d3ae6b20b8c8f7a4e6fca. Serve em Flips, Lunar IPS ou ROM Patcher JS.","en":"Headered iNES ROM, 262,160 bytes · CRC32 6571F742 (headerless: CRC32 3DA2085E, SHA-1 0f90852c9bb9c47419153a262a23e83df314df5c). After patching: MD5 58cc88a97c8d3ae6b20b8c8f7a4e6fca. Works with Flips, Lunar IPS or ROM Patcher JS.","es":"ROM con cabecera iNES, 262.160 bytes · CRC32 6571F742 (sin cabecera: CRC32 3DA2085E, SHA-1 0f90852c9bb9c47419153a262a23e83df314df5c). Tras el parche: MD5 58cc88a97c8d3ae6b20b8c8f7a4e6fca. Sirve con Flips, Lunar IPS o ROM Patcher JS."}},"fotos":[{"f":"maniac-fix/01-senha.png","t":{"pt":"Tela de senha","en":"Password screen","es":"Pantalla de contraseña"},"c":{"pt":"A grade de senha sem o あ vermelho que ficava no canto de cima.","en":"The password grid without the red あ that sat in the top corner.","es":"La cuadrícula de contraseña sin la あ roja que quedaba en la esquina de arriba."}},{"f":"maniac-fix/02-edna.png","t":{"pt":"A Edna recusa","en":"Edna refuses","es":"Edna rechaza"},"c":{"pt":"Depois de わたす, a chave amarela (きいろのかぎ) continua no inventário.","en":"After わたす, the yellow key (きいろのかぎ) is still in the inventory.","es":"Después de わたす, la llave amarilla (きいろのかぎ) sigue en el inventario."}},{"f":"maniac-fix/03-game-over.png","t":{"pt":"GAME OVER","en":"GAME OVER","es":"GAME OVER"},"c":{"pt":"Os três meninos mortos agora levam ao GAME OVER do cartucho, com RETRY e PASSWORD.","en":"Three dead kids now lead to the cartridge’s own GAME OVER, with RETRY and PASSWORD.","es":"Los tres chicos muertos ahora llevan al GAME OVER del cartucho, con RETRY y PASSWORD."}}],"etapas":{"direcao":"feito","testes":"feito"}},{"slug":"famicom-jump-2","nome":"Famicom Jump II","subtitulo":"Saikyou no 7 Nin","jp":"ファミコンジャンプII 最強の7人","traducao_titulo":"The Strongest Seven","publisher":"Bandai","dev":"Chunsoft","ano":1991,"data":"2 December 1991","sistema":"Famicom","mapper":"Mapper 153 (Bandai FCG) · 512 KB PRG · CHR-RAM · battery SRAM","primeiro":true,"categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"beta","capa":"fj2/00-capa-patreon.jpg","linha":{"pt":"Goku, JoJo e mais cinco da Shōnen Jump no mesmo campo. O B virou ação coringa, e dois bytes acordaram uma cena de 1991.","en":"Goku, JoJo and five more Shōnen Jump heroes on one battlefield. B became the do-what-fits button, and two bytes woke a 1991 scene.","es":"Goku, JoJo y cinco más de la Shōnen Jump en un mismo campo. La B pasó a ser una acción comodín, y dos bytes despertaron una escena de 1991."},"resumo":{"pt":["A <i>Weekly Shōnen Jump</i> é a revista semanal em que o Dragon Ball saiu capítulo a capítulo, e em 1991 a Bandai e a Chunsoft puseram sete séries dela no mesmo campo de batalha: Goku, JoJo, o policial Ryotsu do <i>Kochikame</i>, Taruruto-kun, Tar-chan, Momotaro e Taison. Três dos sete entram por vez, a vida se conta em corações e até o alcance de caminhada é um atributo que sobe de nível — o manual chama o sistema de <b>S·A·S, Simulation Action System</b>.","Falar com alguém custava abrir o menu e escolher <code>はなす</code>; no campo, o <b>B</b> não fazia nada — a rotina existia e terminava em <code>RTS</code>. Agora o <b>B é ação coringa</b>: fala com quem está à frente e, não havendo ninguém, examina o chão sob os pés, que é a mesma divisão que o manual de 1991 faz entre os dois comandos. São <b>19 bytes</b> no trecho do kernel que fica sempre mapeado, mais 3 no banco 30, e o comando continua no menu para quem preferir. Junto vem um <b>prólogo de cinco páginas que não existe no original</b>: o menino levado para dentro da revista, o Rei Demônio Piccolo reunindo os vilões, os dezesseis heróis — porque seis dos sete nomes não dizem nada fora do Japão, e o jogo pressupõe que você leu a revista e jogou o <i>Famicom Jump</i> de 1989.","E uma cena voltou a funcionar. Na abertura, o espírito nomeia os seis campeões que faltavam encontrar, e o original mostrava <b>sempre os mesmos seis</b>, qualquer que fosse o herói inicial: quem começava como Taison ouvia o próprio nome na lista, e o Goku nunca era citado. O seletor de sete casos e as sete variantes de texto estavam gravados na ROM em 1991 e nunca disparavam, porque o roteiro punha o número num registrador e a rotina lia outro. <b>Dois bytes</b> depois, seis variantes que nunca haviam chegado a uma tela chegam. O roteiro inteiro está traduzido, num cartucho no teto do mapper 153 com <b>zero bytes livres</b>: em vez de cortar texto, a compressão foi trocada por um <b>Huffman de ordem 1</b> que leva o texto de 6,25 para <b>3,90 bits por caractere</b>, e a cada compilação as <b>1.903 posições de mensagem</b> da ROM são decodificadas de volta pelo decodificador 6502 real e comparadas com a fonte. Publicado em <b>inglês, português e espanhol</b>."],"en":["<i>Weekly Shōnen Jump</i> is the magazine that serialised Dragon Ball chapter by chapter, and in 1991 Bandai and Chunsoft put seven of its series on one battlefield: Goku, JoJo, <i>Kochikame</i>'s beat cop Ryotsu, Taruruto-kun, Tar-chan, Momotaro and Taison. Three of the seven fight at a time, health is counted in hearts, and even walking range is a stat that levels up — the manual calls the system <b>S·A·S, Simulation Action System</b>.","Talking to someone cost a trip into the menu to pick <code>はなす</code>; out in the field, <b>B</b> did nothing — the routine existed and ended in <code>RTS</code>. Now <b>B is the do-what-fits button</b>: it talks to whoever stands in front of you and, with nobody there, examines the ground underfoot, which is exactly the split the 1991 manual draws between the two commands. That is <b>19 bytes</b> in the always-mapped kernel plus 3 in bank 30, and the menu command stays for anyone who prefers it. With it comes a <b>five-page prologue that does not exist in the original</b>: the boy pulled into the magazine, Demon King Piccolo gathering the villains, the sixteen heroes — because six of those seven names mean nothing outside Japan, and the game assumes you read the magazine and played the 1989 <i>Famicom Jump</i>.","And one scene started working again. In the opening, a spirit names the six champions still to be found, and the original always showed <b>the same six</b>, whichever hero you began with: a player starting as Taison heard his own name on the list, and Goku was never mentioned. The seven-case selector and all seven text variants were burned into the 1991 ROM and never fired, because the script put the number in one register while the routine read another. <b>Two bytes</b> later, six variants that had never reached a screen do. The whole script is translated, in a cartridge at the mapper 153 ceiling with <b>zero free bytes</b>: rather than trim text, the compression was swapped for an <b>order-1 Huffman</b> taking it from 6.25 to <b>3.90 bits per character</b>, and on every build the ROM's <b>1,903 message positions</b> are decoded back by the real 6502 decoder and compared against the source. Published in <b>English, Portuguese and Spanish</b>."],"es":["La <i>Weekly Shōnen Jump</i> es la revista semanal en la que Dragon Ball salió capítulo a capítulo, y en 1991 Bandai y Chunsoft pusieron siete de sus series en el mismo campo de batalla: Goku, JoJo, el policía Ryotsu de <i>Kochikame</i>, Taruruto, Ta-chan, Momotaro y Taison. Tres de los siete entran a la vez, la vida se cuenta en corazones y hasta el alcance de movimiento es un atributo que sube de nivel — el manual llama al sistema <b>S·A·S, Simulation Action System</b>.","Hablar con alguien costaba abrir el menú y elegir <code>はなす</code>; en el campo, la <b>B</b> no hacía nada — la rutina existía y terminaba en <code>RTS</code>. Ahora <b>la B es una acción comodín</b>: habla con quien tengas delante y, si no hay nadie, examina el suelo bajo tus pies, que es la misma división que hace el manual de 1991 entre los dos comandos. Son <b>19 bytes</b> en el tramo del kernel que está siempre mapeado, más 3 en el banco 30, y el comando sigue en el menú para quien lo prefiera. Con él llega un <b>prólogo de cinco páginas que no existe en el original</b>: el niño llevado al interior de la revista, el Rey Demonio Piccolo reuniendo a los villanos, los dieciséis héroes — porque seis de esos siete nombres no dicen nada fuera de Japón, y el juego da por hecho que leíste la revista y jugaste al <i>Famicom Jump</i> de 1989.","Y una escena volvió a funcionar. En la apertura, el espíritu nombra a los seis campeones que quedan por encontrar, y el original mostraba <b>siempre los mismos seis</b>, fuera cual fuera el héroe inicial: quien empezaba como Taison oía su propio nombre en la lista, y a Goku no se le nombraba nunca. El selector de siete casos y las siete variantes de texto estaban grabados en la ROM en 1991 y no se disparaban nunca, porque el guion ponía el número en un registro y la rutina leía otro. <b>Dos bytes</b> después, seis variantes que nunca habían llegado a una pantalla llegan. El guion entero está traducido, en un cartucho en el techo del mapper 153 con <b>cero bytes libres</b>: en lugar de recortar texto, la compresión se cambió por un <b>Huffman de orden 1</b> que lleva el texto de 6,25 a <b>3,90 bits por carácter</b>, y en cada compilación las <b>1.903 posiciones de mensaje</b> de la ROM se decodifican de vuelta con el decodificador 6502 real y se comparan con el texto de origen. Publicado en <b>inglés, portugués y español</b>."]},"numeros":[{"v":"1,903","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"266","r":{"pt":"itens, lugares e nomes","en":"items, places and names","es":"objetos, lugares y nombres"}},{"v":"75","r":{"pt":"glifos latinos desenhados","en":"Latin glyphs drawn","es":"glifos latinos dibujados"}},{"v":"2","r":{"pt":"bytes que consertaram o jogo","en":"bytes that fixed the game","es":"bytes que arreglaron el juego"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.903 mensagens</b> — o roteiro inteiro, sem resumo e sem frase cortada","en":"<b>1,903 messages</b> — the entire script, nothing summarised, no sentence cut","es":"<b>1.903 mensajes</b> — el guion entero, sin resumir, sin una frase cortada"},"foto":"fj2/05-espirito-jump-world.png"},{"t":{"pt":"<b>266 nomes</b> de itens, lugares, monstros e do grupo, encurtados só quando o campo da tela não comporta","en":"<b>266 names</b> for items, places, monsters and the party, shortened only where the on-screen field cannot hold them","es":"<b>266 nombres</b> de objetos, lugares, monstruos y del grupo, acortados solo donde el campo de la pantalla no da"},"foto":"fj2/08-soulring.png"},{"t":{"pt":"<b>77 textos de menu</b> — status, loja, depósito, treino e título","en":"<b>77 menu strings</b> — status, shop, storage, training and title","es":"<b>77 textos de menú</b> — estado, tienda, almacén, entrenamiento y título"},"foto":"fj2/03-menu-ingles.png"},{"t":{"pt":"<b>13 mensagens de batalha</b> e as <b>6 páginas</b> do final","en":"<b>13 battle messages</b> and the <b>6 pages</b> of the ending","es":"<b>13 mensajes de combate</b> y las <b>6 páginas</b> del final"}},{"t":{"pt":"<b>Fonte latina de 75 glifos</b> desenhada para o jogo — maiúsculas, minúsculas, algarismos e pontuação — no lugar dos 141 tiles de kana do original","en":"<b>A 75-glyph Latin font</b> drawn for the game — capitals, lower case, digits and punctuation — replacing the original 141 kana tiles","es":"<b>Una fuente latina de 75 glifos</b> dibujada para el juego — mayúsculas, minúsculas, cifras y puntuación — en lugar de los 141 tiles de kana del original"}}]},{"titulo":{"pt":"Um bug de 1991, consertado","en":"A 1991 bug, fixed","es":"Un error de 1991, corregido"},"itens":[{"t":{"pt":"Na abertura, o espírito diz que sete campeões foram escolhidos e nomeia os seis que faltam achar. <b>Desde 1991 ele nomeia sempre os mesmos seis</b> — quem começa como Taison é mandado procurar o Taison, e o Goku nunca é citado.","en":"In the opening, a spirit says seven champions have been chosen and names the six you still have to find. <b>It has named the same six since 1991</b> — start as Taison and it sends you to go find Taison, and Goku is never named at all.","es":"En la apertura, el espíritu dice que se han elegido siete campeones y nombra a los seis que faltan por encontrar. <b>Desde 1991 nombra siempre a los mismos seis</b> — si empiezas como Taison te manda a buscar a Taison, y a Goku no lo nombra nunca."},"foto":"fj2/06-lista-sete-campeoes.png"},{"t":{"pt":"Não era limitação do cartucho: <b>o código certo já estava lá</b>. A cena tem um seletor de sete casos, um por herói inicial, e as sete variantes de texto estão gravadas na ROM. O seletor nunca disparava — o roteiro punha o número do herói no acumulador e a rotina chamada lia o registrador X, que trazia lixo da chamada anterior.","en":"This was never a limitation of the cartridge: <b>the correct code is already in the ROM</b>. The scene has a seven-way selector, one branch per starting hero, and all seven text variants are sitting there. The selector never fired — the script loads the hero number into the accumulator and the routine it calls reads it from X, which still held leftovers from the previous call.","es":"No era una limitación del cartucho: <b>el código correcto ya estaba en la ROM</b>. La escena tiene un selector de siete casos, uno por héroe inicial, y las siete variantes de texto están grabadas. El selector no disparaba nunca — el guion ponía el número del héroe en el acumulador y la rutina llamada lo leía del registro X, que traía basura de la llamada anterior."}},{"t":{"pt":"A correção são <b>dois bytes</b>, apontando a carga para o registrador certo. Nada foi reescrito. <b>Seis das sete variantes não apareciam numa tela havia trinta e cinco anos.</b>","en":"The fix is <b>two bytes</b>, pointing the load at the right register. Nothing was rewritten. <b>Six of the seven variants had not reached a screen in thirty-five years.</b>","es":"La corrección son <b>dos bytes</b>, apuntando la carga al registro correcto. No se reescribió nada. <b>Seis de las siete variantes no habían llegado a una pantalla en treinta y cinco años.</b>"},"foto":"fj2/07-e-voce-tambem-goku.png"}]},{"titulo":{"pt":"Conteúdo novo","en":"New content","es":"Contenido nuevo"},"itens":[{"t":{"pt":"<b>Prólogo de cinco páginas</b>, escrito do zero, recapitulando o <i>Famicom Jump: Eiyuu Retsuden</i> de 1989 — para quem chega ao segundo jogo sem ter jogado o primeiro","en":"<b>A five-page prologue</b>, newly written, recapping <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — for anyone arriving at the second game without the first","es":"<b>Un prólogo de cinco páginas</b>, escrito de cero, que recapitula <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — para quien llega al segundo juego sin el primero"},"foto":"fj2/04-prologo-novo.png"},{"t":{"pt":"<b>Tela de créditos</b> antes do título: 5 segundos, pula com A ou START. Cabe inteira — código, paleta e texto — em 355 bytes de espaço morto do banco do título","en":"<b>A credits screen</b> before the title: 5 seconds, skippable with A or START. The whole thing — code, palette and text — fits in 355 bytes of dead space in the title bank","es":"<b>Una pantalla de créditos</b> antes del título: 5 segundos, se salta con A o START. Cabe entera — código, paleta y texto — en 355 bytes de espacio muerto del banco del título"},"foto":"fj2/02-creditos.png"},{"t":{"pt":"<b>Selo <code>DEFINITIVE EDITION</code></b> no rodapé do título, sem tirar nada e <b>sem gastar um byte a mais</b>: reescrever o escritor do subtítulo para ser dirigido por tabela liberou seis tiles, e o rodapé só precisava de quatro letras novas","en":"<b>A <code>DEFINITIVE EDITION</code> seal</b> on the title footer, taking nothing away and <b>costing zero extra bytes</b>: rewriting the subtitle routine to be table-driven freed six tile slots, and the seal needed only four letters that were not already there","es":"<b>Un sello <code>DEFINITIVE EDITION</code></b> en el pie del título, sin quitar nada y <b>sin gastar un byte de más</b>: reescribir la rutina del subtítulo para que fuera dirigida por tabla liberó seis tiles, y el sello solo necesitaba cuatro letras que no estuvieran ya"},"foto":"fj2/01-tela-titulo.png"},{"t":{"pt":"<b>Botão B contextual.</b> No original, falar com alguém custa abrir o menu; o B não fazia nada no campo. Agora o B fala com quem estiver à frente e, não havendo ninguém, examina o chão — a mesma divisão que o manual faz entre <code>はなす</code> e <code>しらべる</code>. O comando continua no menu para quem preferir.","en":"<b>A context-sensitive B button.</b> In the original, talking to someone costs a menu; B did nothing in the field. Now B talks to whoever is in front of you and, when nobody is, examines the ground — the same split the manual draws between <code>はなす</code> and <code>しらべる</code>. The menu command is still there for anyone who prefers it.","es":"<b>Botón B contextual.</b> En el original, hablar con alguien cuesta abrir el menú; la B no hacía nada en el campo. Ahora la B habla con quien tengas delante y, si no hay nadie, examina el suelo — la misma división que hace el manual entre <code>はなす</code> y <code>しらべる</code>. El comando sigue en el menú para quien lo prefiera."}}]},{"titulo":{"pt":"A engenharia","en":"The engineering","es":"La ingeniería"},"itens":[{"t":{"pt":"Medido em tradução real, o inglês ocupa <b>1,51×</b> os caracteres do japonês. Não cabia: faltavam cerca de <b>20 KB</b> — num cartucho no teto do mapper, com <b>zero bytes livres</b>.","en":"Measured on the real translation, English runs <b>1.51×</b> the character count of the Japanese. It did not fit: the script was about <b>20 KB</b> over — on a cartridge at the mapper ceiling, with <b>zero free bytes</b>.","es":"Medido en traducción real, el inglés ocupa <b>1,51×</b> los caracteres del japonés. No cabía: faltaban unos <b>20 KB</b> — en un cartucho en el techo del mapper, con <b>cero bytes libres</b>."}},{"t":{"pt":"Em vez de cortar texto, <b>troquei a compressão</b>. Um <b>Huffman de ordem 1</b> — a árvore escolhida pelo caractere anterior, em 26 grupos de contexto — leva o texto de 6,25 para <b>3,90 bits por caractere</b>. O decodificador tem <b>89 bytes</b> de 6502 escritos à mão.","en":"Rather than trim text, <b>I replaced the compression</b>. An <b>order-1 Huffman coder</b> — the tree picked by the previous character, across 26 context groups — takes the script from 6.25 to <b>3.90 bits per character</b>. The decoder is <b>89 bytes</b> of hand-written 6502.","es":"En vez de cortar texto, <b>cambié la compresión</b>. Un <b>Huffman de orden 1</b> — el árbol elegido por el carácter anterior, en 26 grupos de contexto — lleva el texto de 6,25 a <b>3,90 bits por carácter</b>. El decodificador son <b>89 bytes</b> de 6502 escritos a mano."}},{"t":{"pt":"As tabelas dos 26 grupos couberam nos <b>1.060 bytes</b> úteis do banco do dicionário antigo mais 65 bytes de enchimento no fim dele. O roteiro inglês fechou em <b>65,9 KB dentro de 68,1 KB</b> — folga de 2,2 KB num cartucho cujo maior vão livr
