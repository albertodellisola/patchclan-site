n font and the reinsertion — and only then is there something playable to call a beta.","es":"El guion se está extrayendo. Después vienen la tabla de caracteres, la fuente latina dibujada y la reinserción — y solo entonces habrá algo jugable que llamar beta."}},{"t":{"pt":"<b>Nenhuma data é prometida</b>, aqui como em tudo o mais.","en":"<b>No date is promised</b>, here as anywhere else.","es":"<b>No se promete ninguna fecha</b>, aquí como en todo lo demás."}}]}],"patch":{"versoes":{"en":{"arquivo":"tom-sawyer-en.ips","tamanho":"251 KB"},"pt":null,"es":null},"rom":"Square no Tom Sawyer (Japan).nes","rom_md5":"b7e85ec90d071443ea69614c02a7a0a0"},"fotos":[{"f":"tom/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"ROM original. O título é texto em katakana, não um logo desenhado — o que torna a troca barata.","en":"Original ROM. The title is katakana text, not a drawn logo — which makes replacing it cheap.","es":"ROM original. El título es texto en katakana, no un logo dibujado — lo que abarata el reemplazo."}},{"f":"tom/02-menu.png","t":{"pt":"Menu de abertura","en":"Boot menu","es":"Menú de arranque"},"c":{"pt":"ROM original — e já em inglês, com ajuste de velocidade de texto de fábrica.","en":"Original ROM — and already in English, with a factory text-speed setting.","es":"ROM original — y ya en inglés, con ajuste de velocidad de texto de fábrica."}},{"f":"tom/03-dialogo.png","t":{"pt":"A caixa de fala","en":"The dialogue box","es":"La caja de diálogo"},"c":{"pt":"ROM original. Retrato à esquerda e duas linhas: é esta a restrição que decide a tradução.","en":"Original ROM. Portrait on the left and two lines: this is the constraint that decides the translation.","es":"ROM original. Retrato a la izquierda y dos líneas: esta es la restricción que decide la traducción."}},{"f":"tom/06-abertura.png","t":{"pt":"A abertura","en":"The opening","es":"La apertura"},"c":{"pt":"ROM original. Missouri, 1855 — o texto que abre o jogo.","en":"Original ROM. Missouri, 1855 — the text that opens the game.","es":"ROM original. Misuri, 1855 — el texto que abre el juego."}},{"f":"tom/04-campo.png","t":{"pt":"No campo","en":"In the field","es":"En el campo"},"c":{"pt":"ROM original. O Mississippi da Square, em tiles.","en":"Original ROM. Square's Mississippi, in tiles.","es":"ROM original. El Misisipi de Square, en tiles."}},{"f":"tom/05-status.png","t":{"pt":"Status","en":"Status","es":"Estado"},"c":{"pt":"ROM original. HP, AP, DP e QP já saem em letras latinas; os comandos, não.","en":"Original ROM. HP, AP, DP and QP already come out in Latin letters; the commands do not.","es":"ROM original. HP, AP, DP y QP ya salen en letras latinas; los comandos no."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"ultraman-club-2","nome":"Ultraman Club 2","subtitulo":"Kaettekita Ultraman Club","jp":"帰ってきたウルトラマン倶楽部","publisher":"Shinsei","dev":"Tsuburaya Prod.","ano":1989,"data":"1989","sistema":"Famicom","mapper":"MMC3 · 128 KB PRG expandido para 256 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"u2/00-capa-patreon.jpg","linha":{"pt":"O RPG em que Zoffy, Ace, Taro e Seven viram bonecos de cabeça grande — e o bestiário inteiro, perto de noventa monstros, saiu em inglês.","en":"The RPG where Zoffy, Ace, Taro and Seven become big-headed figures — with the whole bestiary, close to ninety monsters, now in English.","es":"El RPG en el que Zoffy, Ace, Taro y Seven son muñecos cabezones — y el bestiario entero, cerca de noventa monstruos, salió en inglés."},"resumo":{"pt":["A Tsuburaya deixou os Ultras virarem bonecos de cabeça grande e os pôs num RPG de Famicom, com a Shinsei, em 1989. O elenco é o panteão inteiro — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, a Mãe e o Pai de Ultra, o Rei de Ultra — e o mapa é feito dos lugares que a série construiu ao longo de vinte anos: a <b>Terra dos Ultras</b>, a Vila do Pigmon, o <b>Cemitério de Monstros</b>. Do outro lado, os alienígenas de sempre: Baltan, Metron, Guts.","O patch em <b>inglês está publicado</b>, com <b>653 entradas de texto</b>: 447 mensagens de diálogo, batalha, descrição de item, sequência final e créditos; 56 de menu, golpes e itens; e <b>146 entradas de combate</b> que carregam o bestiário inteiro, perto de noventa monstros. Cada nome de kaiju foi conferido contra o manual japonês e contra a nomenclatura consagrada da série — num patch de tradução, nome errado é o defeito que o fã enxerga primeiro. A fonte do jogo nem tinha <code>.</code> <code>,</code> <code>'</code> <code>-</code>: os quatro glifos foram desenhados sobre kanji que o texto traduzido não usa mais.","As <b>146 entradas de combate</b> são o quarto bloco de texto da ROM, e só apareceram porque a varredura foi refeita na ROM já <i>montada</i>. Na ROM original os bytes de ponteiro do bloco caem na faixa do kana, e a análise o havia descartado como dado binário — é o lembrete de que uma tradução termina quando a ROM inteira foi varrida, não quando a lista de tabelas conhecidas acabou. Até quatro partículas japonesas escaparam de qualquer varredura de tabela, porque estão escritas dentro do código como <code>LDA #$AC</code> no meio da rotina de batalha, colando kana no fim do nome do monstro na tela. Nem o inglês cabia no cartucho como ele saiu de fábrica: a ROM foi <b>expandida de 128 para 256 KB</b>, com os bancos 14 e 15 duplicados no fim, porque no MMC3 o banco fixo é sempre o último. O que ficou gravado é lido de volta e comparado byte a byte com o roteiro: <b>653 entradas, zero divergências</b>."],"en":["Tsuburaya let the Ultras become big-headed chibi figures and put them in a Famicom RPG, with Shinsei, in 1989. The cast is the whole pantheon — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, the Mother and Father of Ultra, Ultraman King — and the map is built from places the series raised over twenty years: the <b>Land of Ultra</b>, Pigmon Village, the <b>Monster Graveyard</b>. On the other side, the usual aliens: Baltan, Metron, Guts.","The <b>English patch is published</b>, carrying <b>653 text entries</b>: 447 messages of dialogue, battle, item descriptions, the ending sequence and the credits; 56 for menus, moves and items; and <b>146 battle entries</b> holding the entire bestiary, close to ninety monsters. Every kaiju name was checked against the Japanese manual and against the series' settled nomenclature — in a translation patch, a wrong name is the defect a fan spots first. The game's font did not even have <code>.</code> <code>,</code> <code>'</code> <code>-</code>: those four glyphs were drawn over kanji the translated text no longer uses.","Those <b>146 battle entries</b> are the ROM's fourth text block, and they only surfaced because the sweep was run again on the <i>built</i> ROM. In the original ROM the block's pointer bytes fall inside the kana range, and the analysis had dismissed it as binary data — a reminder that a translation ends when the whole ROM has been swept, not when the list of known tables runs out. Four Japanese particles escaped every table sweep as well, because they are written inside the program as <code>LDA #$AC</code> in the middle of the battle routine, gluing kana onto the end of the monster's name on screen. Not even English fit the cartridge as it shipped: the ROM was <b>expanded from 128 to 256 KB</b>, with banks 14 and 15 duplicated at the end, because on MMC3 the fixed bank is always the last one. What ends up written is read back and compared byte for byte against the script: <b>653 entries, zero mismatches</b>."],"es":["Tsuburaya dejó que los Ultras se volvieran muñecos cabezones y los puso en un RPG de Famicom, con Shinsei, en 1989. El reparto es el panteón entero — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, la Madre y el Padre de Ultra, el Rey de Ultra — y el mapa está hecho de los lugares que la serie levantó a lo largo de veinte años: la <b>Tierra de los Ultras</b>, la Aldea de Pigmon, el <b>Cementerio de Monstruos</b>. Al otro lado, los alienígenas de siempre: Baltan, Metron, Guts.","El parche en <b>inglés está publicado</b>, con <b>653 entradas de texto</b>: 447 mensajes de diálogo, combate, descripción de objeto, secuencia final y créditos; 56 de menú, golpes y objetos; y <b>146 entradas de combate</b> que llevan el bestiario entero, cerca de noventa monstruos. Cada nombre de kaiju se cotejó con el manual japonés y con la nomenclatura asentada de la serie — en un parche de traducción, un nombre mal puesto es el defecto que el aficionado ve primero. La fuente del juego ni siquiera tenía <code>.</code> <code>,</code> <code>'</code> <code>-</code>: los cuatro glifos se dibujaron sobre kanji que el texto traducido ya no usa.","Esas 146 entradas de combate son el cuarto bloque de texto de la ROM, y solo aparecieron porque el barrido se rehízo sobre la ROM ya <i>montada</i>. En la ROM original los bytes de puntero del bloque caen en el rango del kana, y el análisis lo había descartado como dato binario — es el recordatorio de que una traducción termina cuando se ha barrido la ROM entera, no cuando se acaba la lista de tablas conocidas. Cuatro partículas japonesas escaparon también de cualquier barrido de tabla, porque están escritas dentro del código como <code>LDA #$AC</code> en mitad de la rutina de combate, pegando kana al final del nombre del monstruo en pantalla. Ni el inglés cabía en el cartucho tal como salió de fábrica: la ROM se <b>amplió de 128 a 256 KB</b>, con los bancos 14 y 15 duplicados al final, porque en el MMC3 el banco fijo es siempre el último. Lo que queda grabado se lee de vuelta y se compara byte a byte con el guion: <b>653 entradas, cero divergencias</b>."]},"numeros":[{"v":"653","r":{"pt":"entradas de texto traduzidas","en":"text entries translated","es":"entradas de texto traducidas"}},{"v":"4","r":{"pt":"blocos de texto na ROM","en":"text blocks in the ROM","es":"bloques de texto en la ROM"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}},{"v":"22×4","r":{"pt":"a caixa de fala, em colunas","en":"the dialogue box, in columns","es":"la caja de diálogo, en columnas"}}],"grupos":[{"titulo":{"pt":"O que já entrou","en":"What is already in","es":"Lo que ya entró"},"itens":[{"t":{"pt":"<b>447 mensagens</b> de diálogo, batalha, descrições de item, a sequência final e os créditos — em três grupos de texto.","en":"<b>447 messages</b> of dialogue, battle, item descriptions, the ending sequence and the credits — across three text groups.","es":"<b>447 mensajes</b> de diálogo, combate, descripciones de objetos, la secuencia final y los créditos — en tres grupos de texto."},"foto":"u2/03-encontro.png"},{"t":{"pt":"<b>146 entradas</b> de combate: as mensagens de ação, os gritos de golpe e o <b>bestiário inteiro</b> — cerca de 90 monstros. Este quarto bloco só apareceu ao varrer kana na ROM <i>montada</i>: os bytes de ponteiro dele caem na faixa do kana e a análise da ROM original o descartou como dado binário.","en":"<b>146 battle entries</b>: action messages, attack shouts and the <b>whole bestiary</b> — about 90 monsters. This fourth block only surfaced when scanning kana in the <i>built</i> ROM: its pointer bytes fall in the kana range and the original-ROM analysis dismissed it as binary data.","es":"<b>146 entradas</b> de combate: mensajes de acción, gritos de técnica y el <b>bestiario entero</b> — unos 90 monstruos. Este cuarto bloque solo apareció al barrer kana en la ROM <i>construida</i>."},"foto":"u2/04-menu-batalha.png"},{"t":{"pt":"<b>56 entradas</b> de menu, golpes, itens e nomes de monstro, e mais <b>4 partículas japonesas cravadas no código</b> — <code>は</code> e <code>に</code>, que nenhuma varredura de tabela acha porque estão escritas como <code>LDA #$AC</code> no meio da rotina de batalha.","en":"<b>56 entries</b> for menus, moves, items and monster names, plus <b>4 Japanese particles hardcoded in the code</b> — <code>は</code> and <code>に</code>, which no table scan finds because they are written as <code>LDA #$AC</code> inside the battle routine.","es":"<b>56 entradas</b> de menú, técnicas, objetos y nombres de monstruo, y <b>4 partículas japonesas grabadas en el código</b>."},"foto":"u2/05-combate.png"},{"t":{"pt":"A <b>tela de título</b> redesenhada em 120 tiles, a partir da arte em inglês — e a paleta 1 igualada à 0, porque a tabela de atributos ainda marcava branco na faixa onde ficava o texto japonês pequeno.","en":"The <b>title screen</b> redrawn in 120 tiles from the English artwork — and palette 1 matched to palette 0, because the attribute table still marked white over the band where the small Japanese text used to be.","es":"La <b>pantalla de título</b> redibujada en 120 tiles a partir del arte en inglés."},"foto":"u2/01-titulo.png"},{"t":{"pt":"A ROM foi <b>expandida de 128 KB para 256 KB</b>. Os bancos 14 e 15 são duplicados no fim: no MMC3 o banco fixo é sempre o <i>último</i> da ROM, e crescer sem copiá-los deixa o vetor de reset em área vazia — tela verde no boot.","en":"The ROM was <b>expanded from 128 KB to 256 KB</b>. Banks 14 and 15 are duplicated at the end: on MMC3 the fixed bank is always the <i>last</i> one, and growing without copying them leaves the reset vector in empty space — green screen on boot.","es":"La ROM fue <b>ampliada de 128 KB a 256 KB</b>."}},{"t":{"pt":"<b>Round-trip verificado:</b> o que está gravado na ROM é lido de volta e comparado, byte a byte, com o roteiro em inglês — 653 entradas, zero divergências. E um verificador de caixa confere 22 colunas por 4 linhas no diálogo, e 22 colunas no combate, antes de qualquer coisa sair.","en":"<b>Round-trip verified:</b> what is written in the ROM is read back and compared, byte for byte, against the English script — 653 entries, zero mismatches. And a box checker confirms 22 columns by 4 lines in dialogue, and 22 columns in battle, before anything ships.","es":"<b>Round-trip verificado:</b> lo grabado en la ROM se lee de vuelta y se compara, byte a byte, con el guion en inglés — 653 entradas, cero divergencias."},"foto":"u2/02-creditos.png"}]},{"titulo":{"pt":"O que falta para sair do alfa","en":"What is left before it leaves alpha","es":"Lo que falta para salir del alfa"},"itens":[{"t":{"pt":"<b>Percorrer o jogo do começo ao fim.</b> A cobertura do texto foi medida por varredura, não por jogatina: a Terra dos Ultras, o cemitério de monstros e o final não foram vistos na tela.","en":"<b>Playing the game end to end.</b> Text coverage was measured by scanning, not by playing: the Land of Ultra, the monster graveyard and the ending have not been seen on screen.","es":"<b>Recorrer el juego de principio a fin.</b> La cobertura se midió por barrido, no jugando."}},{"t":{"pt":"Conferir na tela as <b>146 linhas de combate</b> uma a uma. Elas cabem por medição — nome mais mensagem em 22 colunas — mas nem todas foram vistas renderizadas.","en":"Checking the <b>146 battle lines</b> on screen, one by one. They fit by measurement — name plus message within 22 columns — but not all have been seen rendered.","es":"Comprobar en pantalla las <b>146 líneas de combate</b>, una a una."}}]}],"patch":{"versoes":{"en":{"arquivo":"ultraman-club-2-en.ips","tamanho":"158 KB"},"pt":null,"es":null},"rom":"Ultraman Club 2 - Kaettekita Ultraman Club (Japan).nes","rom_md5":"1e479bfe8e4d3c36de37dfb96aa8e68c"},"fotos":[{"f":"u2/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em 120 tiles. O limite não foi a CHR, foi o fluxo da nametable: 145 bytes fixos.","en":"The logo redrawn in 120 tiles. The limit was not the CHR but the nametable stream: a fixed 145 bytes.","es":"El logo redibujado en 120 tiles."}},{"f":"u2/02-creditos.png","t":{"pt":"Tela do patch","en":"Patch screen","es":"Pantalla del parche"},"c":{"pt":"358 bytes no vão livre do banco fixo, com o vetor de RESET desviado. O © é o glifo do próprio jogo — a fonte não tem parênteses.","en":"358 bytes in the free gap of the fixed bank, with the RESET vector diverted. The © is the game’s own glyph — the font has no parentheses.","es":"358 bytes en el hueco libre del banco fijo, con el vector de RESET desviado."}},{"f":"u2/03-encontro.png","t":{"pt":"Encontro","en":"Encounter","es":"Encuentro"},"c":{"pt":"O bestiário saiu do quarto bloco de texto — o que a análise da ROM original tinha descartado como dado binário.","en":"The bestiary came from the fourth text block — the one the original-ROM analysis had dismissed as binary data.","es":"El bestiario salió del cuarto bloque de texto."}},{"f":"u2/04-menu-batalha.png","t":{"pt":"Menu de batalha","en":"Battle menu","es":"Menú de combate"},"c":{"pt":"Os comandos cabem porque a caixa foi medida na tela: interior nas colunas 5 a 27, texto começando na 6.","en":"The commands fit because the box was measured on screen: interior from column 5 to 27, text starting at 6.","es":"Los comandos caben porque la caja se midió en pantalla."}},{"f":"u2/05-combate.png","t":{"pt":"Em combate","en":"In battle","es":"En combate"},"c":{"pt":"O jogo concatena nome e mensagem na mesma linha — o teto de 22 colunas vale para os dois somados.","en":"The game concatenates name and message on the same line — the 22-column ceiling applies to both together.","es":"El juego concatena nombre y mensaje en la misma línea."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"gaia-saver","nome":"Gaia Saver","subtitulo":"Hero Saidai no Sakusen","jp":"ガイアセイバー ヒーロー最大の作戦","traducao_titulo":"Hero's Greatest Operation","publisher":"Banpresto","dev":"Banpresto","ano":1993,"data":"1993","sistema":"Super Famicom","mapper":"SNES · ROM de 2 MB · fonte de 512 glifos 16×16 · ponteiros long de 24 bits","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"gaia/00-capa-patreon.jpg","linha":{"pt":"Ultraman, Kamen Rider e Gundam no mesmo grupo: o herói gigante, o justiceiro de moto e os robôs pilotados, num RPG de Super Famicom.","en":"Ultraman, Kamen Rider and Gundam in one party: the giant hero, the masked rider and the piloted robots, in a single Super Famicom RPG.","es":"Ultraman, Kamen Rider y Gundam en el mismo grupo: el héroe gigante, el justiciero en moto y los robots pilotados, en un RPG de Super Famicom."},"resumo":{"pt":["São três franquias que no Japão têm o tamanho que os super-heróis americanos têm aqui, e quase ninguém fora de lá sabe que elas dividem um RPG. <b>Ultraman</b> é o herói gigante da televisão japonesa que aparece na hora do monstro; <b>Kamen Rider</b> é o justiceiro mascarado de motocicleta; <b>Gundam</b> são os robôs pilotados. A Banpresto pôs os três no mesmo grupo, num RPG de <b>Super Famicom</b> — o crossover <i>Compati Hero</i>, a linha em que os heróis gigantes encolhem para duas cabeças de altura e brigam lado a lado, sem que ninguém pare para explicar como.","O jogo foi desenhado para kana de largura cheia, e é isso que decide a tradução: medido no roteiro original, <b>98% das linhas japonesas cabem em 15 caracteres</b>. O inglês não vive nisso. A fonte foi refeita à <b>meia largura, 8 pixels por caractere</b>, e a caixa passou a comportar <b>29 colunas</b> — número medido na tela, não estimado: com 30 a página embaralha, com 29 renderiza limpa. O limite de <b>29 colunas por 3 linhas</b> é imposto por código a cada compilação, e a <b>tela de título</b> já mostra <code>GAIA SAVER</code> em latinas.","É o único projeto de Super Famicom da casa, e é outra classe de problema: <b>512 glifos de 16×16</b>, 497 entradas de tabela, ponteiros longos de 24 bits e uma ROM de 2 MB. O roteiro foi extraído inteiro — <b>1.884 mensagens</b>, 94,1 KB de texto — e o extrator faz o caminho de volta: <b>1.875 de 1.875 mensagens</b> voltam byte a byte iguais, que é como se prova que nenhuma fala ficou fora da tabela. Hoje o <b>diálogo está 100% traduzido</b> — as 1.884 mensagens — e com ele a interface inteira: os 81 nomes de item, os 22 golpes, as 39 descrições, a tela de save, os menus de configuração, os cinco rótulos do menu de campo, os atributos das fichas de personagem e o cartão de capítulo. Os <b>420 nomes</b> couberam em <b>5.375 dos 5.376 bytes</b> disponíveis, um byte de folga. A realocação segue <b>1.525 ponteiros confiáveis</b>, todos em tabelas de registros do banco <code>$06</code>; os 105 candidatos soltos foram deixados em paz depois de a análise mostrar que eram falsos positivos — um deles a própria instrução <code>LDA $218000,x</code>. Uma varredura tela a tela, feita sempre em boot limpo, não achou japonês em nenhuma delas. Falta o que nenhuma medição substitui: jogar do começo ao fim."],"en":["These are three franchises that in Japan carry the weight American superheroes carry here, and almost nobody outside knows they share an RPG. <b>Ultraman</b> is the giant hero of Japanese television who turns up when the monster does; <b>Kamen Rider</b> is the masked motorcycle vigilante; <b>Gundam</b> are the piloted robots. Banpresto put all three in one party, in a <b>Super Famicom</b> RPG — the <i>Compati Hero</i> crossover, the line where the giant heroes shrink to two heads tall and fight side by side, with nobody stopping to explain how.","The game was drawn for full-width kana, and that is what decides the translation: measured on the original script, <b>98% of the Japanese lines fit in 15 characters</b>. English does not live in that. The font was rebuilt at <b>half width, 8 pixels per character</b>, and the box came to hold <b>29 columns</b> — a number measured on screen rather than estimated: at 30 the page scrambles, at 29 it renders cleanly. The limit of <b>29 columns by 3 lines</b> is enforced in code on every build, and the <b>title screen</b> already reads <code>GAIA SAVER</code> in Latin letters.","It is the house's only Super Famicom project, and a different class of problem: <b>512 glyphs at 16×16</b>, 497 table entries, 24-bit long pointers and a 2 MB ROM. The script was extracted whole — <b>1,884 messages</b>, 94.1 KB of text — and the extractor makes the return trip: <b>1,875 of 1,875 messages</b> come back byte for byte identical, which is how you prove no line was left out of the table. The <b>dialogue is now 100% translated</b> — all 1,884 messages — and the whole interface with it: the 81 item names, the 22 techniques, the 39 descriptions, the save screen, the config menus, the five field-menu labels, the character-sheet stats and the chapter card. The <b>420 names</b> fit <b>5,375 of the 5,376 bytes</b> available, one byte to spare. Relocation follows <b>1,525 trustworthy pointers</b>, all in record tables in bank <code>$06</code>; the 105 loose candidates were left alone once analysis showed them to be false positives — one of them the instruction <code>LDA $218000,x</code> itself. A screen-by-screen sweep, always from a clean boot, found Japanese on none of them. What is left is the thing no measurement replaces: playing it start to finish."],"es":["Son tres franquicias que en Japón tienen el tamaño que aquí tienen los superhéroes americanos, y casi nadie fuera de allí sabe que comparten un RPG. <b>Ultraman</b> es el héroe gigante de la televisión japonesa que aparece a la hora del monstruo; <b>Kamen Rider</b> es el justiciero enmascarado en motocicleta; <b>Gundam</b> son los robots pilotados. Banpresto puso a los tres en el mismo grupo, en un RPG de <b>Super Famicom</b> — el crossover <i>Compati Hero</i>, la línea en la que los héroes gigantes encogen hasta dos cabezas de altura y pelean codo con codo, sin que nadie se pare a explicar cómo.","El juego se diseñó para kana de ancho completo, y eso es lo que decide la traducción: medido sobre el guion original, el <b>98% de las líneas japonesas cabe en 15 caracteres</b>. El inglés no cabe ahí. La fuente se rehízo a <b>media anchura, 8 píxeles por carácter</b>, y la caja pasó a admitir <b>29 columnas</b> — un número medido en pantalla, no estimado: con 30 la página se descuadra, con 29 se dibuja limpia. El límite de <b>29 columnas por 3 líneas</b> lo impone el código en cada compilación, y la <b>pantalla de título</b> ya muestra <code>GAIA SAVER</code> en letras latinas.","Es el único proyecto de Super Famicom de la casa, y es otra clase de problema: <b>512 glifos de 16×16</b>, 497 entradas de tabla, punteros largos de 24 bits y una ROM de 2 MB. El guion se extrajo entero — <b>1.884 mensajes</b>, 94,1 KB de texto — y el extractor hace el camino de vuelta: <b>1.875 de 1.875 mensajes</b> vuelven byte a byte iguales, que es como se prueba que ninguna frase quedó fuera de la tabla. Hoy el <b>diálogo está 100% traducido</b> — los 1.884 mensajes — y con él toda la interfaz: los 81 nombres de objeto, las 22 técnicas, las 39 descripciones, la pantalla de guardado, los menús de configuración, las cinco etiquetas del menú de campo, los atributos de las fichas de personaje y la tarjeta de capítulo. Los <b>420 nombres</b> cupieron en <b>5.375 de los 5.376 bytes</b> disponibles, un byte de holgura. La reubicación sigue <b>1.525 punteros fiables</b>, todos en tablas de registros del banco <code>$06</code>; los 105 candidatos sueltos se dejaron en paz después de que el análisis mostrara que eran falsos positivos — uno de ellos la propia instrucción <code>LDA $218000,x</code>. Un barrido pantalla por pantalla, hecho siempre desde un arranque limpio, no encontró japonés en ninguna. Falta lo que ninguna medición sustituye: jugarlo de principio a fin."]},"numeros":[{"v":"1.884","r":{"pt":"mensagens extraídas","en":"messages extracted","es":"mensajes extraídos"}},{"v":"100%","r":{"pt":"do diálogo traduzido","en":"of the dialogue translated","es":"del diálogo traducido"}},{"v":"1875/1875","r":{"pt":"round-trip byte-idêntico","en":"round-trip byte-identical","es":"round-trip byte-idéntico"}},{"v":"29×3","r":{"pt":"o limite de página, imposto no build","en":"the page limit, enforced at build","es":"el límite de página, impuesto en el build"}}],"grupos":[{"titulo":{"pt":"O que já está resolvido","en":"What is already solved","es":"Lo que ya está resuelto"},"itens":[{"t":{"pt":"<b>A fonte e a tabela de caracteres</b> — 512 glifos de 16×16 e 497 entradas, validadas no emulador.","en":"<b>The font and the character table</b> — 512 glyphs at 16×16 and 497 entries, validated on the emulator.","es":"<b>La fuente y la tabla de caracteres</b> — 512 glifos de 16×16 y 497 entradas, validadas en el emulador."}},{"t":{"pt":"<b>O empacotamento do roteiro</b>, com a paginação própria do jogo, e <b>1.884 mensagens extraídas</b> — 94 KB de texto. O extrator faz round-trip: <b>1.875 de 1.875 mensagens voltam byte-idênticas</b>.","en":"<b>The script encoding</b>, with the game’s own pagination, and <b>1,884 messages extracted</b> — 94 KB of text. The extractor round-trips: <b>1,875 of 1,875 messages come back byte-identical</b>.","es":"<b>El empaquetado del guion</b>, con la paginación propia del juego, y <b>1.884 mensajes extraídos</b> — 94 KB de texto. El extractor hace round-trip: <b>1.875 de 1.875 mensajes vuelven byte-idénticos</b>."}},{"t":{"pt":"<b>Meia largura para o inglês</b> — 8 pixels por caractere, 32 colunas, provado na tela. Sem isso o inglês não caberia num jogo desenhado para kana de largura cheia.","en":"<b>Half-width for English</b> — 8 pixels per character, 32 columns, proved on screen. Without it English would not fit a game drawn for full-width kana.","es":"<b>Media anchura para el inglés</b> — 8 píxeles por carácter, 32 columnas, probado en pantalla. Sin eso el inglés no cabría en un juego dibujado para kana de ancho completo."}},{"t":{"pt":"<b>A tela de título traduzida</b> — o logo <code>GAIA SAVER</code> e o subtítulo <code>HERO’S GREATEST OPERATION</code>, com o caminho provado por round-trip.","en":"<b>The title screen translated</b> — the <code>GAIA SAVER</code> logo and the <code>HERO’S GREATEST OPERATION</code> subtitle, with the pipeline proved by round-trip.","es":"<b>La pantalla de título traducida</b> — el logo <code>GAIA SAVER</code> y el subtítulo <code>HERO’S GREATEST OPERATION</code>, con el camino probado por round-trip."},"foto":"gaia/01-titulo.png"},{"t":{"pt":"<b>420 nomes traduzidos</b>, cabendo em 5.375 dos 5.376 bytes disponíveis — um byte de folga.","en":"<b>420 names translated</b>, fitting in 5,375 of the 5,376 bytes available — one byte to spare.","es":"<b>420 nombres traducidos</b>, cabiendo en 5.375 de los 5.376 bytes disponibles — un byte de margen."}},{"t":{"pt":"<b>O diálogo inteiro</b> — as 1.884 mensagens, conferidas seguindo os 1.561 ponteiros vivos, e não por contagem de arquivo.","en":"<b>The whole dialogue</b> — all 1,884 messages, checked by following the 1,561 live pointers rather than by counting files.","es":"<b>Todo el diálogo</b> — los 1.884 mensajes, comprobados siguiendo los 1.561 punteros vivos y no por conteo de archivos."}},{"t":{"pt":"<b>A interface inteira</b> — 81 nomes de item, 22 golpes, 39 descrições, a tela de save e os menus de configuração.","en":"<b>The whole interface</b> — 81 item names, 22 techniques, 39 descriptions, the save screen and the config menus.","es":"<b>Toda la interfaz</b> — 81 nombres de objeto, 22 técnicas, 39 descripciones, la pantalla de guardado y los menús de configuración."}},{"t":{"pt":"<b>O menu de campo</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. O tilemap dele não estava na ROM crua: vinha de um pedaço comprimido, que foi decodificado, editado, recomprimido e realocado.","en":"<b>The field menu</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. Its tilemap was not in the raw ROM: it came from a compressed chunk, which was decoded, edited, recompressed and relocated.","es":"<b>El menú de campo</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. Su tilemap no estaba en la ROM cruda: venía de un bloque comprimido, que se decodificó, editó, recomprimió y reubicó."}},{"t":{"pt":"<b>O que nenhuma varredura de texto acha</b> — o contador de população, os atributos das fichas de personagem e o cartão de capítulo (<code>PART 1</code>), que não são texto: são tiles cravados no código e em tilemaps crus.","en":"<b>What no text sweep finds</b> — the population counter, the character-sheet stats and the chapter card (<code>PART 1</code>), which are not text: they are tiles hard-coded in the program and in raw tilemaps.","es":"<b>Lo que ningún barrido de texto encuentra</b> — el contador de población, los atributos de las fichas de personaje y la tarjeta de capítulo (<code>PART 1</code>), que no son texto: son tiles incrustados en el código y en tilemaps crudos."}}]},{"titulo":{"pt":"O que falta","en":"What is left","es":"Lo que falta"},"itens":[{"t":{"pt":"<b>Jogar do começo ao fim.</b> É o único item aberto, e é o que separa a etiqueta de hoje da release: medição não substitui partida. Uma varredura tela a tela, sempre em boot limpo, não achou japonês em nenhuma — mas varredura vê as telas por onde ela passou.","en":"<b>Playing it start to finish.</b> It is the only open item, and it is what separates today’s label from a release: measurement does not stand in for a playthrough. A screen-by-screen sweep, always from a clean boot, found Japanese on none of them — but a sweep only sees the screens it walked through.","es":"<b>Jugarlo de principio a fin.</b> Es el único punto abierto, y es lo que separa la etiqueta de hoy de la release: la medición no sustituye a una partida. Un barrido pantalla por pantalla, siempre desde un arranque limpio, no encontró japonés en ninguna — pero un barrido solo ve las pantallas por las que pasó."}},{"t":{"pt":"<b>Português e espanhol</b>, que ainda não começaram — o caminho já está aberto pelo inglês.","en":"<b>Portuguese and Spanish</b>, which have not started — the path is already cut by the English build.","es":"<b>Portugués y español</b>, que aún no han empezado — el camino ya está abierto por el inglés."}}]}],"patch":{"versoes":{"en":{"arquivo":"gaia-saver-en.ips","tamanho":"180 KB"},"pt":null,"es":null},"rom":"Gaia Saver - Hero Saidai no Sakusen (Japan).sfc","rom_md5":"0ab069047f1b03983241c014f8378555"},"fotos":[{"f":"gaia/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em latinas, com o subtítulo <code>THE GREATEST HERO OPERATION</code> na faixa.","en":"The logo redrawn in Latin letters, with the <code>THE GREATEST HERO OPERATION</code> subtitle on the band.","es":"El logo redibujado en latinas, con el subtítulo <code>THE GREATEST HERO OPERATION</code> en la banda."}},{"f":"gaia/02-abertura.png","t":{"pt":"A abertura, em inglês","en":"The opening, in English","es":"La apertura, en inglés"},"c":{"pt":"O prólogo do jogo rodando traduzido, sobre a arte original — meia largura, 32 colunas.","en":"The game’s prologue running translated, over the original artwork — half-width, 32 columns.","es":"El prólogo del juego corriendo traducido, sobre el arte original — media anchura, 32 columnas."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"nekketsu-kakutou-densetsu","nome":"Nekketsu Kakutou Densetsu","subtitulo":"Fighting Legend","jp":"熱血格闘伝説","publisher":"Technos Japan","dev":"Technos Japan","ano":1992,"data":"1992","sistema":"Famicom","mapper":"MMC3 · expansão 128→256 KB provada","categoria":{"pt":"Tradução + arte","en":"Translation + artwork","es":"Traducción + arte"},"nivel":"beta","capa":"nk/00-capa-patreon.jpg","linha":{"pt":"A série de brigões de colégio que o Ocidente conheceu como River City Ransom. Este é o de luta: 19 combates em duplas, quatro jogadores na mesa.","en":"The school-brawler series the West met as River City Ransom. This one is the fighter: 19 tag bouts, four players on one Famicom.","es":"La serie de matones de instituto que Occidente conoció como River City Ransom. Este es el de lucha: 19 combates por parejas, cuatro jugadores."},"resumo":{"pt":["No Japão o Kunio é uma instituição: o brigão de colégio que virou uma família inteira de jogos da Technos. O Ocidente conheceu um deles com outro nome e outro elenco, <i>River City Ransom</i>. Este, de 1992, é o de luta — o modo história são <b>19 combates em duplas</b>, com quinze vitórias até o chefe, o modo batalha aceita <b>até quatro jogadores</b> pelo adaptador do Famicom, e o lutador que você inventa guarda nome, aniversário e tipo sanguíneo dentro da senha.","O texto está inteiro em inglês: <b>266 strings</b>, traduzidas do zero e revisadas linha a linha, com o validador em zero erro. Para escrevê-las foi desenhada uma <b>fonte latina completa</b> — a-z e pontuação — em <b>81 tiles novos</b>, deixando <b>175 tiles do original intactos</b>, e o logo do título saiu refeito em latinas como <code>NEKKETSU / FIGHTING LEGEND</code>.","O texto deste jogo cabe em <b>6.120 bytes e não tem compressão nenhuma</b>: cada frase ocupa exatamente o que escreve, então não há dicionário de onde tirar folga — é a fonte e a expansão da ROM, de <b>128 para 256 KB</b>, que abrem lugar, e por isso vieram antes. A expansão foi provada pelo caminho mais duro que existe: uma build que só move o texto japonês, sem traduzir nada, sai <b>idêntica à original</b>. E o inglês está confirmado na ROM rodando, não em simulação — a build de teste abre no portão do colégio com a primeira fala na fonte nova: <i>The gates of Nekketsu High.</i> Não há patch para instalar; esta página é para acompanhar."],"en":["In Japan, Kunio is an institution: the school brawler who grew into a whole family of Technos games. The West met one of them under another name and another cast, <i>River City Ransom</i>. This one, from 1992, is the fighter — story mode is <b>19 tag bouts</b>, fifteen wins to reach the boss, battle mode takes <b>up to four players</b> through the Famicom adapter, and the fighter you invent keeps his name, birthday and blood type inside the password.","The text is entirely in English: <b>266 strings</b>, translated from scratch and reviewed line by line, with the validator at zero errors. Writing them meant drawing a <b>complete Latin font</b> — a-z and punctuation — across <b>81 new tiles</b>, leaving <b>175 of the original tiles untouched</b>, and the title logo was remade in Latin letters as <code>NEKKETSU / FIGHTING LEGEND</code>.","This game's text fits in <b>6,120 bytes with no compression at all</b>: every line occupies exactly what it writes, so there is no dictionary to squeeze slack out of — the font and the ROM expansion, from <b>128 to 256 KB</b>, are what open room, which is why they came first. That expansion was proved the hardest way there is: a build that only moves the Japanese text, translating none of it, comes out <b>identical to the original</b>. And English is confirmed on the running ROM, not in simulation — the test build opens at the school gate with its first line in the new font: <i>The gates of Nekketsu High.</i> There is no patch to install; this page is here to follow along."],"es":["En Japón, Kunio es una institución: el matón de instituto que se convirtió en toda una familia de juegos de Technos. Occidente conoció a uno de ellos con otro nombre y otro reparto, <i>River City Ransom</i>. Este, de 1992, es el de lucha — el modo historia son <b>19 combates por parejas</b>, con quince victorias hasta el jefe, el modo batalla admite <b>hasta cuatro jugadores</b> por el adaptador del Famicom, y el luchador que te inventas guarda nombre, cumpleaños y grupo sanguíneo dentro de la contraseña.","El texto está entero en inglés: <b>266 cadenas de texto</b>, traducidas de cero y revisadas línea a línea, con el validador sin un solo error. Para escribirlas se dibujó una <b>fuente latina completa</b> — la a-z y la puntuación — en <b>81 tiles nuevos</b>, dejando <b>175 tiles del original intactos</b>, y el logo del título salió rehecho en letras latinas como <code>NEKKETSU / FIGHTING LEGEND</code>.","El texto de este juego cabe en <b>6.120 bytes, sin compresión de ningún tipo</b>: cada frase ocupa exactamente lo que escribe, así que no hay diccionario del que sacar holgura — son la fuente y la ampliación de la ROM, de <b>128 a 256 KB</b>, las que abren sitio, y por eso vinieron antes. La ampliación se probó por el camino más duro que existe: una compilación que solo mueve el texto japonés, sin traducir nada, sale <b>idéntica a la original</b>. Y el inglés está confirmado con la ROM en marcha, no en simulación — la compilación de prueba abre en la puerta del instituto con la primera frase en la fuente nueva: <i>The gates of Nekketsu High.</i> No hay parche que instalar; esta página es para seguir el proyecto."]},"numeros":[{"v":"266","r":{"pt":"strings, todas traduzidas","en":"strings, all translated","es":"strings, todas traducidas"}},{"v":"81","r":{"pt":"tiles novos de fonte latina","en":"new Latin font tiles","es":"tiles nuevos de fuente latina"}},{"v":"175","r":{"pt":"tiles originais intactos","en":"original tiles untouched","es":"tiles originales intactos"}},{"v":"0","r":{"pt":"erros no validador","en":"errors in the validator","es":"errores en el validador"}}],"grupos":[{"titulo":{"pt":"O que já está provado","en":"What is already proved","es":"Lo que ya está probado"},"itens":[{"t":{"pt":"<b>Tradução completa</b> — 266 strings, revisadas linha a linha, com o validador em zero erro.","en":"<b>Translation complete</b> — 266 strings, reviewed line by line, with the validator at zero errors.","es":"<b>Traducción completa</b> — 266 strings, revisadas línea por línea, con el validador en cero errores."}},{"t":{"pt":"<b>Fonte latina completa</b>: a-z e pontuação, em 81 tiles novos, com <b>175 tiles originais intactos</b>.","en":"<b>Complete Latin font</b>: a-z and punctuation, in 81 new tiles, with <b>175 original tiles untouched</b>.","es":"<b>Fuente latina completa</b>: a-z y puntuación, en 81 tiles nuevos, con <b>175 tiles originales intactos</b>."}},{"t":{"pt":"<b>Inglês confirmado em jogo.</b> A build de teste abre com a primeira fala na fonte nova — não é simulação, é a ROM rodando.","en":"<b>English confirmed in game.</b> The test build opens with the first line in the new font — not a simulation, the ROM running.","es":"<b>Inglés confirmado en juego.</b> La build de prueba abre con la primera frase en la fuente nueva — no es simulación, es la ROM corriendo."},"foto":"nk/02-jogo.png"},{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, no lugar do japonês.","en":"<b>Title logo redrawn</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, in place of the Japanese.","es":"<b>Logo del título redibujado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, en lugar del japonés."},"foto":"nk/01-titulo.png"},{"t":{"pt":"A expansão de 128 para 256 KB está <b>provada</b>, e o motor de inserção tem guarda: uma build que só move o texto japonês sai idêntica à original.","en":"The expansion from 128 to 256 KB is <b>proved</b>, and the insertion engine has a guard: a build that only moves the Japanese text comes out identical to the original.","es":"La ampliación de 128 a 256 KB está <b>probada</b>, y el motor de inserción tiene guarda: una build que solo mueve el texto japonés sale idéntica a la original."}}]},{"titulo":{"pt":"O que falta","en":"What is left","es":"Lo que falta"},"itens":[{"t":{"pt":"<b>A senha em alfabeto latino.</b> Ela é digitada em hiragana, e a fonte nova tomou justamente os slots de kana — sem converter o teclado, a senha sai misturada.","en":"<b>The password in Latin letters.</b> It is typed in hiragana, and the new font took exactly the kana slots — without converting the keyboard, the password comes out mixed.","es":"<b>La contraseña en alfabeto latino.</b> Se escribe en hiragana, y la fuente nueva tomó justamente los slots de kana — sin convertir el teclado, la contraseña sale mezclada."}},{"t":{"pt":"Gráficos que ainda são japoneses: a carta de desafio, as quatro faixas de estilo, os nomes dos dezesseis lutadores na seleção e o cabeçalho da escolha de estágio.","en":"Graphics that are still Japanese: the challenge letter, the four style banners, the sixteen fighters’ names on the select screen and the stage-select header.","es":"Gráficos que siguen en japonés: la carta de desafío, las cuatro bandas de estilo, los nombres de los dieciséis luchadores en la selección y el encabezado de la elección de escenario."}}]}],"patch":{"versoes":{"en":{"arquivo":"nekketsu-kakutou-densetsu-en.ips","tamanho":"154 KB"},"pt":null,"es":null},"rom":"Nekketsu Kakutou Densetsu (Japan).nes","rom_md5":"c56d957bbe700b422f97cd8fe4515c54"},"fotos":[{"f":"nk/01-titulo.png","t":{"pt":"Título redesenhado","en":"Redrawn title","es":"Título redibujado"},"c":{"pt":"<code>NEKKETSU / FIGHTING LEGEND</code> — o logo japonês refeito em latinas.","en":"<code>NEKKETSU / FIGHTING LEGEND</code> — the Japanese logo remade in Latin letters.","es":"<code>NEKKETSU / FIGHTING LEGEND</code> — el logo japonés rehecho en letras latinas."}},{"f":"nk/02-jogo.png","t":{"pt":"Inglês em jogo","en":"English in game","es":"Inglés en juego"},"c":{"pt":"A primeira fala na fonte nova, na ROM rodando: “The gates of Nekketsu High.”","en":"The first line in the new font, on the running ROM: “The gates of Nekketsu High.”","es":"La primera frase en la fuente nueva, en la ROM corriendo: “The gates of Nekketsu High.”"}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"andamento","testes":"andamento","longplay":"nao"}},{"slug":"captain-tsubasa","nome":"Captain Tsubasa","subtitulo":"Tecmo Theater Vol. 1","jp":"キャプテン翼","publisher":"Tecmo","dev":"Tecmo","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 · 128 KB PRG expanded to 256 KB · 128 KB CHR-ROM","categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"alfa","capa":"ct/00-capa-patreon.jpg","linha":{"pt":"Super Campeões, o futebol por menu de 1988 — com Benji no gol, Neia na gerência e o Treinador Milani no banco, como na Manchete.","en":"The 1988 game that invented football by menu. Sixteen Latin letters existed in the whole cartridge, and it now saves to battery.","es":"En España este fútbol por menú de 1988 perdió la licencia y Tsubasa se volvió Robin Field. Este parche traduce el cartucho japonés."},"resumo":{"pt":["Você não chuta: você escolhe. Cada lance é um item de menu, a animação decide o resto, e o <b>Guts</b> de cada jogador desce a cada drible, passe e finalização. Tecmo, 1988 — é daqui que descende todo futebol por turnos que veio depois, e no Brasil a série chegou como <b>Super Campeões</b>.","O Brasil nunca dublou a série de 1983, que é o arco deste jogo. O que existe em português brasileiro é o elenco da <i>Captain Tsubasa J</i>, que a Manchete exibiu em 1997, e é ele que a versão em português usa: <b>BENJI</b> no gol, <b>NEIA</b> na gerência, o <b>Treinador MILANI</b> no banco — os três que cabem no campo de cinco colunas da tela. Na prosa entram também <b>Oliver</b>, <b>Carlos</b> e <b>Roberto Maravilha</b>, cujos nomes brasileiros não cabiam ali. Em inglês as grafias seguem a edição oficial da Viz e do anime — Ozora, Hyuga, Schneider, Elle Sid Pierre —, e <b>Guts continua Guts</b>, porque é marca da série.","Duas coisas mudaram no jeito de jogar. O original de 1988 devolvia uma <b>senha para anotar no papel</b>, e digitá-la de volta era o único caminho de continuar; agora o <code>Salvar</code> do menu do técnico <b>grava no cartucho</b> e o <code>CONTINUE</code> carrega, com a tela de senha ainda ali para quem segurar <b>B</b>. Não há formato de save inventado: ficam gravados exatamente os <b>24 bytes</b> que a senha já descrevia, conferidos pela mesma rotina que valida senha digitada, em <b>97 bytes</b> de código novo. E a caixa de narração dobrou — um código de controle novo faz cada linha de roteiro ocupar duas fileiras, de <b>14 para 28 colunas</b> nas janelas da partida e de <b>18 para 36</b> nas maiores, sem tocar na moldura nem na contagem de linhas. A fonte teve de ser desenhada: no cartucho inteiro existiam <b>dezesseis letras latinas</b>, <code>ACDEFGHIKMRSUVWY</code>, e as outras nasceram do zero em 74 tiles. Que mover o texto não quebrou nada foi provado por igualdade: <b>225 dumps, 0 bytes diferentes</b> contra a ROM original."],"en":["You never shoot: you choose. Every play is a menu item, the animation decides the rest, and each player's <b>Guts</b> drains on every dribble, pass and shot. Tecmo, 1988 — every turn-based football game since descends from this one, and in Brazil the series arrived as <b>Super Campeões</b>.","The English spellings follow the official editions — Viz, the anime, <i>Dream Team</i>: Ozora, Hyuga, Jito, Karl Heinz Schneider, Elle Sid Pierre. <b>Guts stays Guts</b>, because it is a mark of the series. The squad is all there, from Tsubasa to the keeper Wakabayashi, with Nankatsu, the Japanese national side and the foreigners of the international tournament. The Portuguese build goes somewhere else entirely: Brazil never dubbed the 1983 series that this game covers, so it uses the cast of <i>Captain Tsubasa J</i>, which Rede Manchete aired in 1997 — <b>BENJI</b>, <b>NEIA</b> and <b>Coach MILANI</b> on screen, with Oliver, Carlos and Roberto Maravilha in the prose.","Two things changed in how it plays. The 1988 original handed you a <b>password to copy onto paper</b>, and typing it back was the only way to continue; now <code>SAVE</code> in the coach's menu <b>writes to the cartridge</b> and <code>CONTINUE</code> loads it, with the password screen still there for anyone holding <b>B</b>. No save format was invented: what gets stored is exactly the <b>24 bytes</b> the password already described, checked by the same routine that validates a typed password, in <b>97 bytes</b> of new code. And the commentary box doubled — a new control code makes each script line take two rows, from <b>14 to 28 columns</b> in the match windows and from <b>18 to 36</b> in the larger ones, without touching the frame or the line count. The font had to be drawn: exactly <b>sixteen Latin letters</b> existed in the whole cartridge, <code>ACDEFGHIKMRSUVWY</code>, and the rest were built from nothing across 74 tiles. That moving the text broke nothing was proved by equality: <b>225 dumps, 0 differing bytes</b> against the original ROM."],"es":["No disparas: eliges. Cada jugada es un elemento de menú, la animación decide el resto, y el <b>Guts</b> de cada jugador baja con cada regate, pase y tiro. Tecmo, 1988 — de aquí desciende todo el fútbol por turnos que vino después.","En España este cartucho sí llegó, en 1993, y llegó cambiado: se publicó como <i>Tecmo Cup Football Game</i>, con la licencia retirada, el protagonista convertido en <b>Robin Field</b>, rubio y adulto, y hasta las selecciones cambiadas de país. Esta traducción parte del japonés y se queda con él: <b>TSUBASA</b>, <b>HYUGA</b>, <b>WAKABAYASHI</b>, <b>MISAKI</b>, <b>SCHNEIDER</b>, <b>PIERRE</b>, con Nankatsu, la selección japonesa y los extranjeros del torneo internacional, y <b>Guts sigue siendo Guts</b>, porque es marca de la serie. La versión en portugués va a otro sitio: Brasil nunca dobló la serie de 1983, que es el arco de este juego, así que usa el reparto de <i>Captain Tsubasa J</i>, que Rede Manchete emitió en 1997 — <b>BENJI</b>, <b>NEIA</b> y el <b>Entrenador MILANI</b> en pantalla, en el campo de cinco columnas.","Dos cosas cambiaron en la forma de jugar. El original de 1988 devolvía una <b>contraseña para anotar en papel</b>, y escribirla de vuelta era el único camino para continuar; ahora <code>GRABAR</code>, en el menú del entrenador, <b>graba en el cartucho</b> y el <code>CONTINUE</code> carga, con la pantalla de contraseña ahí para quien mantenga pulsada la <b>B</b>. No se inventó ningún formato de guardado: quedan grabados exactamente los <b>24 bytes</b> que la contraseña ya describía, comprobados por la misma rutina que valida una contraseña escrita, en <b>97 bytes</b> de código nuevo. Y la caja de narración se dobló — un código de control nuevo hace que cada línea de guion ocupe dos filas, de <b>14 a 28 columnas</b> en las ventanas del partido y de <b>18 a 36</b> en las mayores, sin tocar el marco ni el conteo de líneas. La fuente hubo que dibujarla: en todo el cartucho existían <b>dieciséis letras latinas</b>, <code>ACDEFGHIKMRSUVWY</code>, y las demás nacieron de cero en 74 tiles. Que mover el texto no rompiera nada se probó por igualdad: <b>225 volcados, 0 bytes distintos</b> contra la ROM original."]},"numeros":[{"v":"1,001","r":{"pt":"itens de texto inseridos","en":"text items inserted","es":"elementos de texto insertados"}},{"v":"1,177","r":{"pt":"ponteiros corrigidos","en":"pointers corrected","es":"punteros corregidos"}},{"v":"16","r":{"pt":"letras latinas existiam","en":"Latin letters existed","es":"letras latinas existían"}},{"v":"0","r":{"pt":"bytes divergentes em 225 dumps","en":"bytes differing across 225 dumps","es":"bytes distintos en 225 volcados"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.001 itens de texto</b> em inglês, com <b>1.177 ponteiros</b> recalculados","en":"<b>1,001 text items</b> in English, with <b>1,177 pointers</b> recalculated","es":"<b>1.001 elementos de texto</b> en inglés, con <b>1.177 punteros</b> recalculados"},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Fonte inglesa nova de 74 tiles.</b> No cartucho inteiro existiam exatamente <b>dezesseis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. As outras dez, mais as minúsculas e a pontuação, não existiam em lugar nenhum e tiveram de ser desenhadas do zero, casando com tipos feitos para kana.","en":"<b>A new 74-tile English font.</b> Across the entire cartridge there were exactly <b>sixteen Latin letters</b> — <code>ACDEFGHIKMRSUVWY</code>. The other ten, plus the lower case and the punctuation, did not exist anywhere and had to be drawn from nothing, matched to typefaces designed for kana.","es":"<b>Una fuente inglesa nueva de 74 tiles.</b> En todo el cartucho existían exactamente <b>dieciséis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. Las otras diez, más las minúsculas y la puntuación, no existían en ninguna parte y hubo que dibujarlas de cero, casando con tipografías hechas para kana."}},{"t":{"pt":"<b>Três fontes em três bancos gráficos diferentes</b>, que não concordam entre si — a do campo, a da sala de aula e a da senha.","en":"<b>Three separate fonts living in three different graphics banks</b>, none of which agree with each other — the pitch, the classroom and the password screen.","es":"<b>Tres fuentes en tres bancos gráficos distintos</b>, que no concuerdan entre sí — la del campo, la del aula y la de la contraseña."},"foto":"ct/02-sala.png"},{"t":{"pt":"<b>Ficha do jogador em inglês</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","en":"<b>Player cards in English</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","es":"<b>Fichas de jugador en inglés</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark"},"foto":"ct/04-ficha.png"}]},{"titulo":{"pt":"Duas fileiras onde havia uma","en":"Two rows where there was one","es":"Dos filas donde había una"},"itens":[{"t":{"pt":"O motor de texto do campo escrevia <b>uma fileira</b> por linha de roteiro: 14 e 18 colunas. Um código de controle novo faz cada linha ocupar <b>duas fileiras</b> — <b>28 e 36 colunas</b> — sem mexer no roteiro, na moldura, nem na contagem de linhas. É o que dá espaço para a narração inglesa caber sem virar telegrama.","en":"The pitch text engine wrote <b>one row</b> per script line: 14 and 18 columns. A new control code makes each line occupy <b>two rows</b> — <b>28 and 36 columns</b> — without touching the script, the frame, or the line count. It is what lets English commentary fit without turning into a telegram.","es":"El motor de texto del campo escribía <b>una fila</b> por línea de guion: 14 y 18 columnas. Un código de control nuevo hace que cada línea ocupe <b>dos filas</b> — <b>28 y 36 columnas</b> — sin tocar el guion, el marco ni el conteo de líneas. Es lo que permite que la narración inglesa quepa sin volverse telegrama."},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Senha latinizada e aceita.</b> A grade virou letras latinas maiúsculas, minúsculas e dígitos, e a senha gerada passa pela rotina de validação original do jogo.","en":"<b>The password screen latinised, and accepted.</b> The grid became Latin capitals, lower case and digits, and a generated password passes the game’s own validation routine.","es":"<b>Contraseña latinizada y aceptada.</b> La rejilla pasó a letras latinas mayúsculas, minúsculas y cifras, y la contraseña generada pasa por la rutina de validación original del juego."},"foto":"ct/06-senha.png"}]},{"titulo":{"pt":"Um save que o jogo não tinha","en":"A save the game never had","es":"Un guardado que el juego no tenía"},"itens":[{"t":{"pt":"O original de 1988 guarda progresso <b>só por senha</b>. Agora o jogo <b>grava em bateria</b>: salva ao escolher <code>Salvar</code> no menu do técnico e carrega no <code>CONTINUE</code> da tela de título.","en":"The 1988 original keeps progress <b>by password only</b>. Now the game <b>writes to battery-backed save</b>: it saves when you pick <code>SAVE</code> in the coach’s menu and loads on <code>CONTINUE</code> at the title screen.","es":"El original de 1988 guarda el progreso <b>solo por contraseña</b>. Ahora el juego <b>graba con pila</b>: guarda al elegir <code>GRABAR</code> en el menú del entrenador y carga en el <code>CONTINUE</code> de la pantalla de título."},"foto":"ct/07-memo.png"},{"t":{"pt":"<b>Nada de serialização nova.</b> O estado guardado é exatamente o que a senha já guardava — os mesmos 24 bytes — provado por duas rotinas independentes do próprio jogo. A integridade usa <b>a mesma rotina que valida senha digitada</b>.","en":"<b>No new serialisation.</b> The state saved is exactly what the password already carried — the same 24 bytes — proved against two independent routines in the game itself. Integrity checking uses <b>the same routine that validates a typed password</b>.","es":"<b>Sin inventar serialización.</b> El estado guardado es exactamente lo que la contraseña ya llevaba — los mismos 24 bytes — probado contra dos rutinas independientes del propio juego. La integridad usa <b>la misma rutina que valida una contraseña escrita</b>."},"foto":"ct/08-save.png"},{"t":{"pt":"São <b>97 bytes</b> de código novo em seis lugares. Testado desligando e ligando de verdade, com dois processos de emulador e um <code>.sav</code> real no meio: <b>0 de 4.096 bytes</b> de nametable diferentes depois do ciclo. Negativos cobertos: sem save, save corrompido em 1 bit, bateria gasta, e começar jogo novo sem apagar o save.","en":"It is <b>97 bytes</b> of new code in six places. Tested by really powering off and on, with two emulator processes and a real <code>.sav</code> in between: <b>0 of 4,096 bytes</b> of nametable differ after the cycle. Negatives covered: no save, save corrupted by one bit, dead battery, and starting a new game without erasing the save.","es":"Son <b>97 bytes</b> de código nuevo en seis sitios. Probado apagando y encendiendo de verdad, con dos procesos de emulador y un <code>.sav</code> real de por medio: <b>0 de 4.096 bytes</b> de nametable distintos tras el ciclo. Negativos cubiertos: sin guardado, guardado corrupto en 1 bit, pila gastada, y empezar partida nueva sin borrar lo guardado."}}]},{"titulo":{"pt":"Os logos","en":"The logos","es":"Los logos"},"itens":[{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>CAPTAIN TSUBASA</code> em duas linhas, no mesmo estilo e na mesma paleta, com a bola redesenhada e o avião movido para o canto. São <b>122 tiles</b> nos 127 disponíveis, e a tela reconstruída da ROM bate com o mockup em <b>0 pixels</b> de diferença.","en":"<b>The title logo redrawn</b> — <code>CAPTAIN TSUBASA</code> on two lines, in the same style and palette, with the ball redrawn and the aeroplane moved to the corner. It is <b>122 tiles</b> in the 127 available, and the screen reconstructed from the ROM matches the mockup at <b>0 pixels</b> of difference.","es":"<b>Logo del título redibujado</b> — <code>CAPTAIN TSUBASA</code> en dos líneas, en el mismo estilo y la misma paleta, con el balón redibujado y el avión movido a la esquina. Son <b>122 tiles</b> de los 127 disponibles, y la pantalla reconstruida desde la ROM coincide con el mockup con <b>0 píxeles</b> de diferencia."},"foto":"ct/01-titulo.png"},{"t":{"pt":"<b>O logo pequeno da sala de aula</b>, feito de 13 sprites, redesenhado como <code>TSUBASA</code> em miniatura — só os bitmaps mudam, as posições são as do jogo.","en":"<b>The small classroom logo</b>, made of 13 sprites, redrawn as a miniature <code>TSUBASA</code> — only the bitmaps change, the positions are the game’s own.","es":"<b>El logo pequeño del aula</b>, hecho de 13 sprites, redibujado como <code>TSUBASA</code> en miniatura — solo cambian los bitmaps, las posiciones son las del juego."}}]},{"titulo":{"pt":"Como se provou que nada quebrou","en":"How it was proved nothing broke","es":"Prueba, y lo que sigue abierto"},"itens":[{"t":{"pt":"<b>A relocação foi provada por igualdade.</b> Uma build que só move o texto japonês, sem traduzir nada, foi comparada com a ROM original: <b>225 dumps, 0 bytes diferentes</b> em nametable, OAM e paleta no percurso inteiro. Se mover o texto tivesse quebrado alguma coisa, essa build já mostraria.","en":"<b>Relocation was proved by equality.</b> A build that only moves the Japanese text, translating nothing, was compared against the original ROM: <b>225 dumps, 0 bytes differing</b> in nametable, OAM and palette across the whole run. If moving the text had broken anything, that build would already show it.","es":"<b>La reubicación se probó por igualdad.</b> Una compilación que solo mueve el texto japonés, sin traducirlo, se comparó con la original: <b>225 volcados, 0 bytes distintos</b> en nametable, OAM y paleta en todo el recorrido. Dos defectos reales aparecieron solo en esa prueba."}},{"t":{"pt":"<b>Dois defeitos reais só apareceram nesse teste</b>, e não em nenhum outro: uma rotina que trocava de banco por byte estourava o quadro e fazia sumir uma linha do torneio, e uma string que mora na RAM — e que o jogo <b>escreve</b> — fazia os números das camisas saírem errados. Nenhum dos dois apareceria numa leitura de código.","en":"<b>Two real defects showed up only in that test</b>, and in no other: a routine switching banks byte by byte overran the frame and made a line of the tournament vanish, and a string that lives in RAM — and that the game <b>writes to</b> — made the shirt numbers come out wrong. Neither would have shown up in a code review.","es":"Sigue abierto: el <b>motor de créditos</b> no está reubicado, la pantalla de <b>error de contraseña</b> tiene 19 caracteres fijos en el código, y la lista de nombres del <b>final</b> aún debe cambiar de columna. Por eso la etiqueta es <b>beta</b>, y no lanzamiento."}},{"t":{"pt":"O save novo foi testado <b>desligando e ligando de verdade</b>, com dois processos de emulador e um arquivo de save real de permeio — não com savestate, que não prova bateria nenhuma.","en":"The new save was tested by <b>really powering off and on</b>, with two emulator processes and a real save file in between — not with a savestate, which proves nothing about a battery.","es":"El guardado nuevo se probó <b>apagando y encendiendo de verdad</b>, con dos procesos de emulador y un archivo de guardado real de por medio — no con un savestate, que no prueba nada sobre la pila."}}]}],"patch":{"versoes":{"en":{"arquivo":"captain-tsubasa-en.ips","tamanho":"164 KB"},"pt":{"arquivo":"captain-tsubasa-pt.ips","tamanho":"163 KB"},"es":{"arquivo":"captain-tsubasa-es.ips","tamanho":"164 KB"}},"rom":"Captain Tsubasa (Japan).nes","rom_md5":"eeb77e6e0e0b5695f9a35f47979c4722"},"fotos":[{"f":"ct/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em 122 tiles, com a bola nova e o avião no canto.","en":"The logo redrawn in 122 tiles, with the new ball and the aeroplane in the corner.","es":"El logo redibujado en 122 tiles, con el balón nuevo y el avión en la esquina."}},{"f":"ct/03-narrador.png","t":{"pt":"Narração","en":"Commentary","es":"Narración"},"c":{"pt":"Quatro linhas onde cabiam duas: o código de controle novo dobra a largura útil.","en":"Four lines where two used to fit: the new control code doubles the usable width.","es":"Cuatro líneas donde cabían dos: el código de control nuevo dobla el ancho útil."}},{"f":"ct/02-sala.png","t":{"pt":"Sala de aula","en":"Classroom","es":"Aula"},"c":{"pt":"O menu do técnico — <code>Info</code>, <code>Salvar</code>, <code>Jogar</code> — e a segunda fonte do jogo.","en":"The coach’s menu — <code>SCOUT</code>, <code>SAVE</code>, <code>PLAY</code> — and the game’s second font.","es":"El menú del entrenador — <code>DATOS</code>, <code>GRABAR</code>, <code>JUGAR</code> — y la segunda fuente del juego."}},{"f":"ct/04-ficha.png","t":{"pt":"Ficha do jogador","en":"Player card","es":"Ficha del jugador"},"c":{"pt":"Level, Max Guts e os seis atributos, com a lista do elenco ao lado.","en":"Level, Max Guts and the six stats, with the squad list beside it.","es":"Level, Max Guts y los seis atributos, con la lista de la plantilla al lado."}},{"f":"ct/05-jogo.png","t":{"pt":"Em jogo","en":"In play","es":"En juego"},"c":{"pt":"O menu de ação durante a partida, com o Guts descendo a cada jogada.","en":"The action menu during a match, with Guts draining on every play.","es":"El menú de acción durante el partido, con el Guts bajando en cada jugada."}},{"f":"ct/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"A grade latinizada — e a senha gerada passa na validação original do jogo.","en":"The latinised grid — and a generated password passes the game’s own validation.","es":"La rejilla latinizada — y la contraseña generada pasa la validación original del juego."}},{"f":"ct/07-memo.png","t":{"pt":"Score Memo","en":"Score Memo","es":"Score Memo"},"c":{"pt":"O instante em que o jogo grava: a Sanae dá a senha, e o save vai junto.","en":"The moment the game saves: Sanae reads out the password, and the save goes with it.","es":"El instante en que el juego guarda: Sanae dicta la contraseña, y el guardado va con ella."}},{"f":"ct/08-save.png","t":{"pt":"Carregado da bateria","en":"Loaded from battery","es":"Cargado de la pila"},"c":{"pt":"Depois de desligar e ligar de verdade — <code>16a Copa Nacional Juvenil</code>, exatamente onde parou.","en":"After a real power cycle — <code>16th All-Japan Jr. Cup</code>, exactly where it stopped.","es":"Tras apagar y encender de verdad — <code>16th All-Japan Jr. Cup</code>, exactamente donde se quedó."}}],"etapas":{"direcao":"feito","traducao":"andamento","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"pocket-monsters-stadium","nome":"Pocket Monsters Stadium","subtitulo":"ポケモンスタジアム","jp":"ポケモンスタジアム","publisher":"Nintendo","dev":"Creatures","ano":1998,"data":"1998","sistema":"Nintendo 64","mapper":"16 MB · compressão Yay0 · Transfer Pak","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"pms64/00-capa-patreon.jpg","linha":{"pt":"Houve um Stadium antes do Stadium: o japonês de 1998, que nunca saiu do Japão — e o Ocidente jogou outro jogo, não outra edição.","en":"There was a Stadium before the Stadium: the 1998 Japanese one, which never left Japan — and the West played a different game, not another edition.","es":"Hubo un Stadium antes del Stadium: el japonés de 1998, que nunca salió de Japón — y Occidente jugó a otro juego, no a otra edición."},"resumo":{"pt":["Quase todo mundo de certa idade jogou <i>Pokémon Stadium</i> no Nintendo 64. Quase ninguém sabe que houve um antes dele: este cartucho, de <b>1998</b>, que se identifica como <code>POKEMON STADIUM</code> com país <code>J</code> e ficou no Japão. Que são dois jogos, e não duas edições do mesmo, está <b>medido</b>: o contêiner de texto do motor do Stadium ocidental — que é o Stadium 2 japonês — dá <b>zero ocorrência</b> aqui, varridas a ROM inteira e os 790 blocos descomprimidos. O que este tem são <b>quatro copas</b> nomeadas pelas bolas, da Poké Ball à Master Ball, cada uma com a sua regra de nível — nenhum acima do <b>30</b>, ou os três somando no máximo <b>155</b>, ou nível livre —, com <b>seis inscritos e três em quadra</b>, e aluguel para quem não traz time. Há <b>narração de jogada</b>, <code>じっきょう</code>, ligável no menu e com banco de áudio só dela, <code>JIKKYOU.WBK</code>, ao lado do <code>POKEBANK.WBK</code> dos gritos. E o cartucho lê o seu: pelo <b>Transfer Pak</b> ele reconhece os cartuchos de Game Boy <b>Red, Green, Blue e Yellow</b>, e tem mensagem para quando você o tira no meio da partida.","A escala é outra, e o número que a mostra é a compressão. A ROM tem <b>16 MB</b>. O formato é <b>Yay0</b>, e só ele: nem MIO0, nem Yaz0, nem gzip. São <b>790 blocos válidos</b>, <b>8.803.425 bytes</b> comprimidos que devolvem <b>19.528.124</b> — razão de <b>2,22×</b>, ou seja, <i>mais do que o cartucho inteiro comporta</i>. Duzentos e quinze desses blocos são o contêiner de assets <code>FRAGMENT</code>, com tabela de relocação em endereços absolutos de RAM sobre a base <code>0x8FF00000</code>. E a primeira âncora dura de dado de jogo é a <b>tabela de atributos base</b>, em <code>0x66901</code>, <b>23 bytes por entrada</b>, ordenada por número da Pokédex — provada por três âncoras independentes: Bulbasaur com <b>45/49/49/45/65</b> na primeira entrada, Charmander exatamente <b>três</b> entradas depois, Mewtwo exatamente <b>149</b> depois.","O texto, ao contrário dos assets, está <b>em claro</b>: <b>EUC-JP</b>, terminado em NUL e alinhado a quatro bytes, com hiragana em <code>0xA4xx</code>, katakana em <code>0xA5xx</code> e kanji a partir de <code>0xB0A1</code>. O que o escondia era a faixa de bytes: uma varredura por Shift-JIS tinha devolvido <b>15.593 caracteres</b> que eram bytes repetidos de textura caindo por acaso na faixa válida. O banco principal é uma lista contínua e legível de cima a baixo — as <b>151 espécies</b> com nome e categoria (<code>フシギダネ</code> / <code>たね</code>), emendando direto nos nomes de golpe, nos estados e nos tipos. E o encoding trabalha a favor de quem traduz, porque em EUC-JP cada kana custa <b>dois</b> bytes e cada letra inglesa custa <b>um</b>: <b>144 dos 151 nomes de espécie cabem no espaço que o japonês deixou</b>, sem mexer em ponteiro nenhum. Os sete que não cabem são os nomes japoneses curtos de equivalente inglês comprido — <code>ラッタ</code> tem 8 e <code>RATICATE</code> pede 9, <code>プリン</code> tem 8 e <code>JIGGLYPUFF</code> pede 11. Um último traço do console, que barra edição feita de olho fechado: o CRC deste cartucho é <b>CIC-6103</b>, semente <code>0xA3886759</code> e combinador de soma, e o IPL3 dele <b>subtrai <code>0x100000</code> do ponto de entrada</b> — o cabeçalho diz <code>0x80100400</code> e o jogo roda em <code>0x80000400</code>. Esta página é para acompanhar o trabalho."],"en":["Almost everyone of a certain age played <i>Pokémon Stadium</i> on the Nintendo 64. Almost nobody knows there was one before it: this cartridge, from <b>1998</b>, which identifies itself as <code>POKEMON STADIUM</code> with country <code>J</code> and stayed in Japan. That these are two games, and not two editions of one, is <b>measured</b>: the text container used by the Western Stadium's engine — which is the Japanese Stadium 2 — returns <b>zero occurrences</b> here, across the whole ROM and all 790 decompressed blocks. What this one has is <b>four cups</b> named after the balls, from Poké Ball to Master Ball, each with its own level rule — none above <b>30</b>, or the three adding up to at most <b>155</b>, or no limit — with <b>six entered and three on the field</b>, and rentals for anyone who brings no team. There is <b>play-by-play</b>, <code>じっきょう</code>, switchable in the menu and with an audio bank of its own, <code>JIKKYOU.WBK</code>, beside the <code>POKEBANK.WBK</code> of the cries. And the cartridge reads yours: through the <b>Transfer Pak</b> it recognises the Game Boy carts <b>Red, Green, Blue and Yellow</b>, and it has a message for when you pull one out mid-match.","The scale is of another order, and the number that shows it is the compression. The ROM is <b>16 MB</b>. The format is <b>Yay0</b>, and only that: no MIO0, no Yaz0, no gzip. There are <b>790 valid blocks</b>, <b>8,803,425</b> compressed bytes that give back <b>19,528,124</b> — a ratio of <b>2.22×</b>, which is to say <i>more than the whole cartridge can hold</i>. Two hundred and fifteen of those blocks are the <code>FRAGMENT</code> asset container, with a relocation table in absolute RAM addresses over base <code>0x8FF00000</code>. And the first hard anchor into game data is the <b>base stats table</b>, at <code>0x66901</code>, <b>23 bytes per entry</b>, ordered by Pokédex number — proved by three independent anchors: Bulbasaur at <b>45/49/49/45/65</b> in the first entry, Charmander exactly <b>three</b> entries later, Mewtwo exactly <b>149</b> later.","The text, unlike the assets, sits <b>in the clear</b>: <b>EUC-JP</b>, NUL terminated and aligned to four bytes, with hiragana at <code>0xA4xx</code>, katakana at <code>0xA5xx</code> and kanji from <code>0xB0A1</code>. What hid it was the byte range: a Shift-JIS sweep had returned <b>15,593 characters</b> that were repeated texture bytes landing by chance inside the valid range. The main bank is one continuous list, readable top to bottom — the <b>151 species</b> with name and category (<code>フシギダネ</code> / <code>たね</code>), running straight on into the move names, the statuses and the types. And the encoding works in the translator's favour, because in EUC-JP a kana costs <b>two</b> bytes and an English letter costs <b>one</b>: <b>144 of the 151 species names fit in the room the Japanese left</b>, without touching a single pointer. The seven that do not are the short Japanese names with long English counterparts — <code>ラッタ</code> has 8 and <code>RATICATE</code> wants 9, <code>プリン</code> has 8 and <code>JIGGLYPUFF</code> wants 11. One last trait of the console, one that stops any edit made blind: this cartridge's CRC is <b>CIC-6103</b>, seed <code>0xA3886759</code> with a sum combiner, and its IPL3 <b>subtracts <code>0x100000</code> from the entry point</b> — the header says <code>0x80100400</code> and the game runs at <code>0x80000400</code>. This page is here to follow the work."],"es":["Casi todo el mundo de cierta edad jugó a <i>Pokémon Stadium</i> en la Nintendo 64. Casi nadie sabe que hubo uno antes: este cartucho, de <b>1998</b>, que se identifica como <code>POKEMON STADIUM</code> con país <code>J</code> y se quedó en Japón. Que son dos juegos, y no dos ediciones del mismo, está <b>medido</b>: el contenedor de texto del motor del Stadium occidental — que es el Stadium 2 japonés — da <b>cero ocurrencias</b> aquí, barridas la ROM entera y los 790 bloques descomprimidos. Lo que este tiene son <b>cuatro copas</b> nombradas por las bolas, de la Poké Ball a la Master Ball, cada una con su regla de nivel — ninguno por encima del <b>30</b>, o los tres sumando como mucho <b>155</b>, o nivel libre —, con <b>seis inscritos y tres en el campo</b>, y alquiler para quien no trae equipo. Hay <b>narración de jugada</b>, <code>じっきょう</code>, activable en el menú y con banco de audio propio, <code>JIKKYOU.WBK</code>, junto al <code>POKEBANK.WBK</code> de los gritos. Y el cartucho lee el tuyo: por el <b>Transfer Pak</b> reconoce los cartuchos de Game Boy <b>Red, Green, Blue y Yellow</b>, y tiene mensaje para cuando lo sacas en mitad de la partida.","La escala es de otro orden, y el número que la enseña es la compresión. La ROM tiene <b>16 MB</b>. El formato es <b>Yay0</b>, y solo ese: ni MIO0, ni Yaz0, ni gzip. Son <b>790 bloques válidos</b>, <b>8.803.425 bytes</b> comprimidos que devuelven <b>19.528.124</b> — una razón de <b>2,22×</b>, es decir, <i>más de lo que cabe en el cartucho entero</i>. Doscientos quince de esos bloques son el contenedor de recursos <code>FRAGMENT</code>, con tabla de reubicación en direcciones absolutas de RAM sobre la base <code>0x8FF00000</code>. Y el primer anclaje duro en datos de juego es la <b>tabla de atributos base</b>, en <code>0x66901</code>, <b>23 bytes por entrada</b>, ordenada por número de la Pokédex — probada por tres anclajes independientes: Bulbasaur con <b>45/49/49/45/65</b> en la primera entrada, Charmander exactamente <b>tres</b> entradas después, Mewtwo exactamente <b>149</b> después.","El texto, al contrario que los recursos, está <b>en claro</b>: <b>EUC-JP</b>, terminado en NUL y alineado a cuatro bytes, con hiragana en <code>0xA4xx</code>, katakana en <code>0xA5xx</code> y kanji a partir de <code>0xB0A1</code>. Lo que lo escondía era el rango de bytes: un barrido por Shift-JIS había devuelto <b>15.593 caracteres</b> que eran bytes repetidos de textura cayendo por casualidad dentro del rango válido. El banco principal es una lista continua y legible de arriba abajo — las <b>151 especies</b> con nombre y categoría (<code>フシギダネ</code> / <code>たね</code>), enlazando directamente con los nombres de golpe, los estados y los tipos. Y la codificación trabaja a favor de quien traduce, porque en EUC-JP cada kana cuesta <b>dos</b> bytes y cada letra inglesa cuesta <b>uno</b>: <b>144 de los 151 nombres de especie caben en el sitio que dejó el japonés</b>, sin tocar ni un puntero. Los siete que no caben son los nombres japoneses cortos de equivalente inglés largo — <code>ラッタ</code> tiene 8 y <code>RATICATE</code> pide 9, <code>プリン</code> tiene 8 y <code>JIGGLYPUFF</code> pide 11. Un último rasgo de la consola, que corta cualquier edición hecha a ciegas: el CRC de este cartucho es <b>CIC-6103</b>, semilla <code>0xA3886759</code> y combinador de suma, y su IPL3 <b>resta <code>0x100000</code> al punto de entrada</b> — la cabecera dice <code>0x80100400</code> y el juego corre en <code>0x80000400</code>. Esta página es para acompañar el trabajo."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"pocket-monsters-stadium-en.ips","tamanho":"248 KB"},"pt":null,"es":null},"rom":"Pocket Monsters Stadium (Japan).n64","rom_md5":"c46e087d966a35095df96799b0b4ffae"},"fotos":[{"f":"pms64/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O Stadium japonês de 1998.","en":"The Japanese Stadium of 1998.","es":"El Stadium japonés de 1998."}},{"f":"pms64/02-menu.png","t":{"pt":"Menu principal","en":"Main menu","es":"Menú principal"},"c":{"pt":"O menu do estádio, com o aviso de cartucho ausente.","en":"The stadium menu, with the missing-cartridge notice.","es":"El menú del estadio, con el aviso de cartucho ausente."}},{"f":"pms64/03-regras.png","t":{"pt":"Regras da copa","en":"Cup rules","es":"Reglas de la copa"},"c":{"pt":"Cada copa impõe as suas próprias regras de nível.","en":"Each cup sets its own level rules.","es":"Cada copa impone sus propias reglas de nivel."}},{"f":"pms64/04-transfer.png","t":{"pt":"O Transfer Pak","en":"The Transfer Pak","es":"El Transfer Pak"},"c":{"pt":"A bancada que lê o seu cartucho de Game Boy.","en":"The bench that reads your own Game Boy cartridge.","es":"El puesto que lee tu propio cartucho de Game Boy."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"andamento","testes":"andamento","longplay":"nao"}},{"slug":"gozonji","nome":"The Misadventures of Yaji &amp; Kita","subtitulo":"Gozonji: Yaji Kita Chin Douchuu","jp":"ご存知 弥次喜多珍道中","publisher":"HAL Laboratory","dev":"HYPERWARE","ano":1991,"data":"1991","sistema":"Famicom","mapper":"MMC1 convertido para MMC3 · 256 KB expandido para 512 KB · 128 KB CHR-ROM","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"gozonji/00-capa-patreon.jpg","linha":{"pt":"Dois amigos de Edo caem na estrada rumo a Ise, e não há parada sem confusão: a comédia da HAL pelas 53 estações do Tōkaidō.","en":"Two friends from Edo take the road to Ise, and no stop passes without trouble: HAL's comedy along the 53 stations of the Tōkaidō.","es":"Dos amigos de Edo se echan al camino rumbo a Ise, y no hay parada sin lío: la comedia de HAL por las 53 estaciones del Tōkaidō."},"resumo":{"pt":["<b>The Misadventures of Yaji &amp; Kita</b> — no cartucho, <i>Gozonji: Yaji Kita Chin Douchuu</i> — saiu da HAL Laboratory em 1991, e parte de um livro que todo japonês encontra na escola: o <i>Tōkaidōchū Hizakurige</i>, de Jippensha Ikku, em que dois moradores de Edo saem a pé rumo ao santuário de Ise e arrumam confusão em cada parada. Yaji e Kita são a dupla de estrada original, dois séculos antes de o cinema inventar o gênero. E o jogo não tem capítulos: ele <b>é</b> a estrada — as <b>53 estações do Tōkaidō</b>, uma de cada vez, com o roteiro repartido em nove blocos de peso parecido. O nome em inglês é a escolha desta tradução; o jogo nunca teve um, e o subtítulo da tela de título agora diz <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","A fala mora numa caixa de <b>16 caracteres por 4 linhas</b>, medida na nametable, e o cartucho é <b>kana puro, sem um único kanji</b>: varridas as 32 páginas de gráficos, existe uma fonte só. Sobre as casas de kana foram gravados <b>83 glifos latinos</b> — A-Z, a-z, dígitos e pontuação —, com os descendentes de <code>p g q y j</code> redesenhados assim que a prévia mostrou que a oitava linha do tile estava livre desde sempre. A compressão do jogo foi <b>reaproveitada em vez de contornada</b>: o motor carrega um <b>dicionário de 128 entradas</b>, que no original guarda os kana sonoros e palavras como
