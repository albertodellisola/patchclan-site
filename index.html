linhas de combate</b> uma a uma. Elas cabem por medição — nome mais mensagem em 22 colunas — mas nem todas foram vistas renderizadas.","en":"Checking the <b>146 battle lines</b> on screen, one by one. They fit by measurement — name plus message within 22 columns — but not all have been seen rendered.","es":"Comprobar en pantalla las <b>146 líneas de combate</b>, una a una."}}]}],"patch":{"versoes":{"en":{"arquivo":"ultraman-club-2-en.ips","tamanho":"158 KB"},"pt":null,"es":null},"rom":"Ultraman Club 2 - Kaettekita Ultraman Club (Japan).nes","rom_md5":"1e479bfe8e4d3c36de37dfb96aa8e68c"},"fotos":[{"f":"u2/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em 120 tiles. O limite não foi a CHR, foi o fluxo da nametable: 145 bytes fixos.","en":"The logo redrawn in 120 tiles. The limit was not the CHR but the nametable stream: a fixed 145 bytes.","es":"El logo redibujado en 120 tiles."}},{"f":"u2/02-creditos.png","t":{"pt":"Tela do patch","en":"Patch screen","es":"Pantalla del parche"},"c":{"pt":"358 bytes no vão livre do banco fixo, com o vetor de RESET desviado. O © é o glifo do próprio jogo — a fonte não tem parênteses.","en":"358 bytes in the free gap of the fixed bank, with the RESET vector diverted. The © is the game’s own glyph — the font has no parentheses.","es":"358 bytes en el hueco libre del banco fijo, con el vector de RESET desviado."}},{"f":"u2/03-encontro.png","t":{"pt":"Encontro","en":"Encounter","es":"Encuentro"},"c":{"pt":"O bestiário saiu do quarto bloco de texto — o que a análise da ROM original tinha descartado como dado binário.","en":"The bestiary came from the fourth text block — the one the original-ROM analysis had dismissed as binary data.","es":"El bestiario salió del cuarto bloque de texto."}},{"f":"u2/04-menu-batalha.png","t":{"pt":"Menu de batalha","en":"Battle menu","es":"Menú de combate"},"c":{"pt":"Os comandos cabem porque a caixa foi medida na tela: interior nas colunas 5 a 27, texto começando na 6.","en":"The commands fit because the box was measured on screen: interior from column 5 to 27, text starting at 6.","es":"Los comandos caben porque la caja se midió en pantalla."}},{"f":"u2/05-combate.png","t":{"pt":"Em combate","en":"In battle","es":"En combate"},"c":{"pt":"O jogo concatena nome e mensagem na mesma linha — o teto de 22 colunas vale para os dois somados.","en":"The game concatenates name and message on the same line — the 22-column ceiling applies to both together.","es":"El juego concatena nombre y mensaje en la misma línea."}}]},{"slug":"gaia-saver","nome":"Gaia Saver","subtitulo":"Hero Saidai no Sakusen","jp":"ガイアセイバー ヒーロー最大の作戦","traducao_titulo":"Hero's Greatest Operation","publisher":"Banpresto","dev":"Banpresto","ano":1993,"data":"1993","sistema":"Super Famicom","mapper":"SNES · ROM de 2 MB · fonte de 512 glifos 16×16 · ponteiros long de 24 bits","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"gaia/01-titulo.png","linha":{"pt":"Ultraman, Kamen Rider e Gundam no mesmo grupo: o herói gigante, o justiceiro de moto e os robôs pilotados, num RPG de Super Famicom.","en":"Ultraman, Kamen Rider and Gundam in one party: the giant hero, the masked rider and the piloted robots, in a single Super Famicom RPG.","es":"Ultraman, Kamen Rider y Gundam en el mismo grupo: el héroe gigante, el justiciero en moto y los robots pilotados, en un RPG de Super Famicom."},"resumo":{"pt":["São três franquias que no Japão têm o tamanho que os super-heróis americanos têm aqui, e quase ninguém fora de lá sabe que elas dividem um RPG. <b>Ultraman</b> é o herói gigante da televisão japonesa que aparece na hora do monstro; <b>Kamen Rider</b> é o justiceiro mascarado de motocicleta; <b>Gundam</b> são os robôs pilotados. A Banpresto pôs os três no mesmo grupo, num RPG de <b>Super Famicom</b> — o crossover <i>Compati Hero</i>, a linha em que os heróis gigantes encolhem para duas cabeças de altura e brigam lado a lado, sem que ninguém pare para explicar como.","O jogo foi desenhado para kana de largura cheia, e é isso que decide a tradução: medido no roteiro original, <b>98% das linhas japonesas cabem em 15 caracteres</b>. O inglês não vive nisso. A fonte foi refeita à <b>meia largura, 8 pixels por caractere</b>, e a caixa passou a comportar <b>29 colunas</b> — número medido na tela, não estimado: com 30 a página embaralha, com 29 renderiza limpa. O limite de <b>29 colunas por 3 linhas</b> é imposto por código a cada compilação, e a <b>tela de título</b> já mostra <code>GAIA SAVER</code> em latinas.","É o único projeto de Super Famicom da casa, e é outra classe de problema: <b>512 glifos de 16×16</b>, 497 entradas de tabela, ponteiros longos de 24 bits e uma ROM de 2 MB. O roteiro foi extraído inteiro — <b>1.884 mensagens</b>, 94,1 KB de texto — e o extrator faz o caminho de volta: <b>1.875 de 1.875 mensagens</b> voltam byte a byte iguais, que é como se prova que nenhuma fala ficou fora da tabela. Hoje o <b>diálogo está 100% traduzido</b> — as 1.884 mensagens — e com ele a interface inteira: os 81 nomes de item, os 22 golpes, as 39 descrições, a tela de save, os menus de configuração, os cinco rótulos do menu de campo, os atributos das fichas de personagem e o cartão de capítulo. Os <b>420 nomes</b> couberam em <b>5.375 dos 5.376 bytes</b> disponíveis, um byte de folga. A realocação segue <b>1.525 ponteiros confiáveis</b>, todos em tabelas de registros do banco <code>$06</code>; os 105 candidatos soltos foram deixados em paz depois de a análise mostrar que eram falsos positivos — um deles a própria instrução <code>LDA $218000,x</code>. Uma varredura tela a tela, feita sempre em boot limpo, não achou japonês em nenhuma delas. Falta o que nenhuma medição substitui: jogar do começo ao fim."],"en":["These are three franchises that in Japan carry the weight American superheroes carry here, and almost nobody outside knows they share an RPG. <b>Ultraman</b> is the giant hero of Japanese television who turns up when the monster does; <b>Kamen Rider</b> is the masked motorcycle vigilante; <b>Gundam</b> are the piloted robots. Banpresto put all three in one party, in a <b>Super Famicom</b> RPG — the <i>Compati Hero</i> crossover, the line where the giant heroes shrink to two heads tall and fight side by side, with nobody stopping to explain how.","The game was drawn for full-width kana, and that is what decides the translation: measured on the original script, <b>98% of the Japanese lines fit in 15 characters</b>. English does not live in that. The font was rebuilt at <b>half width, 8 pixels per character</b>, and the box came to hold <b>29 columns</b> — a number measured on screen rather than estimated: at 30 the page scrambles, at 29 it renders cleanly. The limit of <b>29 columns by 3 lines</b> is enforced in code on every build, and the <b>title screen</b> already reads <code>GAIA SAVER</code> in Latin letters.","It is the house's only Super Famicom project, and a different class of problem: <b>512 glyphs at 16×16</b>, 497 table entries, 24-bit long pointers and a 2 MB ROM. The script was extracted whole — <b>1,884 messages</b>, 94.1 KB of text — and the extractor makes the return trip: <b>1,875 of 1,875 messages</b> come back byte for byte identical, which is how you prove no line was left out of the table. The <b>dialogue is now 100% translated</b> — all 1,884 messages — and the whole interface with it: the 81 item names, the 22 techniques, the 39 descriptions, the save screen, the config menus, the five field-menu labels, the character-sheet stats and the chapter card. The <b>420 names</b> fit <b>5,375 of the 5,376 bytes</b> available, one byte to spare. Relocation follows <b>1,525 trustworthy pointers</b>, all in record tables in bank <code>$06</code>; the 105 loose candidates were left alone once analysis showed them to be false positives — one of them the instruction <code>LDA $218000,x</code> itself. A screen-by-screen sweep, always from a clean boot, found Japanese on none of them. What is left is the thing no measurement replaces: playing it start to finish."],"es":["Son tres franquicias que en Japón tienen el tamaño que aquí tienen los superhéroes americanos, y casi nadie fuera de allí sabe que comparten un RPG. <b>Ultraman</b> es el héroe gigante de la televisión japonesa que aparece a la hora del monstruo; <b>Kamen Rider</b> es el justiciero enmascarado en motocicleta; <b>Gundam</b> son los robots pilotados. Banpresto puso a los tres en el mismo grupo, en un RPG de <b>Super Famicom</b> — el crossover <i>Compati Hero</i>, la línea en la que los héroes gigantes encogen hasta dos cabezas de altura y pelean codo con codo, sin que nadie se pare a explicar cómo.","El juego se diseñó para kana de ancho completo, y eso es lo que decide la traducción: medido sobre el guion original, el <b>98% de las líneas japonesas cabe en 15 caracteres</b>. El inglés no cabe ahí. La fuente se rehízo a <b>media anchura, 8 píxeles por carácter</b>, y la caja pasó a admitir <b>29 columnas</b> — un número medido en pantalla, no estimado: con 30 la página se descuadra, con 29 se dibuja limpia. El límite de <b>29 columnas por 3 líneas</b> lo impone el código en cada compilación, y la <b>pantalla de título</b> ya muestra <code>GAIA SAVER</code> en letras latinas.","Es el único proyecto de Super Famicom de la casa, y es otra clase de problema: <b>512 glifos de 16×16</b>, 497 entradas de tabla, punteros largos de 24 bits y una ROM de 2 MB. El guion se extrajo entero — <b>1.884 mensajes</b>, 94,1 KB de texto — y el extractor hace el camino de vuelta: <b>1.875 de 1.875 mensajes</b> vuelven byte a byte iguales, que es como se prueba que ninguna frase quedó fuera de la tabla. Hoy el <b>diálogo está 100% traducido</b> — los 1.884 mensajes — y con él toda la interfaz: los 81 nombres de objeto, las 22 técnicas, las 39 descripciones, la pantalla de guardado, los menús de configuración, las cinco etiquetas del menú de campo, los atributos de las fichas de personaje y la tarjeta de capítulo. Los <b>420 nombres</b> cupieron en <b>5.375 de los 5.376 bytes</b> disponibles, un byte de holgura. La reubicación sigue <b>1.525 punteros fiables</b>, todos en tablas de registros del banco <code>$06</code>; los 105 candidatos sueltos se dejaron en paz después de que el análisis mostrara que eran falsos positivos — uno de ellos la propia instrucción <code>LDA $218000,x</code>. Un barrido pantalla por pantalla, hecho siempre desde un arranque limpio, no encontró japonés en ninguna. Falta lo que ninguna medición sustituye: jugarlo de principio a fin."]},"numeros":[{"v":"1.884","r":{"pt":"mensagens extraídas","en":"messages extracted","es":"mensajes extraídos"}},{"v":"100%","r":{"pt":"do diálogo traduzido","en":"of the dialogue translated","es":"del diálogo traducido"}},{"v":"1875/1875","r":{"pt":"round-trip byte-idêntico","en":"round-trip byte-identical","es":"round-trip byte-idéntico"}},{"v":"29×3","r":{"pt":"o limite de página, imposto no build","en":"the page limit, enforced at build","es":"el límite de página, impuesto en el build"}}],"grupos":[{"titulo":{"pt":"O que já está resolvido","en":"What is already solved","es":"Lo que ya está resuelto"},"itens":[{"t":{"pt":"<b>A fonte e a tabela de caracteres</b> — 512 glifos de 16×16 e 497 entradas, validadas no emulador.","en":"<b>The font and the character table</b> — 512 glyphs at 16×16 and 497 entries, validated on the emulator.","es":"<b>La fuente y la tabla de caracteres</b> — 512 glifos de 16×16 y 497 entradas, validadas en el emulador."}},{"t":{"pt":"<b>O empacotamento do roteiro</b>, com a paginação própria do jogo, e <b>1.884 mensagens extraídas</b> — 94 KB de texto. O extrator faz round-trip: <b>1.875 de 1.875 mensagens voltam byte-idênticas</b>.","en":"<b>The script encoding</b>, with the game’s own pagination, and <b>1,884 messages extracted</b> — 94 KB of text. The extractor round-trips: <b>1,875 of 1,875 messages come back byte-identical</b>.","es":"<b>El empaquetado del guion</b>, con la paginación propia del juego, y <b>1.884 mensajes extraídos</b> — 94 KB de texto. El extractor hace round-trip: <b>1.875 de 1.875 mensajes vuelven byte-idénticos</b>."}},{"t":{"pt":"<b>Meia largura para o inglês</b> — 8 pixels por caractere, 32 colunas, provado na tela. Sem isso o inglês não caberia num jogo desenhado para kana de largura cheia.","en":"<b>Half-width for English</b> — 8 pixels per character, 32 columns, proved on screen. Without it English would not fit a game drawn for full-width kana.","es":"<b>Media anchura para el inglés</b> — 8 píxeles por carácter, 32 columnas, probado en pantalla. Sin eso el inglés no cabría en un juego dibujado para kana de ancho completo."}},{"t":{"pt":"<b>A tela de título traduzida</b> — o logo <code>GAIA SAVER</code> e o subtítulo <code>HERO’S GREATEST OPERATION</code>, com o caminho provado por round-trip.","en":"<b>The title screen translated</b> — the <code>GAIA SAVER</code> logo and the <code>HERO’S GREATEST OPERATION</code> subtitle, with the pipeline proved by round-trip.","es":"<b>La pantalla de título traducida</b> — el logo <code>GAIA SAVER</code> y el subtítulo <code>HERO’S GREATEST OPERATION</code>, con el camino probado por round-trip."},"foto":"gaia/01-titulo.png"},{"t":{"pt":"<b>420 nomes traduzidos</b>, cabendo em 5.375 dos 5.376 bytes disponíveis — um byte de folga.","en":"<b>420 names translated</b>, fitting in 5,375 of the 5,376 bytes available — one byte to spare.","es":"<b>420 nombres traducidos</b>, cabiendo en 5.375 de los 5.376 bytes disponibles — un byte de margen."}},{"t":{"pt":"<b>O diálogo inteiro</b> — as 1.884 mensagens, conferidas seguindo os 1.561 ponteiros vivos, e não por contagem de arquivo.","en":"<b>The whole dialogue</b> — all 1,884 messages, checked by following the 1,561 live pointers rather than by counting files.","es":"<b>Todo el diálogo</b> — los 1.884 mensajes, comprobados siguiendo los 1.561 punteros vivos y no por conteo de archivos."}},{"t":{"pt":"<b>A interface inteira</b> — 81 nomes de item, 22 golpes, 39 descrições, a tela de save e os menus de configuração.","en":"<b>The whole interface</b> — 81 item names, 22 techniques, 39 descriptions, the save screen and the config menus.","es":"<b>Toda la interfaz</b> — 81 nombres de objeto, 22 técnicas, 39 descripciones, la pantalla de guardado y los menús de configuración."}},{"t":{"pt":"<b>O menu de campo</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. O tilemap dele não estava na ROM crua: vinha de um pedaço comprimido, que foi decodificado, editado, recomprimido e realocado.","en":"<b>The field menu</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. Its tilemap was not in the raw ROM: it came from a compressed chunk, which was decoded, edited, recompressed and relocated.","es":"<b>El menú de campo</b> — <code>STATS · SKILL · EQUIP · ITEMS · SETUP</code>. Su tilemap no estaba en la ROM cruda: venía de un bloque comprimido, que se decodificó, editó, recomprimió y reubicó."}},{"t":{"pt":"<b>O que nenhuma varredura de texto acha</b> — o contador de população, os atributos das fichas de personagem e o cartão de capítulo (<code>PART 1</code>), que não são texto: são tiles cravados no código e em tilemaps crus.","en":"<b>What no text sweep finds</b> — the population counter, the character-sheet stats and the chapter card (<code>PART 1</code>), which are not text: they are tiles hard-coded in the program and in raw tilemaps.","es":"<b>Lo que ningún barrido de texto encuentra</b> — el contador de población, los atributos de las fichas de personaje y la tarjeta de capítulo (<code>PART 1</code>), que no son texto: son tiles incrustados en el código y en tilemaps crudos."}}]},{"titulo":{"pt":"O que falta","en":"What is left","es":"Lo que falta"},"itens":[{"t":{"pt":"<b>Jogar do começo ao fim.</b> É o único item aberto, e é o que separa a etiqueta de hoje da release: medição não substitui partida. Uma varredura tela a tela, sempre em boot limpo, não achou japonês em nenhuma — mas varredura vê as telas por onde ela passou.","en":"<b>Playing it start to finish.</b> It is the only open item, and it is what separates today’s label from a release: measurement does not stand in for a playthrough. A screen-by-screen sweep, always from a clean boot, found Japanese on none of them — but a sweep only sees the screens it walked through.","es":"<b>Jugarlo de principio a fin.</b> Es el único punto abierto, y es lo que separa la etiqueta de hoy de la release: la medición no sustituye a una partida. Un barrido pantalla por pantalla, siempre desde un arranque limpio, no encontró japonés en ninguna — pero un barrido solo ve las pantallas por las que pasó."}},{"t":{"pt":"<b>Português e espanhol</b>, que ainda não começaram — o caminho já está aberto pelo inglês.","en":"<b>Portuguese and Spanish</b>, which have not started — the path is already cut by the English build.","es":"<b>Portugués y español</b>, que aún no han empezado — el camino ya está abierto por el inglés."}}]}],"patch":{"versoes":{"en":{"arquivo":"gaia-saver-en.ips","tamanho":"180 KB"},"pt":null,"es":null},"rom":"Gaia Saver - Hero Saidai no Sakusen (Japan).sfc","rom_md5":"0ab069047f1b03983241c014f8378555"},"fotos":[{"f":"gaia/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em latinas, com o subtítulo <code>THE GREATEST HERO OPERATION</code> na faixa.","en":"The logo redrawn in Latin letters, with the <code>THE GREATEST HERO OPERATION</code> subtitle on the band.","es":"El logo redibujado en latinas, con el subtítulo <code>THE GREATEST HERO OPERATION</code> en la banda."}},{"f":"gaia/02-abertura.png","t":{"pt":"A abertura, em inglês","en":"The opening, in English","es":"La apertura, en inglés"},"c":{"pt":"O prólogo do jogo rodando traduzido, sobre a arte original — meia largura, 32 colunas.","en":"The game’s prologue running translated, over the original artwork — half-width, 32 columns.","es":"El prólogo del juego corriendo traducido, sobre el arte original — media anchura, 32 columnas."}}]},{"slug":"nekketsu-kakutou-densetsu","nome":"Nekketsu Kakutou Densetsu","subtitulo":"Fighting Legend","jp":"熱血格闘伝説","publisher":"Technos Japan","dev":"Technos Japan","ano":1992,"data":"1992","sistema":"Famicom","mapper":"MMC3 · expansão 128→256 KB provada","categoria":{"pt":"Tradução + arte","en":"Translation + artwork","es":"Traducción + arte"},"nivel":"beta","capa":"nk/01-titulo.png","linha":{"pt":"A série de brigões de colégio que o Ocidente conheceu como River City Ransom. Este é o de luta: 19 combates em duplas, quatro jogadores na mesa.","en":"The school-brawler series the West met as River City Ransom. This one is the fighter: 19 tag bouts, four players on one Famicom.","es":"La serie de matones de instituto que Occidente conoció como River City Ransom. Este es el de lucha: 19 combates por parejas, cuatro jugadores."},"resumo":{"pt":["No Japão o Kunio é uma instituição: o brigão de colégio que virou uma família inteira de jogos da Technos. O Ocidente conheceu um deles com outro nome e outro elenco, <i>River City Ransom</i>. Este, de 1992, é o de luta — o modo história são <b>19 combates em duplas</b>, com quinze vitórias até o chefe, o modo batalha aceita <b>até quatro jogadores</b> pelo adaptador do Famicom, e o lutador que você inventa guarda nome, aniversário e tipo sanguíneo dentro da senha.","O texto está inteiro em inglês: <b>266 strings</b>, traduzidas do zero e revisadas linha a linha, com o validador em zero erro. Para escrevê-las foi desenhada uma <b>fonte latina completa</b> — a-z e pontuação — em <b>81 tiles novos</b>, deixando <b>175 tiles do original intactos</b>, e o logo do título saiu refeito em latinas como <code>NEKKETSU / FIGHTING LEGEND</code>.","O texto deste jogo cabe em <b>6.120 bytes e não tem compressão nenhuma</b>: cada frase ocupa exatamente o que escreve, então não há dicionário de onde tirar folga — é a fonte e a expansão da ROM, de <b>128 para 256 KB</b>, que abrem lugar, e por isso vieram antes. A expansão foi provada pelo caminho mais duro que existe: uma build que só move o texto japonês, sem traduzir nada, sai <b>idêntica à original</b>. E o inglês está confirmado na ROM rodando, não em simulação — a build de teste abre no portão do colégio com a primeira fala na fonte nova: <i>The gates of Nekketsu High.</i> Não há patch para instalar; esta página é para acompanhar."],"en":["In Japan, Kunio is an institution: the school brawler who grew into a whole family of Technos games. The West met one of them under another name and another cast, <i>River City Ransom</i>. This one, from 1992, is the fighter — story mode is <b>19 tag bouts</b>, fifteen wins to reach the boss, battle mode takes <b>up to four players</b> through the Famicom adapter, and the fighter you invent keeps his name, birthday and blood type inside the password.","The text is entirely in English: <b>266 strings</b>, translated from scratch and reviewed line by line, with the validator at zero errors. Writing them meant drawing a <b>complete Latin font</b> — a-z and punctuation — across <b>81 new tiles</b>, leaving <b>175 of the original tiles untouched</b>, and the title logo was remade in Latin letters as <code>NEKKETSU / FIGHTING LEGEND</code>.","This game's text fits in <b>6,120 bytes with no compression at all</b>: every line occupies exactly what it writes, so there is no dictionary to squeeze slack out of — the font and the ROM expansion, from <b>128 to 256 KB</b>, are what open room, which is why they came first. That expansion was proved the hardest way there is: a build that only moves the Japanese text, translating none of it, comes out <b>identical to the original</b>. And English is confirmed on the running ROM, not in simulation — the test build opens at the school gate with its first line in the new font: <i>The gates of Nekketsu High.</i> There is no patch to install; this page is here to follow along."],"es":["En Japón, Kunio es una institución: el matón de instituto que se convirtió en toda una familia de juegos de Technos. Occidente conoció a uno de ellos con otro nombre y otro reparto, <i>River City Ransom</i>. Este, de 1992, es el de lucha — el modo historia son <b>19 combates por parejas</b>, con quince victorias hasta el jefe, el modo batalla admite <b>hasta cuatro jugadores</b> por el adaptador del Famicom, y el luchador que te inventas guarda nombre, cumpleaños y grupo sanguíneo dentro de la contraseña.","El texto está entero en inglés: <b>266 cadenas de texto</b>, traducidas de cero y revisadas línea a línea, con el validador sin un solo error. Para escribirlas se dibujó una <b>fuente latina completa</b> — la a-z y la puntuación — en <b>81 tiles nuevos</b>, dejando <b>175 tiles del original intactos</b>, y el logo del título salió rehecho en letras latinas como <code>NEKKETSU / FIGHTING LEGEND</code>.","El texto de este juego cabe en <b>6.120 bytes, sin compresión de ningún tipo</b>: cada frase ocupa exactamente lo que escribe, así que no hay diccionario del que sacar holgura — son la fuente y la ampliación de la ROM, de <b>128 a 256 KB</b>, las que abren sitio, y por eso vinieron antes. La ampliación se probó por el camino más duro que existe: una compilación que solo mueve el texto japonés, sin traducir nada, sale <b>idéntica a la original</b>. Y el inglés está confirmado con la ROM en marcha, no en simulación — la compilación de prueba abre en la puerta del instituto con la primera frase en la fuente nueva: <i>The gates of Nekketsu High.</i> No hay parche que instalar; esta página es para seguir el proyecto."]},"numeros":[{"v":"266","r":{"pt":"strings, todas traduzidas","en":"strings, all translated","es":"strings, todas traducidas"}},{"v":"81","r":{"pt":"tiles novos de fonte latina","en":"new Latin font tiles","es":"tiles nuevos de fuente latina"}},{"v":"175","r":{"pt":"tiles originais intactos","en":"original tiles untouched","es":"tiles originales intactos"}},{"v":"0","r":{"pt":"erros no validador","en":"errors in the validator","es":"errores en el validador"}}],"grupos":[{"titulo":{"pt":"O que já está provado","en":"What is already proved","es":"Lo que ya está probado"},"itens":[{"t":{"pt":"<b>Tradução completa</b> — 266 strings, revisadas linha a linha, com o validador em zero erro.","en":"<b>Translation complete</b> — 266 strings, reviewed line by line, with the validator at zero errors.","es":"<b>Traducción completa</b> — 266 strings, revisadas línea por línea, con el validador en cero errores."}},{"t":{"pt":"<b>Fonte latina completa</b>: a-z e pontuação, em 81 tiles novos, com <b>175 tiles originais intactos</b>.","en":"<b>Complete Latin font</b>: a-z and punctuation, in 81 new tiles, with <b>175 original tiles untouched</b>.","es":"<b>Fuente latina completa</b>: a-z y puntuación, en 81 tiles nuevos, con <b>175 tiles originales intactos</b>."}},{"t":{"pt":"<b>Inglês confirmado em jogo.</b> A build de teste abre com a primeira fala na fonte nova — não é simulação, é a ROM rodando.","en":"<b>English confirmed in game.</b> The test build opens with the first line in the new font — not a simulation, the ROM running.","es":"<b>Inglés confirmado en juego.</b> La build de prueba abre con la primera frase en la fuente nueva — no es simulación, es la ROM corriendo."},"foto":"nk/02-jogo.png"},{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, no lugar do japonês.","en":"<b>Title logo redrawn</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, in place of the Japanese.","es":"<b>Logo del título redibujado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, en lugar del japonés."},"foto":"nk/01-titulo.png"},{"t":{"pt":"A expansão de 128 para 256 KB está <b>provada</b>, e o motor de inserção tem guarda: uma build que só move o texto japonês sai idêntica à original.","en":"The expansion from 128 to 256 KB is <b>proved</b>, and the insertion engine has a guard: a build that only moves the Japanese text comes out identical to the original.","es":"La ampliación de 128 a 256 KB está <b>probada</b>, y el motor de inserción tiene guarda: una build que solo mueve el texto japonés sale idéntica a la original."}}]},{"titulo":{"pt":"O que falta","en":"What is left","es":"Lo que falta"},"itens":[{"t":{"pt":"<b>A senha em alfabeto latino.</b> Ela é digitada em hiragana, e a fonte nova tomou justamente os slots de kana — sem converter o teclado, a senha sai misturada.","en":"<b>The password in Latin letters.</b> It is typed in hiragana, and the new font took exactly the kana slots — without converting the keyboard, the password comes out mixed.","es":"<b>La contraseña en alfabeto latino.</b> Se escribe en hiragana, y la fuente nueva tomó justamente los slots de kana — sin convertir el teclado, la contraseña sale mezclada."}},{"t":{"pt":"Gráficos que ainda são japoneses: a carta de desafio, as quatro faixas de estilo, os nomes dos dezesseis lutadores na seleção e o cabeçalho da escolha de estágio.","en":"Graphics that are still Japanese: the challenge letter, the four style banners, the sixteen fighters’ names on the select screen and the stage-select header.","es":"Gráficos que siguen en japonés: la carta de desafío, las cuatro bandas de estilo, los nombres de los dieciséis luchadores en la selección y el encabezado de la elección de escenario."}}]}],"patch":{"versoes":{"en":{"arquivo":"nekketsu-kakutou-densetsu-en.ips","tamanho":"154 KB"},"pt":null,"es":null},"rom":"Nekketsu Kakutou Densetsu (Japan).nes","rom_md5":"c56d957bbe700b422f97cd8fe4515c54"},"fotos":[{"f":"nk/01-titulo.png","t":{"pt":"Título redesenhado","en":"Redrawn title","es":"Título redibujado"},"c":{"pt":"<code>NEKKETSU / FIGHTING LEGEND</code> — o logo japonês refeito em latinas.","en":"<code>NEKKETSU / FIGHTING LEGEND</code> — the Japanese logo remade in Latin letters.","es":"<code>NEKKETSU / FIGHTING LEGEND</code> — el logo japonés rehecho en letras latinas."}},{"f":"nk/02-jogo.png","t":{"pt":"Inglês em jogo","en":"English in game","es":"Inglés en juego"},"c":{"pt":"A primeira fala na fonte nova, na ROM rodando: “The gates of Nekketsu High.”","en":"The first line in the new font, on the running ROM: “The gates of Nekketsu High.”","es":"La primera frase en la fuente nueva, en la ROM corriendo: “The gates of Nekketsu High.”"}}]},{"slug":"gozonji","nome":"The Misadventures of Yaji &amp; Kita","subtitulo":"Gozonji: Yaji Kita Chin Douchuu","jp":"ご存知 弥次喜多珍道中","publisher":"HAL Laboratory","dev":"HYPERWARE","ano":1991,"data":"1991","sistema":"Famicom","mapper":"MMC1 convertido para MMC3 · 256 KB expandido para 512 KB · 128 KB CHR-ROM","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"gozonji/01-titulo.png","linha":{"pt":"Dois amigos de Edo caem na estrada rumo a Ise, e não há parada sem confusão: a comédia da HAL pelas 53 estações do Tōkaidō.","en":"Two friends from Edo take the road to Ise, and no stop passes without trouble: HAL's comedy along the 53 stations of the Tōkaidō.","es":"Dos amigos de Edo se echan al camino rumbo a Ise, y no hay parada sin lío: la comedia de HAL por las 53 estaciones del Tōkaidō."},"resumo":{"pt":["<b>The Misadventures of Yaji &amp; Kita</b> — no cartucho, <i>Gozonji: Yaji Kita Chin Douchuu</i> — saiu da HAL Laboratory em 1991, e parte de um livro que todo japonês encontra na escola: o <i>Tōkaidōchū Hizakurige</i>, de Jippensha Ikku, em que dois moradores de Edo saem a pé rumo ao santuário de Ise e arrumam confusão em cada parada. Yaji e Kita são a dupla de estrada original, dois séculos antes de o cinema inventar o gênero. E o jogo não tem capítulos: ele <b>é</b> a estrada — as <b>53 estações do Tōkaidō</b>, uma de cada vez, com o roteiro repartido em nove blocos de peso parecido. O nome em inglês é a escolha desta tradução; o jogo nunca teve um, e o subtítulo da tela de título agora diz <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","A fala mora numa caixa de <b>16 caracteres por 4 linhas</b>, medida na nametable, e o cartucho é <b>kana puro, sem um único kanji</b>: varridas as 32 páginas de gráficos, existe uma fonte só. Sobre as casas de kana foram gravados <b>83 glifos latinos</b> — A-Z, a-z, dígitos e pontuação —, com os descendentes de <code>p g q y j</code> redesenhados assim que a prévia mostrou que a oitava linha do tile estava livre desde sempre. A compressão do jogo foi <b>reaproveitada em vez de contornada</b>: o motor carrega um <b>dicionário de 128 entradas</b>, que no original guarda os kana sonoros e palavras como <code>おとっつあん</code>, e essas mesmas 128 casas foram regeradas a partir do corpus inglês — a compressão que servia ao japonês passou a servir ao inglês, sem código novo. Antes da estrada há um prólogo de <b>oito telas</b> que não existe no original, apresentando Yaji, Kita e Oharu, três delas com retrato: a forma da cabeça vem dos tiles de fundo da mesma página de CHR que a fonte usa, as feições são sprites, e o marrom com letra creme são as cores da própria caixa de diálogo, lidas no emulador. Cada tela <b>espera o botão</b>, em vez de virar sozinha no relógio.","O roteiro deste cartucho tem <b>3.581 falas em 93.640 bytes</b> de japonês. Em inglês isso pede perto de <b>145 KB</b>, e o caminho de expansão que serviu aos outros projetos da casa estava fechado aqui: o bit que viraria linha de endereço do programa <b>já é usado pela CHR-ROM de 128 KB</b>, cujas 32 páginas são todas distintas. Então o cartucho foi refeito — <b>de MMC1 para MMC3, e de 256 para 512 KB</b>. Deu certo por um motivo medido: a partida inteira escreve em <b>exatamente cinco endereços de registrador</b>, e as cinco rotinas de troca de banco couberam reescritas no espaço delas mesmas. A prova é paridade, não opinião: <b>19 de 19 quadros idênticos</b> à ROM japonesa. Duas lições ficaram do caminho — sob MMC3 a região fixa vem do último banco e não do décimo quinto, e quem escreve lá tem de espelhar nos dois; e frieza medida diz que o teste não passou por ali, nunca que o jogo não passa: o banco 7 parecia ter <b>13,5 KB mortos</b> e tinha sete chamadas apontando para dentro."],"en":["<b>The Misadventures of Yaji &amp; Kita</b> — on the cartridge, <i>Gozonji: Yaji Kita Chin Douchuu</i> — came out of HAL Laboratory in 1991, and it starts from a book every Japanese reader meets at school: Jippensha Ikku's <i>Tōkaidōchū Hizakurige</i>, in which two men from Edo set out on foot for the Ise shrine and get into trouble at every stop. Yaji and Kita are the original road-trip double act, two centuries before cinema invented the genre. And the game has no chapters: it <b>is</b> the road — the <b>53 stations of the Tōkaidō</b>, one at a time, with the script split into nine blocks of similar weight. The English name is this translation's choice; the game never had one, and the title screen's subtitle now reads <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","Speech lives in a box of <b>16 characters by 4 lines</b>, measured on the nametable, and the cartridge is <b>pure kana, without a single kanji</b>: all 32 graphics pages were swept and only one font exists. Over the kana slots sit <b>83 Latin glyphs</b> — A-Z, a-z, digits and punctuation — with the descenders of <code>p g q y j</code> redrawn as soon as the preview showed the tile's eighth row had been free all along. The game's own compression was <b>reused rather than worked around</b>: the engine carries a <b>128-entry dictionary</b>, which in the original holds voiced kana and words like <code>おとっつあん</code>, and those same 128 slots were regenerated from the English corpus — the compression that served Japanese now serves English, with no new code. Before the road there is an <b>eight-screen prologue</b> that does not exist in the original, introducing Yaji, Kita and Oharu, three of them with a portrait: the shape of the head comes from background tiles on the same CHR page the font uses, the features are sprites, and the brown with cream lettering are the colours of the game's own dialogue box, read off the emulator. Each screen <b>waits for the button</b> rather than turning itself on a timer.","This cartridge's script holds <b>3,581 lines in 93,640 bytes</b> of Japanese. In English that asks for close to <b>145 KB</b>, and the expansion route that served the house's other projects was closed here: the bit that would become a program address line <b>is already used by the 128 KB CHR-ROM</b>, whose 32 pages are all distinct. So the cartridge was rebuilt — <b>from MMC1 to MMC3, and from 256 to 512 KB</b>. It worked for a measured reason: a whole session writes to <b>exactly five register addresses</b>, and the five bank-switching routines fitted rewritten in their own space. The proof is parity, not opinion: <b>19 of 19 frames identical</b> to the Japanese ROM. Two lessons came out of the route — under MMC3 the fixed region comes from the last bank rather than the fifteenth, and whoever writes there has to mirror into both; and a cold profile says the test never went that way, never that the game does not: bank 7 looked like <b>13.5 KB of dead space</b> and had seven calls pointing into it."],"es":["<b>The Misadventures of Yaji &amp; Kita</b> — las desventuras de Yaji y Kita; en el cartucho, <i>Gozonji: Yaji Kita Chin Douchuu</i> — salió de HAL Laboratory en 1991, y parte de un libro que todo japonés se encuentra en la escuela: el <i>Tōkaidōchū Hizakurige</i>, de Jippensha Ikku, en el que dos vecinos de Edo salen a pie rumbo al santuario de Ise y se meten en un lío en cada parada. Yaji y Kita son la pareja de carretera original, dos siglos antes de que el cine inventara el género. Y el juego no tiene capítulos: <b>es</b> el camino — las <b>53 estaciones del Tōkaidō</b>, una cada vez, con el guion repartido en nueve bloques de peso parecido. El nombre en inglés es la elección de esta traducción; el juego nunca tuvo uno, y el subtítulo de la pantalla de título dice ahora <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","El habla vive en una caja de <b>16 caracteres por 4 líneas</b>, medida en la nametable, y el cartucho es <b>kana puro, sin un solo kanji</b>: barridas las 32 páginas de gráficos, existe una única fuente. Sobre las casillas de kana se grabaron <b>83 glifos latinos</b> — A-Z, a-z, cifras y puntuación —, con las colas descendentes de <code>p g q y j</code> redibujadas en cuanto la vista previa enseñó que la octava fila del tile llevaba libre desde siempre. La compresión del juego se <b>reaprovechó en vez de esquivarla</b>: el motor carga un <b>diccionario de 128 entradas</b>, que en el original guarda los kana sonoros y palabras como <code>おとっつあん</code>, y esas mismas 128 casillas se regeneraron a partir del corpus inglés — la compresión que servía al japonés pasó a servir al inglés, sin código nuevo. Antes del camino hay un prólogo de <b>ocho pantallas</b> que no existe en el original, presentando a Yaji, Kita y Oharu, tres de ellas con retrato: la forma de la cabeza viene de los tiles de fondo de la misma página de CHR que usa la fuente, las facciones son sprites, y el fondo marrón y la letra crema son los colores de la propia caja de diálogo, leídos en el emulador. Cada pantalla <b>espera el botón</b>, en lugar de pasar sola con el reloj.","El guion de este cartucho tiene <b>3.581 líneas en 93.640 bytes</b> de japonés. En inglés eso pide cerca de <b>145 KB</b>, y el camino de ampliación que sirvió a los otros proyectos de la casa estaba cerrado aquí: el bit que se convertiría en línea de dirección del programa <b>ya lo usa la CHR-ROM de 128 KB</b>, cuyas 32 páginas son todas distintas. Así que el cartucho se rehízo — <b>de MMC1 a MMC3, y de 256 a 512 KB</b>. Salió bien por un motivo medido: la partida entera escribe en <b>exactamente cinco direcciones de registro</b>, y las cinco rutinas de cambio de banco cupieron reescritas en su propio espacio. La prueba es paridad, no opinión: <b>19 de 19 fotogramas idénticos</b> a la ROM japonesa. Del camino quedaron dos lecciones — bajo MMC3 la región fija viene del último banco y no del decimoquinto, y quien escribe ahí tiene que reflejarlo en los dos; y un perfil frío dice que la prueba no pasó por ahí, nunca que el juego no pase: el banco 7 parecía tener <b>13,5 KB muertos</b> y tenía siete llamadas apuntando dentro."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"gozonji-en.ips","tamanho":"276 KB"},"pt":null,"es":null},"rom":"Gozonji - Yaji Kita Chin Douchuu (Japan).nes","rom_md5":"bdd15fac92d789d8ec59a6484e90db5b"},"fotos":[{"f":"gozonji/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O Fuji, o letreiro e o subtítulo em inglês.","en":"The Fuji, the logo and the English subtitle.","es":"El Fuji, el rótulo y el subtítulo en inglés."}},{"f":"gozonji/02-prologo.png","t":{"pt":"O prólogo","en":"The prologue","es":"El prólogo"},"c":{"pt":"Cada personagem apresentado antes de a estrada começar.","en":"Each character introduced before the road begins.","es":"Cada personaje presentado antes de que empiece el camino."}},{"f":"gozonji/03-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"A tela de abertura da tradução.","en":"The translation opening screen.","es":"La pantalla de apertura de la traducción."}},{"f":"gozonji/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"A caixa de dezesseis caracteres por quatro linhas.","en":"The box of sixteen characters by four lines.","es":"La caja de dieciséis caracteres por cuatro líneas."}},{"f":"gozonji/05-cena.png","t":{"pt":"Na estrada","en":"On the road","es":"En el camino"},"c":{"pt":"Uma das 53 estações do Tōkaidō.","en":"One of the 53 stations of the Tōkaidō.","es":"Una de las 53 estaciones del Tōkaidō."}}]},{"slug":"ultraman-club-3","nome":"Ultraman Club 3","subtitulo":"","jp":"ウルトラマン倶楽部3","publisher":"Yutaka","dev":"Tsuburaya Prod.","ano":1991,"data":"1991","sistema":"Famicom","mapper":"Famicom","categoria":{"pt":"Correção de bugs + tradução","en":"Bug fixes + translation","es":"Corrección de bugs + traducción"},"nivel":"beta","capa":"u3/01-titulo.png","linha":{"pt":"A continuação em que os Ultras guardam kaiju em cápsulas — e onde a cápsula da página 8, que travava a batalha, caiu antes da tradução.","en":"The sequel where the Ultras store kaiju in capsules — and where the page-8 capsule, which hung the battle, fell before the translation did.","es":"En esta secuela los Ultras guardan kaiju en cápsulas, y la cápsula de la página 8, que colgaba el combate, cayó antes que el texto."},"resumo":{"pt":["Tsuburaya de novo, agora com a Yutaka, em 1991, e continuação direta do <i>Ultraman Club 2</i>. Aqui os monstros vão para dentro de <b>cápsulas</b> — trinta lugares de inventário, um nibble por kaiju — e a viagem passa pela <b>Nebulosa M78</b>, o endereço de onde os Ultras vêm.","Este projeto começou de trás para frente, de propósito: <b>consertar os defeitos do jogo original vem antes de traduzir</b>, porque escrever inglês por cima de um defeito só produz uma tela quebrada noutro idioma. O primeiro já caiu. Em batalha, no menu de cápsulas, a página 8 desenha só duas entradas, mas o cursor anda por tabela fixa e chega às duas vagas vazias; confirmar ali fazia o jogo ler o atributo que sobrou da página anterior — <b>travava na maioria das vezes</b> e, de vez em quando, invocava um Pestar corrompido com efeito aleatório. <b>Vinte e dois bytes</b> no banco 29 fazem as duas linhas nascerem recusáveis: o cursor ainda entra e o A não faz nada, exatamente como o próprio jogo já se comporta com outras duas cápsulas.","Nada disso vale sem medição. O conserto foi verificado em <b>teste A/B contra a ROM original</b>, com um teste de regressão por cima, e o construtor <b>aborta se os bytes originais não baterem</b> — além de imprimir os <b>22 códigos de Game Genie</b> equivalentes, para quem preferir o mesmo efeito sem gerar ROM nenhuma. A engenharia reversa também entregou ferramenta: duas escritas na memória invocam qualquer um dos <b>80 encontros</b> do jogo, em qualquer ponto, o que torna reproduzível o que antes dependia de sorte. E o texto já está levantado: <b>338 mensagens</b>, com offset, tamanho e referências de cada uma. Não há patch para instalar; esta página acompanha o projeto."],"en":["Tsuburaya again, now with Yutaka, in 1991, and a direct sequel to <i>Ultraman Club 2</i>. Here the monsters go into <b>capsules</b> — thirty inventory slots, one nibble per kaiju — and the journey passes through <b>Nebula M78</b>, the address the Ultras come from.","This project started backwards on purpose: <b>fixing the original game's defects comes before translating it</b>, because writing English over a defect only produces a broken screen in another language. The first one has fallen. In battle, in the capsule menu, page 8 draws only two entries, but the cursor walks a fixed table and reaches the two empty slots; confirming there made the game read the attribute left over from the previous page — it <b>hung most of the time</b> and, now and then, summoned a corrupted Pestar with a random effect. <b>Twenty-two bytes</b> in bank 29 make those two rows refusable from birth: the cursor still enters and A does nothing, exactly as the game already behaves with two other capsules.","None of that counts without measurement. The fix was verified in an <b>A/B test against the original ROM</b>, with a regression test on top, and the builder <b>aborts if the original bytes do not match</b> — besides printing the <b>22 equivalent Game Genie codes</b>, for anyone who would rather have the same effect without generating a ROM at all. The reverse engineering also produced a tool: two writes to memory summon any of the game's <b>80 encounters</b>, at any point, which makes reproducible what used to depend on luck. And the text is already surveyed: <b>338 messages</b>, each with its offset, size and references. There is no patch to install; this page follows the project."],"es":["Tsuburaya otra vez, ahora con Yutaka, en 1991, y secuela directa de <i>Ultraman Club 2</i>. Aquí los monstruos van dentro de <b>cápsulas</b> — treinta huecos de inventario, un nibble por kaiju — y el viaje pasa por la <b>Nebulosa M78</b>, la dirección de donde vienen los Ultras.","Este proyecto empezó al revés a propósito: <b>arreglar los defectos del juego original va antes que traducirlo</b>, porque escribir inglés encima de un defecto solo produce una pantalla rota en otro idioma. El primero ya cayó. En combate, en el menú de cápsulas, la página 8 dibuja solo dos entradas, pero el cursor recorre una tabla fija y llega a los dos huecos vacíos; confirmar ahí hacía que el juego leyera el atributo que sobraba de la página anterior — <b>colgaba la mayoría de las veces</b> y, de vez en cuando, invocaba un Pestar corrupto con efecto aleatorio. <b>Veintidós bytes</b> en el banco 29 hacen que esas dos filas nazcan rechazables: el cursor sigue entrando y la A no hace nada, exactamente como el propio juego ya se comporta con otras dos cápsulas.","Nada de eso vale sin medición. El arreglo se verificó en <b>prueba A/B contra la ROM original</b>, con una prueba de regresión encima, y el constructor <b>aborta si los bytes originales no coinciden</b> — además de imprimir los <b>22 códigos de Game Genie</b> equivalentes, para quien prefiera el mismo efecto sin generar ninguna ROM. La ingeniería inversa dejó además una herramienta: dos escrituras en memoria invocan cualquiera de los <b>80 encuentros</b> del juego, en cualquier punto, lo que hace reproducible lo que antes dependía de la suerte. Y el texto ya está inventariado: <b>338 mensajes</b>, con desplazamiento, tamaño y referencias de cada uno. No hay parche que instalar; esta página sigue el proyecto."]},"numeros":[{"v":"3","r":{"pt":"bugs do jogo original","en":"bugs in the original game","es":"bugs del juego original"}},{"v":"1","r":{"pt":"corrigido e medido","en":"fixed and measured","es":"corregido y medido"}},{"v":"22","r":{"pt":"códigos Game Genie do conserto","en":"Game Genie codes for the fix","es":"códigos Game Genie del arreglo"}}],"grupos":[{"titulo":{"pt":"Os bugs, um a um","en":"The bugs, one by one","es":"Los bugs, uno a uno"},"itens":[{"t":{"pt":"<b>A cápsula da página 8 — CORRIGIDO.</b> Causa achada, conserto escrito e medido, com teste A/B contra a ROM original e teste de regressão. O construtor <b>aborta se os bytes originais não baterem</b>, e imprime os 22 códigos Game Genie equivalentes.","en":"<b>The page-8 capsule — FIXED.</b> Cause found, fix written and measured, with an A/B test against the original ROM and a regression test. The builder <b>aborts if the original bytes do not match</b>, and prints the 22 equivalent Game Genie codes.","es":"<b>La cápsula de la página 8 — CORREGIDO.</b> Causa encontrada, arreglo escrito y medido, con prueba A/B contra la ROM original y prueba de regresión. El constructor <b>aborta si los bytes originales no coinciden</b>, e imprime los 22 códigos Game Genie equivalentes."},"foto":"u3/01-titulo.png"},{"t":{"pt":"<b>O warp do Ace Robot — NÃO REPRODUZIDO.</b> A investigação está registrada: formato do save decodificado, RAM mapeada, hipótese levantada. Sem reproduzir, não se conserta — e não se finge que consertou.","en":"<b>The Ace Robot warp — NOT REPRODUCED.</b> The investigation is on record: save format decoded, RAM mapped, hypothesis raised. Without reproducing it, you do not fix it — and you do not pretend you did.","es":"<b>El warp del Ace Robot — NO REPRODUCIDO.</b> La investigación está registrada: formato del save decodificado, RAM mapeada, hipótesis planteada. Sin reproducirlo, no se arregla — y no se finge que se arregló."}},{"t":{"pt":"<b>O Seven voando — NÃO INVESTIGADO.</b> Depende de um save feito no próprio jogo, não de savestate.","en":"<b>Seven flying — NOT INVESTIGATED.</b> It depends on a save made in the game itself, not a savestate.","es":"<b>El Seven volando — NO INVESTIGADO.</b> Depende de una partida guardada en el propio juego, no de un savestate."}}]}],"patch":{"versoes":{"en":{"arquivo":"ultraman-club-3-en.ips","tamanho":"172 KB"},"pt":null,"es":null},"rom":"Ultraman Club 3 (Japan).nes","rom_md5":"25cd707a6cf845bb4d2df34b2cca6254"},"fotos":[{"f":"u3/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"Build em inglês. A logo japonesa deu lugar à inglesa, redesenhada pixel a pixel nas quatro cores da paleta original; o crédito de 1991 à Tsuburaya e à Yutaka continua onde estava.","en":"English build. The Japanese logo gave way to the English one, redrawn pixel by pixel in the original palette's four colours; the 1991 credit to Tsuburaya and Yutaka stays where it was.","es":"Build en inglés. El logo japonés dio paso al inglés, redibujado píxel a píxel con los cuatro colores de la paleta original; el crédito de 1991 a Tsuburaya y a Yutaka sigue donde estaba."}}]},{"slug":"monster-maker","nome":"Monster Maker","subtitulo":"7 Tsu no Hihou","jp":"モンスターメーカー 7つの秘宝","traducao_titulo":"The Seven Treasures","publisher":"Sofel","dev":"U-Kikaku · Show-Kikaku","ano":1991,"data":"1991","sistema":"Famicom","mapper":"MMC1 · 256 KB PRG expandido para 512 KB · CHR-RAM de 8 KB · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"mm/01-titulo.png","linha":{"pt":"A fonte do cartucho tinha três letras latinas. O motor de texto alcançava 48 KB. O inglês pedia 49,6.","en":"The cartridge font held three Latin letters. The text engine reached 48 KB. The English asked for 49.6.","es":"La fuente del cartucho tenía tres letras latinas. El motor de texto alcanzaba 48 KB. El inglés pedía 49,6."},"resumo":{"pt":["<i>Monster Maker</i> nasceu como jogo de cartas japonês — monstro, tesouro e masmorra distribuídos carta a carta — e foi popular o bastante para virar RPG de Famicom em <i>7 Tsu no Hihou</i>, os sete tesouros. Fora do Japão o nome não diz nada a ninguém, e é exatamente esse o tipo de cartucho que some da história por não ter idioma, não por não prestar. Ele salva em bateria e abre com um prólogo que começa em <code>はるかなる むかし</code>, num tempo muito distante, antes de perguntar se você começa do zero ou retoma um dos dois livros do tempo.","A fonte tinha <b>512 tiles</b> e exatamente <b>três letras latinas</b> — <b>H</b>, <b>M</b> e <b>P</b>, as de HP e MP. O alfabeto inteiro foi desenhado e <b>77 tiles</b> foram reescritos sobre as casas de kana; o plano 1 de cada letra é o plano 0 invertido, e é por isso que a segunda metade da fonte inteira cabe em <b>oito bytes</b>. Os <b>1.386 blocos</b> do roteiro saíram do cartucho, <b>1.370 deles com texto para traduzir</b>, e hoje estão em inglês dentro da ROM — junto com <b>266 nomes</b> de item, magia, monstro e loja, que o menu acha por tabela de ponteiros.","O obstáculo não era o espaço, era o endereçamento. <b>Toda referência de texto deste motor cabe em 16 bits, e dois deles são o banco</b>: o jogo inteiro só enxerga <b>48 KB</b> de texto, e o inglês pedia <b>49,6 KB</b>. A saída foi deixar no lugar de cada fala um atalho de <b>quatro bytes</b> — assim nenhum ponteiro de evento precisou ser tocado, e eles estão espalhados por tabelas que ninguém mapeou — e mandar o texto para oito bancos da expansão, <b>128 KB</b>, alcançados por um roteador que ocupa <b>zero byte</b> do banco fixo: ele entra trocando os três bytes de uma chamada distante que já existia. <b>O patch ainda não está no ar</b>: falta jogar o jogo do começo ao fim, que é a única coisa que medição nenhuma substitui."],"en":["<i>Monster Maker</i> began as a Japanese card game — monster, treasure and dungeon dealt card by card — and was popular enough to become a Famicom RPG in <i>7 Tsu no Hihou</i>, the seven treasures. Outside Japan the name means nothing to anyone, and that is exactly the sort of cartridge that vanishes from history for having no language rather than for being no good. It saves to battery and opens on a prologue beginning <code>はるかなる むかし</code>, in a time long past, before asking whether you start from scratch or resume one of the two books of time.","The font held <b>512 tiles</b> and exactly <b>three Latin letters</b> — <b>H</b>, <b>M</b> and <b>P</b>, the ones from HP and MP. The whole alphabet was drawn and <b>77 tiles</b> rewritten over the kana slots; plane 1 of every letter is plane 0 inverted, which is why the entire second half of the font fits in <b>eight bytes</b>. The script's <b>1,386 blocks</b> came out of the cartridge, <b>1,370 of them with text to translate</b>, and today they sit in the ROM in English — along with <b>266 names</b> of items, spells, monsters and shops, which the menu finds through pointer tables.","The obstacle was not space, it was addressing. <b>Every text reference in this engine fits in 16 bits, and two of them are the bank</b>: the whole game can only see <b>48 KB</b> of text, and the English asked for <b>49.6 KB</b>. The way out was to leave a <b>four-byte</b> shortcut where each line used to be — so not one event pointer had to be touched, and they are scattered through tables nobody has mapped — and send the text to eight banks of the expansion, <b>128 KB</b>, reached by a router that costs <b>zero bytes</b> of the fixed bank: it goes in by replacing the three inline bytes of a far call that was already there. <b>The patch is not out yet</b>: the game still has to be played end to end, which is the one thing no measurement replaces."],"es":["<i>Monster Maker</i> nació como juego de cartas japonés — monstruo, tesoro y mazmorra repartidos carta a carta — y fue popular lo bastante para convertirse en RPG de Famicom en <i>7 Tsu no Hihou</i>, los siete tesoros. Fuera de Japón el nombre no le dice nada a nadie, y ese es exactamente el tipo de cartucho que desaparece de la historia por no tener idioma, no por no valer. El cartucho guarda con pila y abre con un prólogo que empieza en <code>はるかなる むかし</code>, en un tiempo muy lejano, antes de preguntar si empiezas de cero o retomas uno de los dos libros del tiempo.","La fuente tenía <b>512 tiles</b> y exactamente <b>tres letras latinas</b> — <b>H</b>, <b>M</b> y <b>P</b>, las de HP y MP. Se dibujó el alfabeto entero y se reescribieron <b>77 tiles</b> sobre las casillas de kana; el plano 1 de cada letra es el plano 0 invertido, y por eso la segunda mitad de la fuente entera cabe en <b>ocho bytes</b>. Los <b>1.386 bloques</b> del guion salieron del cartucho, <b>1.370 de ellos con texto que traducir</b>, y hoy están en inglés dentro de la ROM — junto con <b>266 nombres</b> de objeto, magia, monstruo y tienda, que el menú encuentra por tabla de punteros.","El obstáculo no era el espacio, era el direccionamiento. <b>Toda referencia de texto de este motor cabe en 16 bits, y dos de ellos son el banco</b>: el juego entero solo ve <b>48 KB</b> de texto, y el inglés pedía <b>49,6 KB</b>. La salida fue dejar en el lugar de cada frase un atajo de <b>cuatro bytes</b> — así no hubo que tocar ni un puntero de evento, y están repartidos por tablas que nadie ha mapeado — y mandar el texto a ocho bancos de la ampliación, <b>128 KB</b>, alcanzados por un enrutador que ocupa <b>cero bytes</b> del banco fijo: entra cambiando los tres bytes de una llamada lejana que ya existía. <b>El parche aún no está publicado</b>: falta jugar el juego de principio a fin, que es lo único que ninguna medición sustituye."]},"numeros":[{"v":"1.370","r":{"pt":"falas do roteiro em inglês","en":"lines of script in English","es":"frases del guion en inglés"}},{"v":"266","r":{"pt":"nomes de item, magia e monstro","en":"item, spell and monster names","es":"nombres de objeto, magia y monstruo"}},{"v":"128 KB","r":{"pt":"de texto alcançável, contra 48 do motor original","en":"of reachable text, against the engine's original 48","es":"de texto alcanzable, frente a los 48 del motor original"}}],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"monster-maker-en.ips","tamanho":"267 KB"},"pt":null,"es":null},"rom":"Monster Maker - 7 Tsu no Hihou (Japan).nes","rom_md5":"b10e90e81f3bdbe5a232ee34d746327e"},"fotos":[{"f":"mm/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O subtítulo já em inglês: <code>THE SEVEN TREASURES</code>.","en":"The subtitle already in English: <code>THE SEVEN TREASURES</code>.","es":"El subtítulo ya en inglés: <code>THE SEVEN TREASURES</code>."}},{"f":"mm/02-prologo.png","t":{"pt":"O prólogo em inglês","en":"The prologue in English","es":"El prólogo en inglés"},"c":{"pt":"A caixa mede <b>26 colunas por três linhas</b> — a linha que sobra entre elas é onde o japonês desenhava o dakuten.","en":"The box measures <b>26 columns by three lines</b> — the spare line between them is where Japanese drew the dakuten.","es":"La caja mide <b>26 columnas por tres líneas</b> — la línea que sobra entre ellas es donde el japonés dibujaba el dakuten."}},{"f":"mm/03-templo.png","t":{"pt":"O templo do deus mau","en":"The temple of the evil god","es":"El templo del dios malo"},"c":{"pt":"Cada uma destas frases mora num banco que o motor original não alcançava: no lugar dela ficou um atalho de quatro bytes.","en":"Every one of these lines lives in a bank the original engine could not reach: what stayed behind is a four-byte shortcut.","es":"Cada una de estas frases vive en un banco que el motor original no alcanzaba: en su lugar quedó un atajo de cuatro bytes."}}]},{"slug":"famicom-jump-2","nome":"Famicom Jump II","subtitulo":"Saikyou no 7 Nin","jp":"ファミコンジャンプII 最強の7人","traducao_titulo":"The Strongest Seven","publisher":"Bandai","dev":"Chunsoft","ano":1991,"data":"2 December 1991","sistema":"Famicom","mapper":"Mapper 153 (Bandai FCG) · 512 KB PRG · CHR-RAM · battery SRAM","primeiro":true,"categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"alfa","capa":"fj2/01-tela-titulo.png","linha":{"pt":"Goku, JoJo e mais cinco da Shōnen Jump no mesmo campo. O B virou ação coringa, e dois bytes acordaram uma cena de 1991.","en":"Goku, JoJo and five more Shōnen Jump heroes on one battlefield. B became the do-what-fits button, and two bytes woke a 1991 scene.","es":"Goku, JoJo y cinco más de la Shōnen Jump en un mismo campo. La B pasó a ser una acción comodín, y dos bytes despertaron una escena de 1991."},"resumo":{"pt":["A <i>Weekly Shōnen Jump</i> é a revista semanal em que o Dragon Ball saiu capítulo a capítulo, e em 1991 a Bandai e a Chunsoft puseram sete séries dela no mesmo campo de batalha: Goku, JoJo, o policial Ryotsu do <i>Kochikame</i>, Taruruto-kun, Tar-chan, Momotaro e Taison. Três dos sete entram por vez, a vida se conta em corações e até o alcance de caminhada é um atributo que sobe de nível — o manual chama o sistema de <b>S·A·S, Simulation Action System</b>.","Falar com alguém custava abrir o menu e escolher <code>はなす</code>; no campo, o <b>B</b> não fazia nada — a rotina existia e terminava em <code>RTS</code>. Agora o <b>B é ação coringa</b>: fala com quem está à frente e, não havendo ninguém, examina o chão sob os pés, que é a mesma divisão que o manual de 1991 faz entre os dois comandos. São <b>19 bytes</b> no trecho do kernel que fica sempre mapeado, mais 3 no banco 30, e o comando continua no menu para quem preferir. Junto vem um <b>prólogo de cinco páginas que não existe no original</b>: o menino levado para dentro da revista, o Rei Demônio Piccolo reunindo os vilões, os dezesseis heróis — porque seis dos sete nomes não dizem nada fora do Japão, e o jogo pressupõe que você leu a revista e jogou o <i>Famicom Jump</i> de 1989.","E uma cena voltou a funcionar. Na abertura, o espírito nomeia os seis campeões que faltavam encontrar, e o original mostrava <b>sempre os mesmos seis</b>, qualquer que fosse o herói inicial: quem começava como Taison ouvia o próprio nome na lista, e o Goku nunca era citado. O seletor de sete casos e as sete variantes de texto estavam gravados na ROM em 1991 e nunca disparavam, porque o roteiro punha o número num registrador e a rotina lia outro. <b>Dois bytes</b> depois, seis variantes que nunca haviam chegado a uma tela chegam. O roteiro inteiro está traduzido, num cartucho no teto do mapper 153 com <b>zero bytes livres</b>: em vez de cortar texto, a compressão foi trocada por um <b>Huffman de ordem 1</b> que leva o texto de 6,25 para <b>3,90 bits por caractere</b>, e a cada compilação as <b>1.903 posições de mensagem</b> da ROM são decodificadas de volta pelo decodificador 6502 real e comparadas com a fonte. Publicado em <b>inglês, português e espanhol</b>."],"en":["<i>Weekly Shōnen Jump</i> is the magazine that serialised Dragon Ball chapter by chapter, and in 1991 Bandai and Chunsoft put seven of its series on one battlefield: Goku, JoJo, <i>Kochikame</i>'s beat cop Ryotsu, Taruruto-kun, Tar-chan, Momotaro and Taison. Three of the seven fight at a time, health is counted in hearts, and even walking range is a stat that levels up — the manual calls the system <b>S·A·S, Simulation Action System</b>.","Talking to someone cost a trip into the menu to pick <code>はなす</code>; out in the field, <b>B</b> did nothing — the routine existed and ended in <code>RTS</code>. Now <b>B is the do-what-fits button</b>: it talks to whoever stands in front of you and, with nobody there, examines the ground underfoot, which is exactly the split the 1991 manual draws between the two commands. That is <b>19 bytes</b> in the always-mapped kernel plus 3 in bank 30, and the menu command stays for anyone who prefers it. With it comes a <b>five-page prologue that does not exist in the original</b>: the boy pulled into the magazine, Demon King Piccolo gathering the villains, the sixteen heroes — because six of those seven names mean nothing outside Japan, and the game assumes you read the magazine and played the 1989 <i>Famicom Jump</i>.","And one scene started working again. In the opening, a spirit names the six champions still to be found, and the original always showed <b>the same six</b>, whichever hero you began with: a player starting as Taison heard his own name on the list, and Goku was never mentioned. The seven-case selector and all seven text variants were burned into the 1991 ROM and never fired, because the script put the number in one register while the routine read another. <b>Two bytes</b> later, six variants that had never reached a screen do. The whole script is translated, in a cartridge at the mapper 153 ceiling with <b>zero free bytes</b>: rather than trim text, the compression was swapped for an <b>order-1 Huffman</b> taking it from 6.25 to <b>3.90 bits per character</b>, and on every build the ROM's <b>1,903 message positions</b> are decoded back by the real 6502 decoder and compared against the source. Published in <b>English, Portuguese and Spanish</b>."],"es":["La <i>Weekly Shōnen Jump</i> es la revista semanal en la que Dragon Ball salió capítulo a capítulo, y en 1991 Bandai y Chunsoft pusieron siete de sus series en el mismo campo de batalla: Goku, JoJo, el policía Ryotsu de <i>Kochikame</i>, Taruruto, Ta-chan, Momotaro y Taison. Tres de los siete entran a la vez, la vida se cuenta en corazones y hasta el alcance de movimiento es un atributo que sube de nivel — el manual llama al sistema <b>S·A·S, Simulation Action System</b>.","Hablar con alguien costaba abrir el menú y elegir <code>はなす</code>; en el campo, la <b>B</b> no hacía nada — la rutina existía y terminaba en <code>RTS</code>. Ahora <b>la B es una acción comodín</b>: habla con quien tengas delante y, si no hay nadie, examina el suelo bajo tus pies, que es la misma división que hace el manual de 1991 entre los dos comandos. Son <b>19 bytes</b> en el tramo del kernel que está siempre mapeado, más 3 en el banco 30, y el comando sigue en el menú para quien lo prefiera. Con él llega un <b>prólogo de cinco páginas que no existe en el original</b>: el niño llevado al interior de la revista, el Rey Demonio Piccolo reuniendo a los villanos, los dieciséis héroes — porque seis de esos siete nombres no dicen nada fuera de Japón, y el juego da por hecho que leíste la revista y jugaste al <i>Famicom Jump</i> de 1989.","Y una escena volvió a funcionar. En la apertura, el espíritu nombra a los seis campeones que quedan por encontrar, y el original mostraba <b>siempre los mismos seis</b>, fuera cual fuera el héroe inicial: quien empezaba como Taison oía su propio nombre en la lista, y a Goku no se le nombraba nunca. El selector de siete casos y las siete variantes de texto estaban grabados en la ROM en 1991 y no se disparaban nunca, porque el guion ponía el número en un registro y la rutina leía otro. <b>Dos bytes</b> después, seis variantes que nunca habían llegado a una pantalla llegan. El guion entero está traducido, en un cartucho en el techo del mapper 153 con <b>cero bytes libres</b>: en lugar de recortar texto, la compresión se cambió por un <b>Huffman de orden 1</b> que lleva el texto de 6,25 a <b>3,90 bits por carácter</b>, y en cada compilación las <b>1.903 posiciones de mensaje</b> de la ROM se decodifican de vuelta con el decodificador 6502 real y se comparan con el texto de origen. Publicado en <b>inglés, portugués y español</b>."]},"numeros":[{"v":"1,903","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"266","r":{"pt":"itens, lugares e nomes","en":"items, places and names","es":"objetos, lugares y nombres"}},{"v":"75","r":{"pt":"glifos latinos desenhados","en":"Latin glyphs drawn","es":"glifos latinos dibujados"}},{"v":"2","r":{"pt":"bytes que consertaram o jogo","en":"bytes that fixed the game","es":"bytes que arreglaron el juego"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.903 mensagens</b> — o roteiro inteiro, sem resumo e sem frase cortada","en":"<b>1,903 messages</b> — the entire script, nothing summarised, no sentence cut","es":"<b>1.903 mensajes</b> — el guion entero, sin resumir, sin una frase cortada"},"foto":"fj2/05-espirito-jump-world.png"},{"t":{"pt":"<b>266 nomes</b> de itens, lugares, monstros e do grupo, encurtados só quando o campo da tela não comporta","en":"<b>266 names</b> for items, places, monsters and the party, shortened only where the on-screen field cannot hold them","es":"<b>266 nombres</b> de objetos, lugares, monstruos y del grupo, acortados solo donde el campo de la pantalla no da"},"foto":"fj2/08-soulring.png"},{"t":{"pt":"<b>77 textos de menu</b> — status, loja, depósito, treino e título","en":"<b>77 menu strings</b> — status, shop, storage, training and title","es":"<b>77 textos de menú</b> — estado, tienda, almacén, entrenamiento y título"},"foto":"fj2/03-menu-ingles.png"},{"t":{"pt":"<b>13 mensagens de batalha</b> e as <b>6 páginas</b> do final","en":"<b>13 battle messages</b> and the <b>6 pages</b> of the ending","es":"<b>13 mensajes de combate</b> y las <b>6 páginas</b> del final"}},{"t":{"pt":"<b>Fonte latina de 75 glifos</b> desenhada para o jogo — maiúsculas, minúsculas, algarismos e pontuação — no lugar dos 141 tiles de kana do original","en":"<b>A 75-glyph Latin font</b> drawn for the game — capitals, lower case, digits and punctuation — replacing the original 141 kana tiles","es":"<b>Una fuente latina de 75 glifos</b> dibujada para el juego — mayúsculas, minúsculas, cifras y puntuación — en lugar de los 141 tiles de kana del original"}}]},{"titulo":{"pt":"Um bug de 1991, consertado","en":"A 1991 bug, fixed","es":"Un error de 1991, corregido"},"itens":[{"t":{"pt":"Na abertura, o espírito diz que sete campeões foram escolhidos e nomeia os seis que faltam achar. <b>Desde 1991 ele nomeia sempre os mesmos seis</b> — quem começa como Taison é mandado procurar o Taison, e o Goku nunca é citado.","en":"In the opening, a spirit says seven champions have been chosen and names the six you still have to find. <b>It has named the same six since 1991</b> — start as Taison and it sends you to go find Taison, and Goku is never named at all.","es":"En la apertura, el espíritu dice que se han elegido siete campeones y nombra a los seis que faltan por encontrar. <b>Desde 1991 nombra siempre a los mismos seis</b> — si empiezas como Taison te manda a buscar a Taison, y a Goku no lo nombra nunca."},"foto":"fj2/06-lista-sete-campeoes.png"},{"t":{"pt":"Não era limitação do cartucho: <b>o código certo já estava lá</b>. A cena tem um seletor de sete casos, um por herói inicial, e as sete variantes de texto estão gravadas na ROM. O seletor nunca disparava — o roteiro punha o número do herói no acumulador e a rotina chamada lia o registrador X, que trazia lixo da chamada anterior.","en":"This was never a limitation of the cartridge: <b>the correct code is already in the ROM</b>. The scene has a seven-way selector, one branch per starting hero, and all seven text variants are sitting there. The selector never fired — the script loads the hero number into the accumulator and the routine it calls reads it from X, which still held leftovers from the previous call.","es":"No era una limitación del cartucho: <b>el código correcto ya estaba en la ROM</b>. La escena tiene un selector de siete casos, uno por héroe inicial, y las siete variantes de texto están grabadas. El selector no disparaba nunca — el guion ponía el número del héroe en el acumulador y la rutina llamada lo leía del registro X, que traía basura de la llamada anterior."}},{"t":{"pt":"A correção são <b>dois bytes</b>, apontando a carga para o registrador certo. Nada foi reescrito. <b>Seis das sete variantes não apareciam numa tela havia trinta e cinco anos.</b>","en":"The fix is <b>two bytes</b>, pointing the load at the right register. Nothing was rewritten. <b>Six of the seven variants had not reached a screen in thirty-five years.</b>","es":"La corrección son <b>dos bytes</b>, apuntando la carga al registro correcto. No se reescribió nada. <b>Seis de las siete variantes no habían llegado a una pantalla en treinta y cinco años.</b>"},"foto":"fj2/07-e-voce-tambem-goku.png"}]},{"titulo":{"pt":"Conteúdo novo","en":"New content","es":"Contenido nuevo"},"itens":[{"t":{"pt":"<b>Prólogo de cinco páginas</b>, escrito do zero, recapitulando o <i>Famicom Jump: Eiyuu Retsuden</i> de 1989 — para quem chega ao segundo jogo sem ter jogado o primeiro","en":"<b>A five-page prologue</b>, newly written, recapping <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — for anyone arriving at the second game without the first","es":"<b>Un prólogo de cinco páginas</b>, escrito de cero, que recapitula <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — para quien llega al segundo juego sin el primero"},"foto":"fj2/04-prologo-novo.png"},{"t":{"pt":"<b>Tela de créditos</b> antes do título: 5 segundos, pula com A ou START. Cabe inteira — código, paleta e texto — em 355 bytes de espaço morto do banco do título","en":"<b>A credits screen</b> before the title: 5 seconds, skippable with A or START. The whole thing — code, palette and text — fits in 355 bytes of dead space in the title bank","es":"<b>Una pantalla de créditos</b> antes del título: 5 segundos, se salta con A o START. Cabe entera — código, paleta y texto — en 355 bytes de espacio muerto del banco del título"},"foto":"fj2/02-creditos.png"},{"t":{"pt":"<b>Selo <code>DEFINITIVE EDITION</code></b> no rodapé do título, sem tirar nada e <b>sem gastar um byte a mais</b>: reescrever o escritor do subtítulo para ser dirigido por tabela liberou seis tiles, e o rodapé só precisava de quatro letras novas","en":"<b>A <code>DEFINITIVE EDITION</code> seal</b> on the title footer, taking nothing away and <b>costing zero extra bytes</b>: rewriting the subtitle routine to be table-driven freed six tile slots, and the seal needed only four letters that were not already there","es":"<b>Un sello <code>DEFINITIVE EDITION</code></b> en el pie del título, sin quitar nada y <b>sin gastar un byte de más</b>: reescribir la rutina del subtítulo para que fuera dirigida por tabla liberó seis tiles, y el sello solo necesitaba cuatro letras que no estuvieran ya"},"foto":"fj2/01-tela-titulo.png"},{"t":{"pt":"<b>Botão B contextual.</b> No original, falar com alguém custa abrir o menu; o B não fazia nada no campo. Agora o B fala com quem estiver à frente e, não havendo ninguém, examina o chão — a mesma divisão que o manual faz entre <code>はなす</code> e <code>しらべる</code>. O comando continua no menu para quem preferir.","en":"<b>A context-sensitive B button.</b> In the original, talking to someone costs a menu; B did nothing in the field. Now B talks to whoever is in front of you and, when nobody is, examines the ground — the same split the manual draws between <code>はなす</code> and <code>しらべる</code>. The menu command is still there for anyone who prefers it.","es":"<b>Botón B contextual.</b> En el original, hablar con alguien cuesta abrir el menú; la B no hacía nada en el campo. Ahora la B habla con quien tengas delante y, si no hay nadie, examina el suelo — la misma división que hace el manual entre <code>はなす</code> y <code>しらべる</code>. El comando sigue en el menú para quien lo prefiera."}}]},{"titulo":{"pt":"A engenharia","en":"The engineering","es":"La ingeniería"},"itens":[{"t":{"pt":"Medido em tradução real, o inglês ocupa <b>1,51×</b> os caracteres do japonês. Não cabia: faltavam cerca de <b>20 KB</b> — num cartucho no teto do mapper, com <b>zero bytes livres</b>.","en":"Measured on the real translation, English runs <b>1.51×</b> the character count of the Japanese. It did not fit: the script was about <b>20 KB</b> over — on a cartridge at the mapper ceiling, with <b>zero free bytes</b>.","es":"Medido en traducción real, el inglés ocupa <b>1,51×</b> los caracteres del japonés. No cabía: faltaban unos <b>20 KB</b> — en un cartucho en el techo del mapper, con <b>cero bytes libres</b>."}},{"t":{"pt":"Em vez de cortar texto, <b>troquei a compressão</b>. Um <b>Huffman de ordem 1</b> — a árvore escolhida pelo caractere anterior, em 26 grupos de contexto — leva o texto de 6,25 para <b>3,90 bits por caractere</b>. O decodificador tem <b>89 bytes</b> de 6502 escritos à mão.","en":"Rather than trim text, <b>I replaced the compression</b>. An <b>order-1 Huffman coder</b> — the tree picked by the previous character, across 26 context groups — takes the script from 6.25 to <b>3.90 bits per character</b>. The decoder is <b>89 bytes</b> of hand-written 6502.","es":"En vez de cortar texto, <b>cambié la compresión</b>. Un <b>Huffman de orden 1</b> — el árbol elegido por el carácter anterior, en 26 grupos de contexto — lleva el texto de 6,25 a <b>3,90 bits por carácter</b>. El decodificador son <b>89 bytes</b> de 6502 escritos a mano."}},{"t":{"pt":"As tabelas dos 26 grupos couberam nos <b>1.060 bytes</b> úteis do banco do dicionário antigo mais 65 bytes de enchimento no fim dele. O roteiro inglês fechou em <b>65,9 KB dentro de 68,1 KB</b> — folga de 2,2 KB num cartucho cujo maior vão livre tem 137 bytes.","en":"The tables for the 26 groups fit in the <b>1,060 usable bytes</b> of the old dictionary bank plus 65 bytes of padding at the end of it. The English script closes at <b>65.9 KB inside 68.1 KB</b> — a 2.2 KB margin on a cartridge whose longest free run is 137 bytes.","es":"Las tablas de los 26 grupos cupieron en los <b>1.060 bytes</b> útiles del banco del diccionario antiguo más 65 bytes de relleno al final. El guion inglés cerró en <b>65,9 KB dentro de 68,1 KB</b> — un margen de 2,2 KB en un cartucho cuyo mayor hueco libre tiene 137 bytes."}},{"t":{"pt":"<b>Cada compilação se confere.</b> Uma guarda aborta se qualquer byte fora das regiões declaradas mudar, e outra se duas partes do hack reivindicarem o mesmo byte. As 1.903 mensagens são decodificadas de volta <b>pelo decodificador 6502 real rodando sobre a ROM final</b> e comparadas com a fonte. Um teste de estresse de <b>30.000 quadros</b> com entrada aleatória roda ao lado do cenário exato que travava versões antigas.","en":"<b>Every build checks itself.</b> A guard aborts if any byte outside the declared regions moved, and a second one if two parts of the hack claim the same byte. All 1,903 messages are decoded back <b>by the real 6502 decoder running on the finished ROM</b> and compared to the source. A <b>30,000-frame</b> random-input stress test runs alongside the exact scenario that crashed earlier builds.","es":"<b>Cada compilación se comprueba a sí misma.</b> Una guarda aborta si cambia cualquier byte fuera de las regiones declaradas, y otra si dos partes del hack reclaman el mismo byte. Los 1.903 mensajes se decodifican de vuelta <b>con el decodificador 6502 real corriendo sobre la ROM final</b> y se comparan con el original. Una prueba de estrés de <b>30.000 fotogramas</b> con entrada aleatoria corre junto al escenario exacto que colgaba las versiones antiguas."}}]},{"titulo":{"pt":"Quatro defeitos que eu mesmo introduzi","en":"Four bugs I introduced myself","es":"Cuatro fallos que introduje yo mismo"},"itens":[{"t":{"pt":"Ficam registrados por honestidade. <b>A placa do título</b> perdeu a moldura branca e os raios rosa porque a primeira versão do logo apagou 47 tiles para caber — a arte foi devolvida na íntegra, com <b>zero pixels de diferença</b> conferidos por contagem.","en":"They are recorded here for honesty. <b>The title plaque</b> lost its white border and pink rays because my first logo deleted 47 tiles to make room — the art was restored in full, at <b>zero pixels of difference</b>, checked by counting.","es":"Quedan registrados por honestidad. <b>La placa del título</b> perdió el borde blanco y los rayos rosas porque mi primer logo borró 47 tiles para caber — la ilustración se devolvió entera, con <b>cero píxeles de diferencia</b>, comprobado contando."}},{"t":{"pt":"A oitava imagem da animação da placa é a própria cauda do stream do fundo — a Bandai não guardou duas cópias. Com o logo novo esse ponteiro caía no meio do logo e, após ~46 s parado no título, a placa se enchia de lixo.","en":"The eighth frame of the plaque animation is the tail of the background stream itself — Bandai did not keep two copies. With the new logo that pointer landed in the middle of the logo, and after about 46 seconds sitting on the title screen the plaque filled with garbage.","es":"El octavo fotograma de la animación de la placa es la propia cola del stream del fondo — Bandai no guardó dos copias. Con el logo nuevo ese puntero caía en mitad del logo y, tras unos 46 segundos parado en el título, la placa se llenaba de basura."}},{"t":{"pt":"<b>Uma aspa a mais em cada troca de página</b> — 281 linhas extras ao longo do roteiro — era o que fazia a caixa de fala estourar e deixar um <b>balão fantasma</b> preso no cenário. As correções fecharam a classe inteira, e agora a compilação <b>simula o próprio motor de texto do jogo</b> sobre o roteiro final e aborta se alguma página passar de 21 colunas por 3 linhas.","en":"<b>A stray quotation mark at every page break</b> — 281 extra lines across the script — was the real cause of the dialogue box overflowing and leaving a <b>ghost balloon</b> stuck in the scenery. The fixes closed the whole class, and the build now <b>simulates the game’s own text engine</b> over the final script and aborts if any page exceeds 21 columns by 3 lines.","es":"<b>Una comilla de más en cada salto de página</b> — 281 líneas extra a lo largo del guion — era la causa real de que la caja de diálogo se desbordara y dejara un <b>globo fantasma</b> atrapado en el escenario. Las correcciones cerraron la clase entera, y ahora la compilación <b>simula el propio motor de texto del juego</b> sobre el guion final y aborta si alguna página pasa de 21 columnas por 3 líneas."}}]}],"patch":{"versoes":{"en":{"arquivo":"famicom-jump-2-en.ips","tamanho":"74 KB"},"pt":{"arquivo":"famicom-jump-2-pt.ips","tamanho":"75 KB"},"es":{"arquivo":"famicom-jump-2-es.ips","tamanho":"75 KB"}},"rom":"Famicom Jump II - Saikyou no 7 Nin (Japan
