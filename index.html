contraseña</b>. Ahora el juego <b>graba con pila</b>: guarda al abrir el <code>SCORE MEMO</code> del entrenador y carga en el <code>CONTINUE</code> de la pantalla de título."},"foto":"ct/07-memo.png"},{"t":{"pt":"<b>Nada de serialização nova.</b> O estado guardado é exatamente o que a senha já guardava — os mesmos 24 bytes — provado por duas rotinas independentes do próprio jogo. A integridade usa <b>a mesma rotina que valida senha digitada</b>.","en":"<b>No new serialisation.</b> The state saved is exactly what the password already carried — the same 24 bytes — proved against two independent routines in the game itself. Integrity checking uses <b>the same routine that validates a typed password</b>.","es":"<b>Sin inventar serialización.</b> El estado guardado es exactamente lo que la contraseña ya llevaba — los mismos 24 bytes — probado contra dos rutinas independientes del propio juego. La integridad usa <b>la misma rutina que valida una contraseña escrita</b>."},"foto":"ct/08-save.png"},{"t":{"pt":"São <b>97 bytes</b> de código novo em seis lugares. Testado desligando e ligando de verdade, com dois processos de emulador e um <code>.sav</code> real no meio: <b>0 de 4.096 bytes</b> de nametable diferentes depois do ciclo. Negativos cobertos: sem save, save corrompido em 1 bit, bateria gasta, e começar jogo novo sem apagar o save.","en":"It is <b>97 bytes</b> of new code in six places. Tested by really powering off and on, with two emulator processes and a real <code>.sav</code> in between: <b>0 of 4,096 bytes</b> of nametable differ after the cycle. Negatives covered: no save, save corrupted by one bit, dead battery, and starting a new game without erasing the save.","es":"Son <b>97 bytes</b> de código nuevo en seis sitios. Probado apagando y encendiendo de verdad, con dos procesos de emulador y un <code>.sav</code> real de por medio: <b>0 de 4.096 bytes</b> de nametable distintos tras el ciclo. Negativos cubiertos: sin guardado, guardado corrupto en 1 bit, pila gastada, y empezar partida nueva sin borrar lo guardado."}}]},{"titulo":{"pt":"Os logos","en":"The logos","es":"Los logos"},"itens":[{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>CAPTAIN TSUBASA</code> em duas linhas, no mesmo estilo e na mesma paleta, com a bola redesenhada e o avião movido para o canto. São <b>122 tiles</b> nos 127 disponíveis, e a tela reconstruída da ROM bate com o mockup em <b>0 pixels</b> de diferença.","en":"<b>The title logo redrawn</b> — <code>CAPTAIN TSUBASA</code> on two lines, in the same style and palette, with the ball redrawn and the aeroplane moved to the corner. It is <b>122 tiles</b> in the 127 available, and the screen reconstructed from the ROM matches the mockup at <b>0 pixels</b> of difference.","es":"<b>Logo del título redibujado</b> — <code>CAPTAIN TSUBASA</code> en dos líneas, en el mismo estilo y la misma paleta, con el balón redibujado y el avión movido a la esquina. Son <b>122 tiles</b> de los 127 disponibles, y la pantalla reconstruida desde la ROM coincide con el mockup con <b>0 píxeles</b> de diferencia."},"foto":"ct/01-titulo.png"},{"t":{"pt":"<b>O logo pequeno da sala de aula</b>, feito de 13 sprites, redesenhado como <code>TSUBASA</code> em miniatura — só os bitmaps mudam, as posições são as do jogo.","en":"<b>The small classroom logo</b>, made of 13 sprites, redrawn as a miniature <code>TSUBASA</code> — only the bitmaps change, the positions are the game’s own.","es":"<b>El logo pequeño del aula</b>, hecho de 13 sprites, redibujado como <code>TSUBASA</code> en miniatura — solo cambian los bitmaps, las posiciones son las del juego."}}]},{"titulo":{"pt":"Como se provou que nada quebrou","en":"How it was proved nothing broke","es":"Prueba, y lo que sigue abierto"},"itens":[{"t":{"pt":"<b>A relocação foi provada por igualdade.</b> Uma build que só move o texto japonês, sem traduzir nada, foi comparada com a ROM original: <b>225 dumps, 0 bytes diferentes</b> em nametable, OAM e paleta no percurso inteiro. Se mover o texto tivesse quebrado alguma coisa, essa build já mostraria.","en":"<b>Relocation was proved by equality.</b> A build that only moves the Japanese text, translating nothing, was compared against the original ROM: <b>225 dumps, 0 bytes differing</b> in nametable, OAM and palette across the whole run. If moving the text had broken anything, that build would already show it.","es":"<b>La reubicación se probó por igualdad.</b> Una compilación que solo mueve el texto japonés, sin traducirlo, se comparó con la original: <b>225 volcados, 0 bytes distintos</b> en nametable, OAM y paleta en todo el recorrido. Dos defectos reales aparecieron solo en esa prueba."}},{"t":{"pt":"<b>Dois defeitos reais só apareceram nesse teste</b>, e não em nenhum outro: uma rotina que trocava de banco por byte estourava o quadro e fazia sumir uma linha do torneio, e uma string que mora na RAM — e que o jogo <b>escreve</b> — fazia os números das camisas saírem errados. Nenhum dos dois apareceria numa leitura de código.","en":"<b>Two real defects showed up only in that test</b>, and in no other: a routine switching banks byte by byte overran the frame and made a line of the tournament vanish, and a string that lives in RAM — and that the game <b>writes to</b> — made the shirt numbers come out wrong. Neither would have shown up in a code review.","es":"Sigue abierto: el <b>motor de créditos</b> no está reubicado, la pantalla de <b>error de contraseña</b> tiene 19 caracteres fijos en el código, y la lista de nombres del <b>final</b> aún debe cambiar de columna. Por eso la etiqueta es <b>beta</b>, y no lanzamiento."}},{"t":{"pt":"O save novo foi testado <b>desligando e ligando de verdade</b>, com dois processos de emulador e um arquivo de save real de permeio — não com savestate, que não prova bateria nenhuma.","en":"The new save was tested by <b>really powering off and on</b>, with two emulator processes and a real save file in between — not with a savestate, which proves nothing about a battery.","es":"El guardado nuevo se probó <b>apagando y encendiendo de verdad</b>, con dos procesos de emulador y un archivo de guardado real de por medio — no con un savestate, que no prueba nada sobre la pila."}}]}],"patch":{"versoes":{"en":{"arquivo":"captain-tsubasa-en.ips","tamanho":"164 KB"},"pt":{"arquivo":"captain-tsubasa-pt.ips","tamanho":"163 KB"},"es":{"arquivo":"captain-tsubasa-es.ips","tamanho":"164 KB"}},"rom":"Captain Tsubasa (Japan).nes","rom_md5":"eeb77e6e0e0b5695f9a35f47979c4722"},"fotos":[{"f":"ct/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em 122 tiles, com a bola nova e o avião no canto.","en":"The logo redrawn in 122 tiles, with the new ball and the aeroplane in the corner.","es":"El logo redibujado en 122 tiles, con el balón nuevo y el avión en la esquina."}},{"f":"ct/03-narrador.png","t":{"pt":"Narração","en":"Commentary","es":"Narración"},"c":{"pt":"Quatro linhas onde cabiam duas: o código de controle novo dobra a largura útil.","en":"Four lines where two used to fit: the new control code doubles the usable width.","es":"Cuatro líneas donde cabían dos: el código de control nuevo dobla el ancho útil."}},{"f":"ct/02-sala.png","t":{"pt":"Sala de aula","en":"Classroom","es":"Aula"},"c":{"pt":"O menu do técnico — <code>Info</code>, <code>Senha</code>, <code>Jogar</code> — e a segunda fonte do jogo.","en":"The coach’s menu — <code>SCOUT</code>, <code>MEMO</code>, <code>PLAY</code> — and the game’s second font.","es":"El menú del entrenador — <code>SCOUT</code>, <code>MEMO</code>, <code>PLAY</code> — y la segunda fuente del juego."}},{"f":"ct/04-ficha.png","t":{"pt":"Ficha do jogador","en":"Player card","es":"Ficha del jugador"},"c":{"pt":"Level, Max Guts e os seis atributos, com a lista do elenco ao lado.","en":"Level, Max Guts and the six stats, with the squad list beside it.","es":"Level, Max Guts y los seis atributos, con la lista de la plantilla al lado."}},{"f":"ct/05-jogo.png","t":{"pt":"Em jogo","en":"In play","es":"En juego"},"c":{"pt":"O menu de ação durante a partida, com o Guts descendo a cada jogada.","en":"The action menu during a match, with Guts draining on every play.","es":"El menú de acción durante el partido, con el Guts bajando en cada jugada."}},{"f":"ct/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"A grade latinizada — e a senha gerada passa na validação original do jogo.","en":"The latinised grid — and a generated password passes the game’s own validation.","es":"La rejilla latinizada — y la contraseña generada pasa la validación original del juego."}},{"f":"ct/07-memo.png","t":{"pt":"Score Memo","en":"Score Memo","es":"Score Memo"},"c":{"pt":"O instante em que o jogo grava: a Sanae dá a senha, e o save vai junto.","en":"The moment the game saves: Sanae reads out the password, and the save goes with it.","es":"El instante en que el juego guarda: Sanae dicta la contraseña, y el guardado va con ella."}},{"f":"ct/08-save.png","t":{"pt":"Carregado da bateria","en":"Loaded from battery","es":"Cargado de la pila"},"c":{"pt":"Depois de desligar e ligar de verdade — <code>16a Copa Nacional Juvenil</code>, exatamente onde parou.","en":"After a real power cycle — <code>16th All-Japan Jr. Cup</code>, exactly where it stopped.","es":"Tras apagar y encender de verdad — <code>16th All-Japan Jr. Cup</code>, exactamente donde se quedó."}}],"manual_pdf":{"en":null,"pt":null,"es":null}},{"slug":"dragon-ball-3","nome":"Dragon Ball 3","subtitulo":"Gokuu Den","jp":"ドラゴンボール3 悟空伝","traducao_titulo":"Legend of Goku","publisher":"Bandai","dev":"Bandai","ano":1989,"data":"1989","sistema":"Famicom","mapper":"Mapper 16 (Bandai FCG-1/2) · 128 KB PRG expanded to 256 KB · 256 KB CHR","categoria":{"pt":"Tradução + arte","en":"Translation + artwork","es":"Traducción + arte"},"nivel":"release","versao":"English v1.0 · Português v1.0","capa":"db3/01-titulo.png","linha":{"pt":"Dragon Ball em cartas, 1989. O número de defesa da carta era um kanji desenhado na arte; agora é algarismo, e o treino deixou de ser no chute.","en":"Dragon Ball as a 1989 card RPG. The defence number was a kanji drawn into the art; now it is a digit, and training is no longer guesswork.","es":"El RPG de tablero y cartas de Dragon Ball. Lo difícil aquí no fue el texto — fue el <b>kanji dibujado</b>, que no es texto y no se traduce solo."},"resumo":{"pt":["Este é o Dragon Ball de tabuleiro: você anda pelo mapa, tira uma carta e luta com ela. O jogo reconta a saga do Goku desde o começo — a caça às esferas do dragão, o Torneio de Artes Marciais, o Rei Cutelo — e é a Bandai levando o mangá ao Famicom em 1989, com o baralho decidindo o turno anos antes de isso virar um gênero.","Cada carta traz uma bola com o <b>número de defesa</b> embaixo, e esse número era um <b>algarismo kanji</b> desenhado nos gráficos: 一二三四五六. Não é enfeite — o jogo manda compará-lo. O Karin só aceita carta com defesa igual ou maior que a dele, e o Mr. Popo aceita carta que bata em estrelas, técnica <i>ou</i> defesa. Quem não lê kanji jogava dois dos três treinos no chute. As seis bolas foram repintadas com <b>algarismo latino</b>, e a arte é tão parecida entre elas que só <b>53 pixels divergem</b> nos seis blocos de 16×16, todos no miolo onde morava o kanji. Os dez kanji das cartas — 拳 蹴 連 必 術 逃 ? 体 特 武 — também são tiles desenhados à mão, e viraram rótulos de três letras numa <b>mini-fonte de 5×7 px</b> feita para o caso: três letras de 5 px ocupam 15 dos 16 px do slot, sem espaço entre elas. O sentido de cada uma foi conferido contra o manual da Bandai de 1989, e foi ele que corrigiu a carta 体, que não é defesa: 体当り é investida corporal, um ataque.","O roteiro inteiro está em inglês — <b>1.305 de 1.305 mensagens</b>, mais as 40 de batalha e treino — dentro de uma caixa de <b>três linhas por vinte e quatro colunas</b> que o jogo não sabe continuar na tela seguinte. <b>164 mensagens</b> passavam de 45 glifos no japonês e foram reescritas para caber sem perder o sentido, e <b>254</b> das que ficaram fecham sem uma coluna sobrando. O título 悟空伝 foi refeito como <code>LEGEND OF GOKU</code> dentro dos mesmos 96×32 pixels, a ROM cresceu de <b>128 para 256 KB</b>, e a grade de senha virou letras latinas sem colisão entre símbolos: <b>quem tem uma senha anotada desde 1989 pode digitá-la aqui</b>."],"en":["This is Dragon Ball as a board game: you move across the map, draw a card and fight with it. It retells Goku's saga from the beginning — the hunt for the dragon balls, the Martial Arts Tournament, King Piccolo — and it is Bandai bringing the manga to the Famicom in 1989, with the deck deciding the turn years before that became a genre.","Every card carries a ball with its <b>defence number</b> underneath, and that number was a <b>kanji numeral</b> drawn into the graphics: 一二三四五六. It is not decoration — the game tells you to compare it. Karin only accepts a card whose defence matches or beats his own, and Mr. Popo accepts a card that wins on stars, technique <i>or</i> defence. Anyone who cannot read kanji was guessing through two of the three trainings. The six balls were repainted with <b>Latin digits</b>, and the artwork is so nearly identical between them that only <b>53 pixels differ</b> across the six 16×16 blocks, all in the core where the kanji used to sit. The ten card kanji — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn tiles too, and became three-letter labels in a <b>5×7 px mini-font</b> built for the job: three 5 px letters fill 15 of the slot's 16 px, with no gap between them. Each meaning was checked against Bandai's 1989 manual, and it was the manual that corrected the 体 card, which is not defence: 体当り is a body slam, an attack.","The whole script is in English — <b>1,305 of 1,305 messages</b>, plus the 40 for battle and training — inside a box of <b>three lines by twenty-four columns</b> that the game cannot continue onto a following screen. <b>164 messages</b> ran past 45 glyphs in Japanese and were rewritten to fit without losing their sense, and <b>254</b> of those that stayed close with not a column to spare. The 悟空伝 title was remade as <code>LEGEND OF GOKU</code> inside the same 96×32 pixels, the ROM grew from <b>128 to 256 KB</b>, and the password grid became Latin letters with no symbol collisions: <b>a password written down in 1989 still types in</b>."],"es":["Avanzas por un tablero, robas cartas y luchas con ellas. Cada carta lleva un <b>kanji</b> que dice lo que hace — y ese kanji es <b>ilustración</b>, dibujada en los gráficos, no un carácter de fuente. Traducir el juego exigía redibujar diez de ellos, uno a uno.","El guion está entero en inglés: <b>1.305 mensajes</b>, dentro de una caja de tres líneas por veinticuatro columnas — sin código de \"continúa en la siguiente caja\" que rescate a nadie."]},"numeros":[{"v":"1,305","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"96","r":{"pt":"nomes, golpes e nomes de batalha","en":"names, techniques and battle names","es":"nombres, técnicas y nombres de batalla"}},{"v":"10","r":{"pt":"kanji redesenhados como arte","en":"kanji redrawn as artwork","es":"kanji redibujados como ilustración"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.305 de 1.305 mensagens</b> em inglês — o roteiro inteiro","en":"<b>1,305 of 1,305 messages</b> in English — the entire script","es":"<b>1.305 de 1.305 mensajes</b> en inglés — el guion entero"},"foto":"db3/04-dialogo.png"},{"t":{"pt":"<b>66 personagens e inimigos, 14 golpes, 16 nomes de batalha</b>, com o glossário casado com os nomes oficiais da Viz","en":"<b>66 characters and enemies, 14 techniques, 16 battle names</b>, with the glossary matched to the official Viz names","es":"<b>66 personajes y enemigos, 14 técnicas, 16 nombres de batalla</b>, con el glosario casado con los nombres oficiales de Viz"}},{"t":{"pt":"O limite não é o comprimento do texto, é a <b>caixa</b>: três linhas por vinte e quatro colunas, e o jogo não tem código de continuação. <b>164 mensagens</b> tinham 45 ou mais glifos no japonês e foram comprimidas sem perder o sentido.","en":"The limit is not the length of the text, it is the <b>box</b>: three lines by twenty-four columns, and the game has no continuation code. <b>164 messages</b> ran to 45 or more glyphs in Japanese and were compressed without losing their sense.","es":"El límite no es la longitud del texto, es la <b>caja</b>: tres líneas por veinticuatro columnas, y el juego no tiene código de continuación. <b>164 mensajes</b> llegaban a 45 o más glifos en japonés y se comprimieron sin perder el sentido."}},{"t":{"pt":"Os <b>614 pares</b> de aspas japonesas「 」viraram aspas latinas <b>sem custar um byte</b>.","en":"The <b>614 pairs</b> of Japanese quotation marks 「 」 became Latin quotes <b>at no byte cost</b>.","es":"Los <b>614 pares</b> de comillas japonesas 「 」 pasaron a comillas latinas <b>sin costar un byte</b>."}}]},{"titulo":{"pt":"O que não era texto","en":"What was not text","es":"Lo que no era texto"},"itens":[{"t":{"pt":"<b>Os dez kanji das cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — são tiles de 16×16 desenhados à mão, não caracteres. Viraram abreviações latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por isso a <code>かんじのカード</code> virou <b>symbol card</b> e não \"kanji card\": chamar de kanji viraria mentira na tela.","en":"<b>The ten card kanji</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn 16×16 tiles, not characters. They became Latin abbreviations: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. That is why <code>かんじのカード</code> became <b>symbol card</b> and not \"kanji card\": calling it kanji would have been a lie on screen.","es":"<b>Los diez kanji de las cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — son tiles de 16×16 dibujados a mano, no caracteres. Pasaron a ser abreviaturas latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por eso la <code>かんじのカード</code> pasó a ser <b>symbol card</b> y no \"kanji card\": llamarla kanji sería mentira en pantalla."},"foto":"db3/05-cartas.png"},{"t":{"pt":"<b>As seis bolas de defesa</b> traziam os numerais cursivos 一 a 六, também desenhados. Agora trazem <b>1 a 6</b>.","en":"<b>The six defence balls</b> carried the cursive numerals 一 to 六, also drawn. They now carry <b>1 to 6</b>.","es":"<b>Las seis bolas de defensa</b> llevaban los numerales cursivos 一 a 六, también dibujados. Ahora llevan <b>1 a 6</b>."}},{"t":{"pt":"<b>O título 悟空伝</b> — doze tiles por quatro, 96×32 pixels de arte — foi redesenhado como <code>LEGEND OF GOKU</code>, dentro do mesmo espaço.","en":"<b>The 悟空伝 title</b> — twelve tiles by four, 96×32 pixels of artwork — was redrawn as <code>LEGEND OF GOKU</code>, inside the same space.","es":"<b>El título 悟空伝</b> — doce tiles por cuatro, 96×32 píxeles de ilustración — fue redibujado como <code>LEGEND OF GOKU</code>, dentro del mismo espacio."},"foto":"db3/01-titulo.png"}]},{"titulo":{"pt":"A senha, e a promessa de não quebrá-la","en":"The password, and the promise not to break it","es":"La contraseña, y la promesa de no romperla"},"itens":[{"t":{"pt":"<b>A grade de senha virou letras latinas</b>, sem colisão entre símbolos — e <b>as senhas antigas continuam válidas</b>. Quem tem uma senha anotada de 1989 pode digitá-la aqui.","en":"<b>The password grid became Latin letters</b>, with no collisions between symbols — and <b>old passwords remain valid</b>. Anyone with a password written down since 1989 can type it in here.","es":"<b>La rejilla de contraseña pasó a letras latinas</b>, sin colisiones entre símbolos — y <b>las contraseñas antiguas siguen valiendo</b>. Quien tenga una anotada de 1989 puede escribirla aquí."},"foto":"db3/06-senha.png"},{"t":{"pt":"<b>Tela de créditos do patch</b> antes do título — página branca, 5 segundos, pula com A ou START.","en":"<b>A patch credits screen</b> before the title — white page, 5 seconds, skippable with A or START.","es":"<b>Pantalla de créditos del parche</b> antes del título — página blanca, 5 segundos, se salta con A o START."},"foto":"db3/02-creditos.png"}]},{"titulo":{"pt":"A ROM cresceu, e a original não foi tocada","en":"The ROM grew, and the original was never touched","es":"La ROM creció, y la original nunca se tocó"},"itens":[{"t":{"pt":"O texto inglês não cabia na origem, então a ROM foi <b>expandida de 128 KB para 256 KB</b> de código. O construtor monta a ROM inteira do zero, <b>nunca escreve na original</b> (ela é somente leitura, e o MD5 é conferido ao abrir) e <b>aborta se qualquer byte mudar fora das regiões declaradas</b>.","en":"The English text did not fit where it was, so the ROM was <b>expanded from 128 KB to 256 KB</b> of code. The builder assembles the whole ROM from scratch, <b>never writes to the original</b> (it is read-only, and the MD5 is checked on open) and <b>aborts if any byte changes outside the declared regions</b>.","es":"El texto inglés no cabía donde estaba, así que la ROM se <b>amplió de 128 KB a 256 KB</b> de código. El constructor monta la ROM entera desde cero, <b>nunca escribe en la original</b> (es de solo lectura, y el MD5 se comprueba al abrir) y <b>aborta si cambia cualquier byte fuera de las regiones declaradas</b>."}},{"t":{"pt":"Um verificador confere <b>as 1.305 mensagens e os 112 nomes</b> na ROM montada antes de qualquer coisa sair.","en":"A checker verifies <b>all 1,305 messages and 112 names</b> on the assembled ROM before anything ships.","es":"Un verificador comprueba <b>los 1.305 mensajes y los 112 nombres</b> en la ROM montada antes de que salga nada."}}]},{"titulo":{"pt":"Batalha e treino, fechados","en":"Battle and training, closed","es":"Combate y entrenamiento, cerrados"},"itens":[{"t":{"pt":"As <b>40 mensagens</b> de batalha e treino, nos dois blocos do banco 3, estão traduzidas — <b>inclusive as que carregam um número no meio</b>, disfarçado de espaço. Era a última coisa que segurava o lançamento: encurtar o texto sem saber como o jogo posiciona esse número poria o algarismo no meio de uma palavra.","en":"The <b>40 messages</b> of battle and training, across both blocks in bank 3, are translated — <b>including the ones carrying a number in the middle</b>, disguised as a space. It was the last thing holding up the release: shortening the text without knowing how the game places that number would put the digit inside a word.","es":"Los <b>40 mensajes</b> de combate y entrenamiento, en los dos bloques del banco 3, están traducidos — <b>incluidos los que llevan un número en medio</b>, disfrazado de espacio. Era lo último que frenaba el lanzamiento: acortar el texto sin saber cómo coloca el juego ese número pondría la cifra dentro de una palabra."}},{"t":{"pt":"A versão do patch vai <b>queimada na tela de créditos</b>, e não só no nome do arquivo — quem baixa joga a imagem, não o nome. É assim que se sabe, meses depois, qual build está no cartucho.","en":"The patch version is <b>burned into the credits screen</b>, not just into the file name — whoever downloads plays the image, not the name. That is how you know, months later, which build is on the cartridge.","es":"La versión del parche va <b>grabada en la pantalla de créditos</b>, y no solo en el nombre del archivo — quien descarga juega la imagen, no el nombre. Así se sabe, meses después, qué build está en el cartucho."}}]},{"titulo":{"pt":"O português, e a fonte que ganhou acento","en":"Portuguese, and the font that grew accents","es":"El portugués, y la fuente que ganó acentos"},"itens":[{"t":{"pt":"O jogo também está <b>inteiro em português</b> — as mesmas 1.305 mensagens, os 96 nomes e todas as tabelas fora do roteiro: o menu do modo Aventura, os rótulos de carta, o subtítulo do título, batalha e treino. Os nomes seguem a <b>dublagem brasileira</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","en":"The game is also <b>entirely in Portuguese</b> — the same 1,305 messages, the 96 names and every table outside the script: the Adventure mode menu, the card labels, the title subtitle, battle and training. The names follow the <b>Brazilian dub</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","es":"El juego está también <b>entero en portugués</b> — los mismos 1.305 mensajes, los 96 nombres y todas las tablas fuera del guion: el menú del modo Aventura, las etiquetas de carta, el subtítulo del título, combate y entrenamiento. Los nombres siguen el <b>doblaje brasileño</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão."}},{"t":{"pt":"A fonte não tinha acentos, e o espaço para eles estava dentro do próprio tile: a minúscula ocupa as linhas 2 a 6, então <b>as linhas 0 e 1 sobram</b> e o acento sai de graça. A maiúscula ocupa 0 a 6 e não sobra nada — ela é comprimida e o acento vira uma marca de uma linha. Comprimir cortando a linha de baixo fez o <code>E</code> virar <code>F</code> na tela; corta-se uma linha <b>repetida do meio</b>. E o circunflexo com pernas de 2 px coladas ao ápice lia-se como agudo — <code>três</code> saía <code>trés</code>. Quatro desenhos lado a lado decidiram o que a medição não decidia.","en":"The font had no accents, and the room for them was inside the tile itself: lowercase occupies rows 2 to 6, so <b>rows 0 and 1 are free</b> and the accent costs nothing. Uppercase occupies 0 to 6 with nothing to spare — the letter is compressed and the accent becomes a one-row mark. Compressing by cutting the bottom row turned <code>E</code> into <code>F</code> on screen; the row to cut is a <b>repeated one in the middle</b>. And a circumflex with 2 px legs touching the apex read as an acute — <code>três</code> came out <code>trés</code>. Four drawings side by side settled what measurement could not.","es":"La fuente no tenía acentos, y el sitio para ellos estaba dentro del propio tile: la minúscula ocupa las filas 2 a 6, así que <b>las filas 0 y 1 sobran</b> y el acento sale gratis. La mayúscula ocupa 0 a 6 y no sobra nada — se comprime la letra y el acento pasa a ser una marca de una fila. Comprimir cortando la fila de abajo convirtió la <code>E</code> en <code>F</code> en pantalla; la fila que se corta es una <b>repetida del medio</b>. Y el circunflejo con patas de 2 px pegadas al vértice se leía como agudo — <code>três</code> salía <code>trés</code>. Cuatro dibujos uno al lado del otro decidieron lo que la medición no decidía."}},{"t":{"pt":"O que aperta não é o byte: o roteiro português ocupa <b>85% do espaço</b> e caberia inteiro. O aperto é a <b>caixa de 24×3</b> — 387 mensagens já usavam as três linhas em inglês e <b>254 fechavam sem uma coluna sobrando</b>. Traduzir foi encaixar. As três tabelas de nome saíram em <b>417/417, 114/116 e 94/95 bytes</b>.","en":"What squeezes is not the byte: the Portuguese script fills <b>85% of the space</b> and would fit whole. The squeeze is the <b>24×3 box</b> — 387 messages already used all three lines in English and <b>254 closed with not a column to spare</b>. Translating meant fitting. The three name tables came out at <b>417/417, 114/116 and 94/95 bytes</b>.","es":"Lo que aprieta no es el byte: el guion portugués ocupa el <b>85% del espacio</b> y cabría entero. El aprieto es la <b>caja de 24×3</b> — 387 mensajes ya usaban las tres líneas en inglés y <b>254 cerraban sin una columna de sobra</b>. Traducir fue encajar. Las tres tablas de nombre salieron en <b>417/417, 114/116 y 94/95 bytes</b>."}},{"t":{"pt":"A ROM inglesa <b>não mudou um byte</b> para o português existir: o idioma entra por uma camada à parte, e o <code>md5</code> da build inglesa é o mesmo de antes.","en":"The English ROM <b>did not change by a byte</b> for Portuguese to exist: the language enters through a separate layer, and the English build's <code>md5</code> is the same as before.","es":"La ROM inglesa <b>no cambió ni un byte</b> para que existiera el portugués: el idioma entra por una capa aparte, y el <code>md5</code> de la build inglesa es el mismo de antes."}}]}],"patch":{"versoes":{"en":{"arquivo":"dragon-ball-3-en.ips","tamanho":"312 KB"},"pt":{"arquivo":"dragon-ball-3-pt.ips","tamanho":"310 KB"},"es":null},"rom":"Dragon Ball 3 - Gokuu Den (Japan) (Rev 1).nes","rom_md5":"0bc3d5d7d1e7f2206ce1c157402ff944"},"fotos":[{"f":"db3/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"悟空伝 redesenhado como <code>LEGEND OF GOKU</code>, dentro dos mesmos 96×32 pixels.","en":"悟空伝 redrawn as <code>LEGEND OF GOKU</code>, inside the same 96×32 pixels.","es":"悟空伝 redibujado como <code>LEGEND OF GOKU</code>, dentro de los mismos 96×32 píxeles."}},{"f":"db3/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Página branca antes do título, cinco segundos, pulável.","en":"A white page before the title, five seconds, skippable.","es":"Una página blanca antes del título, cinco segundos, se salta."}},{"f":"db3/03-menu.png","t":{"pt":"Menu","en":"Menu","es":"Menú"},"c":{"pt":"<code>GAME START</code> e <code>CONTINUE</code>, onde havia kana.","en":"<code>GAME START</code> and <code>CONTINUE</code>, where kana used to be.","es":"<code>GAME START</code> y <code>CONTINUE</code>, donde antes había kana."}},{"f":"db3/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"Três linhas por vinte e quatro colunas, e nenhum código de continuação para salvar quem estourar.","en":"Three lines by twenty-four columns, and no continuation code to rescue an overflow.","es":"Tres líneas por veinticuatro columnas, y ningún código de continuación que rescate un desbordamiento."}},{"f":"db3/05-cartas.png","t":{"pt":"As cartas","en":"The cards","es":"Las cartas"},"c":{"pt":"Os kanji desenhados viraram <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — arte redesenhada, não texto traduzido.","en":"The drawn kanji became <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — artwork redrawn, not text translated.","es":"Los kanji dibujados pasaron a <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — ilustración redibujada, no texto traducido."}},{"f":"db3/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"Grade latina sem colisão — e as senhas de 1989 continuam funcionando.","en":"A Latin grid with no collisions — and passwords from 1989 still work.","es":"Una rejilla latina sin colisiones — y las contraseñas de 1989 siguen funcionando."}},{"f":"db3/07-mapa.png","t":{"pt":"O tabuleiro","en":"The board","es":"El tablero"},"c":{"pt":"Onde o jogo acontece: anda, tira carta, luta.","en":"Where the game happens: move, draw a card, fight.","es":"Donde ocurre el juego: avanza, roba carta, lucha."}}],"manual_pdf":{"en":null,"pt":null,"es":null}},{"slug":"ultraman-club-2","nome":"Ultraman Club 2","subtitulo":"Kaettekita Ultraman Club","jp":"帰ってきたウルトラマン倶楽部","publisher":"Shinsei","dev":"Tsuburaya Prod.","ano":1989,"data":"1989","sistema":"Famicom","mapper":"MMC3 · 128 KB PRG expandido para 256 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"u2/01-titulo.png","linha":{"pt":"O RPG em que os Ultraman viram bonecos de cabeça grande e enfrentam os monstros da série.","en":"The RPG where the Ultramen become big-headed chibi figures and fight the monsters of the series.","es":"El RPG donde los Ultraman se vuelven figuras chibi y enfrentan a los monstruos de la serie."},"resumo":{"pt":["Um RPG da Tsuburaya em que os Ultraman viram bonecos de cabeça grande e enfrentam os monstros da série. Nunca saiu do Japão.","Sai da Tsuburaya com a Shinsei, em 1989, e nunca deixou o Japão. Esta é uma versão <b>alfa</b>: o texto está todo em inglês e verificado, mas o jogo ainda não foi percorrido do começo ao fim."],"en":["A Tsuburaya RPG where the Ultramen become big-headed chibi figures and fight the monsters of the series. It never left Japan.","It comes from Tsuburaya with Shinsei, in 1989, and never left Japan. This nd the original-ROM analysis dismissed it as binary data.","es":"<b>146 entradas</b> de combate: mensajes de acción, gritos de técnica y el <b>bestiario entero</b> — unos 90 monstruos. Este cuarto bloque solo apareció al barrer kana en la ROM <i>construida</i>."},"foto":"u2/04-menu-batalha.png"},{"t":{"pt":"<b>56 entradas</b> de menu, golpes, itens e nomes de monstro, e mais <b>4 partículas japonesas cravadas no código</b> — <code>は</code> e <code>に</code>, que nenhuma varredura de tabela acha porque estão escritas como <code>LDA #$AC</code> no meio da rotina de batalha.","en":"<b>56 entries</b> for menus, moves, items and monster names, plus <b>4 Japanese particles hardcoded in the code</b> — <code>は</code> and <code>に</code>, which no table scan finds because they are written as <code>LDA #$AC</code> inside the battle routine.","es":"<b>56 entradas</b> de menú, técnicas, objetos y nombres de monstruo, y <b>4 partículas japonesas grabadas en el código</b>."},"foto":"u2/05-combate.png"},{"t":{"pt":"A <b>tela de título</b> redesenhada em 120 tiles, a partir da arte em inglês — e a paleta 1 igualada à 0, porque a tabela de atributos ainda marcava branco na faixa onde ficava o texto japonês pequeno.","en":"The <b>title screen</b> redrawn in 120 tiles from the English artwork — and palette 1 matched to palette 0, because the attribute table still marked white over the band where the small Japanese text used to be.","es":"La <b>pantalla de título</b> redibujada en 120 tiles a partir del arte en inglés."},"foto":"u2/01-titulo.png"},{"t":{"pt":"A ROM foi <b>expandida de 128 KB para 256 KB</b>. Os bancos 14 e 15 são duplicados no fim: no MMC3 o banco fixo é sempre o <i>último</i> da ROM, e crescer sem copiá-los deixa o vetor de reset em área vazia — tela verde no boot.","en":"The ROM was <b>expanded from 128 KB to 256 KB</b>. Banks 14 and 15 are duplicated at the end: on MMC3 the fixed bank is always the <i>last</i> one, and growing without copying them leaves the reset vec
