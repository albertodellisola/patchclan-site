<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Patch Clan — a one-person rom hacking workshop. English patches for Famicom and Super Famicom games that never left Japan.">
<meta name="color-scheme" content="light dark">
<title>Patch Clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* o plastico do Famicom de 1983: creme, bordo e dourado */
  --ground:#e3dbc8; --ground-2:#eee8d9; --ground-3:#f5f1e6;
  --ink:#191412; --ink-2:#544a3e;          /* escurecido: 7.1:1 sobre o creme */
  --rule:#c5bca5; --rule-soft:#d5ccb8;
  --accent:#96251a;                         /* vermelho Famicom, 6.4:1 sobre o creme */
  --accent-2:#701a12; --gold:#7d5f0d; --chip:#d5cbb4; --flag:#96251a;
  --crt:#0b0b10;
  --sobre-accent:#fff;          /* tinta sobre o vermelho */
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pixel:"Press Start 2P","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
    --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
    --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
  }
}
:root[data-theme="dark"]{
  --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
  --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
  --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.025em;text-wrap:balance;margin:0}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
code{font-family:var(--mono);font-size:.88em;background:var(--chip);padding:1px 5px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--sobre-accent);padding:12px 20px;
  font-family:var(--mono);font-size:13px;z-index:99;text-decoration:none}
.skip:focus{left:0}

/* escala tipografica */
h1{font-weight:800;font-size:clamp(34px,4.7vw,54px);line-height:1.04}
h2{font-weight:800;font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 16px}
h3{font-weight:700;font-size:clamp(21px,2.4vw,26px);line-height:1.2;margin:0 0 10px}
h4{font-weight:700;font-size:16px;margin:0 0 10px}
.meta{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}

.faixa{height:7px;background:linear-gradient(90deg,var(--accent-2) 0 62%,var(--gold) 62% 100%)}
.page{max-width:1120px;margin:0 auto;padding:0 28px 96px}
.col{max-width:34em}

/* ---- masthead ---- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.marca-txt{display:flex;flex-direction:column;gap:3px}
.wordmark{font-family:var(--sans);font-weight:800;font-size:21px;letter-spacing:-.035em;
  text-transform:uppercase;line-height:1}
.selo-marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-2);line-height:1}
.mhright{display:flex;align-items:center;gap:26px}
.masthead nav{display:flex;gap:24px;font-family:var(--mono);font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.masthead nav a{color:var(--ink-2);text-decoration:none;padding:4px 0;
  border-bottom:2px solid transparent}
.masthead nav a:hover{color:var(--ink)}
.masthead nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.masthead nav a.apoie{color:var(--sobre-accent);background:var(--accent);border:0;padding:7px 14px;border-radius:3px}
.masthead nav a.apoie:hover{background:var(--accent-2);color:#fff}
.masthead nav a.apoie[aria-current="page"]{background:var(--accent-2);color:#fff}
.langsw{position:relative;font-family:var(--mono);font-size:12px}
.langsw summary{list-style:none;cursor:pointer;color:var(--ink-2);padding:6px 9px;
  border:1px solid var(--rule);border-radius:3px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.langsw summary::-webkit-details-marker{display:none}
.langsw summary:hover{color:var(--ink);border-color:var(--ink-2)}
.langsw ul{position:absolute;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:5px;
  list-style:none;background:var(--ground-2);border:1px solid var(--rule);border-radius:4px;
  min-width:148px;box-shadow:0 10px 26px rgba(25,20,18,.18)}
.langsw li button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;
  color:var(--ink);cursor:pointer;padding:9px 11px;border-radius:2px;font-family:var(--mono);
  font-size:12.5px;text-align:left;letter-spacing:.03em}
.langsw li button:hover{background:var(--chip)}
.langsw li button[aria-current="true"]{color:var(--accent);font-weight:600}
.langsw li button[aria-current="true"]::after{content:"✓";margin-left:auto}
.burger{display:none;border:1px solid var(--rule);background:transparent;color:var(--ink);
  border-radius:3px;padding:8px 11px;font-size:16px;line-height:1;cursor:pointer}

/* ---- tile 8x8 ---- */
.tile{display:grid;grid-template-columns:repeat(8,var(--px));grid-auto-rows:var(--px);flex:none}
.tile i{display:block;background:transparent}
.tile i.on{background:var(--tile-ink,var(--accent))}
.mark-tile{--px:3px}

/* ---- hero ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:68px;
  align-items:center;padding:58px 0 44px}
.hero-txt{max-width:34em}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 22px}
h1 em{font-style:normal;color:var(--accent);display:block}
.lede{font-size:20px;line-height:1.5;margin:24px 0 0;max-width:31em;color:var(--ink)}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:32px}
.cta-apoio{display:flex;flex-direction:column;gap:8px;flex:1 1 260px}
.cta-apoio .bt{align-self:flex-start}
.cta-apoio .nota{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.5;
  letter-spacing:.02em;max-width:34em;white-space:nowrap}
@media (max-width:1080px){.cta-apoio .nota{white-space:normal}}
.hero-regra{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin:18px 0 0;letter-spacing:.03em}
.vitrine{display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--ground-2);border:1px solid var(--ink);border-radius:2px;overflow:hidden;
  box-shadow:5px 5px 0 rgba(25,20,18,.09);transition:transform .16s ease,box-shadow .16s ease}
.vitrine:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(25,20,18,.13)}
.vitrine .tela{background:var(--crt);padding:12px}
.vitrine .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:1px;
  aspect-ratio:256/232;object-fit:contain;background:var(--crt)}
.vitrine .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:7px}
.vitrine .ficha-card{font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);margin:0}
.vitrine .topo{display:flex;gap:8px;flex-wrap:wrap}
.vitrine h2{font-size:clamp(22px,2.4vw,28px);margin:0}
.vitrine .cat{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0;font-weight:500}
.vitrine .ir{margin:6px 0 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent)}

.placar{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;
  padding:16px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding-bottom:16px;margin-bottom:0}
.placar .nums{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.placar b{color:var(--ink);font-weight:600}
.placar .vivo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.placar .bolinha{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* ---- botoes ---- */
.bt{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;padding:14px 24px;border-radius:3px;
  background:var(--accent);color:var(--sobre-accent);text-decoration:none;border:1px solid var(--accent);
  white-space:nowrap;cursor:pointer}
.bt:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.bt.fora{background:transparent;color:var(--accent)}
.bt.fora:hover{background:var(--accent);color:var(--sobre-accent)}
.bt.pq{padding:10px 17px;font-size:12px}

/* ---- secoes ---- */
section{padding:64px 0;border-bottom:1px solid var(--rule)}
.label{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 30px;display:flex;align-items:center;gap:14px}
.label::after{content:"";height:1px;background:var(--rule);flex:1}

/* ---- projeto em destaque ---- */
.destaque{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:52px;align-items:center}
.destaque .tags{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.destaque h2{margin-bottom:6px}
.destaque .sub{font-family:var(--sans);font-weight:600;font-size:20px;color:var(--accent);margin:0 0 18px}
.destaque ul{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.destaque li{font-family:var(--mono);font-size:14px;color:var(--ink-2);padding-left:22px;position:relative}
.destaque li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:600}
.destaque .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ---- tela de TV ---- */
.crt{background:var(--crt);padding:11px;border-radius:5px;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 10px 30px rgba(25,20,18,.2)}
.crt img{display:block;width:100%;image-rendering:pixelated;border-radius:2px}

/* ---- cards de projeto ---- */
.projetos{display:grid;gap:24px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.projetos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.projetos{grid-template-columns:minmax(0,1fr)}}
.proj{display:flex;flex-direction:column;background:var(--ground-2);border:1px solid var(--rule);
  border-radius:5px;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
.proj:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,20,18,.15)}
.proj .tela{display:block;background:var(--crt);padding:9px}
.proj .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:2px;
  aspect-ratio:256/240;object-fit:contain;background:var(--crt)}
.proj .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj h3{margin:0;font-size:21px}
.proj h3 a{color:inherit;text-decoration:none}
.proj h3 a:hover{color:var(--accent)}
.proj .ficha{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.03em}
.proj .cat{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:500}
.proj .linha{font-size:15.5px;line-height:1.5;color:var(--ink-2);margin:6px 0 0}
.proj .ir{margin-top:auto;padding-top:16px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase}
.proj .ir a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.proj .ir a:hover{border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;
  background:var(--chip);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);font-weight:500}
.pill.on{background:var(--accent);color:var(--sobre-accent)}
.pill.beta{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
/* as bandeiras dos idiomas em que o patch existe */
.idiomas{display:inline-flex;align-items:center;gap:0;vertical-align:middle}
.idiomas .fl{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1;
  padding:3px 8px 3px 7px;border:1px solid var(--rule);border-right-width:0;background:var(--ground)}
.idiomas .fl:first-child{border-radius:2px 0 0 2px}
.idiomas .fl:last-child{border-right-width:1px;border-radius:0 2px 2px 0}
.idiomas .fl:only-child{border-radius:2px}
.idiomas .cod{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-2);
  font-weight:500;padding-top:1px}
.pill.alfa{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.gold{background:var(--gold);color:var(--sobre-gold,#fff)}
.grupo-status{margin-bottom:44px}
.grupo-status:last-child{margin-bottom:0}
.grupo-status > h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 20px;display:flex;align-items:center;gap:14px}
.grupo-status > h3::after{content:"";height:1px;background:var(--rule-soft);flex:1}

.regua{margin:36px 0 8px;padding:26px 28px 22px;border:1px solid var(--rule);border-radius:2px;
  background:var(--ground-2)}
.regua h3{font-size:19px;margin:0 0 8px}
.regua .intro{font-size:16px;color:var(--ink-2);margin:0 0 20px;max-width:44em}
.regua dl{margin:0;display:flex;flex-direction:column;gap:0}
.regua dl > div{display:grid;grid-template-columns:126px minmax(0,1fr);gap:22px;
  padding:14px 0;border-top:1px solid var(--rule-soft)}
.regua dt{margin:0}
.regua dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:52em}
.regua .fecho{margin:22px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.regua dl > div{grid-template-columns:minmax(0,1fr);gap:8px}}

.fila{margin-top:56px;padding-top:32px;border-top:1px solid var(--rule)}
.fila h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 14px}
.fila h3 span{color:var(--accent)}
.fila .intro{font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;max-width:44em}
.fila ol{margin:26px 0 0;padding:0;list-style:none;counter-reset:fila}
.fila li{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;
  padding:16px 0;border-top:1px solid var(--rule-soft);counter-increment:fila}
.fila li .jogo{display:flex;flex-direction:column;gap:5px}
.fila li .jogo b{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.015em;
  color:var(--ink);display:flex;gap:9px}
.fila li .jogo b::before{content:counter(fila,decimal-leading-zero);font-family:var(--mono);
  font-weight:400;font-size:12px;color:var(--accent);flex:none;padding-top:3px}
.fila li .ficha{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-left:26px}
.fila li p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.fila .aviso{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.fila li{grid-template-columns:minmax(0,1fr);gap:8px}
  .fila li .ficha{padding-left:0}}

/* ---- nao e so traducao ---- */
.provas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;
  border-top:1px solid var(--rule)}
.prova{padding:30px 30px 30px 0;border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column}
.prova:last-child{border-right:0}
.prova .et{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px}
.prova .n{font-family:var(--sans);font-weight:800;font-size:clamp(26px,3.4vw,36px);
  letter-spacing:-.035em;line-height:1.06;color:var(--ink);display:block;
  min-height:2.12em;display:flex;align-items:flex-end}
.prova .u{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);display:block;margin:9px 0 16px}
.prova p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.prova .onde{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:11.5px}
.prova .onde a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.prova .onde a:hover{border-bottom-color:var(--accent)}

/* ---- promessas ---- */
.promessas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.promessa h4{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px}
.promessa p{font-family:var(--sans);font-weight:700;font-size:19px;color:var(--ink);margin:0;letter-spacing:-.02em}

/* ---- updates ---- */
.updates{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}
.upd{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:2px solid var(--ink)}
.upd .quando{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.upd h3{font-size:20px;margin:0;min-height:2.4em;display:flex;align-items:flex-start}
.upd p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.upd .ler{margin-top:auto;padding-top:12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.upd .ler a{color:var(--accent);text-decoration:none}
.upd .ler a:hover{text-decoration:underline}
.ver-todas{margin-top:34px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ver-todas a{color:var(--accent);text-decoration:none}
.ver-todas a:hover{text-decoration:underline}

/* lista completa de atualizacoes */
.posts{display:flex;flex-direction:column}
.post{display:grid;grid-template-columns:160px minmax(0,1fr);gap:34px;padding:30px 0;
  border-top:1px solid var(--rule-soft)}
.post:first-child{border-top:0;padding-top:0}
.post-meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.05em;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.post-build{display:inline-block;padding:2px 7px;background:var(--chip);color:var(--ink);
  border-radius:2px;font-size:11px;letter-spacing:.08em}
.post-body{max-width:34em}
.post-body p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0 0 12px}

/* ---- pagina do projeto ---- */
.jogo-cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:48px;
  align-items:center;padding:50px 0;border-bottom:1px solid var(--rule)}
.jp{font-family:var(--mono);font-size:15px;color:var(--ink-2);margin:0 0 12px;letter-spacing:.04em}
.jogo-cab .sub{font-family:var(--sans);font-weight:600;font-size:21px;color:var(--accent);margin:0 0 18px}
.ficha{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.8;margin:18px 0 0}
.ficha .versao{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:2px;
  background:var(--chip);font-size:12px;letter-spacing:.05em}
.ficha .versao b{color:var(--ink);font-weight:500}
.selos{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 20px}
.acoes-jogo{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.abas{display:flex;gap:26px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.abas a{color:var(--ink-2);text-decoration:none;padding-bottom:4px;border-bottom:2px solid transparent}
.abas a:hover{color:var(--ink)}
.abas a.on{color:var(--accent);border-bottom-color:var(--accent)}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;
  border-top:1px solid var(--rule)}
.num{padding:24px 24px 24px 0;border-right:1px solid var(--rule-soft)}
.num:last-child{border-right:0}
.num b{display:block;font-family:var(--sans);font-weight:800;font-size:clamp(28px,3.4vw,36px);
  letter-spacing:-.035em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.num span{display:block;margin-top:9px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.grupo{padding:38px 0;border-top:1px solid var(--rule-soft)}
.grupo:first-child{border-top:0;padding-top:0}
.grupo > h3{color:var(--accent);font-family:var(--mono);font-size:13px;letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:20px;font-weight:500}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,310px);gap:36px;
  align-items:start;padding:20px 0;border-top:1px solid var(--rule-soft)}
.feat:first-of-type{border-top:0}
.feat.solo{grid-template-columns:minmax(0,1fr)}
.feat p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0;max-width:34em}
.feat p b{color:var(--ink)}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.galeria figure{margin:0;display:flex;flex-direction:column;gap:11px}
.galeria .crt img{aspect-ratio:256/240;object-fit:contain;background:var(--crt)}
.galeria figcaption{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.galeria figcaption b{display:block;color:var(--ink);font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;font-size:11.5px;margin-bottom:5px}

/* ---- download ---- */
.baixar-cab{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.85;margin-bottom:24px}
.baixar-cab b{color:var(--ink);font-weight:500}
.patches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pt-item{display:flex;flex-direction:column;gap:11px;padding:20px;border-radius:4px;
  border:1px solid var(--rule);background:var(--ground-2)}
.pt-item .idi{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink)}
.pt-item .idi .fl{font-size:16px}
.pt-item .tam{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pt-item .bt{justify-content:center;padding:11px 16px;font-size:12px}
.pt-item.vazio{opacity:.55;border-style:dashed;background:transparent}
.pt-item.vazio .aviso{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2);
  border:1px dashed var(--rule);border-radius:3px;padding:11px 12px;text-align:center}

/* ---- manual ---- */
.man-idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;
  margin-top:36px;border-top:1px solid var(--rule)}
.man-idx a{display:flex;align-items:baseline;gap:12px;padding:15px 20px 15px 0;
  border-bottom:1px solid var(--rule-soft);text-decoration:none;color:var(--ink);
  font-family:var(--sans);font-weight:600;font-size:16px}
.man-idx a:hover{color:var(--accent)}
.man-idx .n{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none}
.man-sec{padding:48px 0}
.man-corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:44px;align-items:start}
.man-corpo.solo{grid-template-columns:minmax(0,1fr)}
.man-txt{max-width:34em}
.man-txt p{font-size:17px;line-height:1.64}
.man-lista{margin:24px 0 0;display:flex;flex-direction:column;gap:0}
.man-lista > div{display:grid;grid-template-columns:126px minmax(0,1fr);gap:20px;
  padding:13px 0;border-top:1px solid var(--rule-soft)}
.man-lista dt{font-family:var(--sans);font-weight:700;font-size:15px}
.man-lista dt code{background:var(--accent);color:var(--sobre-accent);font-size:12.5px;padding:3px 8px;
  border-radius:2px;font-weight:500;letter-spacing:.04em}
.man-lista dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2)}

/* ---- patreon ---- */
.horas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;
  padding:34px 0 0}
.horas .big{font-family:var(--sans);font-weight:800;font-size:clamp(56px,9vw,104px);
  letter-spacing:-.05em;line-height:.9;color:var(--accent)}
.horas .rot{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink-2);
  margin-top:14px;max-width:20em}
.passos{margin-top:22px;font-family:var(--mono);font-size:13px;line-height:2;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.passos span + span::before{content:"·";color:var(--rule);margin:0 12px;display:inline-block}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;margin-top:44px}
.tier{border:1px solid var(--rule);border-radius:5px;padding:24px;background:var(--ground-2);
  display:flex;flex-direction:column;gap:13px;position:relative}
.tier.destaque{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tier .fita{position:absolute;top:-11px;left:24px;background:var(--accent);color:var(--sobre-accent);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 11px;border-radius:2px;font-weight:500}
.tier .topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tier h3{margin:0;font-size:19px}
.tier .preco{font-family:var(--sans);font-weight:800;font-size:26px;color:var(--accent);
  letter-spacing:-.035em;white-space:nowrap}
.tier .preco small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.tier .nota{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.5;
  padding-bottom:13px;border-bottom:1px solid var(--rule-soft);margin:0}
.tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.tier li{font-size:15px;line-height:1.5;color:var(--ink-2);padding-left:19px;position:relative}
.tier li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;
  background:var(--accent);border-radius:1px}
.tier li b{color:var(--ink)}

/* ---- regras / quem ---- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0}
.rule{padding:24px 28px 26px 0;border-top:1px solid var(--rule-soft)}
.rule dt{font-family:var(--sans);font-weight:700;font-size:17px;margin:0 0 7px}
.rule dd{margin:0;color:var(--ink-2);font-size:16px;line-height:1.55}
.sign{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);margin-top:24px;letter-spacing:.02em}
.sign b{color:var(--ink);font-weight:500}
footer{padding:40px 0 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:.03em}
.voltar{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;margin:26px 0 0}
.voltar:hover{color:var(--accent)}

.en,.pt,.es{display:inline}

body[data-lang="es"] .en,body[data-lang="es"] .pt{display:none}

 acertei uma.","en":"Three things that never change: <b>no ROMs are distributed</b>, only patches. <b>Every finished patch is free</b> for everyone, patron or not. And <b>no dates are promised</b>, because I have never once been right about one.","es":"Tres cosas que no cambian: <b>no se distribuye ninguna ROM</b>, solo parches. <b>Todo parche terminado es gratis</b> para todo el mundo, mecenas o no. Y <b>no se promete ninguna fecha</b>, porque nunca he acertado una."},"rodape":{"pt":"O patch pronto é sempre gratuito para todo mundo. O que a assinatura antecipa é o build <b>inacabado</b> — o beta com defeitos conhecidos, o alfa com telas ainda meio japonesas — e o relato de como ele está sendo feito. Ninguém paga para poder jogar a versão final.","en":"The finished patch is always free for everyone. What a pledge brings forward is the <b>unfinished</b> build — the beta with its known issues, the alpha with screens still half Japanese — and the account of how it is being made. Nobody pays to play the finished version.","es":"El parche terminado siempre es gratis para todo el mundo. Lo que la suscripción adelanta es la build <b>inacabada</b> — la beta con sus defectos conocidos, la alfa con pantallas aún medio japonesas — y el relato de cómo se está haciendo. Nadie paga por jugar la versión final."},"tiers":[{"nome":"Two Bytes","preco":"$3","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"os dois bytes que consertaram o Famicom Jump II","en":"the two bytes that fixed Famicom Jump II","es":"los dos bytes que arreglaron Famicom Jump II"},"itens":[{"pt":"<b>Só quero ajudar.</b> É exatamente isto: nenhuma contrapartida, nenhuma fila, nada exclusivo.","en":"<b>I just want to help.</b> That is exactly it: no perks, no queue, nothing exclusive.","es":"<b>Solo quiero ayudar.</b> Es exactamente eso: ninguna contrapartida, ninguna fila, nada exclusivo."},{"pt":"Todo patch continua <b>gratuito para todo mundo</b>, apoiador ou não.","en":"Every patch stays <b>free for everyone</b>, patron or not.","es":"Todo parche sigue siendo <b>gratis para todo el mundo</b>, mecenas o no."}]},{"nome":"Bank Switch","preco":"$10","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"recomendado":true,"nota":{"pt":"a troca de banco, que é como um cartucho de 1988 guarda mais do que devia","en":"bank switching, which is how a 1988 cartridge holds more than it should","es":"el cambio de banco, que es cómo un cartucho de 1988 guarda más de lo que debería"},"itens":[{"pt":"<b>Patches beta antes do lançamento público</b>, com a lista de defeitos conhecidos — o build que já se joga inteiro, mas ainda não passou pela última leitura.","en":"<b>Beta patches before public release</b>, with the known-issues list — the build you can already play through, but which has not had its final read-through.","es":"<b>Parches beta antes del lanzamiento público</b>, con la lista de defectos conocidos — la build que ya se juega entera, pero que aún no ha pasado la última lectura."},{"pt":"<b>Participe das pesquisas sobre os próximos jogos.</b> Qual cartucho vale a pena abrir, em que ordem, e o que se procura antes de decidir — a conversa acontece com você dentro.","en":"<b>Take part in the research on the next games.</b> Which cartridge is worth opening, in what order, and what gets measured before deciding — the conversation happens with you in it.","es":"<b>Participa en la investigación sobre los próximos juegos.</b> Qué cartucho vale la pena abrir, en qué orden, y qué se mide antes de decidir — la conversación ocurre contigo dentro."},{"pt":"<b>Seu nome nos agradecimentos do site</b>, enquanto o apoio durar.","en":"<b>Your name in the site’s thanks</b>, for as long as the pledge lasts.","es":"<b>Tu nombre en los agradecimientos del sitio</b>, mientras dure el apoyo."}]},{"nome":"The Seventh Hero","preco":"$25","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"o sétimo escolhido do Famicom Jump II é você","en":"the seventh champion in Famicom Jump II is you","es":"el séptimo elegido de Famicom Jump II eres tú"},"itens":[{"pt":"Tudo do <b>Bank Switch</b>.","en":"Everything in <b>Bank Switch</b>.","es":"Todo lo de <b>Bank Switch</b>."},{"pt":"<b>Acesso a todas as versões alfa das traduções</b> — as builds em montagem, antes mesmo do beta, com o texto ainda mudando e as telas ainda meio japonesas. É ver o trabalho acontecendo, não o resultado dele.","en":"<b>Access to every alpha build of the translations</b> — the builds still being assembled, before the beta, with the text still moving and the screens still half Japanese. It is watching the work happen, not its result.","es":"<b>Acceso a todas las versiones alfa de las traducciones</b> — las builds aún en montaje, antes del beta, con el texto todavía cambiando y las pantallas aún medio japonesas. Es ver el trabajo ocurriendo, no su resultado."}]}],"horas":{"numero":"200+","rotulo":{"pt":"horas antes de uma palavra chegar à tela","en":"hours before one word reaches the screen","es":"horas antes de que una palabra llegue a la pantalla"},"passos":[{"pt":"Desmontar","en":"Disassemble","es":"Desensamblar"},{"pt":"Entender","en":"Understand","es":"Entender"},{"pt":"Programar","en":"Program","es":"Programar"},{"pt":"Testar","en":"Test","es":"Probar"},{"pt":"Reescrever","en":"Rewrite","es":"Reescribir"}]}},"rules":{"items":[{"title":{"pt":"Patches, nunca ROMs","en":"Patches, never ROMs","es":"Parches, nunca ROMs"},"text":{"pt":"Você traz o seu próprio dump. Nada com direito autoral fica hospedado aqui, nunca.","en":"You bring your own dump. Nothing copyrighted is hosted here, ever.","es":"Tú traes tu propio volcado. Aquí no se aloja nada con derechos de autor, nunca."}},{"title":{"pt":"Todo patch pronto é de graça","en":"Every finished patch is free","es":"Todo parche terminado es gratis"},"text":{"pt":"Para todo mundo, apoiador ou não. O que apoiador recebe antes é build inacabado — nunca a versão final.","en":"For everyone, patron or not. What patrons get early is an unfinished build — never the finished version.","es":"Para todo el mundo, mecenas o no. Lo que reciben antes los mecenas es una build inacabada — nunca la versión final."}},{"title":{"pt":"Nenhuma data prometida","en":"No dates promised","es":"Ninguna fecha prometida"},"text":{"pt":"Nem em post, nem em resposta. Sai quando estiver lendo certo.","en":"Not in posts, not in replies. It ships when it reads right.","es":"Ni en publicaciones ni en respuestas. Sale cuando se lee bien."}},{"title":{"pt":"Uma pessoa, devagar de propósito","en":"One person, slow on purpose","es":"Una persona, lenta a propósito"},"text":{"pt":"E cada linha é lida em voz alta antes de sair — no hardware, no tamanho real.","en":"And every line gets read out loud before it ships — on hardware, at size.","es":"Y cada línea se lee en voz alta antes de salir — en hardware, a tamaño real."}}]},"who":{"paras":[{"pt":"O Patch Clan é o <b>Sonix</b> — ex-<b>Central Brasileira de Traduções</b>, a CBT, um dos grupos que construíram a cena de tradução brasileira quando patch andava por post de fórum e todo mundo aprendia hex editing num arquivo de texto que outro alguém escreveu às duas da manhã.","en":"Patch Clan is <b>Sonix</b> — formerly of <b>Central Brasileira de Traduções</b>, the CBT, one of the groups that built the Brazilian translation scene back when a patch travelled by forum post and everyone learned hex editing from a text file somebody else wrote at two in the morning.","es":"Patch Clan es <b>Sonix</b> — ex-<b>Central Brasileira de Traduções</b>, la CBT, uno de los grupos que construyeron la escena de traducción brasileña cuando un parche viajaba por mensaje de foro y todo el mundo aprendía hex editing en un archivo de texto que otro escribió a las dos de la mañana."},{"pt":"Escrevo minhas próprias ferramentas para cada jogo, porque as de uso geral param na parte interessante: um desmontador 6502 com mapa de bancos por mapper, desempacotadores de texto a nível de bit, um montador 6502 em Python, e um emulador sem janela dirigido por Lua que dá boot na ROM e fotografa a tela sem abrir nada.","en":"I write my own tools for every game, because the general-purpose ones stop at the interesting part: a 6502 disassembler with a per-mapper bank map, bit-level text unpackers, a 6502 assembler in Python, and a headless emulator driven by Lua that boots the ROM and screenshots it with no window open.","es":"Escribo mis propias herramientas para cada juego, porque las de uso general se detienen en la parte interesante: un desensamblador 6502 con mapa de bancos por mapper, desempaquetadores de texto a nivel de bit, un ensamblador 6502 en Python, y un emulador sin ventana dirigido por Lua que arranca la ROM y fotografía la pantalla sin abrir nada."},{"pt":"Um clã de um só, o que é piada até você reparar que é também o cronograma, o controle de qualidade e o gerente de lançamento.","en":"A clan of one, which is a joke until you notice it is also the schedule, the QA department and the release manager.","es":"Un clan de uno solo, lo que es un chiste hasta que notas que también es el cronograma, el control de calidad y el responsable de lanzamiento."}],"sign":{"pt":"tradutor, hacker, revisor, clã","en":"translator, hacker, proofreader, clan","es":"traductor, hacker, revisor, clan"},"abertura":{"pt":"O Patch Clan é um grupo de rom hacking de uma pessoa só. A gente traduz jogos que nunca tiveram lançamento em inglês — ponteiros, fonte, quebra de linha e tudo — e não para aí: telas que o original não tinha, bugs de trinta e cinco anos consertados, e o que mais couber num cartucho que sempre teve espaço.","en":"Patch Clan is a one-person rom hacking group. We translate games that never had an English release — pointers, font, line breaks and all — and then keep going: screens the original never had, thirty-five-year-old bugs fixed, and whatever else the cartridge always had room for.","es":"Patch Clan es un grupo de rom hacking de una sola persona. Traducimos juegos que nunca tuvieron lanzamiento en inglés — punteros, fuente, saltos de línea y todo lo demás — y no paramos ahí: pantallas que el original no tenía, errores de treinta y cinco años corregidos, y todo lo que quepa en un cartucho que siempre tuvo sitio."}},"footer":{"tagline":{"pt":"Patches para jogos que nunca falaram inglês","en":"Patches for games that never spoke English","es":"Parches para juegos que nunca hablaron inglés"}},"provas":{"itens":[{"jogo":"famicom-jump-2","etiqueta":{"pt":"Correção de bug","en":"Bug fix","es":"Corrección de bug"},"numero":"35","unidade":{"pt":"anos depois","en":"years later","es":"años después"},"texto":{"pt":"O jogo tinha sete variantes de uma fala e seis nunca apareciam, por causa de um registrador trocado. A correção foram <b>dois bytes</b>.","en":"The game had seven variants of one line and six never appeared, because of a swapped register. The fix was <b>two bytes</b>.","es":"El juego tenía siete variantes de una frase y seis nunca aparecían, por un registro cambiado. La corrección fueron <b>dos bytes</b>."}},{"jogo":"famicom-jump-2","etiqueta":{"pt":"Engenharia","en":"Engineering","es":"Ingeniería"},"numero":"6,25 → 3,90","unidade":{"pt":"bits por caractere","en":"bits per character","es":"bits por carácter"},"texto":{"pt":"O inglês não cabia. Em vez de cortar texto, troquei a compressão por um Huffman de ordem 1 — decodificador de <b>89 bytes</b> de 6502.","en":"English did not fit. Rather than trim text, I replaced the compression with an order-1 Huffman coder — an <b>89-byte</b> 6502 decoder.","es":"El inglés no cabía. En vez de cortar texto, cambié la compresión por un Huffman de orden 1 — decodificador de <b>89 bytes</b> de 6502."}},{"jogo":"captain-tsubasa","etiqueta":{"pt":"Função nova","en":"New feature","es":"Función nueva"},"numero":{"pt":"senha → bateria","en":"password → battery","es":"contraseña → pila"},"unidade":{"pt":"progresso salvo","en":"progress saved","es":"progreso guardado"},"texto":{"pt":"O jogo de 1988 só guardava por senha. Agora grava em bateria — os mesmos 24 bytes que a senha carregava, em <b>97 bytes</b> de código novo.","en":"The 1988 game only kept progress by password. Now it writes to battery — the same 24 bytes the password carried, in <b>97 bytes</b> of new code.","es":"El juego de 1988 solo guardaba por contraseña. Ahora graba con pila — los mismos 24 bytes que llevaba la contraseña, en <b>97 bytes</b> de código nuevo."}}]},"promessas":{"itens":[{"titulo":{"pt":"Só patches","en":"Patches only","es":"Solo parches"},"texto":{"pt":"Nunca ROMs.","en":"Never ROMs.","es":"Nunca ROMs."}},{"titulo":{"pt":"Lançamentos livres","en":"Free releases","es":"Lanzamientos libres"},"texto":{"pt":"Para todo mundo.","en":"For everyone.","es":"Para todo el mundo."}},{"titulo":{"pt":"Nenhum prazo falso","en":"No fake deadlines","es":"Ningún plazo falso"},"texto":{"pt":"Sai quando estiver pronto.","en":"It ships when it is ready.","es":"Sale cuando esté listo."}}]},"marca":{"selo":{"pt":"Um clã de um só","en":"A clan of one","es":"Un clan de uno solo"}},"niveis":{"titulo":{"pt":"Release, beta e alfa","en":"Release, beta and alpha","es":"Release, beta y alfa"},"intro":{"pt":"Três níveis, e só três. O nível não mede <b>quanto trabalho já foi feito</b> — mede <b>o que já foi provado na tela</b>. São coisas diferentes, e confundir as duas é como quase toda tradução amadora se anuncia pronta antes de estar.","en":"Three levels, and only three. The level does not measure <b>how much work is done</b> — it measures <b>what has been proved on screen</b>. They are different things, and confusing them is how almost every amateur translation announces itself finished before it is.","es":"Tres niveles, y solo tres. El nivel no mide <b>cuánto trabajo se ha hecho</b> — mide <b>qué se ha probado en pantalla</b>. Son cosas distintas, y confundirlas es como casi toda traducción amateur se anuncia terminada antes de estarlo."},"itens":[{"chave":"release","marca":"✓","texto":{"pt":"O jogo inteiro em inglês, <b>jogado do começo ao fim</b> e lido linha a linha antes de sair. É o único nível em que o site publica a lista completa do que entrou — porque é o único em que essa lista está fechada. Gratuito para todo mundo, sempre.","en":"The whole game in English, <b>played start to finish</b> and read line by line before shipping. It is the only level where the site publishes the full list of what went in — because it is the only one where that list is closed. Free for everyone, always.","es":"El juego entero en inglés, <b>jugado de principio a fin</b> y leído línea por línea antes de salir. Es el único nivel en el que el sitio publica la lista completa de lo que entró — porque es el único en el que esa lista está cerrada. Gratis para todo el mundo, siempre."}},{"chave":"beta","marca":"●","texto":{"pt":"Alguém já <b>atravessou o jogo inteiro em inglês</b>: ele funciona do início ao fim. O que ainda não aconteceu é a leitura final — aquela em que cada linha é lida procurando o erro que medição nenhuma pega, porque o som está certo e só a grafia está errada. Vai antes para quem apoia no <b>Bank Switch</b>.","en":"Someone has already <b>crossed the whole game in English</b>: it works start to finish. What has not happened is the final read-through — the one where every line is read hunting the error no measurement catches, because the sound is right and only the spelling is wrong. It goes first to <b>Bank Switch</b> patrons.","es":"Alguien ya <b>atravesó el juego entero en inglés</b>: funciona de principio a fin. Lo que aún no ha ocurrido es la lectura final — esa en la que cada línea se lee buscando el error que ninguna medición atrapa, porque el sonido está bien y solo la ortografía está mal. Va antes a quien apoya en <b>Bank Switch</b>."}},{"chave":"alfa","marca":"○","texto":{"pt":"<b>Ainda não se sabe se o jogo atravessa em inglês.</b> Pode ser texto incompleto, telas ainda em japonês, ou uma build montada que ninguém jogou até o fim. <b>Medição não é travessia:</b> provar que os bytes certos estão na ROM é diferente de provar que o jogo se joga — e um projeto pode ter o roteiro inteiro traduzido e continuar aqui. Vai antes para quem apoia no <b>The Seventh Hero</b>.","en":"<b>It is not yet known whether the game can be crossed in English.</b> It may be incomplete text, screens still in Japanese, or an assembled build nobody has played to the end. <b>Measurement is not a crossing:</b> proving the right bytes are in the ROM is not proving the game plays — and a project can have its entire script translated and still sit here. It goes first to <b>The Seventh Hero</b> patrons.","es":"<b>Todavía no se sabe si el juego se atraviesa en inglés.</b> Puede ser texto incompleto, pantallas aún en japonés, o una build montada que nadie ha jugado hasta el final. <b>Medir no es atravesar:</b> probar que los bytes correctos están en la ROM no es probar que el juego se juega — y un proyecto puede tener el guion entero traducido y seguir aquí. Va antes a quien apoya en <b>The Seventh Hero</b>."}}],"fecho":{"pt":"O nível de um projeto sobe quando alguma coisa foi <b>provada</b>, não quando parece estar quase. É por isso que o site não lista o que falta num alfa ou num beta: enquanto o trabalho não fechou, a lista mudaria toda semana e não ajudaria ninguém a decidir se vale baixar.","en":"A project’s level goes up when something has been <b>proved</b>, not when it looks nearly there. That is why the site does not list what is missing from an alpha or a beta: while the work is open, the list would change every week and would help nobody decide whether it is worth downloading.","es":"El nivel de un proyecto sube cuando algo se ha <b>probado</b>, no cuando parece que casi. Por eso el sitio no lista lo que falta en un alfa o un beta: mientras el trabajo esté abierto, la lista cambiaría cada semana y no ayudaría a nadie a decidir si vale la pena descargarlo."}},"fila":{"titulo":{"pt":"Na fila","en":"Next in line","es":"En la cola"},"intro":{"pt":"O que vem depois. Alguns destes cartuchos já foram abertos e medidos; outros ainda não. Todos passaram pela mesma pergunta, feita <b>antes</b> de qualquer entusiasmo: “este jogo já tem patch em inglês?” — e em todos a resposta foi não.","en":"What comes next. Some of these cartridges have already been opened and measured; others have not. All of them went through the same question, asked <b>before</b> any enthusiasm: “does this game already have an English patch?” — and for all of them the answer was no.","es":"Lo que viene después. Algunos de estos cartuchos ya fueron abiertos y medidos; otros no. Todos pasaron por la misma pregunta, hecha <b>antes</b> que cualquier entusiasmo: “¿este juego ya tiene parche en inglés?” — y en todos la respuesta fue no."},"criterio":{"pt":"O padrão que organiza a lista é o <b>órfão de série</b>: a comunidade traduz o primeiro jogo e para. Foi o caso do Famicom Jump, e é o caso de quase tudo aqui.","en":"The pattern that organises this list is the <b>orphan sequel</b>: the community translates the first game and stops. That was the case with Famicom Jump, and it is the case with almost everything here.","es":"El patrón que organiza esta lista es el <b>huérfano de serie</b>: la comunidad traduce el primer juego y se detiene. Fue el caso de Famicom Jump, y es el caso de casi todo lo que hay aquí."},"itens":[{"nome":"Ultraman Club 2: Kaettekita Ultraman Club","sistema":"Famicom","ano":1989,"porque":{"pt":"O RPG em que os Ultraman viram bonecos de cabeça grande e enfrentam os monstros da série, da Tsuburaya com a Shinsei.","en":"The RPG where the Ultramen become big-headed chibi figures and fight the monsters of the series, from Tsuburaya with Shinsei.","es":"El RPG donde los Ultraman se vuelven figuras chibi y enfrentan a los monstruos de la serie, de Tsuburaya con Shinsei."}},{"nome":"Ultraman Club 3","sistema":"Famicom","ano":1991,"porque":{"pt":"A continuação, agora com a Yutaka — e com defeitos de fábrica que qualquer tradução honesta tem de tratar antes de traduzir.","en":"The sequel, now with Yutaka — and with factory defects any honest translation has to deal with before translating.","es":"La secuela, ahora con Yutaka — y con defectos de fábrica que cualquier traducción honesta debe tratar antes de traducir."}},{"nome":"Square's Tom Sawyer","sistema":"Famicom","ano":1989,"porque":{"pt":"A Square adaptando Mark Twain num RPG de Famicom, dois anos antes do Final Fantasy IV. <b>CHR-RAM:</b> não existe bloco de gráficos no arquivo, os tiles moram no código.","en":"Square adapting Mark Twain into a Famicom RPG, two years before Final Fantasy IV. <b>CHR-RAM:</b> there is no graphics block in the file, the tiles live in the program.","es":"Square adaptando a Mark Twain en un RPG de Famicom, dos años antes de Final Fantasy IV. <b>CHR-RAM:</b> no hay bloque de gráficos en el archivo, los tiles viven en el código."}},{"nome":"Hanjuku Hero","sistema":"Famicom","ano":1988,"porque":{"pt":"O outro Square de 1988: estratégia em tempo real, um reino para comandar e monstros que saem de dentro de ovos. Virou série no Japão e nunca saiu de lá.","en":"The other Square of 1988: real-time strategy, a kingdom to command, and monsters that hatch out of eggs. It became a series in Japan and never left.","es":"El otro Square de 1988: estrategia en tiempo real, un reino que comandar y monstruos que salen de huevos. Se volvió serie en Japón y nunca salió de allí."}},{"nome":"Monster Maker: 7 Tsu no Hihou","sistema":"Famicom","ano":1990,"porque":{"pt":"O RPG tirado do jogo de cartas japonês — sete tesouros, uma masmorra e um baralho. A ROM já está na mesa: <b>MMC1, 256 KB, CHR-RAM e save com bateria</b>, a mesma família de problema do Tom Sawyer e do Hanjuku Hero, em que os gráficos moram no código.","en":"The RPG taken from the Japanese card game — seven treasures, a dungeon and a deck. The ROM is already on the table: <b>MMC1, 256 KB, CHR-RAM and a battery save</b>, the same family of problem as Tom Sawyer and Hanjuku Hero, where the graphics live inside the program.","es":"El RPG sacado del juego de cartas japonés — siete tesoros, una mazmorra y una baraja. La ROM ya está sobre la mesa: <b>MMC1, 256 KB, CHR-RAM y guardado con pila</b>, la misma familia de problema que Tom Sawyer y Hanjuku Hero, donde los gráficos viven dentro del código."}},{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 2","sistema":"Famicom","ano":1991,"porque":{"pt":"O primeiro foi traduzido e a série parou aí. RPG, IP de primeira linha, nenhum projeto público em andamento.","en":"The first was translated and the series stopped there. An RPG, a first-rank IP, and no public project under way.","es":"El primero fue traducido y la serie se detuvo ahí. RPG, IP de primera línea, ningún proyecto público en marcha."}},{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 3","sistema":"Famicom","ano":1992,"porque":{"pt":"O mesmo caso do 2, e pela mesma razão: as resenhas do primeiro pedem os dois sequels.","en":"The same case as 2, for the same reason: reviews of the first ask for both sequels.","es":"El mismo caso que el 2, por la misma razón: las reseñas del primero piden ambas secuelas."}},{"nome":"Hokuto no Ken 4: Shichisei Haken Den","sistema":"Famicom","ano":1991,"porque":{"pt":"Órfão desde que o terceiro saiu em inglês, em 2024. <b>A conferir antes de começar:</b> há sinal de projeto pessoal ativo no fórum.","en":"Orphaned since the third came out in English in 2024. <b>To check before starting:</b> there is a sign of an active personal project on the forum.","es":"Huérfano desde que el tercero salió en inglés, en 2024. <b>A comprobar antes de empezar:</b> hay señal de un proyecto personal activo en el foro."}},{"nome":"Slam Dunk 2: IH Yuushou e no Michi","sistema":"Super Famicom","ano":1995,"porque":{"pt":"Nenhum dos quatro jogos de Slam Dunk tem patch em inglês. Um projeto de fórum procurou gente em 2017 e morreu ali.","en":"None of the four Slam Dunk games has an English patch. A forum project looked for people in 2017 and died there.","es":"Ninguno de los cuatro juegos de Slam Dunk tiene parche en inglés. Un proyecto de foro buscó gente en 2017 y murió ahí."}},{"nome":"Hokuto no Ken 6 · 7","sistema":"Super Famicom","ano":1992,"porque":{"pt":"O sétimo aparece em listas públicas de “SNES ainda sem tradução”. Nenhum patch encontrado para os dois.","en":"The seventh shows up in public lists of “SNES still untranslated”. No patch found for either.","es":"El séptimo aparece en listas públicas de “SNES aún sin traducir”. Ningún parche encontrado para los dos."}}],"aviso":{"pt":"Estar na fila <b>não é promessa</b>, e a ordem não está decidida. É nessa lista que a conversa acontece com quem apoia no <b>Bank Switch</b>: qual cartucho vale a pena abrir, e em que ordem.","en":"Being in the queue is <b>not a promise</b>, and the order is not decided. This list is where the conversation happens with <b>Bank Switch</b> patrons: which cartridge is worth opening, and in what order.","es":"Estar en la cola <b>no es una promesa</b>, y el orden no está decidido. En esta lista ocurre la conversación con quien apoya en <b>Bank Switch</b>: qué cartucho vale la pena abrir, y en qué orden."}}},"games":[{"slug":"famicom-jump-2","nome":"Famicom Jump II","subtitulo":"Saikyou no 7 Nin","jp":"ファミコンジャンプII 最強の7人","traducao_titulo":"The Strongest Seven","publisher":"Bandai","dev":"Chunsoft","ano":1991,"data":"2 December 1991","sistema":"Famicom","mapper":"Mapper 153 (Bandai FCG) · 512 KB PRG · CHR-RAM · battery SRAM","primeiro":true,"categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"destaque":true,"nivel":"release","capa":"fj2/01-tela-titulo.png","linha":{"pt":"O crossover de sete séries da Shōnen Jump. Nunca saiu do Japão, e nunca teve tradução — até agora.","en":"The seven-series Shōnen Jump crossover. It never left Japan, and never had a translation — until now.","es":"El crossover de siete series de la Shōnen Jump. Nunca salió de Japón, y nunca tuvo traducción — hasta ahora."},"resumo":{"pt":["RPG tático da Bandai com Goku, JoJo, o Ryotsu do Kochikame, Taruruto-kun, Tar-chan, Momotaro e Taison dividindo o mesmo campo de batalha. Três dos sete lutam por vez, a vida se conta em corações, e o alcance de caminhada é um atributo que sobe de nível. O próprio manual chama o sistema de <b>S·A·S, Simulation Action System</b>.","O roteiro inteiro em inglês: <b>1.903 mensagens</b>, sem resumir e sem cortar frase. Foi a primeira tradução do Patch Clan, e continua sendo a única tradução inglesa deste jogo que consegui encontrar."],"en":["Bandai's tactical RPG, with Goku, JoJo, Kochikame's Ryotsu, Taruruto-kun, Tar-chan, Momotaro and Taison sharing one battlefield. Three of the seven fight at a time, health is counted in hearts, and walking range is a stat that levels up. The manual itself calls the system <b>S·A·S, Simulation Action System</b>.","The whole script in English: <b>1,903 messages</b>, nothing summarised, nothing cut. It was Patch Clan's first translation, and as far as I can establish it is still the only English patch of this game that exists."],"es":["RPG táctico de Bandai con Goku, JoJo, el Ryotsu de KochiKame, Taruruto-kun, Tar-chan, Momotaro y Taison compartiendo el mismo campo de batalla. Tres de los siete luchan a la vez, la vida se cuenta en corazones, y el alcance de movimiento es un atributo que sube de nivel. El propio manual llama al sistema <b>S·A·S, Simulation Action System</b>.","El guion entero en inglés: <b>1.903 mensajes</b>, sin resumir y sin cortar frases. Fue la primera traducción de Patch Clan, y sigue siendo el único parche en inglés de este juego que he podido encontrar."]},"numeros":[{"v":"1,903","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"266","r":{"pt":"itens, lugares e nomes","en":"items, places and names","es":"objetos, lugares y nombres"}},{"v":"75","r":{"pt":"glifos latinos desenhados","en":"Latin glyphs drawn","es":"glifos latinos dibujados"}},{"v":"2","r":{"pt":"bytes que consertaram o jogo","en":"bytes that fixed the game","es":"bytes que arreglaron el juego"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.903 mensagens</b> — o roteiro inteiro, sem resumo e sem frase cortada","en":"<b>1,903 messages</b> — the entire script, nothing summarised, no sentence cut","es":"<b>1.903 mensajes</b> — el guion entero, sin resumir, sin una frase cortada"},"foto":"fj2/05-espirito-jump-world.png"},{"t":{"pt":"<b>266 nomes</b> de itens, lugares, monstros e do grupo, encurtados só quando o campo da tela não comporta","en":"<b>266 names</b> for items, places, monsters and the party, shortened only where the on-screen field cannot hold them","es":"<b>266 nombres</b> de objetos, lugares, monstruos y del grupo, acortados solo donde el campo de la pantalla no da"},"foto":"fj2/08-soulring.png"},{"t":{"pt":"<b>77 textos de menu</b> — status, loja, depósito, treino e título","en":"<b>77 menu strings</b> — status, shop, storage, training and title","es":"<b>77 textos de menú</b> — estado, tienda, almacén, entrenamiento y título"},"foto":"fj2/03-menu-ingles.png"},{"t":{"pt":"<b>13 mensagens de batalha</b> e as <b>6 páginas</b> do final","en":"<b>13 battle messages</b> and the <b>6 pages</b> of the ending","es":"<b>13 mensajes de combate</b> y las <b>6 páginas</b> del final"}},{"t":{"pt":"<b>Fonte latina de 75 glifos</b> desenhada para o jogo — maiúsculas, minúsculas, algarismos e pontuação — no lugar dos 141 tiles de kana do original","en":"<b>A 75-glyph Latin font</b> drawn for the game — capitals, lower case, digits and punctuation — replacing the original 141 kana tiles","es":"<b>Una fuente latina de 75 glifos</b> dibujada para el juego — mayúsculas, minúsculas, cifras y puntuación — en lugar de los 141 tiles de kana del original"}}]},{"titulo":{"pt":"Um bug de 1991, consertado","en":"A 1991 bug, fixed","es":"Un error de 1991, corregido"},"itens":[{"t":{"pt":"Na abertura, o espírito diz que sete campeões foram escolhidos e nomeia os seis que faltam achar. <b>Desde 1991 ele nomeia sempre os mesmos seis</b> — quem começa como Taison é mandado procurar o Taison, e o Goku nunca é citado.","en":"In the opening, a spirit says seven champions have been chosen and names the six you still have to find. <b>It has named the same six since 1991</b> — start as Taison and it sends you to go find Taison, and Goku is never named at all.","es":"En la apertura, el espíritu dice que se han elegido siete campeones y nombra a los seis que faltan por encontrar. <b>Desde 1991 nombra siempre a los mismos seis</b> — si empiezas como Taison te manda a buscar a Taison, y a Goku no lo nombra nunca."},"foto":"fj2/06-lista-sete-campeoes.png"},{"t":{"pt":"Não era limitação do cartucho: <b>o código certo já estava lá</b>. A cena tem um seletor de sete casos, um por herói inicial, e as sete variantes de texto estão gravadas na ROM. O seletor nunca disparava — o roteiro punha o número do herói no acumulador e a rotina chamada lia o registrador X, que trazia lixo da chamada anterior.","en":"This was never a limitation of the cartridge: <b>the correct code is already in the ROM</b>. The scene has a seven-way selector, one branch per starting hero, and all seven text variants are sitting there. The selector never fired — the script loads the hero number into the accumulator and the routine it calls reads it from X, which still held leftovers from the previous call.","es":"No era una limitación del cartucho: <b>el código correcto ya estaba en la ROM</b>. La escena tiene un selector de siete casos, uno por héroe inicial, y las siete variantes de texto están grabadas. El selector no disparaba nunca — el guion ponía el número del héroe en el acumulador y la rutina llamada lo leía del registro X, que traía basura de la llamada anterior."}},{"t":{"pt":"A correção são <b>dois bytes</b>, apontando a carga para o registrador certo. Nada foi reescrito. <b>Seis das sete variantes não apareciam numa tela havia trinta e cinco anos.</b>","en":"The fix is <b>two bytes</b>, pointing the load at the right register. Nothing was rewritten. <b>Six of the seven variants had not reached a screen in thirty-five years.</b>","es":"La corrección son <b>dos bytes</b>, apuntando la carga al registro correcto. No se reescribió nada. <b>Seis de las siete variantes no habían llegado a una pantalla en treinta y cinco años.</b>"},"foto":"fj2/07-e-voce-tambem-goku.png"}]},{"titulo":{"pt":"Conteúdo novo","en":"New content","es":"Contenido nuevo"},"itens":[{"t":{"pt":"<b>Prólogo de cinco páginas</b>, escrito do zero, recapitulando o <i>Famicom Jump: Eiyuu Retsuden</i> de 1989 — para quem chega ao segundo jogo sem ter jogado o primeiro","en":"<b>A five-page prologue</b>, newly written, recapping <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — for anyone arriving at the second game without the first","es":"<b>Un prólogo de cinco páginas</b>, escrito de cero, que recapitula <i>Famicom Jump: Eiyuu Retsuden</i> (1989) — para quien llega al segundo juego sin el primero"},"foto":"fj2/04-prologo-novo.png"},{"t":{"pt":"<b>Tela de créditos</b> antes do título: 5 segundos, pula com A ou START. Cabe inteira — código, paleta e texto — em 355 bytes de espaço morto do banco do título","en":"<b>A credits screen</b> before the title: 5 seconds, skippable with A or START. The whole thing — code, palette and text — fits in 355 bytes of dead space in the title bank","es":"<b>Una pantalla de créditos</b> antes del título: 5 segundos, se salta con A o START. Cabe entera — código, paleta y texto — en 355 bytes de espacio muerto del banco del título"},"foto":"fj2/02-creditos.png"},{"t":{"pt":"<b>Selo <code>DEFINITIVE EDITION</code></b> no rodapé do título, sem tirar nada e <b>sem gastar um byte a mais</b>: reescrever o escritor do subtítulo para ser dirigido por tabela liberou seis tiles, e o rodapé só precisava de quatro letras novas","en":"<b>A <code>DEFINITIVE EDITION</code> seal</b> on the title footer, taking nothing away and <b>costing zero extra bytes</b>: rewriting the subtitle routine to be table-driven freed six tile slots, and the seal needed only four letters that were not already there","es":"<b>Un sello <code>DEFINITIVE EDITION</code></b> en el pie del título, sin quitar nada y <b>sin gastar un byte de más</b>: reescribir la rutina del subtítulo para que fuera dirigida por tabla liberó seis tiles, y el sello solo necesitaba cuatro letras que no estuvieran ya"},"foto":"fj2/01-tela-titulo.png"},{"t":{"pt":"<b>Botão B contextual.</b> No original, falar com alguém custa abrir o menu; o B não fazia nada no campo. Agora o B fala com quem estiver à frente e, não havendo ninguém, examina o chão — a mesma divisão que o manual faz entre <code>はなす</code> e <code>しらべる</code>. O comando continua no menu para quem preferir.","en":"<b>A context-sensitive B button.</b> In the original, talking to someone costs a menu; B did nothing in the field. Now B talks to whoever is in front of you and, when nobody is, examines the ground — the same split the manual draws between <code>はなす</code> and <code>しらべる</code>. The menu command is still there for anyone who prefers it.","es":"<b>Botón B contextual.</b> En el original, hablar con alguien cuesta abrir el menú; la B no hacía nada en el campo. Ahora la B habla con quien tengas delante y, si no hay nadie, examina el suelo — la misma división que hace el manual entre <code>はなす</code> y <code>しらべる</code>. El comando sigue en el menú para quien lo prefiera."}}]},{"titulo":{"pt":"A engenharia","en":"The engineering","es":"La ingeniería"},"itens":[{"t":{"pt":"Medido em tradução real, o inglês ocupa <b>1,51×</b> os caracteres do japonês. Não cabia: faltavam cerca de <b>20 KB</b> — num cartucho no teto do mapper, com <b>zero bytes livres</b>.","en":"Measured on the real translation, English runs <b>1.51×</b> the character count of the Japanese. It did not fit: the script was about <b>20 KB</b> over — on a cartridge at the mapper ceiling, with <b>zero free bytes</b>.","es":"Medido en traducción real, el inglés ocupa <b>1,51×</b> los caracteres del japonés. No cabía: faltaban unos <b>20 KB</b> — en un cartucho en el techo del mapper, con <b>cero bytes libres</b>."}},{"t":{"pt":"Em vez de cortar texto, <b>troquei a compressão</b>. Um <b>Huffman de ordem 1</b> — a árvore escolhida pelo caractere anterior, em 26 grupos de contexto — leva o texto de 6,25 para <b>3,90 bits por caractere</b>. O decodificador tem <b>89 bytes</b> de 6502 escritos à mão.","en":"Rather than trim text, <b>I replaced the compression</b>. An <b>order-1 Huffman coder</b> — the tree picked by the previous character, across 26 context groups — takes the script from 6.25 to <b>3.90 bits per character</b>. The decoder is <b>89 bytes</b> of hand-written 6502.","es":"En vez de cortar texto, <b>cambié la compresión</b>. Un <b>Huffman de orden 1</b> — el árbol elegido por el carácter anterior, en 26 grupos de contexto — lleva el texto de 6,25 a <b>3,90 bits por carácter</b>. El decodificador son <b>89 bytes</b> de 6502 escritos a mano."}},{"t":{"pt":"As tabelas dos 26 grupos couberam nos <b>1.060 bytes</b> úteis do banco do dicionário antigo mais 65 bytes de enchimento no fim dele. O roteiro inglês fechou em <b>65,9 KB dentro de 68,1 KB</b> — folga de 2,2 KB num cartucho cujo maior vão livre tem 137 bytes.","en":"The tables for the 26 groups fit in the <b>1,060 usable bytes</b> of the old dictionary bank plus 65 bytes of padding at the end of it. The English script closes at <b>65.9 KB inside 68.1 KB</b> — a 2.2 KB margin on a cartridge whose longest free run is 137 bytes.","es":"Las tablas de los 26 grupos cupieron en los <b>1.060 bytes</b> útiles del banco del diccionario antiguo más 65 bytes de relleno al final. El guion inglés cerró en <b>65,9 KB dentro de 68,1 KB</b> — un margen de 2,2 KB en un cartucho cuyo mayor hueco libre tiene 137 bytes."}},{"t":{"pt":"<b>Cada compilação se confere.</b> Uma guarda aborta se qualquer byte fora das regiões declaradas mudar, e outra se duas partes do hack reivindicarem o mesmo byte. As 1.903 mensagens são decodificadas de volta <b>pelo decodificador 6502 real rodando sobre a ROM final</b> e comparadas com a fonte. Um teste de estresse de <b>30.000 quadros</b> com entrada aleatória roda ao lado do cenário exato que travava versões antigas.","en":"<b>Every build checks itself.</b> A guard aborts if any byte outside the declared regions moved, and a second one if two parts of the hack claim the same byte. All 1,903 messages are decoded back <b>by the real 6502 decoder running on the finished ROM</b> and compared to the source. A <b>30,000-frame</b> random-input stress test runs alongside the exact scenario that crashed earlier builds.","es":"<b>Cada compilación se comprueba a sí misma.</b> Una guarda aborta si cambia cualquier byte fuera de las regiones declaradas, y otra si dos partes del hack reclaman el mismo byte. Los 1.903 mensajes se decodifican de vuelta <b>con el decodificador 6502 real corriendo sobre la ROM final</b> y se comparan con el original. Una prueba de estrés de <b>30.000 fotogramas</b> con entrada aleatoria corre junto al escenario exacto que colgaba las versiones antiguas."}}]},{"titulo":{"pt":"Quatro defeitos que eu mesmo introduzi","en":"Four bugs I introduced myself","es":"Cuatro fallos que introduje yo mismo"},"itens":[{"t":{"pt":"Ficam registrados por honestidade. <b>A placa do título</b> perdeu a moldura branca e os raios rosa porque a primeira versão do logo apagou 47 tiles para caber — a arte foi devolvida na íntegra, com <b>zero pixels de diferença</b> conferidos por contagem.","en":"They are recorded here for honesty. <b>The title plaque</b> lost its white border and pink rays because my first logo deleted 47 tiles to make room — the art was restored in full, at <b>zero pixels of difference</b>, checked by counting.","es":"Quedan registrados por honestidad. <b>La placa del título</b> perdió el borde blanco y los rayos rosas porque mi primer logo borró 47 tiles para caber — la ilustración se devolvió entera, con <b>cero píxeles de diferencia</b>, comprobado contando."}},{"t":{"pt":"A oitava imagem da animação da placa é a própria cauda do stream do fundo — a Bandai não guardou duas cópias. Com o logo novo esse ponteiro caía no meio do logo e, após ~46 s parado no título, a placa se enchia de lixo.","en":"The eighth frame of the plaque animation is the tail of the background stream itself — Bandai did not keep two copies. With the new logo that pointer landed in the middle of the logo, and after about 46 seconds sitting on the title screen the plaque filled with garbage.","es":"El octavo fotograma de la animación de la placa es la propia cola del stream del fondo — Bandai no guardó dos copias. Con el logo nuevo ese puntero caía en mitad del logo y, tras unos 46 segundos parado en el título, la placa se llenaba de basura."}},{"t":{"pt":"<b>Uma aspa a mais em cada troca de página</b> — 281 linhas extras ao longo do roteiro — era o que fazia a caixa de fala estourar e deixar um <b>balão fantasma</b> preso no cenário. As correções fecharam a classe inteira, e agora a compilação <b>simula o próprio motor de texto do jogo</b> sobre o roteiro final e aborta se alguma página passar de 21 colunas por 3 linhas.","en":"<b>A stray quotation mark at every page break</b> — 281 extra lines across the script — was the real cause of the dialogue box overflowing and leaving a <b>ghost balloon</b> stuck in the scenery. The fixes closed the whole class, and the build now <b>simulates the game’s own text engine</b> over the final script and aborts if any page exceeds 21 columns by 3 lines.","es":"<b>Una comilla de más en cada salto de página</b> — 281 líneas extra a lo largo del guion — era la causa real de que la caja de diálogo se desbordara y dejara un <b>globo fantasma</b> atrapado en el escenario. Las correcciones cerraron la clase entera, y ahora la compilación <b>simula el propio motor de texto del juego</b> sobre el guion final y aborta si alguna página pasa de 21 columnas por 3 líneas."}}]}],"patch":{"versoes":{"en":{"arquivo":"famicom-jump-2-en.ips","tamanho":"74 KB"},"pt":{"arquivo":"famicom-jump-2-pt.ips","tamanho":"75 KB"},"es":{"arquivo":"famicom-jump-2-es.ips","tamanho":"75 KB"}},"rom":"Famicom Jump II - Saikyou no 7 Nin (Japan).nes","rom_md5":"47910069aa92dcac1b0fa4929cc7ceff"},"fotos":[{"f":"fj2/01-tela-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado pixel a pixel e o selo <code>DEFINITIVE EDITION</code>, que não custou um byte a mais.","en":"The logo redrawn pixel by pixel, and the <code>DEFINITIVE EDITION</code> seal, which cost no extra bytes.","es":"El logo redibujado píxel a píxel, y el sello <code>DEFINITIVE EDITION</code>, que no costó bytes de más."}},{"f":"fj2/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Tela nova antes do título, em 355 bytes de espaço morto.","en":"A new screen before the title, in 355 bytes of dead space.","es":"Una pantalla nueva antes del título, en 355 bytes de espacio muerto."}},{"f":"fj2/04-prologo-novo.png","t":{"pt":"Prólogo novo","en":"New prologue","es":"Prólogo nuevo"},"c":{"pt":"Cinco páginas escritas do zero, recapitulando o primeiro jogo de 1989.","en":"Five newly written pages recapping the 1989 first game.","es":"Cinco páginas escritas de cero que recapitulan el primer juego de 1989."}},{"f":"fj2/05-espirito-jump-world.png","t":{"pt":"O espírito do Jump World","en":"The spirit of Jump World","es":"El espíritu del Jump World"},"c":{"pt":"A abertura, agora em português.","en":"The opening, now in English.","es":"La apertura, ahora en español."}},{"f":"fj2/06-lista-sete-campeoes.png","t":{"pt":"A lista dos sete","en":"The champion list","es":"La lista de los siete"},"c":{"pt":"A tela do bug: seis nomes que, até esta correção, eram sempre os mesmos.","en":"The bug screenshot: six names that, until this fix, were always the same six.","es":"La pantalla del error: seis nombres que, hasta esta corrección, eran siempre los mismos seis."}},{"f":"fj2/07-e-voce-tambem-goku.png","t":{"pt":"\"E você também, Goku.\"","en":"\"That goes for you too, Goku.\"","es":"\"Y tú también, Goku.\""},"c":{"pt":"A fala que ninguém tinha visto em trinta e cinco anos.","en":"The line nobody had seen in thirty-five years.","es":"La frase que nadie había visto en treinta y cinco años."}},{"f":"fj2/03-menu-ingles.png","t":{"pt":"Menus","en":"Menus","es":"Menús"},"c":{"pt":"Status, loja, depósito e treino — 77 textos.","en":"Status, shop, storage and training — 77 strings.","es":"Estado, tienda, almacén y entrenamiento — 77 textos."}},{"f":"fj2/08-soulring.png","t":{"pt":"Itens","en":"Items","es":"Objetos"},"c":{"pt":"Nomes e descrições, encurtados só quando o campo exige.","en":"Names and descriptions, shortened only where the field demands it.","es":"Nombres y descripciones, acortados solo donde el campo lo exige."}}],"manual_pdf":{"en":null,"pt":null,"es":null}},{"slug":"captain-tsubasa","nome":"Captain Tsubasa","subtitulo":"Tecmo Theater Vol. 1","jp":"キャプテン翼","publisher":"Tecmo","dev":"Tecmo","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 · 128 KB PRG expanded to 256 KB · 128 KB CHR-ROM","categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"release","capa":"ct/01-titulo.png","linha":{"pt":"O futebol que é quase um RPG. Existiam <b>dezesseis letras latinas</b> no cartucho inteiro — as outras tiveram de ser desenhadas do nada.","en":"The football game that is almost an RPG. There were <b>sixteen Latin letters</b> in the entire cartridge — the rest had to be drawn from nothing.","es":"El fútbol que es casi un RPG. En todo el cartucho existían <b>dieciséis letras latinas</b> — las demás hubo que dibujarlas de la nada."},"resumo":{"pt":["O jogo que inventou o futebol por menu: você não controla o chute, você escolhe a ação e vê a animação decidir. Cada jogador tem <b>Guts</b>, e cada drible, passe e finalização gasta.","Nesta tradução o jogo também <b>ganhou memória</b>: o original só guardava progresso por senha, e agora ele grava em bateria — sem inventar formato de save nenhum."],"en":["The game that invented menu-driven football: you do not control the shot, you pick the action and watch the animation decide. Every player has <b>Guts</b>, and every dribble, pass and shot spends them.","In this translation the game also <b>gained a memory</b>: the original only kept progress by password, and now it writes to battery-backed save — without inventing any save format at all."],"es":["El juego que inventó el fútbol por menú: no controlas el disparo, eliges la acción y ves cómo la animación decide. Cada jugador tiene <b>Guts</b>, y cada regate, pase y remate los gasta.","En esta traducción el juego también <b>ganó memoria</b>: el original solo guardaba el progreso por contraseña, y ahora graba con pila — sin inventar ningún formato de guardado."]},"numeros":[{"v":"1,001","r":{"pt":"itens de texto inseridos","en":"text items inserted","es":"elementos de texto insertados"}},{"v":"1,177","r":{"pt":"ponteiros corrigidos","en":"pointers corrected","es":"punteros corregidos"}},{"v":"16","r":{"pt":"letras latinas existiam","en":"Latin letters existed","es":"letras latinas existían"}},{"v":"0","r":{"pt":"bytes divergentes em 225 dumps","en":"bytes differing across 225 dumps","es":"bytes distintos en 225 volcados"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.001 itens de texto</b> em inglês, com <b>1.177 ponteiros</b> recalculados","en":"<b>1,001 text items</b> in English, with <b>1,177 pointers</b> recalculated","es":"<b>1.001 elementos de texto</b> en inglés, con <b>1.177 punteros</b> recalculados"},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Fonte inglesa nova de 74 tiles.</b> No cartucho inteiro existiam exatamente <b>dezesseis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. As outras dez, mais as minúsculas e a pontuação, não existiam em lugar nenhum e tiveram de ser desenhadas do zero, casando com tipos feitos para kana.","en":"<b>A new 74-tile English font.</b> Across the entire cartridge there were exactly <b>sixteen Latin letters</b> — <code>ACDEFGHIKMRSUVWY</code>. The other ten, plus the lower case and the punctuation, did not exist anywhere and had to be drawn from nothing, matched to typefaces designed for kana.","es":"<b>Una fuente inglesa nueva de 74 tiles.</b> En todo el cartucho existían exactamente <b>dieciséis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. Las otras diez, más las minúsculas y la puntuación, no existían en ninguna parte y hubo que dibujarlas de cero, casando con tipografías hechas para kana."}},{"t":{"pt":"<b>Três fontes em três bancos gráficos diferentes</b>, que não concordam entre si — a do campo, a da sala de aula e a da senha.","en":"<b>Three separate fonts living in three different graphics banks</b>, none of which agree with each other — the pitch, the classroom and the password screen.","es":"<b>Tres fuentes en tres bancos gráficos distintos</b>, que no concuerdan entre sí — la del campo, la del aula y la de la contraseña."},"foto":"ct/02-sala.png"},{"t":{"pt":"<b>Ficha do jogador em inglês</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","en":"<b>Player cards in English</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","es":"<b>Fichas de jugador en inglés</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark"},"foto":"ct/04-ficha.png"}]},{"titulo":{"pt":"Duas fileiras onde havia uma","en":"Two rows where there was one","es":"Dos filas donde había una"},"itens":[{"t":{"pt":"O motor de texto do campo escrevia <b>uma fileira</b> por linha de roteiro: 14 e 18 colunas. Um código de controle novo faz cada linha ocupar <b>duas fileiras</b> — <b>28 e 36 colunas</b> — sem mexer no roteiro, na moldura, nem na contagem de linhas. É o que dá espaço para a narração inglesa caber sem virar telegrama.","en":"The pitch text engine wrote <b>one row</b> per script line: 14 and 18 columns. A new control code makes each line occupy <b>two rows</b> — <b>28 and 36 columns</b> — without touching the script, the frame, or the line count. It is what lets English commentary fit without turning into a telegram.","es":"El motor de texto del campo escribía <b>una fila</b> por línea de guion: 14 y 18 columnas. Un código de control nuevo hace que cada línea ocupe <b>dos filas</b> — <b>28 y 36 columnas</b> — sin tocar el guion, el marco ni el conteo de líneas. Es lo que permite que la narración inglesa quepa sin volverse telegrama."},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Senha latinizada e aceita.</b> A grade virou letras latinas maiúsculas, minúsculas e dígitos, e a senha gerada passa pela rotina de validação original do jogo.","en":"<b>The password screen latinised, and accepted.</b> The grid became Latin capitals, lower case and digits, and a generated password passes the game’s own validation routine.","es":"<b>Contraseña latinizada y aceptada.</b> La rejilla pasó a letras latinas mayúsculas, minúsculas y cifras, y la contraseña generada pasa por la rutina de validación original del juego."},"foto":"ct/06-senha.png"}]},{"titulo":{"pt":"Um save que o jogo não tinha","en":"A save the game never had","es":"Un guardado que el juego no tenía"},"itens":[{"t":{"pt":"O original de 1988 guarda progresso <b>só por senha</b>. Agora o jogo <b>grava em bateria</b>: salva ao abrir o <code>SCORE MEMO</code> do técnico e carrega no <code>CONTINUE</code> da tela de título.","en":"The 1988 original keeps progress <b>by password only</b>. Now the game <b>writes to battery-backed save</b>: it saves when you open the coach’s <code>SCORE MEMO</code> and loads on <code>CONTINUE</code> at the title screen.","es":"El original de 1988 guarda el progreso <b>solo por
