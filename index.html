dejes caer y no lo desarmes.</li>\n<li>No toques los contactos ni los mojes.</li>\n<li>Mantén el cartucho lejos del calor y del frío extremos.</li>\n<li>Nunca lo limpies con thinner, bencina ni otros solventes.</li>\n</ul>\n<p>Los consejos de salud de esta sección valen para todos los videojuegos.</p>"}},{"id":"story","titulo":{"en":"Story","es":"Historia"},"html":{"en":"<p>Hikaru, Umi and Fuu, the Magic Knights, have been called to the world of Cefiro once again. But Cefiro is in chaos. It is dying, and their old friend Clef explains why.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/prologo_narracao.png\" data-shot=\"mkr2/manual/prologo_narracao.png\" alt=\"The Magic Knights return to Cefiro\" loading=\"lazy\"></div><figcaption>The Magic Knights return to Cefiro</figcaption></figure>\n<p>Cefiro has lost its Pillar, and without a Pillar the whole world is near collapse. Worse, other lands want the Pillar for themselves and are closing in: Autozam, Chizeta and Fahren.</p>\n<p>To guard Cefiro and find the next Pillar, Hikaru, Umi and Fuu must earn the title of Magic Knight all over again. That means training body and mind from the start.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/clef_crise.png\" data-shot=\"mkr2/manual/clef_crise.png\" alt=\"Clef explains the danger\" loading=\"lazy\"></div><figcaption>Clef explains the danger</figcaption></figure>\n<p>The one chosen to train them is you: Clef's best pupil, and a Guru, or master teacher, in your own right. You have <strong>50 days</strong> to turn the three girls into true Magic Knights.</p>","es":"<p>Lucy, Marina y Anaís vuelven a ser llamadas al mundo de Céfiro. Pero Céfiro está sumido en el caos. Se está muriendo, y su viejo amigo, el Gurú Clef, les explica por qué.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/prologo_narracao.png\" data-shot=\"mkr2/manual/prologo_narracao.png\" alt=\"Las guerreras vuelven a Céfiro\" loading=\"lazy\"></div><figcaption>Las guerreras vuelven a Céfiro</figcaption></figure>\n<p>Céfiro perdió a su Pilar, y sin Pilar el mundo entero está a punto de derrumbarse. Para colmo, otras tierras quieren el Pilar para sí y se acercan cada vez más: Autozam, Chizeta y Fahren.</p>\n<p>Para proteger Céfiro y encontrar al próximo Pilar, Lucy, Marina y Anaís tienen que volver a ganarse el título de Guerrera Mágica. Eso significa entrenar el cuerpo y la mente desde cero.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/clef_crise.png\" data-shot=\"mkr2/manual/clef_crise.png\" alt=\"Clef explica el peligro\" loading=\"lazy\"></div><figcaption>Clef explica el peligro</figcaption></figure>\n<p>La persona elegida para entrenarlas eres tú: la mejor pupila de Clef, que ya es maestra. Tienes <strong>50 días</strong> para convertir a las tres chicas en verdaderas guerreras.</p>"}},{"id":"characters","titulo":{"en":"The Magic Knights and Their Friends","es":"Las guerreras y sus amigos"},"html":{"en":"<h3>Hikaru</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_hikaru.png\" data-shot=\"mkr2/manual/retrato_hikaru.png\" alt=\"Hikaru\" loading=\"lazy\"></div><figcaption>Hikaru</figcaption></figure>\n<p>Honest and determined, Hikaru is still a bit of a kid and always full of energy. She gives her all to even the toughest training.</p>\n<h3>Umi</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_umi.png\" data-shot=\"mkr2/manual/retrato_umi.png\" alt=\"Umi\" loading=\"lazy\"></div><figcaption>Umi</figcaption></figure>\n<p>A real beauty who goes to a private school for girls. She can seem spoiled, but she cares deeply about her friends.</p>\n<h3>Fuu</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_fuu.png\" data-shot=\"mkr2/manual/retrato_fuu.png\" alt=\"Fuu\" loading=\"lazy\"></div><figcaption>Fuu</figcaption></figure>\n<p>Calm and always smiling. Fuu goes at her own pace, but she is tough when it counts, and she is very, very smart.</p>\n<h3>Mokona</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/mokona.png\" data-shot=\"mkr2/manual/mokona.png\" alt=\"Mokona\" loading=\"lazy\"></div><figcaption>Mokona</figcaption></figure>\n<p>A mysterious little creature and a good friend to Hikaru. Mokona never leaves the girls' side. All it ever says is \"Puu.\"</p>\n<h3>Other People of Cefiro</h3>\n<p>Many people live in Cefiro. Visit different places and you will meet them.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/clef.png\" data-shot=\"mkr2/manual/clef.png\" alt=\"Clef\" loading=\"lazy\"></div><figcaption>Clef</figcaption></figure>\n<p><strong>Clef</strong> is the greatest Guru in Cefiro. He gives you advice along the way.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ferio.png\" data-shot=\"mkr2/manual/ferio.png\" alt=\"Ferio\" loading=\"lazy\"></div><figcaption>Ferio</figcaption></figure>\n<p><strong>Ferio</strong> is a skilled swordsman.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/caldina.png\" data-shot=\"mkr2/manual/caldina.png\" alt=\"Caldina\" loading=\"lazy\"></div><figcaption>Caldina</figcaption></figure>\n<p><strong>Caldina</strong> is a dancer and an illusionist, and she loves to teach her dance.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ascot.png\" data-shot=\"mkr2/manual/ascot.png\" alt=\"Ascot\" loading=\"lazy\"></div><figcaption>Ascot</figcaption></figure>\n<p><strong>Ascot</strong> is a summoner. He once fought Umi and lost, and he has had a crush on her ever since.</p>","es":"<h3>Lucy</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_hikaru.png\" data-shot=\"mkr2/manual/retrato_hikaru.png\" alt=\"Lucy\" loading=\"lazy\"></div><figcaption>Lucy</figcaption></figure>\n<p>Sincera y decidida, Lucy todavía es un poco niña y siempre está llena de energía. Lo da todo hasta en el entrenamiento más duro.</p>\n<h3>Marina</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_umi.png\" data-shot=\"mkr2/manual/retrato_umi.png\" alt=\"Marina\" loading=\"lazy\"></div><figcaption>Marina</figcaption></figure>\n<p>Una verdadera belleza que estudia en un colegio privado para señoritas. Puede parecer consentida, pero quiere mucho a sus amigas.</p>\n<h3>Anaís</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/retrato_fuu.png\" data-shot=\"mkr2/manual/retrato_fuu.png\" alt=\"Anaís\" loading=\"lazy\"></div><figcaption>Anaís</figcaption></figure>\n<p>Tranquila y siempre sonriente. Anaís va a su propio ritmo, pero es firme cuando hace falta, y es muy, muy inteligente.</p>\n<h3>Nikona</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/mokona.png\" data-shot=\"mkr2/manual/mokona.png\" alt=\"Nikona\" loading=\"lazy\"></div><figcaption>Nikona</figcaption></figure>\n<p>Una pequeña criatura misteriosa y buena amiga de Lucy. Nikona nunca se aparta de las chicas. Lo único que dice es \"Puu\".</p>\n<h3>Otros habitantes de Céfiro</h3>\n<p>En Céfiro vive mucha gente. Visita distintos lugares y la irás conociendo.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/clef.png\" data-shot=\"mkr2/manual/clef.png\" alt=\"Gurú Clef\" loading=\"lazy\"></div><figcaption>Gurú Clef</figcaption></figure>\n<p><strong>Gurú Clef</strong> es el mayor gurú de Céfiro. Te da consejos a lo largo del camino.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ferio.png\" data-shot=\"mkr2/manual/ferio.png\" alt=\"Ferio\" loading=\"lazy\"></div><figcaption>Ferio</figcaption></figure>\n<p><strong>Ferio</strong> es un espadachín muy hábil.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/caldina.png\" data-shot=\"mkr2/manual/caldina.png\" alt=\"Caldina\" loading=\"lazy\"></div><figcaption>Caldina</figcaption></figure>\n<p><strong>Caldina</strong> es bailarina e ilusionista, y le encanta enseñar su baile.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ascot.png\" data-shot=\"mkr2/manual/ascot.png\" alt=\"Ascot\" loading=\"lazy\"></div><figcaption>Ascot</figcaption></figure>\n<p><strong>Ascot</strong> es un invocador. Una vez peleó contra Marina y perdió, y desde entonces está enamorado de ella.</p>"}},{"id":"controls","titulo":{"en":"Controls","es":"Controles"},"html":{"en":"<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/gamegear_botoes.png\" data-shot=\"mkr2/manual/gamegear_botoes.png\" alt=\"Game Gear controls\" loading=\"lazy\"></div><figcaption>Game Gear controls</figcaption></figure>\n<h3>START Button</h3>\n<ul>\n<li>Starts the game from the title screen.</li>\n<li>On the Name screen, switches between uppercase and lowercase letters.</li>\n<li>On the adventure screen, shows the next girl's stats.</li>\n</ul>\n<h3>D-Pad (Directional Pad)</h3>\n<ul>\n<li>Moves the cursor.</li>\n<li>Picks your answer when a question appears.</li>\n</ul>\n<h3>Button 1</h3>\n<ul>\n<li>Cancels a command.</li>\n<li>On the Name screen, erases the last letter.</li>\n</ul>\n<h3>Button 2</h3>\n<ul>\n<li>Confirms a command.</li>\n<li>Advances the text.</li>\n<li>Stops the roulette at the castle events.</li>\n</ul>","es":"<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/gamegear_botoes.es.png\" data-shot=\"mkr2/manual/gamegear_botoes.es.png\" alt=\"Controles del Game Gear\" loading=\"lazy\"></div><figcaption>Controles del Game Gear</figcaption></figure>\n<h3>Botón START</h3>\n<ul>\n<li>Inicia el juego desde la pantalla de título.</li>\n<li>En la pantalla del nombre, cambia entre mayúsculas y minúsculas.</li>\n<li>En la pantalla de aventura, muestra las dotes de la siguiente chica.</li>\n</ul>\n<h3>Botón direccional</h3>\n<ul>\n<li>Mueve el cursor.</li>\n<li>Elige tu respuesta cuando aparece una pregunta.</li>\n</ul>\n<h3>Botón 1</h3>\n<ul>\n<li>Cancela una selección.</li>\n<li>En la pantalla del nombre, borra la última letra.</li>\n</ul>\n<h3>Botón 2</h3>\n<ul>\n<li>Confirma una selección.</li>\n<li>Hace avanzar el texto.</li>\n<li>Detiene la ruleta en los eventos del castillo.</li>\n</ul>"}},{"id":"goal","titulo":{"en":"Goal of the Game","es":"Objetivo del juego"},"html":{"en":"<p>To become Magic Knights, Hikaru, Umi and Fuu need high stats. Each girl has eight <strong>stats</strong>, such as POWER, SWORD and CHARM (see \"Stats\"). Your job as their Guru is to raise those numbers with a lesson plan, one day at a time.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/parametros_objetivo.png\" data-shot=\"mkr2/manual/parametros_objetivo.png\" alt=\"A girl&#x27;s stats\" loading=\"lazy\"></div><figcaption>A girl's stats</figcaption></figure>\n<h3>How the Game Flows</h3>\n<p><strong>The training screen.</strong> This is the heart of the game. Each day you choose what the girls will do, and their stats go up and down.</p>\n<p><strong>Adventure and events.</strong> Once the girls are strong enough, send them out on an adventure. There they find items and face events. Clear an event and a girl's stats can jump way up, or she may earn an item that makes her stronger. Stats can also go down out there.</p>\n<p><strong>Day 50.</strong> When the 50 days are over, you will see what became of each girl. Her future depends on how you raised her.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/hud_humores.png\" data-shot=\"mkr2/manual/hud_humores.png\" alt=\"The training screen with the girls&#x27; moods\" loading=\"lazy\"></div><figcaption>The training screen with the girls' moods</figcaption></figure>\n<h3>Keys to Success</h3>\n<ul>\n<li>Train all three girls. Do not let one fall far behind.</li>\n<li>Raise each stat with care. Every lesson helps some stats and can lower others.</li>\n</ul>","es":"<p>Para ser Guerrera Mágica, una chica necesita dotes altas. Lucy, Marina y Anaís tienen ocho <strong>dotes</strong> cada una, como VIGOR, SABLE y GARBO (consulta \"Dotes\"). Tu tarea, como su maestra, es subir esos números eligiendo sus lecciones día a día.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/parametros_objetivo.png\" data-shot=\"mkr2/manual/parametros_objetivo.png\" alt=\"Las dotes de una chica\" loading=\"lazy\"></div><figcaption>Las dotes de una chica</figcaption></figure>\n<h3>Cómo avanza el juego</h3>\n<p><strong>La pantalla de entrenamiento.</strong> Aquí pasas casi todo el juego: cada día eliges qué harán las chicas, y sus dotes suben y bajan.</p>\n<p><strong>Aventuras y eventos.</strong> Cuando las chicas sean lo bastante fuertes, mándalas de aventura. Allí encuentran objetos y viven eventos. Si una chica supera un evento, sus dotes pueden dar un gran salto, o puede ganar un objeto que la haga más fuerte. Allá afuera las dotes también pueden bajar.</p>\n<p><strong>Día 50.</strong> Cuando terminen los 50 días, verás qué fue de cada chica. Su futuro depende de cómo la hayas entrenado.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/hud_humores.png\" data-shot=\"mkr2/manual/hud_humores.png\" alt=\"La pantalla de entrenamiento con el humor de las chicas\" loading=\"lazy\"></div><figcaption>La pantalla de entrenamiento con el humor de las chicas</figcaption></figure>\n<h3>Claves del éxito</h3>\n<ul>\n<li>Entrena a las tres chicas. No dejes que una se quede muy atrás.</li>\n<li>Sube cada dote con cuidado. Cada lección ayuda a algunas dotes y puede bajar otras.</li>\n</ul>"}},{"id":"getting-started","titulo":{"en":"Getting Started","es":"Cómo empezar"},"html":{"en":"<p>Insert the cartridge and turn the power ON. When the title screen appears, press the START Button.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/titulo_press_start.png\" data-shot=\"mkr2/manual/titulo_press_start.png\" alt=\"The title screen\" loading=\"lazy\"></div><figcaption>The title screen</figcaption></figure>\n<h3>New Game or Continue</h3>\n<p>If you have a saved game on the cartridge, a menu appears. Press the D-Pad up or down to choose, then press Button 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_new_continue.png\" data-shot=\"mkr2/manual/menu_new_continue.png\" alt=\"NEW GAME or CONTINUE\" loading=\"lazy\"></div><figcaption>NEW GAME or CONTINUE</figcaption></figure>\n<ul>\n<li><strong>NEW GAME:</strong> Starts from the very beginning, with the opening story. Partway through it, Clef asks for your name.</li>\n<li><strong>CONTINUE:</strong> Picks up your game on the day you saved it. Choose <strong>SAVE 1</strong> or <strong>SAVE 2</strong>, then press Button 2.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/lista_saves.png\" data-shot=\"mkr2/manual/lista_saves.png\" alt=\"Choose a saved game\" loading=\"lazy\"></div><figcaption>Choose a saved game</figcaption></figure>\n<p>If there is no saved game on the cartridge, the menu does not appear. The game starts from the beginning.</p>","es":"<p>Inserta el cartucho y enciende la consola (ON). Cuando aparezca la pantalla de título, pulsa el Botón START.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/titulo_press_start.png\" data-shot=\"mkr2/manual/titulo_press_start.png\" alt=\"La pantalla de título\" loading=\"lazy\"></div><figcaption>La pantalla de título</figcaption></figure>\n<h3>NUEVA PARTIDA o CONTINUAR</h3>\n<p>Si hay una partida guardada en el cartucho, aparece un menú. Pulsa el botón direccional arriba o abajo para elegir y luego pulsa el Botón 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_new_continue.png\" data-shot=\"mkr2/manual/menu_new_continue.png\" alt=\"NUEVA PARTIDA o CONTINUAR\" loading=\"lazy\"></div><figcaption>NUEVA PARTIDA o CONTINUAR</figcaption></figure>\n<ul>\n<li><strong>NUEVA PARTIDA:</strong> Empieza desde el principio, con la historia de apertura. A mitad de ella, Clef te pregunta tu nombre.</li>\n<li><strong>CONTINUAR:</strong> Retoma tu partida en el día en que la guardaste. Elige la partida guardada, <strong>DATO 1</strong> o <strong>DATO 2</strong> (los mismos espacios <strong>Dato1</strong> y <strong>Dato2</strong> donde guardas), y pulsa el Botón 2.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/lista_saves.png\" data-shot=\"mkr2/manual/lista_saves.png\" alt=\"Elige una partida guardada\" loading=\"lazy\"></div><figcaption>Elige una partida guardada</figcaption></figure>\n<p>Si no hay ninguna partida guardada en el cartucho, el menú no aparece. El juego empieza desde el principio.</p>"}},{"id":"entering-your-name","titulo":{"en":"Entering Your Name","es":"Tu nombre"},"html":{"en":"<p>During the opening story of a NEW GAME, you are asked to enter your name. This is the name the people of Cefiro will call you by.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/nome_maiusculas.png\" data-shot=\"mkr2/manual/nome_maiusculas.png\" alt=\"The Name screen in capital letters\" loading=\"lazy\"></div><figcaption>The Name screen in capital letters</figcaption></figure>\n<ol>\n<li>Use the D-Pad to move the cursor to a letter, then press Button 2 to enter it.</li>\n<li>Press Button 1 to erase the last letter. You can also choose <strong>BACK</strong>.</li>\n<li>Press START, or choose <strong>abc</strong> or <strong>ABC</strong>, to switch between lowercase and uppercase letters.</li>\n<li>When you are done, choose <strong>END</strong> and press Button 2.</li>\n</ol>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/nome_minusculas.png\" data-shot=\"mkr2/manual/nome_minusculas.png\" alt=\"The Name screen in small letters\" loading=\"lazy\"></div><figcaption>The Name screen in small letters</figcaption></figure>\n<p>Your name can be up to <strong>6</strong> characters long. Along with the letters A to Z, you can use the numbers 0 to 9 and these symbols: `- . ' , : ! ? &amp;`</p>\n<p>In the game, everyone will call you by this name, and Clef often calls you \"Guru\" plus your name. Your name is kept in your saved game.</p>","es":"<p>Durante la historia de apertura de una NUEVA PARTIDA, tienes que escribir tu nombre. Es el nombre con el que te llamará la gente de Céfiro.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/nome_maiusculas.png\" data-shot=\"mkr2/manual/nome_maiusculas.png\" alt=\"La pantalla del nombre en mayúsculas\" loading=\"lazy\"></div><figcaption>La pantalla del nombre en mayúsculas</figcaption></figure>\n<ol>\n<li>Con el botón direccional, lleva el cursor a una letra y pulsa el Botón 2 para escribirla.</li>\n<li>Pulsa el Botón 1 para borrar la última letra. También puedes elegir <strong>BORRAR</strong>.</li>\n<li>Pulsa START, o elige <strong>abc</strong> o <strong>ABC</strong>, para cambiar entre minúsculas y mayúsculas.</li>\n<li>Cuando termines, elige <strong>FIN</strong> y pulsa el Botón 2.</li>\n</ol>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/nome_minusculas.png\" data-shot=\"mkr2/manual/nome_minusculas.png\" alt=\"La pantalla del nombre en minúsculas\" loading=\"lazy\"></div><figcaption>La pantalla del nombre en minúsculas</figcaption></figure>\n<p>Tu nombre puede tener hasta <strong>6</strong> caracteres. Además de las letras de la A a la Z y la Ñ, puedes usar los números del 0 al 9 y estos signos: `- . ' , : ! ?`</p>\n<p>En el juego todos te llamarán por este nombre, y Clef suele llamarte \"Jefe\" seguido de tu nombre. Tu nombre se guarda junto con la partida.</p>"}},{"id":"training-screen","titulo":{"en":"The Training Screen","es":"La pantalla de entrenamiento"},"html":{"en":"<p>The training screen is where you spend most of your time. There are three of them: one in the Town, one in the Forest and one on the Mountain. You move from one to another by going on an adventure.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/hud_vila.png\" data-shot=\"mkr2/manual/hud_vila.png\" alt=\"The training screen in the Town\" loading=\"lazy\"></div><figcaption>The training screen in the Town</figcaption></figure>\n<ol>\n<li><strong>Place</strong> (top left). Where the girls are now: <strong>TOWN</strong>, <strong>FOREST</strong> or <strong>MOUNTAIN</strong>.</li>\n<li><strong>Weather</strong> (top center). An icon shows today's weather: sun, rain or snow.</li>\n<li><strong>Day</strong> (top right). Today's day, shown as <strong>DAY</strong> and a number. You have 50 days in all.</li>\n<li><strong>Moods</strong> (right side, next to each girl's face). How each of the three girls is feeling today. See \"Moods.\"</li>\n<li><strong>Main icons</strong> (below the moods). Choose these to set the plan, check stats and items, save, and pick today's lesson. See \"Main Icons.\"</li>\n<li><strong>Favorite</strong> (the girl standing in the middle of the scene). The girl you are favoring right now. See \"Plan.\"</li>\n</ol>","es":"<p>La pantalla de entrenamiento es donde pasas la mayor parte del tiempo. Hay tres: una en el pueblo, una en el bosque y una en el monte. Para pasar de una a otra, sales de aventura.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/hud_vila.png\" data-shot=\"mkr2/manual/hud_vila.png\" alt=\"La pantalla de entrenamiento en el pueblo\" loading=\"lazy\"></div><figcaption>La pantalla de entrenamiento en el pueblo</figcaption></figure>\n<ol>\n<li><strong>Lugar</strong> (arriba a la izquierda). Dónde están las chicas ahora: <strong>PUEBLO</strong>, <strong>BOSQUE DE ESPÍRITUS</strong> o <strong>MONTE</strong>.</li>\n<li><strong>Clima</strong> (arriba al centro). Un icono muestra el tiempo de hoy: sol, lluvia o nieve.</li>\n<li><strong>Día</strong> (arriba a la derecha). El día de hoy, que aparece como <strong>DÍA</strong> y un número. Tienes 50 días en total.</li>\n<li><strong>Humor</strong> (lado derecho, junto a la cara de cada chica). Cómo se siente hoy cada una de las tres. Consulta \"Humor\".</li>\n<li><strong>Iconos principales</strong> (debajo del humor). Con ellos fijas el plan, revisas las dotes y los objetos, guardas la partida y eliges la lección del día. Consulta \"Iconos principales\".</li>\n<li><strong>Favorita</strong> (la chica que está de pie en medio de la escena). La chica a la que favoreces ahora. Consulta \"Plan\".</li>\n</ol>"}},{"id":"moods","titulo":{"en":"Moods","es":"Humor"},"html":{"en":"<p>Each girl's mood appears on the training screen. A good mood helps her lessons. A bad mood can ruin them, or make her skip them altogether.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/painel_humor.png\" data-shot=\"mkr2/manual/painel_humor.png\" alt=\"The mood panel\" loading=\"lazy\"></div><figcaption>The mood panel</figcaption></figure>\n<p>Moods mostly change because of a girl's stats (see \"Stats\"), but chance and events can change them too.</p>\n<table><thead><tr><th>Mood</th><th>What causes it</th><th>What it does</th></tr></thead><tbody><tr><td><strong>NORMAL</strong></td><td></td><td>Nothing special.</td></tr><tr><td><strong>ANGRY</strong></td><td>Low WILL and low MIND</td><td>She tends to skip her lessons.</td></tr><tr><td><strong>TEARY</strong></td><td>Low WILL and low POWER</td><td>Her lessons do not go well.</td></tr><tr><td><strong>GIDDY</strong></td><td>Low WILL and high CHARM</td><td>She tends to skip her lessons.</td></tr><tr><td><strong>GONE</strong></td><td>Low WILL and MIND above average</td><td>She runs off for a while.</td></tr><tr><td><strong>PEPPY</strong></td><td>Very high WILL and POWER</td><td>Her lessons go great!</td></tr><tr><td><strong>HURT</strong></td><td>She lost a battle on an adventure</td><td>She rests for that day only.</td></tr></tbody></table>\n<h3>Back to Normal</h3>\n<p>A girl in a bad mood can get back to normal in three ways:</p>\n<ul>\n<li>Wait. Moods fade on their own after a while.</li>\n<li>Bring her POWER and WILL back up.</li>\n<li>Set her straight. The day after her mood changes, you get two choices for how to handle her. Pick the right one and she is back to normal.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_advertencia.png\" data-shot=\"mkr2/manual/pergunta_advertencia.png\" alt=\"Deciding how to handle a moody girl\" loading=\"lazy\"></div><figcaption>Deciding how to handle a moody girl</figcaption></figure>\n<p>A HURT girl is always back to normal the next day.</p>","es":"<p>El humor de cada chica aparece en la pantalla de entrenamiento. El buen humor ayuda en sus lecciones. El mal humor puede arruinarlas, o hacer que la chica ni siquiera se presente.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/painel_humor.png\" data-shot=\"mkr2/manual/painel_humor.png\" alt=\"El panel de humor\" loading=\"lazy\"></div><figcaption>El panel de humor</figcaption></figure>\n<p>El humor cambia sobre todo por las dotes de la chica (consulta \"Dotes\"), pero el azar y los eventos también pueden cambiarlo.</p>\n<table><thead><tr><th>Humor</th><th>Qué lo causa</th><th>Qué provoca</th></tr></thead><tbody><tr><td><strong>NORMAL</strong></td><td></td><td>Nada especial.</td></tr><tr><td><strong>IRA</strong></td><td>ÁNIMO bajo y MENTE baja</td><td>Suele faltar a sus lecciones.</td></tr><tr><td><strong>LLANTO</strong></td><td>ÁNIMO bajo y VIGOR bajo</td><td>Sus lecciones no le salen bien.</td></tr><tr><td><strong>LATIDO</strong></td><td>ÁNIMO bajo y GARBO alto</td><td>Suele faltar a sus lecciones.</td></tr><tr><td><strong>HUIDA</strong></td><td>ÁNIMO bajo y MENTE por encima del promedio</td><td>Se escapa por un tiempo.</td></tr><tr><td><strong>ALEGRE</strong></td><td>ÁNIMO y VIGOR muy altos</td><td>¡Sus lecciones salen de maravilla!</td></tr><tr><td><strong>HERIDA</strong></td><td>Perdió una pelea en una aventura</td><td>Descansa solo ese día.</td></tr></tbody></table>\n<h3>De vuelta a NORMAL</h3>\n<p>Hay tres maneras de que una chica de mal humor vuelva a la normalidad:</p>\n<ul>\n<li>Esperar. El mal humor se pasa solo después de un tiempo.</li>\n<li>Volver a subir su VIGOR y su ÁNIMO.</li>\n<li>Corregirla. El día después de que cambie su humor, tienes dos opciones para tratarla. Elige la correcta y volverá a la normalidad.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_advertencia.png\" data-shot=\"mkr2/manual/pergunta_advertencia.png\" alt=\"Cómo tratar a una chica de mal humor\" loading=\"lazy\"></div><figcaption>Cómo tratar a una chica de mal humor</figcaption></figure>\n<p>Una chica HERIDA siempre vuelve a la normalidad al día siguiente.</p>"}},{"id":"main-icons","titulo":{"en":"Main Icons","es":"Iconos principales"},"html":{"en":"<p>Everything you do on the training screen starts with the five main icons. Move the cursor with the D-Pad and press Button 2 to choose one. At the start of a new game, Clef explains each one.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/icones_cursor.png\" data-shot=\"mkr2/manual/icones_cursor.png\" alt=\"The main icons\" loading=\"lazy\"></div><figcaption>The main icons</figcaption></figure>\n<ul>\n<li><strong>Plan.</strong> Decide how hard to train the girls, and which one to favor. See \"Plan.\"</li>\n<li><strong>Stats.</strong> Check the stats of Hikaru, Umi and Fuu. See \"Stats.\"</li>\n<li><strong>Items.</strong> See the items you have. See \"Items.\"</li>\n<li><strong>Save.</strong> Save your progress. See \"Saving Your Game.\"</li>\n<li><strong>Schedule.</strong> Choose today's lesson for the three girls. See \"The Schedule and the Lessons.\"</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/tutorial_clef.png\" data-shot=\"mkr2/manual/tutorial_clef.png\" alt=\"Clef explains the icons\" loading=\"lazy\"></div><figcaption>Clef explains the icons</figcaption></figure>","es":"<p>Todo lo que haces en la pantalla de entrenamiento empieza con los cinco iconos principales. Mueve el cursor con el botón direccional y pulsa el Botón 2 para elegir uno. Al empezar una partida nueva, Clef te explica cada uno.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/icones_cursor.png\" data-shot=\"mkr2/manual/icones_cursor.png\" alt=\"Los iconos principales\" loading=\"lazy\"></div><figcaption>Los iconos principales</figcaption></figure>\n<ul>\n<li><strong>Plan.</strong> Decide qué tan duro entrenar a las chicas y a cuál favorecer. Consulta \"Plan\".</li>\n<li><strong>Dotes.</strong> Revisa las dotes de Lucy, Marina y Anaís. Consulta \"Dotes\".</li>\n<li><strong>Objetos.</strong> Mira los objetos que tienes. Consulta \"Objetos\".</li>\n<li><strong>Guardar.</strong> Guarda tu progreso. Consulta \"Guardar la partida\".</li>\n<li><strong>Agenda.</strong> Elige la lección del día para las tres chicas. Consulta \"La agenda y las lecciones\".</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/tutorial_clef.png\" data-shot=\"mkr2/manual/tutorial_clef.png\" alt=\"Clef explica los iconos\" loading=\"lazy\"></div><figcaption>Clef explica los iconos</figcaption></figure>"}},{"id":"plan","titulo":{"en":"Plan: Soft, Normal, Harsh and the Favorite","es":"Plan: Suave, media, Dura y la favorita"},"html":{"en":"<p>Choose the Plan icon and you get two options: <strong>Plan</strong> and <strong>Pick a favorite</strong>. Press the D-Pad up or down to pick one, then press Button 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_plano.png\" data-shot=\"mkr2/manual/menu_plano.png\" alt=\"The Plan menu\" loading=\"lazy\"></div><figcaption>The Plan menu</figcaption></figure>\n<h3>Plan</h3>\n<p>Sets how strict you are with the girls. There are three levels:</p>\n<ul>\n<li><strong>Soft:</strong> Gentle on the girls, but they gain less.</li>\n<li><strong>Normal:</strong> The standard way to train.</li>\n<li><strong>Harsh:</strong> Better results, but each lesson costs more POWER or WILL.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_intensidade.png\" data-shot=\"mkr2/manual/menu_intensidade.png\" alt=\"Soft, Normal or Harsh\" loading=\"lazy\"></div><figcaption>Soft, Normal or Harsh</figcaption></figure>\n<p>The level you pick stays in effect until you change it.</p>\n<h3>Pick a Favorite</h3>\n<p>Choose one girl to train with extra care. All three girls always take the same lesson, but your favorite gains more than the other two.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/quem_favorecer.png\" data-shot=\"mkr2/manual/quem_favorecer.png\" alt=\"Choosing a favorite\" loading=\"lazy\"></div><figcaption>Choosing a favorite</figcaption></figure>\n<ul>\n<li>You can only have one favorite at a time.</li>\n<li>Your favorite gets a bigger gain in the lesson's main stat and in its second stat. On Normal, it is exactly double.</li>\n<li>The stat a lesson lowers drops by the same amount for her as for everyone else.</li>\n<li>At the start of the game, your favorite is Hikaru.</li>\n</ul>\n<p>For exact numbers, see the \"Lesson Chart.\"</p>","es":"<p>Elige el icono Plan y verás dos opciones: <strong>Plan</strong>, que fija qué tan duro entrenas, y <strong>Tu favorita</strong>. Pulsa el botón direccional arriba o abajo para elegir una y luego pulsa el Botón 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_plano.png\" data-shot=\"mkr2/manual/menu_plano.png\" alt=\"El menú Plan\" loading=\"lazy\"></div><figcaption>El menú Plan</figcaption></figure>\n<h3>Plan</h3>\n<p>Fija cuánta mano dura usas con las chicas. Hay tres niveles:</p>\n<ul>\n<li><strong>Suave:</strong> Eres amable con las chicas, pero ganan menos.</li>\n<li>Nivel <strong>media:</strong> la forma normal de entrenar.</li>\n<li><strong>Dura:</strong> Mejores resultados, pero cada lección cuesta más VIGOR o ÁNIMO.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_intensidade.png\" data-shot=\"mkr2/manual/menu_intensidade.png\" alt=\"Suave, media o Dura\" loading=\"lazy\"></div><figcaption>Suave, media o Dura</figcaption></figure>\n<p>El nivel que elijas se mantiene hasta que lo cambies.</p>\n<h3>Tu favorita</h3>\n<p>Elige a una chica para entrenarla con especial cuidado. Las tres siempre toman la misma lección, pero tu favorita gana más que las otras dos.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/quem_favorecer.png\" data-shot=\"mkr2/manual/quem_favorecer.png\" alt=\"Cómo elegir a la favorita\" loading=\"lazy\"></div><figcaption>Cómo elegir a la favorita</figcaption></figure>\n<ul>\n<li>Solo puedes tener una favorita a la vez.</li>\n<li>Cada lección sube una dote principal y, a veces, una segunda (consulta \"Tabla de lecciones\"). Tu favorita gana más en esas dos. Con la opción <strong>media</strong>, gana exactamente el doble.</li>\n<li>Si la lección baja alguna dote, a tu favorita le baja lo mismo que a las demás.</li>\n<li>Al empezar el juego, tu favorita es Lucy.</li>\n</ul>\n<p>Para ver los números exactos, consulta la \"Tabla de lecciones\".</p>"}},{"id":"stats","titulo":{"en":"Stats","es":"Dotes"},"html":{"en":"<p>Choose the Stats icon to see how each girl is doing. Pick <strong>HIK</strong> (Hikaru), <strong>UMI</strong> or <strong>FUU</strong> to see her numbers.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/parametros_hik.png\" data-shot=\"mkr2/manual/parametros_hik.png\" alt=\"The stats screen\" loading=\"lazy\"></div><figcaption>The stats screen</figcaption></figure>\n<table><thead><tr><th>Stat</th><th>Range</th><th>What it means</th></tr></thead><tbody><tr><td><strong>POWER</strong></td><td>1 to 100</td><td>Her physical strength. Some lessons use it up. In battle, a girl who runs out of POWER loses.</td></tr><tr><td><strong>WILL</strong></td><td>1 to 100</td><td>Her spirit. Some lessons use it up, and so does magic.</td></tr><tr><td><strong>SWORD</strong></td><td>up to 80</td><td>Her skill with a sword.</td></tr><tr><td><strong>MAGIC</strong></td><td>up to 80</td><td>Her skill with magic.</td></tr><tr><td><strong>GRACE</strong></td><td>up to 80</td><td>Her poise and good manners.</td></tr><tr><td><strong>MIND</strong></td><td>up to 80</td><td>Her brains.</td></tr><tr><td><strong>ART</strong></td><td>up to 80</td><td>Her artistic talent.</td></tr><tr><td><strong>CHARM</strong></td><td>up to 80</td><td>How charming she is.</td></tr></tbody></table>\n<p>Next to each number are little Mokona marks. Each mark stands for about 20 points, so you can see at a glance how a stat is coming along.</p>\n<h3>Plus 1 Items</h3>\n<p>SWORD, MAGIC, GRACE, MIND, ART and CHARM normally stop at 80. Find the Plus 1 item for a stat and that stat can go all the way to 100. See \"Items.\"</p>\n<p>These six stats can also drop as low as −27, so keep an eye on them.</p>","es":"<p>Elige el icono Dotes para ver cómo va cada chica. Elige <strong>LUC</strong> (Lucy), <strong>MAR</strong> (Marina) o <strong>ANA</strong> (Anaís) para ver sus números.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/parametros_hik.png\" data-shot=\"mkr2/manual/parametros_hik.png\" alt=\"La pantalla de dotes\" loading=\"lazy\"></div><figcaption>La pantalla de dotes</figcaption></figure>\n<table><thead><tr><th>Dote</th><th>Rango</th><th>Qué significa</th></tr></thead><tbody><tr><td><strong>VIGOR</strong></td><td>1 a 100</td><td>Su fuerza física. Algunas lecciones lo gastan. En una pelea, la chica que se queda sin VIGOR pierde.</td></tr><tr><td><strong>ÁNIMO</strong></td><td>1 a 100</td><td>Su espíritu. Algunas lecciones lo gastan, y la magia también.</td></tr><tr><td><strong>SABLE</strong></td><td>hasta 80</td><td>Su destreza con la espada.</td></tr><tr><td><strong>MAGIA</strong></td><td>hasta 80</td><td>Su destreza con la magia.</td></tr><tr><td><strong>CLASE</strong></td><td>hasta 80</td><td>Su porte y sus buenos modales.</td></tr><tr><td><strong>MENTE</strong></td><td>hasta 80</td><td>Su inteligencia.</td></tr><tr><td><strong>ARTE</strong></td><td>hasta 80</td><td>Su talento artístico.</td></tr><tr><td><strong>GARBO</strong></td><td>hasta 80</td><td>Su atractivo.</td></tr></tbody></table>\n<p>Junto a cada número hay pequeñas marcas de Nikona. Cada marca vale unos 20 puntos, así ves de un vistazo cómo va una dote.</p>\n<h3>Extras</h3>\n<p>SABLE, MAGIA, CLASE, MENTE, ARTE y GARBO normalmente se detienen en 80. Encuentra el objeto extra de una dote y esa dote podrá llegar hasta 100. Consulta \"Objetos\".</p>\n<p>Estas seis dotes también pueden bajar hasta −27, así que no las pierdas de vista.</p>"}},{"id":"schedule-lessons","titulo":{"en":"The Schedule and the Lessons","es":"La agenda y las lecciones"},"html":{"en":"<p>Choose the Schedule icon to pick today's lesson. All three girls take the same lesson together, and it raises the stats that go with it.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/grade_treino.png\" data-shot=\"mkr2/manual/grade_treino.png\" alt=\"Picking a lesson\" loading=\"lazy\"></div><figcaption>Picking a lesson</figcaption></figure>\n<p>There are 8 choices on the lesson grid. Seven of them are the same everywhere. The eighth is a lesson you can only take in that area: <strong>Pray</strong> in the Town, <strong>Nature study</strong> in the Forest and <strong>Sing</strong> on the Mountain.</p>\n<p>Choose a lesson and the game asks you to confirm it. Answer with the D-Pad and press Button 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_combat.png\" data-shot=\"mkr2/manual/pergunta_combat.png\" alt=\"Confirming a lesson\" loading=\"lazy\"></div><figcaption>Confirming a lesson</figcaption></figure>\n<h3>The Lessons</h3>\n<table><thead><tr><th>Lesson</th><th>Where</th><th>What the girls do</th><th>Main stat</th></tr></thead><tbody><tr><td><strong>Combat</strong></td><td>anywhere</td><td>Practice with sword and bow</td><td>SWORD</td></tr><tr><td><strong>Magic</strong></td><td>anywhere</td><td>Practice magic</td><td>MAGIC</td></tr><tr><td><strong>Paint</strong></td><td>anywhere</td><td>Paint pictures of Mokona</td><td>ART</td></tr><tr><td><strong>Dance</strong></td><td>anywhere</td><td>Learn to dance</td><td>CHARM</td></tr><tr><td><strong>Study</strong></td><td>anywhere</td><td>Read books</td><td>MIND</td></tr><tr><td><strong>Pray</strong></td><td>Town only</td><td>Say their prayers</td><td>GRACE</td></tr><tr><td><strong>Nature study</strong></td><td>Forest only</td><td>Watch the life of the forest</td><td>MIND</td></tr><tr><td><strong>Sing</strong></td><td>Mountain only</td><td>Sing together</td><td>GRACE</td></tr><tr><td><strong>Adventure</strong></td><td>anywhere</td><td>Set out on an adventure. See \"Adventure.\"</td><td></td></tr><tr><td><strong>Nap</strong></td><td>anywhere</td><td>Sleep the day away</td><td>restores POWER and WILL</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_nature.png\" data-shot=\"mkr2/manual/pergunta_nature.png\" alt=\"Nature study, only in the Forest\" loading=\"lazy\"></div><figcaption>Nature study, only in the Forest</figcaption></figure>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_sing.png\" data-shot=\"mkr2/manual/pergunta_sing.png\" alt=\"Sing, only on the Mountain\" loading=\"lazy\"></div><figcaption>Sing, only on the Mountain</figcaption></figure>\n<h3>How a Lesson Works</h3>\n<ul>\n<li>Each lesson takes up one whole day.</li>\n<li>Combat, Magic, Paint, Dance, Study, Pray, Nature study and Sing each use up some POWER or WILL.</li>\n<li>Most lessons also lower one other stat a little.</li>\n<li>When the lesson is over, you get a report for each girl. It shows which stats went <strong>UP!</strong> and which went <strong>DOWN</strong>, and by how much.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/relatorio_treino.png\" data-shot=\"mkr2/manual/relatorio_treino.png\" alt=\"The lesson report\" loading=\"lazy\"></div><figcaption>The lesson report</figcaption></figure>\n<p>On the days of the big events at the castle, there are no lessons. See \"Dance Party, Tourney and Festival.\"</p>\n<p>The \"Lesson Chart\" lists what every lesson does.</p>","es":"<p>Elige el icono Agenda para escoger la lección del día. Las tres chicas toman juntas la misma lección, y esta sube las dotes que le corresponden.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/grade_treino.png\" data-shot=\"mkr2/manual/grade_treino.png\" alt=\"Cómo elegir una lección\" loading=\"lazy\"></div><figcaption>Cómo elegir una lección</figcaption></figure>\n<p>En la cuadrícula de lecciones hay 8 opciones. Siete son iguales en todas partes. La octava depende de la zona donde estés: <strong>Rezar</strong> en el pueblo, <strong>Naturaleza</strong> en el bosque y <strong>Cantar</strong> en el monte.</p>\n<p>Al elegir una lección, el juego te pide que la confirmes. Responde con el botón direccional y pulsa el Botón 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_combat.png\" data-shot=\"mkr2/manual/pergunta_combat.png\" alt=\"Confirmar una lección\" loading=\"lazy\"></div><figcaption>Confirmar una lección</figcaption></figure>\n<h3>Las lecciones</h3>\n<table><thead><tr><th>Lección</th><th>Dónde</th><th>Qué hacen las chicas</th><th>Dote principal</th></tr></thead><tbody><tr><td><strong>Combate</strong></td><td>en todas partes</td><td>Practican con espada y arco</td><td>SABLE</td></tr><tr><td><strong>Magia</strong></td><td>en todas partes</td><td>Practican magia</td><td>MAGIA</td></tr><tr><td><strong>Pintar</strong></td><td>en todas partes</td><td>Pintan cuadros de Nikona</td><td>ARTE</td></tr><tr><td><strong>Bailar</strong></td><td>en todas partes</td><td>Aprenden a bailar</td><td>GARBO</td></tr><tr><td><strong>Estudiar</strong></td><td>en todas partes</td><td>Leen libros</td><td>MENTE</td></tr><tr><td><strong>Rezar</strong></td><td>solo en el pueblo</td><td>Rezan sus oraciones</td><td>CLASE</td></tr><tr><td><strong>Naturaleza</strong></td><td>solo en el bosque</td><td>Observan la vida del bosque</td><td>MENTE</td></tr><tr><td><strong>Cantar</strong></td><td>solo en el monte</td><td>Cantan juntas</td><td>CLASE</td></tr><tr><td><strong>Aventura</strong></td><td>en todas partes</td><td>Salen de aventura. Consulta \"Aventura\".</td><td></td></tr><tr><td><strong>Dormir</strong></td><td>en todas partes</td><td>Duermen todo el día</td><td>recupera VIGOR y ÁNIMO</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_nature.png\" data-shot=\"mkr2/manual/pergunta_nature.png\" alt=\"Naturaleza, solo en el bosque\" loading=\"lazy\"></div><figcaption>Naturaleza, solo en el bosque</figcaption></figure>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pergunta_sing.png\" data-shot=\"mkr2/manual/pergunta_sing.png\" alt=\"Cantar, solo en el monte\" loading=\"lazy\"></div><figcaption>Cantar, solo en el monte</figcaption></figure>\n<h3>Cómo funciona una lección</h3>\n<ul>\n<li>Cada lección ocupa un día entero.</li>\n<li>Combate, Magia, Pintar, Bailar, Estudiar, Rezar, Naturaleza y Cantar gastan algo de VIGOR o ÁNIMO.</li>\n<li>La mayoría de las lecciones también baja un poco otra dote.</li>\n<li>Al terminar la lección, recibes un informe de cada chica. Muestra qué dotes subieron (<strong>▲</strong>) y cuáles bajaron (<strong>▼</strong>), y cuánto.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/relatorio_treino.png\" data-shot=\"mkr2/manual/relatorio_treino.png\" alt=\"El informe de la lección\" loading=\"lazy\"></div><figcaption>El informe de la lección</figcaption></figure>\n<p>En los días de los grandes eventos del castillo no hay lecciones. Consulta \"Baile, torneo y Festival\".</p>\n<p>La \"Tabla de lecciones\" muestra lo que hace cada lección.</p>"}},{"id":"lesson-chart","titulo":{"en":"Lesson Chart","es":"Tabla de lecciones"},"html":{"en":"<p>Each lesson raises a main stat, may raise a second stat, and may lower another. It also costs POWER or WILL.</p>\n<h3>What Each Lesson Changes</h3>\n<table><thead><tr><th>Lesson</th><th>Main stat</th><th>Second stat</th><th>Goes down</th><th>Costs</th></tr></thead><tbody><tr><td><strong>Combat</strong></td><td>SWORD</td><td></td><td>MIND</td><td>POWER</td></tr><tr><td><strong>Magic</strong></td><td>MAGIC</td><td>MIND</td><td></td><td>WILL</td></tr><tr><td><strong>Paint</strong></td><td>ART</td><td>GRACE</td><td>SWORD</td><td>WILL</td></tr><tr><td><strong>Dance</strong></td><td>CHARM</td><td>ART</td><td>GRACE</td><td>POWER</td></tr><tr><td><strong>Study</strong></td><td>MIND</td><td></td><td>ART</td><td>WILL</td></tr><tr><td><strong>Pray</strong> (Town)</td><td>GRACE</td><td>MAGIC</td><td></td><td>WILL</td></tr><tr><td><strong>Nature study</strong> (Forest)</td><td>MIND</td><td></td><td>MAGIC</td><td>POWER</td></tr><tr><td><strong>Sing</strong> (Mountain)</td><td>GRACE</td><td>ART</td><td></td><td>POWER</td></tr></tbody></table>\n<h3>How Much</h3>\n<table><thead><tr><th>Plan</th><th>Main stat</th><th>Second stat</th><th>Goes down</th><th>Cost</th></tr></thead><tbody><tr><td><strong>Normal</strong></td><td>+4 (favorite +8)</td><td>+2 (favorite +4)</td><td>−2</td><td>4</td></tr><tr><td><strong>Harsh</strong></td><td>+5 (favorite +9)</td><td>+3 (favorite +5)</td><td>−2</td><td>5</td></tr></tbody></table>\n<p>These are the numbers for a girl in a NORMAL mood. A PEPPY girl gains a little more, and a girl in a bad mood gains less, so the report may not match this chart exactly. On Soft, the girls gain less than on Normal.</p>\n<h3>Nap</h3>\n<p>On Normal and Harsh, a Nap restores <strong>16</strong> POWER and <strong>16</strong> WILL, and CHARM goes down by <strong>2</strong>.</p>","es":"<p>Cada lección sube una dote principal, puede subir una segunda dote y puede bajar otra. Además, cuesta VIGOR o ÁNIMO.</p>\n<h3>Qué cambia cada lección</h3>\n<table><thead><tr><th>Lección</th><th>Dote principal</th><th>Segunda dote</th><th>Baja</th><th>Cuesta</th></tr></thead><tbody><tr><td><strong>Combate</strong></td><td>SABLE</td><td></td><td>MENTE</td><td>VIGOR</td></tr><tr><td><strong>Magia</strong></td><td>MAGIA</td><td>MENTE</td><td></td><td>ÁNIMO</td></tr><tr><td><strong>Pintar</strong></td><td>ARTE</td><td>CLASE</td><td>SABLE</td><td>ÁNIMO</td></tr><tr><td><strong>Bailar</strong></td><td>GARBO</td><td>ARTE</td><td>CLASE</td><td>VIGOR</td></tr><tr><td><strong>Estudiar</strong></td><td>MENTE</td><td></td><td>ARTE</td><td>ÁNIMO</td></tr><tr><td><strong>Rezar</strong> (pueblo)</td><td>CLASE</td><td>MAGIA</td><td></td><td>ÁNIMO</td></tr><tr><td><strong>Naturaleza</strong> (bosque)</td><td>MENTE</td><td></td><td>MAGIA</td><td>VIGOR</td></tr><tr><td><strong>Cantar</strong> (monte)</td><td>CLASE</td><td>ARTE</td><td></td><td>VIGOR</td></tr></tbody></table>\n<h3>Cuánto</h3>\n<table><thead><tr><th>Plan</th><th>Dote principal</th><th>Segunda dote</th><th>Baja</th><th>Cuesta</th></tr></thead><tbody><tr><td><strong>media</strong></td><td>+4 (favorita +8)</td><td>+2 (favorita +4)</td><td>−2</td><td>4</td></tr><tr><td><strong>Dura</strong></td><td>+5 (favorita +9)</td><td>+3 (favorita +5)</td><td>−2</td><td>5</td></tr></tbody></table>\n<p>Estos números son para una chica de humor NORMAL. Una chica ALEGRE gana un poco más, y una de mal humor gana menos, así que el informe puede no coincidir exactamente con esta tabla. Con <strong>Suave</strong>, las chicas ganan menos que con <strong>media</strong>.</p>\n<h3>Dormir</h3>\n<p>Con <strong>media</strong> y con <strong>Dura</strong>, Dormir recupera <strong>16</strong> de VIGOR y <strong>16</strong> de ÁNIMO, y el GARBO baja <strong>2</strong>.</p>"}},{"id":"adventure","titulo":{"en":"Adventure","es":"Aventura"},"html":{"en":"<p>Choose <strong>Adventure</strong> as the day's lesson and the girls head out. On an adventure you can find items, meet people, face events and travel to another area. Some places even restore POWER and WILL.</p>\n<p>Finding the Plus 1 items out here is very important. See \"Items.\"</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/aventura_painel.png\" data-shot=\"mkr2/manual/aventura_painel.png\" alt=\"The adventure screen\" loading=\"lazy\"></div><figcaption>The adventure screen</figcaption></figure>\n<h3>The Adventure Screen</h3>\n<p>The top of the screen shows where you are: <strong>TOWN</strong>, <strong>SPIRIT FOREST</strong> or <strong>MOUNTAIN</strong>. Below that are one girl's stats, in short form:</p>\n<table><thead><tr><th>On screen</th><th>Stat</th></tr></thead><tbody><tr><td>POWER</td><td>POWER</td></tr><tr><td>WILL</td><td>WILL</td></tr><tr><td>SWD</td><td>SWORD</td></tr><tr><td>MAG</td><td>MAGIC</td></tr><tr><td>ART</td><td>ART</td></tr><tr><td>GRA</td><td>GRACE</td></tr><tr><td>CHM</td><td>CHARM</td></tr><tr><td>MND</td><td>MIND</td></tr></tbody></table>\n<p>Only one girl is shown at a time. Press START to switch to the next girl.</p>\n<h3>Choosing the Way</h3>\n<p>Now and then the road splits in two. When you see <strong>Where to?</strong>, choose <strong>Left</strong> or <strong>Right</strong> with the D-Pad and press Button 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/bifurcacao.png\" data-shot=\"mkr2/manual/bifurcacao.png\" alt=\"A fork in the road\" loading=\"lazy\"></div><figcaption>A fork in the road</figcaption></figure>\n<p>Keep going and you reach the training screen of the area you are in.</p>\n<p>At some points a travel menu opens instead, with two choices: <strong>Go on</strong> to keep going, or another area (<strong>Town</strong> or <strong>Forest</strong>). Later in the game the second choice becomes <strong>Elsewhere</strong>, which lets you pick where to go next: <strong>Town</strong>, <strong>Forest</strong> or <strong>Mountain</strong>.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_viagem.png\" data-shot=\"mkr2/manual/menu_viagem.png\" alt=\"The travel menu\" loading=\"lazy\"></div><figcaption>The travel menu</figcaption></figure>\n<p>When you start, only the Town is open. The Forest and the Mountain open up later on. Clef will let you know.</p>\n<h3>Clearing Events</h3>\n<p>Many things on an adventure test the girls. To pass one, you need the right item or a girl with a high enough stat. Usually that means 50 to 60 or more. Clear these events and find the Plus 1 items the girls will need to become Magic Knights.</p>","es":"<p>Elige <strong>Aventura</strong> como lección del día y las chicas se ponen en camino. En una aventura puedes encontrar objetos, conocer gente, enfrentar eventos y viajar a otra zona. Algunos lugares incluso recuperan VIGOR y ÁNIMO.</p>\n<p>Encontrar los extras allá afuera es muy importante. Consulta \"Objetos\".</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/aventura_painel.png\" data-shot=\"mkr2/manual/aventura_painel.png\" alt=\"La pantalla de aventura\" loading=\"lazy\"></div><figcaption>La pantalla de aventura</figcaption></figure>\n<h3>La pantalla de aventura</h3>\n<p>En la parte de arriba se ve dónde estás: <strong>PUEBLO</strong>, <strong>BOSQUE DE ESPÍRITUS</strong> o <strong>MONTE</strong>. Debajo aparecen las dotes de una chica, en forma abreviada:</p>\n<table><thead><tr><th>En pantalla</th><th>Dote</th></tr></thead><tbody><tr><td>VIGOR</td><td>VIGOR</td></tr><tr><td>ÁNIMO</td><td>ÁNIMO</td></tr><tr><td>SAB</td><td>SABLE</td></tr><tr><td>MAG</td><td>MAGIA</td></tr><tr><td>ART</td><td>ARTE</td></tr><tr><td>CLA</td><td>CLASE</td></tr><tr><td>GAR</td><td>GARBO</td></tr><tr><td>MEN</td><td>MENTE</td></tr></tbody></table>\n<p>Solo se muestra una chica a la vez. Pulsa START para pasar a la siguiente.</p>\n<h3>Elegir el camino</h3>\n<p>De vez en cuando el camino se divide en dos. Cuando veas <strong>¿A dónde?</strong>, elige <strong>Izqda</strong> o <strong>Dcha</strong> con el botón direccional y pulsa el Botón 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/bifurcacao.png\" data-shot=\"mkr2/manual/bifurcacao.png\" alt=\"Un cruce de caminos\" loading=\"lazy\"></div><figcaption>Un cruce de caminos</figcaption></figure>\n<p>Si sigues el camino hasta el final, llegas a la pantalla de entrenamiento de la zona donde estás.</p>\n<p>En otros puntos aparece un menú de viaje con dos opciones: <strong>Seguir</strong>, para continuar, o ir a otra zona (<strong>Pueblo</strong> o <strong>Bosque</strong>). Más adelante, la segunda opción pasa a ser <strong>Ir a otro sitio</strong>, que te deja elegir adónde ir: <strong>Pueblo</strong>, <strong>Bosque</strong> o <strong>Monte</strong>.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/menu_viagem.png\" data-shot=\"mkr2/manual/menu_viagem.png\" alt=\"El menú de viaje\" loading=\"lazy\"></div><figcaption>El menú de viaje</figcaption></figure>\n<p>Al principio solo está abierto el pueblo. El bosque y el monte se abren más adelante. Clef te avisará.</p>\n<h3>Superar eventos</h3>\n<p>En una aventura, muchas cosas ponen a prueba a las chicas. Para superar una, necesitas el objeto correcto o una chica con una dote lo bastante alta. Por lo general, eso significa de 50 a 60 o más. Supera estos eventos y encuentra los extras que las chicas necesitarán para convertirse en guerreras.</p>"}},{"id":"battle","titulo":{"en":"Battle","es":"Peleas"},"html":{"en":"<p>Sometimes an enemy blocks the road. That means a battle!</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_aparece.png\" data-shot=\"mkr2/manual/batalha_aparece.png\" alt=\"An enemy appears\" loading=\"lazy\"></div><figcaption>An enemy appears</figcaption></figure>\n<h3>Who Will Fight?</h3>\n<p>Only one girl fights. When <strong>Who will fight?</strong> appears, pick the girl you want to send and press Button 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_quem.png\" data-shot=\"mkr2/manual/batalha_quem.png\" alt=\"Choosing a fighter\" loading=\"lazy\"></div><figcaption>Choosing a fighter</figcaption></figure>\n<h3>The Fight</h3>\n<p>The battle plays out on its own. The girl and the enemy take turns attacking, and a message shows each attack, spell and hit.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_ataque.png\" data-shot=\"mkr2/manual/batalha_ataque.png\" alt=\"The girl attacks\" loading=\"lazy\"></div><figcaption>The girl attacks</figcaption></figure>\n<ul>\n<li>The fighters use both attacks and magic. Magic uses WILL. When a girl runs out of WILL, you will see <strong>Low on Will!</strong></li>\n<li>Sometimes an attack misses and the target dodges.</li>\n<li>Whoever runs out of POWER first loses.</li>\n</ul>\n<h3>Win or Lose</h3>\n<ul>\n<li><strong>Win,</strong> and the adventure goes on.</li>\n<li><strong>Lose,</strong> and you go back to the training screen. The girl who lost is <strong>HURT</strong> and does nothing for the rest of that day. She is healed and back to normal the next day.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/humor_hurt.png\" data-shot=\"mkr2/manual/humor_hurt.png\" alt=\"A HURT girl\" loading=\"lazy\"></div><figcaption>A HURT girl</figcaption></figure>","es":"<p>A veces un enemigo bloquea el camino y hay que pelear.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_aparece.png\" data-shot=\"mkr2/manual/batalha_aparece.png\" alt=\"Aparece un enemigo\" loading=\"lazy\"></div><figcaption>Aparece un enemigo</figcaption></figure>\n<h3>¿Quién pelea?</h3>\n<p>Solo pelea una chica. Cuando aparezca <strong>¿Quién pelea?</strong>, elige a la chica que quieres mandar y pulsa el Botón 2.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_quem.png\" data-shot=\"mkr2/manual/batalha_quem.png\" alt=\"Elegir quién pelea\" loading=\"lazy\"></div><figcaption>Elegir quién pelea</figcaption></figure>\n<h3>La pelea</h3>\n<p>La pelea se desarrolla sola. La chica y el enemigo se turnan para atacar, y un mensaje muestra cada ataque, cada hechizo y cada golpe.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/batalha_ataque.png\" data-shot=\"mkr2/manual/batalha_ataque.png\" alt=\"La chica ataca\" loading=\"lazy\"></div><figcaption>La chica ataca</figcaption></figure>\n<ul>\n<li>Los dos usan ataques y magia. La magia gasta ÁNIMO. Cuando una chica se queda sin ÁNIMO, verás <strong>¡Sin ánimo!</strong></li>\n<li>A veces un ataque falla y el blanco lo esquiva.</li>\n<li>Pierde quien se quede primero sin VIGOR.</li>\n</ul>\n<h3>Ganar o perder</h3>\n<ul>\n<li><strong>Si gana,</strong> la aventura continúa.</li>\n<li><strong>Si pierde,</strong> vuelves a la pantalla de entrenamiento. La chica que perdió queda <strong>HERIDA</strong> y no hace nada el resto de ese día. Al día siguiente ya está curada y de vuelta a la normalidad.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/humor_hurt.png\" data-shot=\"mkr2/manual/humor_hurt.png\" alt=\"Una chica HERIDA\" loading=\"lazy\"></div><figcaption>Una chica HERIDA</figcaption></figure>"}},{"id":"people-chests","titulo":{"en":"People in Trouble and Treasure Chests","es":"Gente en apuros y cofres del tesoro"},"html":{"en":"<h3>Treasure Chests</h3>\n<p>There are treasure chests all over Cefiro. When a girl finds one, it opens by itself and she takes the item inside. To see what you have, choose the Items icon on the training screen.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/bau_magic_saber.png\" data-shot=\"mkr2/manual/bau_magic_saber.png\" alt=\"A treasure chest\" loading=\"lazy\"></div><figcaption>A treasure chest</figcaption></figure>\n<h3>People in Trouble</h3>\n<p>On your adventures you will meet people with problems. Someone may have lost something, or be looking for something. Most of the time, you can help by giving them the right item.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pedido_ajuda.png\" data-shot=\"mkr2/manual/pedido_ajuda.png\" alt=\"Someone needs help\" loading=\"lazy\"></div><figcaption>Someone needs help</figcaption></figure>\n<p>Help someone and a place you could not reach before may open up.</p>","es":"<h3>Cofres del tesoro</h3>\n<p>Hay cofres del tesoro por todo Céfiro. Cuando una chica encuentra uno, se abre solo y ella toma el objeto que hay dentro. Para ver lo que tienes, elige el icono Objetos en la pantalla de entrenamiento.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/bau_magic_saber.png\" data-shot=\"mkr2/manual/bau_magic_saber.png\" alt=\"Un cofre del tesoro\" loading=\"lazy\"></div><figcaption>Un cofre del tesoro</figcaption></figure>\n<h3>Gente en apuros</h3>\n<p>En tus aventuras conocerás gente con problemas. Alguien puede haber perdido algo, o andar buscando algo. Casi siempre puedes ayudar dándole el objeto correcto.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/pedido_ajuda.png\" data-shot=\"mkr2/manual/pedido_ajuda.png\" alt=\"Alguien necesita ayuda\" loading=\"lazy\"></div><figcaption>Alguien necesita ayuda</figcaption></figure>\n<p>Si ayudas a alguien, puede abrirse un lugar al que antes no podías llegar.</p>"}},{"id":"events","titulo":{"en":"Events","es":"Eventos"},"html":{"en":"<p>Events can change the girls' stats a lot, and sometimes they bring an item. There are two kinds.</p>\n<h3>Scheduled Events</h3>\n<p>These happen on a certain day or in a certain place. Most of the time someone asks a question. Choose your answer with the D-Pad and press Button 2. Give a good answer and the girls' stats go up, or you get an item.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/evento_pergunta.png\" data-shot=\"mkr2/manual/evento_pergunta.png\" alt=\"An event question\" loading=\"lazy\"></div><figcaption>An event question</figcaption></figure>\n<h3>Surprise Events</h3>\n<p>These can happen at any time, without warning. Answer badly and the girls' stats may drop.</p>\n<p>Some days bring strange weather to the Forest or the Mountain, and it affects all three girls. Visitors may also drop by with questions of their own. Think before you answer!</p>","es":"<p>Los eventos pueden cambiar mucho las dotes de las chicas, y a veces traen un objeto. Hay dos tipos.</p>\n<h3>Eventos fijos</h3>\n<p>Ocurren en cierto día o en cierto lugar. Casi siempre alguien hace una pregunta. Elige tu respuesta con el botón direccional y pulsa el Botón 2. Da una buena respuesta y las dotes de las chicas suben, o recibes un objeto.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/evento_pergunta.png\" data-shot=\"mkr2/manual/evento_pergunta.png\" alt=\"Una pregunta de evento\" loading=\"lazy\"></div><figcaption>Una pregunta de evento</figcaption></figure>\n<h3>Eventos sorpresa</h3>\n<p>Pueden ocurrir en cualquier momento, sin aviso. Si respondes mal, las dotes de las chicas pueden bajar.</p>\n<p>Algunos días llega un clima extraño al bosque o al monte, y afecta a las tres chicas. También pueden pasar visitantes con sus propias preguntas. ¡Piensa antes de responder!</p>"}},{"id":"castle-events","titulo":{"en":"Dance Party, Tourney and Festival","es":"Baile, torneo y Festival"},"html":{"en":"<p>Three times during the 50 days, the castle holds a big event: the dance party on <strong>DAY 15</strong>, the fighting tourney on <strong>DAY 33</strong> and the Festival on <strong>DAY 44</strong>. There are no lessons on these days.</p>\n<h3>The Dance Party</h3>\n<p>All three girls want to go, but only one may. The choice is made with a roulette.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/roleta.png\" data-shot=\"mkr2/manual/roleta.png\" alt=\"The roulette\" loading=\"lazy\"></div><figcaption>The roulette</figcaption></figure>\n<ol>\n<li>The roulette spins with <strong>WHO GOES / TODAY?</strong> on the screen.</li>\n<li>Press Button 2 to stop it. The girl closest to the marker goes to the party.</li>\n<li>If it stops on Mokona, you see <strong>AGAIN!</strong> and spin once more.</li>\n</ol>\n<p>Next, choose what she will wear. Use the D-Pad to pick a headpiece (<strong>Ribbon</strong>, <strong>Hat</strong> or <strong>Tiara</strong>) and an outfit (<strong>Dress</strong>, <strong>Chinese dress</strong> or <strong>Kimono</strong>). She wears your choice to the party.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/traje.png\" data-shot=\"mkr2/manual/traje.png\" alt=\"Choosing an outfit\" loading=\"lazy\"></div><figcaption>Choosing an outfit</figcaption></figure>\n<p>If she dances well, all of her stats go up. How well she dances depends mostly on her <strong>CHARM</strong>.</p>\n<h3>The Tourney</h3>\n<p>The roulette picks one girl to fight. She takes on three opponents, one after another. Each match plays out on its own, from <strong>Ready</strong> to <strong>Match over!!</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ready.png\" data-shot=\"mkr2/manual/ready.png\" alt=\"A tourney match begins\" loading=\"lazy\"></div><figcaption>A tourney match begins</figcaption></figure>\n<p>Win the whole tourney, and every stat except POWER and WILL goes up by 10. Her strength here depends mostly on her <strong>SWORD</strong> and <strong>MAGIC</strong>.</p>\n<h3>The Festival</h3>\n<p>On Festival day, the castle holds a dance party AND a tourney. The roulette picks a girl for each one, so two different girls may take part. Try to win both!</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/festa.png\" data-shot=\"mkr2/manual/festa.png\" alt=\"Festival day\" loading=\"lazy\"></div><figcaption>Festival day</figcaption></figure>","es":"<p>Tres veces durante los 50 días, el castillo celebra un gran evento: el baile el <strong>DÍA 15</strong>, el torneo de lucha el <strong>DÍA 33</strong> y el Festival el <strong>DÍA 44</strong>. Esos días no hay lecciones.</p>\n<h3>El baile</h3>\n<p>Las tres chicas quieren ir, pero solo puede ir una. La elección se hace con una ruleta.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/roleta.png\" data-shot=\"mkr2/manual/roleta.png\" alt=\"La ruleta\" loading=\"lazy\"></div><figcaption>La ruleta</figcaption></figure>\n<ol>\n<li>La ruleta empieza a girar.</li>\n<li>Pulsa el Botón 2 para detenerla. Va al baile la chica que quede más cerca de la marca.</li>\n<li>Si se detiene en Nikona, la ruleta vuelve a girar.</li>\n</ol>\n<p>Después, elige qué se pondrá. Con el botón direccional, elige un adorno para la cabeza (<strong>Lazo</strong>, <strong>Gorro</strong> o <strong>Tiara</strong>) y un atuendo (<strong>Vestido</strong>, <strong>Chino</strong>, que es un vestido chino, o <strong>Kimono</strong>). Irá al baile con lo que elegiste.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/traje.png\" data-shot=\"mkr2/manual/traje.png\" alt=\"Elegir el atuendo\" loading=\"lazy\"></div><figcaption>Elegir el atuendo</figcaption></figure>\n<p>Si baila bien, todas sus dotes suben. Qué tan bien baila depende sobre todo de su <strong>GARBO</strong>.</p>\n<h3>El torneo</h3>\n<p>La ruleta elige a una chica para pelear. Ella enfrenta a tres rivales, uno tras otro. Cada combate se desarrolla solo, desde <strong>Listo</strong> hasta <strong>¡Se acabó!</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/ready.png\" data-shot=\"mkr2/manual/ready.png\" alt=\"Empieza un combate del torneo\" loading=\"lazy\"></div><figcaption>Empieza un combate del torneo</figcaption></figure>\n<p>Si gana todo el torneo, todas sus dotes, menos VIGOR y ÁNIMO, suben 10. Aquí su fuerza depende sobre todo de su <strong>SABLE</strong> y su <strong>MAGIA</strong>.</p>\n<h3>El Festival</h3>\n<p>El día del Festival, el castillo celebra un baile y también un torneo. La ruleta elige a una chica para cada uno, así que pueden participar dos chicas distintas. ¡Intenta ganar los dos!</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/festa.png\" data-shot=\"mkr2/manual/festa.png\" alt=\"Día de Festival\" loading=\"lazy\"></div><figcaption>Día de Festival</figcaption></figure>"}},{"id":"items","titulo":{"en":"Items","es":"Objetos"},"html":{"en":"<p>Choose the Items icon to see everything you have. Items come mostly from adventures and events. Each one helps with the stat it goes with.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/itens_cheia.png\" data-shot=\"mkr2/manual/itens_cheia.png\" alt=\"The items screen\" loading=\"lazy\"></div><figcaption>The items screen</figcaption></figure>\n<p>You never have to use an item yourself. When the right moment comes, the item does its job on its own.</p>\n<h3>Plus 1 Items</h3>\n<p>A Plus 1 item raises the limit of one stat from 80 to 100. They are mostly found on adventures, and sometimes given at events. The girls will need them to become Magic Knights.</p>\n<table><thead><tr><th>Item</th><th>Stat</th><th>Item text</th></tr></thead><tbody><tr><td><strong>Escudo</strong></td><td>SWORD</td><td>Combat UP</td></tr><tr><td><strong>Magic Band</strong></td><td>MAGIC</td><td>Magic UP</td></tr><tr><td><strong>Holy Orb</strong></td><td>GRACE</td><td>Pray UP</td></tr><tr><td><strong>Sage Book</strong></td><td>MIND</td><td>Study UP</td></tr><tr><td><strong>Beauty Statue</strong></td><td>ART</td><td>Art UP</td></tr><tr><td><strong>Allure Gown</strong></td><td>CHARM</td><td>Charm UP</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/descr_plus1.png\" data-shot=\"mkr2/manual/descr_plus1.png\" alt=\"A Plus 1 item\" loading=\"lazy\"></div><figcaption>A Plus 1 item</figcaption></figure>\n<h3>Support Items</h3>\n<p>A support item helps a girl through an adventure event that her stat alone could not clear. It gives the matching stat a boost for that event, then it is used up. Some places will also take a support item in exchange for restoring POWER and WILL.</p>\n<table><thead><tr><th>Item</th><th>Stat</th><th>Helps with</th><th>Item text</th></tr></thead><tbody><tr><td><strong>Magic Saber</strong></td><td>SWORD</td><td>battles</td><td>Sword aid</td></tr><tr><td><strong>Magic Book</strong></td><td>MAGIC</td><td>magic</td><td>Magic aid</td></tr><tr><td><strong>Magic Scarf</strong></td><td>GRACE</td><td>tests of grace</td><td>Grace aid</td></tr><tr><td><strong>Magic Compass</strong></td><td>MIND</td><td>tests of brains</td><td>Mind aid</td></tr><tr><td><strong>Magic Brush</strong></td><td>ART</td><td>painting</td><td>Art aid</td></tr><tr><td><strong>Magic Lips</strong></td><td>CHARM</td><td>tests of charm</td><td>Charm aid</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/descr_apoio.png\" data-shot=\"mkr2/manual/descr_apoio.png\" alt=\"A support item\" loading=\"lazy\"></div><figcaption>A support item</figcaption></figure>\n<h3>Event Items</h3>\n<p>Some events can't be cleared without the right item. Bring it along and a new path opens up, or you get something in return.</p>\n<table><thead><tr><th>Item</th><th>Item text</th></tr></thead><tbody><tr><td><strong>Gate Key</strong></td><td>Opens a gate.</td></tr><tr><td><strong>Spellbook</strong></td><td>Someone seeks it.</td></tr><tr><td><strong>Specs</strong></td><td>Someone seeks it.</td></tr><tr><td><strong>Jar</strong></td><td>Holds liquids.</td></tr><tr><td><strong>Jar of oil</strong></td><td>Holds oil.</td></tr><tr><td><strong>Jar of water</strong></td><td>Holds water.</td></tr><tr><td><strong>Herb</strong></td><td>Cures illness.</td></tr><tr><td><strong>Songs</strong></td><td>Full of songs.</td></tr><tr><td><strong>Paints</strong></td><td>Paint the Mountain.</td></tr><tr><td><strong>Scenery</strong></td><td>Great art! / Not very good.</td></tr><tr><td><strong>Potion</strong></td><td>Walk on air.</td></tr></tbody></table>","es":"<p>Elige el icono Objetos para ver todo lo que tienes. Los objetos vienen sobre todo de las aventuras y los eventos. Cada uno ayuda con la dote que le corresponde.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/itens_cheia.png\" data-shot=\"mkr2/manual/itens_cheia.png\" alt=\"La pantalla de objetos\" loading=\"lazy\"></div><figcaption>La pantalla de objetos</figcaption></figure>\n<p>Nunca tienes que usar un objeto por tu cuenta. Cuando llega el momento justo, el objeto hace su trabajo solo.</p>\n<h3>Extras</h3>\n<p>Un extra sube el límite de una dote de 80 a 100. Casi todos se encuentran en las aventuras, y a veces se reciben en los eventos. Las chicas los necesitarán para convertirse en guerreras.</p>\n<table><thead><tr><th>Objeto</th><th>Dote</th><th>Texto del objeto</th></tr></thead><tbody><tr><td><strong>Escudo</strong></td><td>SABLE</td><td>Combate +</td></tr><tr><td><strong>Pulsera mágica</strong></td><td>MAGIA</td><td>Magia +</td></tr><tr><td><strong>Orbe sagrado</strong></td><td>CLASE</td><td>Rezo+</td></tr><tr><td><strong>Libro del sabio</strong></td><td>MENTE</td><td>Estudio ▲</td></tr><tr><td><strong>Estatua bella</strong></td><td>ARTE</td><td>Sube arte</td></tr><tr><td><strong>Vestido seductor</strong></td><td>GARBO</td><td>Garbo ▲</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/descr_plus1.png\" data-shot=\"mkr2/manual/descr_plus1.png\" alt=\"Un extra\" loading=\"lazy\"></div><figcaption>Un extra</figcaption></figure>\n<h3>Objetos de apoyo</h3>\n<p>Un objeto de apoyo ayuda a una chica en un evento de aventura que su dote sola no podría superar. Le da un empujón a la dote correspondiente durante ese evento, y luego se gasta. Algunos lugares también aceptan un objeto de apoyo a cambio de recuperar VIGOR y ÁNIMO.</p>\n<table><thead><tr><th>Objeto</th><th>Dote</th><th>Sirve para</th><th>Texto del objeto</th></tr></thead><tbody><tr><td><strong>Sable mágico</strong></td><td>SABLE</td><td>peleas</td><td>Ayuda de sable</td></tr><tr><td><strong>Libro mágico</strong></td><td>MAGIA</td><td>magia</td><td>Sube magia</td></tr><tr><td><strong>Bufanda mágica</strong></td><td>CLASE</td><td>pruebas de clase</td><td>Sube clase</td></tr><tr><td><strong>Brújula mágica</strong></td><td>MENTE</td><td>pruebas de ingenio</td><td>Sube mente</td></tr><tr><td><strong>Pincel mágico</strong></td><td>ARTE</td><td>pintura</td><td>Ayuda de arte</td></tr><tr><td><strong>Labial mágico</strong></td><td>GARBO</td><td>pruebas de garbo</td><td>Sube garbo</td></tr></tbody></table>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/descr_apoio.png\" data-shot=\"mkr2/manual/descr_apoio.png\" alt=\"Un objeto de apoyo\" loading=\"lazy\"></div><figcaption>Un objeto de apoyo</figcaption></figure>\n<h3>Objetos de evento</h3>\n<p>Algunos eventos no se pueden superar sin el objeto correcto. Llévalo y se abre un camino nuevo, o recibes algo a cambio.</p>\n<table><thead><tr><th>Objeto</th><th>Texto del objeto</th></tr></thead><tbody><tr><td><strong>Llave</strong></td><td>Abre puertas</td></tr><tr><td><strong>Grimorio</strong></td><td>Alguien lo busca</td></tr><tr><td><strong>Gafas</strong></td><td>Alguien lo busca</td></tr><tr><td><strong>Vasija</strong></td><td>Lleva líquidos</td></tr><tr><td><strong>Vasija de aceite</strong></td><td>Contiene aceite</td></tr><tr><td><strong>Vasija de agua</strong></td><td>Contiene agua</td></tr><tr><td><strong>Hierba</strong></td><td>Cura el mal.</td></tr><tr><td><strong>Cancionero</strong></td><td>Tiene canciones</td></tr><tr><td><strong>Paleta</strong></td><td>Pinta en el monte</td></tr><tr><td><strong>Paisaje</strong></td><td>¡Gran obra!</td></tr><tr><td><strong>El paisaje</strong></td><td>no es gran cosa.</td></tr><tr><td><strong>Poción</strong></td><td>Anda por el aire</td></tr></tbody></table>"}},{"id":"saving","titulo":{"en":"Saving Your Game","es":"Guardar la partida"},"html":{"en":"<p>There are two places to save your game: <strong>Save 1</strong> and <strong>Save 2</strong>.</p>\n<ol>\n<li>On the training screen, choose the Save icon.</li>\n<li><strong>Save game?</strong> appears. Choose <strong>Yes</strong>.</li>\n<li><strong>Which one?</strong> appears. Press the D-Pad left or right to pick <strong>Save 1</strong> or <strong>Save 2</strong>, then press Button 2.</li>\n<li>When you see <strong>Saved</strong>, your game is safe.</li>\n</ol>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/salvar.png\" data-shot=\"mkr2/manual/salvar.png\" alt=\"Saving your game\" loading=\"lazy\"></div><figcaption>Saving your game</figcaption></figure>\n<p>If you choose <strong>No</strong>, the game tells you <strong>Not saved</strong> and nothing is recorded.</p>\n<p>To play a saved game, choose <strong>CONTINUE</strong> on the title screen, then pick <strong>SAVE 1</strong> or <strong>SAVE 2</strong>. You start again on the day you saved. See \"Getting Started.\"</p>","es":"<p>Hay dos espacios para guardar la partida: <strong>Dato1</strong> y <strong>Dato2</strong> (en la pantalla de título aparecen como <strong>DATO 1</strong> y <strong>DATO 2</strong>).</p>\n<ol>\n<li>En la pantalla de entrenamiento, elige el icono Guardar.</li>\n<li>Aparece <strong>¿Guardar?</strong>. Elige <strong>Sí</strong>.</li>\n<li>Aparece <strong>¿Cuál?</strong>. Pulsa el botón direccional a la izquierda o a la derecha para elegir <strong>Dato1</strong> o <strong>Dato2</strong> y luego pulsa el Botón 2.</li>\n<li>Cuando veas <strong>guardado</strong>, tu partida está a salvo.</li>\n</ol>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/salvar.png\" data-shot=\"mkr2/manual/salvar.png\" alt=\"Guardar la partida\" loading=\"lazy\"></div><figcaption>Guardar la partida</figcaption></figure>\n<p>Si eliges <strong>No</strong>, el juego te dice <strong>Sin guardar</strong> y no se graba nada.</p>\n<p>Para jugar una partida guardada, elige <strong>CONTINUAR</strong> en la pantalla de título y luego <strong>DATO 1</strong> o <strong>DATO 2</strong>. Vuelves a empezar en el día en que guardaste. Consulta \"Cómo empezar\".</p>"}},{"id":"day-50","titulo":{"en":"Day 50: Endings","es":"Día 50: los finales"},"html":{"en":"<p>When the 50 days are up, the training is over.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/dia50.png\" data-shot=\"mkr2/manual/dia50.png\" alt=\"The 50 days are over\" loading=\"lazy\"></div><figcaption>The 50 days are over</figcaption></figure>\n<p>Now you find out what became of Hikaru, Umi and Fuu. Each girl's future depends on how you raised her, and each one has several different futures waiting for her. Some girls become Magic Knights. Some find a path of their own.</p>\n<p>After that, the credits roll.</p>\n<p>Try playing again and raising the girls a different way. You may be surprised by what happens!</p>","es":"<p>Cuando se cumplen los 50 días, el entrenamiento termina.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/dia50.png\" data-shot=\"mkr2/manual/dia50.png\" alt=\"Pasaron los 50 días\" loading=\"lazy\"></div><figcaption>Pasaron los 50 días</figcaption></figure>\n<p>Ahora descubrirás qué fue de Lucy, Marina y Anaís. Lo que será de cada chica depende de cómo la entrenaste, y a cada una le esperan varios destinos distintos. Algunas se ganan el título de Guerrera Mágica, y otras terminan en algo muy distinto.</p>\n<p>Después, aparecen los créditos.</p>\n<p>Si vuelves a jugar y entrenas a las chicas de otra manera, puedes descubrir otros finales. ¡Quizá te sorprenda lo que pasa!</p>"}},{"id":"hints","titulo":{"en":"Hints","es":"Consejos"},"html":{"en":"<ul>\n<li><strong>Aim high.</strong> To become Magic Knights, the girls need high stats in everything. Try for 80 or more in every stat.</li>\n<li><strong>Get out there.</strong> Go on adventures, clear events and collect the Plus 1 items. Without them, most stats stop at 80.</li>\n<li><strong>Watch WILL.</strong> Low WILL is behind most bad moods. When POWER and WILL run low, a Nap brings them back.</li>\n<li><strong>Harsh has a price.</strong> Harsh training gives bigger gains, but it drains POWER and WILL faster.</li>\n<li><strong>Keep it balanced.</strong> Train all three girls. If one falls behind, make her your favorite until she catches up.</li>\n<li><strong>Play it again.</strong> Becoming a Magic Knight is not the only future. Play more than once and see what else the girls can become.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/dica_final.png\" data-shot=\"mkr2/manual/dica_final.png\" alt=\"Good luck, Guru!\" loading=\"lazy\"></div><figcaption>Good luck, Guru!</figcaption></figure>","es":"<ul>\n<li><strong>Ponte metas altas.</strong> Para ser Guerrera Mágica, una chica necesita dotes altas en todo. Intenta llegar a 80 o más en cada dote.</li>\n<li><strong>Sal al mundo.</strong> Ve de aventura, supera eventos y reúne los extras. Sin ellos, casi todas las dotes se detienen en 80.</li>\n<li><strong>Cuida el ÁNIMO.</strong> El ÁNIMO bajo está detrás de casi todos los malos humores. Cuando el VIGOR y el ÁNIMO andan bajos, Dormir los recupera.</li>\n<li><strong>Dura tiene su precio.</strong> El plan Dura da más ganancia, pero gasta VIGOR y ÁNIMO más rápido.</li>\n<li><strong>Mantén el equ
