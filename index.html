<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Patch Clan — a rom hacking workshop. English patches for Famicom and Super Famicom games that never left Japan.">
<meta name="color-scheme" content="light dark">
<title>Patch Clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* o plastico do Famicom de 1983: creme, bordo e dourado */
  --ground:#e3dbc8; --ground-2:#eee8d9; --ground-3:#f5f1e6;
  --ink:#191412; --ink-2:#544a3e;          /* escurecido: 7.1:1 sobre o creme */
  --rule:#c5bca5; --rule-soft:#d5ccb8;
  --accent:#96251a;                         /* vermelho Famicom, 6.4:1 sobre o creme */
  --accent-2:#701a12; --gold:#7d5f0d; --chip:#d5cbb4; --flag:#96251a;
  --crt:#0b0b10;
  --sobre-accent:#fff;          /* tinta sobre o vermelho */
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pixel:"Press Start 2P","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
    --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
    --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
  }
}
:root[data-theme="dark"]{
  --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
  --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
  --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.025em;text-wrap:balance;margin:0}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
code{font-family:var(--mono);font-size:.88em;background:var(--chip);padding:1px 5px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--sobre-accent);padding:12px 20px;
  font-family:var(--mono);font-size:13px;z-index:99;text-decoration:none}
.skip:focus{left:0}

/* escala tipografica */
h1{font-weight:800;font-size:clamp(34px,4.7vw,54px);line-height:1.04}
h2{font-weight:800;font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 16px}
h3{font-weight:700;font-size:clamp(21px,2.4vw,26px);line-height:1.2;margin:0 0 10px}
h4{font-weight:700;font-size:16px;margin:0 0 10px}
.meta{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}

.faixa{height:7px;background:linear-gradient(90deg,var(--accent-2) 0 62%,var(--gold) 62% 100%)}
.page{max-width:1120px;margin:0 auto;padding:0 28px 96px}
.col{max-width:34em}

/* ---- masthead ---- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.marca-txt{display:flex;flex-direction:column;gap:3px}
.wordmark{font-family:var(--sans);font-weight:800;font-size:21px;letter-spacing:-.035em;
  text-transform:uppercase;line-height:1}
.selo-marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-2);line-height:1}
.mhright{display:flex;align-items:center;gap:26px}
.masthead nav{display:flex;gap:24px;font-family:var(--mono);font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.masthead nav a{color:var(--ink-2);text-decoration:none;padding:4px 0;
  border-bottom:2px solid transparent}
.masthead nav a:hover{color:var(--ink)}
.masthead nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.masthead nav a.apoie{color:var(--sobre-accent);background:var(--accent);border:0;padding:7px 14px;border-radius:3px}
.masthead nav a.apoie:hover{background:var(--accent-2);color:#fff}
.masthead nav a.apoie[aria-current="page"]{background:var(--accent-2);color:#fff}
.langsw{position:relative;font-family:var(--mono);font-size:12px}
.langsw summary{list-style:none;cursor:pointer;color:var(--ink-2);padding:6px 9px;
  border:1px solid var(--rule);border-radius:3px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.langsw summary::-webkit-details-marker{display:none}
.langsw summary:hover{color:var(--ink);border-color:var(--ink-2)}
.langsw ul{position:absolute;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:5px;
  list-style:none;background:var(--ground-2);border:1px solid var(--rule);border-radius:4px;
  min-width:148px;box-shadow:0 10px 26px rgba(25,20,18,.18)}
.langsw li button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;
  color:var(--ink);cursor:pointer;padding:9px 11px;border-radius:2px;font-family:var(--mono);
  font-size:12.5px;text-align:left;letter-spacing:.03em}
.langsw li button:hover{background:var(--chip)}
.langsw li button[aria-current="true"]{color:var(--accent);font-weight:600}
.langsw li button[aria-current="true"]::after{content:"✓";margin-left:auto}
.burger{display:none;border:1px solid var(--rule);background:transparent;color:var(--ink);
  border-radius:3px;padding:8px 11px;font-size:16px;line-height:1;cursor:pointer}

/* ---- tile 8x8 ---- */
.tile{display:grid;grid-template-columns:repeat(8,var(--px));grid-auto-rows:var(--px);flex:none}
.tile i{display:block;background:transparent}
.tile i.on{background:var(--tile-ink,var(--accent))}
.mark-tile{--px:3px}

/* ---- hero ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:68px;
  align-items:center;padding:58px 0 44px}
.hero-txt{max-width:34em}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 22px}
h1 em{font-style:normal;color:var(--accent);display:block}
.lede{font-size:20px;line-height:1.5;margin:24px 0 0;max-width:31em;color:var(--ink)}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:32px}
.cta-apoio{display:flex;flex-direction:column;gap:8px;flex:1 1 260px}
.cta-apoio .bt{align-self:flex-start}
.cta-apoio .nota{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.5;
  letter-spacing:.02em;max-width:34em;white-space:nowrap}
@media (max-width:1080px){.cta-apoio .nota{white-space:normal}}
.hero-regra{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin:18px 0 0;letter-spacing:.03em}
.vitrine{display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--ground-2);border:1px solid var(--ink);border-radius:2px;overflow:hidden;
  box-shadow:5px 5px 0 rgba(25,20,18,.09);transition:transform .16s ease,box-shadow .16s ease}
.vitrine:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(25,20,18,.13)}
.vitrine .tela{background:var(--crt);padding:12px}
.vitrine .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:1px;
  aspect-ratio:256/232;object-fit:contain;background:var(--crt)}
.vitrine .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:7px}
.vitrine .ficha-card{font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);margin:0}
.vitrine .topo{display:flex;gap:8px;flex-wrap:wrap}
.vitrine h2{font-size:clamp(22px,2.4vw,28px);margin:0}
.vitrine .cat{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0;font-weight:500}
.vitrine .ir{margin:6px 0 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent)}

.placar{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;
  padding:16px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding-bottom:16px;margin-bottom:0}
.placar .nums{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.placar b{color:var(--ink);font-weight:600}
.placar .vivo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.placar .bolinha{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* ---- botoes ---- */
.bt{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;padding:14px 24px;border-radius:3px;
  background:var(--accent);color:var(--sobre-accent);text-decoration:none;border:1px solid var(--accent);
  white-space:nowrap;cursor:pointer}
.bt:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.bt.fora{background:transparent;color:var(--accent)}
.bt.fora:hover{background:var(--accent);color:var(--sobre-accent)}
.bt.pq{padding:10px 17px;font-size:12px}

/* ---- secoes ---- */
section{padding:64px 0;border-bottom:1px solid var(--rule)}
.label{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 30px;display:flex;align-items:center;gap:14px}
.label::after{content:"";height:1px;background:var(--rule);flex:1}

/* ---- projeto em destaque ---- */
.destaque{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:52px;align-items:center}
.destaque .tags{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.destaque h2{margin-bottom:6px}
.destaque .sub{font-family:var(--sans);font-weight:600;font-size:20px;color:var(--accent);margin:0 0 18px}
.destaque ul{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.destaque li{font-family:var(--mono);font-size:14px;color:var(--ink-2);padding-left:22px;position:relative}
.destaque li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:600}
.destaque .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ---- tela de TV ---- */
.crt{background:var(--crt);padding:11px;border-radius:5px;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 10px 30px rgba(25,20,18,.2)}
.crt img{display:block;width:100%;image-rendering:pixelated;border-radius:2px}

/* ---- cards de projeto ---- */
.projetos{display:grid;gap:24px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.projetos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.projetos{grid-template-columns:minmax(0,1fr)}}
.proj{display:flex;flex-direction:column;background:var(--ground-2);border:1px solid var(--rule);
  border-radius:5px;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
.proj:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,20,18,.15)}
.proj .tela{display:block;background:var(--crt);padding:9px}
.proj .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:2px;
  aspect-ratio:256/240;object-fit:contain;background:var(--crt)}
.proj .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj h3{margin:0;font-size:21px}
.proj h3 a{color:inherit;text-decoration:none}
.proj h3 a:hover{color:var(--accent)}
.proj .ficha{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.03em}
.proj .cat{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:500}
.proj .linha{font-size:15.5px;line-height:1.5;color:var(--ink-2);margin:6px 0 0}
.proj .ir{margin-top:auto;padding-top:16px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase}
.proj .ir a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.proj .ir a:hover{border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;
  background:var(--chip);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);font-weight:500}
.pill.on{background:var(--accent);color:var(--sobre-accent)}
.pill.beta{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
/* as bandeiras dos idiomas em que o patch existe */
.idiomas{display:inline-flex;align-items:center;gap:0;vertical-align:middle}
.idiomas .fl{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1;
  padding:3px 8px 3px 7px;border:1px solid var(--rule);border-right-width:0;background:var(--ground)}
.idiomas .fl:first-child{border-radius:2px 0 0 2px}
.idiomas .fl:last-child{border-right-width:1px;border-radius:0 2px 2px 0}
.idiomas .fl:only-child{border-radius:2px}
.idiomas .cod{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-2);
  font-weight:500;padding-top:1px}
.pill.alfa{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.gold{background:var(--gold);color:var(--sobre-gold,#fff)}
.grupo-status{margin-bottom:44px}
.grupo-status:last-child{margin-bottom:0}
.grupo-status > h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 20px;display:flex;align-items:center;gap:14px}
.grupo-status > h3::after{content:"";height:1px;background:var(--rule-soft);flex:1}

.regua{margin:36px 0 8px;padding:26px 28px 22px;border:1px solid var(--rule);border-radius:2px;
  background:var(--ground-2)}
.regua h3{font-size:19px;margin:0 0 8px}
.regua .intro{font-size:16px;color:var(--ink-2);margin:0 0 20px;max-width:44em}
.regua dl{margin:0;display:flex;flex-direction:column;gap:0}
.regua dl > div{display:grid;grid-template-columns:126px minmax(0,1fr);gap:22px;
  padding:14px 0;border-top:1px solid var(--rule-soft)}
.regua dt{margin:0}
.regua dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:52em}
.regua .fecho{margin:22px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.regua dl > div{grid-template-columns:minmax(0,1fr);gap:8px}}

.fila{margin-top:56px;padding-top:32px;border-top:1px solid var(--rule)}
.fila h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 14px}
.fila h3 span{color:var(--accent)}
.fila .intro{font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;max-width:44em}
.fila ol{margin:26px 0 0;padding:0;list-style:none;counter-reset:fila}
.fila li{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;
  padding:16px 0;border-top:1px solid var(--rule-soft);counter-increment:fila}
.fila li .jogo{display:flex;flex-direction:column;gap:5px}
.fila li .jogo b{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.015em;
  color:var(--ink);display:flex;gap:9px}
.fila li .jogo b::before{content:counter(fila,decimal-leading-zero);font-family:var(--mono);
  font-weight:400;font-size:12px;color:var(--accent);flex:none;padding-top:3px}
.fila li .ficha{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-left:26px}
.fila li p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.fila .aviso{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.fila li{grid-template-columns:minmax(0,1fr);gap:8px}
  .fila li .ficha{padding-left:0}}

/* ---- nao e so traducao ---- */
.provas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;
  border-top:1px solid var(--rule)}
.prova{padding:30px 30px 30px 0;border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column}
.prova:last-child{border-right:0}
.prova .et{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px}
.prova .n{font-family:var(--sans);font-weight:800;font-size:clamp(26px,3.4vw,36px);
  letter-spacing:-.035em;line-height:1.06;color:var(--ink);display:block;
  min-height:2.12em;display:flex;align-items:flex-end}
.prova .u{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);display:block;margin:9px 0 16px}
.prova p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.prova .onde{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:11.5px}
.prova .onde a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.prova .onde a:hover{border-bottom-color:var(--accent)}

/* ---- promessas ---- */
.promessas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.promessa h4{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px}
.promessa p{font-family:var(--sans);font-weight:700;font-size:19px;color:var(--ink);margin:0;letter-spacing:-.02em}

/* ---- updates ---- */
.updates{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}
.upd{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:2px solid var(--ink)}
.upd .quando{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.upd h3{font-size:20px;margin:0;min-height:2.4em;display:flex;align-items:flex-start}
.upd p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.upd .ler{margin-top:auto;padding-top:12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.upd .ler a{color:var(--accent);text-decoration:none}
.upd .ler a:hover{text-decoration:underline}
.ver-todas{margin-top:34px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ver-todas a{color:var(--accent);text-decoration:none}
.ver-todas a:hover{text-decoration:underline}

/* lista completa de atualizacoes */
.posts{display:flex;flex-direction:column}
.post{display:grid;grid-template-columns:160px minmax(0,1fr);gap:34px;padding:30px 0;
  border-top:1px solid var(--rule-soft)}
.post:first-child{border-top:0;padding-top:0}
.post-meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.05em;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.post-build{display:inline-block;padding:2px 7px;background:var(--chip);color:var(--ink);
  border-radius:2px;font-size:11px;letter-spacing:.08em}
.post-body{max-width:34em}
.post-body p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0 0 12px}

/* ---- pagina do projeto ---- */

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grupo{padding:38px 0;border-top:1px solid var(--rule-soft)}
.grupo:first-child{border-top:0;padding-top:0}

  text-transform:uppercase;margin-bottom:20px;font-weight:500}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,310px);gap:36px;
  align-items:start;padding:20px 0;border-top:1px solid var(--rule-soft)}

.feat.solo{grid-template-columns:minmax(0,1fr)}

/* ---- download ---- */
.baixar-cab{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.85;margin-bottom:24px}

.patches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pt-item{display:flex;flex-direction:column;gap:11px;padding:20px;border-radius:4px;

  letter-spacing:.11em;text-transform:uppercase;color:var(--ink)}

/* um patch so para varios idiomas: um cartao, nao tres links iguais */
.patch-uno{border:1px solid var(--accent);border-radius:4px;background:var(--ground-2);overflow:hidden}

.horas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;

 graça.","en":"Patches only. Never ROMs. Every release, free.","es":"Solo parches. Nunca ROMs. Todo release, gratis."},"apoiarNota":{"pt":"Financie as horas, os testes e o hardware.","en":"Fund the hours, the testing and the hardware.","es":"Financia las horas, las pruebas y el hardware."}},"eyebrow":{"pt":"Rom hacking · Tradução · Melhorias","en":"Rom hacking · Translation · Improvement","es":"Rom hacking · Traducción · Mejoras"},"curta":{"pt":"Traduções de jogos que o Japão guardou para si, <b>bugs de trinta e cinco anos consertados</b> e melhorias que respeitam o hardware original.","en":"Translations of games Japan kept to itself, <b>35-year-old bugs fixed</b>, and improvements that respect the original hardware.","es":"Traducciones de juegos que Japón se guardó, <b>bugs de treinta y cinco años corregidos</b> y mejoras que respetan el hardware original."},"ativo":{"pt":"Ativo","en":"Active","es":"Activo"}},"patreon":{"url":"https://www.patreon.com/patchclan","nome":"Sonix","chamada":{"pt":"O que uma assinatura compra são <b>horas</b>. Num jogo destes, umas duzentas passam antes de uma palavra em inglês chegar à tela: desmontar o motor, achar o texto, entender o empacotamento, e então escrever as ferramentas que leem e reescrevem.","en":"What a pledge buys is <b>hours</b>. On a game like these, roughly two hundred of them pass before one English word reaches the screen: disassembling the engine, locating the text, working out the packing scheme, then writing the tools that read and rewrite it.","es":"Lo que compra una suscripción son <b>horas</b>. En un juego así pasan unas doscientas antes de que una sola palabra en inglés llegue a la pantalla: desensamblar el motor, encontrar el texto, entender el empaquetado, y entonces escribir las herramientas que leen y reescriben."},"promessa":{"pt":"Três coisas que não mudam: <b>nenhuma ROM é distribuída</b>, só patches. <b>Todo patch pronto é de graça</b> para todo mundo, apoiador ou não. E <b>nenhuma data é prometida</b>, porque data prometida vira pressa, e pressa aparece no texto.","en":"Three things that never change: <b>no ROMs are distributed</b>, only patches. <b>Every finished patch is free</b> for everyone, patron or not. And <b>no dates are promised</b>, because a promised date turns into a rush, and the rush shows up in the text.","es":"Tres cosas que no cambian: <b>no se distribuye ninguna ROM</b>, solo parches. <b>Todo parche terminado es gratis</b> para todo el mundo, mecenas o no. Y <b>no se promete ninguna fecha</b>, porque nunca he acertado una."},"rodape":{"pt":"O patch pronto é sempre gratuito para todo mundo. O que a assinatura antecipa é o build <b>inacabado</b> — o beta com defeitos conhecidos, o alfa com telas ainda meio japonesas — e o relato de como ele está sendo feito. Ninguém paga para poder jogar a versão final.","en":"The finished patch is always free for everyone. What a pledge brings forward is the <b>unfinished</b> build — the beta with its known issues, the alpha with screens still half Japanese — and the account of how it is being made. Nobody pays to play the finished version.","es":"El parche terminado siempre es gratis para todo el mundo. Lo que la suscripción adelanta es la build <b>inacabada</b> — la beta con sus defectos conocidos, la alfa con pantallas aún medio japonesas — y el relato de cómo se está haciendo. Nadie paga por jugar la versión final."},"tiers":[{"nome":"Two Bytes","preco":"$3","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"os dois bytes que consertaram o Famicom Jump II","en":"the two bytes that fixed Famicom Jump II","es":"los dos bytes que arreglaron Famicom Jump II"},"itens":[{"pt":"<b>Só quero ajudar.</b> É exatamente isto: nenhuma contrapartida, nenhuma fila, nada exclusivo.","en":"<b>I just want to help.</b> That is exactly it: no perks, no queue, nothing exclusive.","es":"<b>Solo quiero ayudar.</b> Es exactamente eso: ninguna contrapartida, ninguna fila, nada exclusivo."},{"pt":"Todo patch continua <b>gratuito para todo mundo</b>, apoiador ou não.","en":"Every patch stays <b>free for everyone</b>, patron or not.","es":"Todo parche sigue siendo <b>gratis para todo el mundo</b>, mecenas o no."}]},{"nome":"Bank Switch","preco":"$10","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"recomendado":true,"nota":{"pt":"a troca de banco, que é como um cartucho de 1988 guarda mais do que devia","en":"bank switching, which is how a 1988 cartridge holds more than it should","es":"el cambio de banco, que es cómo un cartucho de 1988 guarda más de lo que debería"},"itens":[{"pt":"<b>Patches beta antes do lançamento público</b>, com a lista de defeitos conhecidos — o build que já se joga inteiro, mas ainda não passou pela última leitura.","en":"<b>Beta patches before public release</b>, with the known-issues list — the build you can already play through, but which has not had its final read-through.","es":"<b>Parches beta antes del lanzamiento público</b>, con la lista de defectos conocidos — la build que ya se juega entera, pero que aún no ha pasado la última lectura."},{"pt":"<b>Participe das pesquisas sobre os próximos jogos.</b> Qual cartucho vale a pena abrir, em que ordem, e o que se procura antes de decidir — a conversa acontece com você dentro.","en":"<b>Take part in the research on the next games.</b> Which cartridge is worth opening, in what order, and what gets measured before deciding — the conversation happens with you in it.","es":"<b>Participa en la investigación sobre los próximos juegos.</b> Qué cartucho vale la pena abrir, en qué orden, y qué se mide antes de decidir — la conversación ocurre contigo dentro."},{"pt":"<b>Seu nome nos agradecimentos do site</b>, enquanto o apoio durar.","en":"<b>Your name in the site’s thanks</b>, for as long as the pledge lasts.","es":"<b>Tu nombre en los agradecimientos del sitio</b>, mientras dure el apoyo."}]},{"nome":"The Seventh Hero","preco":"$25","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"o sétimo escolhido do Famicom Jump II é você","en":"the seventh champion in Famicom Jump II is you","es":"el séptimo elegido de Famicom Jump II eres tú"},"itens":[{"pt":"Tudo do <b>Bank Switch</b>.","en":"Everything in <b>Bank Switch</b>.","es":"Todo lo de <b>Bank Switch</b>."},{"pt":"<b>Acesso a todas as versões alfa das traduções</b> — as builds em montagem, antes mesmo do beta, com o texto ainda mudando e as telas ainda meio japonesas. É ver o trabalho acontecendo, não o resultado dele.","en":"<b>Access to every alpha build of the translations</b> — the builds still being assembled, before the beta, with the text still moving and the screens still half Japanese. It is watching the work happen, not its result.","es":"<b>Acceso a todas las versiones alfa de las traducciones</b> — las builds aún en montaje, antes del beta, con el texto todavía cambiando y las pantallas aún medio japonesas. Es ver el trabajo ocurriendo, no su resultado."}]}],"horas":{"numero":"200+","rotulo":{"pt":"horas antes de uma palavra chegar à tela","en":"hours before one word reaches the screen","es":"horas antes de que una palabra llegue a la pantalla"},"passos":[{"pt":"Desmontar","en":"Disassemble","es":"Desensamblar"},{"pt":"Entender","en":"Understand","es":"Entender"},{"pt":"Programar","en":"Program","es":"Programar"},{"pt":"Testar","en":"Test","es":"Probar"},{"pt":"Reescrever","en":"Rewrite","es":"Reescribir"}]}},"rules":{"items":[{"title":{"pt":"Patches, nunca ROMs","en":"Patches, never ROMs","es":"Parches, nunca ROMs"},"text":{"pt":"Você traz o seu próprio dump. Nada com direito autoral fica hospedado aqui, nunca.","en":"You bring your own dump. Nothing copyrighted is hosted here, ever.","es":"Tú traes tu propio volcado. Aquí no se aloja nada con derechos de autor, nunca."}},{"title":{"pt":"Todo patch pronto é de graça","en":"Every finished patch is free","es":"Todo parche terminado es gratis"},"text":{"pt":"Para todo mundo, apoiador ou não. O que apoiador recebe antes é build inacabado — nunca a versão final.","en":"For everyone, patron or not. What patrons get early is an unfinished build — never the finished version.","es":"Para todo el mundo, mecenas o no. Lo que reciben antes los mecenas es una build inacabada — nunca la versión final."}},{"title":{"pt":"Nenhuma data prometida","en":"No dates promised","es":"Ninguna fecha prometida"},"text":{"pt":"Nem em post, nem em resposta. Sai quando estiver lendo certo.","en":"Not in posts, not in replies. It ships when it reads right.","es":"Ni en publicaciones ni en respuestas. Sale cuando se lee bien."}},{"title":{"pt":"Devagar de propósito","en":"Slow on purpose","es":"Lento a propósito"},"text":{"pt":"E cada linha é lida em voz alta antes de sair — no hardware, no tamanho real.","en":"And every line gets read out loud before it ships — on hardware, at size.","es":"Y cada línea se lee en voz alta antes de salir — en hardware, a tamaño real."}}]},"who":{"paras":[{"pt":"O Patch Clan tem raiz na <b>Central Brasileira de Traduções</b>, a CBT, um dos grupos que construíram a cena de tradução brasileira quando patch andava por post de fórum e todo mundo aprendia hex editing num arquivo de texto que outro alguém escreveu às duas da manhã.","en":"Patch Clan has its roots in <b>Central Brasileira de Traduções</b>, the CBT, one of the groups that built the Brazilian translation scene back when a patch travelled by forum post and everyone learned hex editing from a text file somebody else wrote at two in the morning.","es":"Patch Clan tiene su raíz en la <b>Central Brasileira de Traduções</b>, la CBT, uno de los grupos que construyeron la escena de traducción brasileña cuando un parche viajaba por mensaje de foro y todo el mundo aprendía hex editing en un archivo de texto que otro escribió a las dos de la mañana."},{"pt":"A gente escreve as próprias ferramentas para cada jogo, porque as de uso geral param na parte interessante: um desmontador 6502 com mapa de bancos por mapper, desempacotadores de texto a nível de bit, um montador 6502 em Python, e um emulador próprio que dá boot na ROM e fotografa a tela.","en":"We write our own tools for every game, because the general-purpose ones stop at the interesting part: a 6502 disassembler with a per-mapper bank map, bit-level text unpackers, a 6502 assembler in Python, and an emulator of our own that boots the ROM and screenshots it.","es":"Escribimos nuestras propias herramientas para cada juego, porque las de uso general se detienen en la parte interesante: un desensamblador 6502 con mapa de bancos por mapper, desempaquetadores de texto a nivel de bit, un ensamblador 6502 en Python, y un emulador propio que arranca la ROM y fotografía la pantalla."},{"pt":"O cronograma, o controle de qualidade e o lançamento fazem parte do mesmo trabalho que o patch: nada sai por prazo, sai quando está lendo certo.","en":"The schedule, the QA and the release are part of the same job as the patch itself: nothing ships to a deadline, it ships when it reads right.","es":"El cronograma, el control de calidad y el lanzamiento son parte del mismo trabajo que el parche: nada sale por plazo, sale cuando se lee bien."}],"sign":{"pt":"tradução, hacking, revisão, clã","en":"translation, hacking, proofreading, clan","es":"traducción, hacking, revisión, clan"},"abertura":{"pt":"O Patch Clan é um grupo de rom hacking. A gente traduz jogos que nunca tiveram lançamento em inglês — ponteiros, fonte, quebra de linha e tudo — e não para aí: telas que o original não tinha, bugs de trinta e cinco anos consertados, e o que mais couber num cartucho que sempre teve espaço.","en":"Patch Clan is a rom hacking group. We translate games that never had an English release — pointers, font, line breaks and all — and then keep going: screens the original never had, thirty-five-year-old bugs fixed, and whatever else the cartridge always had room for.","es":"Patch Clan es un grupo de rom hacking. Traducimos juegos que nunca tuvieron lanzamiento en inglés — punteros, fuente, saltos de línea y todo lo demás — y no paramos ahí: pantallas que el original no tenía, errores de treinta y cinco años corregidos, y todo lo que quepa en un cartucho que siempre tuvo sitio."}},"footer":{"tagline":{"pt":"Patches para jogos que nunca falaram inglês","en":"Patches for games that never spoke English","es":"Parches para juegos que nunca hablaron inglés"}},"provas":{"itens":[{"jogo":"famicom-jump-2","etiqueta":{"pt":"Correção de bug","en":"Bug fix","es":"Corrección de bug"},"numero":"35","unidade":{"pt":"anos depois","en":"years later","es":"años después"},"texto":{"pt":"O jogo tinha sete variantes de uma fala e seis nunca apareciam, por causa de um registrador trocado. A correção foram <b>dois bytes</b>.","en":"The game had seven variants of one line and six never appeared, because of a swapped register. The fix was <b>two bytes</b>.","es":"El juego tenía siete variantes de una frase y seis nunca aparecían, por un registro cambiado. La corrección fueron <b>dos bytes</b>."}},{"jogo":"famicom-jump-2","etiqueta":{"pt":"Engenharia","en":"Engineering","es":"Ingeniería"},"numero":"6,25 → 3,90","unidade":{"pt":"bits por caractere","en":"bits per character","es":"bits por carácter"},"texto":{"pt":"O inglês não cabia. Em vez de cortar texto, troquei a compressão por um Huffman de ordem 1 — decodificador de <b>89 bytes</b> de 6502.","en":"English did not fit. Rather than trim text, I replaced the compression with an order-1 Huffman coder — an <b>89-byte</b> 6502 decoder.","es":"El inglés no cabía. En vez de cortar texto, cambié la compresión por un Huffman de orden 1 — decodificador de <b>89 bytes</b> de 6502."}},{"jogo":"captain-tsubasa","etiqueta":{"pt":"Função nova","en":"New feature","es":"Función nueva"},"numero":{"pt":"senha → bateria","en":"password → battery","es":"contraseña → pila"},"unidade":{"pt":"progresso salvo","en":"progress saved","es":"progreso guardado"},"texto":{"pt":"O jogo de 1988 só guardava por senha. Agora grava em bateria — os mesmos 24 bytes que a senha carregava, em <b>97 bytes</b> de código novo.","en":"The 1988 game only kept progress by password. Now it writes to battery — the same 24 bytes the password carried, in <b>97 bytes</b> of new code.","es":"El juego de 1988 solo guardaba por contraseña. Ahora graba con pila — los mismos 24 bytes que llevaba la contraseña, en <b>97 bytes</b> de código nuevo."}}]},"promessas":{"itens":[{"titulo":{"pt":"Só patches","en":"Patches only","es":"Solo parches"},"texto":{"pt":"Nunca ROMs.","en":"Never ROMs.","es":"Nunca ROMs."}},{"titulo":{"pt":"Lançamentos livres","en":"Free releases","es":"Lanzamientos libres"},"texto":{"pt":"Para todo mundo.","en":"For everyone.","es":"Para todo el mundo."}},{"titulo":{"pt":"Nenhum prazo falso","en":"No fake deadlines","es":"Ningún plazo falso"},"texto":{"pt":"Sai quando estiver pronto.","en":"It ships when it is ready.","es":"Sale cuando esté listo."}}]},"marca":{"selo":{"pt":"Rom hacking artesanal","en":"Handmade rom hacking","es":"Rom hacking artesanal"}},"niveis":{"titulo":{"pt":"Release, beta e alfa","en":"Release, beta and alpha","es":"Release, beta y alfa"},"intro":{"pt":"Três níveis, e só três. Cada um é definido pelas <b>seis etapas</b> que a ficha do projeto mostra (hacking, tradução, revisão, arte, testes e longplay), e não por otimismo.","en":"Three levels, and only three. Each one is defined by the <b>six stages</b> shown on the project page (hacking, translation, editing, art, testing and longplay), not by optimism.","es":"Tres niveles, y solo tres. Cada uno se define por las <b>seis etapas</b> que muestra la ficha del proyecto (hacking, traducción, revisión, arte, pruebas y longplay), y no por optimismo."},"itens":[{"chave":"release","marca":"✓","texto":{"pt":"As <b>seis etapas feitas</b>: o jogo inteiro em inglês, revisado com o manual original, sem japonês em imagem, <b>jogado até todos os finais</b> e com cada final gravado em vídeo. É o único nível em que o site publica a lista completa do que entrou. <b>De graça para todo mundo.</b>","en":"<b>All six stages done</b>: the whole game in English, edited against the original manual, no Japanese left in images, <b>played through to every ending</b>, and every ending recorded on video. It is the only level where the site publishes the full list of what went in. <b>Free for everyone.</b>","es":"<b>Las seis etapas hechas</b>: el juego entero en inglés, revisado con el manual original, sin japonés en imágenes, <b>jugado hasta todos los finales</b> y con cada final grabado en video. Es el único nivel en el que el sitio publica la lista completa de lo que entró. <b>Gratis para todo el mundo.</b>"}},{"chave":"beta","marca":"●","texto":{"pt":"<b>Hacking e tradução feitos</b>: o roteiro inteiro já está em inglês dentro do jogo. Ainda há etapa aberta (revisão, arte, testes ou longplay), e a ficha mostra qual. Vai antes para quem apoia no <b>Bank Switch</b>.","en":"<b>Hacking and translation done</b>: the whole script is already in English inside the game. Some stage is still open (editing, art, testing or longplay), and the project page shows which. It goes first to <b>Bank Switch</b> patrons.","es":"<b>Hacking y traducción hechos</b>: el guion entero ya está en inglés dentro del juego. Todavía hay alguna etapa abierta (revisión, arte, pruebas o longplay), y la ficha muestra cuál. Va antes a quien apoya en <b>Bank Switch</b>."}},{"chave":"alfa","marca":"○","texto":{"pt":"<b>Ainda falta inserir ou traduzir parte do jogo</b>, então pode haver menus, telas ou falas em japonês. É o trabalho acontecendo. Vai antes para quem apoia no <b>The Seventh Hero</b>.","en":"<b>Part of the game still has to be inserted or translated</b>, so some menus, screens or lines may still be in Japanese. This is the work happening. It goes first to <b>The Seventh Hero</b> patrons.","es":"<b>Todavía falta insertar o traducir parte del juego</b>, así que puede haber menús, pantallas o diálogos en japonés. Es el trabajo ocurriendo. Va antes a quien apoya en <b>The Seventh Hero</b>."}}],"fecho":{"pt":"O nível sobe quando a etapa foi <b>provada</b>, não quando parece estar quase. A ficha mostra em que etapa cada projeto está; o detalhe do que falta dentro de cada uma fica fora do site, porque mudaria toda semana.","en":"A level goes up when a stage has been <b>proved</b>, not when it looks nearly there. The project page shows which stage each project has reached; the detail of what is missing inside each stage stays off the site, because it would change every week.","es":"El nivel sube cuando la etapa se ha <b>probado</b>, no cuando parece que casi. La ficha muestra en qué etapa está cada proyecto; el detalle de lo que falta dentro de cada una queda fuera del sitio, porque cambiaría cada semana."}},"fila":{"titulo":{"pt":"Na fila","en":"Next in line","es":"En la cola"},"intro":{"pt":"O que vem depois. Nenhum destes cartuchos foi aberto ainda — quando um deles for, ganha página própria e sai desta lista. Todos passaram pela mesma pergunta, feita <b>antes</b> de qualquer entusiasmo: “este jogo já tem patch em inglês?” — e em todos a resposta foi não.","en":"What comes next. None of these cartridges has been opened yet — the day one is, it gets its own page and leaves this list. All of them went through the same question, asked <b>before</b> any enthusiasm: “does this game already have an English patch?” — and for all of them the answer was no.","es":"Lo que viene después. Ninguno de estos cartuchos se ha abierto todavía — el día que uno se abra, tendrá página propia y saldrá de esta lista. Todos pasaron por la misma pregunta, hecha <b>antes</b> que cualquier entusiasmo: “¿este juego ya tiene parche en inglés?” — y en todos la respuesta fue no."},"criterio":{"pt":"O padrão que organiza a lista é o <b>órfão de série</b>: a comunidade traduz o primeiro jogo e para. Foi o caso do Famicom Jump, e é o caso de quase tudo aqui.","en":"The pattern that organises this list is the <b>orphan sequel</b>: the community translates the first game and stops. That was the case with Famicom Jump, and it is the case with almost everything here.","es":"El patrón que organiza esta lista es el <b>huérfano de serie</b>: la comunidad traduce el primer juego y se detiene. Fue el caso de Famicom Jump, y es el caso de casi todo lo que hay aquí."},"itens":[{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 2","sistema":"Famicom","ano":1991,"porque":{"pt":"O primeiro foi traduzido e a série parou aí. RPG, IP de primeira linha, nenhum projeto público em andamento.","en":"The first was translated and the series stopped there. An RPG, a first-rank IP, and no public project under way.","es":"El primero fue traducido y la serie se detuvo ahí. RPG, IP de primera línea, ningún proyecto público en marcha."}},{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 3","sistema":"Famicom","ano":1992,"porque":{"pt":"O mesmo caso do 2, e pela mesma razão: as resenhas do primeiro pedem os dois sequels.","en":"The same case as 2, for the same reason: reviews of the first ask for both sequels.","es":"El mismo caso que el 2, por la misma razón: las reseñas del primero piden ambas secuelas."}},{"nome":"Hokuto no Ken 4: Shichisei Haken Den","sistema":"Famicom","ano":1991,"porque":{"pt":"Órfão desde que o terceiro saiu em inglês, em 2024. <b>A conferir antes de começar:</b> há sinal de projeto pessoal ativo no fórum.","en":"Orphaned since the third came out in English in 2024. <b>To check before starting:</b> there is a sign of an active personal project on the forum.","es":"Huérfano desde que el tercero salió en inglés, en 2024. <b>A comprobar antes de empezar:</b> hay señal de un proyecto personal activo en el foro."}},{"nome":"Slam Dunk 2: IH Yuushou e no Michi","sistema":"Super Famicom","ano":1995,"porque":{"pt":"Nenhum dos quatro jogos de Slam Dunk tem patch em inglês. Um projeto de fórum procurou gente em 2017 e morreu ali.","en":"None of the four Slam Dunk games has an English patch. A forum project looked for people in 2017 and died there.","es":"Ninguno de los cuatro juegos de Slam Dunk tiene parche en inglés. Un proyecto de foro buscó gente en 2017 y murió ahí."}},{"nome":"Hokuto no Ken 6 · 7","sistema":"Super Famicom","ano":1992,"porque":{"pt":"O sétimo aparece em listas públicas de “SNES ainda sem tradução”. Nenhum patch encontrado para os dois.","en":"The seventh shows up in public lists of “SNES still untranslated”. No patch found for either.","es":"El séptimo aparece en listas públicas de “SNES aún sin traducir”. Ningún parche encontrado para los dos."}}],"aviso":{"pt":"Estar na fila <b>não é promessa</b>, e a ordem não está decidida. É nessa lista que a conversa acontece com quem apoia no <b>Bank Switch</b>: qual cartucho vale a pena abrir, e em que ordem.","en":"Being in the queue is <b>not a promise</b>, and the order is not decided. This list is where the conversation happens with <b>Bank Switch</b> patrons: which cartridge is worth opening, and in what order.","es":"Estar en la cola <b>no es una promesa</b>, y el orden no está decidido. En esta lista ocurre la conversación con quien apoya en <b>Bank Switch</b>: qué cartucho vale la pena abrir, y en qué orden."}},"equipe":{"intro":{"pt":"Cinco cargos e seis etapas. A ficha de cada projeto mostra em que etapa ele está. Só vira release o patch que passou pelas seis.","en":"Five roles and six stages. Each project page shows which stage it has reached. Only a patch that has cleared all six becomes a release.","es":"Cinco cargos y seis etapas. La ficha de cada proyecto muestra en qué etapa está. Solo es release el parche que pasó por las seis."},"cargos":[{"nome":{"pt":"Direção e hacking","en":"Direction and hacking","es":"Dirección y hacking"},"texto":{"pt":"Escolhe o jogo e abre o cartucho: ponteiros, fonte, expansão e as ferramentas de cada projeto.","en":"Picks the game and opens the cartridge: pointers, font, expansion, and the tools each project needs.","es":"Elige el juego y abre el cartucho: punteros, fuente, expansión y las herramientas de cada proyecto."}},{"nome":{"pt":"Tradução","en":"Translation","es":"Traducción"},"texto":{"pt":"Do japonês para inglês, português e espanhol.","en":"From Japanese into English, Portuguese and Spanish.","es":"Del japonés al inglés, portugués y español."}},{"nome":{"pt":"Revisão","en":"Editing","es":"Revisión"},"texto":{"pt":"Texto que soa natural, nomes consistentes do começo ao fim, e que cabe na caixa.","en":"Text that reads naturally, names consistent from start to finish, and lines that fit the box.","es":"Texto que suena natural, nombres coherentes de principio a fin, y que cabe en la caja."}},{"nome":{"pt":"Arte","en":"Art","es":"Arte"},"texto":{"pt":"Tela de título, logos, fontes e todo texto que mora dentro de imagem.","en":"Title screen, logos, fonts, and every piece of text that lives inside an image.","es":"Pantalla de título, logos, fuentes y todo texto que vive dentro de una imagen."}},{"nome":{"pt":"Testes","en":"Testing","es":"Pruebas"},"texto":{"pt":"Joga até todos os finais, caça bug, registra o que ainda está quebrado e grava o longplay.","en":"Plays through to every ending, hunts bugs, logs what is still broken, and records the longplay.","es":"Juega hasta todos los finales, caza bugs, registra lo que sigue roto y graba el longplay."}}],"etapas":[{"id":"direcao","curto":{"pt":"Hacking","en":"Hacking","es":"Hacking"},"criterio":{"pt":"O texto entra no jogo pelas nossas ferramentas, e a ROM traduzida inteira sai delas.","en":"Text goes into the game through our own tools, and the full translated ROM comes out of them.","es":"El texto entra al juego por nuestras herramientas, y la ROM traducida entera sale de ellas."}},{"id":"traducao","curto":{"pt":"Tradução","en":"Translation","es":"Traducción"},"criterio":{"pt":"O roteiro inteiro em inglês, dentro do jogo: falas, menus, nomes e créditos.","en":"The whole script in English, inside the game: dialogue, menus, names and credits.","es":"El guion entero en inglés, dentro del juego: diálogos, menús, nombres y créditos."}},{"id":"revisao","curto":{"pt":"Revisão","en":"Editing","es":"Revisión"},"criterio":{"pt":"Uma leitura do roteiro inteiro, conferida com o manual e os guias japoneses originais.","en":"One read of the whole script, checked against the original Japanese manual and guides.","es":"Una lectura del guion entero, cotejada con el manual y las guías japonesas originales."}},{"id":"arte","curto":{"pt":"Arte","en":"Art","es":"Arte"},"criterio":{"pt":"Nenhum japonês sobrando em imagem: título, logos, placas e texturas.","en":"No Japanese left inside images: title, logos, signs and textures.","es":"Nada de japonés en imágenes: título, logos, carteles y texturas."}},{"id":"testes","curto":{"pt":"Testes","en":"Testing","es":"Pruebas"},"criterio":{"pt":"O jogo traduzido atravessado até todos os finais, sem pendência aberta.","en":"The translated game played through to every ending, with nothing left open.","es":"El juego traducido recorrido hasta todos los finales, sin nada pendiente."}},{"id":"longplay","curto":{"pt":"Longplay","en":"Longplay","es":"Longplay"},"criterio":{"pt":"Cada final gravado em vídeo, do começo ao fim, na versão traduzida.","en":"Every ending recorded on video, start to finish, in the translated version.","es":"Cada final grabado en video, de principio a fin, en la versión traducida."}}],"estados":{"feito":{"pt":"feito","en":"done","es":"hecho"},"andamento":{"pt":"em andamento","en":"in progress","es":"en curso"},"nao":{"pt":"não começou","en":"not started","es":"sin empezar"}}}},"games":[{"slug":"magic-knight-rayearth-2","nome":"Magic Knight Rayearth 2","subtitulo":"Making of Magic Knight","jp":"魔法騎士レイアース2 〜making of magic knight〜","publisher":"SEGA","dev":"SEGA","ano":1995,"data":"1995","sistema":"Game Gear","mapper":"Mapper Sega padrão · 512 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"release","versao":"English v1.4.4","capa":"mkr2/00-capa-patreon.jpg","linha":{"pt":"Hikaru, Umi e Fuu voltam a Cefiro depois de Emeraude, no Game Gear. A caixa tem 12 caracteres, e MAGIC KNIGHTS tem catorze.","en":"Hikaru, Umi and Fuu return to Cefiro after Emeraude, on the Game Gear. The box holds 12 characters, and MAGIC KNIGHTS has fourteen.","es":"Hikaru, Umi y Fuu vuelven a Cefiro después de Emeraude, en la Game Gear. La caja tiene 12 caracteres, y MAGIC KNIGHTS tiene catorce."},"resumo":{"pt":["<i>Magic Knight Rayearth</i> saiu do <b>CLAMP</b>, o grupo de autoras de mangá, e conta de três colegiais chamadas a outro mundo, <b>Cefiro</b>, para salvá-lo. Esta é a segunda parte, e quem acompanhou sabe o que isso muda: Hikaru, Umi e Fuu voltam depois do que aconteceu com <b>Emeraude e o Pilar</b>, e agora o país tem <b>Autozam, Chizeta e Fahren</b> à porta — com Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, o Eagle e o Mokona pelo caminho. O subtítulo é <i>Making of Magic Knight</i>, e ele diz o que se faz: em vez de percorrer a aventura, você <b>forma as três</b>, atributo por atributo, e o final que cada uma alcança depende de como foi criada. É um cartucho de <b>Game Gear</b> — e é a tela do portátil que manda no texto.","O jogo é <b>100% kana, sem um único kanji</b>, e isso não é curiosidade: é shoujo, escrito para criança japonesa ler, e cada kana ocupa exatamente uma coluna. É daí que vem o aperto, porque a caixa de diálogo do Game Gear tem <b>12 caracteres</b> e o motor quebra a linha nos doze <b>sem olhar palavra</b>. Com fonte de largura fixa, <code>MAGIC KNIGHTS</code> tem catorze e não entra: sai <code>MG KNIGHTS</code>, e é o tipo de corte que se lê na tela o jogo inteiro. Contar bytes engana ainda mais — um kana com dakuten custa <b>três bytes e uma coluna só</b>, de modo que o script japonês soma <b>31.524 bytes para 26.584 colunas</b>, 19% a mais em byte do que em tela. O que limita é o glifo, não o armazenamento: o que se guarda tem saída por salto de banco, o que aparece na tela não tem.","Por isso este é o único projeto da casa com <b>fonte de largura variável</b>. Foi desenhada uma latina de <b>5×7</b>, avanço médio de <b>6 px em vez de 8</b>, e escrita uma rotina que compõe cada glifo na posição de pixel em que ele cai — a linha passou a valer <b>96 pixels</b> em vez de doze casas fixas. Ela saiu barata por um detalhe do cartucho que só se enxerga medindo: a fonte não é 4bpp de verdade, porque o fundo é uma cor, a tinta é outra e os dois planos restantes são sempre zero. Logo <b>o plano 0 é a própria máscara da tinta</b>, oito bytes por glifo, e deslocar um glifo vira um deslocamento de um bit por linha em vez de uma operação de quatro planos. São <b>718 bytes</b> de Z80 no banco que fica fixo enquanto o texto roda — a mesma piscina de onde a fonte é lida a cada glifo —, escritos com um <b>montador Z80 feito para este projeto</b>. Há até um <b>espaço fino de 1 px</b>, num código que o jogo nunca usa, para fechar a linha exatamente na borda. Na caixa de diálogo, <code>MG KNIGHTS</code> voltou a ser <code>MAGIC KNIGHTS</code>."],"en":["<i>Magic Knight Rayearth</i> came from <b>CLAMP</b>, the manga authors' collective, and tells of three schoolgirls summoned to another world, <b>Cefiro</b>, to save it. This is the second part, and anyone who followed the first knows what that changes: Hikaru, Umi and Fuu return after what happened to <b>Emeraude and the Pillar</b>, and the country now has <b>Autozam, Chizeta and Fahren</b> at its door — with Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, Eagle and Mokona along the way. The subtitle is <i>Making of Magic Knight</i>, and it says what you do: rather than travelling the adventure, you <b>raise the three of them</b>, stat by stat, and the ending each one reaches depends on how she was brought up. It is a <b>Game Gear</b> cartridge — and it is the handheld's screen that rules the text.","The game is <b>100% kana, without a single kanji</b>, and that is not trivia: it is shoujo, written for a Japanese child to read, and each kana takes exactly one column. That is where the squeeze comes from, because the Game Gear's dialogue box holds <b>12 characters</b> and the engine breaks the line at twelve <b>without looking at words</b>. With a fixed-width font, <code>MAGIC KNIGHTS</code> is fourteen and does not fit: out comes <code>MG KNIGHTS</code>, and it is the sort of cut you read on screen all game long. Counting bytes misleads further still — a kana with dakuten costs <b>three bytes and only one column</b>, so the Japanese script comes to <b>31,524 bytes for 26,584 columns</b>, 19% more in bytes than on screen. What limits you is the glyph, not the storage: what gets stored has a way out through a bank jump, what appears on screen does not.","That is why this is the house's only project with a <b>variable-width font</b>. A Latin <b>5×7</b> was drawn, with a mean advance of <b>6 px instead of 8</b>, and a routine written that composes each glyph at the pixel position where it lands — the line became worth <b>96 pixels</b> rather than twelve fixed cells. It came cheap thanks to a cartridge detail you only see by measuring: the font is not really 4bpp, because the background is one colour, the ink another, and the two remaining planes are always zero. So <b>plane 0 is the ink mask itself</b>, eight bytes per glyph, and shifting a glyph becomes a one-bit shift per row rather than a four-plane operation. It is <b>718 bytes</b> of Z80 in the bank that stays pinned while the text runs — the same pool the font is read from on every glyph — written with a <b>Z80 assembler built for this project</b>. There is even a <b>1 px thin space</b>, mapped to a code point the game never uses, to close the line exactly at the edge. In the dialogue box, <code>MG KNIGHTS</code> became <code>MAGIC KNIGHTS</code> again."],"es":["<i>Magic Knight Rayearth</i> salió de <b>CLAMP</b>, el colectivo de autoras de manga, y cuenta la historia de tres colegialas llamadas a otro mundo, <b>Cefiro</b>, para salvarlo. Esta es la segunda parte, y quien siguió la primera sabe lo que eso cambia: Hikaru, Umi y Fuu vuelven después de lo que pasó con <b>Emeraude y el Pilar</b>, y ahora el país tiene a <b>Autozam, Chizeta y Fahren</b> en la puerta — con Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, Eagle y Mokona por el camino. El subtítulo es <i>Making of Magic Knight</i>, y dice lo que se hace: en lugar de recorrer la aventura, <b>formas a las tres</b>, atributo por atributo, y el final que alcanza cada una depende de cómo la formaste. Es un cartucho de <b>Game Gear</b> — y es la pantalla de la portátil la que manda en el texto.","El juego es <b>100% kana, sin un solo kanji</b>, y eso no es curiosidad: es shoujo, escrito para que lo lea una niña japonesa, y cada kana ocupa exactamente una columna. De ahí viene el apuro, porque la caja de diálogo de la Game Gear tiene <b>12 caracteres</b> y el motor corta la línea a los doce <b>sin mirar la palabra</b>. Con fuente de ancho fijo, <code>MAGIC KNIGHTS</code> tiene catorce y no entra: sale <code>MG KNIGHTS</code>, y es de esos recortes que se leen en pantalla durante todo el juego. Contar bytes engaña todavía más — un kana con dakuten cuesta <b>tres bytes y una sola columna</b>, de modo que el guion japonés suma <b>31.524 bytes para 26.584 columnas</b>, un 19% más en bytes que en pantalla. Lo que limita es el glifo, no el almacenamiento: lo que se guarda tiene salida por un salto de banco, lo que aparece en pantalla no la tiene.","Por eso este es el único proyecto de la casa con <b>fuente de anchura variable</b>. Se dibujó una latina de <b>5×7</b>, con un avance medio de <b>6 px en lugar de 8</b>, y se escribió una rutina que compone cada glifo en la posición de píxel en la que cae — la línea pasó a valer <b>96 píxeles</b> en vez de doce casillas fijas. Salió barata por un detalle del cartucho que solo se ve midiendo: la fuente no es 4bpp de verdad, porque el fondo es un color, la tinta es otro y los dos planos restantes son siempre cero. Luego <b>el plano 0 es la propia máscara de la tinta</b>, ocho bytes por glifo, y desplazar un glifo se vuelve un desplazamiento de un bit por fila en lugar de una operación de cuatro planos. Son <b>718 bytes</b> de Z80 en el banco que queda fijo mientras el texto corre — de ahí mismo se lee la fuente en cada glifo —, escritos con un <b>ensamblador de Z80 hecho para este proyecto</b>. Hay hasta un <b>espacio fino de 1 px</b>, en un punto de código que el juego nunca usa, para cerrar la línea justo en el borde. En la caja de diálogo, <code>MG KNIGHTS</code> ha vuelto a ser <code>MAGIC KNIGHTS</code>."]},"numeros":[{"v":"2.581","r":{"pt":"linhas de texto na tela","en":"lines of on-screen text","es":"líneas de texto en pantalla"}},{"v":"59","r":{"pt":"glifos da fonte 5×7 desenhados","en":"glyphs drawn for the 5×7 font","es":"glifos dibujados de la fuente 5×7"}},{"v":"718","r":{"pt":"bytes da rotina de largura variável","en":"bytes of the variable-width routine","es":"bytes de la rutina de ancho variable"}},{"v":"4","r":{"pt":"erros na tabela de opcodes que destruíam código","en":"opcode-table errors that were destroying code","es":"errores en la tabla de opcodes que destruían código"}},{"v":"285","r":{"pt":"falas reescritas para caber na linha (v1.1)","en":"lines rewritten to fit the line (v1.1)","es":"frases reescritas para caber en la línea (v1.1)"}},{"v":"54","r":{"pt":"palavras cortadas no meio, consertadas (v1.2)","en":"words cut in half, fixed (v1.2)","es":"palabras cortadas por la mitad, corregidas (v1.2)"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>Caixa baixa, na versão 1.3.</b> O jogo não tem minúscula nenhuma, e os códigos da tabela de caracteres estavam todos ocupados, quase todos por kana. Com o jogo em inglês, a maior parte dos kana deixou de aparecer: <b>26 deles viraram a–z</b>, na mesma grade da fonte de largura variável. O prólogo foi reescrito contra o japonês, as falas de uma linha não pulam mais entre a linha de cima e a de baixo, e o <b>nome do jogador</b> aparece nas falas pela primeira vez. A troca de kana por minúscula deixou visível todo japonês que sobrava, e ele foi traduzido: os <b>finais</b>, a mensagem pós-créditos, <b>70 falas da aventura</b>, o <b>menu de viagem</b>, a <b>tela de batalha</b> e os <b>nomes dos lutadores</b>.","en":"<b>Lowercase, in version 1.3.</b> The game has no lowercase at all, and the codes in its character table were all taken, almost all by kana. With the game in English, most of the kana stopped appearing: <b>26 of them became a–z</b>, on the same grid as the variable-width font. The prologue was rewritten against the Japanese, one-line dialogues no longer jump between the top line and the bottom one, and the <b>player's name</b> shows up in dialogue for the first time. Swapping kana for lowercase made every leftover bit of Japanese visible, and it was translated: the <b>endings</b>, the post-credits message, <b>70 adventure lines</b>, the <b>travel menu</b>, the <b>battle screen</b> and the <b>fighters' names</b>.","es":"<b>Minúsculas, en la versión 1.3.</b> El juego no tiene ninguna minúscula, y los códigos de la tabla de caracteres estaban todos ocupados, casi todos por kana. Con el juego en inglés, la mayor parte de los kana dejó de aparecer: <b>26 de ellos se volvieron a–z</b>, en la misma rejilla de la fuente de ancho variable. El prólogo se reescribió contra el japonés, las frases de una línea ya no saltan entre la línea de arriba y la de abajo, y el <b>nombre del jugador</b> aparece en los diálogos por primera vez. Cambiar kana por minúscula dejó a la vista todo el japonés que sobraba, y se tradujo: los <b>finales</b>, el mensaje tras los créditos, <b>70 frases de la aventura</b>, el <b>menú de viaje</b>, la <b>pantalla de batalla</b> y los <b>nombres de los luchadores</b>."}},{"t":{"pt":"<b>2.581 linhas</b> — o roteiro inteiro, e <b>98,6% dos glifos na tela são latinos</b>. O que sobra de japonês são quatro trechos que não são fala: são dados que o extrator lê como texto.","en":"<b>2,581 lines</b> — the whole script, and <b>98.6% of the glyphs on screen are Latin</b>. What remains in Japanese is four stretches that are not dialogue: data the extractor reads as text.","es":"<b>2.581 líneas</b> — el guion entero, y el <b>98,6% de los glifos en pantalla son latinos</b>. Lo que queda en japonés son cuatro tramos que no son diálogo: datos que el extractor lee como texto."}},{"t":{"pt":"<b>Fonte de largura variável</b>, a única do catálogo. Uma latina de 5×7 desenhada do zero, avanço médio de 6 px em vez de 8, e uma rotina de 718 bytes no banco que fica fixo durante o diálogo. Sem ela, <code>MAGIC KNIGHTS</code> não cabe nos 12 caracteres da caixa e sai <code>MG KNIGHTS</code>.","en":"<b>Variable-width font</b>, the only one in the catalogue. A 5×7 Latin face drawn from scratch, 6 px average advance instead of 8, and a 718-byte routine in the bank that stays mapped during dialogue. Without it, <code>MAGIC KNIGHTS</code> does not fit the box's 12 characters and comes out <code>MG KNIGHTS</code>.","es":"<b>Fuente de ancho variable</b>, la única del catálogo. Una latina de 5×7 dibujada desde cero, avance medio de 6 px en vez de 8, y una rutina de 718 bytes en el banco que queda fijo durante el diálogo. Sin ella, <code>MAGIC KNIGHTS</code> no cabe en los 12 caracteres de la caja y sale <code>MG KNIGHTS</code>."}},{"t":{"pt":"<b>54 palavras cortadas no meio</b>, consertadas na versão <b>1.2</b>. A tela mostrava <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> e <code>ICE ARO</code> — falas truncadas à mão, numa passagem antiga, para caber nos poucos bytes do vão. Foram achadas varrendo o roteiro inteiro contra um dicionário e procurando <b>palavra que é prefixo de outra</b>, que é a assinatura de um corte.","en":"<b>54 words cut in half</b>, fixed in version <b>1.2</b>. The screen was showing <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> and <code>ICE ARO</code> — lines hand-truncated, in an earlier pass, to fit the gap's few bytes. They were found by sweeping the whole script against a dictionary looking for <b>a word that is a prefix of another</b>, which is the signature of a cut.","es":"<b>54 palabras cortadas por la mitad</b>, corregidas en la versión <b>1.2</b>. La pantalla mostraba <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> e <code>ICE ARO</code> — frases truncadas a mano, en una pasada anterior, para caber en los pocos bytes del hueco. Se encontraron barriendo el guion entero contra un diccionario y buscando <b>una palabra que es prefijo de otra</b>, que es la firma de un corte."}},{"t":{"pt":"<b>285 falas reescritas mais curtas</b>, na versão <b>1.1</b>. Cabiam na caixa em byte, mas não na linha, e o inseridor cortava cada uma na última palavra que coubesse: a tela mostrava <code>THANK YOU,</code> onde a fala é <code>THANK YOU, CALDINA!</code> e <code>FAREWELL!</code> onde é <code>FAREWELL! OHOHOHO!</code>. Eram <b>286 falas estourando a linha e 294 vãos cortados</b>; agora são <b>zero</b>, e em nenhum vão o patch antigo do Pearse aparece mais.","en":"<b>285 lines rewritten shorter</b>, in version <b>1.1</b>. They fitted the box in bytes but not on the line, and the inserter cut each one at the last word that fitted: the screen showed <code>THANK YOU,</code> where the line is <code>THANK YOU, CALDINA!</code> and <code>FAREWELL!</code> where it is <code>FAREWELL! OHOHOHO!</code>. There were <b>286 lines overflowing and 294 gaps cut short</b>; now there are <b>none</b>, and no gap falls back to the old Pearse patch any more.","es":"<b>285 frases reescritas más cortas</b>, en la versión <b>1.1</b>. Cabían en la caja en bytes, pero no en la línea, y el insertador cortaba cada una en la última palabra que entrara: la pantalla mostraba <code>THANK YOU,</code> donde la frase es <code>THANK YOU, CALDINA!</code> y <code>FAREWELL!</code> donde es <code>FAREWELL! OHOHOHO!</code>. Eran <b>286 frases desbordando la línea y 294 huecos cortados</b>; ahora son <b>cero</b>, y en ningún hueco aparece ya el parche antiguo de Pearse."}},{"t":{"pt":"<b>As telas, não só o roteiro</b>: título, entrada de nome (agora A-Z e <b>seis letras</b> em vez de quatro), parâmetros, contador de dias, nomes de lugar, o painel de humor das três guerreiras e a tela de status.","en":"<b>The screens, not just the script</b>: title, name entry (now A-Z and <b>six letters</b> instead of four), parameters, day counter, place names, the three Knights' mood panel and the status screen.","es":"<b>Las pantallas, no solo el guion</b>: título, entrada de nombre (ahora A-Z y <b>seis letras</b> en vez de cuatro), parámetros, contador de días, nombres de lugar, el panel de humor de las tres Guerreras y la pantalla de estado."}}]},{"titulo":{"pt":"Testado até o fim","en":"Tested to the end","es":"Probado hasta el final"},"itens":[{"t":{"pt":"<b>Os 11 finais</b>, cada um alcançado do primeiro dia na versão em inglês e gravado em vídeo até o fim dos créditos. O roteiro inteiro passou por duas leituras: uma com o japonês ao lado, conferindo sentido, e outra só em inglês, como quem joga. Salvar e carregar, a tela de nome e o teste de som também foram vistos na tela.","en":"<b>All 11 endings</b>, each one reached from day one on the English version and recorded on video to the end of the credits. The whole script went through two readings: one with the Japanese alongside, checking meaning, and one in English only, the way a player reads it. Saving and loading, the name screen and the sound test were also checked on screen.","es":"<b>Los 11 finales</b>, cada uno alcanzado desde el primer día en la versión en inglés y grabado en vídeo hasta el final de los créditos. El guion entero pasó por dos lecturas: una con el japonés al lado, comprobando el sentido, y otra solo en inglés, como la lee quien juega. Guardar y cargar, la pantalla de nombre y el test de sonido también se vieron en pantalla."}},{"t":{"pt":"<b>Versão 1.4.4.</b> Cada nome agora é o mesmo em todo lugar (lista, falas e manual), as falas dizem o nome inteiro do item, a tela de nome aceita minúsculas e mais de 150 falas foram reescritas na revisão.","en":"<b>Version 1.4.4.</b> Every name is now the same everywhere (list, dialogue and manual), dialogue gives the item's full name, the name screen takes lowercase, and over 150 lines were rewritten in review.","es":"<b>Versión 1.4.4.</b> Cada nombre es ahora el mismo en todas partes (lista, diálogos y manual), los diálogos dicen el nombre completo del objeto, la pantalla de nombre acepta minúsculas y más de 150 frases se reescribieron en la revisión."}}]}],"patch":{"release":"magic-knight-rayearth-2-v1.4.4","versoes":{"en":{"arquivo":"magic-knight-rayearth-2-en.ips","tamanho":"74 KB"},"pt":null,"es":null},"rom":"Magic Knight Rayearth 2 (Japan).gg","rom_md5":"b19256c6716147a9744f5bd528f14450"},"fotos":[{"f":"mkr2/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O título redesenhado, com a versão no canto.","en":"The redrawn title, with the version in the corner.","es":"El título redibujado, con la versión en la esquina."}},{"f":"mkr2/05-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Antes do logo da SEGA, com a versão e o build.","en":"Before the SEGA logo, with the version and build.","es":"Antes del logo de SEGA, con la versión y el build."}},{"f":"mkr2/02-batalha.png","t":{"pt":"A batalha","en":"The battle","es":"La batalla"},"c":{"pt":"Até a versão 1.3.4 esta tela saía em japonês, e o número de dano vinha partido.","en":"Up to version 1.3.4 this screen was in Japanese, and the damage number came out split.","es":"Hasta la versión 1.3.4 esta pantalla salía en japonés, y el número de daño venía partido."}},{"f":"mkr2/03-autozam.png","t":{"pt":"Os mundos","en":"The worlds","es":"Los mundos"},"c":{"pt":"<code>AUTOZAM</code> inteiro numa caixa de doze caracteres.","en":"<code>AUTOZAM</code> whole in a twelve-character box.","es":"<code>AUTOZAM</code> entero en una caja de doce caracteres."}},{"f":"mkr2/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"A fonte de largura variável, em caixa baixa desde a versão 1.3, com o nome do jogador.","en":"The variable-width font, in lowercase since version 1.3, with the player's name.","es":"La fuente de ancho variable, en minúsculas desde la versión 1.3, con el nombre del jugador."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"feito","longplay":"feito"}},{"slug":"maniac-mansion","nome":"Maniac Mansion","subtitulo":"マニアックマンション","jp":"マニアックマンション","publisher":"Jaleco","dev":"Lucasfilm Ltd.","ano":1988,"data":"1988","sistema":"Famicom","mapper":"Mapper 2 submapper 2 (UOROM) · 256 KB PRG expandido para 512 KB · CHR-RAM","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"release","versao":"English v1.0.1","capa":"maniac/00-capa-patreon.jpg","linha":{"pt":"Um jogo ocidental que virou cartucho japonês, e não o contrário: o Dr. Fred, a Edna e o Dave, escritos em hiragana.","en":"A Western game that became a Japanese cartridge, rather than the other way round: Dr. Fred, Edna and Dave, written in hiragana.","es":"Un juego occidental que se volvió cartucho japonés, y no al revés: el Dr. Fred, Edna y Dave, escritos en hiragana."},"resumo":{"pt":["Os outros projetos desta casa partem todos de um jogo japonês. Este parte de um jogo <b>ocidental</b>, da <b>Lucasfilm Games</b>, que atravessou na direção contrária e virou cartucho de <b>Famicom</b>. Quem conhece a versão de casa reconhece a planta inteira: o <b>Dr. Fred</b> (<code>と゛くたーふれっと゛</code>), a enfermeira <b>Edna</b>, o filho mais velho <b>Ed</b>, a gosma roxa, a máquina de zumbis, a Sandy que foi levada, o meteoro no quintal — que a Edna trata por <code>めておさま</code>, com honorífico —, a <i>polícia do meteoro</i> que atende ao telefone e um <b>X-Wing</b> na parede de um quarto, que é o estúdio se citando. Na tela de título o logotipo continua latino, <code>PASSWORD</code> e <code>START</code> estão em inglês e a linha logo abaixo é kana. E a travessia mexeu no mundo, não só nas palavras: a máquina troca <b>moeda de 100 e de 10 ienes</b>, e a lata diz <b>354 mililitros</b>.","O cartucho tem <b>262.160 bytes</b>, é <b>mapper 2 submapper 2 (UOROM)</b>, com 256 KB de PRG em dezesseis bancos e CHR-RAM. A caixa de fala é apertada por código: no máximo <b>três linhas</b> (<code>LDX #3</code> em <code>0x30026</code>) e <b>dezessete colunas</b> (<code>CMP #$11</code> em <code>0x30086</code>), o que dá <b>51 caracteres</b> por mensagem; e o roteiro do jogo são <b>807 mensagens em 15.073 bytes</b>, repartidas em quatro blocos — descrições de objeto, falas, nomes de inventário e nomes de cenário. A ROM de fábrica guarda <b>1.578 bytes livres</b> na sua extensão inteira, sem folga no fim de banco nenhum e sem banco duplicado, e a razão do japonês para o inglês, medida numa amostra de 27 mensagens, é <b>1,424×</b> — o que põe o inglês perto de <b>21,5 KB</b>. Por isso o cartucho foi refeito, de <b>256 para 512 KB</b>. Com o mapper 2 o banco fixo é o <b>último</b>, e não o décimo quinto: o banco 31 nasce cópia do 15 e tudo que se escreve ali tem de ser escrito nos dois. O motor de texto passou a ser servido por um banco que não existia antes, alcançado por um <b>trampolim de 14 bytes</b> no banco fixo — e a prova é paridade: trocar o banco de onde o motor lê <b>não muda um pixel</b> do quadro.","A marca de origem está gravada no próprio cartucho, e é uma fonte pela metade. A de diálogo não tem letra latina nenhuma — guarda os <b>46 kana do gojūon</b>, os kana pequenos, o dakuten e o handakuten, os dígitos e a moldura da janela —, e a outra, latina, <b>vai de A a T</b>: de U a Z não há nada. O cartucho <b>não sabe escrever katakana</b>, então <i>cheese</i> vira <code>ちーす゛</code>, a motosserra vira <code>ちぇーんそー</code> e o Dave vira <code>て゛いふ゛</code>: o jogo inteiro, nomes estrangeiros inclusive, está escrito no silabário que a criança japonesa aprende primeiro. Nem o painel de comandos é texto — são <b>doze verbos em três fileiras de treze células</b>, desenhados como <b>tilemap fixo</b>. E dentro daquelas 51 células o japonês paga um pedágio que o inglês não paga, porque o dakuten e o handakuten são <b>caracteres próprios</b> e ocupam uma casa cada um: contado no roteiro inteiro, <b>1.367 dos 12.832 caracteres são só marca de sonoridade</b> — uma célula em cada dez. Agora tudo o que o jogo escreve está em inglês, e as cinco telas que traziam japonês <b>desenhado</b> foram redesenhadas. Dois revisores leram o roteiro inteiro com o japonês ao lado; o jogo foi atravessado por sete caminhos — os <b>quatro finais</b>, o GAME OVER e as senhas secretas —, cada um do <i>power-on</i> até o fim, e os <b>814 textos</b> foram vistos na tela um a um."],"en":["Every other project here starts from a Japanese game. This one starts from a <b>Western</b> one, by <b>Lucasfilm Games</b>, which crossed in the opposite direction and became a <b>Famicom</b> cartridge. Anyone who knows the home version recognises the whole floor plan: <b>Dr. Fred</b> (<code>と゛くたーふれっと゛</code>), nurse <b>Edna</b>, eldest son <b>Ed</b>, the purple slime, the zombie machine, the Sandy who was taken, the meteor in the yard — which Edna addresses as <code>めておさま</code>, with an honorific — the <i>meteor police</i> who answer the phone, and an <b>X-Wing</b> on a bedroom wall, the studio quoting itself. On the title screen the logo is still Latin, <code>PASSWORD</code> and <code>START</code> are in English, and the line just below is kana. And the crossing changed the world, not only the words: the machine takes a <b>100-yen and a 10-yen coin</b>, and the can reads <b>354 millilitres</b>.","The cartridge is <b>262,160 bytes</b>, <b>mapper 2 submapper 2 (UOROM)</b>, with 256 KB of PRG across sixteen banks and CHR-RAM. The dialogue box is squeezed in code: at most <b>three lines</b> (<code>LDX #3</code> at <code>0x30026</code>) and <b>seventeen columns</b> (<code>CMP #$11</code> at <code>0x30086</code>), which comes to <b>51 characters</b> a message; and the game's script is <b>807 messages in 15,073 bytes</b>, split across four blocks — object descriptions, spoken lines, inventory names and scenery names. The factory ROM holds <b>1,578 free bytes</b> across its entire length, with no slack at the end of any bank and no duplicated bank, and the ratio of Japanese to English, measured over a sample of 27 messages, is <b>1.424×</b> — which puts the English near <b>21.5 KB</b>. So the cartridge was rebuilt, from <b>256 to 512 KB</b>. Under mapper 2 the fixed bank is the <b>last</b> one, not the fifteenth: bank 31 is born as a copy of bank 15, and whatever is written there has to be written in both. The text engine is now served by a bank that did not exist before, reached through a <b>14-byte trampoline</b> in the fixed bank — and the proof is parity: changing which bank the engine reads from <b>does not move a single pixel</b> of the frame.","The mark of origin is burned into the cartridge itself, and it is a font left half done. The dialogue font holds no Latin letter at all — the <b>46 kana of the gojūon</b>, the small kana, dakuten and handakuten, the digits and the window frame — and the other one, the Latin font, <b>runs from A to T</b>: from U to Z there is nothing. The cartridge <b>cannot write katakana</b>, so <i>cheese</i> becomes <code>ちーす゛</code>, the chainsaw becomes <code>ちぇーんそー</code> and Dave becomes <code>て゛いふ゛</code>: the entire game, foreign names included, is written in the syllabary a Japanese child learns first. Not even the command panel is text — it is <b>twelve verbs in three rows of thirteen cells</b>, drawn as a <b>fixed tilemap</b>. And inside those 51 cells the Japanese pays a toll English does not, because dakuten and handakuten are <b>characters in their own right</b> and take a cell each: counted across the whole script, <b>1,367 of the 12,832 characters are nothing but voicing marks</b> — one cell in every ten. Everything the game writes is now in English, and the five screens that carried Japanese <b>drawn into the artwork</b> have been redrawn. Two reviewers read the whole script against the Japanese; the game was played through seven routes — the <b>four endings</b>, the GAME OVER and the secret passwords — each one from <i>power-on</i> to the finish, and all <b>814 texts</b> were seen on screen one by one."],"es":["Los demás proyectos de esta casa parten todos de un juego japonés. Este parte de uno <b>occidental</b>, de <b>Lucasfilm Games</b>, que cruzó en dirección contraria y se volvió cartucho de <b>Famicom</b>. Quien conoce la versión de ordenador reconoce el plano entero: el <b>Dr. Fred</b> (<code>と゛くたーふれっと゛</code>), la enfermera <b>Edna</b>, el hijo mayor <b>Ed</b>, la baba morada, la máquina de zombis, la desaparición de Sandy, el meteorito del jardín — al que Edna trata de <code>めておさま</code>, con honorífico —, la <i>policía del meteorito</i> que atiende el teléfono y un <b>X-Wing</b> en la pared de un cuarto, que es el estudio citándose a sí mismo. En la pantalla de título el logotipo sigue siendo latino, <code>PASSWORD</code> y <code>START</code> están en inglés y la línea de justo debajo es kana. Y la travesía tocó el mundo, no solo las palabras: la máquina acepta <b>moneda de 100 y de 10 yenes</b>, y la lata dice <b>354 mililitros</b>.","El cartucho tiene <b>262.160 bytes</b>, es <b>mapper 2 submapper 2 (UOROM)</b>, con 256 KB de PRG en dieciséis bancos y CHR-RAM. La caja de diálogo la aprieta el código: como mucho <b>tres líneas</b> (<code>LDX #3</code> en <code>0x30026</code>) y <b>diecisiete columnas</b> (<code>CMP #$11</code> en <code>0x30086</code>), lo que da <b>51 caracteres</b> por mensaje; y el guion del juego son <b>80
