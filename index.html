).nes","rom_md5":"47910069aa92dcac1b0fa4929cc7ceff"},"fotos":[{"f":"fj2/01-tela-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado pixel a pixel e o selo <code>DEFINITIVE EDITION</code>, que não custou um byte a mais.","en":"The logo redrawn pixel by pixel, and the <code>DEFINITIVE EDITION</code> seal, which cost no extra bytes.","es":"El logo redibujado píxel a píxel, y el sello <code>DEFINITIVE EDITION</code>, que no costó bytes de más."}},{"f":"fj2/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Tela nova antes do título, em 355 bytes de espaço morto.","en":"A new screen before the title, in 355 bytes of dead space.","es":"Una pantalla nueva antes del título, en 355 bytes de espacio muerto."}},{"f":"fj2/04-prologo-novo.png","t":{"pt":"Prólogo novo","en":"New prologue","es":"Prólogo nuevo"},"c":{"pt":"Cinco páginas escritas do zero, recapitulando o primeiro jogo de 1989.","en":"Five newly written pages recapping the 1989 first game.","es":"Cinco páginas escritas de cero que recapitulan el primer juego de 1989."}},{"f":"fj2/05-espirito-jump-world.png","t":{"pt":"O espírito do Jump World","en":"The spirit of Jump World","es":"El espíritu del Jump World"},"c":{"pt":"A abertura, agora em português.","en":"The opening, now in English.","es":"La apertura, ahora en español."}},{"f":"fj2/06-lista-sete-campeoes.png","t":{"pt":"A lista dos sete","en":"The champion list","es":"La lista de los siete"},"c":{"pt":"A tela do bug: seis nomes que, até esta correção, eram sempre os mesmos.","en":"The bug screenshot: six names that, until this fix, were always the same six.","es":"La pantalla del error: seis nombres que, hasta esta corrección, eran siempre los mismos seis."}},{"f":"fj2/07-e-voce-tambem-goku.png","t":{"pt":"\"E você também, Goku.\"","en":"\"That goes for you too, Goku.\"","es":"\"Y tú también, Goku.\""},"c":{"pt":"A fala que ninguém tinha visto em trinta e cinco anos.","en":"The line nobody had seen in thirty-five years.","es":"La frase que nadie había visto en treinta y cinco años."}},{"f":"fj2/03-menu-ingles.png","t":{"pt":"Menus","en":"Menus","es":"Menús"},"c":{"pt":"Status, loja, depósito e treino — 77 textos.","en":"Status, shop, storage and training — 77 strings.","es":"Estado, tienda, almacén y entrenamiento — 77 textos."}},{"f":"fj2/08-soulring.png","t":{"pt":"Itens","en":"Items","es":"Objetos"},"c":{"pt":"Nomes e descrições, encurtados só quando o campo exige.","en":"Names and descriptions, shortened only where the field demands it.","es":"Nombres y descripciones, acortados solo donde el campo lo exige."}}]},{"slug":"dragon-ball-3","nome":"Dragon Ball 3","subtitulo":"Gokuu Den","jp":"ドラゴンボール3 悟空伝","traducao_titulo":"Legend of Goku","publisher":"Bandai","dev":"Bandai","ano":1989,"data":"1989","sistema":"Famicom","mapper":"Mapper 16 (Bandai FCG-1/2) · 128 KB PRG expanded to 256 KB · 256 KB CHR","categoria":{"pt":"Tradução + arte","en":"Translation + artwork","es":"Traducción + arte"},"nivel":"alfa","versao":"English v1.0 · Português v1.0","capa":"db3/01-titulo.png","linha":{"pt":"Dragon Ball em cartas, 1989. O número de defesa da carta era um kanji desenhado na arte; agora é algarismo, e o treino deixou de ser no chute.","en":"Dragon Ball as a 1989 card RPG. The defence number was a kanji drawn into the art; now it is a digit, and training is no longer guesswork.","es":"Dragon Ball en cartas, 1989. El número de defensa era un kanji dibujado en la ilustración; ahora es una cifra que se puede leer."},"resumo":{"pt":["Este é o Dragon Ball de tabuleiro: você anda pelo mapa, tira uma carta e luta com ela. O jogo reconta a saga do Goku desde o começo — a caça às esferas do dragão, o Torneio de Artes Marciais, o Rei Cutelo — e é a Bandai levando o mangá ao Famicom em 1989, com o baralho decidindo o turno anos antes de isso virar um gênero.","Cada carta traz uma bola com o <b>número de defesa</b> embaixo, e esse número era um <b>algarismo kanji</b> desenhado nos gráficos: 一二三四五六. Não é enfeite — o jogo manda compará-lo. O Karin só aceita carta com defesa igual ou maior que a dele, e o Mr. Popo aceita carta que bata em estrelas, técnica <i>ou</i> defesa. Quem não lê kanji jogava dois dos três treinos no chute. As seis bolas foram repintadas com <b>algarismo latino</b>, e a arte é tão parecida entre elas que só <b>53 pixels divergem</b> nos seis blocos de 16×16, todos no miolo onde morava o kanji. Os dez kanji das cartas — 拳 蹴 連 必 術 逃 ? 体 特 武 — também são tiles desenhados à mão, e viraram rótulos de três letras numa <b>mini-fonte de 5×7 px</b> feita para o caso: três letras de 5 px ocupam 15 dos 16 px do slot, sem espaço entre elas. O sentido de cada uma foi conferido contra o manual da Bandai de 1989, e foi ele que corrigiu a carta 体, que não é defesa: 体当り é investida corporal, um ataque.","O roteiro inteiro está em inglês — <b>1.305 de 1.305 mensagens</b>, mais as 40 de batalha e treino — dentro de uma caixa de <b>três linhas por vinte e quatro colunas</b> que o jogo não sabe continuar na tela seguinte. <b>164 mensagens</b> passavam de 45 glifos no japonês e foram reescritas para caber sem perder o sentido, e <b>254</b> das que ficaram fecham sem uma coluna sobrando. O título 悟空伝 foi refeito como <code>LEGEND OF GOKU</code> dentro dos mesmos 96×32 pixels, a ROM cresceu de <b>128 para 256 KB</b>, e a grade de senha virou letras latinas sem colisão entre símbolos: <b>quem tem uma senha anotada desde 1989 pode digitá-la aqui</b>."],"en":["This is Dragon Ball as a board game: you move across the map, draw a card and fight with it. It retells Goku's saga from the beginning — the hunt for the dragon balls, the Martial Arts Tournament, King Piccolo — and it is Bandai bringing the manga to the Famicom in 1989, with the deck deciding the turn years before that became a genre.","Every card carries a ball with its <b>defence number</b> underneath, and that number was a <b>kanji numeral</b> drawn into the graphics: 一二三四五六. It is not decoration — the game tells you to compare it. Karin only accepts a card whose defence matches or beats his own, and Mr. Popo accepts a card that wins on stars, technique <i>or</i> defence. Anyone who cannot read kanji was guessing through two of the three trainings. The six balls were repainted with <b>Latin digits</b>, and the artwork is so nearly identical between them that only <b>53 pixels differ</b> across the six 16×16 blocks, all in the core where the kanji used to sit. The ten card kanji — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn tiles too, and became three-letter labels in a <b>5×7 px mini-font</b> built for the job: three 5 px letters fill 15 of the slot's 16 px, with no gap between them. Each meaning was checked against Bandai's 1989 manual, and it was the manual that corrected the 体 card, which is not defence: 体当り is a body slam, an attack.","The whole script is in English — <b>1,305 of 1,305 messages</b>, plus the 40 for battle and training — inside a box of <b>three lines by twenty-four columns</b> that the game cannot continue onto a following screen. <b>164 messages</b> ran past 45 glyphs in Japanese and were rewritten to fit without losing their sense, and <b>254</b> of those that stayed close with not a column to spare. The 悟空伝 title was remade as <code>LEGEND OF GOKU</code> inside the same 96×32 pixels, the ROM grew from <b>128 to 256 KB</b>, and the password grid became Latin letters with no symbol collisions: <b>a password written down in 1989 still types in</b>."],"es":["Este es el Dragon Ball de tablero: avanzas por el mapa, robas una carta y luchas con ella. El juego vuelve a contar la saga de Goku desde el principio — la caza de las <b>Bolas de Dragón</b>, el Torneo de Artes Marciales, el Rey Piccolo — y es Bandai la que lleva el manga al Famicom en 1989, con la baraja decidiendo el turno años antes de que aquello fuera un género.","Cada carta lleva una bola con el <b>número de defensa</b> debajo, y ese número era un <b>numeral kanji</b> dibujado en los gráficos: 一二三四五六. No es adorno — el juego te manda compararlo. Karin solo acepta una carta con defensa igual o mayor que la suya, y Mr. Popo acepta cualquier carta que gane en estrellas, técnica <i>o</i> defensa. Quien no leía kanji jugaba dos de los tres entrenamientos a ciegas. Las seis bolas se repintaron con <b>cifra latina</b>, y las ilustraciones se parecen tanto entre sí que solo <b>53 píxeles difieren</b> en los seis bloques de 16×16, todos en el centro donde vivía el kanji. Los diez kanji de las cartas — 拳 蹴 連 必 術 逃 ? 体 特 武 — también son tiles dibujados a mano, y pasaron a ser etiquetas de tres letras en una <b>minifuente de 5×7 px</b> hecha para el caso: tres letras de 5 px ocupan 15 de los 16 px de la casilla, sin espacio entre ellas. El sentido de cada una se cotejó con el manual de Bandai de 1989, y fue él quien corrigió la carta 体, que no es defensa: 体当り es una embestida, un ataque.","El guion entero está en inglés — <b>1.305 de 1.305 mensajes</b>, más los 40 de combate y entrenamiento — dentro de una caja de <b>tres líneas por veinticuatro columnas</b> que el juego no sabe continuar en la pantalla siguiente. <b>164 mensajes</b> pasaban de 45 glifos en japonés y se reescribieron para caber sin perder el sentido, y <b>254</b> de los que quedaron cierran sin una columna de sobra. El título 悟空伝 se rehízo como <code>LEGEND OF GOKU</code> dentro de los mismos 96×32 píxeles, la ROM creció de <b>128 a 256 KB</b>, y la rejilla de contraseña pasó a letras latinas sin colisiones entre símbolos: <b>quien tenga una contraseña anotada en 1989 puede escribirla aquí</b>."]},"numeros":[{"v":"1,305","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"96","r":{"pt":"nomes, golpes e nomes de batalha","en":"names, techniques and battle names","es":"nombres, técnicas y nombres de batalla"}},{"v":"10","r":{"pt":"kanji redesenhados como arte","en":"kanji redrawn as artwork","es":"kanji redibujados como ilustración"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.305 de 1.305 mensagens</b> em inglês — o roteiro inteiro","en":"<b>1,305 of 1,305 messages</b> in English — the entire script","es":"<b>1.305 de 1.305 mensajes</b> en inglés — el guion entero"},"foto":"db3/04-dialogo.png"},{"t":{"pt":"<b>66 personagens e inimigos, 14 golpes, 16 nomes de batalha</b>, com o glossário casado com os nomes oficiais da Viz","en":"<b>66 characters and enemies, 14 techniques, 16 battle names</b>, with the glossary matched to the official Viz names","es":"<b>66 personajes y enemigos, 14 técnicas, 16 nombres de batalla</b>, con el glosario casado con los nombres oficiales de Viz"}},{"t":{"pt":"O limite não é o comprimento do texto, é a <b>caixa</b>: três linhas por vinte e quatro colunas, e o jogo não tem código de continuação. <b>164 mensagens</b> tinham 45 ou mais glifos no japonês e foram comprimidas sem perder o sentido.","en":"The limit is not the length of the text, it is the <b>box</b>: three lines by twenty-four columns, and the game has no continuation code. <b>164 messages</b> ran to 45 or more glyphs in Japanese and were compressed without losing their sense.","es":"El límite no es la longitud del texto, es la <b>caja</b>: tres líneas por veinticuatro columnas, y el juego no tiene código de continuación. <b>164 mensajes</b> llegaban a 45 o más glifos en japonés y se comprimieron sin perder el sentido."}},{"t":{"pt":"Os <b>614 pares</b> de aspas japonesas「 」viraram aspas latinas <b>sem custar um byte</b>.","en":"The <b>614 pairs</b> of Japanese quotation marks 「 」 became Latin quotes <b>at no byte cost</b>.","es":"Los <b>614 pares</b> de comillas japonesas 「 」 pasaron a comillas latinas <b>sin costar un byte</b>."}}]},{"titulo":{"pt":"O que não era texto","en":"What was not text","es":"Lo que no era texto"},"itens":[{"t":{"pt":"<b>Os dez kanji das cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — são tiles de 16×16 desenhados à mão, não caracteres. Viraram abreviações latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por isso a <code>かんじのカード</code> virou <b>symbol card</b> e não \"kanji card\": chamar de kanji viraria mentira na tela.","en":"<b>The ten card kanji</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn 16×16 tiles, not characters. They became Latin abbreviations: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. That is why <code>かんじのカード</code> became <b>symbol card</b> and not \"kanji card\": calling it kanji would have been a lie on screen.","es":"<b>Los diez kanji de las cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — son tiles de 16×16 dibujados a mano, no caracteres. Pasaron a ser abreviaturas latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por eso la <code>かんじのカード</code> pasó a ser <b>symbol card</b> y no \"kanji card\": llamarla kanji sería mentira en pantalla."},"foto":"db3/05-cartas.png"},{"t":{"pt":"<b>As seis bolas de defesa</b> traziam os numerais cursivos 一 a 六, também desenhados. Agora trazem <b>1 a 6</b>.","en":"<b>The six defence balls</b> carried the cursive numerals 一 to 六, also drawn. They now carry <b>1 to 6</b>.","es":"<b>Las seis bolas de defensa</b> llevaban los numerales cursivos 一 a 六, también dibujados. Ahora llevan <b>1 a 6</b>."}},{"t":{"pt":"<b>O título 悟空伝</b> — doze tiles por quatro, 96×32 pixels de arte — foi redesenhado como <code>LEGEND OF GOKU</code>, dentro do mesmo espaço.","en":"<b>The 悟空伝 title</b> — twelve tiles by four, 96×32 pixels of artwork — was redrawn as <code>LEGEND OF GOKU</code>, inside the same space.","es":"<b>El título 悟空伝</b> — doce tiles por cuatro, 96×32 píxeles de ilustración — fue redibujado como <code>LEGEND OF GOKU</code>, dentro del mismo espacio."},"foto":"db3/01-titulo.png"}]},{"titulo":{"pt":"A senha, e a promessa de não quebrá-la","en":"The password, and the promise not to break it","es":"La contraseña, y la promesa de no romperla"},"itens":[{"t":{"pt":"<b>A grade de senha virou letras latinas</b>, sem colisão entre símbolos — e <b>as senhas antigas continuam válidas</b>. Quem tem uma senha anotada de 1989 pode digitá-la aqui.","en":"<b>The password grid became Latin letters</b>, with no collisions between symbols — and <b>old passwords remain valid</b>. Anyone with a password written down since 1989 can type it in here.","es":"<b>La rejilla de contraseña pasó a letras latinas</b>, sin colisiones entre símbolos — y <b>las contraseñas antiguas siguen valiendo</b>. Quien tenga una anotada de 1989 puede escribirla aquí."},"foto":"db3/06-senha.png"},{"t":{"pt":"<b>Tela de créditos do patch</b> antes do título — página branca, 5 segundos, pula com A ou START.","en":"<b>A patch credits screen</b> before the title — white page, 5 seconds, skippable with A or START.","es":"<b>Pantalla de créditos del parche</b> antes del título — página blanca, 5 segundos, se salta con A o START."},"foto":"db3/02-creditos.png"}]},{"titulo":{"pt":"A ROM cresceu, e a original não foi tocada","en":"The ROM grew, and the original was never touched","es":"La ROM creció, y la original nunca se tocó"},"itens":[{"t":{"pt":"O texto inglês não cabia na origem, então a ROM foi <b>expandida de 128 KB para 256 KB</b> de código. O construtor monta a ROM inteira do zero, <b>nunca escreve na original</b> (ela é somente leitura, e o MD5 é conferido ao abrir) e <b>aborta se qualquer byte mudar fora das regiões declaradas</b>.","en":"The English text did not fit where it was, so the ROM was <b>expanded from 128 KB to 256 KB</b> of code. The builder assembles the whole ROM from scratch, <b>never writes to the original</b> (it is read-only, and the MD5 is checked on open) and <b>aborts if any byte changes outside the declared regions</b>.","es":"El texto inglés no cabía donde estaba, así que la ROM se <b>amplió de 128 KB a 256 KB</b> de código. El constructor monta la ROM entera desde cero, <b>nunca escribe en la original</b> (es de solo lectura, y el MD5 se comprueba al abrir) y <b>aborta si cambia cualquier byte fuera de las regiones declaradas</b>."}},{"t":{"pt":"Um verificador confere <b>as 1.305 mensagens e os 112 nomes</b> na ROM montada antes de qualquer coisa sair.","en":"A checker verifies <b>all 1,305 messages and 112 names</b> on the assembled ROM before anything ships.","es":"Un verificador comprueba <b>los 1.305 mensajes y los 112 nombres</b> en la ROM montada antes de que salga nada."}}]},{"titulo":{"pt":"Batalha e treino, fechados","en":"Battle and training, closed","es":"Combate y entrenamiento, cerrados"},"itens":[{"t":{"pt":"As <b>40 mensagens</b> de batalha e treino, nos dois blocos do banco 3, estão traduzidas — <b>inclusive as que carregam um número no meio</b>, disfarçado de espaço. Era a última coisa que segurava o lançamento: encurtar o texto sem saber como o jogo posiciona esse número poria o algarismo no meio de uma palavra.","en":"The <b>40 messages</b> of battle and training, across both blocks in bank 3, are translated — <b>including the ones carrying a number in the middle</b>, disguised as a space. It was the last thing holding up the release: shortening the text without knowing how the game places that number would put the digit inside a word.","es":"Los <b>40 mensajes</b> de combate y entrenamiento, en los dos bloques del banco 3, están traducidos — <b>incluidos los que llevan un número en medio</b>, disfrazado de espacio. Era lo último que frenaba el lanzamiento: acortar el texto sin saber cómo coloca el juego ese número pondría la cifra dentro de una palabra."}},{"t":{"pt":"A versão do patch vai <b>queimada na tela de créditos</b>, e não só no nome do arquivo — quem baixa joga a imagem, não o nome. É assim que se sabe, meses depois, qual build está no cartucho.","en":"The patch version is <b>burned into the credits screen</b>, not just into the file name — whoever downloads plays the image, not the name. That is how you know, months later, which build is on the cartridge.","es":"La versión del parche va <b>grabada en la pantalla de créditos</b>, y no solo en el nombre del archivo — quien descarga juega la imagen, no el nombre. Así se sabe, meses después, qué build está en el cartucho."}}]},{"titulo":{"pt":"O português, e a fonte que ganhou acento","en":"Portuguese, and the font that grew accents","es":"El portugués, y la fuente que ganó acentos"},"itens":[{"t":{"pt":"O jogo também está <b>inteiro em português</b> — as mesmas 1.305 mensagens, os 96 nomes e todas as tabelas fora do roteiro: o menu do modo Aventura, os rótulos de carta, o subtítulo do título, batalha e treino. Os nomes seguem a <b>dublagem brasileira</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","en":"The game is also <b>entirely in Portuguese</b> — the same 1,305 messages, the 96 names and every table outside the script: the Adventure mode menu, the card labels, the title subtitle, battle and training. The names follow the <b>Brazilian dub</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","es":"El juego está también <b>entero en portugués</b> — los mismos 1.305 mensajes, los 96 nombres y todas las tablas fuera del guion: el menú del modo Aventura, las etiquetas de carta, el subtítulo del título, combate y entrenamiento. Los nombres siguen el <b>doblaje brasileño</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão."}},{"t":{"pt":"A fonte não tinha acentos, e o espaço para eles estava dentro do próprio tile: a minúscula ocupa as linhas 2 a 6, então <b>as linhas 0 e 1 sobram</b> e o acento sai de graça. A maiúscula ocupa 0 a 6 e não sobra nada — ela é comprimida e o acento vira uma marca de uma linha. Comprimir cortando a linha de baixo fez o <code>E</code> virar <code>F</code> na tela; corta-se uma linha <b>repetida do meio</b>. E o circunflexo com pernas de 2 px coladas ao ápice lia-se como agudo — <code>três</code> saía <code>trés</code>. Quatro desenhos lado a lado decidiram o que a medição não decidia.","en":"The font had no accents, and the room for them was inside the tile itself: lowercase occupies rows 2 to 6, so <b>rows 0 and 1 are free</b> and the accent costs nothing. Uppercase occupies 0 to 6 with nothing to spare — the letter is compressed and the accent becomes a one-row mark. Compressing by cutting the bottom row turned <code>E</code> into <code>F</code> on screen; the row to cut is a <b>repeated one in the middle</b>. And a circumflex with 2 px legs touching the apex read as an acute — <code>três</code> came out <code>trés</code>. Four drawings side by side settled what measurement could not.","es":"La fuente no tenía acentos, y el sitio para ellos estaba dentro del propio tile: la minúscula ocupa las filas 2 a 6, así que <b>las filas 0 y 1 sobran</b> y el acento sale gratis. La mayúscula ocupa 0 a 6 y no sobra nada — se comprime la letra y el acento pasa a ser una marca de una fila. Comprimir cortando la fila de abajo convirtió la <code>E</code> en <code>F</code> en pantalla; la fila que se corta es una <b>repetida del medio</b>. Y el circunflejo con patas de 2 px pegadas al vértice se leía como agudo — <code>três</code> salía <code>trés</code>. Cuatro dibujos uno al lado del otro decidieron lo que la medición no decidía."}},{"t":{"pt":"O que aperta não é o byte: o roteiro português ocupa <b>85% do espaço</b> e caberia inteiro. O aperto é a <b>caixa de 24×3</b> — 387 mensagens já usavam as três linhas em inglês e <b>254 fechavam sem uma coluna sobrando</b>. Traduzir foi encaixar. As três tabelas de nome saíram em <b>417/417, 114/116 e 94/95 bytes</b>.","en":"What squeezes is not the byte: the Portuguese script fills <b>85% of the space</b> and would fit whole. The squeeze is the <b>24×3 box</b> — 387 messages already used all three lines in English and <b>254 closed with not a column to spare</b>. Translating meant fitting. The three name tables came out at <b>417/417, 114/116 and 94/95 bytes</b>.","es":"Lo que aprieta no es el byte: el guion portugués ocupa el <b>85% del espacio</b> y cabría entero. El aprieto es la <b>caja de 24×3</b> — 387 mensajes ya usaban las tres líneas en inglés y <b>254 cerraban sin una columna de sobra</b>. Traducir fue encajar. Las tres tablas de nombre salieron en <b>417/417, 114/116 y 94/95 bytes</b>."}},{"t":{"pt":"A ROM inglesa <b>não mudou um byte</b> para o português existir: o idioma entra por uma camada à parte, e o <code>md5</code> da build inglesa é o mesmo de antes.","en":"The English ROM <b>did not change by a byte</b> for Portuguese to exist: the language enters through a separate layer, and the English build's <code>md5</code> is the same as before.","es":"La ROM inglesa <b>no cambió ni un byte</b> para que existiera el portugués: el idioma entra por una capa aparte, y el <code>md5</code> de la build inglesa es el mismo de antes."}}]}],"patch":{"versoes":{"en":{"arquivo":"dragon-ball-3-en.ips","tamanho":"312 KB"},"pt":{"arquivo":"dragon-ball-3-pt.ips","tamanho":"310 KB"},"es":null},"rom":"Dragon Ball 3 - Gokuu Den (Japan) (Rev 1).nes","rom_md5":"0bc3d5d7d1e7f2206ce1c157402ff944"},"fotos":[{"f":"db3/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"悟空伝 redesenhado como <code>LEGEND OF GOKU</code>, dentro dos mesmos 96×32 pixels.","en":"悟空伝 redrawn as <code>LEGEND OF GOKU</code>, inside the same 96×32 pixels.","es":"悟空伝 redibujado como <code>LEGEND OF GOKU</code>, dentro de los mismos 96×32 píxeles."}},{"f":"db3/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Página branca antes do título, cinco segundos, pulável.","en":"A white page before the title, five seconds, skippable.","es":"Una página blanca antes del título, cinco segundos, se salta."}},{"f":"db3/03-menu.png","t":{"pt":"Menu","en":"Menu","es":"Menú"},"c":{"pt":"<code>GAME START</code> e <code>CONTINUE</code>, onde havia kana.","en":"<code>GAME START</code> and <code>CONTINUE</code>, where kana used to be.","es":"<code>GAME START</code> y <code>CONTINUE</code>, donde antes había kana."}},{"f":"db3/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"Três linhas por vinte e quatro colunas, e nenhum código de continuação para salvar quem estourar.","en":"Three lines by twenty-four columns, and no continuation code to rescue an overflow.","es":"Tres líneas por veinticuatro columnas, y ningún código de continuación que rescate un desbordamiento."}},{"f":"db3/05-cartas.png","t":{"pt":"As cartas","en":"The cards","es":"Las cartas"},"c":{"pt":"Os kanji desenhados viraram <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — arte redesenhada, não texto traduzido.","en":"The drawn kanji became <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — artwork redrawn, not text translated.","es":"Los kanji dibujados pasaron a <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — ilustración redibujada, no texto traducido."}},{"f":"db3/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"Grade latina sem colisão — e as senhas de 1989 continuam funcionando.","en":"A Latin grid with no collisions — and passwords from 1989 still work.","es":"Una rejilla latina sin colisiones — y las contraseñas de 1989 siguen funcionando."}},{"f":"db3/07-mapa.png","t":{"pt":"O tabuleiro","en":"The board","es":"El tablero"},"c":{"pt":"Onde o jogo acontece: anda, tira carta, luta.","en":"Where the game happens: move, draw a card, fight.","es":"Donde ocurre el juego: avanza, roba carta, lucha."}}]},{"slug":"pocket-monsters-stadium","nome":"Pocket Monsters Stadium","subtitulo":"ポケモンスタジアム","jp":"ポケモンスタジアム","publisher":"Nintendo","dev":"Creatures","ano":1998,"data":"1998","sistema":"Nintendo 64","mapper":"16 MB · compressão Yay0 · Transfer Pak","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"pms64/01-titulo.png","linha":{"pt":"Houve um Stadium antes do Stadium: o japonês de 1998, que nunca saiu do Japão — e o Ocidente jogou outro jogo, não outra edição.","en":"There was a Stadium before the Stadium: the 1998 Japanese one, which never left Japan — and the West played a different game, not another edition.","es":"Hubo un Stadium antes del Stadium: el japonés de 1998, que nunca salió de Japón — y Occidente jugó a otro juego, no a otra edición."},"resumo":{"pt":["Quase todo mundo de certa idade jogou <i>Pokémon Stadium</i> no Nintendo 64. Quase ninguém sabe que houve um antes dele: este cartucho, de <b>1998</b>, que se identifica como <code>POKEMON STADIUM</code> com país <code>J</code> e ficou no Japão. Que são dois jogos, e não duas edições do mesmo, está <b>medido</b>: o contêiner de texto do motor do Stadium ocidental — que é o Stadium 2 japonês — dá <b>zero ocorrência</b> aqui, varridas a ROM inteira e os 790 blocos descomprimidos. O que este tem são <b>quatro copas</b> nomeadas pelas bolas, da Poké Ball à Master Ball, cada uma com a sua regra de nível — nenhum acima do <b>30</b>, ou os três somando no máximo <b>155</b>, ou nível livre —, com <b>seis inscritos e três em quadra</b>, e aluguel para quem não traz time. Há <b>narração de jogada</b>, <code>じっきょう</code>, ligável no menu e com banco de áudio só dela, <code>JIKKYOU.WBK</code>, ao lado do <code>POKEBANK.WBK</code> dos gritos. E o cartucho lê o seu: pelo <b>Transfer Pak</b> ele reconhece os cartuchos de Game Boy <b>Red, Green, Blue e Yellow</b>, e tem mensagem para quando você o tira no meio da partida.","A escala é outra, e o número que a mostra é a compressão. A ROM tem <b>16 MB</b>. O formato é <b>Yay0</b>, e só ele: nem MIO0, nem Yaz0, nem gzip. São <b>790 blocos válidos</b>, <b>8.803.425 bytes</b> comprimidos que devolvem <b>19.528.124</b> — razão de <b>2,22×</b>, ou seja, <i>mais do que o cartucho inteiro comporta</i>. Duzentos e quinze desses blocos são o contêiner de assets <code>FRAGMENT</code>, com tabela de relocação em endereços absolutos de RAM sobre a base <code>0x8FF00000</code>. E a primeira âncora dura de dado de jogo é a <b>tabela de atributos base</b>, em <code>0x66901</code>, <b>23 bytes por entrada</b>, ordenada por número da Pokédex — provada por três âncoras independentes: Bulbasaur com <b>45/49/49/45/65</b> na primeira entrada, Charmander exatamente <b>três</b> entradas depois, Mewtwo exatamente <b>149</b> depois.","O texto, ao contrário dos assets, está <b>em claro</b>: <b>EUC-JP</b>, terminado em NUL e alinhado a quatro bytes, com hiragana em <code>0xA4xx</code>, katakana em <code>0xA5xx</code> e kanji a partir de <code>0xB0A1</code>. O que o escondia era a faixa de bytes: uma varredura por Shift-JIS tinha devolvido <b>15.593 caracteres</b> que eram bytes repetidos de textura caindo por acaso na faixa válida. O banco principal é uma lista contínua e legível de cima a baixo — as <b>151 espécies</b> com nome e categoria (<code>フシギダネ</code> / <code>たね</code>), emendando direto nos nomes de golpe, nos estados e nos tipos. E o encoding trabalha a favor de quem traduz, porque em EUC-JP cada kana custa <b>dois</b> bytes e cada letra inglesa custa <b>um</b>: <b>144 dos 151 nomes de espécie cabem no espaço que o japonês deixou</b>, sem mexer em ponteiro nenhum. Os sete que não cabem são os nomes japoneses curtos de equivalente inglês comprido — <code>ラッタ</code> tem 8 e <code>RATICATE</code> pede 9, <code>プリン</code> tem 8 e <code>JIGGLYPUFF</code> pede 11. Um último traço do console, que barra edição feita de olho fechado: o CRC deste cartucho é <b>CIC-6103</b>, semente <code>0xA3886759</code> e combinador de soma, e o IPL3 dele <b>subtrai <code>0x100000</code> do ponto de entrada</b> — o cabeçalho diz <code>0x80100400</code> e o jogo roda em <code>0x80000400</code>. Esta página é para acompanhar o trabalho."],"en":["Almost everyone of a certain age played <i>Pokémon Stadium</i> on the Nintendo 64. Almost nobody knows there was one before it: this cartridge, from <b>1998</b>, which identifies itself as <code>POKEMON STADIUM</code> with country <code>J</code> and stayed in Japan. That these are two games, and not two editions of one, is <b>measured</b>: the text container used by the Western Stadium's engine — which is the Japanese Stadium 2 — returns <b>zero occurrences</b> here, across the whole ROM and all 790 decompressed blocks. What this one has is <b>four cups</b> named after the balls, from Poké Ball to Master Ball, each with its own level rule — none above <b>30</b>, or the three adding up to at most <b>155</b>, or no limit — with <b>six entered and three on the field</b>, and rentals for anyone who brings no team. There is <b>play-by-play</b>, <code>じっきょう</code>, switchable in the menu and with an audio bank of its own, <code>JIKKYOU.WBK</code>, beside the <code>POKEBANK.WBK</code> of the cries. And the cartridge reads yours: through the <b>Transfer Pak</b> it recognises the Game Boy carts <b>Red, Green, Blue and Yellow</b>, and it has a message for when you pull one out mid-match.","The scale is of another order, and the number that shows it is the compression. The ROM is <b>16 MB</b>. The format is <b>Yay0</b>, and only that: no MIO0, no Yaz0, no gzip. There are <b>790 valid blocks</b>, <b>8,803,425</b> compressed bytes that give back <b>19,528,124</b> — a ratio of <b>2.22×</b>, which is to say <i>more than the whole cartridge can hold</i>. Two hundred and fifteen of those blocks are the <code>FRAGMENT</code> asset container, with a relocation table in absolute RAM addresses over base <code>0x8FF00000</code>. And the first hard anchor into game data is the <b>base stats table</b>, at <code>0x66901</code>, <b>23 bytes per entry</b>, ordered by Pokédex number — proved by three independent anchors: Bulbasaur at <b>45/49/49/45/65</b> in the first entry, Charmander exactly <b>three</b> entries later, Mewtwo exactly <b>149</b> later.","The text, unlike the assets, sits <b>in the clear</b>: <b>EUC-JP</b>, NUL terminated and aligned to four bytes, with hiragana at <code>0xA4xx</code>, katakana at <code>0xA5xx</code> and kanji from <code>0xB0A1</code>. What hid it was the byte range: a Shift-JIS sweep had returned <b>15,593 characters</b> that were repeated texture bytes landing by chance inside the valid range. The main bank is one continuous list, readable top to bottom — the <b>151 species</b> with name and category (<code>フシギダネ</code> / <code>たね</code>), running straight on into the move names, the statuses and the types. And the encoding works in the translator's favour, because in EUC-JP a kana costs <b>two</b> bytes and an English letter costs <b>one</b>: <b>144 of the 151 species names fit in the room the Japanese left</b>, without touching a single pointer. The seven that do not are the short Japanese names with long English counterparts — <code>ラッタ</code> has 8 and <code>RATICATE</code> wants 9, <code>プリン</code> has 8 and <code>JIGGLYPUFF</code> wants 11. One last trait of the console, one that stops any edit made blind: this cartridge's CRC is <b>CIC-6103</b>, seed <code>0xA3886759</code> with a sum combiner, and its IPL3 <b>subtracts <code>0x100000</code> from the entry point</b> — the header says <code>0x80100400</code> and the game runs at <code>0x80000400</code>. This page is here to follow the work."],"es":["Casi todo el mundo de cierta edad jugó a <i>Pokémon Stadium</i> en la Nintendo 64. Casi nadie sabe que hubo uno antes: este cartucho, de <b>1998</b>, que se identifica como <code>POKEMON STADIUM</code> con país <code>J</code> y se quedó en Japón. Que son dos juegos, y no dos ediciones del mismo, está <b>medido</b>: el contenedor de texto del motor del Stadium occidental — que es el Stadium 2 japonés — da <b>cero ocurrencias</b> aquí, barridas la ROM entera y los 790 bloques descomprimidos. Lo que este tiene son <b>cuatro copas</b> nombradas por las bolas, de la Poké Ball a la Master Ball, cada una con su regla de nivel — ninguno por encima del <b>30</b>, o los tres sumando como mucho <b>155</b>, o nivel libre —, con <b>seis inscritos y tres en el campo</b>, y alquiler para quien no trae equipo. Hay <b>narración de jugada</b>, <code>じっきょう</code>, activable en el menú y con banco de audio propio, <code>JIKKYOU.WBK</code>, junto al <code>POKEBANK.WBK</code> de los gritos. Y el cartucho lee el tuyo: por el <b>Transfer Pak</b> reconoce los cartuchos de Game Boy <b>Red, Green, Blue y Yellow</b>, y tiene mensaje para cuando lo sacas en mitad de la partida.","La escala es de otro orden, y el número que la enseña es la compresión. La ROM tiene <b>16 MB</b>. El formato es <b>Yay0</b>, y solo ese: ni MIO0, ni Yaz0, ni gzip. Son <b>790 bloques válidos</b>, <b>8.803.425 bytes</b> comprimidos que devuelven <b>19.528.124</b> — una razón de <b>2,22×</b>, es decir, <i>más de lo que cabe en el cartucho entero</i>. Doscientos quince de esos bloques son el contenedor de recursos <code>FRAGMENT</code>, con tabla de reubicación en direcciones absolutas de RAM sobre la base <code>0x8FF00000</code>. Y el primer anclaje duro en datos de juego es la <b>tabla de atributos base</b>, en <code>0x66901</code>, <b>23 bytes por entrada</b>, ordenada por número de la Pokédex — probada por tres anclajes independientes: Bulbasaur con <b>45/49/49/45/65</b> en la primera entrada, Charmander exactamente <b>tres</b> entradas después, Mewtwo exactamente <b>149</b> después.","El texto, al contrario que los recursos, está <b>en claro</b>: <b>EUC-JP</b>, terminado en NUL y alineado a cuatro bytes, con hiragana en <code>0xA4xx</code>, katakana en <code>0xA5xx</code> y kanji a partir de <code>0xB0A1</code>. Lo que lo escondía era el rango de bytes: un barrido por Shift-JIS había devuelto <b>15.593 caracteres</b> que eran bytes repetidos de textura cayendo por casualidad dentro del rango válido. El banco principal es una lista continua y legible de arriba abajo — las <b>151 especies</b> con nombre y categoría (<code>フシギダネ</code> / <code>たね</code>), enlazando directamente con los nombres de golpe, los estados y los tipos. Y la codificación trabaja a favor de quien traduce, porque en EUC-JP cada kana cuesta <b>dos</b> bytes y cada letra inglesa cuesta <b>uno</b>: <b>144 de los 151 nombres de especie caben en el sitio que dejó el japonés</b>, sin tocar ni un puntero. Los siete que no caben son los nombres japoneses cortos de equivalente inglés largo — <code>ラッタ</code> tiene 8 y <code>RATICATE</code> pide 9, <code>プリン</code> tiene 8 y <code>JIGGLYPUFF</code> pide 11. Un último rasgo de la consola, que corta cualquier edición hecha a ciegas: el CRC de este cartucho es <b>CIC-6103</b>, semilla <code>0xA3886759</code> y combinador de suma, y su IPL3 <b>resta <code>0x100000</code> al punto de entrada</b> — la cabecera dice <code>0x80100400</code> y el juego corre en <code>0x80000400</code>. Esta página es para acompañar el trabajo."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"pocket-monsters-stadium-en.ips","tamanho":"39 KB"},"pt":null,"es":null},"rom":"Pocket Monsters Stadium (Japan).n64","rom_md5":"c46e087d966a35095df96799b0b4ffae"},"fotos":[{"f":"pms64/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O Stadium japonês de 1998.","en":"The Japanese Stadium of 1998.","es":"El Stadium japonés de 1998."}},{"f":"pms64/02-menu.png","t":{"pt":"Menu principal","en":"Main menu","es":"Menú principal"},"c":{"pt":"O menu do estádio, com o aviso de cartucho ausente.","en":"The stadium menu, with the missing-cartridge notice.","es":"El menú del estadio, con el aviso de cartucho ausente."}},{"f":"pms64/03-regras.png","t":{"pt":"Regras da copa","en":"Cup rules","es":"Reglas de la copa"},"c":{"pt":"Cada copa impõe as suas próprias regras de nível.","en":"Each cup sets its own level rules.","es":"Cada copa impone sus propias reglas de nivel."}},{"f":"pms64/04-transfer.png","t":{"pt":"O Transfer Pak","en":"The Transfer Pak","es":"El Transfer Pak"},"c":{"pt":"A bancada que lê o seu cartucho de Game Boy.","en":"The bench that reads your own Game Boy cartridge.","es":"El puesto que lee tu propio cartucho de Game Boy."}}]},{"slug":"hanjuku-hero","nome":"Hanjuku Hero","subtitulo":"半熟英雄","jp":"半熟英雄","publisher":"Square","dev":"Square","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 modo 3 · 128 KB PRG · CHR-RAM · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"hj/01-titulo.png","linha":{"pt":"O herói é literalmente um ovo meio cozido. Estratégia da Square em 1988: você comanda um reino e solta monstros de dentro dos ovos.","en":"The hero is literally a soft-boiled egg. Square strategy, 1988: you command a kingdom and hatch your monsters out of the eggs.","es":"El héroe es literalmente un huevo medio cocido. Estrategia de Square, 1988: diriges un reino y sacas los monstruos de dentro de los huevos."},"resumo":{"pt":["<i>Hanjuku</i> quer dizer <b>meio cozido</b>, e o herói é um ovo — o nome é a piada. Antes de a Square ser sinônimo de Final Fantasy, ela tinha esta estratégia cômica em tempo real, de 1988, em que você comanda um reino e solta monstros de dentro dos ovos. É série própria dela, licenciada de ninguém, e continuou no Japão por décadas, em vários consoles, sem nunca sair de lá.","Num cartucho assim, o primeiro trabalho não é traduzir: é provar que você está lendo o texto certo. O encoding foi quebrado com <b>provas independentes</b> — o byte gravado <b>é o índice do tile na VRAM</b>, código igual a <code>0x74</code> mais o índice da fonte, e o mapeamento fecha por dois caminhos, com あ, ャ e o espaço batendo e o japonês decodificado saindo corrido e legível. A consequência é imediata: tudo abaixo de <code>0x74</code> é código de controle. Um encoding quase certo produz texto que parece japonês e não é, e a tradução inteira nasce torta por cima dele.","A fonte latina já está na build, com os três blocos de nomes em inglês — <b>112 das 399 strings</b> —, e o construtor aborta se um byte mudar fora das regiões declaradas. A armadilha do jogo apareceu cedo e já foi contornada: <b>a fonte tem duas cópias na ROM</b>, em <code>0x14000</code> e em <code>0x06784</code>, e patchear só uma <b>não muda um pixel na tela</b>, porque a tela de entrada de nome carrega a outra — e nela as casas de katakana guardam os cantos da janela. O aperto também não é onde parece: somando tudo há <b>10,8 KB livres</b> na ROM, mas o banco 2, de onde o texto de batalha é lido, tem <b>371 bytes de folga para 4,3 KB de texto</b>. Até o vazio engana — o enchimento é a palavra <code>OSMOT</code> repetida, e é ela que dá vetores falsos aos bancos 0 a 6. Não há patch para instalar; esta página acompanha o projeto."],"en":["<i>Hanjuku</i> means <b>soft-boiled</b>, and the hero is an egg — the name is the joke. Before Square was a synonym for Final Fantasy, it had this 1988 real-time comic strategy game, where you command a kingdom and hatch monsters out of eggs. It is Square's own series, licensed from nobody, and it carried on in Japan for decades across several consoles without ever leaving.","In a cartridge like this, the first job is not translating: it is proving you are reading the right text. The encoding was broken with <b>independent proofs</b> — the stored byte <b>is the tile index in VRAM</b>, the code being <code>0x74</code> plus the font index, and the mapping closes by two routes, with あ, ャ and the space all matching and the decoded Japanese coming out as readable running text. The consequence is immediate: everything below <code>0x74</code> is a control code. An encoding that is nearly right produces text that looks Japanese and is not, and the whole translation grows crooked on top of it.","The Latin font is already in the build, with the three name blocks in English — <b>112 of the 399 strings</b> — and the builder aborts if a byte changes outside the declared regions. The game's trap showed up early and has been worked around: <b>the font has two copies in the ROM</b>, at <code>0x14000</code> and at <code>0x06784</code>, and patching only one <b>does not change a pixel on screen</b>, because the name-entry screen loads the other — and there the katakana slots hold the window corners. The squeeze is not where it looks, either: adding everything up there are <b>10.8 KB free</b> in the ROM, but bank 2, where the battle text is read from, has <b>371 bytes of slack for 4.3 KB of text</b>. Even the emptiness misleads — the filler is the word <code>OSMOT</code> repeated, and it is what gives banks 0 to 6 their fake vectors. There is no patch to install; this page follows the project."],"es":["<i>Hanjuku</i> quiere decir <b>medio cocido</b>, y el héroe es un huevo — el nombre es el chiste. Antes de que Square fuera sinónimo de Final Fantasy, tenía esta estrategia cómica en tiempo real, de 1988, en la que diriges un reino y sacas monstruos de dentro de los huevos. Es una serie propia de Square, no una licencia de nadie, y siguió en Japón durante décadas, en varias consolas, sin salir nunca de allí.","En un cartucho así, el primer trabajo no es traducir: es probar que estás leyendo el texto correcto. La codificación se rompió con <b>pruebas independientes</b> — el byte guardado <b>es el índice del tile en la VRAM</b>, el código es <code>0x74</code> más el índice de la fuente, y el mapeo cierra por dos caminos, con あ, ャ y el espacio coincidiendo y el japonés decodificado saliendo corrido y legible. La consecuencia es inmediata: todo lo que hay por debajo de <code>0x74</code> es código de control. Una codificación casi correcta produce texto que parece japonés y no lo es, y la traducción entera nace torcida encima de ella.","La fuente latina ya está en la compilación, con los tres bloques de nombres en inglés — <b>112 de las 399 cadenas</b> —, y el constructor aborta si cambia un byte fuera de las regiones declaradas. La trampa del juego apareció pronto y ya está sorteada: <b>la fuente tiene dos copias en la ROM</b>, en <code>0x14000</code> y en <code>0x06784</code>, y parchear solo una <b>no cambia un píxel en pantalla</b>, porque la pantalla de entrada de nombre carga la otra — y ahí las casillas de katakana guardan las esquinas de la ventana. La estrechez tampoco está donde parece: sumándolo todo hay <b>10,8 KB libres</b> en la ROM, pero el banco 2, de donde se lee el texto de combate, tiene <b>371 bytes de holgura para 4,3 KB de texto</b>. Hasta el vacío engaña — el relleno es la palabra <code>OSMOT</code> repetida, y es ella la que da vectores falsos a los bancos 0 a 6. No hay parche que instalar; esta página sigue el proyecto."]},"numeros":[{"v":"399","r":{"pt":"strings no jogo","en":"strings in the game","es":"strings en el juego"}},{"v":"112","r":{"pt":"já traduzidas","en":"translated so far","es":"ya traducidas"}},{"v":"128","r":{"pt":"KB de PRG, com CHR-RAM","en":"KB of PRG, with CHR-RAM","es":"KB de PRG, con CHR-RAM"}}],"grupos":[{"titulo":{"pt":"O que já foi medido","en":"What is already measured","es":"Lo que ya está medido"},"itens":[{"t":{"pt":"<b>O encoding do texto, quebrado com provas independentes</b> — cada mapeamento de caractere fecha por dois caminhos, e o japonês decodificado sai corrido e legível. Encoding \"quase certo\" produz texto que parece japonês e não é.","en":"<b>The text encoding, broken with independent proofs</b> — every character mapping closes by two routes, and the decoded Japanese comes out as readable running text. An encoding that is \"nearly right\" produces text that looks Japanese and is not.","es":"<b>El encoding del texto, roto con pruebas independientes</b> — cada mapeo de carácter cierra por dos caminos, y el japonés decodificado sale corrido y legible. Un encoding \"casi correcto\" produce texto que parece japonés y no lo es."},"foto":"hj/01-titulo.png"},{"t":{"pt":"<b>CHR-RAM outra vez</b>, como no Tom Sawyer: os gráficos moram no código, não num bloco do arquivo.","en":"<b>CHR-RAM again</b>, as in Tom Sawyer: the graphics live in the program, not in a block of the file.","es":"<b>CHR-RAM otra vez</b>, como en Tom Sawyer: los gráficos viven en el código, no en un bloque del archivo."}},{"t":{"pt":"<b>112 de 399 strings</b> traduzidas — os três blocos de nomes. O resto do roteiro é o próximo passo.","en":"<b>112 of 399 strings</b> translated — the three name blocks. The rest of the script is the next step.","es":"<b>112 de 399 strings</b> traducidas — los tres bloques de nombres. El resto del guion es el siguiente paso."}}]}],"patch":{"versoes":{"en":{"arquivo":"hanjuku-hero-en.ips","tamanho":"136 KB"},"pt":null,"es":null},"rom":"Hanjuku Hero (Japan).nes","rom_md5":"60e08c13d85400b77b90b9d581f26fce"},"fotos":[{"f":"hj/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"ROM original — o subtítulo <code>HANJUKU HERO</code> já vem em latinas de fábrica.","en":"Original ROM — the <code>HANJUKU HERO</code> subtitle already comes in Latin letters from the factory.","es":"ROM original — el subtítulo <code>HANJUKU HERO</code> ya viene en latinas de fábrica."}}]},{"slug":"robot-poncots-64","nome":"Robot Poncots 64","subtitulo":"7つの海のカラメル","jp":"ロボットポンコッツ64 7つの海のカラメル","publisher":"Hudson Soft","dev":"Hudson Soft","ano":1999,"data":"1999","sistema":"Nintendo 64","mapper":"32 MB · fonte de 12×12 a 4bpp · 64GB Pak","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"robopon/00-titulo.png","linha":{"pt":"Monstros-robô da Hudson no Nintendo 64, em que o bicho tem ATK, DEF e RAM, e um estado de batalha desliga todo o software dele.","en":"Hudson's robot monsters on the Nintendo 64, where the creature has ATK, DEF and RAM, and a battle status shuts down all its software.","es":"Monstruos robot de Hudson en la Nintendo 64, donde el bicho tiene ATK, DEF y RAM, y un estado de batalla le apaga todo el software."},"resumo":{"pt":["<b>Hudson Soft</b>, Nintendo 64, <b>32 MB</b> de cartucho, e ficou no Japão. É a série que o Ocidente conheceu no Game Boy Color como <b>Robopon</b>: coleção de monstros em que o monstro é máquina, e o vocabulário entrega isso — o bicho tem <b>ATK, DEF, SPD, PWR, EP</b> e <b>RAM</b>, o que se carrega para ele são <b>peças, software, sementes e comida</b>, e um estado de batalha pode <b>desligar todo o software</b> de uma vez. São <b>46 robôs</b>. Quarenta e cinco vêm da primeira geração da série e chegam com os nomes que ela já tem em inglês — Sunny, Digger, Zap, Gidget —, e o pareamento não dependeu de acertar tradução nenhuma: filtrando a lista oficial pela coluna dos que aparecem no 64 e mantendo a ordem da dex, o casamento com a ordem interna da ROM fecha <b>45 de 45</b>, entrada por entrada. É verificação por posição, muito mais forte do que por nome. O quadragésimo sexto, <code>バケまる</code>, só existe neste cartucho e nunca teve nome oficial em inglês. E o cartucho conversa com o portátil: pelo <b>64GB Pak</b> ele lê um cartucho de Robopon e converte (<code>ＧＢコンバート</code>) o que está lá para dentro do jogo de 64, ao lado do modo história, do Battler Dome e da enciclopédia de robôs.","A propriedade rara está na tabela de charset, em <code>0x19710D0</code>: <b>272 entradas</b> de dois bytes que mapeiam índice para Shift-JIS, e as <b>95 primeiras são o ASCII imprimível inteiro</b>, de <code>0x20</code> a <code>0x7E</code> e em ordem — pontuação, dígitos, <b>A-Z e a-z</b> —, com o desenho já pronto na fonte do jogo, de <b>12×12 px, 4bpp, 72 bytes por glifo</b>. Conferidas entrada por entrada, <b>91 caem no gêmeo fullwidth exato</b> e as outras quatro são as substituições clássicas do JIS. Isto <b>já vinha no cartucho</b>: não é melhoria da casa, e o que é nosso é a leitura. Nos cartuchos de 8 bits deste mesmo catálogo, desenhar o alfabeto era metade do trabalho — no Gozonji foram <b>83 glifos latinos</b> gravados sobre as casas de kana, e no Monster Maker a fonte inteira tem <b>três letras</b>, <code>H</code>, <code>M</code> e <code>P</code>. Aqui não há hack de código a fazer: traduzir é reescrever as strings. O offset da fonte, aliás, foi cravado pela evidência mais vazia que existe — o glifo 0 é o <b>espaço de largura cheia</b>, 72 bytes zerados, então o <code>！</code> começando em <code>0x1971340</code> põe o primeiro byte da fonte exatamente 72 bytes antes.","O que aperta não é a ROM, é o campo. <b>Não há tabela de ponteiros</b>: o texto é campo fixo, base mais índice vezes o tamanho do registro, e nada se realoca sem mexer no motor. São <b>2.994 strings</b>, <b>16.572 caracteres</b> japoneses úteis, cerca de 38 KB — número honesto porque o extrator filtra pelo <b>charset do próprio jogo</b>, e caractere fora daquelas 272 entradas o jogo não desenha, logo não é texto. Isso importa porque varredura por densidade de kana <b>inventa</b>: as primeiras medições devolveram 7,6 MB e depois 21 mil caracteres, e as duas eram falso positivo de textura e de código MIPS lido como Shift-JIS. A capacidade dos campos vai de <b>3 caracteres</b> a <b>272</b>, com <b>mediana de 6</b>, e é aí que os 32 MB param de importar. A letra latina custa <b>dois bytes</b>, igual a um kana, e desenha nos mesmos <b>12 px</b>: o inglês não paga coluna nenhuma, só campo. E há <b>dois tipos de campo</b>: <b>913 strings do original não têm zero nenhum depois</b>, enchem o campo até o fim com espaço de largura cheia e ficam coladas no dado seguinte — escrever um zero numa dessas <b>corta a frase</b>. Foi assim que <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> e <code>POWER</code> perderam o número da tela de uma vez, com o inseridor tendo medido e aprovado. Só a releitura da ROM montada pegou, e por isso ela virou etapa obrigatória. Esta página anda junto com o trabalho."],"en":["<b>Hudson Soft</b>, Nintendo 64, a <b>32 MB</b> cartridge, and it stayed in Japan. This is the series the West met on Game Boy Color as <b>Robopon</b>: monster collecting where the monster is a machine, and the vocabulary gives it away — the creature has <b>ATK, DEF, SPD, PWR, EP</b> and <b>RAM</b>, what you load into it is <b>parts, software, seeds and food</b>, and one battle status can <b>shut down all its software</b> at once. There are <b>46 robots</b>. Forty-five come from the series' first generation and arrive with the English names it already has — Sunny, Digger, Zap, Gidget — and the pairing did not depend on getting any translation right: filtering the official list by the column marking which ones appear on the 64, and keeping dex order, the match against the ROM's internal order closes at <b>45 out of 45</b>, entry by entry. That is verification by position, far stronger than by name. The forty-sixth, <code>バケまる</code>, exists only on this cartridge and never had an official English name. And the cartridge talks to the handheld: through the <b>64GB Pak</b> it reads a Robopon cart and converts (<code>ＧＢコンバート</code>) what is on it into the 64 game, alongside story mode, the Battler Dome and the robot encyclopedia.","The rare property lives in the charset table at <code>0x19710D0</code>: <b>272 entries</b> of two bytes mapping index to Shift-JIS, and the <b>first 95 are the whole printable ASCII set</b>, <code>0x20</code> through <code>0x7E</code>, in order — punctuation, digits, <b>A-Z and a-z</b> — with the artwork already drawn in the game's font, <b>12×12 px, 4bpp, 72 bytes per glyph</b>. Checked entry by entry, <b>91 land on the exact fullwidth twin</b> and the other four are the classic JIS substitutions. This <b>came with the cartridge</b>: it is not work done here — our part was reading it. In the 8-bit cartridges of this same catalogue, drawing the alphabet was half the job — in Gozonji it was <b>83 Latin glyphs</b> burned over the kana slots, and in Monster Maker the entire font holds <b>three letters</b>, <code>H</code>, <code>M</code> and <code>P</code>. Here there is no code hack to write: translating means rewriting the strings. The font's offset, incidentally, was pinned by the emptiest evidence there is — glyph 0 is the <b>fullwidth space</b>, 72 zeroed bytes, so <code>！</code> beginning at <code>0x1971340</code> puts the font's first byte exactly 72 bytes earlier.","What squeezes here is not the ROM, it is the field. <b>There is no pointer table</b>: the text is a fixed field, base plus index times record size, and nothing relocates without touching the engine. There are <b>2,994 strings</b>, <b>16,572</b> usable Japanese characters, some 38 KB — an honest count because the extractor filters by <b>the game's own charset</b>, and a character outside those 272 entries is one the game will not draw, therefore not text. That matters because scanning by kana density <b>invents</b> text: the first measurements returned 7.6 MB and then 21 thousand characters, and both were false positives from textures and MIPS code read as Shift-JIS. Field capacity runs from <b>3 characters</b> to <b>272</b>, with a <b>median of 6</b>, and that is where 32 MB stops mattering. A Latin letter costs <b>two bytes</b>, the same as a kana, and draws in the same <b>12 px</b>: English pays no column at all, only field. And there are <b>two kinds of field</b>: <b>913 of the original strings have no zero after them at all</b>, filling the field to its end with fullwidth padding and sitting flush against the next data — writing a zero into one of those <b>cuts the sentence</b>. That is how <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> and <code>POWER</code> lost their numbers from the screen all at once, with the inserter having measured and approved. Only re-reading the assembled ROM caught it, which is why that re-read became a required step. This page moves along with the work."],"es":["<b>Hudson Soft</b>, Nintendo 64, cartucho de <b>32 MB</b>, y se quedó en Japón. Es la serie que Occidente conoció en la Game Boy Color como <b>Robopon</b>: colección de monstruos en la que el monstruo es una máquina, y el vocabulario lo delata — el bicho tiene <b>ATK, DEF, SPD, PWR, EP</b> y <b>RAM</b>, lo que se le carga son <b>piezas, software, semillas y comida</b>, y un estado de batalla puede <b>apagarle todo el software</b> de una vez. Son <b>46 robots</b>. Cuarenta y cinco vienen de la primera generación de la serie y llegan con los nombres que ella ya tiene en inglés — Sunny, Digger, Zap, Gidget —, y el emparejamiento no dependió de acertar ninguna traducción: filtrando la lista oficial por la columna de los que aparecen en la 64 y manteniendo el orden de la dex, la coincidencia con el orden interno de la ROM cierra <b>45 de 45</b>, entrada por entrada. Es verificación por posición, mucho más fuerte que por nombre. El cuadragésimo sexto, <code>バケまる</code>, solo existe en este cartucho y nunca tuvo nombre oficial en inglés. Y el cartucho habla con la portátil: por el <b>64GB Pak</b> lee un cartucho de Robopon y convierte (<code>ＧＢコンバート</code>) lo que hay allí al juego de 64, junto al modo historia, el Battler Dome y la enciclopedia de robots.","La propiedad rara está en la tabla de charset, en <code>0x19710D0</code>: <b>272 entradas</b> de dos bytes que mapean índice a Shift-JIS, y las <b>95 primeras son el ASCII imprimible entero</b>, de <code>0x20</code> a <code>0x7E</code> y en orden — puntuación, cifras, <b>A-Z y a-z</b> —, con el dibujo ya hecho en la fuente del juego, de <b>12×12 px, 4bpp, 72 bytes por glifo</b>. Comprobadas entrada por entrada, <b>91 caen en el gemelo fullwidth exacto</b> y las otras cuatro son las sustituciones clásicas del JIS. Esto <b>ya venía en el cartucho</b>: no es trabajo hecho aquí — lo nuestro fue leerlo. En los cartuchos de 8 bits de este mismo catálogo, dibujar el alfabeto era la mitad del trabajo — en el Gozonji fueron <b>83 glifos latinos</b> grabados sobre las casillas de kana, y en el Monster Maker la fuente entera tiene <b>tres letras</b>, <code>H</code>, <code>M</code> y <code>P</code>. Aquí no hay hack de código que escribir: traducir es reescribir las cadenas. El offset de la fuente, por cierto, se fijó con la evidencia más vacía que existe — el glifo 0 es el <b>espacio de ancho completo</b>, 72 bytes a cero, así que el <code>！</code> empezando en <code>0x1971340</code> pone el primer byte de la fuente exactamente 72 bytes antes.","Lo que aprieta no es la ROM, es el campo. <b>No hay tabla de punteros</b>: el texto es campo fijo, base más índice por el tamaño del registro, y nada se reubica sin tocar el motor. Son <b>2.994 cadenas</b>, <b>16.572 caracteres</b> japoneses útiles, unos 38 KB — cuenta honesta porque el extractor filtra por el <b>charset del propio juego</b>, y un carácter fuera de aquellas 272 entradas el juego no lo dibuja, luego no es texto. Eso importa porque el barrido por densidad de kana <b>inventa</b>: las primeras mediciones devolvieron 7,6 MB y luego 21 mil caracteres, y las dos eran falso positivo de textura y de código MIPS leído como Shift-JIS. La capacidad de los campos va de <b>3 caracteres</b> a <b>272</b>, con <b>mediana de 6</b>, y es ahí donde los 32 MB dejan de importar. La letra latina cuesta <b>dos bytes</b>, igual que un kana, y dibuja en los mismos <b>12 px</b>: el inglés no paga ni una columna, solo campo. Y hay <b>dos tipos de campo</b>: <b>913 cadenas del original no llevan ningún cero detrás</b>, llenan el campo hasta el final con espacio de ancho completo y quedan pegadas al dato siguiente — escribir un cero en una de esas <b>corta la frase</b>. Así fue como <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> y <code>POWER</code> perdieron el número de la pantalla de una vez, con el insertador habiendo medido y aprobado. Solo la relectura de la ROM montada lo detectó, y por eso se volvió etapa obligatoria. Esta página avanza junto con el trabajo."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"robopon-64-en.bps","tamanho":"953 KB"},"pt":null,"es":null},"rom":"Robot Poncots 64 (Japan).z64","rom_md5":"444f70a655ac89ca900f6fafaf926b16"},"fotos":[{"f":"robopon/00-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo novo em inglês, por cima da cena 3D do jogo.","en":"The new English logo, over the game's 3D scene.","es":"El logo nuevo en inglés, sobre la escena 3D del juego."}},{"f":"robopon/01-batalha.png","t":{"pt":"Batalha","en":"Battle","es":"Combate"},"c":{"pt":"O HUD do combate, com os medidores e o comando.","en":"The battle HUD, with the meters and the command.","es":"El HUD del combate, con los medidores y el comando."}},{"f":"robopon/02-combate.png","t":{"pt":"Ataque","en":"Attack","es":"Ataque"},"c":{"pt":"Um robô no ringue.","en":"A robot in the ring.","es":"Un robot en el ring."}},{"f":"robopon/03-arena.png","t":{"pt":"A arena","en":"The arena","es":"La arena"},"c":{"pt":"Os dois treinadores, um de cada lado.","en":"The two trainers, one on each side.","es":"Los dos entrenadores, uno a cada lado."}}]},{"slug":"ninja-burai-densetsu","nome":"Ninja Burai Densetsu","subtitulo":"忍者武雷伝説","jp":"忍者武雷伝説","publisher":"Sega","dev":"Sega","ano":1991,"data":"1991","sistema":"Mega Drive","mapper":"68000 · 1 MB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"burai/01-titulo.png","linha":{"pt":"RPG tático de ninjas no Mega Drive — e o herói é o menino europeu que sobreviveu ao naufrágio de uma nau nanban na costa do Tōhoku.","en":"A ninja tactics RPG on the Mega Drive — and the hero is the European boy who survived the wreck of a nanban ship on the Tōhoku coast.","es":"RPG táctico de ninjas en la Mega Drive — y el héroe es el niño europeo que sobrevivió al naufragio de una nao nanban en la costa de Tōhoku."},"resumo":{"pt":["Sega, 1991. Quem cresceu com o console associa a Sega a jogo de ação; este é um <b>RPG tático</b> de unidades em grade, com <b>sete classes</b>, morte permanente e prazo de dias para fechar cada capítulo — e a vida de cada soldado aparece em <b>velas acesas</b>, não em números. O guia oficial da época, <i>テレビランドわんぱっく</i> nº 135, de <b>101 páginas</b>, conta o enredo que o cartucho pressupõe: há <b>450 anos</b> uma <b>nau nanban</b> encalha na costa, e dela sobrevivem o tripulante <b>ジョン (John)</b>, escrito em katakana, e um menino de três anos. Nobunaga mata John; o ninja <b>影刀</b> recolhe o menino e o cria como ninja, com o nome de <b>武雷 (Burai)</b>; doze anos depois ele parte com três companheiros. A caixa japonesa, que traz ruby em todo kanji, fecha a premissa: Nobunaga <b>sucumbiu ao poder mágico da espada Kusanagi</b> e virou <b>妖魔</b> — o que amarra o vilão a um item, porque <b>草薙</b> é a única espada que a tabela de armas do guia lista <i>sem preço</i>.","É o primeiro <b>68000</b> desta casa — outra arquitetura de processador, não uma variação do 6502. Tem <b>1.048.576 bytes</b>, dos quais <b>644 KB são assets comprimidos</b> em dois formatos, ambos reimplementados a partir da desmontagem: um <b>Huffman de 256 entradas com RLE de nibbles</b> para os gráficos e um <b>LZ sobre índices de tile</b> para os tilemaps. E o roteiro não existe como texto: <b>nenhuma varredura acha kana codificado</b> na ROM, em nenhuma das duas compressões. Cada cena carrega um bloco comprimido com os <b>tiles 8×8 únicos da tela composta, em ordem raster</b> — medido num deles, <b>413 tiles, 413 distintos, zero repetidos</b> — e o tilemap guarda a ordem em que eles se remontam. <b>A identidade dos caracteres está nos bitmaps, a ordem está nos tilemaps.</b> Pareados os dois na largura que o próprio blitter pede, <b>31 tiles por 4</b>, a tela sai legível — foi assim que o roteiro foi lido pela primeira vez. Fica registrado, do caminho, o número que se desmentiu sozinho: uma varredura bruta de ponteiros achou <b>1.611 candidatos</b> para a região comprimida, e eles cobriam <b>103% dela</b>.","A leitura tem conferência de fora, e ela corrigiu palpites. Os <b>dez capítulos</b> lidos dos tilemaps batem <b>letra por letra</b> com o índice do guia, inclusive o primeiro, que estava marcado como duvidoso; nove dos dez são <b>distritos históricos reais de Mutsu e Dewa</b>, o que põe o jogo no <b>Tōhoku</b> e não em Kyoto. Mas o furigana dos cabeçalhos cravou leituras que a dedução errava: <b>刈田 é <i>Karita</i> aqui e Katta no mapa histórico</b>, 雄勝 é <i>Okatsu</i> e 羽尾 é <i>Uo</i> — leitura de topônimo de jogo não se deduz do mapa. O aperto do cartucho é a <b>coluna</b>: o caractere japonês é <b>16×16</b>, ou seja 2×2 tiles, e a caixa comporta <b>15 caracteres por linha</b>; a fonte base do jogo, já residente no tile <code>0x380</code>, tem <b>129 glifos de 8×8</b> e traz o <b>A-Z</b> gravado desde 1991, e com ela a mesma caixa passa a caber <b>31</b>. O vocabulário segue o guia: <b>Masamune</b> e <b>Muramasa</b> são os dois ferreiros que a história japonesa consagrou, a <b>Tanegashima</b> é a ilha onde os portugueses introduziram o arcabuz em 1543, e magatama, espelho e Kusanagi são as três insígnias imperiais. Os níveis de técnica contam-se em <b>段</b>: <code>1st Dan</code>, e não <code>Level 1</code>. O <b>patch alfa</b> já sai pela página do Patreon: põe em inglês a tela de título, os menus, a barra lateral e a janela de status — onde o nível aparece como <code>1 DAN</code>. O roteiro segue em japonês."],"en":["Sega, 1991. Anyone who grew up with the console associates Sega with action games; this is a <b>tactical RPG</b> of units on a grid, with <b>seven classes</b>, permanent death and a deadline in days for each chapter — and every soldier's health shows as <b>lit candles</b>, not numbers. The period strategy guide, <i>テレビランドわんぱっく</i> no. 135, <b>101 pages</b>, tells the story the cartridge takes for granted: <b>450 years</b> ago a <b>nanban ship</b> runs aground on the coast, and from it survive the crewman <b>ジョン (John)</b>, written in katakana, and a three-year-old boy. Nobunaga kills John; the ninja <b>影刀</b> takes the boy in and raises him as a ninja under the name <b>武雷 (Burai)</b>; twelve years later he sets out with three companions. The Japanese box, which carries ruby over every kanji, completes the premise: Nobunaga <b>fell to the magic of the sword Kusanagi</b> and became a <b>妖魔</b> — which ties the villain to an item, because <b>草薙</b> is the one sword the guide's weapon table lists <i>with no price</i>.","It is this house's first <b>68000</b> — a different processor architecture, not a variation on the 6502. It holds <b>1,048,576 bytes</b>, of which <b>644 KB are compressed assets</b> in two formats, both reimplemented from the disassembly: a <b>256-entry Huffman with nibble RLE</b> for graphics and an <b>LZ over tile indices</b> for tilemaps. And the script does not exist as text: <b>no scan finds encoded kana</b> in the ROM, under either compression. Each scene carries a compressed block holding the <b>unique 8×8 tiles of the composed screen, in raster order</b> — measured in one of them, <b>413 tiles, 413 distinct, zero repeats</b> — and the tilemap holds the order in which they are reassembled. <b>The identity of the characters is in the bitmaps, the order is in the tilemaps.</b> Pair the two at the width the blitter itself asks for, <b>31 tiles by 4</b>, and the screen comes out readable — that is how the script was read for the first time. From that road, one number is worth recording because it refuted itself: a brute pointer scan turned up <b>1,611 candidates</b> for the compressed region, and they covered <b>103% of it</b>.","The reading has an outside check, and the check corrected guesses. The <b>ten chapters</b> read from the tilemaps match the guide's index <b>letter for letter</b>, including the first one, which had been flagged as doubtful; nine of the ten are <b>real historical districts of Mutsu and Dewa</b>, which places the game in <b>Tōhoku</b> rather than Kyoto. But the ruby over the chapter headings pinned readings that deduction had got wrong: <b>刈田 is <i>Karita</i> here and Katta on the historical map</b>, 雄勝 is <i>Okatsu</i> and 羽尾 is <i>Uo</i> — a game's place names are not deduced from the atlas. The cartridge's squeeze is the <b>column</b>: a Japanese character is <b>16×16</b>, that is 2×2 tiles, and the box holds <b>15 characters per line</b>; the game's base font, already resident at tile <code>0x380</code>, has <b>129 glyphs at 8×8</b> and carries <b>A-Z</b> burned in since 1991, and with it the same box holds <b>31</b>. The vocabulary follows the guide: <b>Masamune</b> and <b>Muramasa</b> are the two swordsmiths Japanese history remembers, <b>Tanegashima</b> is the island where the Portuguese brought in the arquebus in 1543, and magatama, mirror and Kusanagi are the three imperial regalia. Technique ranks are counted in <b>段</b>: <code>1st Dan</code>, not <code>Level 1</code>. The <b>alpha patch</b> is out through the Patreon page: it puts the title screen, the menus, the sidebar and the status window into English — where the rank reads <code>1 DAN</code>. The script is still in Japanese."],"es":["Sega, 1991. Quien creció con la consola asocia Sega a los juegos de acción; este es un <b>RPG táctico</b> de unidades sobre cuadrícula, con <b>siete clases</b>, muerte permanente y un plazo en días para cerrar cada capítulo — y la vida de cada soldado aparece en <b>velas encendidas</b>, no en números. La guía de la época, <i>テレビランドわんぱっく</i> nº 135, de <b>101 páginas</b>, cuenta la historia que el cartucho da por sabida: hace <b>450 años</b> una <b>nao nanban</b> encalla en la costa, y de ella sobreviven el tripulante <b>ジョン (John)</b>, escrito en katakana, y un niño de tres años. Nobunaga mata a John; el ninja <b>影刀</b> recoge al niño y lo cría como ninja, con el nombre de <b>武雷 (Burai)</b>; doce años después parte con tres compañeros. La caja japonesa, que lleva ruby sobre cada kanji, cierra la premisa: Nobunaga <b>sucumbió al poder mágico de la espada Kusanagi</b> y se volvió <b>妖魔</b> — lo que ata al villano a un objeto, porque <b>草薙</b> es la única espada que la tabla de armas de la guía lista <i>sin precio</i>.","Es el primer <b>68000</b> de esta casa — otra arquitectura de procesador, no una variación del 6502. Tiene <b>1.048.576 bytes</b>, de los cuales <b>644 KB son recursos comprimidos</b> en dos formatos, los dos reimplementados a partir del desensamblado: un <b>Huffman de 256 entradas con RLE de nibbles</b> para los gráficos y un <b>LZ sobre índices de tile</b> para los tilemaps. Y el guion no existe como texto: <b>ningún barrido encuentra kana codificado</b> en la ROM, en ninguna de las dos compresiones. Cada escena carga un bloque comprimido con los <b>tiles de 8×8 únicos de la pantalla compuesta, en orden ráster</b> — medido en uno de ellos, <b>413 tiles, 413 distintos, cero repetidos</b> — y el tilemap guarda el orden en el que se vuelven a montar. <b>La identidad de los caracteres está en los bitmaps, el orden está en los tilemaps.</b> Emparejados los dos en el ancho que pide el propio blitter, <b>31 tiles por 4</b>, la pantalla sale legible — así se leyó el guion por primera vez. Del camino queda registrado el número que se desmintió solo: un barrido bruto de punteros encontró <b>1.611 candidatos</b> para la región comprimida, y cubrían el <b>103%</b> de ella.","La lectura tiene comprobación de fuera, y la comprobación corrigió conjeturas. Los <b>diez capítulos</b> leídos de los tilemaps coinciden <b>letra por letra</b> con el índice de la guía, incluido el primero, que estaba marcado como dudoso; nueve de los diez son <b>distritos históricos reales de Mutsu y Dewa</b>, lo que sitúa el juego en el <b>Tōhoku</b> y no en Kioto. Pero el furigana de los encabezados fijó lecturas que la deducción erraba: <b>刈田 aquí es <i>Karita</i> y en el mapa histórico es Katta</b>, 雄勝 es <i>Okatsu</i> y 羽尾 es <i>Uo</i> — el topónimo de un juego no se deduce del atlas. Lo que aprieta en el cartucho es la <b>columna</b>: el carácter japonés es de <b>16×16</b>, o sea 2×2 tiles, y la caja admite <b>15 caracteres por línea</b>; la fuente base del juego, ya residente en el tile <code>0x380</code>, tiene <b>129 glifos de 8×8</b> y trae la <b>A-Z</b> grabada desde 1991, y con ella la misma caja pasa a admitir <b>31</b>. El vocabulario sigue a la guía: <b>Masamune</b> y <b>Muramasa</b> son los dos forjadores de espadas que la historia japonesa recuerda, <b>Tanegashima</b> es la isla donde los portugueses introdujeron el arcabuz en 1543, y magatama, espejo y Kusanagi son las tres insignias imperiales. Los niveles de técnica se cuentan en <b>段</b>: <code>1st Dan</code>, y no <code>Level 1</code>. El <b>parche alfa</b> ya sale por la página de Patreon: pone en inglés la pantalla de título, los menús, la barra lateral y la ventana de estado — donde el nivel aparece como <code>1 DAN</code>. El guion sigue en japonés."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"ninja-burai-densetsu-en.ips","tamanho":"17 KB"},"pt":null,"es":null},"rom":"Ninja Burai Densetsu (Japan).md","rom_md5":"d1263fb5efd1af669a0df2a45689c3f5"},"fotos":[{"f":"burai/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O título redesenhado em inglês, LEGEND OF THE NINJA, com o endereço da casa no rodapé.","en":"The title redrawn in English, LEGEND OF THE NINJA, with the house address at the foot.","es":"El título redibujado en inglés, LEGEND OF THE NINJA, con la dirección de la casa al pie."}}]}],"posts":[{"date":"2026-09-10","build":"v1.3.5","tag":"Magic Knight Rayearth 2","title_pt":"Rayearth 2 em inglês ganha minúsculas, e o japonês esquecido aparece","title_en":"Rayearth 2 in English gets lowercase, and the forgotten Japanese shows up","body_pt":["Um jogador mandou três queixas sobre a versão 1.2 em inglês: o prólogo estava quebrado, as falas de uma linha ora caíam na linha de cima, ora na de baixo, e a fonte era toda em maiúscula. As três eram verdade, e a versão 1.3.5 conserta as três. O prólogo foi reescrito contra o japonês, as falas de uma linha agora caem sempre no mesmo lugar, e o nome que você digita no começo aparece nas falas pela primeira vez (na 1.2 ele não aparecia).","A maiúscula não era escolha: o jogo original não tem letra minúscula nenhuma. Os cerca de 176 códigos da tabela de caracteres já estão ocupados, quase todos por kana. Com o jogo em inglês, porém, a maior parte dos kana não aparece mais em lugar nenhum. <b>Vinte e seis deles viraram a–z</b>, desenhados na mesma grade da fonte de largura variável, com g, j, p, q e y descendo abaixo da linha. Os 2.100 textos passaram para caixa de frase, com maiúscula em nome próprio.","Isso teve um efeito colateral útil. Todo trecho que ainda estava em japonês passou a sair como letra solta, e ficou impossível não ver. Uma jogatina automática de 50 dias, feita junto com a versão em espanhol que está em andamento, achou os que faltavam: os <b>finais</b> e a mensagem depois dos créditos, <b>70 falas da aventura</b>, o <b>menu de viagem</b>, a <b>tela de batalha</b> e os <b>nomes dos lutadores</b>. Na 1.2 tudo isso já estava em japonês; agora está em inglês.","De quebra, saíram os defeitos que só se viam no fim do jogo. Uma letra solta aparecia no começo de linha nos créditos e numa fala do Clef, os créditos partiam nomes ao meio, e na batalha o número de dano saía separado. O cursor dos menus também não apaga mais o texto das opções.","O patch se aplica na ROM japonesa original, não em cima da 1.2: <code>Magic Knight Rayearth 2 (Japan).gg</code>, MD5 <code>b19256c6716147a9744f5bd528f14450</code>."],"body_en":["A player sent three complaints about the English version 1.2: the opening prologue was broken, one-line dialogues landed sometimes on the top line and sometimes on the bottom one, and the whole font was uppercase. All three were true, and version 1.3.5 fixes all three. The prologue was rewritten against the Japanese, one-line dialogues now always land in the same place, and the name you type at the start shows up in the dialogue for the first time (in 1.2 it never did).","The uppercase was not a choice: the original game has no lowercase letters at all. The roughly 176 codes in its character table are all taken, almost all of them by kana. With the game in English, though, most of the kana never appear anywhere any more. <b>Twenty-six of them became a–z</b>, drawn on the same grid as the variable-width font, with g, j, p, q and y dropping below the line. The 2,100 texts were moved to sentence case, with capitals on proper names.","That had a useful side effect. Any stretch still in Japanese now came out as stray letters, and became impossible to miss. An automated 50-day playthrough, run alongside the Spanish version now in progress, found the ones left: the <b>endings</b> and the post-credits message, <b>70 adventure lines</b>, the <b>travel menu</b>, the <b>battle screen</b> and the <b>fighters' names</b>. In 1.2 all of that was already in Japanese; now it is in English.","Along the way, the defects you could only see at the end of the game went too. A stray letter appeared at the start of lines in the credits and in one of Clef's lines, the credits split names in half, and in battle the damage number came out broken apart. The menu cursor no longer erases the options' text either.","Apply the patch to the original Japanese ROM, not on top of 1.2: <code>Magic Knight Rayearth 2 (Japan).gg</code>, MD5 <code>b19256c6716147a9744f5bd528f14450</code>."]}],"manuais":{"famicom-jump-2":{"slug":"famicom-jump-2","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Todo comando citado aqui é a palavra exata que está na tela — não é tradução do manual japonês, é o jogo que você vai jogar.","en":"This manual describes the game <b>as it appears in the English patch</b>. Every command named here is the exact word on screen — this is not a translation of the Japanese manual, it is the game you are going to play.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Todo comando citado aquí es la palabra exacta que está en pantalla — no es una traducción del manual japonés, es el juego que vas a jugar."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"fj2/05-espirito-jump-world.png","paras":{"pt":["O mundo dos mangás da Jump foi invadido. Um espírito chama você e diz que <b>sete campeões</b> foram escolhidos para enfrentar o que vem — e nomeia os seis que faltam encontrar, fechando com “e você também”.","Você começa com um dos sete e sai atrás dos outros. Antes disso, o patch acrescenta um <b>prólogo de cinco páginas</b> que conta o primeiro jogo de 1989 — quem nunca jogou o <i>Eiyuu Retsuden</i> não perde nada da história."],"en":["The world of the Jump manga has been invaded. A spirit calls you and says <b>seven champions</b> have been chosen to face what is coming — then names the six you still have to find, closing with “and you as well.”","You start as one of the seven and go looking for the others. Before that, the patch adds a <b>five-page prologue</b> recapping the 1989 first game — anyone who never played <i>Eiyuu Retsuden</i> misses nothing of the story."],"es":["El mundo de los mangas de la Jump ha sido invadido. Un espíritu te llama y dice que se han elegido <b>siete campeones</b> para enfrentar lo que viene — y nombra a los seis que faltan por encontrar, cerrando con “y tú también”.","Empiezas con uno de los siete y sales a buscar a los demás. Antes de eso, el parche añade un <b>prólogo de cinco páginas</b> que cuenta el primer juego de 1989 — quien nunca jugó <i>Eiyuu Retsuden</i> no se pierde nada."]}},{"id":"heroes","titulo":{"pt":"Os sete heróis","en":"The seven heroes","es":"Los siete héroes"},"paras":{"pt":["Sete séries da Weekly Shōnen Jump dividem o mesmo campo de batalha. <b>Três lutam por vez</b>; do quarto em diante, os que ficam de fora treinam e continuam ganhando experiência."],"en":["Seven Weekly Shōnen Jump series share one battlefield. <b>Three fight at a time</b>; from the fourth onwar
