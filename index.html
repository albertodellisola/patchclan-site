e tem 137 bytes.","en":"The tables for the 26 groups fit in the <b>1,060 usable bytes</b> of the old dictionary bank plus 65 bytes of padding at the end of it. The English script closes at <b>65.9 KB inside 68.1 KB</b> — a 2.2 KB margin on a cartridge whose longest free run is 137 bytes.","es":"Las tablas de los 26 grupos cupieron en los <b>1.060 bytes</b> útiles del banco del diccionario antiguo más 65 bytes de relleno al final. El guion inglés cerró en <b>65,9 KB dentro de 68,1 KB</b> — un margen de 2,2 KB en un cartucho cuyo mayor hueco libre tiene 137 bytes."}},{"t":{"pt":"<b>Cada compilação se confere.</b> Uma guarda aborta se qualquer byte fora das regiões declaradas mudar, e outra se duas partes do hack reivindicarem o mesmo byte. As 1.903 mensagens são decodificadas de volta <b>pelo decodificador 6502 real rodando sobre a ROM final</b> e comparadas com a fonte. Um teste de estresse de <b>30.000 quadros</b> com entrada aleatória roda ao lado do cenário exato que travava versões antigas.","en":"<b>Every build checks itself.</b> A guard aborts if any byte outside the declared regions moved, and a second one if two parts of the hack claim the same byte. All 1,903 messages are decoded back <b>by the real 6502 decoder running on the finished ROM</b> and compared to the source. A <b>30,000-frame</b> random-input stress test runs alongside the exact scenario that crashed earlier builds.","es":"<b>Cada compilación se comprueba a sí misma.</b> Una guarda aborta si cambia cualquier byte fuera de las regiones declaradas, y otra si dos partes del hack reclaman el mismo byte. Los 1.903 mensajes se decodifican de vuelta <b>con el decodificador 6502 real corriendo sobre la ROM final</b> y se comparan con el original. Una prueba de estrés de <b>30.000 fotogramas</b> con entrada aleatoria corre junto al escenario exacto que colgaba las versiones antiguas."}}]},{"titulo":{"pt":"Quatro defeitos que eu mesmo introduzi","en":"Four bugs I introduced myself","es":"Cuatro fallos que introduje yo mismo"},"itens":[{"t":{"pt":"Ficam registrados por honestidade. <b>A placa do título</b> perdeu a moldura branca e os raios rosa porque a primeira versão do logo apagou 47 tiles para caber — a arte foi devolvida na íntegra, com <b>zero pixels de diferença</b> conferidos por contagem.","en":"They are recorded here for honesty. <b>The title plaque</b> lost its white border and pink rays because my first logo deleted 47 tiles to make room — the art was restored in full, at <b>zero pixels of difference</b>, checked by counting.","es":"Quedan registrados por honestidad. <b>La placa del título</b> perdió el borde blanco y los rayos rosas porque mi primer logo borró 47 tiles para caber — la ilustración se devolvió entera, con <b>cero píxeles de diferencia</b>, comprobado contando."}},{"t":{"pt":"A oitava imagem da animação da placa é a própria cauda do stream do fundo — a Bandai não guardou duas cópias. Com o logo novo esse ponteiro caía no meio do logo e, após ~46 s parado no título, a placa se enchia de lixo.","en":"The eighth frame of the plaque animation is the tail of the background stream itself — Bandai did not keep two copies. With the new logo that pointer landed in the middle of the logo, and after about 46 seconds sitting on the title screen the plaque filled with garbage.","es":"El octavo fotograma de la animación de la placa es la propia cola del stream del fondo — Bandai no guardó dos copias. Con el logo nuevo ese puntero caía en mitad del logo y, tras unos 46 segundos parado en el título, la placa se llenaba de basura."}},{"t":{"pt":"<b>Uma aspa a mais em cada troca de página</b> — 281 linhas extras ao longo do roteiro — era o que fazia a caixa de fala estourar e deixar um <b>balão fantasma</b> preso no cenário. As correções fecharam a classe inteira, e agora a compilação <b>simula o próprio motor de texto do jogo</b> sobre o roteiro final e aborta se alguma página passar de 21 colunas por 3 linhas.","en":"<b>A stray quotation mark at every page break</b> — 281 extra lines across the script — was the real cause of the dialogue box overflowing and leaving a <b>ghost balloon</b> stuck in the scenery. The fixes closed the whole class, and the build now <b>simulates the game’s own text engine</b> over the final script and aborts if any page exceeds 21 columns by 3 lines.","es":"<b>Una comilla de más en cada salto de página</b> — 281 líneas extra a lo largo del guion — era la causa real de que la caja de diálogo se desbordara y dejara un <b>globo fantasma</b> atrapado en el escenario. Las correcciones cerraron la clase entera, y ahora la compilación <b>simula el propio motor de texto del juego</b> sobre el guion final y aborta si alguna página pasa de 21 columnas por 3 líneas."}}]}],"patch":{"versoes":{"en":{"arquivo":"famicom-jump-2-en.ips","tamanho":"74 KB"},"pt":{"arquivo":"famicom-jump-2-pt.ips","tamanho":"75 KB"},"es":{"arquivo":"famicom-jump-2-es.ips","tamanho":"75 KB"}},"rom":"Famicom Jump II - Saikyou no 7 Nin (Japan).nes","rom_md5":"47910069aa92dcac1b0fa4929cc7ceff"},"fotos":[{"f":"fj2/01-tela-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado pixel a pixel e o selo <code>DEFINITIVE EDITION</code>, que não custou um byte a mais.","en":"The logo redrawn pixel by pixel, and the <code>DEFINITIVE EDITION</code> seal, which cost no extra bytes.","es":"El logo redibujado píxel a píxel, y el sello <code>DEFINITIVE EDITION</code>, que no costó bytes de más."}},{"f":"fj2/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Tela nova antes do título, em 355 bytes de espaço morto.","en":"A new screen before the title, in 355 bytes of dead space.","es":"Una pantalla nueva antes del título, en 355 bytes de espacio muerto."}},{"f":"fj2/04-prologo-novo.png","t":{"pt":"Prólogo novo","en":"New prologue","es":"Prólogo nuevo"},"c":{"pt":"Cinco páginas escritas do zero, recapitulando o primeiro jogo de 1989.","en":"Five newly written pages recapping the 1989 first game.","es":"Cinco páginas escritas de cero que recapitulan el primer juego de 1989."}},{"f":"fj2/05-espirito-jump-world.png","t":{"pt":"O espírito do Jump World","en":"The spirit of Jump World","es":"El espíritu del Jump World"},"c":{"pt":"A abertura, agora em português.","en":"The opening, now in English.","es":"La apertura, ahora en español."}},{"f":"fj2/06-lista-sete-campeoes.png","t":{"pt":"A lista dos sete","en":"The champion list","es":"La lista de los siete"},"c":{"pt":"A tela do bug: seis nomes que, até esta correção, eram sempre os mesmos.","en":"The bug screenshot: six names that, until this fix, were always the same six.","es":"La pantalla del error: seis nombres que, hasta esta corrección, eran siempre los mismos seis."}},{"f":"fj2/07-e-voce-tambem-goku.png","t":{"pt":"\"E você também, Goku.\"","en":"\"That goes for you too, Goku.\"","es":"\"Y tú también, Goku.\""},"c":{"pt":"A fala que ninguém tinha visto em trinta e cinco anos.","en":"The line nobody had seen in thirty-five years.","es":"La frase que nadie había visto en treinta y cinco años."}},{"f":"fj2/03-menu-ingles.png","t":{"pt":"Menus","en":"Menus","es":"Menús"},"c":{"pt":"Status, loja, depósito e treino — 77 textos.","en":"Status, shop, storage and training — 77 strings.","es":"Estado, tienda, almacén y entrenamiento — 77 textos."}},{"f":"fj2/08-soulring.png","t":{"pt":"Itens","en":"Items","es":"Objetos"},"c":{"pt":"Nomes e descrições, encurtados só quando o campo exige.","en":"Names and descriptions, shortened only where the field demands it.","es":"Nombres y descripciones, acortados solo donde el campo lo exige."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"guevara","nome":"Guevara","subtitulo":"","jp":"ゲバラ","traducao_titulo":"Guerrilla War","publisher":"SNK","dev":"SNK","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 · 128 KB PRG expandido para 256 KB · 128 KB CHR","categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"beta","versao":"v2.0 — uma ROM, três idiomas","capa":"guevara/00-capa-patreon.jpg","linha":{"pt":"Neste run-and-gun de 1988 os dois jogadores chamam-se GUEVARA e CASTRO — e um menu novo escolhe idioma, vidas e dificuldade.","en":"In this 1988 run-and-gun the two players are named GUEVARA and CASTRO — and a new menu sets language, lives and difficulty.","es":"En este run-and-gun de 1988 los dos jugadores se llaman GUEVARA y CASTRO — y un menú nuevo ajusta idioma, vidas y dificultad."},"resumo":{"pt":["SNK, 1988: tiro de cima para baixo, dois jogadores lado a lado, um dedo no gatilho e outro na granada. No Ocidente ele saiu como <i>Guerrilla War</i> — nome que o próprio cartucho japonês já imprime em letra latina no boot, na tela <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code>. Mas a ROM japonesa faz duas coisas antes de a partida começar: logo depois do logo da SNK aparece o <b>retrato do Che</b> com uma dedicatória de duas linhas, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, que aqui se lê <code>A CHE GUEVARA / HERÓI DA REVOLUÇÃO CUBANA</code>; depois vem um prólogo de <b>nove linhas</b> sobre 1956 — o Batista, os impostos, a polícia secreta, o desembarque. E os dois jogadores têm nome: <b>GUEVARA</b> e <b>CASTRO</b>.","Esta ROM ganhou um <b>menu de opções</b>, na terceira entrada do menu inicial, e ele muda o que se faz com o cartucho: escolhe o <b>idioma</b>, as <b>vidas</b>, a <b>dificuldade</b> e traz um <b>sound test</b>. Num run-and-gun de 1988 poder ajustar as vidas é a diferença entre atravessar a ilha e desistir nela — e há o teto <b>infinito</b>, com o decremento desligado, conferido ao longo de <b>13.400 quadros</b>. O número de vidas parou em <b>4</b> por uma razão que só a fotografia contou: o menu deixava escolher até nove, mas retratado com <b>seis</b> o indicador da tela mostrava <b>quatro cruzes</b>, porque a rotina da HUD tem quatro lugares de sprite. Prometer o que a tela não mostra seria mentir, então o teto virou o mesmo <b>4</b> que o jogo dá de fábrica. Duas correções são de conteúdo, não de idioma: o texto original põe <b>Cuba na América do Sul</b>, e aqui ela está na América Central; e o menu que dizia <code>TWO PLAYERS MODE</code> passou a dizer <code>TWO PLAYER MODE</code>.","É <b>uma ROM só, com os três idiomas dentro</b>. Todo o texto localizado vive no banco 5, e trocar de idioma é trocar qual banco é mapeado ali — uma variável em <code>$0400</code> guarda o número. Para isso o cartucho foi <b>expandido de 128 para 256 KB</b>, e aí está a armadilha: no MMC1 o banco fixo é sempre o último, então ele deixa de ser o 7 e passa a ser o 15 — e o 15 tem de ser cópia do 7, aplicada <b>depois</b> de todos os patches, ou o jogo roda código antigo sem dar erro visível. Os blocos mortos do banco fixo entraram em uso, e cada gancho <b>afirma os bytes originais antes de escrever</b>. Nada disso vale sem prova: um teste de canário enche os bytes candidatos de <code>$AA</code> e compara com a ROM original em <b>14 quadros</b> — boot, prólogo, título, demo e jogo —, com <b>0 pixel de diferença</b>. E o prólogo é onde estava o atrito: a fonte japonesa desenha cada caractere num bloco de <b>2×2 tiles</b>, com dois glifos empacotados no mesmo grupo, e a tela tem nove linhas de texto; em letra latina de largura cheia o mesmo prólogo pediria <b>vinte e uma</b>. Com uma fonte latina de meia largura numa caixa de <b>28 colunas</b>, os três idiomas fecham em <b>oito linhas</b>, com o texto inteiro. Um patch, três idiomas, e a versão queimada na tela de créditos."],"en":["SNK, 1988: a top-down shooter, two players side by side, one finger on the trigger and the other on the grenade. In the West it shipped as <i>Guerrilla War</i> — a name the Japanese cartridge itself already prints in Latin letters at boot, on the <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code> screen. But the Japanese ROM does two things before play begins: right after the SNK logo, <b>Che's portrait</b> appears with a two-line dedication, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, which here reads <code>TO CHE GUEVARA / HERO OF THE CUBAN REVOLUTION</code>; then comes a <b>nine-line</b> prologue about 1956 — Batista, the taxes, the secret police, the landing. And the two players have names: <b>GUEVARA</b> and <b>CASTRO</b>.","This ROM gained an <b>options menu</b>, as a third entry on the start menu, and it changes what you can do with the cartridge: it sets the <b>language</b>, the <b>lives</b>, the <b>difficulty</b>, and carries a <b>sound test</b>. In a 1988 run-and-gun, being able to set your lives is the difference between crossing the island and giving up on it — and there is an <b>infinite</b> setting, with the decrement switched off, checked across <b>13,400 frames</b>. The lives count stops at <b>4</b> for a reason only the photograph told: the menu let you pick up to nine, but photographed with <b>six</b>, the on-screen indicator showed <b>four crosses</b>, because the HUD routine has four sprite slots. Promising what the screen does not show would be a lie, so the ceiling became the same <b>4</b> the game gives from the factory. Two corrections are of content rather than language: the original text places <b>Cuba in South America</b>, and here it sits in Central America; and the menu that read <code>TWO PLAYERS MODE</code> now reads <code>TWO PLAYER MODE</code>.","It is <b>a single ROM, with all three languages inside</b>. Every localised string lives in bank 5, and switching language means switching which bank is mapped there — a variable at <code>$0400</code> holds the number. For that the cartridge was <b>expanded from 128 to 256 KB</b>, and there lies the trap: on MMC1 the fixed bank is always the last one, so it stops being 7 and becomes 15 — and 15 has to be a copy of 7, applied <b>after</b> every patch, or the game runs old code with no visible error. The dead blocks of the fixed bank came into use, and each hook <b>asserts the original bytes before writing</b>. None of it counts without proof: a canary test fills the candidate bytes with <code>$AA</code> and compares against the original ROM across <b>14 frames</b> — boot, prologue, title, demo and gameplay — at <b>0 pixels of difference</b>. And the prologue is where the friction was: the Japanese font draws each character in a <b>2×2 tile</b> block, with two glyphs packed into the same group, and the screen holds nine lines of text; in full-width Latin the same prologue would want <b>twenty-one</b>. With a half-width Latin font in a box of <b>28 columns</b>, all three languages close in <b>eight lines</b>, with the whole text. One patch, three languages, and the version burned into the credits screen."],"es":["SNK, 1988: disparos con vista cenital, dos jugadores hombro con hombro, un dedo en el gatillo y otro en la granada. En Occidente salió como <i>Guerrilla War</i> — un nombre que el propio cartucho japonés ya imprime en letra latina al arrancar, en la pantalla <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code>. Pero la ROM japonesa hace dos cosas antes de que empiece la partida: justo después del logo de SNK aparece el <b>retrato del Che</b> con una dedicatoria japonesa de dos líneas, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, que aquí se lee <code>A CHE GUEVARA / HÉROE DE LA REVOLUCIÓN CUBANA</code>; después viene un prólogo de <b>nueve líneas</b> sobre 1956 — Batista, los impuestos, la policía secreta, el desembarco. Y los dos jugadores tienen nombre: <b>GUEVARA</b> y <b>CASTRO</b>.","Esta ROM ganó un <b>menú de opciones</b>, en la tercera entrada del menú inicial, y cambia lo que se puede hacer con el cartucho: elige el <b>idioma</b>, las <b>vidas</b>, la <b>dificultad</b> y trae un <b>sound test</b>. En un run-and-gun de 1988, poder ajustar las vidas es la diferencia entre cruzar la isla y rendirse en ella — y hay un tope <b>infinito</b>, con el decremento apagado, comprobado a lo largo de <b>13.400 fotogramas</b>. El número de vidas se paró en <b>4</b> por una razón que solo contó la fotografía: el menú dejaba elegir hasta nueve, pero retratado con <b>seis</b> el indicador de la pantalla mostraba <b>cuatro cruces</b>, porque la rutina del HUD tiene cuatro sitios de sprite. Prometer lo que la pantalla no enseña sería mentir, así que el tope pasó a ser el mismo <b>4</b> que el juego da de fábrica. Dos correcciones son de contenido, no de idioma: el texto original pone <b>Cuba en América del Sur</b>, y aquí está en América Central; y el menú que decía <code>TWO PLAYERS MODE</code> pasó a decir <code>TWO PLAYER MODE</code>.","Es <b>una sola ROM, con los tres idiomas dentro</b>: el español no es otro archivo, es una opción del menú. Todo el texto localizado vive en el banco 5, y cambiar de idioma es cambiar qué banco se mapea ahí — una variable en <code>$0400</code> guarda el número. Para eso el cartucho se <b>amplió de 128 a 256 KB</b>, y ahí está la trampa: en el MMC1 el banco fijo es siempre el último, así que deja de ser el 7 y pasa a ser el 15 — y el 15 tiene que ser copia del 7, aplicada <b>después</b> de todos los parches, o el juego corre código viejo sin dar error visible. Los bloques muertos del banco fijo entraron en uso, y cada gancho <b>afirma los bytes originales antes de escribir</b>. Nada de eso vale sin prueba: un test de canario llena los bytes candidatos de <code>$AA</code> y compara con la ROM original en <b>14 fotogramas</b> — arranque, prólogo, título, demo y partida —, con <b>0 píxeles de diferencia</b>. Y el prólogo es donde estaba la fricción: la fuente japonesa dibuja cada carácter en un bloque de <b>2×2 tiles</b>, con dos glifos empaquetados en el mismo grupo, y la pantalla tiene nueve líneas de texto; en letra latina de ancho completo el mismo prólogo pediría <b>veintiuna</b>. Con una fuente latina de media anchura en una caja de <b>28 columnas</b>, los tres idiomas cierran en <b>ocho líneas</b>, con el texto entero. Un parche, tres idiomas, y la versión grabada en la pantalla de créditos."]},"numeros":[{"v":"3","r":{"pt":"idiomas dentro da mesma ROM","en":"languages inside the same ROM","es":"idiomas dentro de la misma ROM"}},{"v":"13","r":{"pt":"telas que estavam em japonês","en":"screens that were in Japanese","es":"pantallas que estaban en japonés"}},{"v":"59","r":{"pt":"glifos da fonte latina nova","en":"glyphs in the new Latin font","es":"glifos de la nueva fuente latina"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}}],"grupos":[{"titulo":{"pt":"As treze telas que estavam em japonês","en":"The thirteen screens that were in Japanese","es":"Las trece pantallas que estaban en japonés"},"itens":[{"t":{"pt":"A <b>dedicatória ao Che</b> e o <b>prólogo de 1956</b> abrem o cartucho antes de qualquer partida, e eram as duas telas que o Ocidente nunca viu: a versão americana, <i>Guerrilla War</i>, tirou o retrato, o prólogo e os nomes dos jogadores. Aqui estão os três, em letra latina.","en":"The <b>dedication to Che</b> and the <b>1956 prologue</b> open the cartridge before any game starts, and they were the two screens the West never saw: the American release, <i>Guerrilla War</i>, took out the portrait, the prologue and the players' names. Here all three are, in Latin script.","es":"La <b>dedicatoria al Che</b> y el <b>prólogo de 1956</b> abren el cartucho antes de cualquier partida, y eran las dos pantallas que Occidente nunca vio: la versión americana, <i>Guerrilla War</i>, quitó el retrato, el prólogo y los nombres de los jugadores. Aquí están los tres, en letra latina."},"foto":"guevara/03-dedicatoria.png"},{"t":{"pt":"<b>As nove aberturas de fase</b> — uma antes de cada área, com o relatório do que acabou de acontecer — estavam em japonês na ROM e continuaram em japonês em tudo o que se publicou até aqui.","en":"<b>The nine stage openings</b> — one before each area, reporting what has just happened — were in Japanese in the ROM and stayed in Japanese in everything published until now.","es":"<b>Las nueve aperturas de fase</b> — una antes de cada área, con el parte de lo que acaba de pasar — estaban en japonés en la ROM y siguieron en japonés en todo lo publicado hasta ahora."},"foto":"guevara/09-abertura-fase.png"},{"t":{"pt":"<b>O final inteiro</b>: a tela de <code>CONGRATULATION</code> e a narração de cinco linhas que conta o que veio depois — o Che feito <b>comandante</b>, a morte na Bolívia, o Castro no poder. É a recompensa de atravessar a ilha, e ninguém que não lesse japonês a tinha lido.","en":"<b>The whole ending</b>: the <code>CONGRATULATION</code> screen and the five-line narration telling what came next — Che made <b>comandante</b>, the death in Bolivia, Castro in power. It is the reward for crossing the island, and nobody who could not read Japanese had ever read it.","es":"<b>El final entero</b>: la pantalla de <code>CONGRATULATION</code> y la narración de cinco líneas que cuenta lo que vino después — el Che hecho <b>comandante</b>, la muerte en Bolivia, Castro en el poder. Es la recompensa de cruzar la isla, y nadie que no leyera japonés la había leído."},"foto":"guevara/10-final.png"},{"t":{"pt":"O japonês não é ASCII: é <b>índice de tile de uma fonte sob medida</b>, com os silabários parciais e só os kanji daquelas telas. Antes de traduzir foi preciso <b>redesenhar cada tela a partir do dado da ROM</b> para poder lê-la — nenhum editor de texto mostra o que ali está escrito.","en":"The Japanese is not ASCII: it is a <b>tile index into a bespoke font</b>, carrying partial syllabaries and only the kanji those screens use. Before translating, each screen had to be <b>redrawn from the ROM data</b> so it could be read at all — no text editor shows what is written there.","es":"El japonés no es ASCII: es <b>índice de tile de una fuente a medida</b>, con los silabarios parciales y solo los kanji de esas pantallas. Antes de traducir hubo que <b>redibujar cada pantalla a partir del dato de la ROM</b> para poder leerla — ningún editor de texto muestra lo que hay escrito ahí."}},{"t":{"pt":"<b>少佐</b> é literalmente <i>major</i>. A patente que o Castro deu ao Che em 1957 foi <b>comandante</b>, que é como o mundo o conhece — e é o que a narração diz.","en":"<b>少佐</b> literally means <i>major</i>. The rank Castro gave Che in 1957 was <b>comandante</b>, which is how the world knows him — and it is what the narration says.","es":"<b>少佐</b> es literalmente <i>mayor</i>. El grado que Castro dio al Che en 1957 fue <b>comandante</b>, que es como el mundo lo conoce — y es lo que dice la narración."}}]},{"titulo":{"pt":"A fonte que fez o texto caber","en":"The font that made the text fit","es":"La fuente que hizo que el texto cupiera"},"itens":[{"t":{"pt":"A fonte japonesa desenha cada caractere num bloco de <b>2×2 tiles</b>, com dois glifos empacotados no mesmo grupo, e a tela do prólogo tem <b>nove linhas</b>. Em letra latina de largura cheia o mesmo prólogo pediria <b>vinte e uma</b> — cortaria três quintos do texto.","en":"The Japanese font draws each character in a <b>2×2 tile</b> block, with two glyphs packed into the same group, and the prologue screen holds <b>nine lines</b>. In full-width Latin the same prologue would want <b>twenty-one</b> — it would cut three fifths of the text.","es":"La fuente japonesa dibuja cada carácter en un bloque de <b>2×2 tiles</b>, con dos glifos empaquetados en el mismo grupo, y la pantalla del prólogo tiene <b>nueve líneas</b>. En letra latina de ancho completo el mismo prólogo pediría <b>veintiuna</b> — cortaría tres quintos del texto."},"foto":"guevara/04-prologo.png"},{"t":{"pt":"A fonte nova é de <b>meia largura, 8×16, 59 glifos</b> desenhados pixel a pixel, e a caixa foi alargada para <b>28 colunas</b>. Assim os três idiomas fecham em <b>oito linhas</b>, com o texto inteiro e <b>com acento</b>.","en":"The new font is <b>half-width, 8×16, 59 glyphs</b> drawn pixel by pixel, and the box was widened to <b>28 columns</b>. All three languages then close in <b>eight lines</b>, with the whole text and <b>with accents</b>.","es":"La fuente nueva es de <b>media anchura, 8×16, 59 glifos</b> dibujados píxel a píxel, y la caja se amplió a <b>28 columnas</b>. Así los tres idiomas cierran en <b>ocho líneas</b>, con el texto entero y <b>con acentos</b>."}},{"t":{"pt":"Duas telas obrigaram o texto a <b>crescer</b>, não a encolher. A do <code>CONGRATULATION</code> são cinco listas de endereço fixo — em quatro linhas a quinta ficaria sem dado — e o bloco da narração tem <b>344 bytes exatos</b>, que só fecham com cinco linhas de 28. O português foi alongado para caber.","en":"Two screens forced the text to <b>grow</b>, not shrink. The <code>CONGRATULATION</code> screen is five lists at fixed addresses — in four lines the fifth would be left without data — and the narration block is <b>exactly 344 bytes</b>, which only add up with five lines of 28. The Portuguese was lengthened to fit.","es":"Dos pantallas obligaron al texto a <b>crecer</b>, no a encoger. La de <code>CONGRATULATION</code> son cinco listas de dirección fija — en cuatro líneas la quinta se quedaría sin dato — y el bloque de la narración tiene <b>344 bytes exactos</b>, que solo cuadran con cinco líneas de 28. El portugués se alargó para caber."}},{"t":{"pt":"A dedicatória em espanhol não cabia em duas linhas: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> tem 29 caracteres e a caixa tinha 28. A largura da caixa passou a ser <b>medida pela linha mais longa</b>, e o espanhol saiu em três linhas de 17.","en":"The Spanish dedication did not fit in two lines: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> is 29 characters and the box was 28. The box width is now <b>measured from the longest line</b>, and the Spanish came out in three lines of 17.","es":"La dedicatoria en español no cabía en dos líneas: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> tiene 29 caracteres y la caja tenía 28. La anchura de la caja pasó a <b>medirse por la línea más larga</b>, y el español salió en tres líneas de 17."}}]},{"titulo":{"pt":"Uma ROM, três idiomas","en":"One ROM, three languages","es":"Una ROM, tres idiomas"},"itens":[{"t":{"pt":"O espanhol não é outro arquivo: é uma opção do menu. <b>Todo o texto localizado vive no banco 5</b>, e trocar de idioma é trocar qual banco é mapeado ali. Para caberem os três, a ROM foi <b>expandida de 128 para 256 KB</b>.","en":"Spanish is not another file: it is a menu option. <b>Every localised string lives in bank 5</b>, and switching language means switching which bank is mapped there. To hold all three, the ROM was <b>expanded from 128 to 256 KB</b>.","es":"El español no es otro archivo: es una opción del menú. <b>Todo el texto localizado vive en el banco 5</b>, y cambiar de idioma es cambiar qué banco se mapea ahí. Para que quepan los tres, la ROM se <b>amplió de 128 a 256 KB</b>."}},{"t":{"pt":"No MMC1 o banco fixo é sempre o <b>último</b>: dobrar a ROM faz o banco 7 deixar de ser o fixo e o <b>15</b> tomar o lugar. O 15 é cópia do 7, aplicada <b>depois</b> de todos os remendos — na ordem inversa o jogo roda código antigo sem dar erro visível.","en":"On the MMC1 the fixed bank is always the <b>last</b> one: doubling the ROM stops bank 7 from being fixed and puts <b>15</b> in its place. Bank 15 is a copy of 7, applied <b>after</b> every patch — the other way round, the game runs old code with no visible error.","es":"En el MMC1 el banco fijo es siempre el <b>último</b>: doblar la ROM hace que el banco 7 deje de ser el fijo y el <b>15</b> ocupe su lugar. El 15 es copia del 7, aplicada <b>después</b> de todos los parches — al revés, el juego corre código viejo sin dar error visible."}},{"t":{"pt":"<b>O preço de haver uma ROM só:</b> as cinco palavras que o jogo desenha como <i>sprite</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> e a despedida — moram no banco fixo, que é o mesmo para os três idiomas, e ficaram <b>em inglês</b>. Também ficaram como estavam <code>PUSH START</code> e <code>© SNK CORP. 1988</code>, que já vêm em letra latina no cartucho japonês.","en":"<b>The price of a single ROM:</b> the five words the game draws as <i>sprites</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> and the farewell — live in the fixed bank, which is the same for all three languages, and stayed <b>in English</b>. So did <code>PUSH START</code> and <code>© SNK CORP. 1988</code>, which the Japanese cartridge already prints in Latin script.","es":"<b>El precio de que haya una sola ROM:</b> las cinco palabras que el juego dibuja como <i>sprites</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> y la despedida — viven en el banco fijo, que es el mismo para los tres idiomas, y se quedaron <b>en inglés</b>. También quedaron como estaban <code>PUSH START</code> y <code>© SNK CORP. 1988</code>, que el cartucho japonés ya imprime en letra latina."}}]},{"titulo":{"pt":"O menu de opções, que o jogo não tinha","en":"The options menu the game never had","es":"El menú de opciones que el juego no tenía"},"itens":[{"t":{"pt":"O menu inicial ganhou uma <b>terceira entrada</b>, <code>OPTIONS</code>, ao lado de um e dois jogadores. A porta tem placa: antes as opções abriam por SELECT na tela de título, e quem não soubesse não descobria.","en":"The start menu gained a <b>third entry</b>, <code>OPTIONS</code>, beside one and two players. The door has a sign now: options used to open with SELECT on the title screen, and anyone who did not know never found them.","es":"El menú inicial ganó una <b>tercera entrada</b>, <code>OPTIONS</code>, junto a uno y dos jugadores. La puerta tiene cartel: antes las opciones se abrían con SELECT en la pantalla de título, y quien no lo supiera no las encontraba."},"foto":"guevara/06-menu-modo.png"},{"t":{"pt":"Quatro ajustes: <b>LANGUAGE</b> (inglês, português, espanhol), <b>LIVES</b>, <b>DIFFICULTY</b> e um <b>SOUND TEST</b> que toca a trilha inteira. Num run-and-gun de 1988, poder escolher as vidas é a diferença entre atravessar a ilha e desistir nela.","en":"Four settings: <b>LANGUAGE</b> (English, Portuguese, Spanish), <b>LIVES</b>, <b>DIFFICULTY</b> and a <b>SOUND TEST</b> that plays the whole soundtrack. In a 1988 run-and-gun, being able to set your lives is the difference between crossing the island and giving up on it.","es":"Cuatro ajustes: <b>LANGUAGE</b> (inglés, portugués, español), <b>LIVES</b>, <b>DIFFICULTY</b> y un <b>SOUND TEST</b> que suena la banda sonora entera. En un run-and-gun de 1988, poder elegir las vidas es la diferencia entre cruzar la isla y rendirse en ella."},"foto":"guevara/07-opcoes.png"},{"t":{"pt":"As vidas vão de <b>1 a 4</b>, e há <b>infinito</b> — o decremento fica desligado, conferido ao longo de <b>13.400 quadros</b>. O teto parou em 4, e não em 9, porque a fotografia contou o que a medição não contava: escolhidas seis, a tela mostrava <b>quatro cruzes</b>, que é quanto o indicador tem lugar para desenhar. Prometer o que a tela não mostra seria mentir.","en":"Lives run from <b>1 to 4</b>, and there is <b>infinite</b> — the decrement is switched off, checked across <b>13,400 frames</b>. The ceiling stopped at 4 rather than 9 because the photograph told what measurement did not: set to six, the screen showed <b>four crosses</b>, which is all the indicator has room to draw. Promising what the screen does not show would be a lie.","es":"Las vidas van de <b>1 a 4</b>, y hay <b>infinito</b> — el decremento queda apagado, comprobado a lo largo de <b>13.400 fotogramas</b>. El tope se quedó en 4, y no en 9, porque la fotografía contó lo que la medición no contaba: puestas seis, la pantalla mostraba <b>cuatro cruces</b>, que es lo que el indicador tiene sitio para dibujar. Prometer lo que la pantalla no enseña sería mentir."}},{"t":{"pt":"O <b>sound test</b> não precisou de rotina nova: o jogo já tinha uma que toca por número, e o menu passou a chamá-la. A primeira tentativa chamava a escrita serial do banco de gráficos — não travava, não dava tela preta, <b>só não tocava nota nenhuma</b>, e ainda reprogramava um banco de CHR.","en":"The <b>sound test</b> needed no new routine: the game already had one that plays by number, and the menu now calls it. The first attempt called the serial write of the graphics bank instead — it did not crash, it did not blank the screen, it <b>simply played nothing</b>, and reprogrammed a CHR bank on the way.","es":"El <b>sound test</b> no necesitó rutina nueva: el juego ya tenía una que suena por número, y el menú pasó a llamarla. El primer intento llamaba a la escritura serial del banco de gráficos — no colgaba, no daba pantalla negra, <b>simplemente no sonaba nada</b>, y encima reprogramaba un banco de CHR."}}]},{"titulo":{"pt":"O que passou a aparecer na tela de jogo","en":"What now shows on the game screen","es":"Lo que pasó a verse en la pantalla de juego"},"itens":[{"t":{"pt":"<b>Quatro cruzes no canto</b>, uma por vida. O jogo original não mostrava as vidas em lugar nenhum: só se sabia quantas restavam quando a tela entre mortes dizia.","en":"<b>Four crosses in the corner</b>, one per life. The original game showed the lives nowhere: you only learned how many were left when the screen between deaths told you.","es":"<b>Cuatro cruces en la esquina</b>, una por vida. El juego original no mostraba las vidas en ninguna parte: solo se sabía cuántas quedaban cuando lo decía la pantalla entre muertes."},"foto":"guevara/08-vidas.png"},{"t":{"pt":"Não é <code>VIDAS: 3</code> porque não caberia: na tela de jogo cada letra é um <i>sprite</i>, e o NES só desenha <b>oito por linha de varredura</b>. Medido em 3.031 quadros da ROM original, o próprio jogo já usa cinco ali em cima — <code>VIDAS: 3</code> são oito sozinhos.","en":"It is not <code>LIVES: 3</code> because that would not fit: on the game screen each letter is a <i>sprite</i>, and the NES only draws <b>eight per scanline</b>. Measured across 3,031 frames of the original ROM, the game itself already uses five up there — <code>LIVES: 3</code> is eight on its own.","es":"No es <code>VIDAS: 3</code> porque no cabría: en la pantalla de juego cada letra es un <i>sprite</i>, y la NES solo dibuja <b>ocho por línea de barrido</b>. Medido en 3.031 fotogramas de la ROM original, el propio juego ya usa cinco ahí arriba — <code>VIDAS: 3</code> son ocho él solo."}},{"t":{"pt":"E <b>nenhum gráfico novo foi gravado</b> para isso. O banco de sprites muda a cada fase, são cinco, e a cruz já existia <b>idêntica nos cinco</b> — é o sinal de mais que o jogo usa nos itens. Com as vidas infinitas, o mesmo laço mostra <b>um símbolo só</b>.","en":"And <b>no new graphics were written</b> for it. The sprite bank changes with each stage — there are five — and the cross already existed <b>identically in all five</b>: it is the plus sign the game uses on items. With infinite lives, the same loop shows <b>a single symbol</b>.","es":"Y <b>no se grabó ningún gráfico nuevo</b> para eso. El banco de sprites cambia en cada fase, son cinco, y la cruz ya existía <b>idéntica en los cinco</b> — es el signo de más que el juego usa en los objetos. Con las vidas infinitas, el mismo bucle muestra <b>un solo símbolo</b>."}}]},{"titulo":{"pt":"Correções, e a ROM original intacta","en":"Corrections, and the original ROM untouched","es":"Correcciones, y la ROM original intacta"},"itens":[{"t":{"pt":"<b>Duas correções são de conteúdo, não de idioma.</b> O prólogo original põe <b>Cuba na América do Sul</b>, e aqui ela está na América Central; e o menu que dizia <code>TWO PLAYERS MODE</code> passou a dizer <code>TWO PLAYER MODE</code>.","en":"<b>Two corrections are of content, not language.</b> The original prologue places <b>Cuba in South America</b>, and here it sits in Central America; and the menu that read <code>TWO PLAYERS MODE</code> now reads <code>TWO PLAYER MODE</code>.","es":"<b>Dos correcciones son de contenido, no de idioma.</b> El prólogo original pone <b>Cuba en América del Sur</b>, y aquí está en América Central; y el menú que decía <code>TWO PLAYERS MODE</code> pasó a decir <code>TWO PLAYER MODE</code>."}},{"t":{"pt":"O <b>logo da tela de título</b> era katakana. O latino foi desenhado em <b>224×56 pixels — 192 tiles únicos</b> — mantendo a proporção da arte original, e coube nos índices que sobravam com folga de 31.","en":"The <b>title-screen logo</b> was katakana. The Latin one was drawn at <b>224×56 pixels — 192 unique tiles</b> — keeping the proportion of the original artwork, and fitted in the spare indices with 31 to go.","es":"El <b>logo de la pantalla de título</b> era katakana. El latino se dibujó en <b>224×56 píxeles — 192 tiles únicos</b> — manteniendo la proporción del arte original, y cupo en los índices sobrantes con holgura de 31."},"foto":"guevara/01-titulo.png"},{"t":{"pt":"<b>A tela de créditos do patch</b> entra antes do título, com a <b>versão queimada na imagem</b> — renomear o arquivo não versiona nada, e é assim que se sabe, meses depois, qual build está no cartucho. Ela precisou de uma espera própria: a tela do boot fica no brilho máximo por <b>quatro quadros</b>, e com três linhas a mais não daria tempo de ler.","en":"<b>The patch credits screen</b> comes before the title, with the <b>version burned into the image</b> — renaming the file versions nothing, and this is how you know, months later, which build is on the cartridge. It needed a wait of its own: the boot screen stays at full brightness for <b>four frames</b>, and with three more lines there would be no time to read.","es":"<b>La pantalla de créditos del parche</b> entra antes del título, con la <b>versión grabada en la imagen</b> — renombrar el archivo no versiona nada, y así se sabe, meses después, qué build está en el cartucho. Necesitó una espera propia: la pantalla de arranque se queda al brillo máximo <b>cuatro fotogramas</b>, y con tres líneas más no daría tiempo de leerla."},"foto":"guevara/02-creditos.png"},{"t":{"pt":"Nada disso vale sem prova. Cada trecho de código usado no cartucho foi <b>enchido de <code>$AA</code> e comparado com a ROM original em 14 quadros</b> — boot, prólogo, título, demo e jogo —, com <b>0 pixel de diferença</b>; cada remendo <b>afirma os bytes originais antes de escrever</b>; e a guarda aborta a gravação se um byte mudar fora das <b>38 regiões declaradas</b>.","en":"None of it counts without proof. Every block of code used in the cartridge was <b>filled with <code>$AA</code> and compared against the original ROM across 14 frames</b> — boot, prologue, title, demo and gameplay — at <b>0 pixels of difference</b>; every patch <b>asserts the original bytes before writing</b>; and the guard aborts the write if a single byte changes outside the <b>38 declared regions</b>.","es":"Nada de eso vale sin prueba. Cada bloque de código usado en el cartucho se <b>llenó de <code>$AA</code> y se comparó con la ROM original en 14 fotogramas</b> — arranque, prólogo, título, demo y partida —, con <b>0 píxeles de diferencia</b>; cada parche <b>afirma los bytes originales antes de escribir</b>; y la guarda aborta la grabación si un byte cambia fuera de las <b>38 regiones declaradas</b>."}}]}],"patch":{"versoes":{"en":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"},"pt":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"},"es":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"}},"nota":{"pt":"Os três idiomas estão dentro da mesma ROM: escolha OPTIONS no menu inicial e mude LANGUAGE.","en":"All three languages live inside the same ROM: pick OPTIONS on the start menu and change LANGUAGE.","es":"Los tres idiomas están dentro de la misma ROM: elige OPTIONS en el menú inicial y cambia LANGUAGE."},"rom":"Guevara (Japan).nes","rom_md5":"cd4bc85243c73274d74efb2f61b5a9c1"},"fotos":[{"f":"guevara/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"A tela de título do cartucho japonês.","en":"The Japanese cartridge title screen.","es":"La pantalla de título del cartucho japonés."}},{"f":"guevara/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Antes do título, com a versão queimada na imagem.","en":"Before the title, with the version burned into the image.","es":"Antes del título, con la versión grabada en la imagen."}},{"f":"guevara/03-dedicatoria.png","t":{"pt":"A dedicatória","en":"The dedication","es":"La dedicatoria"},"c":{"pt":"O retrato e a dedicatória que a ROM japonesa traz.","en":"The portrait and the dedication the Japanese ROM carries.","es":"El retrato y la dedicatoria que trae la ROM japonesa."}},{"f":"guevara/04-prologo.png","t":{"pt":"O prólogo de 1956","en":"The 1956 prologue","es":"El prólogo de 1956"},"c":{"pt":"Nove linhas de contexto histórico, agora legíveis.","en":"Nine lines of historical context, now readable.","es":"Nueve líneas de contexto histórico, ahora legibles."}},{"f":"guevara/05-jogo.png","t":{"pt":"Em jogo","en":"In game","es":"En juego"},"c":{"pt":"O run-and-gun para dois jogadores.","en":"The two-player run-and-gun.","es":"El run-and-gun para dos jugadores."}},{"f":"guevara/06-menu-modo.png","t":{"pt":"O menu inicial","en":"The start menu","es":"El menú inicial"},"c":{"pt":"A terceira entrada, OPTIONS, é nova.","en":"The third entry, OPTIONS, is new.","es":"La tercera entrada, OPTIONS, es nueva."}},{"f":"guevara/07-opcoes.png","t":{"pt":"O menu de opções","en":"The options menu","es":"El menú de opciones"},"c":{"pt":"Idioma, vidas, dificuldade e sound test.","en":"Language, lives, difficulty and sound test.","es":"Idioma, vidas, dificultad y sound test."}},{"f":"guevara/08-vidas.png","t":{"pt":"As vidas na tela","en":"Lives on screen","es":"Las vidas en pantalla"},"c":{"pt":"Uma cruz por vida, no canto — o original não as mostrava.","en":"One cross per life, in the corner — the original showed none.","es":"Una cruz por vida, en la esquina — el original no las mostraba."}},{"f":"guevara/09-abertura-fase.png","t":{"pt":"Abertura de fase","en":"Stage opening","es":"Apertura de fase"},"c":{"pt":"Uma antes de cada área; as nove estavam em japonês.","en":"One before each area; all nine were in Japanese.","es":"Una antes de cada área; las nueve estaban en japonés."}},{"f":"guevara/10-final.png","t":{"pt":"A narração do final","en":"The closing narration","es":"La narración del final"},"c":{"pt":"O que aconteceu depois — e ninguém fora do Japão tinha lido.","en":"What happened next — and nobody outside Japan had read it.","es":"Lo que pasó después — y nadie fuera de Japón lo había leído."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"dragon-ball-3","nome":"Dragon Ball 3","subtitulo":"Gokuu Den","jp":"ドラゴンボール3 悟空伝","traducao_titulo":"Legend of Goku","publisher":"Bandai","dev":"Bandai","ano":1989,"data":"1989","sistema":"Famicom","mapper":"Mapper 16 (Bandai FCG-1/2) · 128 KB PRG expanded to 256 KB · 256 KB CHR","categoria":{"pt":"Tradução + arte","en":"Translation + artwork","es":"Traducción + arte"},"nivel":"beta","versao":"English v1.0 · Português v1.0","capa":"db3/00-capa-patreon.jpg","linha":{"pt":"Dragon Ball em cartas, 1989. O número de defesa da carta era um kanji desenhado na arte; agora é algarismo, e o treino deixou de ser no chute.","en":"Dragon Ball as a 1989 card RPG. The defence number was a kanji drawn into the art; now it is a digit, and training is no longer guesswork.","es":"Dragon Ball en cartas, 1989. El número de defensa era un kanji dibujado en la ilustración; ahora es una cifra que se puede leer."},"resumo":{"pt":["Este é o Dragon Ball de tabuleiro: você anda pelo mapa, tira uma carta e luta com ela. O jogo reconta a saga do Goku desde o começo — a caça às esferas do dragão, o Torneio de Artes Marciais, o Rei Cutelo — e é a Bandai levando o mangá ao Famicom em 1989, com o baralho decidindo o turno anos antes de isso virar um gênero.","Cada carta traz uma bola com o <b>número de defesa</b> embaixo, e esse número era um <b>algarismo kanji</b> desenhado nos gráficos: 一二三四五六. Não é enfeite — o jogo manda compará-lo. O Karin só aceita carta com defesa igual ou maior que a dele, e o Mr. Popo aceita carta que bata em estrelas, técnica <i>ou</i> defesa. Quem não lê kanji jogava dois dos três treinos no chute. As seis bolas foram repintadas com <b>algarismo latino</b>, e a arte é tão parecida entre elas que só <b>53 pixels divergem</b> nos seis blocos de 16×16, todos no miolo onde morava o kanji. Os dez kanji das cartas — 拳 蹴 連 必 術 逃 ? 体 特 武 — também são tiles desenhados à mão, e viraram rótulos de três letras numa <b>mini-fonte de 5×7 px</b> feita para o caso: três letras de 5 px ocupam 15 dos 16 px do slot, sem espaço entre elas. O sentido de cada uma foi conferido contra o manual da Bandai de 1989, e foi ele que corrigiu a carta 体, que não é defesa: 体当り é investida corporal, um ataque.","O roteiro inteiro está em inglês — <b>1.305 de 1.305 mensagens</b>, mais as 40 de batalha e treino — dentro de uma caixa de <b>três linhas por vinte e quatro colunas</b> que o jogo não sabe continuar na tela seguinte. <b>164 mensagens</b> passavam de 45 glifos no japonês e foram reescritas para caber sem perder o sentido, e <b>254</b> das que ficaram fecham sem uma coluna sobrando. O título 悟空伝 foi refeito como <code>LEGEND OF GOKU</code> dentro dos mesmos 96×32 pixels, a ROM cresceu de <b>128 para 256 KB</b>, e a grade de senha virou letras latinas sem colisão entre símbolos: <b>quem tem uma senha anotada desde 1989 pode digitá-la aqui</b>."],"en":["This is Dragon Ball as a board game: you move across the map, draw a card and fight with it. It retells Goku's saga from the beginning — the hunt for the dragon balls, the Martial Arts Tournament, King Piccolo — and it is Bandai bringing the manga to the Famicom in 1989, with the deck deciding the turn years before that became a genre.","Every card carries a ball with its <b>defence number</b> underneath, and that number was a <b>kanji numeral</b> drawn into the graphics: 一二三四五六. It is not decoration — the game tells you to compare it. Karin only accepts a card whose defence matches or beats his own, and Mr. Popo accepts a card that wins on stars, technique <i>or</i> defence. Anyone who cannot read kanji was guessing through two of the three trainings. The six balls were repainted with <b>Latin digits</b>, and the artwork is so nearly identical between them that only <b>53 pixels differ</b> across the six 16×16 blocks, all in the core where the kanji used to sit. The ten card kanji — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn tiles too, and became three-letter labels in a <b>5×7 px mini-font</b> built for the job: three 5 px letters fill 15 of the slot's 16 px, with no gap between them. Each meaning was checked against Bandai's 1989 manual, and it was the manual that corrected the 体 card, which is not defence: 体当り is a body slam, an attack.","The whole script is in English — <b>1,305 of 1,305 messages</b>, plus the 40 for battle and training — inside a box of <b>three lines by twenty-four columns</b> that the game cannot continue onto a following screen. <b>164 messages</b> ran past 45 glyphs in Japanese and were rewritten to fit without losing their sense, and <b>254</b> of those that stayed close with not a column to spare. The 悟空伝 title was remade as <code>LEGEND OF GOKU</code> inside the same 96×32 pixels, the ROM grew from <b>128 to 256 KB</b>, and the password grid became Latin letters with no symbol collisions: <b>a password written down in 1989 still types in</b>."],"es":["Este es el Dragon Ball de tablero: avanzas por el mapa, robas una carta y luchas con ella. El juego vuelve a contar la saga de Goku desde el principio — la caza de las <b>Bolas de Dragón</b>, el Torneo de Artes Marciales, el Rey Piccolo — y es Bandai la que lleva el manga al Famicom en 1989, con la baraja decidiendo el turno años antes de que aquello fuera un género.","Cada carta lleva una bola con el <b>número de defensa</b> debajo, y ese número era un <b>numeral kanji</b> dibujado en los gráficos: 一二三四五六. No es adorno — el juego te manda compararlo. Karin solo acepta una carta con defensa igual o mayor que la suya, y Mr. Popo acepta cualquier carta que gane en estrellas, técnica <i>o</i> defensa. Quien no leía kanji jugaba dos de los tres entrenamientos a ciegas. Las seis bolas se repintaron con <b>cifra latina</b>, y las ilustraciones se parecen tanto entre sí que solo <b>53 píxeles difieren</b> en los seis bloques de 16×16, todos en el centro donde vivía el kanji. Los diez kanji de las cartas — 拳 蹴 連 必 術 逃 ? 体 特 武 — también son tiles dibujados a mano, y pasaron a ser etiquetas de tres letras en una <b>minifuente de 5×7 px</b> hecha para el caso: tres letras de 5 px ocupan 15 de los 16 px de la casilla, sin espacio entre ellas. El sentido de cada una se cotejó con el manual de Bandai de 1989, y fue él quien corrigió la carta 体, que no es defensa: 体当り es una embestida, un ataque.","El guion entero está en inglés — <b>1.305 de 1.305 mensajes</b>, más los 40 de combate y entrenamiento — dentro de una caja de <b>tres líneas por veinticuatro columnas</b> que el juego no sabe continuar en la pantalla siguiente. <b>164 mensajes</b> pasaban de 45 glifos en japonés y se reescribieron para caber sin perder el sentido, y <b>254</b> de los que quedaron cierran sin una columna de sobra. El título 悟空伝 se rehízo como <code>LEGEND OF GOKU</code> dentro de los mismos 96×32 píxeles, la ROM creció de <b>128 a 256 KB</b>, y la rejilla de contraseña pasó a letras latinas sin colisiones entre símbolos: <b>quien tenga una contraseña anotada en 1989 puede escribirla aquí</b>."]},"numeros":[{"v":"1,305","r":{"pt":"mensagens traduzidas","en":"messages translated","es":"mensajes traducidos"}},{"v":"96","r":{"pt":"nomes, golpes e nomes de batalha","en":"names, techniques and battle names","es":"nombres, técnicas y nombres de batalla"}},{"v":"10","r":{"pt":"kanji redesenhados como arte","en":"kanji redrawn as artwork","es":"kanji redibujados como ilustración"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.305 de 1.305 mensagens</b> em inglês — o roteiro inteiro","en":"<b>1,305 of 1,305 messages</b> in English — the entire script","es":"<b>1.305 de 1.305 mensajes</b> en inglés — el guion entero"},"foto":"db3/04-dialogo.png"},{"t":{"pt":"<b>66 personagens e inimigos, 14 golpes, 16 nomes de batalha</b>, com o glossário casado com os nomes oficiais da Viz","en":"<b>66 characters and enemies, 14 techniques, 16 battle names</b>, with the glossary matched to the official Viz names","es":"<b>66 personajes y enemigos, 14 técnicas, 16 nombres de batalla</b>, con el glosario casado con los nombres oficiales de Viz"}},{"t":{"pt":"O limite não é o comprimento do texto, é a <b>caixa</b>: três linhas por vinte e quatro colunas, e o jogo não tem código de continuação. <b>164 mensagens</b> tinham 45 ou mais glifos no japonês e foram comprimidas sem perder o sentido.","en":"The limit is not the length of the text, it is the <b>box</b>: three lines by twenty-four columns, and the game has no continuation code. <b>164 messages</b> ran to 45 or more glyphs in Japanese and were compressed without losing their sense.","es":"El límite no es la longitud del texto, es la <b>caja</b>: tres líneas por veinticuatro columnas, y el juego no tiene código de continuación. <b>164 mensajes</b> llegaban a 45 o más glifos en japonés y se comprimieron sin perder el sentido."}},{"t":{"pt":"Os <b>614 pares</b> de aspas japonesas「 」viraram aspas latinas <b>sem custar um byte</b>.","en":"The <b>614 pairs</b> of Japanese quotation marks 「 」 became Latin quotes <b>at no byte cost</b>.","es":"Los <b>614 pares</b> de comillas japonesas 「 」 pasaron a comillas latinas <b>sin costar un byte</b>."}}]},{"titulo":{"pt":"O que não era texto","en":"What was not text","es":"Lo que no era texto"},"itens":[{"t":{"pt":"<b>Os dez kanji das cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — são tiles de 16×16 desenhados à mão, não caracteres. Viraram abreviações latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por isso a <code>かんじのカード</code> virou <b>symbol card</b> e não \"kanji card\": chamar de kanji viraria mentira na tela.","en":"<b>The ten card kanji</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — are hand-drawn 16×16 tiles, not characters. They became Latin abbreviations: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. That is why <code>かんじのカード</code> became <b>symbol card</b> and not \"kanji card\": calling it kanji would have been a lie on screen.","es":"<b>Los diez kanji de las cartas</b> — 拳 蹴 連 必 術 逃 ? 体 特 武 — son tiles de 16×16 dibujados a mano, no caracteres. Pasaron a ser abreviaturas latinas: <code>PCH KCK CMB FIN MAG RUN ? BDY SPC WPN</code>. Por eso la <code>かんじのカード</code> pasó a ser <b>symbol card</b> y no \"kanji card\": llamarla kanji sería mentira en pantalla."},"foto":"db3/05-cartas.png"},{"t":{"pt":"<b>As seis bolas de defesa</b> traziam os numerais cursivos 一 a 六, também desenhados. Agora trazem <b>1 a 6</b>.","en":"<b>The six defence balls</b> carried the cursive numerals 一 to 六, also drawn. They now carry <b>1 to 6</b>.","es":"<b>Las seis bolas de defensa</b> llevaban los numerales cursivos 一 a 六, también dibujados. Ahora llevan <b>1 a 6</b>."}},{"t":{"pt":"<b>O título 悟空伝</b> — doze tiles por quatro, 96×32 pixels de arte — foi redesenhado como <code>LEGEND OF GOKU</code>, dentro do mesmo espaço.","en":"<b>The 悟空伝 title</b> — twelve tiles by four, 96×32 pixels of artwork — was redrawn as <code>LEGEND OF GOKU</code>, inside the same space.","es":"<b>El título 悟空伝</b> — doce tiles por cuatro, 96×32 píxeles de ilustración — fue redibujado como <code>LEGEND OF GOKU</code>, dentro del mismo espacio."},"foto":"db3/01-titulo.png"}]},{"titulo":{"pt":"A senha, e a promessa de não quebrá-la","en":"The password, and the promise not to break it","es":"La contraseña, y la promesa de no romperla"},"itens":[{"t":{"pt":"<b>A grade de senha virou letras latinas</b>, sem colisão entre símbolos — e <b>as senhas antigas continuam válidas</b>. Quem tem uma senha anotada de 1989 pode digitá-la aqui.","en":"<b>The password grid became Latin letters</b>, with no collisions between symbols — and <b>old passwords remain valid</b>. Anyone with a password written down since 1989 can type it in here.","es":"<b>La rejilla de contraseña pasó a letras latinas</b>, sin colisiones entre símbolos — y <b>las contraseñas antiguas siguen valiendo</b>. Quien tenga una anotada de 1989 puede escribirla aquí."},"foto":"db3/06-senha.png"},{"t":{"pt":"<b>Tela de créditos do patch</b> antes do título — página branca, 5 segundos, pula com A ou START.","en":"<b>A patch credits screen</b> before the title — white page, 5 seconds, skippable with A or START.","es":"<b>Pantalla de créditos del parche</b> antes del título — página blanca, 5 segundos, se salta con A o START."},"foto":"db3/02-creditos.png"}]},{"titulo":{"pt":"A ROM cresceu, e a original não foi tocada","en":"The ROM grew, and the original was never touched","es":"La ROM creció, y la original nunca se tocó"},"itens":[{"t":{"pt":"O texto inglês não cabia na origem, então a ROM foi <b>expandida de 128 KB para 256 KB</b> de código. O construtor monta a ROM inteira do zero, <b>nunca escreve na original</b> (ela é somente leitura, e o MD5 é conferido ao abrir) e <b>aborta se qualquer byte mudar fora das regiões declaradas</b>.","en":"The English text did not fit where it was, so the ROM was <b>expanded from 128 KB to 256 KB</b> of code. The builder assembles the whole ROM from scratch, <b>never writes to the original</b> (it is read-only, and the MD5 is checked on open) and <b>aborts if any byte changes outside the declared regions</b>.","es":"El texto inglés no cabía donde estaba, así que la ROM se <b>amplió de 128 KB a 256 KB</b> de código. El constructor monta la ROM entera desde cero, <b>nunca escribe en la original</b> (es de solo lectura, y el MD5 se comprueba al abrir) y <b>aborta si cambia cualquier byte fuera de las regiones declaradas</b>."}},{"t":{"pt":"Um verificador confere <b>as 1.305 mensagens e os 112 nomes</b> na ROM montada antes de qualquer coisa sair.","en":"A checker verifies <b>all 1,305 messages and 112 names</b> on the assembled ROM before anything ships.","es":"Un verificador comprueba <b>los 1.305 mensajes y los 112 nombres</b> en la ROM montada antes de que salga nada."}}]},{"titulo":{"pt":"Batalha e treino, fechados","en":"Battle and training, closed","es":"Combate y entrenamiento, cerrados"},"itens":[{"t":{"pt":"As <b>40 mensagens</b> de batalha e treino, nos dois blocos do banco 3, estão traduzidas — <b>inclusive as que carregam um número no meio</b>, disfarçado de espaço. Era a última coisa que segurava o lançamento: encurtar o texto sem saber como o jogo posiciona esse número poria o algarismo no meio de uma palavra.","en":"The <b>40 messages</b> of battle and training, across both blocks in bank 3, are translated — <b>including the ones carrying a number in the middle</b>, disguised as a space. It was the last thing holding up the release: shortening the text without knowing how the game places that number would put the digit inside a word.","es":"Los <b>40 mensajes</b> de combate y entrenamiento, en los dos bloques del banco 3, están traducidos — <b>incluidos los que llevan un número en medio</b>, disfrazado de espacio. Era lo último que frenaba el lanzamiento: acortar el texto sin saber cómo coloca el juego ese número pondría la cifra dentro de una palabra."}},{"t":{"pt":"A versão do patch vai <b>queimada na tela de créditos</b>, e não só no nome do arquivo — quem baixa joga a imagem, não o nome. É assim que se sabe, meses depois, qual build está no cartucho.","en":"The patch version is <b>burned into the credits screen</b>, not just into the file name — whoever downloads plays the image, not the name. That is how you know, months later, which build is on the cartridge.","es":"La versión del parche va <b>grabada en la pantalla de créditos</b>, y no solo en el nombre del archivo — quien descarga juega la imagen, no el nombre. Así se sabe, meses después, qué build está en el cartucho."}}]},{"titulo":{"pt":"O português, e a fonte que ganhou acento","en":"Portuguese, and the font that grew accents","es":"El portugués, y la fuente que ganó acentos"},"itens":[{"t":{"pt":"O jogo também está <b>inteiro em português</b> — as mesmas 1.305 mensagens, os 96 nomes e todas as tabelas fora do roteiro: o menu do modo Aventura, os rótulos de carta, o subtítulo do título, batalha e treino. Os nomes seguem a <b>dublagem brasileira</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","en":"The game is also <b>entirely in Portuguese</b> — the same 1,305 messages, the 96 names and every table outside the script: the Adventure mode menu, the card labels, the title subtitle, battle and training. The names follow the <b>Brazilian dub</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão.","es":"El juego está también <b>entero en portugués</b> — los mismos 1.305 mensajes, los 96 nombres y todas las tablas fuera del guion: el menú del modo Aventura, las etiquetas de carta, el subtítulo del título, combate y entrenamiento. Los nombres siguen el <b>doblaje brasileño</b>: Kuririn, Mestre Kame, Rei Cutelo, esferas do dragão."}},{"t":{"pt":"A fonte não tinha acentos, e o espaço para eles estava dentro do próprio tile: a minúscula ocupa as linhas 2 a 6, então <b>as linhas 0 e 1 sobram</b> e o acento sai de graça. A maiúscula ocupa 0 a 6 e não sobra nada — ela é comprimida e o acento vira uma marca de uma linha. Comprimir cortando a linha de baixo fez o <code>E</code> virar <code>F</code> na tela; corta-se uma linha <b>repetida do meio</b>. E o circunflexo com pernas de 2 px coladas ao ápice lia-se como agudo — <code>três</code> saía <code>trés</code>. Quatro desenhos lado a lado decidiram o que a medição não decidia.","en":"The font had no accents, and the room for them was inside the tile itself: lowercase occupies rows 2 to 6, so <b>rows 0 and 1 are free</b> and the accent costs nothing. Uppercase occupies 0 to 6 with nothing to spare — the letter is compressed and the accent becomes a one-row mark. Compressing by cutting the bottom row turned <code>E</code> into <code>F</code> on screen; the row to cut is a <b>repeated one in the middle</b>. And a circumflex with 2 px legs touching the apex read as an acute — <code>três</code> came out <code>trés</code>. Four drawings side by side settled what measurement could not.","es":"La fuente no tenía acentos, y el sitio para ellos estaba dentro del propio tile: la minúscula ocupa las filas 2 a 6, así que <b>las filas 0 y 1 sobran</b> y el acento sale gratis. La mayúscula ocupa 0 a 6 y no sobra nada — se comprime la letra y el acento pasa a ser una marca de una fila. Comprimir cortando la fila de abajo convirtió la <code>E</code> en <code>F</code> en pantalla; la fila que se corta es una <b>repetida del medio</b>. Y el circunflejo con patas de 2 px pegadas al vértice se leía como agudo — <code>três</code> salía <code>trés</code>. Cuatro dibujos uno al lado del otro decidieron lo que la medición no decidía."}},{"t":{"pt":"O que aperta não é o byte: o roteiro português ocupa <b>85% do espaço</b> e caberia inteiro. O aperto é a <b>caixa de 24×3</b> — 387 mensagens já usavam as três linhas em inglês e <b>254 fechavam sem uma coluna sobrando</b>. Traduzir foi encaixar. As três tabelas de nome saíram em <b>417/417, 114/116 e 94/95 bytes</b>.","en":"What squeezes is not the byte: the Portuguese script fills <b>85% of the space</b> and would fit whole. The squeeze is the <b>24×3 box</b> — 387 messages already used all three lines in English and <b>254 closed with not a column to spare</b>. Translating meant fitting. The three name tables came out at <b>417/417, 114/116 and 94/95 bytes</b>.","es":"Lo que aprieta no es el byte: el guion portugués ocupa el <b>85% del espacio</b> y cabría entero. El aprieto es la <b>caja de 24×3</b> — 387 mensajes ya usaban las tres líneas en inglés y <b>254 cerraban sin una columna de sobra</b>. Traducir fue encajar. Las tres tablas de nombre salieron en <b>417/417, 114/116 y 94/95 bytes</b>."}},{"t":{"pt":"A ROM inglesa <b>não mudou um byte</b> para o português existir: o idioma entra por uma camada à parte, e o <code>md5</code> da build inglesa é o mesmo de antes.","en":"The English ROM <b>did not change by a byte</b> for Portuguese to exist: the language enters through a separate layer, and the English build's <code>md5</code> is the same as before.","es":"La ROM inglesa <b>no cambió ni un byte</b> para que existiera el portugués: el idioma entra por una capa aparte, y el <code>md5</code> de la build inglesa es el mismo de antes."}}]}],"patch":{"versoes":{"en":{"arquivo":"dragon-ball-3-en.ips","tamanho":"312 KB"},"pt":{"arquivo":"dragon-ball-3-pt.ips","tamanho":"310 KB"},"es":null},"rom":"Dragon Ball 3 - Gokuu Den (Japan) (Rev 1).nes","rom_md5":"0bc3d5d7d1e7f2206ce1c157402ff944"},"fotos":[{"f":"db3/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"悟空伝 redesenhado como <code>LEGEND OF GOKU</code>, dentro dos mesmos 96×32 pixels.","en":"悟空伝 redrawn as <code>LEGEND OF GOKU</code>, inside the same 96×32 pixels.","es":"悟空伝 redibujado como <code>LEGEND OF GOKU</code>, dentro de los mismos 96×32 píxeles."}},{"f":"db3/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Página branca antes do título, cinco segundos, pulável.","en":"A white page before the title, five seconds, skippable.","es":"Una página blanca antes del título, cinco segundos, se salta."}},{"f":"db3/03-menu.png","t":{"pt":"Menu","en":"Menu","es":"Menú"},"c":{"pt":"<code>GAME START</code> e <code>CONTINUE</code>, onde havia kana.","en":"<code>GAME START</code> and <code>CONTINUE</code>, where kana used to be.","es":"<code>GAME START</code> y <code>CONTINUE</code>, donde antes había kana."}},{"f":"db3/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"Três linhas por vinte e quatro colunas, e nenhum código de continuação para salvar quem estourar.","en":"Three lines by twenty-four columns, and no continuation code to rescue an overflow.","es":"Tres líneas por veinticuatro columnas, y ningún código de continuación que rescate un desbordamiento."}},{"f":"db3/05-cartas.png","t":{"pt":"As cartas","en":"The cards","es":"Las cartas"},"c":{"pt":"Os kanji desenhados viraram <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — arte redesenhada, não texto traduzido.","en":"The drawn kanji became <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — artwork redrawn, not text translated.","es":"Los kanji dibujados pasaron a <code>FIN</code>, <code>KCK</code>, <code>PCH</code> — ilustración redibujada, no texto traducido."}},{"f":"db3/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"Grade latina sem colisão — e as senhas de 1989 continuam funcionando.","en":"A Latin grid with no collisions — and passwords from 1989 still work.","es":"Una rejilla latina sin colisiones — y las contraseñas de 1989 siguen funcionando."}},{"f":"db3/07-mapa.png","t":{"pt":"O tabuleiro","en":"The board","es":"El tablero"},"c":{"pt":"Onde o jogo acontece: anda, tira carta, luta.","en":"Where the game happens: move, draw a card, fight.","es":"Donde ocurre el juego: avanza, roba carta, lucha."}}],"etapas":{"direcao":"feito","traducao":"feito","revisao":"feito","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"tom-sawyer","nome":"Square's Tom Sawyer","subtitulo":"スクウェアのトム・ソーヤ","jp":"スクウェアのトム・ソーヤ","publisher":"Square","dev":"Square","ano":1989,"data":"1989","sistema":"Famicom","mapper":"MMC1 (SUROM viável) · 256 KB PRG · CHR-RAM de 8 KB · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"tom/00-capa-patreon.jpg","linha":{"pt":"A Square pegou Mark Twain e fez um RPG com Tom e Huck. O livro é americano; o jogo ficou no Japão, e a ROM teve de dobrar para caber.","en":"Square took Mark Twain and made an RPG with Tom and Huck. The book is American; the game stayed in Japan, and the ROM had to double.","es":"Square tomó la novela de Mark Twain y montó un RPG con Tom y Huck. El libro es americano; el juego se quedó en Japón, y la ROM tuvo que duplicarse."},"resumo":{"pt":["De todos os cartuchos deste catálogo, este é o único cuja história você provavelmente já leu. Em 1989 a Square — dois anos antes do <i>Final Fantasy IV</i> — pegou o romance do Mark Twain e fez um RPG de Famicom com Tom e Huck, no Mississippi de 1855. E o resultado tem cara de Square: retrato do personagem na caixa de fala, um menu de campo que diz <code>EXAMINE / TAKE  DIG / ITEM</code>, porque num jogo de Tom Sawyer cavar precisa ser comando, e um inventário onde cabem uma barraca e uma bola de gude.","Boa parte do que se ia acrescentar já vinha de fábrica: o cartucho <b>salva em bateria</b>, e o menu de abertura de 1989 já trazia <code>CONTINUE / START / SPEED 5</code> — ajuste de velocidade de texto, e já em inglês. O que faltava era o resto. As <b>576 mensagens</b> e os <b>70 nomes</b> estão traduzidos, escritos numa fonte latina de <b>61 tiles novos</b> desenhados sobre as casas de kana que o inglês não usa, mais os dez dígitos, sem tocar em nenhum gráfico de tela — e a tela de título saiu redesenhada como <code>SQUARE'S / TOM SAWYER</code>, provada em jogo.","O inglês custou espaço: medido neste cartucho, ele ocupa <b>1,63×</b> o japonês, e a ROM inteira tinha <b>6,2 KB livres</b>, fragmentados, com a maior região contígua em 1.168 bytes e o bloco de texto do banco 6 fechando com 9 bytes de sobra. A saída foi expandir para <b>512 KB</b> pelo caminho SUROM — como o jogo usa CHR-RAM, os registradores de banco de CHR estão ociosos e o bit 4 vira o A18 do PRG —, com uma cópia do banco fixo na metade nova, sem a qual o cartucho perde o kernel e trava no boot. Depois disso a varredura foi refeita e devolveu mais <b>2,1 KB de japonês vivo</b> que a extração do roteiro não pegava: nomes de item, dois menus de batalha, os créditos escondidos. E há um segredo: um <b>código de oito caracteres digitado no campo de nome</b>, que no original era <code>ホワイトラビット</code>, o coelho branco, e agora se digita <code>WHITERAB</code>. Não há patch para instalar; esta página acompanha o trabalho."],"en":["Of every cartridge in this catalogue, this is the only one whose story you have probably already read. In 1989 Square — two years before <i>Final Fantasy IV</i> — took Mark Twain's novel and made a Famicom RPG with Tom and Huck, on the 1855 Mississippi. And the result looks like Square: a character portrait in the dialogue box, a field menu reading <code>EXAMINE / TAKE  DIG / ITEM</code>, because in a Tom Sawyer game digging has to be a command, and an inventory with room for a tent and a marble.","Much of what you would think to add was already there in 1989: the cartridge <b>saves to battery</b>, and the boot menu already offered <code>CONTINUE / START / SPEED 5</code> — a text-speed setting, already in English. What was left was everything else. The <b>576 messages</b> and <b>70 names</b> are translated, written in a Latin font of <b>61 new tiles</b> drawn over the kana slots English does not use, plus the ten digits, without touching a single screen graphic — and the title screen was redrawn as <code>SQUARE'S / TOM SAWYER</code>, proved in game.","English cost space: measured on this cartridge, it runs <b>1.63×</b> the Japanese, and the whole ROM had <b>6.2 KB free</b>, fragmented, the largest contiguous region at 1,168 bytes and the bank 6 text block closing with 9 bytes to spare. The way out was expanding to <b>512 KB</b> by the SUROM route — because the game uses CHR-RAM, the CHR bank registers sit idle and bit 4 becomes PRG A18 — with a copy of the fixed bank in the new half, without which the cartridge loses its kernel and hangs at boot. After that the sweep was run again and returned another <b>2.1 KB of live Japanese</b> the script extraction had not reached: item names, two battle menus, the hidden credits. And there is a secret: an <b>eight-character code typed into the name field</b>, which in the original was <code>ホワイトラビット</code>, the white rabbit, and is now typed <code>WHITERAB</code>. There is no patch to install; this page follows the work."],"es":["De todos los cartuchos de este catálogo, este es el único cuya historia probablemente ya has leído. En 1989 Square — dos años antes de <i>Final Fantasy IV</i> — tomó la novela de Mark Twain e hizo un RPG de Famicom con Tom y Huck, en el Misisipi de 1855. Y el resultado tiene cara de Square: retrato del personaje en la caja de diálogo, un menú de campo que dice <code>EXAMINE / TAKE  DIG / ITEM</code>, porque en un juego de Tom Sawyer cavar tiene que ser un comando, y un inventario donde caben una tienda de campaña y una canica.","Buena parte de lo que uno pensaría en añadir ya venía de fábrica: el cartucho <b>guarda con pila</b>, y el menú de arranque de 1989 ya traía <code>CONTINUE / START / SPEED 5</code> — ajuste de velocidad de texto, y ya en inglés. Lo que quedaba era todo lo demás. Los <b>576 mensajes</b> y los <b>70 nombres</b> están traducidos, escritos en una fuente latina de <b>61 tiles nuevos</b> dibujados sobre las casillas de kana que el inglés no usa, más las diez cifras, sin tocar ni un gráfico de pantalla — y la pantalla de título salió rediseñada como <code>SQUARE'S / TOM SAWYER</code>, probada en juego.","El inglés costó espacio: medido en este cartucho, ocupa <b>1,63×</b> lo que el japonés, y la ROM entera tenía <b>6,2 KB libres</b>, fragmentados, con la mayor región contigua en 1.168 bytes y el bloque de texto del banco 6 cerrando con 9 bytes de sobra. La salida fue ampliar a <b>512 KB</b> por el camino SUROM — como el juego usa CHR-RAM, los registros de banco de CHR están ociosos y el bit 4 pasa a ser el A18 del PRG —, con una copia del banco fijo en la mitad nueva, sin la cual el cartucho pierde el kernel y se cuelga al arrancar. Después de eso el barrido se rehízo y devolvió otros <b>2,1 KB de japonés vivo</b> que la extracción del guion no alcanzaba: nombres de objeto, dos menús de combate, los créditos escondidos. Y hay un secreto: un <b>código de ocho caracteres escrito en el campo de nombre</b>, que en el original era <code>ホワイトラビット</code>, el conejo blanco, y ahora se escribe <code>WHITERAB</code>. No hay parche que instalar; esta página sigue el trabajo."]},"numeros":[{"v":"0","r":{"pt":"blocos de gráfico no arquivo","en":"graphics blocks in the file","es":"bloques de gráfico en el archivo"}},{"v":"113","r":{"pt":"tiles livres para 61 necessários","en":"free tiles for the 61 needed","es":"tiles libres para los 61 necesarios"}},{"v":"12","r":{"pt":"letras latinas já existem","en":"Latin letters already exist","es":"letras latinas ya existen"}},{"v":"2","r":{"pt":"linhas por caixa de fala","en":"lines per dialogue box","es":"líneas por caja de diálogo"}}],"grupos":[{"titulo":{"pt":"O problema que este jogo traz","en":"The problem this game brings","es":"El problema que trae este juego"},"itens":[{"t":{"pt":"<b>CHR-RAM, não CHR-ROM.</b> Nos outros três, os desenhos ficam num bloco do arquivo e se editam direto. Aqui esse bloco <b>não existe</b>: os tiles moram junto com o código e são copiados para a memória de vídeo em tempo de execução. Achar a fonte é achar a <b>rotina que a carrega</b>, não a figura.","en":"<b>CHR-RAM, not CHR-ROM.</b> In the other three, the drawings sit in a block of the file and are edited directly. Here that block <b>does not exist</b>: the tiles live alongside the code and are copied into video memory at run time. Finding the font means finding the <b>routine that uploads it</b>, not the picture.","es":"<b>CHR-RAM, no CHR-ROM.</b> En los otros tres, los dibujos están en un bloque del archivo y se editan directamente. Aquí ese bloque <b>no existe</b>: los tiles viven junto al código y se copian a la memoria de vídeo en tiempo de ejecución. Encontrar la fuente es encontrar la <b>rutina que la carga</b>, no la imagen."},"foto":"tom/01-titulo.png"},{"t":{"pt":"A boa notícia, medida: <b>os tiles estão crus, sem compressão</b> — a fonte está em <code>0x017720</code>, com 140 tiles. Não há descompressor a vencer, nem para a fonte nem para as imagens.","en":"The good news, measured: <b>the tiles are raw, uncompressed</b> — the font sits at <code>0x017720</code>, 140 tiles. There is no decompressor to defeat, for the font or for the pictures.","es":"La buena noticia, medida: <b>los tiles están crudos, sin compresión</b> — la fuente está en <code>0x017720</code>, con 140 tiles. No hay descompresor que vencer, ni para la fuente ni para las imágenes."}}]},{"titulo":{"pt":"O que já foi medido","en":"What is already measured","es":"Lo que ya está medido"},"itens":[{"t":{"pt":"<b>A fonte cabe.</b> Reciclando os kana — que o inglês não usa — sobram <b>113 tiles</b> para os cerca de 61 necessários (A-Z, a-z e pontuação). Sem fonte de largura variável e sem tocar em gráfico de tela.","en":"<b>The font fits.</b> Recycling the kana — which English does not use — leaves <b>113 tiles</b> for the roughly 61 needed (A-Z, a-z and punctuation). With no variable-width font and without touching any screen graphic.","es":"<b>La fuente cabe.</b> Reciclando los kana — que el inglés no usa — sobran <b>113 tiles</b> para los aproximadamente 61 necesarios (A-Z, a-z y puntuación). Sin fuente de ancho variable y sin tocar ningún gráfico de pantalla."}},{"t":{"pt":"O alfabeto latino tem de cair na faixa de códigos <code>$09-$8E</code>: acima de <code>$90</code> o motor arrasta um diacrítico para a linha de cima, e <code>$D0-$D3</code> estão reservados para inserir o nome do personagem.","en":"The Latin alphabet has to land in the code range <code>$09-$8E</code>: above <code>$90</code> the engine drags a diacritic onto the line above, and <code>$D0-$D3</code> are reserved for inserting the character’s name.","es":"El alfabeto latino tiene que caer en el rango de códigos <code>$09-$8E</code>: por encima de <code>$90</code> el motor arrastra un diacrítico a la línea de arriba, y <code>$D0-$D3</code> están reservados para insertar el nombre del personaje."}},{"t":{"pt":"<b>Doze letras latinas já existem</b> na ROM — <code>A C D E N O P I R S T U</code> e os dígitos, o suficiente para escrever <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> e <code>SQUARE</code>. As outras catorze, mais todas as minúsculas, precisam ser desenhadas.","en":"<b>Twelve Latin letters already exist</b> in the ROM — <code>A C D E N O P I R S T U</code> and the digits, enough to write <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> and <code>SQUARE</code>. The other fourteen, plus every lower-case letter, have to be drawn.","es":"<b>Doce letras latinas ya existen</b> en la ROM — <code>A C D E N O P I R S T U</code> y las cifras, suficiente para escribir <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> y <code>SQUARE</code>. Las otras catorce, más todas las minúsculas, hay que dibujarlas."},"foto":"tom/02-menu.png"},{"t":{"pt":"<b>O menu de opções já existe e já está em inglês.</b> O jogo de 1989 abre com <code>CONTINUE / START / SPEED 5</code> — inclusive o ajuste de velocidade de texto que os outros hacks tiveram de acrescentar. Aqui não se cria tela nova.","en":"<b>The options menu already exists, and is already in English.</b> The 1989 game opens with <code>CONTINUE / START / SPEED 5</code> — including the text-speed setting the other hacks had to add. Here no new screen gets built.","es":"<b>El menú de opciones ya existe, y ya está en inglés.</b> El juego de 1989 abre con <code>CONTINUE / START / SPEED 5</code> — incluido el ajuste de velocidad de texto que los otros hacks tuvieron que añadir. Aquí no se crea ninguna pantalla nueva."}},{"t":{"pt":"<b>A restrição mais dura é a caixa de fala:</b> retrato do personagem à esquerda, duas linhas de texto, e a linha útil curta por causa do retrato. Inglês é mais largo que kana, e sem fonte de largura variável não há como encolher.","en":"<b>The hardest constraint is the dialogue box:</b> a character portrait on the left, two lines of text, and a short usable line because of the portrait. English is wider than kana, and with no variable-width font there is no way to shrink it.","es":"<b>La restricción más dura es la caja de diálogo:</b> retrato del personaje a la izquierda, dos líneas de texto, y la línea útil corta por el retrato. El inglés es más ancho que el kana, y sin fuente de ancho variable no hay forma de encogerlo."},"foto":"tom/03-dialogo.png"},{"t":{"pt":"<b>Expansão para 512 KB é viável</b> pelo caminho SUROM: como o jogo usa CHR-RAM, os registradores de banco de CHR estão ociosos e o bit 4 vira o A18 do PRG. <b>Só será usada se a conta do roteiro exigir</b> — até agora não exigiu.","en":"<b>Expansion to 512 KB is viable</b> by the SUROM route: because the game uses CHR-RAM, the CHR bank registers are idle and bit 4 becomes PRG A18. <b>It will only be used if the script arithmetic demands it</b> — so far it has not.","es":"<b>La expansión a 512 KB es viable</b> por la vía SUROM: como el juego usa CHR-RAM, los registros de banco de CHR están ociosos y el bit 4 pasa a ser PRG A18. <b>Solo se usará si la cuenta del guion lo exige</b> — hasta ahora no lo ha exigido."}}]},{"titulo":{"pt":"O que vem a seguir","en":"What comes next","es":"Lo que viene"},"itens":[{"t":{"pt":"O roteiro está sendo extraído. Depois dele vêm a tabela de caracteres, a fonte latina desenhada e a reinserção — e só então existe algo jogável para chamar de beta.","en":"The script is being extracted. After it come the character table, the drawn Lati
