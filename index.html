ções são de conteúdo, não de idioma.</b> O prólogo original põe <b>Cuba na América do Sul</b>, e aqui ela está na América Central; e o menu que dizia <code>TWO PLAYERS MODE</code> passou a dizer <code>TWO PLAYER MODE</code>.","en":"<b>Two corrections are of content, not language.</b> The original prologue places <b>Cuba in South America</b>, and here it sits in Central America; and the menu that read <code>TWO PLAYERS MODE</code> now reads <code>TWO PLAYER MODE</code>.","es":"<b>Dos correcciones son de contenido, no de idioma.</b> El prólogo original pone <b>Cuba en América del Sur</b>, y aquí está en América Central; y el menú que decía <code>TWO PLAYERS MODE</code> pasó a decir <code>TWO PLAYER MODE</code>."}},{"t":{"pt":"O <b>logo da tela de título</b> era katakana. O latino foi desenhado em <b>224×56 pixels — 192 tiles únicos</b> — mantendo a proporção da arte original, e coube nos índices que sobravam com folga de 31.","en":"The <b>title-screen logo</b> was katakana. The Latin one was drawn at <b>224×56 pixels — 192 unique tiles</b> — keeping the proportion of the original artwork, and fitted in the spare indices with 31 to go.","es":"El <b>logo de la pantalla de título</b> era katakana. El latino se dibujó en <b>224×56 píxeles — 192 tiles únicos</b> — manteniendo la proporción del arte original, y cupo en los índices sobrantes con holgura de 31."},"foto":"guevara/01-titulo.png"},{"t":{"pt":"<b>A tela de créditos do patch</b> entra antes do título, com a <b>versão queimada na imagem</b> — renomear o arquivo não versiona nada, e é assim que se sabe, meses depois, qual build está no cartucho. Ela precisou de uma espera própria: a tela do boot fica no brilho máximo por <b>quatro quadros</b>, e com três linhas a mais não daria tempo de ler.","en":"<b>The patch credits screen</b> comes before the title, with the <b>version burned into the image</b> — renaming the file versions nothing, and this is how you know, months later, which build is on the cartridge. It needed a wait of its own: the boot screen stays at full brightness for <b>four frames</b>, and with three more lines there would be no time to read.","es":"<b>La pantalla de créditos del parche</b> entra antes del título, con la <b>versión grabada en la imagen</b> — renombrar el archivo no versiona nada, y así se sabe, meses después, qué build está en el cartucho. Necesitó una espera propia: la pantalla de arranque se queda al brillo máximo <b>cuatro fotogramas</b>, y con tres líneas más no daría tiempo de leerla."},"foto":"guevara/02-creditos.png"},{"t":{"pt":"Nada disso vale sem prova. Cada trecho de código usado no cartucho foi <b>enchido de <code>$AA</code> e comparado com a ROM original em 14 quadros</b> — boot, prólogo, título, demo e jogo —, com <b>0 pixel de diferença</b>; cada remendo <b>afirma os bytes originais antes de escrever</b>; e a guarda aborta a gravação se um byte mudar fora das <b>38 regiões declaradas</b>.","en":"None of it counts without proof. Every block of code used in the cartridge was <b>filled with <code>$AA</code> and compared against the original ROM across 14 frames</b> — boot, prologue, title, demo and gameplay — at <b>0 pixels of difference</b>; every patch <b>asserts the original bytes before writing</b>; and the guard aborts the write if a single byte changes outside the <b>38 declared regions</b>.","es":"Nada de eso vale sin prueba. Cada bloque de código usado en el cartucho se <b>llenó de <code>$AA</code> y se comparó con la ROM original en 14 fotogramas</b> — arranque, prólogo, título, demo y partida —, con <b>0 píxeles de diferencia</b>; cada parche <b>afirma los bytes originales antes de escribir</b>; y la guarda aborta la grabación si un byte cambia fuera de las <b>38 regiones declaradas</b>."}}]}],"patch":{"versoes":{"en":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"},"pt":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"},"es":{"arquivo":"guevara-3idiomas.ips","tamanho":"178 KB"}},"nota":{"pt":"Os três idiomas estão dentro da mesma ROM: escolha OPTIONS no menu inicial e mude LANGUAGE.","en":"All three languages live inside the same ROM: pick OPTIONS on the start menu and change LANGUAGE.","es":"Los tres idiomas están dentro de la misma ROM: elige OPTIONS en el menú inicial y cambia LANGUAGE."},"rom":"Guevara (Japan).nes","rom_md5":"cd4bc85243c73274d74efb2f61b5a9c1"},"fotos":[{"f":"guevara/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"A tela de título do cartucho japonês.","en":"The Japanese cartridge title screen.","es":"La pantalla de título del cartucho japonés."}},{"f":"guevara/02-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Antes do título, com a versão queimada na imagem.","en":"Before the title, with the version burned into the image.","es":"Antes del título, con la versión grabada en la imagen."}},{"f":"guevara/03-dedicatoria.png","t":{"pt":"A dedicatória","en":"The dedication","es":"La dedicatoria"},"c":{"pt":"O retrato e a dedicatória que a ROM japonesa traz.","en":"The portrait and the dedication the Japanese ROM carries.","es":"El retrato y la dedicatoria que trae la ROM japonesa."}},{"f":"guevara/04-prologo.png","t":{"pt":"O prólogo de 1956","en":"The 1956 prologue","es":"El prólogo de 1956"},"c":{"pt":"Nove linhas de contexto histórico, agora legíveis.","en":"Nine lines of historical context, now readable.","es":"Nueve líneas de contexto histórico, ahora legibles."}},{"f":"guevara/05-jogo.png","t":{"pt":"Em jogo","en":"In game","es":"En juego"},"c":{"pt":"O run-and-gun para dois jogadores.","en":"The two-player run-and-gun.","es":"El run-and-gun para dos jugadores."}},{"f":"guevara/06-menu-modo.png","t":{"pt":"O menu inicial","en":"The start menu","es":"El menú inicial"},"c":{"pt":"A terceira entrada, OPTIONS, é nova.","en":"The third entry, OPTIONS, is new.","es":"La tercera entrada, OPTIONS, es nueva."}},{"f":"guevara/07-opcoes.png","t":{"pt":"O menu de opções","en":"The options menu","es":"El menú de opciones"},"c":{"pt":"Idioma, vidas, dificuldade e sound test.","en":"Language, lives, difficulty and sound test.","es":"Idioma, vidas, dificultad y sound test."}},{"f":"guevara/08-vidas.png","t":{"pt":"As vidas na tela","en":"Lives on screen","es":"Las vidas en pantalla"},"c":{"pt":"Uma cruz por vida, no canto — o original não as mostrava.","en":"One cross per life, in the corner — the original showed none.","es":"Una cruz por vida, en la esquina — el original no las mostraba."}},{"f":"guevara/09-abertura-fase.png","t":{"pt":"Abertura de fase","en":"Stage opening","es":"Apertura de fase"},"c":{"pt":"Uma antes de cada área; as nove estavam em japonês.","en":"One before each area; all nine were in Japanese.","es":"Una antes de cada área; las nueve estaban en japonés."}},{"f":"guevara/10-final.png","t":{"pt":"A narração do final","en":"The closing narration","es":"La narración del final"},"c":{"pt":"O que aconteceu depois — e ninguém fora do Japão tinha lido.","en":"What happened next — and nobody outside Japan had read it.","es":"Lo que pasó después — y nadie fuera de Japón lo había leído."}}]},{"slug":"magic-knight-rayearth-2","nome":"Magic Knight Rayearth 2","subtitulo":"Making of Magic Knight","jp":"レイアース2 ～making of magicknight～","publisher":"SEGA","dev":"SEGA","ano":1995,"data":"1995","sistema":"Game Gear","mapper":"Mapper Sega padrão · 512 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"destaque":true,"nivel":"release","versao":"English v1.3.5","capa":"mkr2/01-titulo.png","linha":{"pt":"Hikaru, Umi e Fuu voltam a Cefiro depois de Emeraude, no Game Gear. A caixa tem 12 caracteres, e MAGIC KNIGHTS tem catorze.","en":"Hikaru, Umi and Fuu return to Cefiro after Emeraude, on the Game Gear. The box holds 12 characters, and MAGIC KNIGHTS has fourteen.","es":"Hikaru, Umi y Fuu vuelven a Cefiro después de Emeraude, en la Game Gear. La caja tiene 12 caracteres, y MAGIC KNIGHTS tiene catorce."},"resumo":{"pt":["<i>Magic Knight Rayearth</i> saiu do <b>CLAMP</b>, o grupo de autoras de mangá, e conta de três colegiais chamadas a outro mundo, <b>Cefiro</b>, para salvá-lo. Esta é a segunda parte, e quem acompanhou sabe o que isso muda: Hikaru, Umi e Fuu voltam depois do que aconteceu com <b>Emeraude e o Pilar</b>, e agora o país tem <b>Autozam, Chizeta e Fahren</b> à porta — com Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, o Eagle e o Mokona pelo caminho. O subtítulo é <i>Making of Magic Knight</i>, e ele diz o que se faz: em vez de percorrer a aventura, você <b>forma as três</b>, atributo por atributo, e o final que cada uma alcança depende de como foi criada. É o único cartucho de <b>Game Gear</b> deste catálogo — todo o resto é Famicom, com um Super Famicom.","O jogo é <b>100% kana, sem um único kanji</b>, e isso não é curiosidade: é shoujo, escrito para criança japonesa ler, e cada kana ocupa exatamente uma coluna. É daí que vem o aperto, porque a caixa de diálogo do Game Gear tem <b>12 caracteres</b> e o motor quebra a linha nos doze <b>sem olhar palavra</b>. Com fonte de largura fixa, <code>MAGIC KNIGHTS</code> tem catorze e não entra: sai <code>MG KNIGHTS</code>, e é o tipo de corte que se lê na tela o jogo inteiro. Contar bytes engana ainda mais — um kana com dakuten custa <b>três bytes e uma coluna só</b>, de modo que o script japonês soma <b>31.524 bytes para 26.584 colunas</b>, 19% a mais em byte do que em tela. O que limita é o glifo, não o armazenamento: o que se guarda tem saída por salto de banco, o que aparece na tela não tem.","Por isso este é o único projeto da casa com <b>fonte de largura variável</b>. Foi desenhada uma latina de <b>5×7</b>, avanço médio de <b>6 px em vez de 8</b>, e escrita uma rotina que compõe cada glifo na posição de pixel em que ele cai — a linha passou a valer <b>96 pixels</b> em vez de doze casas fixas. Ela saiu barata por um detalhe do cartucho que só se enxerga medindo: a fonte não é 4bpp de verdade, porque o fundo é uma cor, a tinta é outra e os dois planos restantes são sempre zero. Logo <b>o plano 0 é a própria máscara da tinta</b>, oito bytes por glifo, e deslocar um glifo vira um deslocamento de um bit por linha em vez de uma operação de quatro planos. São <b>645 bytes</b> de Z80 no banco que fica fixo enquanto o texto roda — a mesma piscina de onde a fonte é lida a cada glifo —, escritos com um <b>montador Z80 feito para este projeto</b>. Há até um <b>espaço fino de 1 px</b>, num código que o jogo nunca usa, para fechar a linha exatamente na borda. Na caixa de diálogo, <code>MG KNIGHTS</code> voltou a ser <code>MAGIC KNIGHTS</code>."],"en":["<i>Magic Knight Rayearth</i> came from <b>CLAMP</b>, the manga authors' collective, and tells of three schoolgirls summoned to another world, <b>Cefiro</b>, to save it. This is the second part, and anyone who followed the first knows what that changes: Hikaru, Umi and Fuu return after what happened to <b>Emeraude and the Pillar</b>, and the country now has <b>Autozam, Chizeta and Fahren</b> at its door — with Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, Eagle and Mokona along the way. The subtitle is <i>Making of Magic Knight</i>, and it says what you do: rather than travelling the adventure, you <b>raise the three of them</b>, stat by stat, and the ending each one reaches depends on how she was brought up. It is this catalogue's only <b>Game Gear</b> cartridge — everything else is Famicom, with one Super Famicom.","The game is <b>100% kana, without a single kanji</b>, and that is not trivia: it is shoujo, written for a Japanese child to read, and each kana takes exactly one column. That is where the squeeze comes from, because the Game Gear's dialogue box holds <b>12 characters</b> and the engine breaks the line at twelve <b>without looking at words</b>. With a fixed-width font, <code>MAGIC KNIGHTS</code> is fourteen and does not fit: out comes <code>MG KNIGHTS</code>, and it is the sort of cut you read on screen all game long. Counting bytes misleads further still — a kana with dakuten costs <b>three bytes and only one column</b>, so the Japanese script comes to <b>31,524 bytes for 26,584 columns</b>, 19% more in bytes than on screen. What limits you is the glyph, not the storage: what gets stored has a way out through a bank jump, what appears on screen does not.","That is why this is the house's only project with a <b>variable-width font</b>. A Latin <b>5×7</b> was drawn, with a mean advance of <b>6 px instead of 8</b>, and a routine written that composes each glyph at the pixel position where it lands — the line became worth <b>96 pixels</b> rather than twelve fixed cells. It came cheap thanks to a cartridge detail you only see by measuring: the font is not really 4bpp, because the background is one colour, the ink another, and the two remaining planes are always zero. So <b>plane 0 is the ink mask itself</b>, eight bytes per glyph, and shifting a glyph becomes a one-bit shift per row rather than a four-plane operation. It is <b>645 bytes</b> of Z80 in the bank that stays pinned while the text runs — the same pool the font is read from on every glyph — written with a <b>Z80 assembler built for this project</b>. There is even a <b>1 px thin space</b>, mapped to a code point the game never uses, to close the line exactly at the edge. In the dialogue box, <code>MG KNIGHTS</code> became <code>MAGIC KNIGHTS</code> again."],"es":["<i>Magic Knight Rayearth</i> salió de <b>CLAMP</b>, el colectivo de autoras de manga, y cuenta la historia de tres colegialas llamadas a otro mundo, <b>Cefiro</b>, para salvarlo. Esta es la segunda parte, y quien siguió la primera sabe lo que eso cambia: Hikaru, Umi y Fuu vuelven después de lo que pasó con <b>Emeraude y el Pilar</b>, y ahora el país tiene a <b>Autozam, Chizeta y Fahren</b> en la puerta — con Clef, Presea, Ferio, Caldina, Ascot, Lafarga, Lantis, Eagle y Mokona por el camino. El subtítulo es <i>Making of Magic Knight</i>, y dice lo que se hace: en lugar de recorrer la aventura, <b>formas a las tres</b>, atributo por atributo, y el final que alcanza cada una depende de cómo la formaste. Es el único cartucho de <b>Game Gear</b> de este catálogo — todo lo demás es Famicom, con un Super Famicom.","El juego es <b>100% kana, sin un solo kanji</b>, y eso no es curiosidad: es shoujo, escrito para que lo lea una niña japonesa, y cada kana ocupa exactamente una columna. De ahí viene el apuro, porque la caja de diálogo de la Game Gear tiene <b>12 caracteres</b> y el motor corta la línea a los doce <b>sin mirar la palabra</b>. Con fuente de ancho fijo, <code>MAGIC KNIGHTS</code> tiene catorce y no entra: sale <code>MG KNIGHTS</code>, y es de esos recortes que se leen en pantalla durante todo el juego. Contar bytes engaña todavía más — un kana con dakuten cuesta <b>tres bytes y una sola columna</b>, de modo que el guion japonés suma <b>31.524 bytes para 26.584 columnas</b>, un 19% más en bytes que en pantalla. Lo que limita es el glifo, no el almacenamiento: lo que se guarda tiene salida por un salto de banco, lo que aparece en pantalla no la tiene.","Por eso este es el único proyecto de la casa con <b>fuente de anchura variable</b>. Se dibujó una latina de <b>5×7</b>, con un avance medio de <b>6 px en lugar de 8</b>, y se escribió una rutina que compone cada glifo en la posición de píxel en la que cae — la línea pasó a valer <b>96 píxeles</b> en vez de doce casillas fijas. Salió barata por un detalle del cartucho que solo se ve midiendo: la fuente no es 4bpp de verdad, porque el fondo es un color, la tinta es otro y los dos planos restantes son siempre cero. Luego <b>el plano 0 es la propia máscara de la tinta</b>, ocho bytes por glifo, y desplazar un glifo se vuelve un desplazamiento de un bit por fila en lugar de una operación de cuatro planos. Son <b>645 bytes</b> de Z80 en el banco que queda fijo mientras el texto corre — de ahí mismo se lee la fuente en cada glifo —, escritos con un <b>ensamblador de Z80 hecho para este proyecto</b>. Hay hasta un <b>espacio fino de 1 px</b>, en un punto de código que el juego nunca usa, para cerrar la línea justo en el borde. En la caja de diálogo, <code>MG KNIGHTS</code> ha vuelto a ser <code>MAGIC KNIGHTS</code>."]},"numeros":[{"v":"2.581","r":{"pt":"linhas de texto na tela","en":"lines of on-screen text","es":"líneas de texto en pantalla"}},{"v":"59","r":{"pt":"glifos da fonte 5×7 desenhados","en":"glyphs drawn for the 5×7 font","es":"glifos dibujados de la fuente 5×7"}},{"v":"645","r":{"pt":"bytes da rotina de largura variável","en":"bytes of the variable-width routine","es":"bytes de la rutina de ancho variable"}},{"v":"4","r":{"pt":"erros na tabela de opcodes que destruíam código","en":"opcode-table errors that were destroying code","es":"errores en la tabla de opcodes que destruían código"}},{"v":"285","r":{"pt":"falas reescritas para caber na linha (v1.1)","en":"lines rewritten to fit the line (v1.1)","es":"frases reescritas para caber en la línea (v1.1)"}},{"v":"54","r":{"pt":"palavras cortadas no meio, consertadas (v1.2)","en":"words cut in half, fixed (v1.2)","es":"palabras cortadas por la mitad, corregidas (v1.2)"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>Caixa baixa, na versão 1.3.</b> O jogo não tem minúscula nenhuma, e os códigos da tabela de caracteres estavam todos ocupados, quase todos por kana. Com o jogo em inglês, a maior parte dos kana deixou de aparecer: <b>26 deles viraram a–z</b>, na mesma grade da fonte de largura variável. O prólogo foi reescrito contra o japonês, as falas de uma linha não pulam mais entre a linha de cima e a de baixo, e o <b>nome do jogador</b> aparece nas falas pela primeira vez. A troca de kana por minúscula deixou visível todo japonês que sobrava, e ele foi traduzido: os <b>finais</b>, a mensagem pós-créditos, <b>70 falas da aventura</b>, o <b>menu de viagem</b>, a <b>tela de batalha</b> e os <b>nomes dos lutadores</b>.","en":"<b>Lowercase, in version 1.3.</b> The game has no lowercase at all, and the codes in its character table were all taken, almost all by kana. With the game in English, most of the kana stopped appearing: <b>26 of them became a–z</b>, on the same grid as the variable-width font. The prologue was rewritten against the Japanese, one-line dialogues no longer jump between the top line and the bottom one, and the <b>player's name</b> shows up in dialogue for the first time. Swapping kana for lowercase made every leftover bit of Japanese visible, and it was translated: the <b>endings</b>, the post-credits message, <b>70 adventure lines</b>, the <b>travel menu</b>, the <b>battle screen</b> and the <b>fighters' names</b>.","es":"<b>Minúsculas, en la versión 1.3.</b> El juego no tiene ninguna minúscula, y los códigos de la tabla de caracteres estaban todos ocupados, casi todos por kana. Con el juego en inglés, la mayor parte de los kana dejó de aparecer: <b>26 de ellos se volvieron a–z</b>, en la misma rejilla de la fuente de ancho variable. El prólogo se reescribió contra el japonés, las frases de una línea ya no saltan entre la línea de arriba y la de abajo, y el <b>nombre del jugador</b> aparece en los diálogos por primera vez. Cambiar kana por minúscula dejó a la vista todo el japonés que sobraba, y se tradujo: los <b>finales</b>, el mensaje tras los créditos, <b>70 frases de la aventura</b>, el <b>menú de viaje</b>, la <b>pantalla de batalla</b> y los <b>nombres de los luchadores</b>."}},{"t":{"pt":"<b>2.581 linhas</b> — o roteiro inteiro, e <b>98,6% dos glifos na tela são latinos</b>. O que sobra de japonês são quatro trechos que não são fala: são dados que o extrator lê como texto.","en":"<b>2,581 lines</b> — the whole script, and <b>98.6% of the glyphs on screen are Latin</b>. What remains in Japanese is four stretches that are not dialogue: data the extractor reads as text.","es":"<b>2.581 líneas</b> — el guion entero, y el <b>98,6% de los glifos en pantalla son latinos</b>. Lo que queda en japonés son cuatro tramos que no son diálogo: datos que el extractor lee como texto."}},{"t":{"pt":"<b>Fonte de largura variável</b>, a única do catálogo. Uma latina de 5×7 desenhada do zero, avanço médio de 6 px em vez de 8, e uma rotina de 645 bytes no banco que fica fixo durante o diálogo. Sem ela, <code>MAGIC KNIGHTS</code> não cabe nos 12 caracteres da caixa e sai <code>MG KNIGHTS</code>.","en":"<b>Variable-width font</b>, the only one in the catalogue. A 5×7 Latin face drawn from scratch, 6 px average advance instead of 8, and a 645-byte routine in the bank that stays mapped during dialogue. Without it, <code>MAGIC KNIGHTS</code> does not fit the box's 12 characters and comes out <code>MG KNIGHTS</code>.","es":"<b>Fuente de ancho variable</b>, la única del catálogo. Una latina de 5×7 dibujada desde cero, avance medio de 6 px en vez de 8, y una rutina de 645 bytes en el banco que queda fijo durante el diálogo. Sin ella, <code>MAGIC KNIGHTS</code> no cabe en los 12 caracteres de la caja y sale <code>MG KNIGHTS</code>."}},{"t":{"pt":"<b>54 palavras cortadas no meio</b>, consertadas na versão <b>1.2</b>. A tela mostrava <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> e <code>ICE ARO</code> — falas truncadas à mão, numa passagem antiga, para caber nos poucos bytes do vão. Foram achadas varrendo o roteiro inteiro contra um dicionário e procurando <b>palavra que é prefixo de outra</b>, que é a assinatura de um corte.","en":"<b>54 words cut in half</b>, fixed in version <b>1.2</b>. The screen was showing <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> and <code>ICE ARO</code> — lines hand-truncated, in an earlier pass, to fit the gap's few bytes. They were found by sweeping the whole script against a dictionary looking for <b>a word that is a prefix of another</b>, which is the signature of a cut.","es":"<b>54 palabras cortadas por la mitad</b>, corregidas en la versión <b>1.2</b>. La pantalla mostraba <code>HIKAR</code>, <code>COME ON DANC</code>, <code>I AM SORR</code>, <code>THE SPELLBOO</code> e <code>ICE ARO</code> — frases truncadas a mano, en una pasada anterior, para caber en los pocos bytes del hueco. Se encontraron barriendo el guion entero contra un diccionario y buscando <b>una palabra que es prefijo de otra</b>, que es la firma de un corte."}},{"t":{"pt":"<b>285 falas reescritas mais curtas</b>, na versão <b>1.1</b>. Cabiam na caixa em byte, mas não na linha, e o inseridor cortava cada uma na última palavra que coubesse: a tela mostrava <code>THANK YOU,</code> onde a fala é <code>THANK YOU, CALDINA!</code> e <code>FAREWELL!</code> onde é <code>FAREWELL! OHOHOHO!</code>. Eram <b>286 falas estourando a linha e 294 vãos cortados</b>; agora são <b>zero</b>, e em nenhum vão o patch antigo do Pearse aparece mais.","en":"<b>285 lines rewritten shorter</b>, in version <b>1.1</b>. They fitted the box in bytes but not on the line, and the inserter cut each one at the last word that fitted: the screen showed <code>THANK YOU,</code> where the line is <code>THANK YOU, CALDINA!</code> and <code>FAREWELL!</code> where it is <code>FAREWELL! OHOHOHO!</code>. There were <b>286 lines overflowing and 294 gaps cut short</b>; now there are <b>none</b>, and no gap falls back to the old Pearse patch any more.","es":"<b>285 frases reescritas más cortas</b>, en la versión <b>1.1</b>. Cabían en la caja en bytes, pero no en la línea, y el insertador cortaba cada una en la última palabra que entrara: la pantalla mostraba <code>THANK YOU,</code> donde la frase es <code>THANK YOU, CALDINA!</code> y <code>FAREWELL!</code> donde es <code>FAREWELL! OHOHOHO!</code>. Eran <b>286 frases desbordando la línea y 294 huecos cortados</b>; ahora son <b>cero</b>, y en ningún hueco aparece ya el parche antiguo de Pearse."}},{"t":{"pt":"<b>As telas, não só o roteiro</b>: título, entrada de nome (agora A-Z e <b>seis letras</b> em vez de quatro), parâmetros, contador de dias, nomes de lugar, o painel de humor das três guerreiras e a tela de status.","en":"<b>The screens, not just the script</b>: title, name entry (now A-Z and <b>six letters</b> instead of four), parameters, day counter, place names, the three Knights' mood panel and the status screen.","es":"<b>Las pantallas, no solo el guion</b>: título, entrada de nombre (ahora A-Z y <b>seis letras</b> en vez de cuatro), parámetros, contador de días, nombres de lugar, el panel de humor de las tres Guerreras y la pantalla de estado."}}]},{"titulo":{"pt":"O que ficou de fora","en":"What did not make it","es":"Lo que quedó fuera"},"itens":[{"t":{"pt":"<b>Um cabeçalho.</b> A barra no topo da tela de status mostra o nome do lugar em kanji — <code>村</code>, <code>岩山</code>, <code>精霊の森</code>. Cinco tentativas, três causas reais achadas e consertadas, e a quarta não fechou: a tela desenha o texto com a borda da barra cruzando as letras, embora os tiles e a nametable na memória de vídeo confiram byte a byte com o que o patch grava, e um render feito desses mesmos bytes saia limpo. Foram descartados, com medição, scroll, sprite e defasagem de quadro. <b>Não atrapalha:</b> esses mesmos três nomes já aparecem em inglês — <i>TOWN</i>, <i>MOUNTAIN</i>, <i>SPIRIT FOREST</i> — na barra do mapa, que é onde se olha o tempo todo.","en":"<b>One header.</b> The bar at the top of the status screen shows the place name in kanji — <code>村</code>, <code>岩山</code>, <code>精霊の森</code>. Five attempts, three real causes found and fixed, and the fourth did not close: the screen draws the text with the bar's border crossing the letters, even though the tiles and the nametable in video memory match byte for byte what the patch writes, and a render made from those same bytes comes out clean. Scroll, sprites and frame lag were ruled out by measurement. <b>It does not get in the way:</b> those same three names already appear in English — <i>TOWN</i>, <i>MOUNTAIN</i>, <i>SPIRIT FOREST</i> — on the map bar, which is what you look at all the time.","es":"<b>Un encabezado.</b> La barra en lo alto de la pantalla de estado muestra el nombre del lugar en kanji — <code>村</code>, <code>岩山</code>, <code>精霊の森</code>. Cinco intentos, tres causas reales encontradas y corregidas, y la cuarta no cerró: la pantalla dibuja el texto con el borde de la barra cruzando las letras, aunque los tiles y la nametable en la memoria de vídeo coinciden byte a byte con lo que el parche escribe, y un render hecho de esos mismos bytes sale limpio. Se descartaron, con medición, el scroll, los sprites y el desfase de fotograma. <b>No estorba:</b> esos mismos tres nombres ya aparecen en inglés — <i>TOWN</i>, <i>MOUNTAIN</i>, <i>SPIRIT FOREST</i> — en la barra del mapa, que es lo que se mira todo el rato."}},{"t":{"pt":"<b>Nenhuma pessoa jogou do começo ao fim.</b> Cada uma das linhas foi lida antes de sair, e uma <b>jogatina automática de 50 dias</b> chegou ao final e aos créditos no patch em inglês — foi ela que achou o japonês que sobrava. Mas uma partida jogada por gente, do primeiro dia ao final, ainda não aconteceu.","en":"<b>No person has played it start to finish.</b> Every line was read before shipping, and an <b>automated 50-day playthrough</b> reached the ending and the credits on the English patch — that is what found the leftover Japanese. But a full playthrough by a human, from day one to the ending, has not happened yet.","es":"<b>Ninguna persona lo ha jugado de principio a fin.</b> Cada línea fue leída antes de salir, y una <b>partida automática de 50 días</b> llegó al final y a los créditos con el parche en inglés — fue ella la que encontró el japonés que sobraba. Pero una partida jugada por una persona, del primer día al final, todavía no ha ocurrido."}}]}],"patch":{"release":"magic-knight-rayearth-2-v1.3.5","versoes":{"en":{"arquivo":"magic-knight-rayearth-2-en.ips","tamanho":"76 KB"},"pt":null,"es":null},"rom":"Magic Knight Rayearth 2 (Japan).gg","rom_md5":"b19256c6716147a9744f5bd528f14450"},"fotos":[{"f":"mkr2/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O título redesenhado, com a versão no canto.","en":"The redrawn title, with the version in the corner.","es":"El título redibujado, con la versión en la esquina."}},{"f":"mkr2/05-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"Antes do logo da SEGA, com a versão e o build.","en":"Before the SEGA logo, with the version and build.","es":"Antes del logo de SEGA, con la versión y el build."}},{"f":"mkr2/02-batalha.png","t":{"pt":"A batalha","en":"The battle","es":"La batalla"},"c":{"pt":"Até a versão 1.3.4 esta tela saía em japonês, e o número de dano vinha partido.","en":"Up to version 1.3.4 this screen was in Japanese, and the damage number came out split.","es":"Hasta la versión 1.3.4 esta pantalla salía en japonés, y el número de daño venía partido."}},{"f":"mkr2/03-autozam.png","t":{"pt":"Os mundos","en":"The worlds","es":"Los mundos"},"c":{"pt":"<code>AUTOZAM</code> inteiro numa caixa de doze caracteres.","en":"<code>AUTOZAM</code> whole in a twelve-character box.","es":"<code>AUTOZAM</code> entero en una caja de doce caracteres."}},{"f":"mkr2/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"A fonte de largura variável, em caixa baixa desde a versão 1.3, com o nome do jogador.","en":"The variable-width font, in lowercase since version 1.3, with the player's name.","es":"La fuente de ancho variable, en minúsculas desde la versión 1.3, con el nombre del jugador."}}]},{"slug":"captain-tsubasa","nome":"Captain Tsubasa","subtitulo":"Tecmo Theater Vol. 1","jp":"キャプテン翼","publisher":"Tecmo","dev":"Tecmo","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 · 128 KB PRG expanded to 256 KB · 128 KB CHR-ROM","categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"beta","capa":"ct/01-titulo.png","linha":{"pt":"Super Campeões, o futebol por menu de 1988 — com Benji no gol, Neia na gerência e o Treinador Milani no banco, como na Manchete.","en":"The 1988 game that invented football by menu. Sixteen Latin letters existed in the whole cartridge, and it now saves to battery.","es":"En España este fútbol por menú de 1988 perdió la licencia y Tsubasa se volvió Robin Field. Este parche traduce el cartucho japonés."},"resumo":{"pt":["Você não chuta: você escolhe. Cada lance é um item de menu, a animação decide o resto, e o <b>Guts</b> de cada jogador desce a cada drible, passe e finalização. Tecmo, 1988 — é daqui que descende todo futebol por turnos que veio depois, e no Brasil a série chegou como <b>Super Campeões</b>.","O Brasil nunca dublou a série de 1983, que é o arco deste jogo. O que existe em português brasileiro é o elenco da <i>Captain Tsubasa J</i>, que a Manchete exibiu em 1997, e é ele que a versão em português usa: <b>BENJI</b> no gol, <b>NEIA</b> na gerência, o <b>Treinador MILANI</b> no banco — os três que cabem no campo de cinco colunas da tela. Na prosa entram também <b>Oliver</b>, <b>Carlos</b> e <b>Roberto Maravilha</b>, cujos nomes brasileiros não cabiam ali. Em inglês as grafias seguem a edição oficial da Viz e do anime — Ozora, Hyuga, Schneider, Elle Sid Pierre —, e <b>Guts continua Guts</b>, porque é marca da série.","Duas coisas mudaram no jeito de jogar. O original de 1988 devolvia uma <b>senha para anotar no papel</b>, e digitá-la de volta era o único caminho de continuar; agora o <code>Salvar</code> do menu do técnico <b>grava no cartucho</b> e o <code>CONTINUE</code> carrega, com a tela de senha ainda ali para quem segurar <b>B</b>. Não há formato de save inventado: ficam gravados exatamente os <b>24 bytes</b> que a senha já descrevia, conferidos pela mesma rotina que valida senha digitada, em <b>97 bytes</b> de código novo. E a caixa de narração dobrou — um código de controle novo faz cada linha de roteiro ocupar duas fileiras, de <b>14 para 28 colunas</b> nas janelas da partida e de <b>18 para 36</b> nas maiores, sem tocar na moldura nem na contagem de linhas. A fonte teve de ser desenhada: no cartucho inteiro existiam <b>dezesseis letras latinas</b>, <code>ACDEFGHIKMRSUVWY</code>, e as outras nasceram do zero em 74 tiles. Que mover o texto não quebrou nada foi provado por igualdade: <b>225 dumps, 0 bytes diferentes</b> contra a ROM original."],"en":["You never shoot: you choose. Every play is a menu item, the animation decides the rest, and each player's <b>Guts</b> drains on every dribble, pass and shot. Tecmo, 1988 — every turn-based football game since descends from this one, and in Brazil the series arrived as <b>Super Campeões</b>.","The English spellings follow the official editions — Viz, the anime, <i>Dream Team</i>: Ozora, Hyuga, Jito, Karl Heinz Schneider, Elle Sid Pierre. <b>Guts stays Guts</b>, because it is a mark of the series. The squad is all there, from Tsubasa to the keeper Wakabayashi, with Nankatsu, the Japanese national side and the foreigners of the international tournament. The Portuguese build goes somewhere else entirely: Brazil never dubbed the 1983 series that this game covers, so it uses the cast of <i>Captain Tsubasa J</i>, which Rede Manchete aired in 1997 — <b>BENJI</b>, <b>NEIA</b> and <b>Coach MILANI</b> on screen, with Oliver, Carlos and Roberto Maravilha in the prose.","Two things changed in how it plays. The 1988 original handed you a <b>password to copy onto paper</b>, and typing it back was the only way to continue; now <code>SAVE</code> in the coach's menu <b>writes to the cartridge</b> and <code>CONTINUE</code> loads it, with the password screen still there for anyone holding <b>B</b>. No save format was invented: what gets stored is exactly the <b>24 bytes</b> the password already described, checked by the same routine that validates a typed password, in <b>97 bytes</b> of new code. And the commentary box doubled — a new control code makes each script line take two rows, from <b>14 to 28 columns</b> in the match windows and from <b>18 to 36</b> in the larger ones, without touching the frame or the line count. The font had to be drawn: exactly <b>sixteen Latin letters</b> existed in the whole cartridge, <code>ACDEFGHIKMRSUVWY</code>, and the rest were built from nothing across 74 tiles. That moving the text broke nothing was proved by equality: <b>225 dumps, 0 differing bytes</b> against the original ROM."],"es":["No disparas: eliges. Cada jugada es un elemento de menú, la animación decide el resto, y el <b>Guts</b> de cada jugador baja con cada regate, pase y tiro. Tecmo, 1988 — de aquí desciende todo el fútbol por turnos que vino después.","En España este cartucho sí llegó, en 1993, y llegó cambiado: se publicó como <i>Tecmo Cup Football Game</i>, con la licencia retirada, el protagonista convertido en <b>Robin Field</b>, rubio y adulto, y hasta las selecciones cambiadas de país. Esta traducción parte del japonés y se queda con él: <b>TSUBASA</b>, <b>HYUGA</b>, <b>WAKABAYASHI</b>, <b>MISAKI</b>, <b>SCHNEIDER</b>, <b>PIERRE</b>, con Nankatsu, la selección japonesa y los extranjeros del torneo internacional, y <b>Guts sigue siendo Guts</b>, porque es marca de la serie. La versión en portugués va a otro sitio: Brasil nunca dobló la serie de 1983, que es el arco de este juego, así que usa el reparto de <i>Captain Tsubasa J</i>, que Rede Manchete emitió en 1997 — <b>BENJI</b>, <b>NEIA</b> y el <b>Entrenador MILANI</b> en pantalla, en el campo de cinco columnas.","Dos cosas cambiaron en la forma de jugar. El original de 1988 devolvía una <b>contraseña para anotar en papel</b>, y escribirla de vuelta era el único camino para continuar; ahora <code>GRABAR</code>, en el menú del entrenador, <b>graba en el cartucho</b> y el <code>CONTINUE</code> carga, con la pantalla de contraseña ahí para quien mantenga pulsada la <b>B</b>. No se inventó ningún formato de guardado: quedan grabados exactamente los <b>24 bytes</b> que la contraseña ya describía, comprobados por la misma rutina que valida una contraseña escrita, en <b>97 bytes</b> de código nuevo. Y la caja de narración se dobló — un código de control nuevo hace que cada línea de guion ocupe dos filas, de <b>14 a 28 columnas</b> en las ventanas del partido y de <b>18 a 36</b> en las mayores, sin tocar el marco ni el conteo de líneas. La fuente hubo que dibujarla: en todo el cartucho existían <b>dieciséis letras latinas</b>, <code>ACDEFGHIKMRSUVWY</code>, y las demás nacieron de cero en 74 tiles. Que mover el texto no rompiera nada se probó por igualdad: <b>225 volcados, 0 bytes distintos</b> contra la ROM original."]},"numeros":[{"v":"1,001","r":{"pt":"itens de texto inseridos","en":"text items inserted","es":"elementos de texto insertados"}},{"v":"1,177","r":{"pt":"ponteiros corrigidos","en":"pointers corrected","es":"punteros corregidos"}},{"v":"16","r":{"pt":"letras latinas existiam","en":"Latin letters existed","es":"letras latinas existían"}},{"v":"0","r":{"pt":"bytes divergentes em 225 dumps","en":"bytes differing across 225 dumps","es":"bytes distintos en 225 volcados"}}],"grupos":[{"titulo":{"pt":"A tradução","en":"The translation","es":"La traducción"},"itens":[{"t":{"pt":"<b>1.001 itens de texto</b> em inglês, com <b>1.177 ponteiros</b> recalculados","en":"<b>1,001 text items</b> in English, with <b>1,177 pointers</b> recalculated","es":"<b>1.001 elementos de texto</b> en inglés, con <b>1.177 punteros</b> recalculados"},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Fonte inglesa nova de 74 tiles.</b> No cartucho inteiro existiam exatamente <b>dezesseis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. As outras dez, mais as minúsculas e a pontuação, não existiam em lugar nenhum e tiveram de ser desenhadas do zero, casando com tipos feitos para kana.","en":"<b>A new 74-tile English font.</b> Across the entire cartridge there were exactly <b>sixteen Latin letters</b> — <code>ACDEFGHIKMRSUVWY</code>. The other ten, plus the lower case and the punctuation, did not exist anywhere and had to be drawn from nothing, matched to typefaces designed for kana.","es":"<b>Una fuente inglesa nueva de 74 tiles.</b> En todo el cartucho existían exactamente <b>dieciséis letras latinas</b> — <code>ACDEFGHIKMRSUVWY</code>. Las otras diez, más las minúsculas y la puntuación, no existían en ninguna parte y hubo que dibujarlas de cero, casando con tipografías hechas para kana."}},{"t":{"pt":"<b>Três fontes em três bancos gráficos diferentes</b>, que não concordam entre si — a do campo, a da sala de aula e a da senha.","en":"<b>Three separate fonts living in three different graphics banks</b>, none of which agree with each other — the pitch, the classroom and the password screen.","es":"<b>Tres fuentes en tres bancos gráficos distintos</b>, que no concuerdan entre sí — la del campo, la del aula y la de la contraseña."},"foto":"ct/02-sala.png"},{"t":{"pt":"<b>Ficha do jogador em inglês</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","en":"<b>Player cards in English</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark","es":"<b>Fichas de jugador en inglés</b> — Level, Max Guts, Run, Pass, Shoot, Steal, Cut, Mark"},"foto":"ct/04-ficha.png"}]},{"titulo":{"pt":"Duas fileiras onde havia uma","en":"Two rows where there was one","es":"Dos filas donde había una"},"itens":[{"t":{"pt":"O motor de texto do campo escrevia <b>uma fileira</b> por linha de roteiro: 14 e 18 colunas. Um código de controle novo faz cada linha ocupar <b>duas fileiras</b> — <b>28 e 36 colunas</b> — sem mexer no roteiro, na moldura, nem na contagem de linhas. É o que dá espaço para a narração inglesa caber sem virar telegrama.","en":"The pitch text engine wrote <b>one row</b> per script line: 14 and 18 columns. A new control code makes each line occupy <b>two rows</b> — <b>28 and 36 columns</b> — without touching the script, the frame, or the line count. It is what lets English commentary fit without turning into a telegram.","es":"El motor de texto del campo escribía <b>una fila</b> por línea de guion: 14 y 18 columnas. Un código de control nuevo hace que cada línea ocupe <b>dos filas</b> — <b>28 y 36 columnas</b> — sin tocar el guion, el marco ni el conteo de líneas. Es lo que permite que la narración inglesa quepa sin volverse telegrama."},"foto":"ct/03-narrador.png"},{"t":{"pt":"<b>Senha latinizada e aceita.</b> A grade virou letras latinas maiúsculas, minúsculas e dígitos, e a senha gerada passa pela rotina de validação original do jogo.","en":"<b>The password screen latinised, and accepted.</b> The grid became Latin capitals, lower case and digits, and a generated password passes the game’s own validation routine.","es":"<b>Contraseña latinizada y aceptada.</b> La rejilla pasó a letras latinas mayúsculas, minúsculas y cifras, y la contraseña generada pasa por la rutina de validación original del juego."},"foto":"ct/06-senha.png"}]},{"titulo":{"pt":"Um save que o jogo não tinha","en":"A save the game never had","es":"Un guardado que el juego no tenía"},"itens":[{"t":{"pt":"O original de 1988 guarda progresso <b>só por senha</b>. Agora o jogo <b>grava em bateria</b>: salva ao escolher <code>Salvar</code> no menu do técnico e carrega no <code>CONTINUE</code> da tela de título.","en":"The 1988 original keeps progress <b>by password only</b>. Now the game <b>writes to battery-backed save</b>: it saves when you pick <code>SAVE</code> in the coach’s menu and loads on <code>CONTINUE</code> at the title screen.","es":"El original de 1988 guarda el progreso <b>solo por contraseña</b>. Ahora el juego <b>graba con pila</b>: guarda al elegir <code>GRABAR</code> en el menú del entrenador y carga en el <code>CONTINUE</code> de la pantalla de título."},"foto":"ct/07-memo.png"},{"t":{"pt":"<b>Nada de serialização nova.</b> O estado guardado é exatamente o que a senha já guardava — os mesmos 24 bytes — provado por duas rotinas independentes do próprio jogo. A integridade usa <b>a mesma rotina que valida senha digitada</b>.","en":"<b>No new serialisation.</b> The state saved is exactly what the password already carried — the same 24 bytes — proved against two independent routines in the game itself. Integrity checking uses <b>the same routine that validates a typed password</b>.","es":"<b>Sin inventar serialización.</b> El estado guardado es exactamente lo que la contraseña ya llevaba — los mismos 24 bytes — probado contra dos rutinas independientes del propio juego. La integridad usa <b>la misma rutina que valida una contraseña escrita</b>."},"foto":"ct/08-save.png"},{"t":{"pt":"São <b>97 bytes</b> de código novo em seis lugares. Testado desligando e ligando de verdade, com dois processos de emulador e um <code>.sav</code> real no meio: <b>0 de 4.096 bytes</b> de nametable diferentes depois do ciclo. Negativos cobertos: sem save, save corrompido em 1 bit, bateria gasta, e começar jogo novo sem apagar o save.","en":"It is <b>97 bytes</b> of new code in six places. Tested by really powering off and on, with two emulator processes and a real <code>.sav</code> in between: <b>0 of 4,096 bytes</b> of nametable differ after the cycle. Negatives covered: no save, save corrupted by one bit, dead battery, and starting a new game without erasing the save.","es":"Son <b>97 bytes</b> de código nuevo en seis sitios. Probado apagando y encendiendo de verdad, con dos procesos de emulador y un <code>.sav</code> real de por medio: <b>0 de 4.096 bytes</b> de nametable distintos tras el ciclo. Negativos cubiertos: sin guardado, guardado corrupto en 1 bit, pila gastada, y empezar partida nueva sin borrar lo guardado."}}]},{"titulo":{"pt":"Os logos","en":"The logos","es":"Los logos"},"itens":[{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>CAPTAIN TSUBASA</code> em duas linhas, no mesmo estilo e na mesma paleta, com a bola redesenhada e o avião movido para o canto. São <b>122 tiles</b> nos 127 disponíveis, e a tela reconstruída da ROM bate com o mockup em <b>0 pixels</b> de diferença.","en":"<b>The title logo redrawn</b> — <code>CAPTAIN TSUBASA</code> on two lines, in the same style and palette, with the ball redrawn and the aeroplane moved to the corner. It is <b>122 tiles</b> in the 127 available, and the screen reconstructed from the ROM matches the mockup at <b>0 pixels</b> of difference.","es":"<b>Logo del título redibujado</b> — <code>CAPTAIN TSUBASA</code> en dos líneas, en el mismo estilo y la misma paleta, con el balón redibujado y el avión movido a la esquina. Son <b>122 tiles</b> de los 127 disponibles, y la pantalla reconstruida desde la ROM coincide con el mockup con <b>0 píxeles</b> de diferencia."},"foto":"ct/01-titulo.png"},{"t":{"pt":"<b>O logo pequeno da sala de aula</b>, feito de 13 sprites, redesenhado como <code>TSUBASA</code> em miniatura — só os bitmaps mudam, as posições são as do jogo.","en":"<b>The small classroom logo</b>, made of 13 sprites, redrawn as a miniature <code>TSUBASA</code> — only the bitmaps change, the positions are the game’s own.","es":"<b>El logo pequeño del aula</b>, hecho de 13 sprites, redibujado como <code>TSUBASA</code> en miniatura — solo cambian los bitmaps, las posiciones son las del juego."}}]},{"titulo":{"pt":"Como se provou que nada quebrou","en":"How it was proved nothing broke","es":"Prueba, y lo que sigue abierto"},"itens":[{"t":{"pt":"<b>A relocação foi provada por igualdade.</b> Uma build que só move o texto japonês, sem traduzir nada, foi comparada com a ROM original: <b>225 dumps, 0 bytes diferentes</b> em nametable, OAM e paleta no percurso inteiro. Se mover o texto tivesse quebrado alguma coisa, essa build já mostraria.","en":"<b>Relocation was proved by equality.</b> A build that only moves the Japanese text, translating nothing, was compared against the original ROM: <b>225 dumps, 0 bytes differing</b> in nametable, OAM and palette across the whole run. If moving the text had broken anything, that build would already show it.","es":"<b>La reubicación se probó por igualdad.</b> Una compilación que solo mueve el texto japonés, sin traducirlo, se comparó con la original: <b>225 volcados, 0 bytes distintos</b> en nametable, OAM y paleta en todo el recorrido. Dos defectos reales aparecieron solo en esa prueba."}},{"t":{"pt":"<b>Dois defeitos reais só apareceram nesse teste</b>, e não em nenhum outro: uma rotina que trocava de banco por byte estourava o quadro e fazia sumir uma linha do torneio, e uma string que mora na RAM — e que o jogo <b>escreve</b> — fazia os números das camisas saírem errados. Nenhum dos dois apareceria numa leitura de código.","en":"<b>Two real defects showed up only in that test</b>, and in no other: a routine switching banks byte by byte overran the frame and made a line of the tournament vanish, and a string that lives in RAM — and that the game <b>writes to</b> — made the shirt numbers come out wrong. Neither would have shown up in a code review.","es":"Sigue abierto: el <b>motor de créditos</b> no está reubicado, la pantalla de <b>error de contraseña</b> tiene 19 caracteres fijos en el código, y la lista de nombres del <b>final</b> aún debe cambiar de columna. Por eso la etiqueta es <b>beta</b>, y no lanzamiento."}},{"t":{"pt":"O save novo foi testado <b>desligando e ligando de verdade</b>, com dois processos de emulador e um arquivo de save real de permeio — não com savestate, que não prova bateria nenhuma.","en":"The new save was tested by <b>really powering off and on</b>, with two emulator processes and a real save file in between — not with a savestate, which proves nothing about a battery.","es":"El guardado nuevo se probó <b>apagando y encendiendo de verdad</b>, con dos procesos de emulador y un archivo de guardado real de por medio — no con un savestate, que no prueba nada sobre la pila."}}]}],"patch":{"versoes":{"en":{"arquivo":"captain-tsubasa-en.ips","tamanho":"164 KB"},"pt":{"arquivo":"captain-tsubasa-pt.ips","tamanho":"163 KB"},"es":{"arquivo":"captain-tsubasa-es.ips","tamanho":"164 KB"}},"rom":"Captain Tsubasa (Japan).nes","rom_md5":"eeb77e6e0e0b5695f9a35f47979c4722"},"fotos":[{"f":"ct/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo redesenhado em 122 tiles, com a bola nova e o avião no canto.","en":"The logo redrawn in 122 tiles, with the new ball and the aeroplane in the corner.","es":"El logo redibujado en 122 tiles, con el balón nuevo y el avión en la esquina."}},{"f":"ct/03-narrador.png","t":{"pt":"Narração","en":"Commentary","es":"Narración"},"c":{"pt":"Quatro linhas onde cabiam duas: o código de controle novo dobra a largura útil.","en":"Four lines where two used to fit: the new control code doubles the usable width.","es":"Cuatro líneas donde cabían dos: el código de control nuevo dobla el ancho útil."}},{"f":"ct/02-sala.png","t":{"pt":"Sala de aula","en":"Classroom","es":"Aula"},"c":{"pt":"O menu do técnico — <code>Info</code>, <code>Salvar</code>, <code>Jogar</code> — e a segunda fonte do jogo.","en":"The coach’s menu — <code>SCOUT</code>, <code>SAVE</code>, <code>PLAY</code> — and the game’s second font.","es":"El menú del entrenador — <code>DATOS</code>, <code>GRABAR</code>, <code>JUGAR</code> — y la segunda fuente del juego."}},{"f":"ct/04-ficha.png","t":{"pt":"Ficha do jogador","en":"Player card","es":"Ficha del jugador"},"c":{"pt":"Level, Max Guts e os seis atributos, com a lista do elenco ao lado.","en":"Level, Max Guts and the six stats, with the squad list beside it.","es":"Level, Max Guts y los seis atributos, con la lista de la plantilla al lado."}},{"f":"ct/05-jogo.png","t":{"pt":"Em jogo","en":"In play","es":"En juego"},"c":{"pt":"O menu de ação durante a partida, com o Guts descendo a cada jogada.","en":"The action menu during a match, with Guts draining on every play.","es":"El menú de acción durante el partido, con el Guts bajando en cada jugada."}},{"f":"ct/06-senha.png","t":{"pt":"Senha","en":"Password","es":"Contraseña"},"c":{"pt":"A grade latinizada — e a senha gerada passa na validação original do jogo.","en":"The latinised grid — and a generated password passes the game’s own validation.","es":"La rejilla latinizada — y la contraseña generada pasa la validación original del juego."}},{"f":"ct/07-memo.png","t":{"pt":"Score Memo","en":"Score Memo","es":"Score Memo"},"c":{"pt":"O instante em que o jogo grava: a Sanae dá a senha, e o save vai junto.","en":"The moment the game saves: Sanae reads out the password, and the save goes with it.","es":"El instante en que el juego guarda: Sanae dicta la contraseña, y el guardado va con ella."}},{"f":"ct/08-save.png","t":{"pt":"Carregado da bateria","en":"Loaded from battery","es":"Cargado de la pila"},"c":{"pt":"Depois de desligar e ligar de verdade — <code>16a Copa Nacional Juvenil</code>, exatamente onde parou.","en":"After a real power cycle — <code>16th All-Japan Jr. Cup</code>, exactly where it stopped.","es":"Tras apagar y encender de verdad — <code>16th All-Japan Jr. Cup</code>, exactamente donde se quedó."}}]},{"slug":"tom-sawyer","nome":"Square's Tom Sawyer","subtitulo":"スクウェアのトム・ソーヤ","jp":"スクウェアのトム・ソーヤ","publisher":"Square","dev":"Square","ano":1989,"data":"1989","sistema":"Famicom","mapper":"MMC1 (SUROM viável) · 256 KB PRG · CHR-RAM de 8 KB · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"tom/01-titulo.png","linha":{"pt":"A Square pegou Mark Twain e fez um RPG com Tom e Huck. O livro é americano; o jogo ficou no Japão, e a ROM teve de dobrar para caber.","en":"Square took Mark Twain and made an RPG with Tom and Huck. The book is American; the game stayed in Japan, and the ROM had to double.","es":"Square tomó la novela de Mark Twain y montó un RPG con Tom y Huck. El libro es americano; el juego se quedó en Japón, y la ROM tuvo que duplicarse."},"resumo":{"pt":["De todos os cartuchos deste catálogo, este é o único cuja história você provavelmente já leu. Em 1989 a Square — dois anos antes do <i>Final Fantasy IV</i> — pegou o romance do Mark Twain e fez um RPG de Famicom com Tom e Huck, no Mississippi de 1855. E o resultado tem cara de Square: retrato do personagem na caixa de fala, um menu de campo que diz <code>EXAMINE / TAKE  DIG / ITEM</code>, porque num jogo de Tom Sawyer cavar precisa ser comando, e um inventário onde cabem uma barraca e uma bola de gude.","Boa parte do que se ia acrescentar já vinha de fábrica: o cartucho <b>salva em bateria</b>, e o menu de abertura de 1989 já trazia <code>CONTINUE / START / SPEED 5</code> — ajuste de velocidade de texto, e já em inglês. O que faltava era o resto. As <b>576 mensagens</b> e os <b>70 nomes</b> estão traduzidos, escritos numa fonte latina de <b>61 tiles novos</b> desenhados sobre as casas de kana que o inglês não usa, mais os dez dígitos, sem tocar em nenhum gráfico de tela — e a tela de título saiu redesenhada como <code>SQUARE'S / TOM SAWYER</code>, provada em jogo.","O inglês custou espaço: medido neste cartucho, ele ocupa <b>1,63×</b> o japonês, e a ROM inteira tinha <b>6,2 KB livres</b>, fragmentados, com a maior região contígua em 1.168 bytes e o bloco de texto do banco 6 fechando com 9 bytes de sobra. A saída foi expandir para <b>512 KB</b> pelo caminho SUROM — como o jogo usa CHR-RAM, os registradores de banco de CHR estão ociosos e o bit 4 vira o A18 do PRG —, com uma cópia do banco fixo na metade nova, sem a qual o cartucho perde o kernel e trava no boot. Depois disso a varredura foi refeita e devolveu mais <b>2,1 KB de japonês vivo</b> que a extração do roteiro não pegava: nomes de item, dois menus de batalha, os créditos escondidos. E há um segredo: um <b>código de oito caracteres digitado no campo de nome</b>, que no original era <code>ホワイトラビット</code>, o coelho branco, e agora se digita <code>WHITERAB</code>. Não há patch para instalar; esta página acompanha o trabalho."],"en":["Of every cartridge in this catalogue, this is the only one whose story you have probably already read. In 1989 Square — two years before <i>Final Fantasy IV</i> — took Mark Twain's novel and made a Famicom RPG with Tom and Huck, on the 1855 Mississippi. And the result looks like Square: a character portrait in the dialogue box, a field menu reading <code>EXAMINE / TAKE  DIG / ITEM</code>, because in a Tom Sawyer game digging has to be a command, and an inventory with room for a tent and a marble.","Much of what you would think to add was already there in 1989: the cartridge <b>saves to battery</b>, and the boot menu already offered <code>CONTINUE / START / SPEED 5</code> — a text-speed setting, already in English. What was left was everything else. The <b>576 messages</b> and <b>70 names</b> are translated, written in a Latin font of <b>61 new tiles</b> drawn over the kana slots English does not use, plus the ten digits, without touching a single screen graphic — and the title screen was redrawn as <code>SQUARE'S / TOM SAWYER</code>, proved in game.","English cost space: measured on this cartridge, it runs <b>1.63×</b> the Japanese, and the whole ROM had <b>6.2 KB free</b>, fragmented, the largest contiguous region at 1,168 bytes and the bank 6 text block closing with 9 bytes to spare. The way out was expanding to <b>512 KB</b> by the SUROM route — because the game uses CHR-RAM, the CHR bank registers sit idle and bit 4 becomes PRG A18 — with a copy of the fixed bank in the new half, without which the cartridge loses its kernel and hangs at boot. After that the sweep was run again and returned another <b>2.1 KB of live Japanese</b> the script extraction had not reached: item names, two battle menus, the hidden credits. And there is a secret: an <b>eight-character code typed into the name field</b>, which in the original was <code>ホワイトラビット</code>, the white rabbit, and is now typed <code>WHITERAB</code>. There is no patch to install; this page follows the work."],"es":["De todos los cartuchos de este catálogo, este es el único cuya historia probablemente ya has leído. En 1989 Square — dos años antes de <i>Final Fantasy IV</i> — tomó la novela de Mark Twain e hizo un RPG de Famicom con Tom y Huck, en el Misisipi de 1855. Y el resultado tiene cara de Square: retrato del personaje en la caja de diálogo, un menú de campo que dice <code>EXAMINE / TAKE  DIG / ITEM</code>, porque en un juego de Tom Sawyer cavar tiene que ser un comando, y un inventario donde caben una tienda de campaña y una canica.","Buena parte de lo que uno pensaría en añadir ya venía de fábrica: el cartucho <b>guarda con pila</b>, y el menú de arranque de 1989 ya traía <code>CONTINUE / START / SPEED 5</code> — ajuste de velocidad de texto, y ya en inglés. Lo que quedaba era todo lo demás. Los <b>576 mensajes</b> y los <b>70 nombres</b> están traducidos, escritos en una fuente latina de <b>61 tiles nuevos</b> dibujados sobre las casillas de kana que el inglés no usa, más las diez cifras, sin tocar ni un gráfico de pantalla — y la pantalla de título salió rediseñada como <code>SQUARE'S / TOM SAWYER</code>, probada en juego.","El inglés costó espacio: medido en este cartucho, ocupa <b>1,63×</b> lo que el japonés, y la ROM entera tenía <b>6,2 KB libres</b>, fragmentados, con la mayor región contigua en 1.168 bytes y el bloque de texto del banco 6 cerrando con 9 bytes de sobra. La salida fue ampliar a <b>512 KB</b> por el camino SUROM — como el juego usa CHR-RAM, los registros de banco de CHR están ociosos y el bit 4 pasa a ser el A18 del PRG —, con una copia del banco fijo en la mitad nueva, sin la cual el cartucho pierde el kernel y se cuelga al arrancar. Después de eso el barrido se rehízo y devolvió otros <b>2,1 KB de japonés vivo</b> que la extracción del guion no alcanzaba: nombres de objeto, dos menús de combate, los créditos escondidos. Y hay un secreto: un <b>código de ocho caracteres escrito en el campo de nombre</b>, que en el original era <code>ホワイトラビット</code>, el conejo blanco, y ahora se escribe <code>WHITERAB</code>. No hay parche que instalar; esta página sigue el trabajo."]},"numeros":[{"v":"0","r":{"pt":"blocos de gráfico no arquivo","en":"graphics blocks in the file","es":"bloques de gráfico en el archivo"}},{"v":"113","r":{"pt":"tiles livres para 61 necessários","en":"free tiles for the 61 needed","es":"tiles libres para los 61 necesarios"}},{"v":"12","r":{"pt":"letras latinas já existem","en":"Latin letters already exist","es":"letras latinas ya existen"}},{"v":"2","r":{"pt":"linhas por caixa de fala","en":"lines per dialogue box","es":"líneas por caja de diálogo"}}],"grupos":[{"titulo":{"pt":"O problema que este jogo traz","en":"The problem this game brings","es":"El problema que trae este juego"},"itens":[{"t":{"pt":"<b>CHR-RAM, não CHR-ROM.</b> Nos outros três, os desenhos ficam num bloco do arquivo e se editam direto. Aqui esse bloco <b>não existe</b>: os tiles moram junto com o código e são copiados para a memória de vídeo em tempo de execução. Achar a fonte é achar a <b>rotina que a carrega</b>, não a figura.","en":"<b>CHR-RAM, not CHR-ROM.</b> In the other three, the drawings sit in a block of the file and are edited directly. Here that block <b>does not exist</b>: the tiles live alongside the code and are copied into video memory at run time. Finding the font means finding the <b>routine that uploads it</b>, not the picture.","es":"<b>CHR-RAM, no CHR-ROM.</b> En los otros tres, los dibujos están en un bloque del archivo y se editan directamente. Aquí ese bloque <b>no existe</b>: los tiles viven junto al código y se copian a la memoria de vídeo en tiempo de ejecución. Encontrar la fuente es encontrar la <b>rutina que la carga</b>, no la imagen."},"foto":"tom/01-titulo.png"},{"t":{"pt":"A boa notícia, medida: <b>os tiles estão crus, sem compressão</b> — a fonte está em <code>0x017720</code>, com 140 tiles. Não há descompressor a vencer, nem para a fonte nem para as imagens.","en":"The good news, measured: <b>the tiles are raw, uncompressed</b> — the font sits at <code>0x017720</code>, 140 tiles. There is no decompressor to defeat, for the font or for the pictures.","es":"La buena noticia, medida: <b>los tiles están crudos, sin compresión</b> — la fuente está en <code>0x017720</code>, con 140 tiles. No hay descompresor que vencer, ni para la fuente ni para las imágenes."}}]},{"titulo":{"pt":"O que já foi medido","en":"What is already measured","es":"Lo que ya está medido"},"itens":[{"t":{"pt":"<b>A fonte cabe.</b> Reciclando os kana — que o inglês não usa — sobram <b>113 tiles</b> para os cerca de 61 necessários (A-Z, a-z e pontuação). Sem fonte de largura variável e sem tocar em gráfico de tela.","en":"<b>The font fits.</b> Recycling the kana — which English does not use — leaves <b>113 tiles</b> for the roughly 61 needed (A-Z, a-z and punctuation). With no variable-width font and without touching any screen graphic.","es":"<b>La fuente cabe.</b> Reciclando los kana — que el inglés no usa — sobran <b>113 tiles</b> para los aproximadamente 61 necesarios (A-Z, a-z y puntuación). Sin fuente de ancho variable y sin tocar ningún gráfico de pantalla."}},{"t":{"pt":"O alfabeto latino tem de cair na faixa de códigos <code>$09-$8E</code>: acima de <code>$90</code> o motor arrasta um diacrítico para a linha de cima, e <code>$D0-$D3</code> estão reservados para inserir o nome do personagem.","en":"The Latin alphabet has to land in the code range <code>$09-$8E</code>: above <code>$90</code> the engine drags a diacritic onto the line above, and <code>$D0-$D3</code> are reserved for inserting the character’s name.","es":"El alfabeto latino tiene que caer en el rango de códigos <code>$09-$8E</code>: por encima de <code>$90</code> el motor arrastra un diacrítico a la línea de arriba, y <code>$D0-$D3</code> están reservados para insertar el nombre del personaje."}},{"t":{"pt":"<b>Doze letras latinas já existem</b> na ROM — <code>A C D E N O P I R S T U</code> e os dígitos, o suficiente para escrever <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> e <code>SQUARE</code>. As outras catorze, mais todas as minúsculas, precisam ser desenhadas.","en":"<b>Twelve Latin letters already exist</b> in the ROM — <code>A C D E N O P I R S T U</code> and the digits, enough to write <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> and <code>SQUARE</code>. The other fourteen, plus every lower-case letter, have to be drawn.","es":"<b>Doce letras latinas ya existen</b> en la ROM — <code>A C D E N O P I R S T U</code> y las cifras, suficiente para escribir <code>CONTINUE</code>, <code>START</code>, <code>SPEED</code> y <code>SQUARE</code>. Las otras catorce, más todas las minúsculas, hay que dibujarlas."},"foto":"tom/02-menu.png"},{"t":{"pt":"<b>O menu de opções já existe e já está em inglês.</b> O jogo de 1989 abre com <code>CONTINUE / START / SPEED 5</code> — inclusive o ajuste de velocidade de texto que os outros hacks tiveram de acrescentar. Aqui não se cria tela nova.","en":"<b>The options menu already exists, and is already in English.</b> The 1989 game opens with <code>CONTINUE / START / SPEED 5</code> — including the text-speed setting the other hacks had to add. Here no new screen gets built.","es":"<b>El menú de opciones ya existe, y ya está en inglés.</b> El juego de 1989 abre con <code>CONTINUE / START / SPEED 5</code> — incluido el ajuste de velocidad de texto que los otros hacks tuvieron que añadir. Aquí no se crea ninguna pantalla nueva."}},{"t":{"pt":"<b>A restrição mais dura é a caixa de fala:</b> retrato do personagem à esquerda, duas linhas de texto, e a linha útil curta por causa do retrato. Inglês é mais largo que kana, e sem fonte de largura variável não há como encolher.","en":"<b>The hardest constraint is the dialogue box:</b> a character portrait on the left, two lines of text, and a short usable line because of the portrait. English is wider than kana, and with no variable-width font there is no way to shrink it.","es":"<b>La restricción más dura es la caja de diálogo:</b> retrato del personaje a la izquierda, dos líneas de texto, y la línea útil corta por el retrato. El inglés es más ancho que el kana, y sin fuente de ancho variable no hay forma de encogerlo."},"foto":"tom/03-dialogo.png"},{"t":{"pt":"<b>Expansão para 512 KB é viável</b> pelo caminho SUROM: como o jogo usa CHR-RAM, os registradores de banco de CHR estão ociosos e o bit 4 vira o A18 do PRG. <b>Só será usada se a conta do roteiro exigir</b> — até agora não exigiu.","en":"<b>Expansion to 512 KB is viable</b> by the SUROM route: because the game uses CHR-RAM, the CHR bank registers are idle and bit 4 becomes PRG A18. <b>It will only be used if the script arithmetic demands it</b> — so far it has not.","es":"<b>La expansión a 512 KB es viable</b> por la vía SUROM: como el juego usa CHR-RAM, los registros de banco de CHR están ociosos y el bit 4 pasa a ser PRG A18. <b>Solo se usará si la cuenta del guion lo exige</b> — hasta ahora no lo ha exigido."}}]},{"titulo":{"pt":"O que vem a seguir","en":"What comes next","es":"Lo que viene"},"itens":[{"t":{"pt":"O roteiro está sendo extraído. Depois dele vêm a tabela de caracteres, a fonte latina desenhada e a reinserção — e só então existe algo jogável para chamar de beta.","en":"The script is being extracted. After it come the character table, the drawn Latin font and the reinsertion — and only then is there something playable to call a beta.","es":"El guion se está extrayendo. Después vienen la tabla de caracteres, la fuente latina dibujada y la reinserción — y solo entonces habrá algo jugable que llamar beta."}},{"t":{"pt":"<b>Nenhuma data é prometida</b>, aqui como em tudo o mais.","en":"<b>No date is promised</b>, here as anywhere else.","es":"<b>No se promete ninguna fecha</b>, aquí como en todo lo demás."}}]}],"patch":{"versoes":{"en":{"arquivo":"tom-sawyer-en.ips","tamanho":"251 KB"},"pt":null,"es":null},"rom":"Square no Tom Sawyer (Japan).nes","rom_md5":"b7e85ec90d071443ea69614c02a7a0a0"},"fotos":[{"f":"tom/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"ROM original. O título é texto em katakana, não um logo desenhado — o que torna a troca barata.","en":"Original ROM. The title is katakana text, not a drawn logo — which makes replacing it cheap.","es":"ROM original. El título es texto en katakana, no un logo dibujado — lo que abarata el reemplazo."}},{"f":"tom/02-menu.png","t":{"pt":"Menu de abertura","en":"Boot menu","es":"Menú de arranque"},"c":{"pt":"ROM original — e já em inglês, com ajuste de velocidade de texto de fábrica.","en":"Original ROM — and already in English, with a factory text-speed setting.","es":"ROM original — y ya en inglés, con ajuste de velocidad de texto de fábrica."}},{"f":"tom/03-dialogo.png","t":{"pt":"A caixa de fala","en":"The dialogue box","es":"La caja de diálogo"},"c":{"pt":"ROM original. Retrato à esquerda e duas linhas: é esta a restrição que decide a tradução.","en":"Original ROM. Portrait on the left and two lines: this is the constraint that decides the translation.","es":"ROM original. Retrato a la izquierda y dos líneas: esta es la restricción que decide la traducción."}},{"f":"tom/06-abertura.png","t":{"pt":"A abertura","en":"The opening","es":"La apertura"},"c":{"pt":"ROM original. Missouri, 1855 — o texto que abre o jogo.","en":"Original ROM. Missouri, 1855 — the text that opens the game.","es":"ROM original. Misuri, 1855 — el texto que abre el juego."}},{"f":"tom/04-campo.png","t":{"pt":"No campo","en":"In the field","es":"En el campo"},"c":{"pt":"ROM original. O Mississippi da Square, em tiles.","en":"Original ROM. Square's Mississippi, in tiles.","es":"ROM original. El Misisipi de Square, en tiles."}},{"f":"tom/05-status.png","t":{"pt":"Status","en":"Status","es":"Estado"},"c":{"pt":"ROM original. HP, AP, DP e QP já saem em letras latinas; os comandos, não.","en":"Original ROM. HP, AP, DP and QP already come out in Latin letters; the commands do not.","es":"ROM original. HP, AP, DP y QP ya salen en letras latinas; los comandos no."}}]},{"slug":"ultraman-club-2","nome":"Ultraman Club 2","subtitulo":"Kaettekita Ultraman Club","jp":"帰ってきたウルトラマン倶楽部","publisher":"Shinsei","dev":"Tsuburaya Prod.","ano":1989,"data":"1989","sistema":"Famicom","mapper":"MMC3 · 128 KB PRG expandido para 256 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"beta","capa":"u2/01-titulo.png","linha":{"pt":"O RPG em que Zoffy, Ace, Taro e Seven viram bonecos de cabeça grande — e o bestiário inteiro, perto de noventa monstros, saiu em inglês.","en":"The RPG where Zoffy, Ace, Taro and Seven become big-headed figures — with the whole bestiary, close to ninety monsters, now in English.","es":"El RPG en el que Zoffy, Ace, Taro y Seven son muñecos cabezones — y el bestiario entero, cerca de noventa monstruos, salió en inglés."},"resumo":{"pt":["A Tsuburaya deixou os Ultras virarem bonecos de cabeça grande e os pôs num RPG de Famicom, com a Shinsei, em 1989. O elenco é o panteão inteiro — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, a Mãe e o Pai de Ultra, o Rei de Ultra — e o mapa é feito dos lugares que a série construiu ao longo de vinte anos: a <b>Terra dos Ultras</b>, a Vila do Pigmon, o <b>Cemitério de Monstros</b>. Do outro lado, os alienígenas de sempre: Baltan, Metron, Guts.","O patch em <b>inglês está publicado</b>, com <b>653 entradas de texto</b>: 447 mensagens de diálogo, batalha, descrição de item, sequência final e créditos; 56 de menu, golpes e itens; e <b>146 entradas de combate</b> que carregam o bestiário inteiro, perto de noventa monstros. Cada nome de kaiju foi conferido contra o manual japonês e contra a nomenclatura consagrada da série — num patch de tradução, nome errado é o defeito que o fã enxerga primeiro. A fonte do jogo nem tinha <code>.</code> <code>,</code> <code>'</code> <code>-</code>: os quatro glifos foram desenhados sobre kanji que o texto traduzido não usa mais.","As <b>146 entradas de combate</b> são o quarto bloco de texto da ROM, e só apareceram porque a varredura foi refeita na ROM já <i>montada</i>. Na ROM original os bytes de ponteiro do bloco caem na faixa do kana, e a análise o havia descartado como dado binário — é o lembrete de que uma tradução termina quando a ROM inteira foi varrida, não quando a lista de tabelas conhecidas acabou. Até quatro partículas japonesas escaparam de qualquer varredura de tabela, porque estão escritas dentro do código como <code>LDA #$AC</code> no meio da rotina de batalha, colando kana no fim do nome do monstro na tela. Nem o inglês cabia no cartucho como ele saiu de fábrica: a ROM foi <b>expandida de 128 para 256 KB</b>, com os bancos 14 e 15 duplicados no fim, porque no MMC3 o banco fixo é sempre o último. O que ficou gravado é lido de volta e comparado byte a byte com o roteiro: <b>653 entradas, zero divergências</b>."],"en":["Tsuburaya let the Ultras become big-headed chibi figures and put them in a Famicom RPG, with Shinsei, in 1989. The cast is the whole pantheon — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, the Mother and Father of Ultra, Ultraman King — and the map is built from places the series raised over twenty years: the <b>Land of Ultra</b>, Pigmon Village, the <b>Monster Graveyard</b>. On the other side, the usual aliens: Baltan, Metron, Guts.","The <b>English patch is published</b>, carrying <b>653 text entries</b>: 447 messages of dialogue, battle, item descriptions, the ending sequence and the credits; 56 for menus, moves and items; and <b>146 battle entries</b> holding the entire bestiary, close to ninety monsters. Every kaiju name was checked against the Japanese manual and against the series' settled nomenclature — in a translation patch, a wrong name is the defect a fan spots first. The game's font did not even have <code>.</code> <code>,</code> <code>'</code> <code>-</code>: those four glyphs were drawn over kanji the translated text no longer uses.","Those <b>146 battle entries</b> are the ROM's fourth text block, and they only surfaced because the sweep was run again on the <i>built</i> ROM. In the original ROM the block's pointer bytes fall inside the kana range, and the analysis had dismissed it as binary data — a reminder that a translation ends when the whole ROM has been swept, not when the list of known tables runs out. Four Japanese particles escaped every table sweep as well, because they are written inside the program as <code>LDA #$AC</code> in the middle of the battle routine, gluing kana onto the end of the monster's name on screen. Not even English fit the cartridge as it shipped: the ROM was <b>expanded from 128 to 256 KB</b>, with banks 14 and 15 duplicated at the end, because on MMC3 the fixed bank is always the last one. What ends up written is read back and compared byte for byte against the script: <b>653 entries, zero mismatches</b>."],"es":["Tsuburaya dejó que los Ultras se volvieran muñecos cabezones y los puso en un RPG de Famicom, con Shinsei, en 1989. El reparto es el panteón entero — Ultraman, <b>Zoffy</b>, Ace, Taro, Seven, Jack, la Madre y el Padre de Ultra, el Rey de Ultra — y el mapa está hecho de los lugares que la serie levantó a lo largo de veinte años: la <b>Tierra de los Ultras</b>, la Aldea de Pigmon, el <b>Cementerio de Monstruos</b>. Al otro lado, los alienígenas de siempre: Baltan, Metron, Guts.","El parche en <b>inglés está publicado</b>, con <b>653 entradas de texto</b>: 447 mensajes de diálogo, combate, descripción de objeto, secuencia final y créditos; 56 de menú, golpes y objetos; y <b>146 entradas de combate</b> que llevan el bestiario entero, cerca de noventa monstruos. Cada nombre de kaiju se cotejó con el manual japonés y con la nomenclatura asentada de la serie — en un parche de traducción, un nombre mal puesto es el defecto que el aficionado ve primero. La fuente del juego ni siquiera tenía <code>.</code> <code>,</code> <code>'</code> <code>-</code>: los cuatro glifos se dibujaron sobre kanji que el texto traducido ya no usa.","Esas 146 entradas de combate son el cuarto bloque de texto de la ROM, y solo aparecieron porque el barrido se rehízo sobre la ROM ya <i>montada</i>. En la ROM original los bytes de puntero del bloque caen en el rango del kana, y el análisis lo había descartado como dato binario — es el recordatorio de que una traducción termina cuando se ha barrido la ROM entera, no cuando se acaba la lista de tablas conocidas. Cuatro partículas japonesas escaparon también de cualquier barrido de tabla, porque están escritas dentro del código como <code>LDA #$AC</code> en mitad de la rutina de combate, pegando kana al final del nombre del monstruo en pantalla. Ni el inglés cabía en el cartucho tal como salió de fábrica: la ROM se <b>amplió de 128 a 256 KB</b>, con los bancos 14 y 15 duplicados al final, porque en el MMC3 el banco fijo es siempre el último. Lo que queda grabado se lee de vuelta y se compara byte a byte con el guion: <b>653 entradas, cero divergencias</b>."]},"numeros":[{"v":"653","r":{"pt":"entradas de texto traduzidas","en":"text entries translated","es":"entradas de texto traducidas"}},{"v":"4","r":{"pt":"blocos de texto na ROM","en":"text blocks in the ROM","es":"bloques de texto en la ROM"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}},{"v":"22×4","r":{"pt":"a caixa de fala, em colunas","en":"the dialogue box, in columns","es":"la caja de diálogo, en columnas"}}],"grupos":[{"titulo":{"pt":"O que já entrou","en":"What is already in","es":"Lo que ya entró"},"itens":[{"t":{"pt":"<b>447 mensagens</b> de diálogo, batalha, descrições de item, a sequência final e os créditos — em três grupos de texto.","en":"<b>447 messages</b> of dialogue, battle, item descriptions, the ending sequence and the credits — across three text groups.","es":"<b>447 mensajes</b> de diálogo, combate, descripciones de objetos, la secuencia final y los créditos — en tres grupos de texto."},"foto":"u2/03-encontro.png"},{"t":{"pt":"<b>146 entradas</b> de combate: as mensagens de ação, os gritos de golpe e o <b>bestiário inteiro</b> — cerca de 90 monstros. Este quarto bloco só apareceu ao varrer kana na ROM <i>montada</i>: os bytes de ponteiro dele caem na faixa do kana e a análise da ROM original o descartou como dado binário.","en":"<b>146 battle entries</b>: action messages, attack shouts and the <b>whole bestiary</b> — about 90 monsters. This fourth block only surfaced when scanning kana in the <i>built</i> ROM: its pointer bytes fall in the kana range and the original-ROM analysis dismissed it as binary data.","es":"<b>146 entradas</b> de combate: mensajes de acción, gritos de técnica y el <b>bestiario entero</b> — unos 90 monstruos. Este cuarto bloque solo apareció al barrer kana en la ROM <i>construida</i>."},"foto":"u2/04-menu-batalha.png"},{"t":{"pt":"<b>56 entradas</b> de menu, golpes, itens e nomes de monstro, e mais <b>4 partículas japonesas cravadas no código</b> — <code>は</code> e <code>に</code>, que nenhuma varredura de tabela acha porque estão escritas como <code>LDA #$AC</code> no meio da rotina de batalha.","en":"<b>56 entries</b> for menus, moves, items and monster names, plus <b>4 Japanese particles hardcoded in the code</b> — <code>は</code> and <code>に</code>, which no table scan finds because they are written as <code>LDA #$AC</code> inside the battle routine.","es":"<b>56 entradas</b> de menú, técnicas, objetos y nombres de monstruo, y <b>4 partículas japonesas grabadas en el código</b>."},"foto":"u2/05-combate.png"},{"t":{"pt":"A <b>tela de título</b> redesenhada em 120 tiles, a partir da arte em inglês — e a paleta 1 igualada à 0, porque a tabela de atributos ainda marcava branco na faixa onde ficava o texto japonês pequeno.","en":"The <b>title screen</b> redrawn in 120 tiles from the English artwork — and palette 1 matched to palette 0, because the attribute table still marked white over the band where the small Japanese text used to be.","es":"La <b>pantalla de título</b> redibujada en 120 tiles a partir del arte en inglés."},"foto":"u2/01-titulo.png"},{"t":{"pt":"A ROM foi <b>expandida de 128 KB para 256 KB</b>. Os bancos 14 e 15 são duplicados no fim: no MMC3 o banco fixo é sempre o <i>último</i> da ROM, e crescer sem copiá-los deixa o vetor de reset em área vazia — tela verde no boot.","en":"The ROM was <b>expanded from 128 KB to 256 KB</b>. Banks 14 and 15 are duplicated at the end: on MMC3 the fixed bank is always the <i>last</i> one, and growing without copying them leaves the reset vector in empty space — green screen on boot.","es":"La ROM fue <b>ampliada de 128 KB a 256 KB</b>."}},{"t":{"pt":"<b>Round-trip verificado:</b> o que está gravado na ROM é lido de volta e comparado, byte a byte, com o roteiro em inglês — 653 entradas, zero divergências. E um verificador de caixa confere 22 colunas por 4 linhas no diálogo, e 22 colunas no combate, antes de qualquer coisa sair.","en":"<b>Round-trip verified:</b> what is written in the ROM is read back and compared, byte for byte, against the English script — 653 entries, zero mismatches. And a box checker confirms 22 columns by 4 lines in dialogue, and 22 columns in battle, before anything ships.","es":"<b>Round-trip verificado:</b> lo grabado en la ROM se lee de vuelta y se compara, byte a byte, con el guion en inglés — 653 entradas, cero divergencias."},"foto":"u2/02-creditos.png"}]},{"titulo":{"pt":"O que falta para sair do alfa","en":"What is left before it leaves alpha","es":"Lo que falta para salir del alfa"},"itens":[{"t":{"pt":"<b>Percorrer o jogo do começo ao fim.</b> A cobertura do texto foi medida por varredura, não por jogatina: a Terra dos Ultras, o cemitério de monstros e o final não foram vistos na tela.","en":"<b>Playing the game end to end.</b> Text coverage was measured by scanning, not by playing: the Land of Ultra, the monster graveyard and the ending have not been seen on screen.","es":"<b>Recorrer el juego de principio a fin.</b> La cobertura se midió por barrido, no jugando."}},{"t":{"pt":"Conferir na tela as <b>146
