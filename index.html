 compression at all.","It is the same engine as the rest of the Kunio-kun series, with the short, dense text it always had — and a title logo the clan redrew in Latin letters."],"es":["Kunio y dieciséis luchadores en un torneo callejero. Es el mismo motor del resto de la serie Kunio-kun, y el texto es corto y denso — 266 strings, sin compresión alguna.","Es el mismo motor del resto de la serie Kunio-kun, con el texto corto y denso que siempre tuvo — y un logo de título que el clan redibujó en latinas."]},"numeros":[{"v":"266","r":{"pt":"strings, todas traduzidas","en":"strings, all translated","es":"strings, todas traducidas"}},{"v":"81","r":{"pt":"tiles novos de fonte latina","en":"new Latin font tiles","es":"tiles nuevos de fuente latina"}},{"v":"175","r":{"pt":"tiles originais intactos","en":"original tiles untouched","es":"tiles originales intactos"}},{"v":"0","r":{"pt":"erros no validador","en":"errors in the validator","es":"errores en el validador"}}],"grupos":[{"titulo":{"pt":"O que já está provado","en":"What is already proved","es":"Lo que ya está probado"},"itens":[{"t":{"pt":"<b>Tradução completa</b> — 266 strings, revisadas linha a linha, com o validador em zero erro.","en":"<b>Translation complete</b> — 266 strings, reviewed line by line, with the validator at zero errors.","es":"<b>Traducción completa</b> — 266 strings, revisadas línea por línea, con el validador en cero errores."}},{"t":{"pt":"<b>Fonte latina completa</b>: a-z e pontuação, em 81 tiles novos, com <b>175 tiles originais intactos</b>.","en":"<b>Complete Latin font</b>: a-z and punctuation, in 81 new tiles, with <b>175 original tiles untouched</b>.","es":"<b>Fuente latina completa</b>: a-z y puntuación, en 81 tiles nuevos, con <b>175 tiles originales intactos</b>."}},{"t":{"pt":"<b>Inglês confirmado em jogo.</b> A build de teste abre com a primeira fala na fonte nova — não é simulação, é a ROM rodando.","en":"<b>English confirmed in game.</b> The test build opens with the first line in the new font — not a simulation, the ROM running.","es":"<b>Inglés confirmado en juego.</b> La build de prueba abre con la primera frase en la fuente nueva — no es simulación, es la ROM corriendo."},"foto":"nk/02-jogo.png"},{"t":{"pt":"<b>Logo do título redesenhado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, no lugar do japonês.","en":"<b>Title logo redrawn</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, in place of the Japanese.","es":"<b>Logo del título redibujado</b> — <code>NEKKETSU / FIGHTING LEGEND</code>, en lugar del japonés."},"foto":"nk/01-titulo.png"},{"t":{"pt":"A expansão de 128 para 256 KB está <b>provada</b>, e o motor de inserção tem guarda: uma build que só move o texto japonês sai idêntica à original.","en":"The expansion from 128 to 256 KB is <b>proved</b>, and the insertion engine has a guard: a build that only moves the Japanese text comes out identical to the original.","es":"La ampliación de 128 a 256 KB está <b>probada</b>, y el motor de inserción tiene guarda: una build que solo mueve el texto japonés sale idéntica a la original."}}]},{"titulo":{"pt":"O que falta","en":"What is left","es":"Lo que falta"},"itens":[{"t":{"pt":"<b>A senha em alfabeto latino.</b> Ela é digitada em hiragana, e a fonte nova tomou justamente os slots de kana — sem converter o teclado, a senha sai misturada.","en":"<b>The password in Latin letters.</b> It is typed in hiragana, and the new font took exactly the kana slots — without converting the keyboard, the password comes out mixed.","es":"<b>La contraseña en alfabeto latino.</b> Se escribe en hiragana, y la fuente nueva tomó justamente los slots de kana — sin convertir el teclado, la contraseña sale mezclada."}},{"t":{"pt":"Gráficos que ainda são japoneses: a carta de desafio, as quatro faixas de estilo, os nomes dos dezesseis lutadores na seleção e o cabeçalho da escolha de estágio.","en":"Graphics that are still Japanese: the challenge letter, the four style banners, the sixteen fighters’ names on the select screen and the stage-select header.","es":"Gráficos que siguen en japonés: la carta de desafío, las cuatro bandas de estilo, los nombres de los dieciséis luchadores en la selección y el encabezado de la elección de escenario."}}]}],"patch":{"versoes":{"en":null,"pt":null,"es":null},"rom":"Nekketsu Kakutou Densetsu (Japan).nes","rom_md5":"—"},"fotos":[{"f":"nk/01-titulo.png","t":{"pt":"Título redesenhado","en":"Redrawn title","es":"Título redibujado"},"c":{"pt":"<code>NEKKETSU / FIGHTING LEGEND</code> — o logo japonês refeito em latinas.","en":"<code>NEKKETSU / FIGHTING LEGEND</code> — the Japanese logo remade in Latin letters.","es":"<code>NEKKETSU / FIGHTING LEGEND</code> — el logo japonés rehecho en letras latinas."}},{"f":"nk/02-jogo.png","t":{"pt":"Inglês em jogo","en":"English in game","es":"Inglés en juego"},"c":{"pt":"A primeira fala na fonte nova, na ROM rodando: “The gates of Nekketsu High.”","en":"The first line in the new font, on the running ROM: “The gates of Nekketsu High.”","es":"La primera frase en la fuente nueva, en la ROM corriendo: “The gates of Nekketsu High.”"}}],"manual_pdf":{"en":null,"pt":null,"es":null}}],"posts":[{"date":"2026-09-06","build":"","tag":"Patch Clan","title_pt":"Os três patches, no ar","title_en":"The three patches are up","body_pt":["Famicom Jump II, Captain Tsubasa e Dragon Ball 3 têm agora patch IPS para baixar. O Famicom Jump II sai como lançamento; os outros dois como beta, com as pendências listadas na página de cada um.","Cada patch foi conferido do jeito que importa: aplicar o arquivo na ROM japonesa original e comparar o resultado, byte a byte, com a ROM que eu testei aqui. Os três batem."],"title_es":"Los tres parches ya están disponibles","body_es":["Famicom Jump II, Captain Tsubasa y Dragon Ball 3 ya tienen parche IPS para descargar. Famicom Jump II sale como lanzamiento; los otros dos como beta, con los puntos abiertos listados en la página de cada uno.","Cada parche se comprobó como importa: aplicar el archivo a la ROM japonesa original y comparar el resultado, byte a byte, con la ROM que probé aquí. Los tres coinciden."],"body_en":["Famicom Jump II, Captain Tsubasa and Dragon Ball 3 now have IPS patches to download. Famicom Jump II ships as a release; the other two as betas, with the open items listed on each page.","Every patch was checked the way that matters: apply the file to the original Japanese ROM and compare the result, byte for byte, against the ROM I actually tested here. All three match."]},{"date":"2026-09-05","build":"","tag":"Famicom Jump II","title_pt":"Um espírito vinha nomeando o herói errado desde 1991","title_en":"A spirit has been naming the wrong hero since 1991","body_pt":["Na abertura, o espírito diz que sete campeões foram escolhidos e nomeia os seis que faltam encontrar. Comece como Taison e ele manda você procurar o Taison. Comece como Goku e o Goku não é citado.","O código certo sempre esteve na ROM: um seletor de sete casos, com as sete variantes de texto gravadas. Ele nunca disparava porque o roteiro punha o número do herói no acumulador e a rotina chamada lia o registrador X. Dois bytes apontam a carga para o registrador certo. Seis das sete variantes não apareciam numa tela havia trinta e cinco anos."],"title_es":"Un espíritu llevaba nombrando al héroe equivocado desde 1991","body_es":["En la apertura, el espíritu dice que se han elegido siete campeones y nombra a los seis que faltan por encontrar. Empieza como Taison y te manda a buscar a Taison. Empieza como Goku y a Goku no lo nombra.","El código correcto estuvo siempre en la ROM: un selector de siete casos, con las siete variantes de texto escritas. Nunca disparaba porque el guion ponía el número del héroe en el acumulador y la rutina llamada lo leía del registro X. Dos bytes apuntan la carga al registro correcto. Seis de las siete variantes no habían aparecido en pantalla en treinta y cinco años."],"body_en":["In the opening, a spirit says seven champions have been chosen and names the six you still have to find. Start as Taison and it sends you off to go find Taison. Start as Goku and Goku is never named.","The correct code was in the ROM all along: a seven-way selector, with all seven text variants written. It never fired because the script loaded the hero number into the accumulator and the routine it called read it from X. Two bytes point the load at the right register. Six of the seven variants had not appeared on a screen in thirty-five years."]},{"date":"2026-09-04","build":"","tag":"Famicom Jump II","title_pt":"Seis bits por caractere não bastavam","title_en":"Six bits a character was not enough","body_pt":["Medido em tradução real, o inglês ocupa 1,51× os caracteres do japonês. O roteiro passava cerca de 20 KB do que o motor de fábrica segurava, num cartucho no teto do mapper e com zero bytes livres.","Em vez de cortar texto, troquei a compressão. Um Huffman de ordem 1, com a árvore escolhida pelo caractere anterior em 26 grupos de contexto, leva o texto de 6,25 para 3,90 bits por caractere. O decodificador tem 89 bytes de 6502 escritos à mão, e o roteiro fechou em 65,9 KB dentro de 68,1 KB."],"title_es":"Seis bits por carácter no bastaban","body_es":["Medido en traducción real, el inglés ocupa 1,51× los caracteres del japonés. El guion pasaba unos 20 KB de lo que el motor de fábrica aguantaba, en un cartucho en el techo del mapper y con cero bytes libres.","En vez de cortar texto, cambié la compresión. Un Huffman de orden 1, con el árbol elegido por el carácter anterior en 26 grupos de contexto, lleva el texto de 6,25 a 3,90 bits por carácter. El decodificador son 89 bytes de 6502 escritos a mano, y el guion cerró en 65,9 KB dentro de 68,1 KB."],"body_en":["Measured on the real translation, English runs 1.51× the character count of the Japanese. The script was about 20 KB over what the stock engine could hold, on a cartridge at the mapper ceiling with zero free bytes.","Rather than trim text, I replaced the compression. An order-1 Huffman coder, its tree picked by the previous character across 26 context groups, takes the script from 6.25 to 3.90 bits per character. The decoder is 89 bytes of hand-written 6502, and the script closed at 65.9 KB inside 68.1 KB."]},{"date":"2026-09-06","build":"","tag":"Captain Tsubasa","title_pt":"O Captain Tsubasa ganhou memória","title_en":"Captain Tsubasa gained a memory","body_pt":["O jogo de 1988 guarda progresso só por senha. Agora ele grava em bateria: salva ao abrir o SCORE MEMO do técnico e carrega no CONTINUE da tela de título.","Sem inventar formato de save. O estado guardado é exatamente o que a senha já carregava — os mesmos 24 bytes — e a integridade usa a mesma rotina que valida senha digitada. São 97 bytes de código novo, testados desligando e ligando de verdade, com dois processos de emulador e um arquivo de save real no meio."],"title_es":"Captain Tsubasa ganó memoria","body_es":["El juego de 1988 guarda el progreso solo por contraseña. Ahora graba con pila: guarda al abrir el SCORE MEMO del entrenador y carga en el CONTINUE de la pantalla de título.","Sin inventar formato de guardado. El estado almacenado es exactamente lo que la contraseña ya llevaba — los mismos 24 bytes — y la integridad usa la misma rutina que valida una contraseña escrita. Son 97 bytes de código nuevo, probados apagando y encendiendo de verdad, con dos procesos de emulador y un archivo de guardado real de por medio."],"body_en":["The 1988 game keeps progress by password only. Now it writes to battery-backed save: it saves when you open the coach’s SCORE MEMO and loads on CONTINUE at the title screen.","No save format was invented. The state stored is exactly what the password already carried — the same 24 bytes — and integrity checking uses the same routine that validates a typed password. It is 97 bytes of new code, tested by really powering off and on, with two emulator processes and a real save file in between."]},{"date":"2026-09-05","build":"","tag":"Dragon Ball 3","title_pt":"O kanji da carta não é texto","title_en":"The kanji on the card is not text","body_pt":["No Dragon Ball 3 você tira cartas, e cada carta traz um kanji dizendo o que ela faz. Esse kanji não é um caractere de fonte: é arte, um tile de 16×16 desenhado nos gráficos do cartucho. Não existe tabela para trocar.","Os dez viraram abreviações latinas — PCH, KCK, CMB, FIN, MAG, RUN, BDY, SPC, WPN — redesenhadas uma a uma. É por isso que a \"carta de kanji\" virou symbol card na tradução: depois de trocar o desenho, chamar de kanji seria mentira na tela."],"title_es":"El kanji de la carta no es texto","body_es":["En Dragon Ball 3 robas cartas, y cada carta lleva un kanji que dice lo que hace. Ese kanji no es un carácter de fuente: es ilustración, un tile de 16×16 dibujado en los gráficos del cartucho. No hay tabla para cambiarlo.","Los diez pasaron a ser abreviaturas latinas — PCH, KCK, CMB, FIN, MAG, RUN, BDY, SPC, WPN — redibujadas una a una. Por eso la \"carta de kanji\" pasó a ser symbol card en la traducción: una vez cambiado el dibujo, llamarlo kanji sería mentira en pantalla."],"body_en":["In Dragon Ball 3 you draw cards, and each card carries a kanji saying what it does. That kanji is not a font character: it is artwork, a 16×16 tile drawn into the cartridge graphics. There is no table to swap.","The ten became Latin abbreviations — PCH, KCK, CMB, FIN, MAG, RUN, BDY, SPC, WPN — redrawn one at a time. That is why the \"kanji card\" became a symbol card in the translation: once the drawing changed, calling it kanji would be a lie on screen."]}],"manuais":{"famicom-jump-2":{"slug":"famicom-jump-2","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Todo comando citado aqui é a palavra exata que está na tela — não é tradução do manual japonês, é o jogo que você vai jogar.","en":"This manual describes the game <b>as it appears in the English patch</b>. Every command named here is the exact word on screen — this is not a translation of the Japanese manual, it is the game you are going to play.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Todo comando citado aquí es la palabra exacta que está en pantalla — no es una traducción del manual japonés, es el juego que vas a jugar."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"fj2/05-espirito-jump-world.png","paras":{"pt":["O mundo dos mangás da Jump foi invadido. Um espírito chama você e diz que <b>sete campeões</b> foram escolhidos para enfrentar o que vem — e nomeia os seis que faltam encontrar, fechando com “e você também”.","Você começa com um dos sete e sai atrás dos outros. Antes disso, o patch acrescenta um <b>prólogo de cinco páginas</b> que conta o primeiro jogo de 1989 — quem nunca jogou o <i>Eiyuu Retsuden</i> não perde nada da história."],"en":["The world of the Jump manga has been invaded. A spirit calls you and says <b>seven champions</b> have been chosen to face what is coming — then names the six you still have to find, closing with “and you as well.”","You start as one of the seven and go looking for the others. Before that, the patch adds a <b>five-page prologue</b> recapping the 1989 first game — anyone who never played <i>Eiyuu Retsuden</i> misses nothing of the story."],"es":["El mundo de los mangas de la Jump ha sido invadido. Un espíritu te llama y dice que se han elegido <b>siete campeones</b> para enfrentar lo que viene — y nombra a los seis que faltan por encontrar, cerrando con “y tú también”.","Empiezas con uno de los siete y sales a buscar a los demás. Antes de eso, el parche añade un <b>prólogo de cinco páginas</b> que cuenta el primer juego de 1989 — quien nunca jugó <i>Eiyuu Retsuden</i> no se pierde nada."]}},{"id":"heroes","titulo":{"pt":"Os sete heróis","en":"The seven heroes","es":"Los siete héroes"},"paras":{"pt":["Sete séries da Weekly Shōnen Jump dividem o mesmo campo de batalha. <b>Três lutam por vez</b>; do quarto em diante, os que ficam de fora treinam e continuam ganhando experiência."],"en":["Seven Weekly Shōnen Jump series share one battlefield. <b>Three fight at a time</b>; from the fourth onward, whoever sits out trains and keeps earning experience."],"es":["Siete series de la Weekly Shōnen Jump comparten el mismo campo de batalla. <b>Tres luchan a la vez</b>; del cuarto en adelante, los que quedan fuera entrenan y siguen ganando experiencia."]},"lista":[{"k":"Goku","v":{"pt":"Dragon Ball","en":"Dragon Ball"}},{"k":"JoJo","v":{"pt":"JoJo's Bizarre Adventure — Jotaro Kujo","en":"JoJo's Bizarre Adventure — Jotaro Kujo"}},{"k":"Ryotsu","v":{"pt":"KochiKame — o policial","en":"KochiKame — the policeman"}},{"k":"Taruruto","v":{"pt":"Magical Taruruto-kun","en":"Magical Taruruto-kun"}},{"k":"Ta-chan","v":{"pt":"Jungle King Tar-chan","en":"Jungle King Tar-chan"}},{"k":"Momotaro","v":{"pt":"Sakigake!! Otokojuku","en":"Sakigake!! Otokojuku"}},{"k":"Taison","v":{"pt":"Rokudenashi Blues","en":"Rokudenashi Blues"}}]},{"id":"start","titulo":{"pt":"Começar a jogar","en":"Starting the game","es":"Empezar a jugar"},"foto":"fj2/02-creditos.png","paras":{"pt":["A tela de créditos do patch abre antes do título e sai sozinha em cinco segundos — <b>A</b> ou <b>START</b> pula na hora.","No título, <b><code>New Game</code></b> começa do zero e <b><code>Continue</code></b> carrega um dos três diários salvos. Ao começar, o jogo pede <b><code>Begin with</code></b>: é a escolha de qual dos sete heróis você controla primeiro. <b>Essa escolha muda a fala de abertura</b> — e é ela que estava quebrada no cartucho original desde 1991."],"en":["The patch credits screen opens before the title and clears itself in five seconds — <b>A</b> or <b>START</b> skips it immediately.","At the title, <b><code>New Game</code></b> starts fresh and <b><code>Continue</code></b> loads one of three saved diaries. On starting, the game asks <b><code>Begin with</code></b>: this is the choice of which of the seven heroes you control first. <b>That choice changes the opening speech</b> — and it is the thing that was broken in the original cartridge since 1991."],"es":["La pantalla de créditos del parche abre antes del título y se va sola en cinco segundos — <b>A</b> o <b>START</b> la salta al momento.","En el título, <b><code>New Game</code></b> empieza de cero y <b><code>Continue</code></b> carga uno de los tres diarios guardados. Al empezar, el juego pide <b><code>Begin with</code></b>: es la elección de cuál de los siete héroes controlas primero. <b>Esa elección cambia el discurso de apertura</b> — y es lo que estaba roto en el cartucho original desde 1991."]}},{"id":"field","titulo":{"pt":"No mapa","en":"On the map","es":"En el mapa"},"foto":"fj2/03-menu-ingles.png","paras":{"pt":["Você anda com a cruz direcional. Porta, escada e pegar item são <b>automáticos</b> — não existem comandos para isso.","<b>No patch, o botão B é ação coringa:</b> ele fala com quem estiver à frente e, não havendo ninguém, examina o chão sob os seus pés. É a mesma divisão que os dois comandos do menu fazem, num aperto só. Os comandos continuam no menu para quem preferir."],"en":["You walk with the D-pad. Doors, stairs and picking things up are <b>automatic</b> — there are no commands for them.","<b>In this patch, B is a wildcard action button:</b> it talks to whoever is in front of you and, when nobody is, examines the ground under your feet. It is the same split the two menu commands make, in a single press. The menu commands are still there for anyone who prefers them."],"es":["Caminas con la cruceta. Puertas, escaleras y recoger objetos son <b>automáticos</b> — no hay comandos para eso.","<b>En este parche, la B es un botón de acción comodín:</b> habla con quien tengas delante y, si no hay nadie, examina el suelo bajo tus pies. Es la misma división que hacen los dos comandos del menú, en una sola pulsación. Los comandos siguen en el menú para quien los prefiera."]},"lista":[{"k":"Talk","v":{"pt":"Conversa com o personagem à sua frente","en":"Talks to the character in front of you"}},{"k":"Look","v":{"pt":"Examina o lugar onde você está parado","en":"Examines the place you are standing on"}},{"k":"Item","v":{"pt":"Abre a mochila — <code>Use</code>, <code>Give</code>, <code>Drop</code>","en":"Opens the bag — <code>Use</code>, <code>Give</code>, <code>Drop</code>"}},{"k":"Stat","v":{"pt":"Mostra a ficha do herói: corações, atributos e nível","en":"Shows a hero’s card: hearts, stats and level"}},{"k":"Gear","v":{"pt":"Equipamento","en":"Equipment"}},{"k":"Plan","v":{"pt":"Salvar, velocidade de texto, ordem do grupo e diário","en":"Saving, text speed, party order and the diary"}}]},{"id":"battle","titulo":{"pt":"A batalha — o sistema S·A·S","en":"Battle — the S·A·S system","es":"El combate — el sistema S·A·S"},"paras":{"pt":["Não é um RPG de menu. O manual original chama o sistema de <b>S·A·S, Simulation Action System</b>, e ele é tático: a luta acontece <b>em cima do próprio cenário</b>, em tela cheia, sem janela de comando permanente e sem número de vida nenhum na tela.","<b>O turno é por lado:</b> o seu grupo inteiro age, depois os inimigos. Cada herói se move livremente dentro do <b>alcance</b> dele — e alcance é um atributo que <b>sobe de nível</b>, ao lado de ataque e defesa.","<b>Não existe passo de escolher alvo.</b> A mira é a posição: você ataca quem estiver ao alcance de onde você parou. Apertar <b>A</b> sozinho já ataca. O <b>B</b> cicla o balão entre atacar, defender, mover e <b><code>Special</code></b>, e o <b>A</b> confirma."],"en":["This is not a menu RPG. The original manual calls the system <b>S·A·S, Simulation Action System</b>, and it is tactical: the fight happens <b>on the scenery itself</b>, full screen, with no permanent command window and no health number anywhere.","<b>Turns are by side:</b> your whole party acts, then the enemies. Each hero moves freely within their own <b>range</b> — and range is a stat that <b>levels up</b>, alongside attack and defence.","<b>There is no target-selection step.</b> Aim is position: you attack whoever is within reach of where you stopped. Pressing <b>A</b> on its own already attacks. <b>B</b> cycles the balloon between attack, defend, move and <b><code>Special</code></b>, and <b>A</b> confirms."],"es":["No es un RPG de menú. El manual original llama al sistema <b>S·A·S, Simulation Action System</b>, y es táctico: la lucha ocurre <b>sobre el propio escenario</b>, a pantalla completa, sin ventana de comandos permanente y sin ningún número de vida.","<b>El turno es por bando:</b> actúa todo tu grupo, después los enemigos. Cada héroe se mueve libremente dentro de su <b>alcance</b> — y el alcance es un atributo que <b>sube de nivel</b>, junto al ataque y la defensa.","<b>No existe un paso de elegir objetivo.</b> La puntería es la posición: atacas a quien esté al alcance de donde te paraste. Pulsar <b>A</b> a secas ya ataca. La <b>B</b> cicla el globo entre atacar, defender, mover y <b><code>Special</code></b>, y la <b>A</b> confirma."]},"lista":[{"k":{"pt":"Vida","en":"Health"},"v":{"pt":"Contada em <b>corações</b>, não em números. Começa com cinco e sobe de nível.","en":"Counted in <b>hearts</b>, not numbers. You start with five, and they grow with levels."}},{"k":{"pt":"Cor do herói","en":"Hero colour"},"v":{"pt":"A cor <b>é</b> o estado: dois corações restantes fica roxo, um coração fica vermelho, envenenado fica azul.","en":"The colour <b>is</b> the state: two hearts left turns purple, one heart turns red, poisoned turns blue."}},{"k":"Special","v":{"pt":"O golpe especial custa <b>um coração</b> — não existe barra de magia.","en":"The special move costs <b>one heart</b> — there is no magic bar."}},{"k":{"pt":"Fugir","en":"Escaping"},"v":{"pt":"Não há comando: você <b>anda até a borda da tela</b>. Falhar dá <code>Enemy circled you!</code> — o inimigo cortou seu caminho. Alcance de movimento alto ajuda a escapar.","en":"There is no command: you <b>walk to the edge of the screen</b>. Failing gives <code>Enemy circled you!</code> — the enemy cut you off. A high movement range helps you get away."}},{"k":{"pt":"Derrota","en":"Defeat"},"v":{"pt":"Se o grupo inteiro cai, você volta ao Grande Santuário e perde <b>metade do dinheiro</b>. Se um herói sobreviver, todos são curados de graça.","en":"If the whole party falls you return to the Great Shrine and lose <b>half your money</b>. If one hero survives, everyone is healed for free."}}]},{"id":"stronger","titulo":{"pt":"Ficar mais forte","en":"Getting stronger","es":"Hacerse más fuerte"},"foto":"fj2/08-soulring.png","paras":{"pt":["Subir de nível aumenta os corações, o ataque, a defesa e o <b>alcance de movimento</b>. Não há barra de experiência na tela — o jogo avisa quando sobe.","Os heróis que <b>não estão no grupo ativo</b> não ficam parados: eles treinam e ganham experiência sozinhos. Trocar de favorito não custa nada, e é a razão pela qual vale recrutar todo mundo.","Dinheiro se chama <b><code>Zeni</code></b>. Nas lojas você usa <b><code>Buy</code></b> e <b><code>Sell</code></b>, e o jogo pergunta a quantidade em <b><code>Qty</code></b>."],"en":["Levelling raises hearts, attack, defence and <b>movement range</b>. There is no experience bar on screen — the game tells you when you go up.","Heroes <b>outside the active party</b> are not idle: they train and earn experience on their own. Switching favourites costs nothing, which is why recruiting everyone is worth it.","Money is called <b><code>Zeni</code></b>. In shops you use <b><code>Buy</code></b> and <b><code>Sell</code></b>, and the game asks how many in <b><code>Qty</code></b>."],"es":["Subir de nivel aumenta los corazones, el ataque, la defensa y el <b>alcance de movimiento</b>. No hay barra de experiencia en pantalla — el juego avisa cuando subes.","Los héroes <b>fuera del grupo activo</b> no están parados: entrenan y ganan experiencia solos. Cambiar de favorito no cuesta nada, y por eso vale la pena reclutar a todos.","El dinero se llama <b><code>Zeni</code></b>. En las tiendas usas <b><code>Buy</code></b> y <b><code>Sell</code></b>, y el juego pregunta la cantidad en <b><code>Qty</code></b>."]}},{"id":"save","titulo":{"pt":"Salvar, e a velocidade do texto","en":"Saving, and text speed","es":"Guardar, y la velocidad del texto"},"paras":{"pt":["Entre em <b><code>Plan</code></b> e escolha <b><code>Save</code></b>. Você pode salvar <b>em qualquer lugar do mapa</b> — a exceção são dungeons e o interior das cidades. São <b>três diários</b>, e <b><code>Diary</code></b> copia e apaga.","<b><code>Speed</code></b> ajusta a velocidade do texto. <code>Fast</code> e <code>Slow</code> são as pontas de uma escala de <b>oito níveis</b>, não as duas únicas opções — vale mexer nisso antes de encarar o roteiro inteiro.","<b><code>Order</code></b> muda a ordem do grupo, e é assim que você escolhe quais três dos sete entram na próxima luta."],"en":["Go into <b><code>Plan</code></b> and choose <b><code>Save</code></b>. You can save <b>anywhere on the overworld</b> — the exceptions are dungeons and the insides of towns. There are <b>three diaries</b>, and <b><code>Diary</code></b> copies and erases them.","<b><code>Speed</code></b> sets the text speed. <code>Fast</code> and <code>Slow</code> are the ends of an <b>eight-level</b> scale, not the only two options — worth setting before you take on the whole script.","<b><code>Order</code></b> changes the party order, and that is how you pick which three of the seven go into the next fight."],"es":["Entra en <b><code>Plan</code></b> y elige <b><code>Save</code></b>. Puedes guardar <b>en cualquier parte del mapa</b> — las excepciones son mazmorras e interiores de ciudad. Hay <b>tres diarios</b>, y <b><code>Diary</code></b> los copia y los borra.","<b><code>Speed</code></b> ajusta la velocidad del texto. <code>Fast</code> y <code>Slow</code> son los extremos de una escala de <b>ocho niveles</b>, no las dos únicas opciones — conviene ajustarlo antes de enfrentar el guion entero.","<b><code>Order</code></b> cambia el orden del grupo, y así eliges cuáles tres de los siete entran en la próxima pelea."]}},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"fj2/06-lista-sete-campeoes.png","paras":{"pt":["<b>A lista dos sete campeões está certa.</b> No cartucho original o espírito nomeia sempre os mesmos seis heróis, seja qual for o seu. Começar como Taison mandava você procurar o Taison; o Goku nunca era citado. O código correto já estava na ROM e nunca era executado. Aqui ele executa.","<b>Um prólogo de cinco páginas</b> foi acrescentado antes da primeira fala, recapitulando o jogo de 1989.","<b>O botão B virou ação coringa</b> no mapa, como descrito acima. Nada foi tirado: os comandos continuam no menu.","<b>Nada mais foi alterado.</b> Dificuldade, taxa de encontro, tabelas de item, economia e balanceamento são os de 1991. Esta é uma tradução, não um remaster."],"en":["<b>The champion list is correct.</b> In the original cartridge the spirit always names the same six heroes, whichever one is yours. Starting as Taison sent you off to find Taison; Goku was never named at all. The correct code was in the ROM and never ran. Here it runs.","<b>A five-page prologue</b> was added before the first line of dialogue, recapping the 1989 game.","<b>The B button became a wildcard action</b> on the map, as described above. Nothing was removed: the commands are still in the menu.","<b>Nothing else was changed.</b> Difficulty, encounter rate, item tables, economy and balance are the 1991 ones. This is a translation, not a remaster."],"es":["<b>La lista de los siete campeones es correcta.</b> En el cartucho original el espíritu nombra siempre a los mismos seis héroes, sea cual sea el tuyo. Empezar como Taison te mandaba a buscar a Taison; a Goku no lo nombraba nunca. El código correcto estaba en la ROM y no se ejecutaba. Aquí se ejecuta.","<b>Un prólogo de cinco páginas</b> se añadió antes de la primera línea de diálogo, recapitulando el juego de 1989.","<b>El botón B pasó a ser una acción comodín</b> en el mapa, como se describe arriba. No se quitó nada: los comandos siguen en el menú.","<b>Nada más fue alterado.</b> Dificultad, tasa de encuentros, tablas de objetos, economía y balance son los de 1991. Esto es una traducción, no un remaster."]}}]},"dragon-ball-3":{"slug":"dragon-ball-3","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Os símbolos das cartas citados aqui são as abreviações latinas que substituíram os kanji desenhados — é o que você vai ver na tela.","en":"This manual describes the game <b>as it appears in the English patch</b>. The card symbols named here are the Latin abbreviations that replaced the drawn kanji — they are what you will see on screen.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Los símbolos de las cartas citados aquí son las abreviaturas latinas que sustituyeron a los kanji dibujados — es lo que verás en pantalla."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"db3/04-dialogo.png","paras":{"pt":["Goku e Bulma têm apenas a Esfera de Quatro Estrelas e o Radar do Dragão. O jogo segue a saga desde a busca pelas esferas até o Torneio das Artes Marciais e o Rei Demônio Piccolo.","Você avança por um <b>tabuleiro</b>, tira cartas e luta com elas. Não é um RPG de menu: a carta decide quanto você anda, quem ataca primeiro e qual golpe sai."],"en":["Goku and Bulma have only the 4-Star Ball and the Dragon Radar. The game follows the saga from the search for the balls through the Martial Arts Tournament and King Piccolo.","You move across a <b>board</b>, draw cards and fight with them. This is not a menu RPG: the card decides how far you move, who attacks first, and which move comes out."],"es":["Goku y Bulma solo tienen la Bola de Cuatro Estrellas y el Radar del Dragón. El juego sigue la saga desde la búsqueda de las bolas hasta el Torneo de Artes Marciales y el Rey Demonio Piccolo.","Avanzas por un <b>tablero</b>, robas cartas y luchas con ellas. No es un RPG de menú: la carta decide cuánto te mueves, quién ataca primero y qué técnica sale."]}},{"id":"card","titulo":{"pt":"Como ler uma carta","en":"How to read a card","es":"Cómo leer una carta"},"foto":"db3/05-cartas.png","paras":{"pt":["<b>Esta é a peça central do jogo.</b> Fora do modo aventura, tudo é feito com cartas — e cada carta tem <b>três campos</b>, que servem para coisas diferentes."],"en":["<b>This is the heart of the game.</b> Outside adventure mode everything is done with cards — and every card has <b>three fields</b>, each used for something different."],"es":["<b>Esta es la pieza central del juego.</b> Fuera del modo aventura todo se hace con cartas — y cada carta tiene <b>tres campos</b>, cada uno para algo distinto."]},"lista":[{"k":{"pt":"Estrelas (1–7)","en":"Stars (1–7)","es":"Estrellas (1–7)"},"v":{"pt":"No tabuleiro, Goku anda <b>tantas casas quantas forem as estrelas</b>. Na batalha, <b>quem tem o número maior ataca</b>, e esse número também é a força do ataque. <b>Exceção que decide partidas: o 1 do Goku vence o 7 do inimigo.</b>","en":"On the board, Goku moves <b>as many squares as there are stars</b>. In battle, <b>the higher number attacks</b>, and that number is also the attack power. <b>The exception that decides fights: Goku’s 1 beats the enemy’s 7.</b>","es":"En el tablero, Goku avanza <b>tantas casillas como estrellas</b>. En combate, <b>ataca quien tenga el número mayor</b>, y ese número es también la fuerza del ataque. <b>La excepción que decide partidas: el 1 de Goku vence al 7 del enemigo.</b>"}},{"k":{"pt":"Símbolo","en":"Symbol","es":"Símbolo"},"v":{"pt":"Diz <b>qual golpe sai</b> quando você ataca. No original era um kanji desenhado; aqui é uma abreviação latina — a tabela está na próxima seção.","en":"Says <b>which move comes out</b> when you attack. In the original this was a drawn kanji; here it is a Latin abbreviation — the table is in the next section.","es":"Dice <b>qué técnica sale</b> cuando atacas. En el original era un kanji dibujado; aquí es una abreviatura latina — la tabla está en la sección siguiente."}},{"k":{"pt":"Número de defesa","en":"Defence number","es":"Número de defensa"},"v":{"pt":"De 1 a 7, é a <b>força de quem defende</b>. No original vinha em algarismo kanji (一 a 七) e é <b>coisa diferente do símbolo</b> — confundir os dois é o erro clássico neste jogo.","en":"From 1 to 7, this is <b>the defending side’s strength</b>. In the original it was written in kanji numerals (一 to 七) and it is <b>a different thing from the symbol</b> — mixing the two up is the classic mistake in this game.","es":"De 1 a 7, es <b>la fuerza de quien defiende</b>. En el original venía en numeral kanji (一 a 七) y es <b>algo distinto del símbolo</b> — confundir ambos es el error clásico de este juego."}}]},{"id":"symbols","titulo":{"pt":"Os dez símbolos","en":"The ten symbols","es":"Los diez símbolos"},"paras":{"pt":["Cada um destes era um <b>kanji desenhado à mão</b> num tile de 16×16. Não são texto e não existe tabela de caracteres para trocá-los: foram <b>redesenhados um a um</b> como abreviações latinas."],"en":["Each of these was a <b>hand-drawn kanji</b> in a 16×16 tile. They are not text and there is no character table to swap them: they were <b>redrawn one by one</b> as Latin abbreviations."],"es":["Cada uno de estos era un <b>kanji dibujado a mano</b> en un tile de 16×16. No son texto y no hay tabla de caracteres para cambiarlos: fueron <b>redibujados uno a uno</b> como abreviaturas latinas."]},"lista":[{"k":"PCH","v":{"pt":"拳 — soco","en":"拳 — punch","es":"拳 — puñetazo"}},{"k":"KCK","v":{"pt":"蹴 — chute","en":"蹴 — kick","es":"蹴 — patada"}},{"k":"CMB","v":{"pt":"連 — combo de socos e chutes","en":"連 — a combo of punches and kicks","es":"連 — combo de puñetazos y patadas"}},{"k":"FIN","v":{"pt":"必 — golpe especial, gasta pontos","en":"必 — special move, spends points","es":"必 — técnica especial, gasta puntos"}},{"k":"WPN","v":{"pt":"武 — arma: o Bastão Mágico","en":"武 — weapon: the Power Pole","es":"武 — arma: el Bastón Sagrado"}},{"k":"BDY","v":{"pt":"体 — investida com o corpo. <b>É ataque</b>, não defesa: foi o manual que corrigiu esta leitura no meio do projeto","en":"体 — a body slam. <b>It is an attack</b>, not a defence: the manual corrected this reading mid-project","es":"体 — embestida con el cuerpo. <b>Es ataque</b>, no defensa: el manual corrigió esta lectura a mitad del proyecto"}},{"k":"RUN","v":{"pt":"逃 — fugir da luta","en":"逃 — escape the fight","es":"逃 — huir del combate"}},{"k":"SPC","v":{"pt":"特 — técnica especial <b>do inimigo</b>","en":"特 — the <b>enemy’s</b> special technique","es":"特 — técnica especial <b>del enemigo</b>"}},{"k":"MAG","v":{"pt":"術 — magia <b>do inimigo</b>","en":"術 — the <b>enemy’s</b> magic","es":"術 — magia <b>del enemigo</b>"}}]},{"id":"hud","titulo":{"pt":"A tela","en":"The screen","es":"La pantalla"},"foto":"db3/07-mapa.png","paras":{"pt":["A barra de baixo mostra tudo o que importa, e não há tela de status separada no meio da luta."],"en":["The bottom bar shows everything that matters, and there is no separate status screen in the middle of a fight."],"es":["La barra inferior muestra todo lo que importa, y no hay pantalla de estado aparte en mitad del combate."]},"lista":[{"k":{"pt":"Vida","en":"Life","es":"Vida"},"v":{"pt":"Atual / máxima. A máxima sobe com o nível; a atual se recupera com comida e itens.","en":"Current / maximum. The maximum grows with level; the current is restored by food and items.","es":"Actual / máxima. La máxima sube con el nivel; la actual se recupera con comida y objetos."}},{"k":{"pt":"Pontos de especial","en":"Special points","es":"Puntos de especial"},"v":{"pt":"O que os golpes <code>FIN</code> gastam. Recupera com o livro de segredos.","en":"What <code>FIN</code> moves spend. Restored by the book of secrets.","es":"Lo que gastan las técnicas <code>FIN</code>. Se recupera con el libro de secretos."}},{"k":{"pt":"Treino","en":"Training","es":"Entrenamiento"},"v":{"pt":"Pontos ganhos em luta e em treino. Acumular sobe o <b>nível</b>.","en":"Points earned in fights and training. Accumulating them raises your <b>level</b>.","es":"Puntos ganados en combate y entrenamiento. Acumularlos sube el <b>nivel</b>."}},{"k":{"pt":"Nível","en":"Level","es":"Nivel"},"v":{"pt":"Aumenta <b>Speed, Power, Technique e Toughness</b> — e com eles a força do ataque e da defesa.","en":"Raises <b>Speed, Power, Technique and Toughness</b> — and with them attack and defence strength.","es":"Aumenta <b>Speed, Power, Technique y Toughness</b> — y con ellos la fuerza de ataque y defensa."}}]},{"id":"training","titulo":{"pt":"Os três treinos","en":"The three trainings","es":"Los tres entrenamientos"},"paras":{"pt":["Treinar é um jogo de cartas contra um mestre, e <b>cada mestre compara um campo diferente</b> da carta. Saber qual é qual é a diferença entre treinar e perder tempo."],"en":["Training is a card game against a master, and <b>each master compares a different field</b> of the card. Knowing which is which is the difference between training and wasting time."],"es":["Entrenar es un juego de cartas contra un maestro, y <b>cada maestro compara un campo distinto</b> de la carta. Saber cuál es cuál es la diferencia entre entrenar y perder el tiempo."]},"lista":[{"k":"Roshi","v":{"pt":"Compara as <b>estrelas</b>","en":"Compares the <b>stars</b>","es":"Compara las <b>estrellas</b>"}},{"k":"Korin","v":{"pt":"Compara o <b>número de defesa</b>","en":"Compares the <b>defence number</b>","es":"Compara el <b>número de defensa</b>"}},{"k":"Mr.Popo","v":{"pt":"Compara <b>os três campos</b> — estrelas, número de defesa e símbolo. É o treino mais duro e o que mais rende.","en":"Compares <b>all three fields</b> — stars, defence number and symbol. The hardest training, and the one that pays most.","es":"Compara <b>los tres campos</b> — estrellas, número de defensa y símbolo. El entrenamiento más duro y el que más rinde."}}]},{"id":"adventure","titulo":{"pt":"Modo aventura","en":"Adventure mode","es":"Modo aventura"},"foto":"db3/03-menu.png","paras":{"pt":["É o único modo sem cartas. Dentro de vilas e cenários você usa comandos para investigar e conversar. As mensagens cabem em <b>três linhas por vinte e quatro colunas</b> — o jogo não tem código de \"continua na próxima caixa\", e é por isso que a tradução foi comprimida onde precisou."],"en":["This is the only mode without cards. Inside towns and locations you use commands to investigate and talk. Messages fit in <b>three lines by twenty-four columns</b> — the game has no \"continues in the next box\" code, which is why the translation was compressed where it had to be."],"es":["Es el único modo sin cartas. Dentro de pueblos y escenarios usas comandos para investigar y hablar. Los mensajes caben en <b>tres líneas por veinticuatro columnas</b> — el juego no tiene código de \"continúa en la siguiente caja\", y por eso la traducción se comprimió donde hizo falta."]}},{"id":"help","titulo":{"pt":"Cartas de ajuda e itens","en":"Help cards and items","es":"Cartas de ayuda y objetos"},"paras":{"pt":["Além das cartas de ataque existem <b>dezesseis cartas de ajuda</b>, cada uma com um personagem que faz uma coisa: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> e <b>Baba</b>.","Os itens curam, protegem ou transportam — comida, o casco de tartaruga, a roupa pesada de treino, o feijão mágico, a Nuvem Voadora e o livro de segredos que devolve os pontos de especial."],"en":["Besides the attack cards there are <b>sixteen help cards</b>, each a character who does one thing: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> and <b>Baba</b>.","Items heal, protect or carry you — food, the turtle shell, the heavy training gi, the magic bean, the Flying Nimbus, and the book of secrets that gives special points back."],"es":["Además de las cartas de ataque hay <b>dieciséis cartas de ayuda</b>, cada una con un personaje que hace una cosa: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> y <b>Baba</b>.","Los objetos curan, protegen o transportan — comida, el caparazón de tortuga, el gi de entrenamiento pesado, la judía mágica, la Nube Voladora y el libro de secretos que devuelve los puntos de especial."]}},{"id":"password","titulo":{"pt":"A senha","en":"The password","es":"La contraseña"},"foto":"db3/06-senha.png","paras":{"pt":["O jogo não tem bateria: o progresso volta por <b>senha</b>, escolhida em <code>CONTINUE</code>. A grade agora é de letras latinas, maiúsculas e minúsculas, sem símbolos que se confundam.","<b>As senhas antigas continuam valendo.</b> Se você tem uma anotada desde 1989, pode digitá-la aqui — a codificação não foi mexida, só o desenho das teclas."],"en":["The game has no battery: progress comes back by <b>password</b>, chosen at <code>CONTINUE</code>. The grid is now Latin letters, upper and lower case, with no symbols that can be confused.","<b>Old passwords still work.</b> If you have one written down since 1989, you can type it in here — the encoding was not touched, only the drawing of the keys."],"es":["El juego no tiene pila: el progreso vuelve por <b>contraseña</b>, elegida en <code>CONTINUE</code>. La rejilla ahora es de letras latinas, mayúsculas y minúsculas, sin símbolos que se confundan.","<b>Las contraseñas antiguas siguen valiendo.</b> Si tienes una anotada desde 1989, puedes escribirla aquí — la codificación no se tocó, solo el dibujo de las teclas."]}},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"db3/01-titulo.png","paras":{"pt":["<b>O título</b> 悟空伝 foi redesenhado como <code>LEGEND OF GOKU</code>, dentro dos mesmos 96×32 pixels de arte.","<b>Os dez símbolos de carta e os seis números de defesa</b> eram desenhos, não texto, e foram redesenhados. É por isso que a \"carta de kanji\" virou <b>symbol card</b> na tradução: depois de trocar o desenho, chamar de kanji seria mentira na tela.","<b>Uma tela de créditos do patch</b> abre antes do título e sai com A ou START.","<b>Cinco mensagens de batalha continuam em japonês de propósito.</b> Elas carregam um número no meio, disfarçado de espaço, e ainda não está medido se o jogo o posiciona por deslocamento fixo. Encurtar o texto em inglês antes de saber disso poria o número no meio de uma palavra — trocaria um defeito legível por um ilegível."],"en":["<b>The title</b> 悟空伝 was redrawn as <code>LEGEND OF GOKU</code>, inside the same 96×32 pixels of artwork.","<b>The ten card symbols and the six defence numbers</b> were drawings, not text, and were redrawn. That is why the \"kanji card\" became a <b>symbol card</b> in the translation: once the drawing changed, calling it kanji would be a lie on screen.","<b>A patch credits screen</b> opens before the title and clears with A or START.","<b>Five battle messages are still in Japanese on purpose.</b> They carry a number in the middle, disguised as a space, and it is not yet measured whether the game places it by fixed offset. Shortening the English before knowing that would put the number in the middle of a word — trading a legible defect for an illegible one."],"es":["<b>El título</b> 悟空伝 fue redibujado como <code>LEGEND OF GOKU</code>, dentro de los mismos 96×32 píxeles de ilustración.","<b>Los diez símbolos de carta y los seis números de defensa</b> eran dibujos, no texto, y fueron redibujados. Por eso la \"carta de kanji\" pasó a ser <b>symbol card</b> en la traducción: una vez cambiado el dibujo, llamarlo kanji sería mentira en pantalla.","<b>Una pantalla de créditos del parche</b> abre antes del título y se salta con A o START.","<b>Cinco mensajes de combate siguen en japonés a propósito.</b> Llevan un número en medio, disfrazado de espacio, y todavía no está medido si el juego lo coloca por desplazamiento fijo. Acortar el inglés sin saberlo pondría el número en mitad de una palabra — cambiaría un defecto legible por uno ilegible."]}}]},"captain-tsubasa":{"slug":"captain-tsubasa","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Todo comando e todo atributo citado aqui é a palavra exata que está na tela.","en":"This manual describes the game <b>as it appears in the English patch</b>. Every command and every stat named here is the exact word on screen.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Todo comando y todo atributo citado aquí es la palabra exacta que está en pantalla."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"ct/01-titulo.png","paras":{"pt":["Você comanda o <b>Nankatsu</b> de Tsubasa Ozora pelo campeonato nacional de escolas, e depois pela seleção japonesa Jr. Youth. Cada adversário é um time real do mangá, com os craques e os golpes deles.","A campanha vai da fase de grupos às oitavas, quartas, semifinal e final — e o técnico avisa antes de cada jogo o que esperar do próximo adversário."],"en":["You manage Tsubasa Ozora’s <b>Nankatsu</b> through the national schools championship, and then the Japanese Jr. Youth side. Every opponent is a real team from the manga, with their aces and their signature moves.","The run goes from the group stage to the last 16, the quarters, the semi-final and the final — and the coach tells you before each match what to expect from the next opponent."],"es":["Diriges al <b>Nankatsu</b> de Tsubasa Ozora por el campeonato nacional escolar, y después a la selección japonesa Jr. Youth. Cada rival es un equipo real del manga, con sus cracks y sus técnicas.","La campaña va de la fase de grupos a octavos, cuartos, semifinal y final — y el entrenador avisa antes de cada partido qué esperar del siguiente rival."]}},{"id":"two","titulo":{"pt":"Dois jogos num só","en":"Two games in one","es":"Dos juegos en uno"},"foto":"ct/02-sala.png","paras":{"pt":["<b>Fora de campo</b> o jogo é uma aventura: você anda por cenários, conversa e procura gente. É assim que Misaki é encontrado em Paris, com os comandos <code>Move</code>, <code>Ask</code>, <code>Look</code> e <code>Quit</code>.","<b>Em campo</b> o jogo vira outra coisa. Você não controla o chute: escolhe a ação e vê a animação decidir. É futebol por menu, e foi este jogo que o inventou.","Na sala do técnico você escolhe <code>SCOUT</code> para saber do adversário, <code>MEMO</code> para anotar a senha e <code>PLAY</code> para começar a partida."],"en":["<b>Off the pitch</b> the game is an adventure: you walk around locations, talk and look for people. That is how Misaki is found in Paris, with the commands <code>Move</code>, <code>Ask</code>, <code>Look</code> and <code>Quit</code>.","<b>On the pitch</b> the game becomes something else. You do not control the shot: you pick the action and watch the animation decide. This is menu football, and this is the game that invented it.","In the coach’s room you pick <code>SCOUT</code> to hear about the opponent, <code>MEMO</code> to write down your password, and <code>PLAY</code> to start the match."],"es":["<b>Fuera del campo</b> el juego es una aventura: recorres escenarios, hablas y buscas gente. Así se encuentra a Misaki en París, con los comandos <code>Move</code>, <code>Ask</code>, <code>Look</code> y <code>Quit</code>.","<b>En el campo</b> el juego se convierte en otra cosa. No controlas el disparo: eliges la acción y ves cómo la animación decide. Es fútbol por menú, y fue este juego quien lo inventó.","En la sala del entrenador eliges <code>SCOUT</code> para saber del rival, <code>MEMO</code> para anotar la contraseña y <code>PLAY</code> para empezar el partido."]}},{"id":"match","titulo":{"pt":"Durante a partida","en":"During a match","es":"Durante el partido"},"foto":"ct/05-jogo.png","paras":{"pt":["Quando a bola é sua, o jogo pergunta <b><code>Action?</code></b> e para. À direita fica a ficha de quem está com a bola — posição, nome e os atributos que importam naquele instante.","À esquerda ficam o <b>relógio</b> e o <b>placar</b>, com os dois times abreviados em quatro letras. A partida corre em tempo de jogo: cada ação consome segundos do relógio.","A <b>narradora</b> comenta cada lance numa caixa de fala. No original essa caixa tinha uma fileira de texto por linha de roteiro; neste patch são <b>duas</b>, o que é o que permite a narração em inglês caber sem virar telegrama."],"en":["When the ball is yours, the game asks <b><code>Action?</code></b> and stops. On the right is the card of whoever has the ball — position, name, and the stats that matter at that moment.","On the left are the <b>clock</b> and the <b>score</b>, with both sides abbreviated to four letters. The match runs on game time: every action spends seconds off the clock.","The <b>commentator</b> calls each play in a speech box. In the original that box held one row of text per script line; in this patch it holds <b>two</b>, which is what lets English commentary fit without turning into a telegram."],"es":["Cuando la pelota es tuya, el juego pregunta <b><code>Action?</code></b> y se detiene. A la derecha está la ficha de quien lleva el balón — posición, nombre y los atributos que importan en ese instante.","A la izquierda están el <b>reloj</b> y el <b>marcador</b>, con ambos equipos abreviados en cuatro letras. El partido corre en tiempo de juego: cada acción consume segundos del reloj.","La <b>narradora</b> comenta cada jugada en un bocadillo. En el original ese bocadillo tenía una fila de texto por línea de guion; en este parche tiene <b>dos</b>, que es lo que permite que la narración en inglés quepa sin volverse telegrama."]}},{"id":"guts","titulo":{"pt":"Guts — o recurso que decide tudo","en":"Guts — the resource that decides everything","es":"Guts — el recurso que lo decide todo"},"paras":{"pt":["<b>Guts é a coisa mais importante do jogo.</b> Cada jogador tem uma reserva, e <b>toda ação gasta</b>: driblar, passar, chutar, desarmar, cortar. Quanto mais Guts você põe num lance, maior a chance de ele dar certo.","Quando acaba, o jogo diz <b><code>Not enough Guts!!</code></b> e a jogada não sai. Um craque sem Guts perde a bola para um zagueiro comum — e é por isso que o jogo é de administração, não de reflexo.","Guts não volta durante o tempo. Gastar tudo no primeiro tempo é como se perde uma final."],"en":["<b>Guts is the most important thing in the game.</b> Every player has a reserve, and <b>every action spends it</b>: dribbling, passing, shooting, tackling, cutting. The more Guts you put into a play, the better its chance of coming off.","When it runs out, the game says <b><code>Not enough Guts!!</code></b> and the play does not happen. An ace with no Guts loses the ball to an ordinary defender — which is why this is a game of management, not reflexes.","Guts does not come back during play. Spending it all in the first half is how finals are lost."],"es":["<b>Guts es lo más importante del juego.</b> Cada jugador tiene una reserva, y <b>toda acción la gasta</b>: regatear, pasar, disparar, entrar, cortar. Cuanto más Guts pongas en una jugada, mayor su probabilidad de salir bien.","Cuando se acaba, el juego dice <b><code>Not enough Guts!!</code></b> y la jugada no sale. Un crack sin Guts pierde el balón ante un defensa cualquiera — y por eso este es un juego de gestión, no de reflejos.","El Guts no se recupera durante el tiempo de juego. Gastarlo todo en la primera parte es como se pierden las finales."]}},{"id":"card","titulo":{"pt":"A ficha do jogador","en":"The player card","es":"La ficha del jugador"},"foto":"ct/04-ficha.png","paras":{"pt":["Cada jogador tem um nível e sete números. Ganhar partidas sobe o nível de todo o elenco — o técnico avisa: <i>“Well done, men! You have all leveled up.”</i>"],"en":["Every player has a level and seven numbers. Winning matches raises the whole squad — the coach says so: <i>“Well done, men! You have all leveled up.”</i>"],"es":["Cada jugador tiene un nivel y siete números. Ganar partidos sube el nivel de toda la plantilla — el entrenador lo dice: <i>“Well done, men! You have all leveled up.”</i>"]},"lista":[{"k":"Level","v":{"pt":"O nível do jogador. Sobe ao vencer.","en":"The player’s level. It rises when you win.","es":"El nivel del jugador. Sube al ganar."}},{"k":"Max Guts","v":{"pt":"O tanque cheio de Guts daquele jogador — o teto do que ele pode gastar numa partida.","en":"That player’s full Guts tank — the ceiling on what he can spend in a match.","es":"El depósito lleno de Guts de ese jugador — el techo de lo que puede gastar en un partido."}},{"k":"Run","v":{"pt":"Drible: passar pelo marcador com a bola.","en":"Dribbling: getting past your marker with the ball.","es":"Regate: superar al marcador con el balón."}},{"k":"Pass","v":{"pt":"Passe: fazer a bola chegar a quem você quer.","en":"Passing: getting the ball to who you meant.","es":"Pase: hacer que el balón llegue a quien quieres."}},{"k":"Shoot","v":{"pt":"Chute a gol.","en":"Shooting at goal.","es":"Disparo a puerta."}},{"k":"Steal","v":{"pt":"Desarme: tomar a bola de quem a tem.","en":"Tackling: taking the ball off whoever has it.","es":"Entrada: quitarle el balón a quien lo tiene."}},{"k":"Cut","v":{"pt":"Corte: interceptar um passe no caminho.","en":"Cutting: intercepting a pass in flight.","es":"Corte: interceptar un pase en el camino."}},{"k":"Mark","v":{"pt":"Marcação: grudar no homem e tirar o espaço dele.","en":"Marking: sticking to your man and taking his space away.","es":"Marcaje: pegarte a tu hombre y quitarle el espacio."}}]},{"id":"moves","titulo":{"pt":"Os golpes especiais","en":"The special moves","es":"Las técnicas especiales"},"paras":{"pt":["Cada craque tem um golpe próprio, que custa muito Guts e vale a pena quando vai decidir. Eles são do mangá, e o adversário também os tem — o técnico avisa qual esperar."],"en":["Every ace has a move of their own, which costs a lot of Guts and is worth it when it decides something. They come from the manga, and the opposition has them too — the coach tells you which to expect."],"es":["Cada crack tiene una técnica propia, que cuesta mucho Guts y vale la pena cuando va a decidir. Vienen del manga, y el rival también las tiene — el entrenador avisa cuál esperar."]},"lista":[{"k":"Drive Shot","v":{"pt":"O chute do Tsubasa, com a bola descendo no fim.","en":"Tsubasa’s shot, with the ball dipping at the end.","es":"El disparo de Tsubasa, con el balón cayendo al final."}},{"k":"Overhead Kick","v":{"pt":"A bicicleta do Tsubasa.","en":"Tsubasa’s bicycle kick.","es":"La chilena de Tsubasa."}},{"k":"Tiger Shot","v":{"pt":"O petardo do Hyuga — o chute mais forte do torneio.","en":"Hyuga’s cannon — the hardest shot in the tournament.","es":"El cañonazo de Hyuga — el disparo más fuerte del torneo."}},{"k":"Razor Shot","v":{"pt":"O chute rasteiro do Soda, o “matador de craques”.","en":"Soda’s low shot — he is called the Ace Killer.","es":"El disparo raso de Soda, el “matador de cracks”."}},{"k":"Twin Shot","v":{"pt":"O chute a dois dos gêmeos Tachibana.","en":"The Tachibana twins’ two-man shot.","es":"El disparo a dos de los gemelos Tachibana."}},{"k":"Skylab Hurricane","v":{"pt":"A jogada aérea dos gêmeos, um subindo no outro.","en":"The twins’ aerial move, one launching off the other.","es":"La jugada aérea de los gemelos, uno subiendo sobre el otro."}},{"k":"Diving Header","v":{"pt":"O cabeceio mergulhado do Izawa, do Oda e do Takei.","en":"The diving header of Izawa, Oda and Takei.","es":"El cabezazo en plancha de Izawa, Oda y Takei."}},{"k":"Face Block","v":{"pt":"A defesa de cara do Ishizaki, o “gutsman” do time.","en":"Ishizaki’s face block — he is the team’s gutsman.","es":"El bloqueo con la cara de Ishizaki, el “gutsman” del equipo."}}]},{"id":"save","titulo":{"pt":"Guardar o progresso","en":"Keeping your progress","es":"Guardar el progreso"},"foto":"ct/07-memo.png","paras":{"pt":["O jogo de 1988 guarda progresso por <b>senha</b>. Abra o <code>SCORE MEMO</code> na sala do técnico e a Sanae dita a sua — a grade agora é de letras latinas, maiúsculas, minúsculas e algarismos, e a senha gerada passa pela rotina de validação original do jogo.","<b>Neste patch o jogo também grava em bateria.</b> Ele salva no mesmo instante em que mostra a senha, e carrega no <code>CONTINUE</code> da tela de título. Não é um save novo: é exatamente o que a senha já guardava, escrito na memória do cartucho.","Com um save presente, <b>segurar B no <code>CONTINUE</code></b> abre a tela de senha mesmo assim. <code>KICK OFF</code> começa jogo novo e <b>não apaga</b> o que estava salvo."],"en":["The 1988 game keeps progress by <b>password</b>. Open <code>SCORE MEMO</code> in the coach’s room and Sanae reads yours out — the grid is now Latin capitals, lower case and digits, and the generated password passes the game’s own validation routine.","<b>In this patch the game also writes to battery.</b> It saves at the very moment it shows you the password, and loads on <code>CONTINUE</code> at the title screen. This is not a new save: it is exactly what the password already carried, written into the cartridge’s memory.","With a save present, <b>holding B on <code>CONTINUE</code></b> opens the password screen anyway. <code>KICK OFF</code> starts a new game and <b>does not erase</b> what was saved."],"es":["El juego de 1988 guarda el progreso por <b>contraseña</b>. Abre <code>SCORE MEMO</code> en la sala del entrenador y Sanae te dicta la tuya — la rejilla ahora es de letras latinas, mayúsculas, minúsculas y cifras, y la contraseña generada pasa por la rutina de validación original del juego.","<b>En este parche el juego también graba con pila.</b> Guarda en el mismo instante en que muestra la contraseña, y carga en el <code>CONTINUE</code> de la pantalla de título. No es un guardado nuevo: es exactamente lo que la contraseña ya llevaba, escrito en la memoria del cartucho.","Con una partida guardada, <b>mantener B en <code>CONTINUE</code></b> abre la pantalla de contraseña igualmente. <code>KICK OFF</code> empieza partida nueva y <b>no borra</b> lo guardado."]}},{"id":"options","titulo":{"pt":"Opções","en":"Options","es":"Opciones"},"paras":{"pt":["O patch acrescenta um menu de opções com duas coisas que mudam muito como o jogo se lê."],"en":["The patch adds an options menu with two things that change a lot about how the game reads."],"es":["El parche añade un menú de opciones con dos cosas que cambian mucho cómo se lee el juego."]},"lista":[{"k":"Text speed","v":{"pt":"Cinco velocidades: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> e <code>Full</code>. A última põe a frase inteira na tela de uma vez.","en":"Five speeds: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> and <code>Full</code>. The last one puts the whole line on screen at once.","es":"Cinco velocidades: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> y <code>Full</code>. La última pone la frase entera de golpe."}},{"k":"Narration","v":{"pt":"Liga e desliga o comentário jogada a jogada. Desligado, a partida corre bem mais rápido.","en":"Turns the play-by-play commentary on and off. With it off, the match runs a good deal faster.","es":"Activa y desactiva el comentario jugada a jugada. Desactivado, el partido corre bastante más rápido."}}]},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"ct/08-save.png","paras":{"pt":["<b>Save com bateria</b>, descrito acima. O jogo original não tinha nenhum.","<b>Duas fileiras de texto por linha de roteiro</b> na narração da partida — de 14 e 18 colunas para 28 e 36.","<b>Menu de opções</b> com velocidade de texto e narração.","<b>Logo do título redesenhado</b>, e o logo pequeno da sala de aula também.","<b>Uma fonte inglesa inteira</b>: no cartucho existiam dezesseis letras latinas, e as outras foram desenhadas do zero.","<b>Isto é uma beta.</b> Faltam a tela de créditos e a tela de erro de senha, e a lista de nomes do final ainda precisa mudar de coluna. Nada disso impede jogar a campanha inteira."],"en":["<b>Battery save</b>, described above. The original game had none.","<b>Two rows of text per script line</b> in match commentary — from 14 and 18 columns to 28 and 36.","<b>An options menu</b> with text speed and narration.","<b>The title logo redrawn</b>, and the small classroom logo with it.","<b>A whole English font</b>: the cartridge held sixteen Latin letters, and the rest were drawn from nothing.","<b>This is a beta.</b> The credits screen and the password-error screen are still missing, and the ending name list has yet to move a column. None of that stops you playing the whole campaign."],"es":["<b>Guardado con pila</b>, descrito arriba. El juego original no tenía ninguno.","<b>Dos filas de texto por línea de guion</b> en la narración del partido — de 14 y 18 columnas a 28 y 36.","<b>Un menú de opciones</b> con velocidad de texto y narración.","<b>El logo del título redibujado</b>, y el logo pequeño del aula con él.","<b>Una fuente inglesa entera</b>: en el cartucho había dieciséis letras latinas, y las demás se dibujaron de la nada.","<b>Esto es una beta.</b> Faltan la pantalla de créditos y la de error de contraseña, y la lista de nombres del final aún debe cambiar de columna. Nada de eso impide jugar la campaña entera."]}}]}}}</script>

<script>
(function(){
  'use strict';
  var CFG = window.PATCHCLAN_CONFIG || null;
  var D = JSON.parse(document.getElementById('seed').textContent);
  var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MESES_ES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var LANG_ATTR = { en:'en', pt:'pt-BR', es:'es' };

  function e(s){ return s == null ? '' : String(s); }
  function L(par){
    if (!par) return '';
    if (typeof par === 'string') par = { en: par };
    var v = { en: par.en || par.pt || par.es, pt: par.pt || par.en || par.es, es: par.es || par.en || par.pt };
    return ['en','pt','es'].map(function(l){
      return '<span class="'+l+'" lang="'+LANG_ATTR[l]+'">'+e(v[l])+'</span>';
    }).join('');
  }
  function txt(par, l){                      /* uma língua só, para atributos */
    if (!par) return '';
    if (typeof par === 'string') return par;
    return e(par[l] || par.en || par.pt || par.es);
  }
  function pix(l){ return l.join('').split('').map(function(c){ return c==='#'?'<i class="on"></i>':'<i></i>'; }).join(''); }
  var T_MARK=['...##...','..#..#..','.#....#.','##....##','##....##','.#....#.','..#..#..','...##...'];
  function jogo(slug){ return (D.games||[]).filter(function(g){ return g.slug===slug; })[0]; }
  /* prints por idioma: quem le em portugues ve a tela em portugues.
     SHOTS_IDI mapeia o print base -> a variante daquele idioma; sem variante, cai no base. */
  var SHOTS_IDI = {"pt":{"ct/01-titulo.png":"ct/pt/01-titulo.png","ct/02-sala.png":"ct/pt/02-sala.png","ct/03-narrador.png":"ct/pt/03-narrador.png","ct/04-ficha.png":"ct/pt/04-ficha.png","ct/05-jogo.png":"ct/pt/05-jogo.png","ct/06-senha.png":"ct/pt/06-senha.png","ct/08-save.png":"ct/pt/08-save.png","fj2/02-creditos.png":"fj2/pt/02-creditos.png","fj2/03-menu-ingles.png":"fj2/pt/03-menu-ingles.png","fj2/04-prologo-novo.png":"fj2/pt/04-prologo-novo.png","fj2/05-espirito-jump-world.png":"fj2/pt/05-espirito-jump-world.png","fj2/06-lista-sete-campeoes.png":"fj2/pt/06-lista-sete-campeoes.png","fj2/07-e-voce-tambem-goku.png":"fj2/pt/07-e-voce-tambem-goku.png","fj2/08-soulring.png":"fj2/pt/08-soulring.png"},"es":{"fj2/02-creditos.png":"fj2/es/02-creditos.png","fj2/03-menu-ingles.png":"fj2/es/03-menu-ingles.png","fj2/04-prologo-novo.png":"fj2/es/04-prologo-novo.png","fj2/05-espirito-jump-world.png":"fj2/es/05-espirito-jump-world.png","fj2/06-lista-sete-campeoes.png":"fj2/es/06-lista-sete-campeoes.png","fj2/07-e-voce-tambem-goku.png":"fj2/es/07-e-voce-tambem-goku.png","fj2/08-soulring.png":"fj2/es/08-soulring.png"}};
  var LANG_ATUAL = 'en';
  function img(f, l){
    if (!f) return '';
    var m = SHOTS_IDI[l || LANG_ATUAL];
    if (m && m[f]) f = m[f];
    return (f.slice(0,5) === 'data:') ? f : 'shots/' + e(f);
  }
  /* data-shot guarda o print base: a troca de idioma e so CSS, entao o src se repinta a mao */
  function foto(f, alt, carga){
    return '<img src="'+img(f)+'" data-shot="'+e(f)+'" alt="'+e(alt)+'" loading="'+(carga||'lazy')+'">';
  }
  function repintaFotos(){
    var ns = document.querySelectorAll('img[data-shot]');
    for (var i = 0; i < ns.length; i++) {
      var s = img(ns[i].getAttribute('data-shot'));
      if (ns[i].getAttribute('src') !== s) ns[i].setAttribute('src', s);
    }
  }
  function crt(src, alt){ return '<div class="crt">'+foto(src, alt)+'</div>'; }
  function data(iso){
    var d = String(iso).split('-'), n = +d[2], m = +d[1]-1;
    return { pt: d[2]+' '+MESES[m]+' '+d[0], en: n+' '+MONTHS[m]+' '+d[0], es: d[2]+' '+MESES_ES[m]+' '+d[0] };
  }
  var IDI = [['en','🇺🇸',{en:'English',pt:'Inglês',es:'Inglés'}],
             ['pt','🇧🇷',{en:'Portuguese',pt:'Português',es:'Portugués'}],
             ['es','🇪🇸',{en:'Spanish',pt:'Espanhol',es:'Español'}]];
  /* grade de download por idioma: o que não existe fica esmaecido */
  function gradeIdiomas(versoes, pasta, tipo){
    return '<div class="patches">' + IDI.map(function(x){
      var v = (versoes||{})[x[0]];
      var cab = '<div class="idi"><span class="fl" aria-hidden="true">'+x[1]+'</span>'+L(x[2])+'</div>';
      if (!v) {
        return '<div class="pt-item vazio">'+cab+'<div class="aviso">' +
          L({pt:'ainda não existe',en:'does not exist yet',es:'todavía no existe'})+'</div></div>';
      }
      return '<div class="pt-item">'+cab +
        '<div class="tam">'+tipo+' · '+e(v.tamanho)+'</div>' +
        '<a class="bt" href="'+pasta+'/'+e(v.arquivo)+'" download>▶ ' +
        L({pt:'Baixar',en:'Download',es:'Descargar'})+'</a></div>';
    }).join('') + '</div>';
  }
  /* Três níveis, e só três. O nível de um projeto é o mesmo que os apoiadores
     recebem: alfa no Seventh Hero, beta no Bank Switch, release para todo mundo. */
  var NIVEIS = {
    release: { marca:'✓', cls:'on',   rot:{pt:'Release',en:'Release',es:'Release'} },
    beta:    { marca:'●', cls:'beta', rot:{pt:'Beta',   en:'Beta',   es:'Beta'} },
    alfa:    { marca:'○', cls:'alfa', rot:{pt:'Alfa',   en:'Alpha',  es:'Alfa'} }
  };
  function nivel(g){ return NIVEIS[g.nivel] || NIVEIS.alfa; }
  function selo(g){
    var n = nivel(g);
    return '<span class="pill '+n.cls+'">'+n.marca+' '+L(n.rot)+'</span>' + bandeiras(g);
  }
  /* As bandeiras saem do que existe em patches/, não de uma lista escrita à mão:
     um idioma só aparece quando o arquivo dele existe. */
  function bandeiras(g){
    var v = (g.patch||{}).versoes||{};
    var tem = IDI.filter(function(x){ return v[x[0]]; });
    if (!tem.length) return '';
    return '<span class="idiomas" role="list">' + tem.map(function(x){
      return '<span role="listitem" class="fl" title="'+txt(x[2],'en')+'">' + x[1] +
        '<span class="cod">'+x[0].toUpperCase()+'</span></span>';
    }).join('') + '</span>';
  }

  /* ---------------- HOME ---------------- */
  function home(){
    var c = D.content, h = c.hero||{}, jogos = D.games||[];
    function conta(n){ return jogos.filter(function(g){ return g.nivel === n; }).length; }
    var prontos = conta('release'), betas = conta('beta'), alfas = conta('alfa');
    var d = jogos.filter(function(g){ return g.destaque; })[0] || jogos[0];
    var out = '<div class="hero"><div class="hero-txt">' +
      '<p class="kicker">'+L(h.eyebrow)+'</p>' +
      '<h1>'+L(h.title)+'<em>'+L(h.accent)+'</em></h1>' +
      '<p class="lede">'+L(h.curta)+'</p>' +
      '<div class="hero-ctas">' +
        '<a class="bt" href="#/projetos">'+L((h.ctas||{}).projetos)+'</a>' +
        '<div class="cta-apoio">' +
          '<a class="bt fora" href="#/apoie">♥ '+L((h.ctas||{}).apoiar)+'</a>' +
          '<span class="nota">'+L((h.ctas||{}).apoiarNota)+'</span>' +
        '</div>' +
      '</div>' +
      '<p class="hero-regra">'+L((h.ctas||{}).regra)+'</p></div>';

    /* o showcase: o visitante vê um jogo antes de rolar */
    if (d) {
      out += '<a class="vitrine" href="#/jogo/'+e(d.slug)+'">' +
        '<div class="tela">'+foto(d.capa, d.nome+' — '+txt(d.linha,'en'), 'eager')+'</div>' +
        '<div class="corpo">' +
          '<div class="topo">'+selo(d)+'</div>' +
          '<h2>'+e(d.nome)+'</h2>' +
          '<p class="ficha-card">'+e(d.sistema)+' · '+e(d.ano)+' · '+L({pt:'inglês',en:'English',es:'inglés'})+'</p>' +
          '<p class="cat">'+L(d.categoria)+'</p>' +
          '<p class="ir">'+L({pt:'Ver o projeto →',en:'View project →',es:'Ver el proyecto →'})+'</p>' +
        '</div></a>';
    }
    out += '</div>';

    /* rodapé da dobra: o placar, com a atividade em destaque */
    out += '<div class="placar">' +
      '<div class="nums">' +
        '<span><b>'+jogos.length+'</b> '+L({pt:'projetos',en:'projects',es:'proyectos'})+'</span>' +
        '<span><b>'+prontos+'</b> release</span>' +
        '<span><b>'+betas+'</b> beta</span>' +
        '<span><b>'+alfas+'</b> '+L({pt:'alfa',en:'alpha',es:'alfa'})+'</span>' +
      '</div>' +
      ((D.posts||[])[0] ? '<div class="vivo"><span class="bolinha" aria-hidden="true"></span>' +
        L(h.ativo)+' — '+L({pt:'build',en:'build',es:'build'})+' '+L(data(D.posts[0].date))+'</div>' : '') +
    '</div>';

    /* projetos */
    out += '<section><p class="label">'+L({pt:'Projetos',en:'Projects',es:'Proyectos'})+'</p><div class="projetos">' +
      jogos.slice(0, 4).map(cardProjeto).join('') + '</div>' +
      '<p class="ver-todas"><a href="#/projetos">' +
        L({pt:'Ver todos os '+jogos.length+' projetos →', en:'View all '+jogos.length+' projects →', es:'Ver los '+jogos.length+' proyectos →'}) +
      '</a></p></section>';

    /* nao e so traducao */
    out += secaoProvas();

    /* ultimas atualizacoes */
    var ps = (D.posts||[]).slice(0,3);
    if (ps.length) {
      out += '<section><p class="label">'+L({pt:'Últimas atualizações',en:'Latest updates',es:'Últimas novedades'})+'</p>' +
        '<div class="updates">' + ps.map(cardUpdate).join('') + '</div>' +
        '<p class="ver-todas"><a href="#/atualizacoes">'+L({pt:'Ver todas →',en:'View all →',es:'Ver todas →'})+'</a></p></section>';
    }

    out += patreonResumo();
    out += secaoPromessas();
    return out;
  }

  function cardProjeto(g){
    return '<article class="proj">' +
      '<a class="tela" href="#/jogo/'+e(g.slug)+'" tabindex="-1" aria-hidden="true">'+foto(g.capa, '')+'</a>' +
      '<div class="corpo">' +
        '<div>'+selo(g)+'</div>' +
        '<h3><a href="#/jogo/'+e(g.slug)+'">'+e(g.nome)+'</a></h3>' +
        '<div class="ficha">'+e(g.publisher)+' · '+e(g.ano)+' · '+e(g.sistema)+'</div>' +
        '<div class="cat">'+L(g.categoria)+'</div>' +
        '<p class="linha">'+L(g.linha)+'</p>' +
        '<div class="ir"><a href="#/jogo/'+e(g.slug)+'">'+L({pt:'Ver projeto →',en:'View project →',es:'Ver proyecto →'})+'</a></div>' +
      '</div></article>';
  }

  function resumo(o, l){
    var b = (o['body_'+l] && o['body_'+l].length ? o['body_'+l] : o.body_en) || [];
    var t = b[0] || '';
    return t.length > 165 ? t.slice(0,162).replace(/\s+\S*$/,'') + '…' : t;
  }
  function cardUpdate(o){
    return '<article class="upd">' +
      '<div class="quando">'+L(data(o.date))+(o.tag?' · '+e(o.tag):'')+'</div>' +
      '<h3>'+L({pt:o.title_pt,en:o.title_en,es:o.title_es})+'</h3>' +
      '<p>'+L({pt:resumo(o,'pt'),en:resumo(o,'en'),es:resumo(o,'es')})+'</p>' +
      '<div class="ler"><a href="#/atualizacoes">'+L({pt:'Ler o devlog →',en:'Read the devlog →',es:'Leer el devlog →'})+'</a></div>' +
      '</article>';

  function secaoProvas(){
    var p = (D.content.provas||{}).itens||[];
    if (!p.length) return '';
    return '<section><p class="label">'+L({pt:'Não é só tradução',en:'Not just translation',es:'No es solo traducción'})+'</p>' +
      '<div class="col"><h2>'+L({pt:'O que muda dentro do cartucho.',en:'What changes inside the cartridge.',es:'Lo que cambia dentro del cartucho.'})+'</h2></div>' +
      '<div class="provas" style="margin-top:34px">' + p.map(function(x){

        return '<div class="prova"><p class="et">'+L(x.etiqueta)+'</p>' +

          '</div>';
      }).join('') + '</div></section>';

  function secaoPromessas(){

      return '<div class="promessa"><h4>'+L(x.titulo)+'</h4><p>'+L(x.texto)+'</p></div>';
    }).join('') + '</div></section>';
  }

  /* ---------------- PROJETOS ---------------- */
  function paginaProjetos(){
    var jogos = D.games||[];
    var grupos = ['release','beta','alfa'].map(function(n){
      return { n:n, t:NIVEIS[n].rot, f:function(g){ return g.nivel === n; } };
    });
    var out = '<section><p class="label">'+L({pt:'Projetos',en:'Projects',es:'Proyectos'})+'</p>' +
      '<div class="col"><h1 style="font-size:clamp(32px,4.6vw,48px)">'+L({pt:'Projetos',en:'Projects',es:'Proyectos'})+'</h1>' +
      '<p class="lede">'+L({pt:'O Patch Clan não é um site sobre alguns jogos: é uma oficina de projetos, e estes são os que existem hoje.',
                            en:'Patch Clan is not a site about a few games: it is a workshop of projects, and these are the ones that exist today.',
                            es:'Patch Clan no es un sitio sobre unos juegos: es un taller de proyectos, y estos son los que existen hoy.'})+'</p></div>';
    var nv = D.content.niveis;
    if (nv) {
      out += '<div class="regua"><h3>'+L(nv.titulo)+'</h3><p class="intro">'+L(nv.intro)+'</p><dl>' +
        (nv.itens||[]).map(function(x){
          var n = NIVEIS[x.chave];
          return '<div><dt><span class="pill '+n.cls+'">'+x.marca+' '+L(n.rot)+'</span></dt>' +
            '<dd>'+L(x.texto)+'</dd></div>';
        }).join('') + '</dl>' +
        (nv.fecho ? '<p class="fecho">'+L(nv.fecho)+'</p>' : '') + '</div>';
    }
    grupos.forEach(function(gr){
      var lista = jogos.filter(gr.f);
      if (!lista.length) return;
      out += '<div class="grupo-status" style="margin-top:44px"><h3>'+L(gr.t)+' <span style="color:var(--accent)">'+lista.length+'</span></h3>' +
        '<div class="projetos">' + lista.map(cardProjeto).join('') + '</div></div>';
    });
    var fl = D.content.fila;
    if (fl && (fl.itens||[]).length) {
      out += '<div class="fila"><h3>'+L(fl.titulo)+' <span>'+fl.itens.length+'</span></h3>' +
        '<p class="intro">'+L(fl.intro)+'</p>' +
        '<p class="intro">'+L(fl.criterio)+'</p>' +
        '<ol>' + fl.itens.map(function(x){
          return '<li><div class="jogo"><b>'+e(x.nome)+'</b>' +
            '<span class="ficha">'+e(x.sistema)+' · '+e(x.ano)+'</span></div>' +
            '<p>'+L(x.porque)+'</p></li>';
        }).join('') + '</ol>' +
        '<p class="aviso">'+L(fl.aviso)+'</p></div>';
    }
    return out + '</section>';
  }

  /* ---------------- PÁGINA DO PROJETO ---------------- */
  function paginaJogo(slug){
    var g = jogo(slug); if(!g) return paginaProjetos();   /* projeto que saiu da lista */
    var out = '<div class="jogo-cab"><div>' +
      '<div class="selos">' +
        (g.primeiro?'<span class="pill gold">'+L({pt:'A primeira tradução do clã',en:'The clan’s first translation',es:'La primera traducción del clan'})+'</span>':'') +
        selo(g) + '<span class="pill">'+L(g.categoria)+'</span></div>' +
      '<p class="jp">'+e(g.jp)+'</p>' +
      '<h1>'+e(g.nome)+'</h1>' +

      '<p class="ficha">'+e(g.publisher)+(g.dev&&g.dev!==g.publisher?' · '+e(g.dev):'')+' · '+e(g.data)+' · '+e(g.sistema)+'<br>'+e(g.mapper) +

    out += '<nav class="abas" aria-label="'+e(g.nome)+'">' +

      (g.nivel === 'release' ? '<a href="#/jogo/'+e(g.slug)+'" data-ir="tudo">'+L({pt:'O que mudou',en:'What changed',es:'Qué cambió'})+'</a>' : '') +
      '<a href="#/jogo/'+e(g.slug)+'" data-ir="telas">'+L({pt:'Telas',en:'Screens',es:'Pantallas'})+'</a>' +
      '<a href="#/jogo/'+e(g.slug)+'" data-ir="baixar">'+L({pt:'Baixar',en:'Download',es:'Descargar'})+'</a>' +
