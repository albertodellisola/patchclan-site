<code>おとっつあん</code>, e essas mesmas 128 casas foram regeradas a partir do corpus inglês — a compressão que servia ao japonês passou a servir ao inglês, sem código novo. Antes da estrada há um prólogo de <b>oito telas</b> que não existe no original, apresentando Yaji, Kita e Oharu, três delas com retrato: a forma da cabeça vem dos tiles de fundo da mesma página de CHR que a fonte usa, as feições são sprites, e o marrom com letra creme são as cores da própria caixa de diálogo, lidas no emulador. Cada tela <b>espera o botão</b>, em vez de virar sozinha no relógio.","O roteiro deste cartucho tem <b>3.581 falas em 93.640 bytes</b> de japonês. Em inglês isso pede perto de <b>145 KB</b>, e o caminho de expansão que serviu aos outros projetos da casa estava fechado aqui: o bit que viraria linha de endereço do programa <b>já é usado pela CHR-ROM de 128 KB</b>, cujas 32 páginas são todas distintas. Então o cartucho foi refeito — <b>de MMC1 para MMC3, e de 256 para 512 KB</b>. Deu certo por um motivo medido: a partida inteira escreve em <b>exatamente cinco endereços de registrador</b>, e as cinco rotinas de troca de banco couberam reescritas no espaço delas mesmas. A prova é paridade, não opinião: <b>19 de 19 quadros idênticos</b> à ROM japonesa. Duas lições ficaram do caminho — sob MMC3 a região fixa vem do último banco e não do décimo quinto, e quem escreve lá tem de espelhar nos dois; e frieza medida diz que o teste não passou por ali, nunca que o jogo não passa: o banco 7 parecia ter <b>13,5 KB mortos</b> e tinha sete chamadas apontando para dentro."],"en":["<b>The Misadventures of Yaji &amp; Kita</b> — on the cartridge, <i>Gozonji: Yaji Kita Chin Douchuu</i> — came out of HAL Laboratory in 1991, and it starts from a book every Japanese reader meets at school: Jippensha Ikku's <i>Tōkaidōchū Hizakurige</i>, in which two men from Edo set out on foot for the Ise shrine and get into trouble at every stop. Yaji and Kita are the original road-trip double act, two centuries before cinema invented the genre. And the game has no chapters: it <b>is</b> the road — the <b>53 stations of the Tōkaidō</b>, one at a time, with the script split into nine blocks of similar weight. The English name is this translation's choice; the game never had one, and the title screen's subtitle now reads <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","Speech lives in a box of <b>16 characters by 4 lines</b>, measured on the nametable, and the cartridge is <b>pure kana, without a single kanji</b>: all 32 graphics pages were swept and only one font exists. Over the kana slots sit <b>83 Latin glyphs</b> — A-Z, a-z, digits and punctuation — with the descenders of <code>p g q y j</code> redrawn as soon as the preview showed the tile's eighth row had been free all along. The game's own compression was <b>reused rather than worked around</b>: the engine carries a <b>128-entry dictionary</b>, which in the original holds voiced kana and words like <code>おとっつあん</code>, and those same 128 slots were regenerated from the English corpus — the compression that served Japanese now serves English, with no new code. Before the road there is an <b>eight-screen prologue</b> that does not exist in the original, introducing Yaji, Kita and Oharu, three of them with a portrait: the shape of the head comes from background tiles on the same CHR page the font uses, the features are sprites, and the brown with cream lettering are the colours of the game's own dialogue box, read off the emulator. Each screen <b>waits for the button</b> rather than turning itself on a timer.","This cartridge's script holds <b>3,581 lines in 93,640 bytes</b> of Japanese. In English that asks for close to <b>145 KB</b>, and the expansion route that served the house's other projects was closed here: the bit that would become a program address line <b>is already used by the 128 KB CHR-ROM</b>, whose 32 pages are all distinct. So the cartridge was rebuilt — <b>from MMC1 to MMC3, and from 256 to 512 KB</b>. It worked for a measured reason: a whole session writes to <b>exactly five register addresses</b>, and the five bank-switching routines fitted rewritten in their own space. The proof is parity, not opinion: <b>19 of 19 frames identical</b> to the Japanese ROM. Two lessons came out of the route — under MMC3 the fixed region comes from the last bank rather than the fifteenth, and whoever writes there has to mirror into both; and a cold profile says the test never went that way, never that the game does not: bank 7 looked like <b>13.5 KB of dead space</b> and had seven calls pointing into it."],"es":["<b>The Misadventures of Yaji &amp; Kita</b> — las desventuras de Yaji y Kita; en el cartucho, <i>Gozonji: Yaji Kita Chin Douchuu</i> — salió de HAL Laboratory en 1991, y parte de un libro que todo japonés se encuentra en la escuela: el <i>Tōkaidōchū Hizakurige</i>, de Jippensha Ikku, en el que dos vecinos de Edo salen a pie rumbo al santuario de Ise y se meten en un lío en cada parada. Yaji y Kita son la pareja de carretera original, dos siglos antes de que el cine inventara el género. Y el juego no tiene capítulos: <b>es</b> el camino — las <b>53 estaciones del Tōkaidō</b>, una cada vez, con el guion repartido en nueve bloques de peso parecido. El nombre en inglés es la elección de esta traducción; el juego nunca tuvo uno, y el subtítulo de la pantalla de título dice ahora <i>THE UNRULY TOWNSMAN / SLASHES HIS WAY THROUGH / TOKAIDO'S 53 STATIONS</i>.","El habla vive en una caja de <b>16 caracteres por 4 líneas</b>, medida en la nametable, y el cartucho es <b>kana puro, sin un solo kanji</b>: barridas las 32 páginas de gráficos, existe una única fuente. Sobre las casillas de kana se grabaron <b>83 glifos latinos</b> — A-Z, a-z, cifras y puntuación —, con las colas descendentes de <code>p g q y j</code> redibujadas en cuanto la vista previa enseñó que la octava fila del tile llevaba libre desde siempre. La compresión del juego se <b>reaprovechó en vez de esquivarla</b>: el motor carga un <b>diccionario de 128 entradas</b>, que en el original guarda los kana sonoros y palabras como <code>おとっつあん</code>, y esas mismas 128 casillas se regeneraron a partir del corpus inglés — la compresión que servía al japonés pasó a servir al inglés, sin código nuevo. Antes del camino hay un prólogo de <b>ocho pantallas</b> que no existe en el original, presentando a Yaji, Kita y Oharu, tres de ellas con retrato: la forma de la cabeza viene de los tiles de fondo de la misma página de CHR que usa la fuente, las facciones son sprites, y el fondo marrón y la letra crema son los colores de la propia caja de diálogo, leídos en el emulador. Cada pantalla <b>espera el botón</b>, en lugar de pasar sola con el reloj.","El guion de este cartucho tiene <b>3.581 líneas en 93.640 bytes</b> de japonés. En inglés eso pide cerca de <b>145 KB</b>, y el camino de ampliación que sirvió a los otros proyectos de la casa estaba cerrado aquí: el bit que se convertiría en línea de dirección del programa <b>ya lo usa la CHR-ROM de 128 KB</b>, cuyas 32 páginas son todas distintas. Así que el cartucho se rehízo — <b>de MMC1 a MMC3, y de 256 a 512 KB</b>. Salió bien por un motivo medido: la partida entera escribe en <b>exactamente cinco direcciones de registro</b>, y las cinco rutinas de cambio de banco cupieron reescritas en su propio espacio. La prueba es paridad, no opinión: <b>19 de 19 fotogramas idénticos</b> a la ROM japonesa. Del camino quedaron dos lecciones — bajo MMC3 la región fija viene del último banco y no del decimoquinto, y quien escribe ahí tiene que reflejarlo en los dos; y un perfil frío dice que la prueba no pasó por ahí, nunca que el juego no pase: el banco 7 parecía tener <b>13,5 KB muertos</b> y tenía siete llamadas apuntando dentro."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"gozonji-en.ips","tamanho":"276 KB"},"pt":null,"es":null},"rom":"Gozonji - Yaji Kita Chin Douchuu (Japan).nes","rom_md5":"bdd15fac92d789d8ec59a6484e90db5b"},"fotos":[{"f":"gozonji/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O Fuji, o letreiro e o subtítulo em inglês.","en":"The Fuji, the logo and the English subtitle.","es":"El Fuji, el rótulo y el subtítulo en inglés."}},{"f":"gozonji/02-prologo.png","t":{"pt":"O prólogo","en":"The prologue","es":"El prólogo"},"c":{"pt":"Cada personagem apresentado antes de a estrada começar.","en":"Each character introduced before the road begins.","es":"Cada personaje presentado antes de que empiece el camino."}},{"f":"gozonji/03-creditos.png","t":{"pt":"Créditos do patch","en":"Patch credits","es":"Créditos del parche"},"c":{"pt":"A tela de abertura da tradução.","en":"The translation opening screen.","es":"La pantalla de apertura de la traducción."}},{"f":"gozonji/04-dialogo.png","t":{"pt":"Diálogo","en":"Dialogue","es":"Diálogo"},"c":{"pt":"A caixa de dezesseis caracteres por quatro linhas.","en":"The box of sixteen characters by four lines.","es":"La caja de dieciséis caracteres por cuatro líneas."}},{"f":"gozonji/05-cena.png","t":{"pt":"Na estrada","en":"On the road","es":"En el camino"},"c":{"pt":"Uma das 53 estações do Tōkaidō.","en":"One of the 53 stations of the Tōkaidō.","es":"Una de las 53 estaciones del Tōkaidō."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"hanjuku-hero","nome":"Hanjuku Hero","subtitulo":"半熟英雄","jp":"半熟英雄","publisher":"Square","dev":"Square","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 modo 3 · 128 KB PRG · CHR-RAM · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"hj/00-capa-patreon.jpg","linha":{"pt":"O herói é literalmente um ovo meio cozido. Estratégia da Square em 1988: você comanda um reino e solta monstros de dentro dos ovos.","en":"The hero is literally a soft-boiled egg. Square strategy, 1988: you command a kingdom and hatch your monsters out of the eggs.","es":"El héroe es literalmente un huevo medio cocido. Estrategia de Square, 1988: diriges un reino y sacas los monstruos de dentro de los huevos."},"resumo":{"pt":["<i>Hanjuku</i> quer dizer <b>meio cozido</b>, e o herói é um ovo — o nome é a piada. Antes de a Square ser sinônimo de Final Fantasy, ela tinha esta estratégia cômica em tempo real, de 1988, em que você comanda um reino e solta monstros de dentro dos ovos. É série própria dela, licenciada de ninguém, e continuou no Japão por décadas, em vários consoles, sem nunca sair de lá.","Num cartucho assim, o primeiro trabalho não é traduzir: é provar que você está lendo o texto certo. O encoding foi quebrado com <b>provas independentes</b> — o byte gravado <b>é o índice do tile na VRAM</b>, código igual a <code>0x74</code> mais o índice da fonte, e o mapeamento fecha por dois caminhos, com あ, ャ e o espaço batendo e o japonês decodificado saindo corrido e legível. A consequência é imediata: tudo abaixo de <code>0x74</code> é código de controle. Um encoding quase certo produz texto que parece japonês e não é, e a tradução inteira nasce torta por cima dele.","A fonte latina já está na build, com os três blocos de nomes em inglês — <b>112 das 399 strings</b> —, e o construtor aborta se um byte mudar fora das regiões declaradas. A armadilha do jogo apareceu cedo e já foi contornada: <b>a fonte tem duas cópias na ROM</b>, em <code>0x14000</code> e em <code>0x06784</code>, e patchear só uma <b>não muda um pixel na tela</b>, porque a tela de entrada de nome carrega a outra — e nela as casas de katakana guardam os cantos da janela. O aperto também não é onde parece: somando tudo há <b>10,8 KB livres</b> na ROM, mas o banco 2, de onde o texto de batalha é lido, tem <b>371 bytes de folga para 4,3 KB de texto</b>. Até o vazio engana — o enchimento é a palavra <code>OSMOT</code> repetida, e é ela que dá vetores falsos aos bancos 0 a 6. Não há patch para instalar; esta página acompanha o projeto."],"en":["<i>Hanjuku</i> means <b>soft-boiled</b>, and the hero is an egg — the name is the joke. Before Square was a synonym for Final Fantasy, it had this 1988 real-time comic strategy game, where you command a kingdom and hatch monsters out of eggs. It is Square's own series, licensed from nobody, and it carried on in Japan for decades across several consoles without ever leaving.","In a cartridge like this, the first job is not translating: it is proving you are reading the right text. The encoding was broken with <b>independent proofs</b> — the stored byte <b>is the tile index in VRAM</b>, the code being <code>0x74</code> plus the font index, and the mapping closes by two routes, with あ, ャ and the space all matching and the decoded Japanese coming out as readable running text. The consequence is immediate: everything below <code>0x74</code> is a control code. An encoding that is nearly right produces text that looks Japanese and is not, and the whole translation grows crooked on top of it.","The Latin font is already in the build, with the three name blocks in English — <b>112 of the 399 strings</b> — and the builder aborts if a byte changes outside the declared regions. The game's trap showed up early and has been worked around: <b>the font has two copies in the ROM</b>, at <code>0x14000</code> and at <code>0x06784</code>, and patching only one <b>does not change a pixel on screen</b>, because the name-entry screen loads the other — and there the katakana slots hold the window corners. The squeeze is not where it looks, either: adding everything up there are <b>10.8 KB free</b> in the ROM, but bank 2, where the battle text is read from, has <b>371 bytes of slack for 4.3 KB of text</b>. Even the emptiness misleads — the filler is the word <code>OSMOT</code> repeated, and it is what gives banks 0 to 6 their fake vectors. There is no patch to install; this page follows the project."],"es":["<i>Hanjuku</i> quiere decir <b>medio cocido</b>, y el héroe es un huevo — el nombre es el chiste. Antes de que Square fuera sinónimo de Final Fantasy, tenía esta estrategia cómica en tiempo real, de 1988, en la que diriges un reino y sacas monstruos de dentro de los huevos. Es una serie propia de Square, no una licencia de nadie, y siguió en Japón durante décadas, en varias consolas, sin salir nunca de allí.","En un cartucho así, el primer trabajo no es traducir: es probar que estás leyendo el texto correcto. La codificación se rompió con <b>pruebas independientes</b> — el byte guardado <b>es el índice del tile en la VRAM</b>, el código es <code>0x74</code> más el índice de la fuente, y el mapeo cierra por dos caminos, con あ, ャ y el espacio coincidiendo y el japonés decodificado saliendo corrido y legible. La consecuencia es inmediata: todo lo que hay por debajo de <code>0x74</code> es código de control. Una codificación casi correcta produce texto que parece japonés y no lo es, y la traducción entera nace torcida encima de ella.","La fuente latina ya está en la compilación, con los tres bloques de nombres en inglés — <b>112 de las 399 cadenas</b> —, y el constructor aborta si cambia un byte fuera de las regiones declaradas. La trampa del juego apareció pronto y ya está sorteada: <b>la fuente tiene dos copias en la ROM</b>, en <code>0x14000</code> y en <code>0x06784</code>, y parchear solo una <b>no cambia un píxel en pantalla</b>, porque la pantalla de entrada de nombre carga la otra — y ahí las casillas de katakana guardan las esquinas de la ventana. La estrechez tampoco está donde parece: sumándolo todo hay <b>10,8 KB libres</b> en la ROM, pero el banco 2, de donde se lee el texto de combate, tiene <b>371 bytes de holgura para 4,3 KB de texto</b>. Hasta el vacío engaña — el relleno es la palabra <code>OSMOT</code> repetida, y es ella la que da vectores falsos a los bancos 0 a 6. No hay parche que instalar; esta página sigue el proyecto."]},"numeros":[{"v":"399","r":{"pt":"strings no jogo","en":"strings in the game","es":"strings en el juego"}},{"v":"112","r":{"pt":"já traduzidas","en":"translated so far","es":"ya traducidas"}},{"v":"128","r":{"pt":"KB de PRG, com CHR-RAM","en":"KB of PRG, with CHR-RAM","es":"KB de PRG, con CHR-RAM"}}],"grupos":[{"titulo":{"pt":"O que já foi medido","en":"What is already measured","es":"Lo que ya está medido"},"itens":[{"t":{"pt":"<b>O encoding do texto, quebrado com provas independentes</b> — cada mapeamento de caractere fecha por dois caminhos, e o japonês decodificado sai corrido e legível. Encoding \"quase certo\" produz texto que parece japonês e não é.","en":"<b>The text encoding, broken with independent proofs</b> — every character mapping closes by two routes, and the decoded Japanese comes out as readable running text. An encoding that is \"nearly right\" produces text that looks Japanese and is not.","es":"<b>El encoding del texto, roto con pruebas independientes</b> — cada mapeo de carácter cierra por dos caminos, y el japonés decodificado sale corrido y legible. Un encoding \"casi correcto\" produce texto que parece japonés y no lo es."},"foto":"hj/01-titulo.png"},{"t":{"pt":"<b>CHR-RAM outra vez</b>, como no Tom Sawyer: os gráficos moram no código, não num bloco do arquivo.","en":"<b>CHR-RAM again</b>, as in Tom Sawyer: the graphics live in the program, not in a block of the file.","es":"<b>CHR-RAM otra vez</b>, como en Tom Sawyer: los gráficos viven en el código, no en un bloque del archivo."}},{"t":{"pt":"<b>112 de 399 strings</b> traduzidas — os três blocos de nomes. O resto do roteiro é o próximo passo.","en":"<b>112 of 399 strings</b> translated — the three name blocks. The rest of the script is the next step.","es":"<b>112 de 399 strings</b> traducidas — los tres bloques de nombres. El resto del guion es el siguiente paso."}}]}],"patch":{"versoes":{"en":{"arquivo":"hanjuku-hero-en.ips","tamanho":"136 KB"},"pt":null,"es":null},"rom":"Hanjuku Hero (Japan).nes","rom_md5":"60e08c13d85400b77b90b9d581f26fce"},"fotos":[{"f":"hj/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"ROM original — o subtítulo <code>HANJUKU HERO</code> já vem em latinas de fábrica.","en":"Original ROM — the <code>HANJUKU HERO</code> subtitle already comes in Latin letters from the factory.","es":"ROM original — el subtítulo <code>HANJUKU HERO</code> ya viene en latinas de fábrica."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"ultraman-club-3","nome":"Ultraman Club 3","subtitulo":"","jp":"ウルトラマン倶楽部3","publisher":"Yutaka","dev":"Tsuburaya Prod.","ano":1991,"data":"1991","sistema":"Famicom","mapper":"Famicom","categoria":{"pt":"Correção de bugs + tradução","en":"Bug fixes + translation","es":"Corrección de bugs + traducción"},"nivel":"alfa","capa":"u3/00-capa-patreon.jpg","linha":{"pt":"A continuação em que os Ultras guardam kaiju em cápsulas — e onde a cápsula da página 8, que travava a batalha, caiu antes da tradução.","en":"The sequel where the Ultras store kaiju in capsules — and where the page-8 capsule, which hung the battle, fell before the translation did.","es":"En esta secuela los Ultras guardan kaiju en cápsulas, y la cápsula de la página 8, que colgaba el combate, cayó antes que el texto."},"resumo":{"pt":["Tsuburaya de novo, agora com a Yutaka, em 1991, e continuação direta do <i>Ultraman Club 2</i>. Aqui os monstros vão para dentro de <b>cápsulas</b> — trinta lugares de inventário, um nibble por kaiju — e a viagem passa pela <b>Nebulosa M78</b>, o endereço de onde os Ultras vêm.","Este projeto começou de trás para frente, de propósito: <b>consertar os defeitos do jogo original vem antes de traduzir</b>, porque escrever inglês por cima de um defeito só produz uma tela quebrada noutro idioma. O primeiro já caiu. Em batalha, no menu de cápsulas, a página 8 desenha só duas entradas, mas o cursor anda por tabela fixa e chega às duas vagas vazias; confirmar ali fazia o jogo ler o atributo que sobrou da página anterior — <b>travava na maioria das vezes</b> e, de vez em quando, invocava um Pestar corrompido com efeito aleatório. <b>Vinte e dois bytes</b> no banco 29 fazem as duas linhas nascerem recusáveis: o cursor ainda entra e o A não faz nada, exatamente como o próprio jogo já se comporta com outras duas cápsulas.","Nada disso vale sem medição. O conserto foi verificado em <b>teste A/B contra a ROM original</b>, com um teste de regressão por cima, e o construtor <b>aborta se os bytes originais não baterem</b> — além de imprimir os <b>22 códigos de Game Genie</b> equivalentes, para quem preferir o mesmo efeito sem gerar ROM nenhuma. A engenharia reversa também entregou ferramenta: duas escritas na memória invocam qualquer um dos <b>80 encontros</b> do jogo, em qualquer ponto, o que torna reproduzível o que antes dependia de sorte. E o texto já está levantado: <b>338 mensagens</b>, com offset, tamanho e referências de cada uma. Não há patch para instalar; esta página acompanha o projeto."],"en":["Tsuburaya again, now with Yutaka, in 1991, and a direct sequel to <i>Ultraman Club 2</i>. Here the monsters go into <b>capsules</b> — thirty inventory slots, one nibble per kaiju — and the journey passes through <b>Nebula M78</b>, the address the Ultras come from.","This project started backwards on purpose: <b>fixing the original game's defects comes before translating it</b>, because writing English over a defect only produces a broken screen in another language. The first one has fallen. In battle, in the capsule menu, page 8 draws only two entries, but the cursor walks a fixed table and reaches the two empty slots; confirming there made the game read the attribute left over from the previous page — it <b>hung most of the time</b> and, now and then, summoned a corrupted Pestar with a random effect. <b>Twenty-two bytes</b> in bank 29 make those two rows refusable from birth: the cursor still enters and A does nothing, exactly as the game already behaves with two other capsules.","None of that counts without measurement. The fix was verified in an <b>A/B test against the original ROM</b>, with a regression test on top, and the builder <b>aborts if the original bytes do not match</b> — besides printing the <b>22 equivalent Game Genie codes</b>, for anyone who would rather have the same effect without generating a ROM at all. The reverse engineering also produced a tool: two writes to memory summon any of the game's <b>80 encounters</b>, at any point, which makes reproducible what used to depend on luck. And the text is already surveyed: <b>338 messages</b>, each with its offset, size and references. There is no patch to install; this page follows the project."],"es":["Tsuburaya otra vez, ahora con Yutaka, en 1991, y secuela directa de <i>Ultraman Club 2</i>. Aquí los monstruos van dentro de <b>cápsulas</b> — treinta huecos de inventario, un nibble por kaiju — y el viaje pasa por la <b>Nebulosa M78</b>, la dirección de donde vienen los Ultras.","Este proyecto empezó al revés a propósito: <b>arreglar los defectos del juego original va antes que traducirlo</b>, porque escribir inglés encima de un defecto solo produce una pantalla rota en otro idioma. El primero ya cayó. En combate, en el menú de cápsulas, la página 8 dibuja solo dos entradas, pero el cursor recorre una tabla fija y llega a los dos huecos vacíos; confirmar ahí hacía que el juego leyera el atributo que sobraba de la página anterior — <b>colgaba la mayoría de las veces</b> y, de vez en cuando, invocaba un Pestar corrupto con efecto aleatorio. <b>Veintidós bytes</b> en el banco 29 hacen que esas dos filas nazcan rechazables: el cursor sigue entrando y la A no hace nada, exactamente como el propio juego ya se comporta con otras dos cápsulas.","Nada de eso vale sin medición. El arreglo se verificó en <b>prueba A/B contra la ROM original</b>, con una prueba de regresión encima, y el constructor <b>aborta si los bytes originales no coinciden</b> — además de imprimir los <b>22 códigos de Game Genie</b> equivalentes, para quien prefiera el mismo efecto sin generar ninguna ROM. La ingeniería inversa dejó además una herramienta: dos escrituras en memoria invocan cualquiera de los <b>80 encuentros</b> del juego, en cualquier punto, lo que hace reproducible lo que antes dependía de la suerte. Y el texto ya está inventariado: <b>338 mensajes</b>, con desplazamiento, tamaño y referencias de cada uno. No hay parche que instalar; esta página sigue el proyecto."]},"numeros":[{"v":"3","r":{"pt":"bugs do jogo original","en":"bugs in the original game","es":"bugs del juego original"}},{"v":"1","r":{"pt":"corrigido e medido","en":"fixed and measured","es":"corregido y medido"}},{"v":"22","r":{"pt":"códigos Game Genie do conserto","en":"Game Genie codes for the fix","es":"códigos Game Genie del arreglo"}}],"grupos":[{"titulo":{"pt":"Os bugs, um a um","en":"The bugs, one by one","es":"Los bugs, uno a uno"},"itens":[{"t":{"pt":"<b>A cápsula da página 8 — CORRIGIDO.</b> Causa achada, conserto escrito e medido, com teste A/B contra a ROM original e teste de regressão. O construtor <b>aborta se os bytes originais não baterem</b>, e imprime os 22 códigos Game Genie equivalentes.","en":"<b>The page-8 capsule — FIXED.</b> Cause found, fix written and measured, with an A/B test against the original ROM and a regression test. The builder <b>aborts if the original bytes do not match</b>, and prints the 22 equivalent Game Genie codes.","es":"<b>La cápsula de la página 8 — CORREGIDO.</b> Causa encontrada, arreglo escrito y medido, con prueba A/B contra la ROM original y prueba de regresión. El constructor <b>aborta si los bytes originales no coinciden</b>, e imprime los 22 códigos Game Genie equivalentes."},"foto":"u3/01-titulo.png"},{"t":{"pt":"<b>O warp do Ace Robot — NÃO REPRODUZIDO.</b> A investigação está registrada: formato do save decodificado, RAM mapeada, hipótese levantada. Sem reproduzir, não se conserta — e não se finge que consertou.","en":"<b>The Ace Robot warp — NOT REPRODUCED.</b> The investigation is on record: save format decoded, RAM mapped, hypothesis raised. Without reproducing it, you do not fix it — and you do not pretend you did.","es":"<b>El warp del Ace Robot — NO REPRODUCIDO.</b> La investigación está registrada: formato del save decodificado, RAM mapeada, hipótesis planteada. Sin reproducirlo, no se arregla — y no se finge que se arregló."}},{"t":{"pt":"<b>O Seven voando — NÃO INVESTIGADO.</b> Depende de um save feito no próprio jogo, não de savestate.","en":"<b>Seven flying — NOT INVESTIGATED.</b> It depends on a save made in the game itself, not a savestate.","es":"<b>El Seven volando — NO INVESTIGADO.</b> Depende de una partida guardada en el propio juego, no de un savestate."}}]}],"patch":{"versoes":{"en":{"arquivo":"ultraman-club-3-en.ips","tamanho":"172 KB"},"pt":null,"es":null},"rom":"Ultraman Club 3 (Japan).nes","rom_md5":"25cd707a6cf845bb4d2df34b2cca6254"},"fotos":[{"f":"u3/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"Build em inglês. A logo japonesa deu lugar à inglesa, redesenhada pixel a pixel nas quatro cores da paleta original; o crédito de 1991 à Tsuburaya e à Yutaka continua onde estava.","en":"English build. The Japanese logo gave way to the English one, redrawn pixel by pixel in the original palette's four colours; the 1991 credit to Tsuburaya and Yutaka stays where it was.","es":"Build en inglés. El logo japonés dio paso al inglés, redibujado píxel a píxel con los cuatro colores de la paleta original; el crédito de 1991 a Tsuburaya y a Yutaka sigue donde estaba."}}],"etapas":{"direcao":"feito","traducao":"andamento","revisao":"andamento","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"robot-poncots-64","nome":"Robot Poncots 64","subtitulo":"7つの海のカラメル","jp":"ロボットポンコッツ64 7つの海のカラメル","publisher":"Hudson Soft","dev":"Hudson Soft","ano":1999,"data":"1999","sistema":"Nintendo 64","mapper":"32 MB · fonte de 12×12 a 4bpp · 64GB Pak","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"robopon/00-capa-patreon.jpg","linha":{"pt":"Monstros-robô da Hudson no Nintendo 64, em que o bicho tem ATK, DEF e RAM, e um estado de batalha desliga todo o software dele.","en":"Hudson's robot monsters on the Nintendo 64, where the creature has ATK, DEF and RAM, and a battle status shuts down all its software.","es":"Monstruos robot de Hudson en la Nintendo 64, donde el bicho tiene ATK, DEF y RAM, y un estado de batalla le apaga todo el software."},"resumo":{"pt":["<b>Hudson Soft</b>, Nintendo 64, <b>32 MB</b> de cartucho, e ficou no Japão. É a série que o Ocidente conheceu no Game Boy Color como <b>Robopon</b>: coleção de monstros em que o monstro é máquina, e o vocabulário entrega isso — o bicho tem <b>ATK, DEF, SPD, PWR, EP</b> e <b>RAM</b>, o que se carrega para ele são <b>peças, software, sementes e comida</b>, e um estado de batalha pode <b>desligar todo o software</b> de uma vez. São <b>46 robôs</b>. Quarenta e cinco vêm da primeira geração da série e chegam com os nomes que ela já tem em inglês — Sunny, Digger, Zap, Gidget —, e o pareamento não dependeu de acertar tradução nenhuma: filtrando a lista oficial pela coluna dos que aparecem no 64 e mantendo a ordem da dex, o casamento com a ordem interna da ROM fecha <b>45 de 45</b>, entrada por entrada. É verificação por posição, muito mais forte do que por nome. O quadragésimo sexto, <code>バケまる</code>, só existe neste cartucho e nunca teve nome oficial em inglês. E o cartucho conversa com o portátil: pelo <b>64GB Pak</b> ele lê um cartucho de Robopon e converte (<code>ＧＢコンバート</code>) o que está lá para dentro do jogo de 64, ao lado do modo história, do Battler Dome e da enciclopédia de robôs.","A propriedade rara está na tabela de charset, em <code>0x19710D0</code>: <b>272 entradas</b> de dois bytes que mapeiam índice para Shift-JIS, e as <b>95 primeiras são o ASCII imprimível inteiro</b>, de <code>0x20</code> a <code>0x7E</code> e em ordem — pontuação, dígitos, <b>A-Z e a-z</b> —, com o desenho já pronto na fonte do jogo, de <b>12×12 px, 4bpp, 72 bytes por glifo</b>. Conferidas entrada por entrada, <b>91 caem no gêmeo fullwidth exato</b> e as outras quatro são as substituições clássicas do JIS. Isto <b>já vinha no cartucho</b>: não é melhoria da casa, e o que é nosso é a leitura. Nos cartuchos de 8 bits deste mesmo catálogo, desenhar o alfabeto era metade do trabalho — no Gozonji foram <b>83 glifos latinos</b> gravados sobre as casas de kana, e no Monster Maker a fonte inteira tem <b>três letras</b>, <code>H</code>, <code>M</code> e <code>P</code>. Aqui não há hack de código a fazer: traduzir é reescrever as strings. O offset da fonte, aliás, foi cravado pela evidência mais vazia que existe — o glifo 0 é o <b>espaço de largura cheia</b>, 72 bytes zerados, então o <code>！</code> começando em <code>0x1971340</code> põe o primeiro byte da fonte exatamente 72 bytes antes.","O que aperta não é a ROM, é o campo. <b>Não há tabela de ponteiros</b>: o texto é campo fixo, base mais índice vezes o tamanho do registro, e nada se realoca sem mexer no motor. São <b>2.994 strings</b>, <b>16.572 caracteres</b> japoneses úteis, cerca de 38 KB — número honesto porque o extrator filtra pelo <b>charset do próprio jogo</b>, e caractere fora daquelas 272 entradas o jogo não desenha, logo não é texto. Isso importa porque varredura por densidade de kana <b>inventa</b>: as primeiras medições devolveram 7,6 MB e depois 21 mil caracteres, e as duas eram falso positivo de textura e de código MIPS lido como Shift-JIS. A capacidade dos campos vai de <b>3 caracteres</b> a <b>272</b>, com <b>mediana de 6</b>, e é aí que os 32 MB param de importar. A letra latina custa <b>dois bytes</b>, igual a um kana, e desenha nos mesmos <b>12 px</b>: o inglês não paga coluna nenhuma, só campo. E há <b>dois tipos de campo</b>: <b>913 strings do original não têm zero nenhum depois</b>, enchem o campo até o fim com espaço de largura cheia e ficam coladas no dado seguinte — escrever um zero numa dessas <b>corta a frase</b>. Foi assim que <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> e <code>POWER</code> perderam o número da tela de uma vez, com o inseridor tendo medido e aprovado. Só a releitura da ROM montada pegou, e por isso ela virou etapa obrigatória. Esta página anda junto com o trabalho."],"en":["<b>Hudson Soft</b>, Nintendo 64, a <b>32 MB</b> cartridge, and it stayed in Japan. This is the series the West met on Game Boy Color as <b>Robopon</b>: monster collecting where the monster is a machine, and the vocabulary gives it away — the creature has <b>ATK, DEF, SPD, PWR, EP</b> and <b>RAM</b>, what you load into it is <b>parts, software, seeds and food</b>, and one battle status can <b>shut down all its software</b> at once. There are <b>46 robots</b>. Forty-five come from the series' first generation and arrive with the English names it already has — Sunny, Digger, Zap, Gidget — and the pairing did not depend on getting any translation right: filtering the official list by the column marking which ones appear on the 64, and keeping dex order, the match against the ROM's internal order closes at <b>45 out of 45</b>, entry by entry. That is verification by position, far stronger than by name. The forty-sixth, <code>バケまる</code>, exists only on this cartridge and never had an official English name. And the cartridge talks to the handheld: through the <b>64GB Pak</b> it reads a Robopon cart and converts (<code>ＧＢコンバート</code>) what is on it into the 64 game, alongside story mode, the Battler Dome and the robot encyclopedia.","The rare property lives in the charset table at <code>0x19710D0</code>: <b>272 entries</b> of two bytes mapping index to Shift-JIS, and the <b>first 95 are the whole printable ASCII set</b>, <code>0x20</code> through <code>0x7E</code>, in order — punctuation, digits, <b>A-Z and a-z</b> — with the artwork already drawn in the game's font, <b>12×12 px, 4bpp, 72 bytes per glyph</b>. Checked entry by entry, <b>91 land on the exact fullwidth twin</b> and the other four are the classic JIS substitutions. This <b>came with the cartridge</b>: it is not work done here — our part was reading it. In the 8-bit cartridges of this same catalogue, drawing the alphabet was half the job — in Gozonji it was <b>83 Latin glyphs</b> burned over the kana slots, and in Monster Maker the entire font holds <b>three letters</b>, <code>H</code>, <code>M</code> and <code>P</code>. Here there is no code hack to write: translating means rewriting the strings. The font's offset, incidentally, was pinned by the emptiest evidence there is — glyph 0 is the <b>fullwidth space</b>, 72 zeroed bytes, so <code>！</code> beginning at <code>0x1971340</code> puts the font's first byte exactly 72 bytes earlier.","What squeezes here is not the ROM, it is the field. <b>There is no pointer table</b>: the text is a fixed field, base plus index times record size, and nothing relocates without touching the engine. There are <b>2,994 strings</b>, <b>16,572</b> usable Japanese characters, some 38 KB — an honest count because the extractor filters by <b>the game's own charset</b>, and a character outside those 272 entries is one the game will not draw, therefore not text. That matters because scanning by kana density <b>invents</b> text: the first measurements returned 7.6 MB and then 21 thousand characters, and both were false positives from textures and MIPS code read as Shift-JIS. Field capacity runs from <b>3 characters</b> to <b>272</b>, with a <b>median of 6</b>, and that is where 32 MB stops mattering. A Latin letter costs <b>two bytes</b>, the same as a kana, and draws in the same <b>12 px</b>: English pays no column at all, only field. And there are <b>two kinds of field</b>: <b>913 of the original strings have no zero after them at all</b>, filling the field to its end with fullwidth padding and sitting flush against the next data — writing a zero into one of those <b>cuts the sentence</b>. That is how <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> and <code>POWER</code> lost their numbers from the screen all at once, with the inserter having measured and approved. Only re-reading the assembled ROM caught it, which is why that re-read became a required step. This page moves along with the work."],"es":["<b>Hudson Soft</b>, Nintendo 64, cartucho de <b>32 MB</b>, y se quedó en Japón. Es la serie que Occidente conoció en la Game Boy Color como <b>Robopon</b>: colección de monstruos en la que el monstruo es una máquina, y el vocabulario lo delata — el bicho tiene <b>ATK, DEF, SPD, PWR, EP</b> y <b>RAM</b>, lo que se le carga son <b>piezas, software, semillas y comida</b>, y un estado de batalla puede <b>apagarle todo el software</b> de una vez. Son <b>46 robots</b>. Cuarenta y cinco vienen de la primera generación de la serie y llegan con los nombres que ella ya tiene en inglés — Sunny, Digger, Zap, Gidget —, y el emparejamiento no dependió de acertar ninguna traducción: filtrando la lista oficial por la columna de los que aparecen en la 64 y manteniendo el orden de la dex, la coincidencia con el orden interno de la ROM cierra <b>45 de 45</b>, entrada por entrada. Es verificación por posición, mucho más fuerte que por nombre. El cuadragésimo sexto, <code>バケまる</code>, solo existe en este cartucho y nunca tuvo nombre oficial en inglés. Y el cartucho habla con la portátil: por el <b>64GB Pak</b> lee un cartucho de Robopon y convierte (<code>ＧＢコンバート</code>) lo que hay allí al juego de 64, junto al modo historia, el Battler Dome y la enciclopedia de robots.","La propiedad rara está en la tabla de charset, en <code>0x19710D0</code>: <b>272 entradas</b> de dos bytes que mapean índice a Shift-JIS, y las <b>95 primeras son el ASCII imprimible entero</b>, de <code>0x20</code> a <code>0x7E</code> y en orden — puntuación, cifras, <b>A-Z y a-z</b> —, con el dibujo ya hecho en la fuente del juego, de <b>12×12 px, 4bpp, 72 bytes por glifo</b>. Comprobadas entrada por entrada, <b>91 caen en el gemelo fullwidth exacto</b> y las otras cuatro son las sustituciones clásicas del JIS. Esto <b>ya venía en el cartucho</b>: no es trabajo hecho aquí — lo nuestro fue leerlo. En los cartuchos de 8 bits de este mismo catálogo, dibujar el alfabeto era la mitad del trabajo — en el Gozonji fueron <b>83 glifos latinos</b> grabados sobre las casillas de kana, y en el Monster Maker la fuente entera tiene <b>tres letras</b>, <code>H</code>, <code>M</code> y <code>P</code>. Aquí no hay hack de código que escribir: traducir es reescribir las cadenas. El offset de la fuente, por cierto, se fijó con la evidencia más vacía que existe — el glifo 0 es el <b>espacio de ancho completo</b>, 72 bytes a cero, así que el <code>！</code> empezando en <code>0x1971340</code> pone el primer byte de la fuente exactamente 72 bytes antes.","Lo que aprieta no es la ROM, es el campo. <b>No hay tabla de punteros</b>: el texto es campo fijo, base más índice por el tamaño del registro, y nada se reubica sin tocar el motor. Son <b>2.994 cadenas</b>, <b>16.572 caracteres</b> japoneses útiles, unos 38 KB — cuenta honesta porque el extractor filtra por el <b>charset del propio juego</b>, y un carácter fuera de aquellas 272 entradas el juego no lo dibuja, luego no es texto. Eso importa porque el barrido por densidad de kana <b>inventa</b>: las primeras mediciones devolvieron 7,6 MB y luego 21 mil caracteres, y las dos eran falso positivo de textura y de código MIPS leído como Shift-JIS. La capacidad de los campos va de <b>3 caracteres</b> a <b>272</b>, con <b>mediana de 6</b>, y es ahí donde los 32 MB dejan de importar. La letra latina cuesta <b>dos bytes</b>, igual que un kana, y dibuja en los mismos <b>12 px</b>: el inglés no paga ni una columna, solo campo. Y hay <b>dos tipos de campo</b>: <b>913 cadenas del original no llevan ningún cero detrás</b>, llenan el campo hasta el final con espacio de ancho completo y quedan pegadas al dato siguiente — escribir un cero en una de esas <b>corta la frase</b>. Así fue como <code>ATK</code>, <code>DEF</code>, <code>SPD</code>, <code>RAM</code>, <code>EP</code> y <code>POWER</code> perdieron el número de la pantalla de una vez, con el insertador habiendo medido y aprobado. Solo la relectura de la ROM montada lo detectó, y por eso se volvió etapa obligatoria. Esta página avanza junto con el trabajo."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"robopon-64-en.bps","tamanho":"950 KB"},"pt":null,"es":null},"rom":"Robot Poncots 64 (Japan).z64","rom_md5":"444f70a655ac89ca900f6fafaf926b16"},"fotos":[{"f":"robopon/00-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logo novo em inglês, por cima da cena 3D do jogo.","en":"The new English logo, over the game's 3D scene.","es":"El logo nuevo en inglés, sobre la escena 3D del juego."}},{"f":"robopon/01-batalha.png","t":{"pt":"Batalha","en":"Battle","es":"Combate"},"c":{"pt":"O HUD do combate, com os medidores e o comando.","en":"The battle HUD, with the meters and the command.","es":"El HUD del combate, con los medidores y el comando."}},{"f":"robopon/02-combate.png","t":{"pt":"Ataque","en":"Attack","es":"Ataque"},"c":{"pt":"Um robô no ringue.","en":"A robot in the ring.","es":"Un robot en el ring."}},{"f":"robopon/03-arena.png","t":{"pt":"A arena","en":"The arena","es":"La arena"},"c":{"pt":"Os dois treinadores, um de cada lado.","en":"The two trainers, one on each side.","es":"Los dos entrenadores, uno a cada lado."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"andamento","testes":"andamento","longplay":"nao"}},{"slug":"ninja-burai-densetsu","nome":"Ninja Burai Densetsu","subtitulo":"忍者武雷伝説","jp":"忍者武雷伝説","publisher":"Sega","dev":"Sega","ano":1991,"data":"1991","sistema":"Mega Drive","mapper":"68000 · 1 MB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"burai/00-capa-patreon.jpg","linha":{"pt":"RPG tático de ninjas no Mega Drive — e o herói é o menino europeu que sobreviveu ao naufrágio de uma nau nanban na costa do Tōhoku.","en":"A ninja tactics RPG on the Mega Drive — and the hero is the European boy who survived the wreck of a nanban ship on the Tōhoku coast.","es":"RPG táctico de ninjas en la Mega Drive — y el héroe es el niño europeo que sobrevivió al naufragio de una nao nanban en la costa de Tōhoku."},"resumo":{"pt":["Sega, 1991. Quem cresceu com o console associa a Sega a jogo de ação; este é um <b>RPG tático</b> de unidades em grade, com <b>sete classes</b>, morte permanente e prazo de dias para fechar cada capítulo — e a vida de cada soldado aparece em <b>velas acesas</b>, não em números. O guia oficial da época, <i>テレビランドわんぱっく</i> nº 135, de <b>101 páginas</b>, conta o enredo que o cartucho pressupõe: há <b>450 anos</b> uma <b>nau nanban</b> encalha na costa, e dela sobrevivem o tripulante <b>ジョン (John)</b>, escrito em katakana, e um menino de três anos. Nobunaga mata John; o ninja <b>影刀</b> recolhe o menino e o cria como ninja, com o nome de <b>武雷 (Burai)</b>; doze anos depois ele parte com três companheiros. A caixa japonesa, que traz ruby em todo kanji, fecha a premissa: Nobunaga <b>sucumbiu ao poder mágico da espada Kusanagi</b> e virou <b>妖魔</b> — o que amarra o vilão a um item, porque <b>草薙</b> é a única espada que a tabela de armas do guia lista <i>sem preço</i>.","É o primeiro <b>68000</b> desta casa — outra arquitetura de processador, não uma variação do 6502. Tem <b>1.048.576 bytes</b>, dos quais <b>644 KB são assets comprimidos</b> em dois formatos, ambos reimplementados a partir da desmontagem: um <b>Huffman de 256 entradas com RLE de nibbles</b> para os gráficos e um <b>LZ sobre índices de tile</b> para os tilemaps. E o roteiro não existe como texto: <b>nenhuma varredura acha kana codificado</b> na ROM, em nenhuma das duas compressões. Cada cena carrega um bloco comprimido com os <b>tiles 8×8 únicos da tela composta, em ordem raster</b> — medido num deles, <b>413 tiles, 413 distintos, zero repetidos</b> — e o tilemap guarda a ordem em que eles se remontam. <b>A identidade dos caracteres está nos bitmaps, a ordem está nos tilemaps.</b> Pareados os dois na largura que o próprio blitter pede, <b>31 tiles por 4</b>, a tela sai legível — foi assim que o roteiro foi lido pela primeira vez. Fica registrado, do caminho, o número que se desmentiu sozinho: uma varredura bruta de ponteiros achou <b>1.611 candidatos</b> para a região comprimida, e eles cobriam <b>103% dela</b>.","A leitura tem conferência de fora, e ela corrigiu palpites. Os <b>dez capítulos</b> lidos dos tilemaps batem <b>letra por letra</b> com o índice do guia, inclusive o primeiro, que estava marcado como duvidoso; nove dos dez são <b>distritos históricos reais de Mutsu e Dewa</b>, o que põe o jogo no <b>Tōhoku</b> e não em Kyoto. Mas o furigana dos cabeçalhos cravou leituras que a dedução errava: <b>刈田 é <i>Karita</i> aqui e Katta no mapa histórico</b>, 雄勝 é <i>Okatsu</i> e 羽尾 é <i>Uo</i> — leitura de topônimo de jogo não se deduz do mapa. O aperto do cartucho é a <b>coluna</b>: o caractere japonês é <b>16×16</b>, ou seja 2×2 tiles, e a caixa comporta <b>15 caracteres por linha</b>; a fonte base do jogo, já residente no tile <code>0x380</code>, tem <b>129 glifos de 8×8</b> e traz o <b>A-Z</b> gravado desde 1991, e com ela a mesma caixa passa a caber <b>31</b>. O vocabulário segue o guia: <b>Masamune</b> e <b>Muramasa</b> são os dois ferreiros que a história japonesa consagrou, a <b>Tanegashima</b> é a ilha onde os portugueses introduziram o arcabuz em 1543, e magatama, espelho e Kusanagi são as três insígnias imperiais. Os níveis de técnica contam-se em <b>段</b>: <code>1st Dan</code>, e não <code>Level 1</code>. O <b>patch alfa</b> já sai pela página do Patreon: põe em inglês a tela de título, os menus, a barra lateral e a janela de status — onde o nível aparece como <code>1 DAN</code>. O roteiro segue em japonês."],"en":["Sega, 1991. Anyone who grew up with the console associates Sega with action games; this is a <b>tactical RPG</b> of units on a grid, with <b>seven classes</b>, permanent death and a deadline in days for each chapter — and every soldier's health shows as <b>lit candles</b>, not numbers. The period strategy guide, <i>テレビランドわんぱっく</i> no. 135, <b>101 pages</b>, tells the story the cartridge takes for granted: <b>450 years</b> ago a <b>nanban ship</b> runs aground on the coast, and from it survive the crewman <b>ジョン (John)</b>, written in katakana, and a three-year-old boy. Nobunaga kills John; the ninja <b>影刀</b> takes the boy in and raises him as a ninja under the name <b>武雷 (Burai)</b>; twelve years later he sets out with three companions. The Japanese box, which carries ruby over every kanji, completes the premise: Nobunaga <b>fell to the magic of the sword Kusanagi</b> and became a <b>妖魔</b> — which ties the villain to an item, because <b>草薙</b> is the one sword the guide's weapon table lists <i>with no price</i>.","It is this house's first <b>68000</b> — a different processor architecture, not a variation on the 6502. It holds <b>1,048,576 bytes</b>, of which <b>644 KB are compressed assets</b> in two formats, both reimplemented from the disassembly: a <b>256-entry Huffman with nibble RLE</b> for graphics and an <b>LZ over tile indices</b> for tilemaps. And the script does not exist as text: <b>no scan finds encoded kana</b> in the ROM, under either compression. Each scene carries a compressed block holding the <b>unique 8×8 tiles of the composed screen, in raster order</b> — measured in one of them, <b>413 tiles, 413 distinct, zero repeats</b> — and the tilemap holds the order in which they are reassembled. <b>The identity of the characters is in the bitmaps, the order is in the tilemaps.</b> Pair the two at the width the blitter itself asks for, <b>31 tiles by 4</b>, and the screen comes out readable — that is how the script was read for the first time. From that road, one number is worth recording because it refuted itself: a brute pointer scan turned up <b>1,611 candidates</b> for the compressed region, and they covered <b>103% of it</b>.","The reading has an outside check, and the check corrected guesses. The <b>ten chapters</b> read from the tilemaps match the guide's index <b>letter for letter</b>, including the first one, which had been flagged as doubtful; nine of the ten are <b>real historical districts of Mutsu and Dewa</b>, which places the game in <b>Tōhoku</b> rather than Kyoto. But the ruby over the chapter headings pinned readings that deduction had got wrong: <b>刈田 is <i>Karita</i> here and Katta on the historical map</b>, 雄勝 is <i>Okatsu</i> and 羽尾 is <i>Uo</i> — a game's place names are not deduced from the atlas. The cartridge's squeeze is the <b>column</b>: a Japanese character is <b>16×16</b>, that is 2×2 tiles, and the box holds <b>15 characters per line</b>; the game's base font, already resident at tile <code>0x380</code>, has <b>129 glyphs at 8×8</b> and carries <b>A-Z</b> burned in since 1991, and with it the same box holds <b>31</b>. The vocabulary follows the guide: <b>Masamune</b> and <b>Muramasa</b> are the two swordsmiths Japanese history remembers, <b>Tanegashima</b> is the island where the Portuguese brought in the arquebus in 1543, and magatama, mirror and Kusanagi are the three imperial regalia. Technique ranks are counted in <b>段</b>: <code>1st Dan</code>, not <code>Level 1</code>. The <b>alpha patch</b> is out through the Patreon page: it puts the title screen, the menus, the sidebar and the status window into English — where the rank reads <code>1 DAN</code>. The script is still in Japanese."],"es":["Sega, 1991. Quien creció con la consola asocia Sega a los juegos de acción; este es un <b>RPG táctico</b> de unidades sobre cuadrícula, con <b>siete clases</b>, muerte permanente y un plazo en días para cerrar cada capítulo — y la vida de cada soldado aparece en <b>velas encendidas</b>, no en números. La guía de la época, <i>テレビランドわんぱっく</i> nº 135, de <b>101 páginas</b>, cuenta la historia que el cartucho da por sabida: hace <b>450 años</b> una <b>nao nanban</b> encalla en la costa, y de ella sobreviven el tripulante <b>ジョン (John)</b>, escrito en katakana, y un niño de tres años. Nobunaga mata a John; el ninja <b>影刀</b> recoge al niño y lo cría como ninja, con el nombre de <b>武雷 (Burai)</b>; doce años después parte con tres compañeros. La caja japonesa, que lleva ruby sobre cada kanji, cierra la premisa: Nobunaga <b>sucumbió al poder mágico de la espada Kusanagi</b> y se volvió <b>妖魔</b> — lo que ata al villano a un objeto, porque <b>草薙</b> es la única espada que la tabla de armas de la guía lista <i>sin precio</i>.","Es el primer <b>68000</b> de esta casa — otra arquitectura de procesador, no una variación del 6502. Tiene <b>1.048.576 bytes</b>, de los cuales <b>644 KB son recursos comprimidos</b> en dos formatos, los dos reimplementados a partir del desensamblado: un <b>Huffman de 256 entradas con RLE de nibbles</b> para los gráficos y un <b>LZ sobre índices de tile</b> para los tilemaps. Y el guion no existe como texto: <b>ningún barrido encuentra kana codificado</b> en la ROM, en ninguna de las dos compresiones. Cada escena carga un bloque comprimido con los <b>tiles de 8×8 únicos de la pantalla compuesta, en orden ráster</b> — medido en uno de ellos, <b>413 tiles, 413 distintos, cero repetidos</b> — y el tilemap guarda el orden en el que se vuelven a montar. <b>La identidad de los caracteres está en los bitmaps, el orden está en los tilemaps.</b> Emparejados los dos en el ancho que pide el propio blitter, <b>31 tiles por 4</b>, la pantalla sale legible — así se leyó el guion por primera vez. Del camino queda registrado el número que se desmintió solo: un barrido bruto de punteros encontró <b>1.611 candidatos</b> para la región comprimida, y cubrían el <b>103%</b> de ella.","La lectura tiene comprobación de fuera, y la comprobación corrigió conjeturas. Los <b>diez capítulos</b> leídos de los tilemaps coinciden <b>letra por letra</b> con el índice de la guía, incluido el primero, que estaba marcado como dudoso; nueve de los diez son <b>distritos históricos reales de Mutsu y Dewa</b>, lo que sitúa el juego en el <b>Tōhoku</b> y no en Kioto. Pero el furigana de los encabezados fijó lecturas que la deducción erraba: <b>刈田 aquí es <i>Karita</i> y en el mapa histórico es Katta</b>, 雄勝 es <i>Okatsu</i> y 羽尾 es <i>Uo</i> — el topónimo de un juego no se deduce del atlas. Lo que aprieta en el cartucho es la <b>columna</b>: el carácter japonés es de <b>16×16</b>, o sea 2×2 tiles, y la caja admite <b>15 caracteres por línea</b>; la fuente base del juego, ya residente en el tile <code>0x380</code>, tiene <b>129 glifos de 8×8</b> y trae la <b>A-Z</b> grabada desde 1991, y con ella la misma caja pasa a admitir <b>31</b>. El vocabulario sigue a la guía: <b>Masamune</b> y <b>Muramasa</b> son los dos forjadores de espadas que la historia japonesa recuerda, <b>Tanegashima</b> es la isla donde los portugueses introdujeron el arcabuz en 1543, y magatama, espejo y Kusanagi son las tres insignias imperiales. Los niveles de técnica se cuentan en <b>段</b>: <code>1st Dan</code>, y no <code>Level 1</code>. El <b>parche alfa</b> ya sale por la página de Patreon: pone en inglés la pantalla de título, los menús, la barra lateral y la ventana de estado — donde el nivel aparece como <code>1 DAN</code>. El guion sigue en japonés."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"ninja-burai-densetsu-en.ips","tamanho":"17 KB"},"pt":null,"es":null},"rom":"Ninja Burai Densetsu (Japan).md","rom_md5":"d1263fb5efd1af669a0df2a45689c3f5"},"fotos":[{"f":"burai/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O título redesenhado em inglês, LEGEND OF THE NINJA, com o endereço da casa no rodapé.","en":"The title redrawn in English, LEGEND OF THE NINJA, with the house address at the foot.","es":"El título redibujado en inglés, LEGEND OF THE NINJA, con la dirección de la casa al pie."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"nao","arte":"andamento","testes":"andamento","longplay":"nao"}},{"slug":"monster-maker","nome":"Monster Maker","subtitulo":"7 Tsu no Hihou","jp":"モンスターメーカー 7つの秘宝","traducao_titulo":"The Seven Treasures","publisher":"Sofel","dev":"U-Kikaku · Show-Kikaku","ano":1991,"data":"1991","sistema":"Famicom","mapper":"MMC1 · 256 KB PRG expandido para 512 KB · CHR-RAM de 8 KB · save com bateria","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"mm/00-capa-patreon.jpg","linha":{"pt":"A fonte do cartucho tinha três letras latinas. O motor de texto alcançava 48 KB. O inglês pedia 49,6.","en":"The cartridge font held three Latin letters. The text engine reached 48 KB. The English asked for 49.6.","es":"La fuente del cartucho tenía tres letras latinas. El motor de texto alcanzaba 48 KB. El inglés pedía 49,6."},"resumo":{"pt":["<i>Monster Maker</i> nasceu como jogo de cartas japonês — monstro, tesouro e masmorra distribuídos carta a carta — e foi popular o bastante para virar RPG de Famicom em <i>7 Tsu no Hihou</i>, os sete tesouros. Fora do Japão o nome não diz nada a ninguém, e é exatamente esse o tipo de cartucho que some da história por não ter idioma, não por não prestar. Ele salva em bateria e abre com um prólogo que começa em <code>はるかなる むかし</code>, num tempo muito distante, antes de perguntar se você começa do zero ou retoma um dos dois livros do tempo.","A fonte tinha <b>512 tiles</b> e exatamente <b>três letras latinas</b> — <b>H</b>, <b>M</b> e <b>P</b>, as de HP e MP. O alfabeto inteiro foi desenhado e <b>77 tiles</b> foram reescritos sobre as casas de kana; o plano 1 de cada letra é o plano 0 invertido, e é por isso que a segunda metade da fonte inteira cabe em <b>oito bytes</b>. Os <b>1.386 blocos</b> do roteiro saíram do cartucho, <b>1.370 deles com texto para traduzir</b>, e hoje estão em inglês dentro da ROM — junto com <b>266 nomes</b> de item, magia, monstro e loja, que o menu acha por tabela de ponteiros.","O obstáculo não era o espaço, era o endereçamento. <b>Toda referência de texto deste motor cabe em 16 bits, e dois deles são o banco</b>: o jogo inteiro só enxerga <b>48 KB</b> de texto, e o inglês pedia <b>49,6 KB</b>. A saída foi deixar no lugar de cada fala um atalho de <b>quatro bytes</b> — assim nenhum ponteiro de evento precisou ser tocado, e eles estão espalhados por tabelas que ninguém mapeou — e mandar o texto para oito bancos da expansão, <b>128 KB</b>, alcançados por um roteador que ocupa <b>zero byte</b> do banco fixo: ele entra trocando os três bytes de uma chamada distante que já existia. <b>O patch ainda não está no ar</b>: falta jogar o jogo do começo ao fim, que é a única coisa que medição nenhuma substitui."],"en":["<i>Monster Maker</i> began as a Japanese card game — monster, treasure and dungeon dealt card by card — and was popular enough to become a Famicom RPG in <i>7 Tsu no Hihou</i>, the seven treasures. Outside Japan the name means nothing to anyone, and that is exactly the sort of cartridge that vanishes from history for having no language rather than for being no good. It saves to battery and opens on a prologue beginning <code>はるかなる むかし</code>, in a time long past, before asking whether you start from scratch or resume one of the two books of time.","The font held <b>512 tiles</b> and exactly <b>three Latin letters</b> — <b>H</b>, <b>M</b> and <b>P</b>, the ones from HP and MP. The whole alphabet was drawn and <b>77 tiles</b> rewritten over the kana slots; plane 1 of every letter is plane 0 inverted, which is why the entire second half of the font fits in <b>eight bytes</b>. The script's <b>1,386 blocks</b> came out of the cartridge, <b>1,370 of them with text to translate</b>, and today they sit in the ROM in English — along with <b>266 names</b> of items, spells, monsters and shops, which the menu finds through pointer tables.","The obstacle was not space, it was addressing. <b>Every text reference in this engine fits in 16 bits, and two of them are the bank</b>: the whole game can only see <b>48 KB</b> of text, and the English asked for <b>49.6 KB</b>. The way out was to leave a <b>four-byte</b> shortcut where each line used to be — so not one event pointer had to be touched, and they are scattered through tables nobody has mapped — and send the text to eight banks of the expansion, <b>128 KB</b>, reached by a router that costs <b>zero bytes</b> of the fixed bank: it goes in by replacing the three inline bytes of a far call that was already there. <b>The patch is not out yet</b>: the game still has to be played end to end, which is the one thing no measurement replaces."],"es":["<i>Monster Maker</i> nació como juego de cartas japonés — monstruo, tesoro y mazmorra repartidos carta a carta — y fue popular lo bastante para convertirse en RPG de Famicom en <i>7 Tsu no Hihou</i>, los siete tesoros. Fuera de Japón el nombre no le dice nada a nadie, y ese es exactamente el tipo de cartucho que desaparece de la historia por no tener idioma, no por no valer. El cartucho guarda con pila y abre con un prólogo que empieza en <code>はるかなる むかし</code>, en un tiempo muy lejano, antes de preguntar si empiezas de cero o retomas uno de los dos libros del tiempo.","La fuente tenía <b>512 tiles</b> y exactamente <b>tres letras latinas</b> — <b>H</b>, <b>M</b> y <b>P</b>, las de HP y MP. Se dibujó el alfabeto entero y se reescribieron <b>77 tiles</b> sobre las casillas de kana; el plano 1 de cada letra es el plano 0 invertido, y por eso la segunda mitad de la fuente entera cabe en <b>ocho bytes</b>. Los <b>1.386 bloques</b> del guion salieron del cartucho, <b>1.370 de ellos con texto que traducir</b>, y hoy están en inglés dentro de la ROM — junto con <b>266 nombres</b> de objeto, magia, monstruo y tienda, que el menú encuentra por tabla de punteros.","El obstáculo no era el espacio, era el direccionamiento. <b>Toda referencia de texto de este motor cabe en 16 bits, y dos de ellos son el banco</b>: el juego entero solo ve <b>48 KB</b> de texto, y el inglés pedía <b>49,6 KB</b>. La salida fue dejar en el lugar de cada frase un atajo de <b>cuatro bytes</b> — así no hubo que tocar ni un puntero de evento, y están repartidos por tablas que nadie ha mapeado — y mandar el texto a ocho bancos de la ampliación, <b>128 KB</b>, alcanzados por un enrutador que ocupa <b>cero bytes</b> del banco fijo: entra cambiando los tres bytes de una llamada lejana que ya existía. <b>El parche aún no está publicado</b>: falta jugar el juego de principio a fin, que es lo único que ninguna medición sustituye."]},"numeros":[{"v":"1.370","r":{"pt":"falas do roteiro em inglês","en":"lines of script in English","es":"frases del guion en inglés"}},{"v":"266","r":{"pt":"nomes de item, magia e monstro","en":"item, spell and monster names","es":"nombres de objeto, magia y monstruo"}},{"v":"128 KB","r":{"pt":"de texto alcançável, contra 48 do motor original","en":"of reachable text, against the engine's original 48","es":"de texto alcanzable, frente a los 48 del motor original"}}],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"monster-maker-en.ips","tamanho":"267 KB"},"pt":null,"es":null},"rom":"Monster Maker - 7 Tsu no Hihou (Japan).nes","rom_md5":"b10e90e81f3bdbe5a232ee34d746327e"},"fotos":[{"f":"mm/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O subtítulo já em inglês: <code>THE SEVEN TREASURES</code>.","en":"The subtitle already in English: <code>THE SEVEN TREASURES</code>.","es":"El subtítulo ya en inglés: <code>THE SEVEN TREASURES</code>."}},{"f":"mm/02-prologo.png","t":{"pt":"O prólogo em inglês","en":"The prologue in English","es":"El prólogo en inglés"},"c":{"pt":"A caixa mede <b>26 colunas por três linhas</b> — a linha que sobra entre elas é onde o japonês desenhava o dakuten.","en":"The box measures <b>26 columns by three lines</b> — the spare line between them is where Japanese drew the dakuten.","es":"La caja mide <b>26 columnas por tres líneas</b> — la línea que sobra entre ellas es donde el japonés dibujaba el dakuten."}},{"f":"mm/03-templo.png","t":{"pt":"O templo do deus mau","en":"The temple of the evil god","es":"El templo del dios malo"},"c":{"pt":"Cada uma destas frases mora num banco que o motor original não alcançava: no lugar dela ficou um atalho de quatro bytes.","en":"Every one of these lines lives in a bank the original engine could not reach: what stayed behind is a four-byte shortcut.","es":"Cada una de estas frases vive en un banco que el motor original no alcanzaba: en su lugar quedó un atajo de cuatro bytes."}}],"etapas":{"direcao":"feito","traducao":"andamento","revisao":"nao","arte":"feito","testes":"andamento","longplay":"nao"}},{"slug":"shining-force-gaiden","nome":"Shining Force Gaiden","subtitulo":"Ensei, Jashin no Kuni e","jp":"シャイニング・フォース外伝 ～遠征・邪神の国へ～","publisher":"Sega","dev":"Sonic! Software Planning","ano":1992,"data":"1992","sistema":"Game Gear","mapper":"Mapper Sega padrão · 512 KB expandido para 1 MB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"sfg/01-titulo.png","linha":{"pt":"O Shining Force que nunca ganhou roteiro em inglês: um exército em grade no Game Gear, 22 batalhas, e uma expedição à terra do deus maligno.","en":"The Shining Force that never got an English script: a Game Gear army moving across a grid, 22 battles, and an expedition to the land of the evil god.","es":"El Shining Force que nunca tuvo guion en inglés: un ejército por casillas en la Game Gear, 22 batallas y una expedición a la tierra del dios maligno."},"resumo":{"pt":["<b>Sega, 1992, Game Gear.</b> Não é uma fila de heróis com um menu de comandos: é um <b>tabuleiro</b>. Cada soldado do seu exército anda por uma grade, um por vez, o turno fecha quando todos agiram, e cada classe promove para uma superior — <i>Swordsman</i> vira <i>Hero</i>, <i>Knight</i> vira <i>Paladin</i>, <i>Archer</i> vira <i>Sniper</i>. São <b>22 batalhas</b> em quatro capítulos, e a coisa abre na corte de <b>Anri, rainha de Gardiana</b>, com a chegada de emissários de Cypress; o subtítulo já diz para onde se vai — <b>遠征・邪神の国へ</b>, a expedição à terra do deus maligno. <b>外伝</b> se lê <i>gaiden</i> e quer dizer história paralela: no Japão, a série grande entrega ao portátil um capítulo que ela não vai contar. Este é o capítulo que o Ocidente não recebeu em cartucho — embora tenha recebido a história. O remake de Sega CD saiu em inglês nos Estados Unidos e na Europa, e o <i>Book 1</i> dele é este jogo: a caixa capturada na abertura, um soldado anunciando emissários diante da rainha, é a cena com que o Book 1 abre. É o único jogo da série Shining que nunca teve roteiro em inglês — o <i>Gaiden 2</i> a própria Sega localizou, o <i>Gaiden 3</i> tem tradução de fã.","A fonte do cartucho tinha <b>dez letras latinas</b> — A D F G H L M P T V, exatamente o que as abreviaturas de atributo pediam. Sem B, sem C, sem E, sem R, sem S, e sem uma minúscula sequer: com a fonte de texto do jogo não se escrevia <i>Shining Force</i> dentro de uma caixa de diálogo. As <b>16 maiúsculas</b> ausentes foram desenhadas no estilo medido nas dez que já estavam lá — <b>7 px</b> de largura, traço de <b>2 px</b> —, e depois entrou o <b>a-z inteiro</b> mais um <b>ponto de linha de base</b>, porque o ponto do cartucho é o japonês, centralizado na altura da letra. Todas moram por cima do kana, no mesmo lugar, sem disputar espaço com nada. O efeito é o que se lê na tela: um item deixou de sair como <code>MEDICALHRB</code> e sai <code>MedicalHrb</code>, e as <b>719 mensagens</b> que o motor de diálogo endereça estão em caixa de frase. O texto também coube porque <b>pagina, e não porque foi encurtado</b>: a caixa aceita <b>18</b> caracteres por linha e três linhas, <b>54</b> por tela, e quase metade das falas de história passava disso. A paginação vai no único, entre quatro códigos de controle parecidos, que de fato limpa a caixa — os outros esperam <b>20</b> quadros, <b>60</b> quadros, ou o botão. E a conferência foi de tela, não de planilha: a ROM correu vinte mil quadros com a nametable decodificada, para ler o que estava escrito ali.","Nada disso era legível de fora. O texto é <b>Huffman de ordem 1</b> — o caractere que acabou de sair escolhe a árvore que decodifica o próximo —, e por isso a região mede <b>7,69</b> a <b>7,77</b> de entropia onde o código Z80 do mesmo cartucho mede <b>5,05</b> a <b>6,78</b>: a compressão era ao mesmo tempo o que escondia o texto e o que denunciava onde ele estava. Refazer as árvores para recomprimir teria custado o projeto, então trocou-se a leitura: os <b>140 bytes</b> do descompressor deram lugar a um leitor de texto em claro de <b>25</b> e a um endereçador de <b>33</b>. <b>Descomprimir era obrigatório para ler o japonês; comprimir nunca foi obrigatório para escrever.</b> A ROM foi de <b>512 KB</b> para <b>1 MB</b>, e o inglês, que dá <b>2,06×</b> o japonês comprimido, foi morar em bancos que o cartucho não tinha — não cabia nos <b>14.310 bytes</b> em que o japonês morava. A varredura ainda foi conferida contra si mesma: outros nove bancos têm entropia igualmente alta e nenhum guarda texto, o que só se pôde afirmar medindo contra um <b>controle negativo</b>. E os <b>190 nomes</b> de classe, item, arma, magia, personagem e monstro, cada um preso a um campo de <b>10</b> caracteres medido no código, foram auditados contra as listas oficiais e contra o manual japonês de <b>24 páginas</b> publicado pela própria Sega — que pegou o que nenhuma medição pegaria: a Sega <b>renomeou</b> personagens. バリー não é Barry, é <b>Claude</b>; テディ não é Teddy, é <b>Gyan</b>. A ponte foi a classe, porque de cada uma existe um único personagem. A auditoria achou <b>5</b> nomes errados, dois deles <b>trocados um pelo outro</b> — a assinatura do erro por som, que verificação de existência nenhuma acusa. Onde a Sega errou a digitação, <code>Wodden Sword</code>, a grafia certa ficou: nome próprio de série se copia, erro de digitação não. Esta página acompanha o trabalho."],"en":["<b>Sega, 1992, Game Gear.</b> This is not a row of heroes and a command menu: it is a <b>board</b>. Each soldier in your army moves across a grid, one at a time, the turn closes when everyone has acted, and every class promotes into a higher one — <i>Swordsman</i> becomes <i>Hero</i>, <i>Knight</i> becomes <i>Paladin</i>, <i>Archer</i> becomes <i>Sniper</i>. There are <b>22 battles</b> across four chapters, and it opens at the court of <b>Anri, Queen of Gardiana</b>, as envoys from Cypress arrive; the subtitle already names the destination — <b>遠征・邪神の国へ</b>, the expedition to the land of the evil god. <b>外伝</b> reads <i>gaiden</i> and means side story: in Japan the big series hands the handheld a chapter it will not tell itself. This is the chapter the West never got as a cartridge — though it did get the story. The Sega CD remake shipped in English in the United States and Europe, and its <i>Book 1</i> is this game: the box captured in the opening, a soldier announcing envoys before the queen, is the scene Book 1 opens with. It is the one game in the Shining series that never had an English script — <i>Gaiden 2</i> Sega localised itself, <i>Gaiden 3</i> has a fan translation.","The cartridge font held <b>ten Latin letters</b> — A D F G H L M P T V, exactly what the stat abbreviations needed. No B, no C, no E, no R, no S, and not a single lowercase: with the game's own text font you could not write <i>Shining Force</i> inside a dialogue box. The other <b>16</b> capitals were drawn in the style measured off the ten already there — <b>7 px</b> wide, a <b>2 px</b> stroke — and then came the <b>whole a-z</b> plus a <b>baseline period</b>, because the cartridge's period is the Japanese one, centred at mid-letter height. They all live on top of the kana, in the same place, competing with nothing. The effect is what you read on screen: an item that used to come out <code>MEDICALHRB</code> now comes out <code>MedicalHrb</code>, and the <b>719 messages</b> the dialogue engine addresses are in sentence case. The text also fits because it <b>paginates rather than being cut short</b>: the box takes <b>18</b> characters a line and three lines, <b>54</b> to a screen, and nearly half the story lines ran past that. Pagination uses the one control code, out of four lookalikes, that actually clears the box — the others wait <b>20</b> frames, <b>60</b> frames, or a button press. And the checking was done on screen, not on a spreadsheet: the ROM ran twenty thousand frames with the nametable decoded, to read what was actually written there.","None of it was readable from outside. The text is <b>order-1 Huffman</b> — the character just decoded picks the tree that decodes the next one — which is why the region measures <b>7.69</b> to <b>7.77</b> of entropy where the same cartridge's Z80 code measures <b>5.05</b> to <b>6.78</b>: the compression was both what hid the text and what gave away where it lived. Rebuilding the trees to recompress would have cost the project, so the reading was swapped instead: the decompressor's <b>140 bytes</b> gave way to a plain-text reader of <b>25</b> and an addresser of <b>33</b>. <b>Decompressing was mandatory to read the Japanese; compressing was never mandatory to write.</b> The ROM went from <b>512 KB</b> to <b>1 MB</b>, and the English, which comes to <b>2.06×</b> the compressed Japanese, went to live in banks the cartridge never had — it did not fit in the <b>14,310 bytes</b> where the Japanese lived. The sweep was also checked against itself: nine other banks are just as high in entropy and none of them holds text, which could only be asserted by measuring against a <b>negative control</b>. And the <b>190 names</b> of classes, items, weapons, spells, characters and monsters, each one held to a <b>10</b>-character field measured in the code, were audited against the official lists and against the <b>24-page</b> Japanese manual Sega itself published — which caught what no measurement would: Sega <b>renamed</b> characters. バリー is not Barry, it is <b>Claude</b>; テディ is not Teddy, it is <b>Gyan</b>. The bridge was class, because only one character holds each. The audit found <b>5</b> names wrong, two of them <b>swapped with each other</b> — the signature of translating by sound, which no existence check can flag. Where Sega mistyped, <code>Wodden Sword</code>, the correct spelling stayed: a series' proper nouns get copied, its typos do not. This page follows the work."],"es":["<b>Sega, 1992, Game Gear.</b> No es una fila de héroes con un menú de comandos: es un <b>tablero</b>. Cada soldado de tu ejército avanza por una cuadrícula, de uno en uno, el turno se cierra cuando todos han actuado, y cada clase asciende a una superior — <i>Swordsman</i> pasa a <i>Hero</i>, <i>Knight</i> a <i>Paladin</i>, <i>Archer</i> a <i>Sniper</i>. Son <b>22 batallas</b> en cuatro capítulos, y la cosa empieza en la corte de <b>Anri, reina de Gardiana</b>, con la llegada de unos emisarios de Cypress; el subtítulo ya dice adónde se va — <b>遠征・邪神の国へ</b>, la expedición a la tierra del dios maligno. <b>外伝</b> se lee <i>gaiden</i> y quiere decir historia paralela: en Japón, la serie grande le entrega a la portátil un capítulo que ella no va a contar. Este es el capítulo que Occidente no recibió en cartucho — aunque sí recibió la historia. El remake de Sega CD salió en inglés en Estados Unidos y en Europa, y su <i>Book 1</i> es este juego: la caja de texto capturada en la apertura, un soldado anunciando emisarios ante la reina, es la escena con la que abre el Book 1. Es el único juego de la serie Shining que nunca tuvo guion en inglés — el <i>Gaiden 2</i> lo localizó la propia Sega, y el <i>Gaiden 3</i> tiene traducción de aficionados.","La fuente del cartucho tenía <b>diez letras latinas</b> — A D F G H L M P T V, exactamente las que pedían las abreviaturas de atributo. Sin B, sin C, sin E, sin R, sin S, y sin una sola minúscula: con la fuente de texto del juego no se podía escribir <i>Shining Force</i> dentro de una caja de diálogo. Las <b>16 mayúsculas</b> que no estaban se dibujaron en el estilo medido en las diez que sí estaban — <b>7 px</b> de ancho, trazo de <b>2 px</b> —, y después entró <b>toda la a-z</b> más un <b>punto a la altura de la línea base</b>, porque el punto del cartucho es el japonés, centrado a media altura de la letra. Todas viven encima del kana, en el mismo sitio, sin disputarle el espacio a nada. El efecto es lo que se lee en pantalla: un objeto que salía <code>MEDICALHRB</code> ahora sale <code>MedicalHrb</code>, y los <b>719 mensajes</b> que direcciona el motor de diálogo están en caja alta y baja. El texto también cabe porque <b>pagina, y no porque se haya acortado</b>: la caja admite <b>18</b> caracteres por línea y tres líneas, <b>54</b> por pantalla, y casi la mitad de las frases de historia pasaba de ahí. La paginación va en el único de cuatro códigos de control parecidos que de verdad limpia la caja — los otros esperan <b>20</b> fotogramas, <b>60</b> fotogramas, o el botón. Y la comprobación fue de pantalla, no de hoja de cálculo: la ROM estuvo en marcha veinte mil fotogramas con la nametable decodificada, para leer lo que había escrito ahí.","Nada de esto era legible desde fuera. El texto es <b>Huffman de orden 1</b> — el carácter que acaba de salir elige el árbol que decodifica el siguiente —, y por eso la región mide entre <b>7,69</b> y <b>7,77</b> de entropía donde el código Z80 del mismo cartucho mide entre <b>5,05</b> y <b>6,78</b>: la compresión era a la vez lo que escondía el texto y lo que delataba dónde estaba. Rehacer los árboles para volver a comprimir habría costado el proyecto, así que se cambió la lectura: los <b>140 bytes</b> del descompresor dejaron sitio a un lector de texto en claro de <b>25</b> y a un direccionador de <b>33</b>. <b>Descomprimir era obligatorio para leer el japonés; comprimir nunca fue obligatorio para escribir.</b> La ROM pasó de <b>512 KB</b> a <b>1 MB</b>, y el inglés, que ocupa <b>2,06×</b> el japonés comprimido, se fue a vivir a bancos que el cartucho no tenía — no cabía en los <b>14.310 bytes</b> donde vivía el japonés. El barrido se contrastó además consigo mismo: otros nueve bancos tienen la entropía igual de alta y ninguno guarda texto, y eso solo se pudo afirmar midiendo frente a un <b>control negativo</b>. Y los <b>190 nombres</b> de clase, objeto, arma, magia, personaje y monstruo, cada uno atado a un campo de <b>10</b> caracteres medido en el código, se cotejaron con las listas oficiales y con el manual japonés de <b>24 páginas</b> que publicó la propia Sega — que dio con lo que ninguna medición habría encontrado: Sega <b>renombró</b> personajes. バリー no es Barry, es <b>Claude</b>; テディ no es Teddy, es <b>Gyan</b>. El puente fue la clase, porque de cada una hay un único personaje. La auditoría encontró <b>5</b> nombres equivocados, dos de ellos <b>intercambiados entre sí</b> — la firma del error por sonido, que ninguna comprobación de existencia acusa. Donde Sega se equivocó al teclear, <code>Wodden Sword</code>, se quedó la grafía correcta: los nombres propios de una serie se copian; sus erratas, no. El trabajo sobre este cartucho se cuenta en esta página."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"shining-force-gaiden-en.ips","tamanho":"36 KB"},"pt":null,"es":null},"rom":"Shining Force Gaiden - Ensei, Jashin no Kuni e (Japan).gg","rom_md5":"8eafd80d35251b5d3f07d5cae27241c1"},"fotos":[{"f":"sfg/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"O logotipo é gráfico, com o <b>外伝</b> desenhado na própria imagem, e <code>PRESS START BUTTON</code> abaixo dele. Sob o <code>© 1992 SEGA</code> há uma segunda assinatura na tela: <code>SONIC</code>.","en":"The logo is artwork, with <b>外伝</b> drawn into the image itself, and <code>PRESS START BUTTON</code> below it. Under <code>© 1992 SEGA</code> there is a second signature on the screen: <code>SONIC</code>.","es":"El logotipo es gráfico, con el <b>外伝</b> dibujado en la propia imagen, y <code>PRESS START BUTTON</code> debajo. Bajo el <code>© 1992 SEGA</code> hay una segunda firma en la pantalla: <code>SONIC</code>."}},{"f":"sfg/02-anri.png","t":{"pt":"Anri, rainha de Gardiana","en":"Anri, Queen of Gardiana","es":"Anri, reina de Gardiana"},"c":{"pt":"A caixa de diálogo na corte, com o retrato emoldurado no canto superior direito da cena: <i>I am Anri, Queen of Gardiana, who rules this land</i>. Gardiana é a grafia que a ROM escreve.","en":"The dialogue box at court, with the portrait framed in the top-right corner of the scene: <i>I am Anri, Queen of Gardiana, who rules this land</i>. Gardiana is the spelling the ROM writes.","es":"La caja de diálogo en la corte, con el retrato enmarcado en la esquina superior derecha de la escena: <i>I am Anri, Queen of Gardiana, who rules this land</i>. Gardiana es como lo escribe la ROM."}},{"f":"sfg/03-shining-force.png","t":{"pt":"O exército ganha nome","en":"The army is named","es":"El ejército recibe su nombre"},"c":{"pt":"<i>That knight is mine. Come, Shining Force</i> — o instante em que a tropa é convocada pelo nome que dá título à série. Com as dez letras de fábrica não havia S, I, N, O, R, C nem E para escrever isso.","en":"<i>That knight is mine. Come, Shining Force</i> — the moment the troop is summoned by the name that titles the series. The factory ten had no S, I, N, O, R, C or E to write it with.","es":"<i>That knight is mine. Come, Shining Force</i> — el momento en que se convoca a la tropa por el nombre que da título a la serie. Con las diez letras de fábrica no había S, I, N, O, R, C ni E para escribirlo."}},{"f":"sfg/04-n
