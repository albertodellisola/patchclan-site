ilibrio.</strong> Entrena a las tres chicas. Si una se queda atrás, hazla tu favorita hasta que alcance a las demás.</li>\n<li><strong>Vuelve a jugar.</strong> Ser Guerrera Mágica no es el único futuro. Juega más de una vez: las chicas pueden terminar de muchas otras maneras.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/dica_final.png\" data-shot=\"mkr2/manual/dica_final.png\" alt=\"¡Suerte, Jefe!\" loading=\"lazy\"></div><figcaption>¡Suerte, Jefe!</figcaption></figure>"}},{"id":"credits","titulo":{"en":"Credits","es":"Créditos"},"html":{"en":"<h3>Magic Knight Rayearth 2: Making of Magic Knight</h3>\n<p>© CLAMP / KODANSHA / YOMIURI TV / DENTSU / TMS</p>\n<p>© SEGA 1995</p>\n<h3>This Translation</h3>\n<p>English translation by Patch Clan</p>\n<p>This is a fan translation. It is not made, licensed or endorsed by SEGA or the rights holders. The version of the patch is shown on the title screen.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/titulo_versao.png\" data-shot=\"mkr2/manual/titulo_versao.png\" alt=\"The title screen with the patch version\" loading=\"lazy\"></div><figcaption>The title screen with the patch version</figcaption></figure>","es":"<h3>Magic Knight Rayearth 2: Making of Magic Knight</h3>\n<p>© CLAMP / KODANSHA / YOMIURI TV / DENTSU / TMS</p>\n<p>© SEGA 1995</p>\n<h3>Esta traducción</h3>\n<p>Traducción al español por Patch Clan</p>\n<p>Esta es una traducción hecha por fans. No es obra de SEGA, ni está autorizada ni respaldada por ella ni por los titulares de los derechos. La versión del parche aparece en la pantalla de título.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/mkr2/manual/titulo_versao.es.png\" data-shot=\"mkr2/manual/titulo_versao.es.png\" alt=\"La pantalla de título con la versión del parche\" loading=\"lazy\"></div><figcaption>La pantalla de título con la versión del parche</figcaption></figure>"}}]},"yu-yu-hakusho-gaiden":{"slug":"yu-yu-hakusho-gaiden","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Um manual novo, escrito a partir do original japonês e ampliado, com as palavras que aparecem na tela do patch. Por enquanto ele existe só em inglês.","en":"A new manual, written from the Japanese original and expanded, using the words you see on screen in the patch.","es":"Un manual nuevo, escrito a partir del original japonés y ampliado, con las palabras que aparecen en pantalla en el parche. Por ahora solo existe en inglés."},"secoes":[{"id":"cover","titulo":{"en":"Yu Yu Hakusho Gaiden"},"html":{"en":"<p><strong>Instruction Manual</strong></p>\n<p>For the Sega Mega Drive. English fan translation by PATCHCLAN.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/capa_titulo.png\" data-shot=\"yyhg/manual/capa_titulo.png\" alt=\"The title screen\" loading=\"lazy\"></div><figcaption>The title screen</figcaption></figure>\n<p>©Yoshihiro Togashi / Shueisha · Fuji TV · St. Pierrot ©1994 Sega</p>\n<p>This is an unofficial fan translation. It is not produced, licensed or endorsed by Sega or the Yu Yu Hakusho rights holders.</p>"}},{"id":"welcome","titulo":{"en":"Welcome"},"html":{"en":"<p>Thanks for picking up Yu Yu Hakusho Gaiden in English. Please read this manual before you start.</p>\n<h3>The Story Nobody Told</h3>\n<p>Just before Yusuke and his friends leave for the Dark Tournament, there are two days the Yu Yu Hakusho story skips over. During those two days, a crisis nearly brought the Human World, the world of people, to ruin. This game tells that story, and you get to play it.</p>\n<h3>About This Translation</h3>\n<p>When you switch on the game, a patch screen comes up before the Sega logo. It reads \"DEFINITIVE EDITION\" and \"BY PATCHCLAN 2026\" (that's us), and it shows the version number of your patch. It goes away by itself after about five seconds. Press A or START to skip it.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/intro_patch.png\" data-shot=\"yyhg/manual/intro_patch.png\" alt=\"The patch screen\" loading=\"lazy\"></div><figcaption>The patch screen</figcaption></figure>\n<p>A few notes on the English text:</p>\n<ul>\n<li>Characters use the names from the American dub of the anime. You'll meet Miyamoto and Komada, for example, and the ability to sense spirits is called \"spirit awareness.\"</li>\n<li>Names that exist only in this game are written the way they sound in Japanese, such as Gokumon Island and Hankoki.</li>\n<li>Japanese names are spelled without long-vowel marks, just as they appear on screen.</li>\n</ul>\n<p>This manual uses the same words you see on the screen. When a menu says Look, the manual says Look.</p>"}},{"id":"prologue","titulo":{"en":"Prologue: Two Days Before the Dark Tournament"},"html":{"en":"<p>Only two days remain before the team sets out for the Dark Tournament. Yusuke trains day after day.</p>\n<p>The Dark Tournament is the most vicious fighting contest in the world. The rich and powerful of the underworld use their money to gather the strongest fighters they can find. Anyone who gets in their way is entered as a \"guest,\" like it or not. A guest who refuses dies. The only way out is to win.</p>\n<p>Yusuke and his friends have been entered as guests. Yusuke doesn't care about the other fighters. All he can think about is beating Toguro, the fighter who showed him what real power looks like.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/prologo_toguro.png\" data-shot=\"yyhg/manual/prologo_toguro.png\" alt=\"Toguro delivers his warning\" loading=\"lazy\"></div><figcaption>Toguro delivers his warning</figcaption></figure>\n<h3>An Urgent Order</h3>\n<p>Then word comes from Koenma, the one in the Spirit World who gives Yusuke and his friends their orders. It's urgent:</p>\n<blockquote><p>\"While you were all caught up in the tournament, the demon energy in town has spiked like crazy.\"</p><p>\"Find the cause and cut the demon energy off at the source!\"</p></blockquote>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/prologo_koenma.png\" data-shot=\"yyhg/manual/prologo_koenma.png\" alt=\"Koenma&#x27;s order\" loading=\"lazy\"></div><figcaption>Koenma's order</figcaption></figure>\n<p>Yusuke and the others head into town.</p>"}},{"id":"getting-started","titulo":{"en":"Getting Started"},"html":{"en":"<p>Insert the cartridge into your Mega Drive and turn the power ON. (On an emulator, just load the patched game.) After the patch screen and the Sega logo, the title screen appears.</p>\n<ol>\n<li>When you see PUSH START BUTTON, press START.</li>\n<li>Two choices appear: START and OPTION. Use the D-Pad to move the cursor and press A or C.</li>\n</ol>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/titulo_menu.png\" data-shot=\"yyhg/manual/titulo_menu.png\" alt=\"The title screen menu\" loading=\"lazy\"></div><figcaption>The title screen menu</figcaption></figure>\n<p>Choose OPTION to change the game settings (see \"Options\"). Choose START to play. A new menu opens:</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_newgame.png\" data-shot=\"yyhg/manual/menu_newgame.png\" alt=\"New Game or Load File\" loading=\"lazy\"></div><figcaption>New Game or Load File</figcaption></figure>\n<ul>\n<li><strong>New Game</strong> starts the story from the very beginning.</li>\n<li><strong>Load File</strong> picks up where you left off. The game says \"Please select a file.\" Choose File A, File B or File C and press A or C.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_arquivos.png\" data-shot=\"yyhg/manual/menu_arquivos.png\" alt=\"Choosing a file\" loading=\"lazy\"></div><figcaption>Choosing a file</figcaption></figure>\n<p>If you have not saved a game yet, the game tells you \"There is no save file.\" To learn how to save, see \"Saving and Loading.\"</p>"}},{"id":"options","titulo":{"en":"Options"},"html":{"en":"<p>Choose OPTION on the title screen to open the Options screen. Press the D-Pad Up or Down to pick an item, and Left or Right to change it.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/opcoes.png\" data-shot=\"yyhg/manual/opcoes.png\" alt=\"The Options screen\" loading=\"lazy\"></div><figcaption>The Options screen</figcaption></figure>\n<h3>MESSAGE SPEED</h3>\n<p>Sets how fast text appears in the message window: SLOW, NORMAL or FAST.</p>\n<h3>CONTROL PAD</h3>\n<p>Changes what the A, B and C buttons do. There are six layouts, TYPE A through TYPE F, and the screen spells out each one under its name:</p>\n<table><thead><tr><th>Type</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody><tr><td>TYPE A</td><td>PUNCH</td><td>KICK</td><td>COMMAND</td></tr><tr><td>TYPE B</td><td>PUNCH</td><td>COMMAND</td><td>KICK</td></tr><tr><td>TYPE C</td><td>KICK</td><td>PUNCH</td><td>COMMAND</td></tr><tr><td>TYPE D</td><td>KICK</td><td>COMMAND</td><td>PUNCH</td></tr><tr><td>TYPE E</td><td>COMMAND</td><td>PUNCH</td><td>KICK</td></tr><tr><td>TYPE F</td><td>COMMAND</td><td>KICK</td><td>PUNCH</td></tr></tbody></table>\n<p>TYPE A is the default. The type only changes the buttons you fight with. In menus, messages and the hero panel, A or C always confirms and B always cancels, whatever the type. <strong>The battle buttons in this manual are the TYPE A ones.</strong> With another type, use the table to find your PUNCH, KICK and COMMAND buttons.</p>\n<h3>SOUND TEST</h3>\n<p>Press Left or Right to choose a number, then press A or C to hear that tune.</p>\n<h3>EXIT</h3>\n<p>Returns to the title screen.</p>"}},{"id":"controls","titulo":{"en":"Basic Controls and the Message Window"},"html":{"en":"<p>These are the controls outside of battle. For the battle controls, see \"Battle.\"</p>\n<table><thead><tr><th>Button</th><th>What it does</th></tr></thead><tbody><tr><td>START</td><td>Starts the game from the title screen</td></tr><tr><td>D-Pad</td><td>Moves the cursor to choose a command</td></tr><tr><td>A or C</td><td>Confirms a command. Also shows the next part of a message</td></tr><tr><td>B</td><td>Cancels a command</td></tr></tbody></table>\n<p>The X, Y and Z buttons of the six-button controller are not used. A three-button controller works just the same. On an emulator, check your emulator's controller settings to see which keys match A, B and C.</p>\n<h3>The Message Window</h3>\n<p>Story text appears in a window at the bottom of the screen, a letter at a time. When a character speaks, the line starts with the speaker's name. Narration has no name and no quotation marks.</p>\n<p>When the ▼ arrow shows in the corner of the window, there's more to read. Press A or C to go on.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/caixa_fala.png\" data-shot=\"yyhg/manual/caixa_fala.png\" alt=\"A message window with the ▼ arrow\" loading=\"lazy\"></div><figcaption>A message window with the ▼ arrow</figcaption></figure>\n<h3>Menus</h3>\n<p>When the game wants you to decide something, a menu opens in the message window. The ▶ cursor marks the choice you're on. Some menus have one column and some have two; move through them with the D-Pad. Press A or C to choose, or B to back out.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_cursor.png\" data-shot=\"yyhg/manual/menu_cursor.png\" alt=\"A menu with the ▶ cursor\" loading=\"lazy\"></div><figcaption>A menu with the ▶ cursor</figcaption></figure>"}},{"id":"overview","titulo":{"en":"Game Overview"},"html":{"en":"<p>The game takes place in two worlds.</p>\n<h3>Part One: The Human World</h3>\n<p>The adventure begins in the Human World. The demon energy in town is far higher than it should be, and each of the four heroes looks into it on his own. Every hero has his own chapter, and you decide which one to play first. A title card tells you whose chapter is starting.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/cartao_capitulo.png\" data-shot=\"yyhg/manual/cartao_capitulo.png\" alt=\"A chapter title card\" loading=\"lazy\"></div><figcaption>A chapter title card</figcaption></figure>\n<p>Beat the demons you meet and gather clues. When the four heroes compare what they learned with Koenma's records, they find out that all of mankind is in danger.</p>\n<h3>Part Two: The Demon World</h3>\n<p>Koenma sends Yusuke and his friends from the Human World into the Demon World to stop the threat. From then on, the four heroes travel and fight as one team.</p>"}},{"id":"human-world","titulo":{"en":"Playing in the Human World"},"html":{"en":"<h3>Choosing a Hero</h3>\n<p>First, pick the hero whose chapter you want to play. Move the cursor with the D-Pad and press A or C.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/escolha_heroi.png\" data-shot=\"yyhg/manual/escolha_heroi.png\" alt=\"The hero select menu\" loading=\"lazy\"></div><figcaption>The hero select menu</figcaption></figure>\n<p>The Save option on this menu is explained in \"Saving and Loading.\"</p>\n<h3>The Command Menu</h3>\n<p>Once your hero is on the move, the command menu appears.</p>\n<ul>\n<li><strong>Look</strong> describes what's around you.</li>\n<li><strong>Talk</strong> shows what the characters here have to say.</li>\n<li><strong>Move</strong> lists the places you can go. Pick one and press A or C.</li>\n</ul>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_lugares.png\" data-shot=\"yyhg/manual/menu_lugares.png\" alt=\"A list of places under Move\" loading=\"lazy\"></div><figcaption>A list of places under Move</figcaption></figure>\n<p>The menu doesn't always show all three commands. Sometimes you'll see only Look and Move, or only Talk and Move.</p>\n<h3>Making Choices</h3>\n<p>Now and then a situation calls for a choice of its own, like \"Pick it up\" or \"Leave it.\" Think it over, then choose with the D-Pad and A or C.</p>\n<h3>Running into Enemies</h3>\n<p>While you move around, you may run into an enemy. When that happens, a battle begins. In the Human World your hero fights alone, and you can't change heroes. See \"Battle\" for the controls.</p>"}},{"id":"battle","titulo":{"en":"Battle"},"html":{"en":"<h3>The Battle Screen</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/batalha_status.png\" data-shot=\"yyhg/manual/batalha_status.png\" alt=\"A battle against a FAMILIAR\" loading=\"lazy\"></div><figcaption>A battle against a FAMILIAR</figcaption></figure>\n<ul>\n<li><strong>Top of the screen:</strong> the enemy's name, with its HP and RP gauges.</li>\n<li><strong>Bottom of the screen:</strong> your hero's face and name, with HP and RP as numbers.</li>\n</ul>\n<p><strong>HP</strong> is your hero's health. It goes down each time an enemy attack lands.</p>\n<p><strong>RP</strong> is your hero's spirit power. It goes down each time he uses his special attack.</p>\n<h3>Battle Controls (TYPE A)</h3>\n<table><thead><tr><th>Control</th><th>Move</th></tr></thead><tbody><tr><td>D-Pad Left / Right</td><td>Walk</td></tr><tr><td>D-Pad Up twice</td><td>Jump over to the far side of the enemy</td></tr><tr><td>D-Pad Down</td><td>Guard</td></tr><tr><td>A</td><td>Punch</td></tr><tr><td>B</td><td>Kick</td></tr><tr><td>Up + A</td><td>Rapid punches (Yusuke throws straights; Hiei, Kurama and Kuwabara throw uppercuts)</td></tr><tr><td>Up + B</td><td>A jump kick (Yusuke, Kuwabara), high-and-low kicks (Hiei) or a spinning back kick (Kurama)</td></tr><tr><td>Hold Down, then hold A and B</td><td>Special attack</td></tr></tbody></table>\n<h3>Guarding</h3>\n<p>Hold Down to guard. A guarding hero blocks the enemy's ordinary attacks.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/batalha_defesa.png\" data-shot=\"yyhg/manual/batalha_defesa.png\" alt=\"A hero on guard\" loading=\"lazy\"></div><figcaption>A hero on guard</figcaption></figure>\n<h3>Special Attacks</h3>\n<p>Each hero has his own special attack: Yusuke's Spirit Gun, Kuwabara's Spirit Sword, Hiei's sword and Kurama's Rose Whip.</p>\n<p>To use it, hold Down so your hero crouches into his guard. Keep holding Down and press and hold A and B together.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/batalha_especial.png\" data-shot=\"yyhg/manual/batalha_especial.png\" alt=\"A special attack in action\" loading=\"lazy\"></div><figcaption>A special attack in action</figcaption></figure>\n<ul>\n<li>A special attack uses up RP. If your hero doesn't have enough RP left, he can't use it.</li>\n<li>Only one special attack can be on the screen at a time. Wait for the first one to finish before you try again.</li>\n</ul>\n<h3>Battle Tip</h3>\n<p>Jumping to the enemy's far side lets you hit it from behind, and that's usually the surest way to land a blow.</p>\n<h3>Losing a Battle</h3>\n<p>In the Human World, a lost battle starts over right away, and your hero's HP is restored to what it was when the battle began. For battles in the Demon World, see \"Team Battles and Changing Heroes\" and \"GAME OVER and Endings.\"</p>"}},{"id":"saving","titulo":{"en":"Saving and Loading"},"html":{"en":"<p>The game saves to battery-backed memory, in one of three files: File A, File B and File C. How you save depends on which world you're in. There is no way to save during the opening scenes.</p>\n<h3>Saving in the Human World</h3>\n<p>When a hero finishes his chapter and comes back from town, you return to the hero select menu. Choose <strong>Save</strong> there.</p>\n<ol>\n<li>The game asks \"Do you want to save?\" Choose <strong>Yes</strong> to save, or <strong>No</strong> to go on without saving.</li>\n<li>The game asks \"Which file do you want to save to?\" Choose File A, File B or File C.</li>\n<li>If that file already holds a game, the game asks \"Is it okay to overwrite this file?\" Saving over a file erases the game that was in it.</li>\n<li>When the game says \"Game saved.\", you're done.</li>\n</ol>\n<p>There is nothing to save until at least one hero has finished his chapter. If you choose <strong>Save</strong> before that and answer <strong>Yes</strong>, the game only says \"There is no save file.\" and takes you back to the menu.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/save_humano.png\" data-shot=\"yyhg/manual/save_humano.png\" alt=\"Saving in the Human World\" loading=\"lazy\"></div><figcaption>Saving in the Human World</figcaption></figure>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/save_ok.png\" data-shot=\"yyhg/manual/save_ok.png\" alt=\"The save is done\" loading=\"lazy\"></div><figcaption>The save is done</figcaption></figure>\n<h3>Saving in the Demon World</h3>\n<p>In the Demon World, Botan helps you save. Choose <strong>Compact</strong> from the Demon World command menu (see \"Playing in the Demon World\"). Yusuke's Spirit World compact lets you talk to her. When Botan asks \"By the way, Yusuke, wanna save?\", choose <strong>Yeah</strong> to save or <strong>Nah</strong> to get back to your adventure.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/save_demonio.png\" data-shot=\"yyhg/manual/save_demonio.png\" alt=\"Botan offers to save\" loading=\"lazy\"></div><figcaption>Botan offers to save</figcaption></figure>\n<p>Choose a file the same way as in the Human World. If the file already holds a game, Botan asks whether it's okay to write over it. Answer <strong>Yeah, go ahead</strong> to save over it or <strong>Nah, forget it</strong> to keep it. When Botan says \"Saved!\", you're done.</p>\n<p>Botan doesn't offer to save every time you open the compact.</p>\n<h3>Loading a Saved Game</h3>\n<p>Choose <strong>Load File</strong> from the title screen (see \"Getting Started\") and pick your file. The game picks up at the point where you saved.</p>"}},{"id":"demon-world","titulo":{"en":"Playing in the Demon World"},"html":{"en":"<p>In the Demon World the four heroes stay together, and the command menu grows to as many as five commands.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_demonio.png\" data-shot=\"yyhg/manual/menu_demonio.png\" alt=\"The Demon World command menu\" loading=\"lazy\"></div><figcaption>The Demon World command menu</figcaption></figure>\n<h3>Look</h3>\n<p>Describes what's around you.</p>\n<h3>Talk</h3>\n<p>Choose which hero speaks. When the team reaches a new place, talking it over is a good way to find out what to do next. After a hero has spoken, the list of heroes opens again so you can hear from someone else. Press B to go back to the command menu.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_talk.png\" data-shot=\"yyhg/manual/menu_talk.png\" alt=\"Choosing who talks\" loading=\"lazy\"></div><figcaption>Choosing who talks</figcaption></figure>\n<h3>Action</h3>\n<p>Choose which hero will try to do something here. Every hero has his own talents, and sometimes only one of the four can get the job done.</p>\n<h3>Move</h3>\n<p>Shows the directions you can take from here: Forward, Back, Left and Right. Only the ways that are open appear. Sometimes the directions are laid out like a compass. Pick one and press A or C.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/menu_rosa.png\" data-shot=\"yyhg/manual/menu_rosa.png\" alt=\"Picking a direction\" loading=\"lazy\"></div><figcaption>Picking a direction</figcaption></figure>\n<h3>Compact</h3>\n<p>Yusuke carries a Spirit World compact, which lets the team talk to Botan. Choose Compact to call her. This is how you save in the Demon World (see \"Saving and Loading\").</p>\n<h3>Items: Reigen Grass</h3>\n<p>As you travel through the Demon World, you may come across Reigen Grass. Picking it up restores spirit power (RP).</p>\n<h3>Enemies</h3>\n<p>While you travel, enemies will attack. In the Demon World the whole team is in the fight. See \"Team Battles and Changing Heroes.\"</p>"}},{"id":"team-battles","titulo":{"en":"Team Battles and Changing Heroes"},"html":{"en":"<p>In the Demon World, all four heroes are in every battle, but only one of them fights at a time. The others wait on the sidelines, ready to jump in.</p>\n<h3>Changing Heroes</h3>\n<p>Press C (COMMAND) during a battle to open the hero panel. It shows the whole team in one row, Yusuke, Kuwabara, Hiei and Kurama, with each hero's HP and RP under his name. The hero now fighting is shown in yellow. Move the ▶ arrow with the D-Pad Left or Right and press A or C to send that hero in.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/painel_troca.png\" data-shot=\"yyhg/manual/painel_troca.png\" alt=\"The hero panel\" loading=\"lazy\"></div><figcaption>The hero panel</figcaption></figure>\n<ul>\n<li>Each hero can be sent in only once per battle.</li>\n<li>Sometimes you can't change heroes.</li>\n<li>Each hero keeps his own HP and RP.</li>\n</ul>\n<h3>When a Hero Falls</h3>\n<p>The hero panel also comes up on its own at times, for example when the hero on the field runs out of HP. Pick a teammate who can still fight and send him in.</p>\n<h3>Losing a Battle</h3>\n<p>If you lose an ordinary battle in the Demon World, you fight it again. Some battles can't be fought again, though. See \"GAME OVER and Endings.\"</p>"}},{"id":"game-over","titulo":{"en":"GAME OVER and Endings"},"html":{"en":"<h3>GAME OVER</h3>\n<p>Some battles in the Demon World can't be fought again. If you lose one of them, the game ends and GAME OVER appears.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/game_over.png\" data-shot=\"yyhg/manual/game_over.png\" alt=\"The GAME OVER screen\" loading=\"lazy\"></div><figcaption>The GAME OVER screen</figcaption></figure>\n<p>After GAME OVER the game goes back to the title screen. To keep playing, choose Load File (see \"Getting Started\") and pick up from your last save. Save often!</p>\n<h3>Endings</h3>\n<p>This story has more than one ending.</p>"}},{"id":"characters","titulo":{"en":"Characters: The Four Heroes"},"html":{"en":"<p>These are the four heroes, in the same order as the hero panel. Each one has a demon he must face on his own.</p>\n<h3>Yusuke Urameshi</h3>\n<p><strong>Face your true fear!</strong></p>\n<p>Ever since he saw Toguro's power up close, Yusuke has been set on getting stronger. His attack power and speed are among the best on the team. What he has to overcome is his own fear.</p>\n<p>Special attack: <strong>Spirit Gun</strong></p>\n<p>The demon he must defeat: <strong>Jareiki</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/heroi_yusuke.png\" data-shot=\"yyhg/manual/heroi_yusuke.png\" alt=\"Yusuke\" loading=\"lazy\"></div><figcaption>Yusuke</figcaption></figure>\n<h3>Kazuma Kuwabara</h3>\n<p><strong>The delinquents have changed? Get to the bottom of it!</strong></p>\n<p>Yusuke's longtime rival, and a good guy you can't help liking. His rebellious spirit keeps him going. He wields his Spirit Sword just the way he wants.</p>\n<p>Special attack: <strong>Spirit Sword</strong></p>\n<p>The demon he must defeat: <strong>Hankoki</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/heroi_kuwabara.png\" data-shot=\"yyhg/manual/heroi_kuwabara.png\" alt=\"Kuwabara\" loading=\"lazy\"></div><figcaption>Kuwabara</figcaption></figure>\n<h3>Hiei</h3>\n<p><strong>Cut the ties of the past!</strong></p>\n<p>Cold and ruthless, Hiei moves faster than anyone else on the team.</p>\n<p>Special attack: a strike with his sword</p>\n<p>The demon he must defeat: <strong>Kokubyoki</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/heroi_hiei.png\" data-shot=\"yyhg/manual/heroi_hiei.png\" alt=\"Hiei\" loading=\"lazy\"></div><figcaption>Hiei</figcaption></figure>\n<h3>Kurama</h3>\n<p><strong>Overcome your own kindness!</strong></p>\n<p>Kurama is careful and slow to trust, but his real weak spot may be his own kindness.</p>\n<p>Special attack: <strong>Rose Whip</strong></p>\n<p>The demon he must defeat: <strong>Katsuroki</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/heroi_kurama.png\" data-shot=\"yyhg/manual/heroi_kurama.png\" alt=\"Kurama\" loading=\"lazy\"></div><figcaption>Kurama</figcaption></figure>"}},{"id":"supporting-cast","titulo":{"en":"Supporting Cast"},"html":{"en":"<p>You'll meet these faces along the way.</p>\n<h3>Botan</h3>\n<p>A cheerful girl from the Spirit World who works for Koenma. In the Demon World she keeps in touch with the team through the Spirit World compact.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/elenco_botan.png\" data-shot=\"yyhg/manual/elenco_botan.png\" alt=\"Botan\" loading=\"lazy\"></div><figcaption>Botan</figcaption></figure>\n<h3>Koenma</h3>\n<p>Botan's boss in the Spirit World. Koenma gives Yusuke and his friends their orders, and he's the one who sends the team after the demon energy.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/elenco_koenma.png\" data-shot=\"yyhg/manual/elenco_koenma.png\" alt=\"Koenma\" loading=\"lazy\"></div><figcaption>Koenma</figcaption></figure>\n<h3>Genkai</h3>\n<p>A tough old woman who keeps a close eye on Yusuke's training, and thinks he still has a long way to go.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/elenco_genkai.png\" data-shot=\"yyhg/manual/elenco_genkai.png\" alt=\"Genkai\" loading=\"lazy\"></div><figcaption>Genkai</figcaption></figure>\n<h3>Keiko Yukimura</h3>\n<p>A girl who has known Yusuke for years. She's never afraid to tell him off.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/elenco_keiko.png\" data-shot=\"yyhg/manual/elenco_keiko.png\" alt=\"Keiko Yukimura\" loading=\"lazy\"></div><figcaption>Keiko Yukimura</figcaption></figure>\n<h3>Toguro</h3>\n<p>The fighter Yusuke is itching to beat at the Dark Tournament.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/elenco_toguro.png\" data-shot=\"yyhg/manual/elenco_toguro.png\" alt=\"Toguro\" loading=\"lazy\"></div><figcaption>Toguro</figcaption></figure>"}},{"id":"gokumon-island","titulo":{"en":"Gokumon Island"},"html":{"en":"<p><strong>An artist's view</strong></p>\n<p>Gokumon Island drifts eerily on the Demon World's sea of spirit energy. There it waits, and waits, for the four heroes to come.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/yyhg/manual/gokumon.png\" data-shot=\"yyhg/manual/gokumon.png\" alt=\"Gokumon Island, as the artist imagines it\" loading=\"lazy\"></div><figcaption>Gokumon Island, as the artist imagines it</figcaption></figure>"}},{"id":"glossary","titulo":{"en":"Glossary"},"html":{"en":"<p>These are the words you'll see most often on the screen.</p>\n<p><strong>Human World:</strong> The world where people live. The story starts here.</p>\n<p><strong>Spirit World:</strong> The world where souls go after death. Koenma and Botan come from here.</p>\n<p><strong>Demon World:</strong> The world where demons live.</p>\n<p><strong>Dark Tournament:</strong> A fighting tournament run by the rich and powerful of the underworld. Yusuke and his friends have been entered in it.</p>\n<p><strong>demon:</strong> A creature from the Demon World.</p>\n<p><strong>demon energy:</strong> The energy that demons give off.</p>\n<p><strong>spirit energy:</strong> The energy found in souls and in the land itself. Heroes draw on it for attacks like the Spirit Gun.</p>\n<p><strong>spirit power:</strong> How much spirit energy a hero has left to use. The screen shows it as RP.</p>\n<p><strong>HP:</strong> Your hero's health. At zero, he can't fight on.</p>\n<p><strong>RP:</strong> Your hero's spirit power. Special attacks use it up.</p>\n<p><strong>Spirit Gun:</strong> Yusuke's special attack.</p>\n<p><strong>Spirit Sword:</strong> Kuwabara's special attack.</p>\n<p><strong>Rose Whip:</strong> Kurama's special attack.</p>\n<p><strong>Spirit World compact:</strong> The device Yusuke carries in the Demon World. It lets the team talk to Botan.</p>\n<p><strong>Reigen Grass:</strong> A plant that grows only in the Spirit World and the Demon World. It restores spirit power.</p>\n<p><strong>Gokumon Island:</strong> An island floating in the Demon World.</p>"}},{"id":"emulator-health","titulo":{"en":"Emulators and Flashcarts"},"html":{"en":"<h3>Save Memory</h3>\n<p>This game saves to battery-backed save memory (SRAM), the same way the original cartridge does.</p>\n<ul>\n<li><strong>On an emulator:</strong> your emulator keeps the save in a separate file next to the game or in its save folder. Don't delete that file, or your saved games go with it.</li>\n<li><strong>On a flashcart:</strong> the patched game is 4 MB and switches on its save memory the way larger Mega Drive games do. Make sure your flashcart supports battery saves for 4 MB Mega Drive games and writes the save back to its memory card. The patch has been tested on emulators, not on flashcarts.</li>\n</ul>\n<p>Save states made by your emulator are a separate thing. The game's own File A, File B and File C live only in the save memory. If your saved files seem to vanish after you load an emulator save state, reset the game.</p>\n<h3>Health Warning</h3>\n<p><strong>Read this before you play.</strong></p>\n<p>A very small number of people may have seizures or lose consciousness when they see certain flashing lights or patterns, including those on a TV or computer screen. This can happen even to people who have never had a seizure before. If you or anyone in your family has ever had seizures, talk to a doctor before playing. Stop playing right away and see a doctor if you have any of these symptoms while playing: dizziness, blurred vision, eye or muscle twitching, loss of awareness, disorientation, any involuntary movement or convulsions.</p>\n<p>For a safer, more comfortable game:</p>\n<ul>\n<li>Play in a well-lit room, and sit as far from the screen as you comfortably can.</li>\n<li>Take a break of 10 to 20 minutes every hour.</li>\n<li>Don't play when you're tired or short on sleep.</li>\n</ul>"}},{"id":"credits","titulo":{"en":"Credits"},"html":{"en":"<h3>The Original Game</h3>\n<p><strong>Yu Yu Hakusho Gaiden</strong> Sega Mega Drive, released in Japan on January 28, 1994 (product code G-5523).</p>\n<p>©Yoshihiro Togashi / Shueisha · Fuji TV · St. Pierrot ©1994 Sega</p>\n<h3>The English Translation</h3>\n<p>Translation, fixes and improvements by <strong>PATCHCLAN</strong>, 2026. Support and updates: <strong>www.patchclan.com</strong></p>\n<p>This is an unofficial fan translation. It is not affiliated with, licensed by or endorsed by Sega, Shueisha, Fuji TV, St. Pierrot or Yoshihiro Togashi. Yu Yu Hakusho and all related names and characters belong to their owners. The translation is distributed as a patch only; please play it with a copy of the game you own.</p>"}}]},"gorilla-man":{"slug":"gorilla-man","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Um manual novo, escrito a partir do original japonês e ampliado, com as palavras que aparecem na tela do patch. Por enquanto ele existe só em inglês.","en":"A new manual, written from the Japanese original and expanded, using the words you see on screen in the patch.","es":"Un manual nuevo, escrito a partir del original japonés y ampliado, con las palabras que aparecen en pantalla en el parche. Por ahora solo existe en inglés."},"secoes":[{"id":"the-gorilla-man","titulo":{"en":"The Gorilla Man"},"html":{"en":"<p>Welcome to Shiratake High.</p>\n<p>It's not a good school. The teachers know it, the students know it, and so does every other school in town. You're one of them now. Roll the die, get through the day, and try to come out on top.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_capa.png\" data-shot=\"gorilla/manual/arte_capa.png\" alt=\"Gorilla-Man and the gang\" loading=\"lazy\"></div><figcaption>Gorilla-Man and the gang</figcaption></figure>\n<p><strong>The Gorilla Man</strong> is based on the manga by Harold Sakuishi, which ran in Weekly Young Magazine from 1988 to 1993 and filled nineteen volumes. It won the Kodansha Manga Award in 1990. Its hero is a huge first-year student called Gorilla-Man, and he never says a word.</p>\n<p>You don't play as him. You play as one of the six friends who have to survive Shiratake High with him, and the game is a board game. You roll a die, you land on squares, and what happens there earns you <strong>Event Points</strong>. Pile up enough of them and you come out on top. How much is enough depends on the scenario.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_titulo.png\" data-shot=\"gorilla/manual/tela_titulo.png\" alt=\"The title logo\" loading=\"lazy\"></div><figcaption>The title logo</figcaption></figure>\n<p>Up to six of you can play at once. There are three scenarios to choose from, a pile of minigames, and one very bad-tempered ramen cook.</p>\n<p>The game doesn't explain much, and some of the squares hit hard, so read on before you start.</p>"}},{"id":"what-youre-playing","titulo":{"en":"What You're Playing"},"html":{"en":"<p>The first screen asks <strong>Which mode do you want?</strong> You have two.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/menu_modo.png\" data-shot=\"gorilla/manual/menu_modo.png\" alt=\"Choosing a mode\" loading=\"lazy\"></div><figcaption>Choosing a mode</figcaption></figure>\n<ul>\n<li><strong>SCENARIO MODE</strong> is the board game. One to six players, a scenario, and a number of school days to get through.</li>\n<li><strong>PARTY MODE</strong> is the minigames on their own, with no board and no school. Good for a room full of people.</li>\n</ul>\n<h3>The three scenarios</h3>\n<p>In SCENARIO MODE the blackboard asks <strong>Which scenario?</strong> Each one has its own goal, and the game explains it on the blackboard before the first day starts.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/quadro_cenarios.png\" data-shot=\"gorilla/manual/quadro_cenarios.png\" alt=\"The three scenarios\" loading=\"lazy\"></div><figcaption>The three scenarios</figcaption></figure>\n<p><strong>\"I Don't Want to Get Expelled!\"</strong> News of the brawl with the other school got around, and Mr. Kono, the teacher in charge of discipline, is ready to expel every one of you. Only the top three in Event Points are safe. Everybody below them is expelled. With four players, one of you goes. With six, three do.</p>\n<p><strong>\"The Mysterious Girl\"</strong> A very cute girl has transferred in, and the rumor is she likes the hardcore delinquent type. The player with the most <strong>HP</strong> (your stamina; see <strong>Reading the Screen</strong>) at the end wins her attention.</p>\n<p><strong>\"Go for It! Revolution at Shiratake High\"</strong> Somehow you all ended up running for student council president. On election day, every player within 5 Event Points of the leader is entered in a drawing, and the winner is picked from among them. Being higher up never hurts: the leader's odds in the drawing are as good as anyone's, and sometimes better.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/briefing_quadro.png\" data-shot=\"gorilla/manual/briefing_quadro.png\" alt=\"The scenario briefing\" loading=\"lazy\"></div><figcaption>The scenario briefing</figcaption></figure>"}},{"id":"starting-up","titulo":{"en":"Starting Up"},"html":{"en":"<p>Turn the power ON. After the opening screen, the title comes up with three choices.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/menu_titulo.png\" data-shot=\"gorilla/manual/menu_titulo.png\" alt=\"The title menu\" loading=\"lazy\"></div><figcaption>The title menu</figcaption></figure>\n<p>Press the Control Pad up or down to move the cursor, then press the A Button or START.</p>\n<ul>\n<li><strong>START</strong> begins a new game and takes you to the setup screens.</li>\n<li><strong>CONTINUE</strong> loads a game you saved. It's grayed out until there's a saved game to load.</li>\n<li><strong>OPTIONS</strong> is where you tell the game what you have plugged in.</li>\n</ul>\n<h3>OPTIONS</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_options.png\" data-shot=\"gorilla/manual/tela_options.png\" alt=\"The OPTIONS screen\" loading=\"lazy\"></div><figcaption>The OPTIONS screen</figcaption></figure>\n<p><strong>CONTROLLER</strong> tells the game which adapter you're using. Press the Control Pad left or right to cycle through the four settings.</p>\n<table><thead><tr><th>Setting</th><th>What it means</th></tr></thead><tbody><tr><td><strong>STANDARD</strong></td><td>Controllers only. One or two players.</td></tr><tr><td><strong>PARTY TAP</strong></td><td>The Party Tap, the Japanese adapter made for this game.</td></tr><tr><td><strong>FOUR SCORE</strong></td><td>The NES Four Score. Use this setting for the NES Satellite, too.</td></tr><tr><td><strong>FAMICOM 4P</strong></td><td>The four-player adapter for the Famicom expansion port.</td></tr></tbody></table>\n<p><strong>BACK</strong> returns to the title. Your choice is stored as soon as you make it, so you won't have to set it again next time.</p>\n<p>If you're playing alone or with one friend, leave it on STANDARD and start the game. For three players or more, see <strong>Playing With 3 to 6</strong>.</p>"}},{"id":"controls","titulo":{"en":"Controls"},"html":{"en":"<p>The whole game runs on the Control Pad and two buttons.</p>\n<table><thead><tr><th>Control</th><th>What it does</th></tr></thead><tbody><tr><td><strong>Control Pad</strong></td><td>Moves the cursor through menus, the command window and the item list.</td></tr><tr><td><strong>A Button</strong></td><td>Confirms. On the board it rolls the die, picks a command and advances the text.</td></tr><tr><td><strong>B Button</strong></td><td>Cancels, and backs out of a menu you opened by mistake.</td></tr><tr><td><strong>START</strong></td><td>Picks an item on the title menu, the same as the A Button.</td></tr></tbody></table>\n<p>Players 1 and 2 use controllers 1 and 2, with the full set of buttons.</p>\n<p>Players 3 through 6 play through an adapter and use one button each. One press moves the cursor. Two quick presses in a row confirm, like a double click. It takes a moment to get the rhythm, so try it once on an easy choice before you bet money on a horse.</p>\n<p>In the minigames, players 1 and 2 use the A Button and players on an adapter use their one button. That's the button you hammer. Arm Wrestling and the 50m Dash are won by pressing fastest. The fight and the baseball duel are won by pressing at the right moment, so watch the bar and don't panic.</p>"}},{"id":"playing-with-3-to-6","titulo":{"en":"Playing With 3 to 6"},"html":{"en":"<p>Two players need nothing special. Three or more need a multitap, an adapter that plugs into the console and gives more players a way in. The Party Tap has a button for each of six players. The four-player adapters have four controllers, so with five or six players some of you share.</p>\n<p>In Japan the game was made for its own adapter, the <strong>Party Tap</strong>, sold separately by the publisher. This version doesn't insist on it. It also works with the <strong>Four Score</strong>, with the wireless NES Satellite (which talks to the console the same way; choose <strong>FOUR SCORE</strong> for it), and with the four-player adapter for the Famicom expansion port. Use whichever one you already own.</p>\n<p><strong>Always plug the adapter in with the power OFF.</strong></p>\n<h3>Telling the game what you have</h3>\n<p>Set <strong>CONTROLLER</strong> in OPTIONS to match your adapter. If you get it wrong, the game doesn't give up: when you ask for three players or more, it checks for each kind of adapter by itself and uses the first one it finds.</p>\n<p>If it can't find any adapter at all, the screen reads <strong>CONNECT A MULTITAP</strong>.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/erro_multitap.png\" data-shot=\"gorilla/manual/erro_multitap.png\" alt=\"No adapter found\" loading=\"lazy\"></div><figcaption>No adapter found</figcaption></figure>\n<p>Press the A Button to try again once you've checked the connection, or the B Button to go back and set up a smaller game.</p>\n<h3>Which controller belongs to whom</h3>\n<p>With two or more human players, the game asks each of them, from player 2 on, to claim a controller: <strong>PLAYER 2, PRESS A</strong>, and so on.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/player_press_a.png\" data-shot=\"gorilla/manual/player_press_a.png\" alt=\"Claiming a controller\" loading=\"lazy\"></div><figcaption>Claiming a controller</figcaption></figure>\n<p>The controller that presses A belongs to that player from then on. There's nothing to stop two players from claiming the same one and sharing it, if you're short an adapter and long on friends.</p>\n<p>With the Party Tap, only player 2 is asked. The rest of the buttons are assigned in order.</p>"}},{"id":"setting-up-a-game","titulo":{"en":"Setting Up a Game"},"html":{"en":"<p>Player 1's controller does the setting up, no matter how many of you are playing. The Control Pad moves, the A Button confirms.</p>\n<h3>1. The scenario</h3>\n<p>The blackboard shows the three scenarios. Pick the one you want to play.</p>\n<h3>2. How many are playing</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_jogadores.png\" data-shot=\"gorilla/manual/tela_jogadores.png\" alt=\"How many players?\" loading=\"lazy\"></div><figcaption>How many players?</figcaption></figure>\n<p>The top row, <strong>PLAYER</strong>, is the number of people at the console, from one to six.</p>\n<p>The second row, <strong>COM</strong>, is the number of players the computer takes over. When you change the first row, the game fills in a COM number for you. Change it if you like.</p>\n<p>Choose <strong>OK</strong> when both rows are right. Choose <strong>NO</strong> to set them again.</p>\n<p>Three human players or more need an adapter. See <strong>Playing With 3 to 6</strong>.</p>\n<h3>3. Who you are</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_personagem.png\" data-shot=\"gorilla/manual/tela_personagem.png\" alt=\"Choosing a character\" loading=\"lazy\"></div><figcaption>Choosing a character</figcaption></figure>\n<p>Six faces, six names: <strong>FUJIMOTO</strong>, <strong>NAKAJIMA</strong>, <strong>NIMURA</strong>, <strong>ABE</strong>, <strong>TANABE</strong> and <strong>TSURUTA</strong>. Each player picks one, in turn.</p>\n<p>They don't start out equal. Everyone gets 350G, but the Event Points and HP they bring to the first morning are different:</p>\n<table><thead><tr><th>Character</th><th>EV</th><th>HP</th></tr></thead><tbody><tr><td><strong>FUJIMOTO</strong></td><td>30</td><td>45</td></tr><tr><td><strong>ABE</strong></td><td>40</td><td>30</td></tr><tr><td><strong>NAKAJIMA</strong></td><td>35</td><td>35</td></tr><tr><td><strong>TANABE</strong></td><td>35</td><td>25</td></tr><tr><td><strong>NIMURA</strong></td><td>45</td><td>30</td></tr><tr><td><strong>TSURUTA</strong></td><td>40</td><td>35</td></tr></tbody></table>\n<p>In \"The Mysterious Girl\" everyone starts on 10 EV, and HP is 50, 40, 45, 30, 35 and 35, in the same order as the table.</p>\n<h3>4. How many days</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_dias.png\" data-shot=\"gorilla/manual/tela_dias.png\" alt=\"How many days to play?\" loading=\"lazy\"></div><figcaption>How many days to play?</figcaption></figure>\n<p>A game runs from one to six school days. One day is a quick match. Six days can take all afternoon.</p>\n<p>Then the game asks <strong>Is everything OK?</strong> Answer OK and the scenario begins. Answer NO and you go back to change something.</p>"}},{"id":"the-six-of-us","titulo":{"en":"The Six of Us"},"html":{"en":"<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_gorillaman.png\" data-shot=\"gorilla/manual/arte_gorillaman.png\" alt=\"The gang\" loading=\"lazy\"></div><figcaption>The gang</figcaption></figure>\n<p><strong>Gorilla-Man</strong>, Ikedo Sadaharu, is the reason any of this is happening. He's a first-year student and nobody has ever heard him speak. He fights on your side, he hits harder than anyone, and now and then he gets angry at you instead. On the VERSUS plate the game writes his family name, <strong>IKEDO</strong>. In the messages he's <strong>GORILLA-MAN</strong>. Same guy.</p>\n<p>You play as one of his six friends: <strong>FUJIMOTO</strong>, who does the talking for the group and works at Ramen Wolf after school; <strong>NAKAJIMA</strong>; <strong>NIMURA</strong>; <strong>ABE</strong>; <strong>TANABE</strong>, whom his friends call Beka; and <strong>TSURUTA</strong>. They start with different Event Points and HP. See the table in <strong>Setting Up a Game</strong>.</p>\n<h3>Everybody else</h3>\n<ul>\n<li><strong>Mr. Kono</strong> is the teacher who runs the uniform inspection at the gate, checks work permits, and would love to expel you.</li>\n<li><strong>Kaori</strong> is worth running into. Meeting her is one of the better morning cards.</li>\n<li><strong>Aoi</strong> is the other good one.</li>\n<li><strong>Miho Ikedo</strong> is Gorilla-Man's sister. Meeting her costs you Event Points and HP.</li>\n<li><strong>Arnold</strong> is a dog. His card, ARNOLD GUARD, is the one thing that can get Gorilla-Man off your back.</li>\n<li><strong>Fuwa</strong> is the pitcher you face in the baseball duel.</li>\n</ul>\n<h3>The schools</h3>\n<p><strong>Shiratake High</strong> is yours. <strong>Mashiba High</strong> and <strong>Gotennoji High</strong> are the ones whose students you run into on the way to class. Their fighters turn up on the VERSUS plate when a brawl starts.</p>"}},{"id":"reading-the-screen","titulo":{"en":"Reading the Screen"},"html":{"en":"<p>While you're on the board, your window runs along the bottom of the screen.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/hud_barra.png\" data-shot=\"gorilla/manual/hud_barra.png\" alt=\"The player window\" loading=\"lazy\"></div><figcaption>The player window</figcaption></figure>\n<ul>\n<li><strong>Your face and name</strong> on the left, so you know whose turn it is.</li>\n<li><strong>EV</strong> is your Event Points. School life gives them and takes them away, and in two of the three scenarios your EV at the end decides how you come out of it.</li>\n<li><strong>HP</strong> is your stamina. Sports events, fights and a few nasty squares take it. Food gives it back. One scenario is won on HP alone.</li>\n<li><strong>G</strong> is money. You find it on the ground, you earn it at your part-time job, and you spend it on ramen and on bets.</li>\n<li><strong>#</strong> followed by a number is where you stand right now. <strong>#1</strong> is first place.</li>\n</ul>\n<p>The board isn't gentle. A single event square can move your EV or your HP by as much as ten points, and money swings by as much as 500G at a time. A bad morning card and a bad square on the same day can put you last. If there are days left, there's still time to fix it.</p>\n<p>Choose <strong>INFO</strong> in the command window to look at the other players' windows.</p>"}},{"id":"the-command-window","titulo":{"en":"The Command Window"},"html":{"en":"<p>When your turn comes around, the command window opens on the right of the board, above your player window.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/menu_comando.png\" data-shot=\"gorilla/manual/menu_comando.png\" alt=\"The command window\" loading=\"lazy\"></div><figcaption>The command window</figcaption></figure>\n<table><thead><tr><th>Command</th><th>What it does</th></tr></thead><tbody><tr><td><strong>DICE</strong></td><td>Rolls the die and moves you. This is the command that ends your turn.</td></tr><tr><td><strong>INFO</strong></td><td>Shows the other players' windows and the item cards they're holding.</td></tr><tr><td><strong>MAP</strong></td><td>Shows the whole route you're on right now, square by square.</td></tr><tr><td><strong>RANK</strong></td><td>Shows where everyone stands.</td></tr><tr><td><strong>SAVE</strong></td><td>Saves the game. See <strong>Saving and Continuing</strong>.</td></tr></tbody></table>\n<p>Use the Control Pad to pick a command, then press the A Button. <strong>INFO</strong>, <strong>MAP</strong> and <strong>RANK</strong> can be used as often as you like before you choose <strong>DICE</strong>, so look before you roll.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_mapa.png\" data-shot=\"gorilla/manual/tela_mapa.png\" alt=\"The map\" loading=\"lazy\"></div><figcaption>The map</figcaption></figure>\n<p><strong>SAVE</strong> appears on human players' turns in SCENARIO MODE. A computer player's window has only the other four commands.</p>"}},{"id":"saving-and-continuing","titulo":{"en":"Saving and Continuing"},"html":{"en":"<p>The original cartridge couldn't save. This version can, and a six-day game with six players is long enough to need it.</p>\n<h3>Saving</h3>\n<p>Choose <strong>SAVE</strong> in the command window. There are three slots.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/janela_save.png\" data-shot=\"gorilla/manual/janela_save.png\" alt=\"The save slots\" loading=\"lazy\"></div><figcaption>The save slots</figcaption></figure>\n<p>Each slot shows its number and its state: <strong>2FREE</strong> is an empty slot 2, and <strong>1USED</strong> is slot 1 with a game in it. Put the cursor on the slot you want, press the A Button, and the game answers <strong>SAVED</strong>. <strong>BACK</strong> closes the window without saving.</p>\n<p>The game goes on from the same turn.</p>\n<h3>Continuing</h3>\n<p>Pick <strong>CONTINUE</strong> on the title screen. The three slots are listed again. An empty slot reads <strong>EMPTY</strong>, and a used slot shows the name of the player whose turn it was when the game was saved.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_continue.png\" data-shot=\"gorilla/manual/tela_continue.png\" alt=\"Loading a saved game\" loading=\"lazy\"></div><figcaption>Loading a saved game</figcaption></figure>\n<p>Choose one and the game picks up right there: the same day, the same board, the same player waiting to roll.</p>\n<h3>What you need</h3>\n<p>Saving needs battery-backed memory, and the 1993 cartridge board doesn't have any. In an emulator or on a flash cart it works as described. On original hardware the rest of the game runs, but nothing is kept once the power goes off.</p>\n<p><strong>SAVE</strong> reads the controllers, not the Party Tap buttons. If you're playing through the Party Tap, save with controller 1.</p>"}},{"id":"a-day-at-shiratake-high","titulo":{"en":"A Day at Shiratake High"},"html":{"en":"<p>Every day of the game runs the same way, from the station in the morning to the station at night. There are seven stops, in this order.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_fuu.png\" data-shot=\"gorilla/manual/arte_fuu.png\" alt=\"Another day at Shiratake High\" loading=\"lazy\"></div><figcaption>Another day at Shiratake High</figcaption></figure>\n<h3>1. Morning at the station</h3>\n<p>The day opens on the platform. <strong>GOOD MORNING! DON'T BE LATE, DO YOUR BEST!</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/estacao_manha.png\" data-shot=\"gorilla/manual/estacao_manha.png\" alt=\"Morning at the station\" loading=\"lazy\"></div><figcaption>Morning at the station</figcaption></figure>\n<p>Before you go anywhere, you draw a card. Put the cursor on one of the cards on the screen and press the A Button. The card decides how your morning starts, for better or worse.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/carta_manha.png\" data-shot=\"gorilla/manual/carta_manha.png\" alt=\"Pick an event card\" loading=\"lazy\"></div><figcaption>Pick an event card</figcaption></figure>\n<h3>2. The way to school</h3>\n<p>Everyone races to school along the board, rolling in turn. <strong>The first three to arrive score: EV +8, +6 and +4.</strong> The race ends the moment the third one gets in. The <strong>RANKING</strong> screen goes up, and everyone still on the road is listed under <strong>--- LATE ---</strong> and loses 4 EV.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/mapa_caminho.png\" data-shot=\"gorilla/manual/mapa_caminho.png\" alt=\"The route to school\" loading=\"lazy\"></div><figcaption>The route to school</figcaption></figure>\n<p>Squares along the way pay you, rob you, send you backward and cost you turns. Some of them put you face to face with students from another school, and then it's a brawl.</p>\n<h3>3. The gate</h3>\n<p>At the gate the DRAW CARD screen comes back, this time with Mr. Kono's face beside it: <strong>Uniform inspection!</strong> You draw one of five cards. Draw <strong>No problem!</strong> and you hear <strong>You may pass...</strong> and pick up 3 Event Points. The other four cost you Event Points before the first class.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/portao_kono.png\" data-shot=\"gorilla/manual/portao_kono.png\" alt=\"Uniform inspection\" loading=\"lazy\"></div><figcaption>Uniform inspection</figcaption></figure>\n<h3>4. Inside the school</h3>\n<p>The <strong>CLASS BOARD</strong> runs from the gate to the classroom, and it's another race. Arriving early puts you in a better position for what happens next.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tabuleiro_escola.png\" data-shot=\"gorilla/manual/tabuleiro_escola.png\" alt=\"The class board\" loading=\"lazy\"></div><figcaption>The class board</figcaption></figure>\n<h3>5. The classroom</h3>\n<p>There aren't enough desks. See <strong>Desk Grab</strong>.</p>\n<h3>6. The way home</h3>\n<p>The last board takes you from school back to the station, past the arcade and past your part-time <strong>JOB</strong>. It's a race again: the first three to reach the station get <strong>AT STATION</strong> and EV +8, +6 and +4, and the stretch ends as soon as the third one is in.</p>\n<h3>7. Evening at the station</h3>\n<p>Three players are back on the platform, and the day is over. The next morning starts, until you've played the number of days you set at the beginning.</p>\n<p>After the last day, the <strong>RESULTS</strong> screen lists every player's EV, HP and G, and the scenario reaches its end.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_ranking.png\" data-shot=\"gorilla/manual/tela_ranking.png\" alt=\"RESULTS, after the last day\" loading=\"lazy\"></div><figcaption>RESULTS, after the last day</figcaption></figure>"}},{"id":"event-squares-and-item-cards","titulo":{"en":"Event Squares and Item Cards"},"html":{"en":"<p>The board is made of squares, and each kind does something different.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tabuleiro_casas.png\" data-shot=\"gorilla/manual/tabuleiro_casas.png\" alt=\"The board\" loading=\"lazy\"></div><figcaption>The board</figcaption></figure>\n<table><thead><tr><th>Square</th><th>What happens</th></tr></thead><tbody><tr><td><strong>Money</strong></td><td>Your wallet gets thicker or thinner.</td></tr><tr><td><strong>Happening</strong></td><td>Marked `!?`. Anything can happen.</td></tr><tr><td><strong>Stamina</strong></td><td>Your HP goes up or down.</td></tr><tr><td><strong>Fight</strong></td><td><strong>A brawl! A brawl! FIGHT!!</strong> See <strong>Fight!</strong></td></tr><tr><td><strong>Event Point</strong></td><td>Marked `EV`. Event Points, up or down.</td></tr></tbody></table>\n<p>Each route also has its start and goal squares, and there are squares in front of your part-time job, the arcade and Ramen Wolf, plus squares that hand you an item card.</p>\n<p>Land on one and the screen gives the event a title before it tells you what it did to you.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/titulo_evento.png\" data-shot=\"gorilla/manual/titulo_evento.png\" alt=\"An event\" loading=\"lazy\"></div><figcaption>An event</figcaption></figure>\n<p>There are nearly fifty of them. You miss trains, sleep through your stop, and sometimes catch the express. The principal lectures you, and so does the old janitor. There's cleaning duty, homework you forgot, and falling asleep in class. You run into Kaori, lose your wallet, and get hassled by thugs from Mashiba or Gotennoji, or by the yakuza. You're late for work, you get paid for work, and a teacher catches you working. Then there's the arcade, the quiz, and Gorilla-Man losing his temper.</p>\n<p>Every event does one or more of these: moves your EV, HP or money up or down; costs you a turn (<strong>Lose 1 turn</strong>); moves you back two, three or four squares, or forward three; or gives you another roll of the die. A couple of events hit every player at once.</p>\n<h3>The item cards</h3>\n<p>Some squares give you an item card. You hold it until the day it saves you, and you can see what everyone else is holding with <strong>INFO</strong>.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/janela_item.png\" data-shot=\"gorilla/manual/janela_item.png\" alt=\"The item window\" loading=\"lazy\"></div><figcaption>The item window</figcaption></figure>\n<ul>\n<li><strong>ARNOLD GUARD.</strong> Now and then Gorilla-Man gets angry, and somebody is going to have a bad afternoon. Hold this card and the dog runs him off instead. <em>Arnold ran Gorilla-Man off!!</em></li>\n<li><strong>JOB PASS.</strong> A work permit Mr. Kono accepts. If he catches you at your part-time job without one, it costs you Event Points. With one, you shrug it off. <em>Got my work permit! Ha! My EV is safe.</em></li>\n</ul>\n<p>A player who has lost a turn is marked <strong>SKIP 1</strong> on the board, and the item window shows it as <strong>SKIP</strong>.</p>\n<h3>The cards</h3>\n<p>The card you draw on the platform comes from a deck of eleven. The one you draw at the gate comes from a deck of five. Here are both.</p>\n<p><strong>On the platform</strong></p>\n<table><thead><tr><th>Card</th><th>Effect</th></tr></thead><tbody><tr><td>Feeling great</td><td>HP +4</td></tr><tr><td>Feeling sick</td><td>HP −4</td></tr><tr><td>Bought manga</td><td>G −80</td></tr><tr><td>Bought gum</td><td>G −40</td></tr><tr><td>Met Kaori</td><td>EV +5</td></tr><tr><td>Met Aoi</td><td>HP +5</td></tr><tr><td>Met Miho Ikedo</td><td>EV −5, HP −5</td></tr><tr><td>Fell on stairs</td><td>HP −5</td></tr><tr><td>Overslept</td><td>Lose 1 turn</td></tr><tr><td>Forgot my pass</td><td>Lose 1 turn</td></tr><tr><td>Pass expired</td><td>G −150</td></tr></tbody></table>\n<p><strong>At the gate</strong></p>\n<table><thead><tr><th>Card</th><th>Effect</th></tr></thead><tbody><tr><td>Dirty magazine</td><td>EV −8</td></tr><tr><td>Out of uniform</td><td>EV −3</td></tr><tr><td>Just a bento (a packed Japanese lunch)</td><td>EV −4</td></tr><tr><td>Talked back</td><td>EV −5</td></tr><tr><td>No problem!</td><td>EV +3</td></tr></tbody></table>\n<p>Mr. Kono has a line ready for each gate card. <strong>You may pass...</strong> is the only one you want to hear.</p>"}},{"id":"desk-grab","titulo":{"en":"Desk Grab"},"html":{"en":"<p>Class starts and there aren't enough desks to go around. Everybody plays this one, in the order they reached the classroom.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/sala_carteiras.png\" data-shot=\"gorilla/manual/sala_carteiras.png\" alt=\"Desk Grab\" loading=\"lazy\"></div><figcaption>Desk Grab</figcaption></figure>\n<p>The message box under the desks says whose turn it is, <strong>TANABE IS UP</strong>, and then <strong>PICK A DESK</strong>.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_sala.png\" data-shot=\"gorilla/manual/arte_sala.png\" alt=\"Not enough desks\" loading=\"lazy\"></div><figcaption>Not enough desks</figcaption></figure>\n<h3>Taking desks</h3>\n<p>You work your way from the back of the room toward the front, one desk per turn. Every empty desk you stop on is yours, and you can collect several before class is over.</p>\n<p>On your first move you can start from any desk you like. After that you choose a direction: straight ahead, forward and to the left, or forward and to the right. Point the arrow where you want to go and confirm. (On a one-button adapter, one press turns the arrow and two quick presses confirm.)</p>\n<ul>\n<li>Stop on an <strong>empty desk</strong> and an event fires. Something happens in class, and it lands on you.</li>\n<li>You can't move onto the desk where another player is standing. The game answers <strong>BLOCKED</strong> and you stay put.</li>\n<li>Stop on a desk that <strong>another player already owns</strong> and you hand him a fixed number of points.</li>\n<li>Reach the <strong>front row</strong> and the rules change in your favor: from there you pick the desk you want, which lets you get in the way of the players still coming up behind you.</li>\n</ul>\n<p>Two words sit with the cursor, <strong>MOVE</strong> and <strong>STATS</strong>. MOVE is the one you steer with. STATS shows how the players stand.</p>\n<h3>End of class</h3>\n<p>When there are no empty desks left, the game announces <strong>CLASS IS OVER</strong> and pays everybody out. The more desks you're holding, the more you score.</p>"}},{"id":"fight","titulo":{"en":"Fight!"},"html":{"en":"<p>Land on a fight square, or run into the wrong students on the way to school, and the board goes away.</p>\n<p><strong>A brawl! A brawl! FIGHT!!</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/briga_versus.png\" data-shot=\"gorilla/manual/briga_versus.png\" alt=\"The VERSUS plate\" loading=\"lazy\"></div><figcaption>The VERSUS plate</figcaption></figure>\n<h3>How a fight works</h3>\n<p>A fight lasts <strong>three rounds</strong>. Whoever has done the most damage at the end of them wins.</p>\n<p>In each round a bar sweeps back and forth. Press the A Button (or your one button, on an adapter) to set it moving, and press again to stop it. Stop it inside the hit area and the blow lands. Stop it outside and you've swung at nothing.</p>\n<p>The messages tell you how it went: <strong>PUNCH HITS!</strong>, <strong>KICK HITS!</strong>, <strong>COUNTER HITS!</strong>, <strong>TOOK DAMAGE!</strong>, <strong>BLOCKED!</strong> and <strong>MISSED!</strong>, plus <strong>WHAM! BAM!</strong> and <strong>OOF! BAM! POW!</strong> when the two of you really go at it.</p>\n<p>At the end the screen announces it: <strong>TANABE WINS! HP+5</strong> for the winner and <strong>TANABE LOSES! HP-5</strong> for the loser, or <strong>DRAW!</strong> when neither of you comes out ahead.</p>\n<h3>Who you meet in a fight</h3>\n<table><thead><tr><th>Fighter</th><th>School</th><th>How bad it's going to be</th></tr></thead><tbody><tr><td><strong>KATO</strong></td><td>Mashiba High</td><td>A pushover.</td></tr><tr><td><strong>TATEI</strong></td><td>Mashiba High</td><td>About average.</td></tr><tr><td><strong>TSUKAMOTO</strong></td><td>Mashiba High</td><td>Strong.</td></tr><tr><td><strong>KAMEWADA</strong></td><td>Gotennoji High</td><td>Very strong. Be ready.</td></tr></tbody></table>\n<p>Those are the four the original manual rates. You'll also meet <strong>NAKAMURA</strong> and <strong>YAMAMOTO</strong>, and a fight can just as easily be against one of your own friends.</p>\n<p><strong>GORILLA-MAN</strong> is on your side, and he hits like a truck.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/gorillaman_entra.png\" data-shot=\"gorilla/manual/gorillaman_entra.png\" alt=\"Gorilla-Man arrives\" loading=\"lazy\"></div><figcaption>Gorilla-Man arrives</figcaption></figure>\n<p>When the banner <strong>GORILLAMAN!!</strong> (spelled that way on the screen) comes down the side of the screen, the fight stops being your problem.</p>"}},{"id":"arm-wrestling-baseball-50m-dash","titulo":{"en":"Arm Wrestling, Baseball and the 50m Dash"},"html":{"en":"<p>Three of the events are sports, and all three come down to the button: the A Button for players 1 and 2, the one button for players on an adapter.</p>\n<h3>Arm Wrestling</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/braco_versus.png\" data-shot=\"gorilla/manual/braco_versus.png\" alt=\"Choose a rival\" loading=\"lazy\"></div><figcaption>Choose a rival</figcaption></figure>\n<p><strong>ARM WRESTLING! DO YOUR BEST!</strong> Here you pick the fight: <strong>CHOOSE A RIVAL!</strong> lets you name the player you want across the table from you.</p>\n<p><strong>READY</strong>, then <strong>START!</strong>, and you both hammer the button as fast as you can. Every press pushes the other guy's bar down. Drain it first and the screen says so: <strong>TANABE WON!</strong> If neither of you gives way, it's a <strong>DRAW!</strong></p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_bracodeferro.png\" data-shot=\"gorilla/manual/arte_bracodeferro.png\" alt=\"The whole class is watching\" loading=\"lazy\"></div><figcaption>The whole class is watching</figcaption></figure>\n<h3>Baseball</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/beisebol_versus.png\" data-shot=\"gorilla/manual/beisebol_versus.png\" alt=\"Three pitches\" loading=\"lazy\"></div><figcaption>Three pitches</figcaption></figure>\n<p><strong>PLAY BALL!</strong> This one is a <strong>3-PITCH DUEL!</strong></p>\n<p>A bar sweeps across the screen. Press the button to swing, and time it so the bar stops inside the hit area. The screen calls each pitch first: <strong>1ST PITCH!</strong>, <strong>2ND PITCH!</strong>, <strong>3RD PITCH!</strong></p>\n<p>Connect and you get <strong>HIT!</strong>, <strong>DOUBLE!</strong>, <strong>TRIPLE!</strong> or <strong>HOME RUN</strong>. Miss and you get <strong>OUT!</strong>, <strong>FOUL!</strong>, <strong>MISSED!</strong> or <strong>STRIKEOUT!</strong></p>\n<p>Watch who's on the mound. <strong>RIVAL: FUWA!</strong> throws a right-handed fastball. <strong>RIVAL: GORILLA-MAN!</strong> throws even harder with his right. When he switches to his left, he lobs it in slowly, and that's worse, because you'll swing early.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_arremesso.png\" data-shot=\"gorilla/manual/arte_arremesso.png\" alt=\"A Shiratake pitcher on the mound\" loading=\"lazy\"></div><figcaption>A Shiratake pitcher on the mound</figcaption></figure>\n<h3>The 50m Dash</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/corrida_50m.png\" data-shot=\"gorilla/manual/corrida_50m.png\" alt=\"The 50m Dash\" loading=\"lazy\"></div><figcaption>The 50m Dash</figcaption></figure>\n<p>Everybody lines up for this one. <strong>50M DASH! DO YOUR BEST!</strong></p>\n<p>Wait for <strong>READY</strong>, then go on <strong>START!</strong> and hammer the button the whole way. Go early and the screen calls <strong>FALSE START!</strong> on you, and you line up again with a handicap.</p>\n<p>And once in a while: <strong>YIKES! GORILLA-MAN IS IN!</strong> Run anyway.</p>"}},{"id":"big-or-small-roulette-slot-machine-horse-race","titulo":{"en":"Big or Small, Roulette, Slot Machine and Horse Race"},"html":{"en":"<p>The other four events are about money: winning it and, more often, losing it.</p>\n<h3>Big or Small</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/big_or_small.png\" data-shot=\"gorilla/manual/big_or_small.png\" alt=\"Big or Small\" loading=\"lazy\"></div><figcaption>Big or Small</figcaption></figure>\n<p>One card is face up. <strong>SO... WHICH ONE?!</strong> Choose <strong>BIG</strong> or <strong>SMALL</strong> with the Control Pad to call whether the next card is higher or lower, and press the A Button.</p>\n<p>Get it right and the dealer takes it well: <strong>NOT BAD!</strong> Get it wrong and the dealer gloats: <strong>HEH HEH, I WIN... SEE YA!</strong> Either way you're asked <strong>ONE MORE GAME? YES NO</strong>, and the honest answer is usually NO.</p>\n<h3>Roulette</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/roleta.png\" data-shot=\"gorilla/manual/roleta.png\" alt=\"The roulette table\" loading=\"lazy\"></div><figcaption>The roulette table</figcaption></figure>\n<p>Everybody plays this one. Each player picks a space on the table in turn, and once every bet is down, the wheel spins. <strong>ROULETTE! WIN SOME CASH!</strong></p>\n<p>You can bet on a single number from <strong>1</strong> to <strong>8</strong>, on the halves <strong>1~4</strong> and <strong>5~8</strong>, or on <strong>RED</strong> or <strong>BLACK</strong>.</p>\n<p>The sign painted above the wheel reads <strong>ROULET</strong>, one T short, just as it did on the 1993 cartridge. The game's own messages spell it out in full. We left the sign alone.</p>\n<h3>The slot machine</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/slot_machine.png\" data-shot=\"gorilla/manual/slot_machine.png\" alt=\"The slot machine\" loading=\"lazy\"></div><figcaption>The slot machine</figcaption></figure>\n<p><strong>SLOT MACHINE! PUSH THE BUTTON!</strong> The first press sets the reels spinning, and after that <strong>each press stops one reel</strong>.</p>\n<p>You'll see <strong>TOO BAD!</strong> more often than you'd like.</p>\n<h3>The horse race</h3>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/turfe.png\" data-shot=\"gorilla/manual/turfe.png\" alt=\"The betting board\" loading=\"lazy\"></div><figcaption>The betting board</figcaption></figure>\n<p><strong>HORSE RACING! GOOD LUCK!</strong> Six horses line up. The game goes around the table and asks each player in turn, <strong>YOUR BET?</strong> Put your G on the horse you like. The odds next to each horse are drawn fresh for every race, so read them before you pick.</p>\n<p>Once everyone has bet, the screen reads <strong>STARTING SOON!</strong> and they're off. At <strong>RACE OVER!</strong> the winners collect.</p>"}},{"id":"the-gorilla-man-quiz","titulo":{"en":"The Gorilla-Man Quiz"},"html":{"en":"<p>Some squares put you in front of a blackboard.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/quiz_quadro.png\" data-shot=\"gorilla/manual/quiz_quadro.png\" alt=\"A question\" loading=\"lazy\"></div><figcaption>A question</figcaption></figure>\n<p><strong>QUESTION</strong>, with three answers under it. Pick one with the Control Pad and press the A Button.</p>\n<p>Get it right and you gain 5: <strong>EV +5</strong>. Get it wrong and you lose 5: <strong>EV −5</strong>. A few questions can change the standings quickly.</p>\n<p>The questions jump around. Expect cars and Formula One, arithmetic, Japanese history and politics, geography, pro wrestling, boxing and other sports, and a fair number of questions about the manga itself.</p>\n<p>No, the answers aren't in this manual.</p>"}},{"id":"ramen-wolf","titulo":{"en":"Ramen Wolf"},"html":{"en":"<p>There's a ramen shop on the way home, Ramen Wolf. The sign on the board says <strong>RAMEN</strong>, and the owner isn't a patient man.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/wolf_menu.png\" data-shot=\"gorilla/manual/wolf_menu.png\" alt=\"The menu at Ramen Wolf\" loading=\"lazy\"></div><figcaption>The menu at Ramen Wolf</figcaption></figure>\n<p>Stop on that square and the menu comes up under the shop's <strong>RAMEN WOLF</strong> sign.</p>\n<table><thead><tr><th>Dish</th><th>Price</th><th>HP</th><th>EV</th></tr></thead><tbody><tr><td><strong>BEEF</strong></td><td>380 G</td><td>+16</td><td>+8</td></tr><tr><td><strong>CHASHU</strong></td><td>250 G</td><td>+12</td><td>+6</td></tr><tr><td><strong>MISO</strong></td><td>190 G</td><td>+8</td><td>+4</td></tr><tr><td><strong>SALT</strong></td><td>120 G</td><td>+6</td><td>+2</td></tr><tr><td><strong>SOY</strong></td><td>90 G</td><td>+4</td><td>+1</td></tr></tbody></table>\n<p>Choose <strong>NOTHING</strong> to walk out again.</p>\n<p>This is the one place on the board where you decide how much HP you get back, instead of leaving it to a square, and every bowl adds Event Points on top. In \"The Mysterious Girl,\" which is won on HP, save your money for the counter.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/arte_ramen.png\" data-shot=\"gorilla/manual/arte_ramen.png\" alt=\"The owner of Ramen Wolf\" loading=\"lazy\"></div><figcaption>The owner of Ramen Wolf</figcaption></figure>\n<p>He asks for your order in one of two moods: <strong>WHAT'LL IT BE?</strong> or <strong>QUIT STALLING AND ORDER!</strong> Try to order with an empty wallet and you get <strong>BROKE? THEN DON'T ORDER!</strong> He also keeps <strong>WHAT ARE YOU HERE FOR?! GET OUT! GET OUT!!</strong> ready for anyone who tries his patience.</p>\n<p>Pay up and he's almost polite: <strong>THANKS A LOT!</strong></p>"}},{"id":"party-mode","titulo":{"en":"Party Mode"},"html":{"en":"<p>PARTY MODE takes the events out of the board game and runs them on their own. There's no school, no days and no die. One to six players play through a course, and whoever finishes ahead wins.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_curso.png\" data-shot=\"gorilla/manual/tela_curso.png\" alt=\"Which course?\" loading=\"lazy\"></div><figcaption>Which course?</figcaption></figure>\n<p>First the game asks <strong>Which course to play?</strong> Then you set the number of players, the same way as in SCENARIO MODE. Three or more still need an adapter.</p>\n<h3>SPORTS COURSE</h3>\n<p>Arm Wrestling, then the baseball duel, then the 50m Dash, one after the other. The player with the most <strong>HP</strong> at the end takes it.</p>\n<h3>GAMBLE COURSE</h3>\n<p>Big or Small, then roulette, then the slot machine, then the horse race. The player with the most <strong>G</strong> at the end takes it.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/abertura_minijogo.png\" data-shot=\"gorilla/manual/abertura_minijogo.png\" alt=\"Make money\" loading=\"lazy\"></div><figcaption>Make money</figcaption></figure>\n<p>Each of the four money games opens the same way, here and on the board: <strong>MAKE MONEY!</strong> and <strong>PRESS A BUTTON.</strong> The rules are the same as on the board. See <strong>Arm Wrestling, Baseball and the 50m Dash</strong> and the section on Big or Small, roulette, the slot machine and the horse race.</p>"}},{"id":"whats-new-in-this-version","titulo":{"en":"What's New in This Version"},"html":{"en":"<p>This is a fan translation of the 1993 Famicom cartridge, and it does a little more than translate.</p>\n<figure class=\"man-fig\"><div class=\"crt\"><img src=\"shots/gorilla/manual/tela_abertura_patch.png\" data-shot=\"gorilla/manual/tela_abertura_patch.png\" alt=\"The opening screen\" loading=\"lazy\"></div><figcaption>The opening screen</figcaption></figure>\n<h3>Almost everything is in English</h3>\n<p>Menus, the board, the item window, the event titles, the cards, the fight messages, the minigames, the ramen menu and all 300-odd lines of the quiz. A few small marks drawn into the artwork, like the symbols down the side of the blackboard, were left as they were.</p>\n<h3>The title screen has a menu</h3>\n<p><strong>START</strong>, <strong>CONTINUE</strong> and <strong>OPTIONS</strong>. The original just waited for you to press START.</p>\n<h3>You can save</h3>\n<p>There are three slots, from the <strong>SAVE</strong> command on the board, and <strong>CONTINUE</strong> puts you back on the turn of the player who saved. The 1993 cartridge board has no memory for this, so saving works in an emulator or on a flash cart.</p>\n<h3>Any multitap will do</h3>\n<p>The original needed the Party Tap. This version also takes the Four Score (and the NES Satellite) and the Famicom four-player adapter, looks for whichever one you have plugged in, and asks each player to claim his own controller.</p>\n<p>If it finds nothing at all, it tells you so and lets you try again. The original simply stopped.</p>\n<h3>Two cartridge bugs are fixed</h3>\n<p>The 1993 cartridge promised three scenarios and finished one. In <strong>\"I Don't Want to Get Expelled!\"</strong> and <strong>\"The Mysterious Girl\"</strong>, the game froze right after the last illustration and never came back. All three scenarios now play through to the end.</p>\n<p>The second bug: if any player's HP reached zero, the game ended right there for everybody, and the only way out was to reset the console. That no longer happens. If your HP hits zero now, the day goes on.</p>\n<h3>Where it came from</h3>\n<p>The opening screen shows the version you're playing and where to find us.</p>"}},{"id":"screen-glossary","titulo":{"en":"Screen Glos
