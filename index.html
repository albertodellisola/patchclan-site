sary"},"html":{"en":"<p>The words the game shows you most, in one place.</p>\n<h3>Your window</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>EV</strong></td><td>Event Points. They decide two of the three scenarios.</td></tr><tr><td><strong>HP</strong></td><td>Stamina. It decides the other one.</td></tr><tr><td><strong>G</strong></td><td>Money.</td></tr><tr><td><strong>#</strong></td><td>Your place in the standings. <strong>#1</strong> is first.</td></tr></tbody></table>\n<h3>The command window</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>DICE</strong></td><td>Roll and move.</td></tr><tr><td><strong>INFO</strong></td><td>Look at the other players' windows and items.</td></tr><tr><td><strong>MAP</strong></td><td>See the route you're on.</td></tr><tr><td><strong>RANK</strong></td><td>See everyone's standing.</td></tr><tr><td><strong>SAVE</strong></td><td>Store the game in one of three slots.</td></tr></tbody></table>\n<h3>On the board</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>AT SCHOOL</strong></td><td>You've reached the school.</td></tr><tr><td><strong>RANKING</strong></td><td>Who reached school first: EV +8, +6 and +4 for the first three.</td></tr><tr><td><strong>--- LATE ---</strong></td><td>Late for school: not in the first three, and you lose 4 EV.</td></tr><tr><td><strong>NEXT</strong></td><td>Shown with the name of the next route, as in NEXT / CLASS BOARD.</td></tr><tr><td><strong>CLASS BOARD</strong></td><td>The route from the gate to the classroom.</td></tr><tr><td><strong>AT STATION</strong></td><td>You've reached the station.</td></tr><tr><td><strong>JOB</strong></td><td>Your part-time work.</td></tr><tr><td><strong>BONUS</strong></td><td>Extra pay.</td></tr><tr><td><strong>ITEM</strong></td><td>The item card you're holding.</td></tr><tr><td><strong>ARNOLD GUARD</strong></td><td>The card that keeps Gorilla-Man off you. Two lines on screen: ARNOLD over GUARD.</td></tr><tr><td><strong>JOB PASS</strong></td><td>The work permit Mr. Kono accepts. Two lines on screen: JOB over PASS.</td></tr><tr><td><strong>SKIP</strong>, <strong>SKIP 1</strong></td><td>You lose a turn.</td></tr><tr><td><strong>FIGHT!!</strong></td><td>A brawl starts.</td></tr><tr><td><strong>QUESTION</strong></td><td>A quiz question, with three answers under it.</td></tr><tr><td><strong>RESULTS</strong></td><td>The final standings, after the last day: EV, HP and G for everyone.</td></tr></tbody></table>\n<h3>In the classroom</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>PICK A DESK</strong></td><td>Choose where to move.</td></tr><tr><td><strong>MOVE</strong></td><td>The cursor setting you steer with.</td></tr><tr><td><strong>STATS</strong></td><td>The cursor setting that shows how the players stand.</td></tr><tr><td><strong>BLOCKED</strong></td><td>Another player is standing on that desk.</td></tr><tr><td><strong>IS UP</strong></td><td>Whose turn it is, after the player's name.</td></tr><tr><td><strong>CLASS IS OVER</strong></td><td>No empty desks left. Points are paid out.</td></tr></tbody></table>\n<h3>Title screen and options</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>START</strong></td><td>New game.</td></tr><tr><td><strong>CONTINUE</strong></td><td>Load a saved game. Grayed out when there is none.</td></tr><tr><td><strong>OPTIONS</strong></td><td>Adapter settings.</td></tr><tr><td><strong>CONTROLLER</strong></td><td>Which adapter you're using.</td></tr><tr><td><strong>STANDARD</strong></td><td>Controllers only.</td></tr><tr><td><strong>PARTY TAP</strong></td><td>The Japanese adapter made for this game.</td></tr><tr><td><strong>FOUR SCORE</strong></td><td>The NES four-player adapter. Also the setting for the NES Satellite.</td></tr><tr><td><strong>FAMICOM 4P</strong></td><td>The Famicom expansion-port adapter.</td></tr><tr><td><strong>BACK</strong></td><td>Leave this screen.</td></tr><tr><td><strong>EMPTY</strong></td><td>That save slot has nothing in it.</td></tr><tr><td><strong>PLAYER #, PRESS A</strong></td><td>Claim a controller for that player.</td></tr><tr><td><strong>CONNECT A MULTITAP</strong></td><td>No adapter found. <strong>A: TRY AGAIN   B: BACK</strong></td></tr></tbody></table>\n<h3>Saving</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>1FREE</strong></td><td>Slot 1 is empty.</td></tr><tr><td><strong>1USED</strong></td><td>Slot 1 has a game in it.</td></tr><tr><td><strong>SAVED</strong></td><td>The game was written to the slot.</td></tr></tbody></table>\n<h3>At Ramen Wolf</h3>\n<table><thead><tr><th>On screen</th><th>What it means</th></tr></thead><tbody><tr><td><strong>MENU</strong></td><td>The list of bowls.</td></tr><tr><td><strong>BEEF</strong></td><td>Grilled beef ramen, 380 G.</td></tr><tr><td><strong>CHASHU</strong></td><td>Roast pork ramen, 250 G.</td></tr><tr><td><strong>MISO</strong></td><td>Ramen in a bean-paste broth, 190 G.</td></tr><tr><td><strong>SALT</strong></td><td>Ramen in a salt broth, 120 G.</td></tr><tr><td><strong>SOY</strong></td><td>Ramen in a soy sauce broth, 90 G.</td></tr><tr><td><strong>NOTHING</strong></td><td>Leave without ordering.</td></tr></tbody></table>"}},{"id":"credits-and-notices","titulo":{"en":"Credits and Notices"},"html":{"en":"<h3>The game</h3>\n<p><strong>The Gorilla Man</strong> Family Computer, released April 28, 1993. Published by Yonezawa PR21. Developed by PARTY ROOM 21. Cartridge number YZW-GR.</p>\n<p>The title screen shows the notices the cartridge was sold with, and we left them exactly as they are:</p>\n<blockquote><p>©H.SAKUISHI/YOUNG MAGAZINE ©1992 YONEZAWA/S'PAL</p></blockquote>\n<h3>The manga</h3>\n<p>The manga, by <strong>Harold Sakuishi</strong>, ran in Weekly Young Magazine from 1988 to 1993 and was collected in nineteen volumes by Kodansha. It won the Kodansha Manga Award in 1990. There has never been a licensed English edition.</p>\n<h3>This translation</h3>\n<p>This is an unofficial fan translation, made by the <strong>Patch Clan</strong> and given away as a patch. We distribute the patch only. We never distribute ROMs.</p>\n<p><strong>SUPPORT: WWW.PATCHCLAN.COM</strong></p>\n<h3>Technical note</h3>\n<p>The cartridge uses an MMC3 board with 512 KB of program ROM. The patch adds 8 KB of battery-backed memory for saving, which the original board didn't have.</p>\n<h3>Before you play</h3>\n<p>Keep this manual where you can find it again.</p>\n<ul>\n<li>If you or anyone in your family has ever had epileptic symptoms, see a doctor before playing.</li>\n<li>Stop at once and see a doctor if, while playing, you feel dizzy, your eyes or muscles twitch, you lose awareness, or you become disoriented.</li>\n<li>Sit well back from the screen and play in a well-lit room.</li>\n<li>Take a 10- to 15-minute break every hour or two, even if you feel fine.</li>\n<li>Do not play when you are tired or short of sleep.</li>\n</ul>"}}]}},"guias":{}}</script>

<script>
(function(){
  'use strict';
  var CFG = window.PATCHCLAN_CONFIG || null;
  var D = JSON.parse(document.getElementById('seed').textContent);
  var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MESES_ES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var LANG_ATTR = { en:'en', pt:'pt-BR', es:'es' };

  function e(s){ return s == null ? '' : String(s); }
  function L(par){
    if (!par) return '';
    if (typeof par === 'string') par = { en: par };
    var v = { en: par.en || par.pt || par.es, pt: par.pt || par.en || par.es, es: par.es || par.en || par.pt };
    return ['en','pt','es'].map(function(l){
      return '<span class="'+l+'" lang="'+LANG_ATTR[l]+'">'+e(v[l])+'</span>';
    }).join('');
  }
  function txt(par, l){                      /* uma língua só, para atributos */
    if (!par) return '';
    if (typeof par === 'string') return par;
    return e(par[l] || par.en || par.pt || par.es);
  }
  function pix(l){ return l.join('').split('').map(function(c){ return c==='#'?'<i class="on"></i>':'<i></i>'; }).join(''); }
  var T_MARK=['...##...','..#..#..','.#....#.','##....##','##....##','.#....#.','..#..#..','...##...'];
  function jogo(slug){ return (D.games||[]).filter(function(g){ return g.slug===slug; })[0]; }
  /* prints por idioma: quem le em portugues ve a tela em portugues.
     SHOTS_IDI mapeia o print base -> a variante daquele idioma; sem variante, cai no base. */
  var SHOTS_IDI = {"pt":{"ct/01-titulo.png":"ct/pt/01-titulo.png","ct/02-sala.png":"ct/pt/02-sala.png","ct/03-narrador.png":"ct/pt/03-narrador.png","ct/04-ficha.png":"ct/pt/04-ficha.png","ct/05-jogo.png":"ct/pt/05-jogo.png","ct/06-senha.png":"ct/pt/06-senha.png","ct/08-save.png":"ct/pt/08-save.png","fj2/02-creditos.png":"fj2/pt/02-creditos.png","fj2/03-menu-ingles.png":"fj2/pt/03-menu-ingles.png","fj2/04-prologo-novo.png":"fj2/pt/04-prologo-novo.png","fj2/05-espirito-jump-world.png":"fj2/pt/05-espirito-jump-world.png","fj2/06-lista-sete-campeoes.png":"fj2/pt/06-lista-sete-campeoes.png","fj2/07-e-voce-tambem-goku.png":"fj2/pt/07-e-voce-tambem-goku.png","fj2/08-soulring.png":"fj2/pt/08-soulring.png"},"es":{"fj2/02-creditos.png":"fj2/es/02-creditos.png","fj2/03-menu-ingles.png":"fj2/es/03-menu-ingles.png","fj2/04-prologo-novo.png":"fj2/es/04-prologo-novo.png","fj2/05-espirito-jump-world.png":"fj2/es/05-espirito-jump-world.png","fj2/06-lista-sete-campeoes.png":"fj2/es/06-lista-sete-campeoes.png","fj2/07-e-voce-tambem-goku.png":"fj2/es/07-e-voce-tambem-goku.png","fj2/08-soulring.png":"fj2/es/08-soulring.png"}};
  var LANG_ATUAL = 'en';
  function img(f, l){
    if (!f) return '';
    var m = SHOTS_IDI[l || LANG_ATUAL];
    if (m && m[f]) f = m[f];
    return (f.slice(0,5) === 'data:') ? f : 'shots/' + e(f);
  }
  /* data-shot guarda o print base: a troca de idioma e so CSS, entao o src se repinta a mao */
  function foto(f, alt, carga){
    /* Sem captura ainda (projeto que nao rodou em emulador): bloco neutro, nunca img quebrada. */
    if (!f) return '<span class="sem-tela" aria-hidden="true"></span>';
    return '<img src="'+img(f)+'" data-shot="'+e(f)+'" alt="'+e(alt)+'" loading="'+(carga||'lazy')+'">';
  }
  /* Capa = banner do Patreon (arte larga, nao pixel art): classe propria para o CSS nao ampliar em blocos. */
  function capa(f, alt, carga){ return foto(f, alt, carga).replace('<img ', '<img class="capa" '); }
  function repintaFotos(){
    var ns = document.querySelectorAll('img[data-shot]');
    for (var i = 0; i < ns.length; i++) {
      var s = img(ns[i].getAttribute('data-shot'));
      if (ns[i].getAttribute('src') !== s) ns[i].setAttribute('src', s);
    }
  }
  function crt(src, alt){ return '<div class="crt">'+foto(src, alt)+'</div>'; }
  function data(iso){
    var d = String(iso).split('-'), n = +d[2], m = +d[1]-1;
    return { pt: d[2]+' '+MESES[m]+' '+d[0], en: n+' '+MONTHS[m]+' '+d[0], es: d[2]+' '+MESES_ES[m]+' '+d[0] };
  }
  var IDI = [['en','🇺🇸',{en:'English',pt:'Inglês',es:'Inglés'}],
             ['pt','🇧🇷',{en:'Portuguese',pt:'Português',es:'Portugués'}],
             ['es','🇪🇸',{en:'Spanish',pt:'Espanhol',es:'Español'}]];
  /* grade de download por idioma: o que não existe fica esmaecido */
  /* `destino`, quando vem preenchido, manda o botão para fora em vez de baixar o
     arquivo: é o que faz beta e alfa saírem pelo Patreon. Release não recebe destino
     e continua baixando de patches/. */
  /* Um arquivo so para varios idiomas: quando todas as versoes apontam para o MESMO
     arquivo, tres cartoes de download seriam tres vezes o mesmo link. Devolve a versao
     comum; devolve null quando os arquivos diferem (ou quando so ha um idioma). */
  function arquivoUnico(versoes){
    var vs = IDI.map(function(x){ return (versoes||{})[x[0]]; }).filter(Boolean);
    if (vs.length < 2) return null;
    for (var i = 1; i < vs.length; i++) if (vs[i].arquivo !== vs[0].arquivo) return null;
    return vs[0];
  }
  function cartaoUnico(versoes, pasta, tipo, destino, nota){
    var v = arquivoUnico(versoes), tem = IDI.filter(function(x){ return (versoes||{})[x[0]]; });
    return '<div class="patch-uno"><div class="bandas">' + tem.map(function(x){
        return '<div class="banda"><span class="fl" aria-hidden="true">'+x[1]+'</span>' +
          '<span class="cod">'+L(x[2])+'</span></div>'; }).join('') + '</div>' +
      '<div class="corpo"><div>' +
        '<h4>'+L({pt:'Um patch, os três idiomas',en:'One patch, all three languages',
                  es:'Un parche, los tres idiomas'})+'</h4>' +
        '<p class="ficha"><b>'+e(v.arquivo)+'</b> · '+tipo+' · '+e(v.tamanho) +
          (nota ? '<br>'+L(nota) : '') + '</p></div>' +
      (destino
        ? '<a class="bt patreon" href="'+e(destino)+'" target="_blank" rel="noopener">&hearts; ' +
          L({pt:'No Patreon',en:'On Patreon',es:'En Patreon'})+'</a>'
        : '<a class="bt" href="'+pasta+'/'+e(v.arquivo)+'" download>&#9654; ' +
          L({pt:'Baixar o patch',en:'Download the patch',es:'Descargar el parche'})+'</a>') +
      '</div></div>';
  }
  /* Hack/Fix: um arquivo só e o jogo no idioma original — a grade por idioma não se aplica. */
  function cartaoHack(g){
    var v = ((g.patch||{}).versoes||{}).jp, nota = (g.patch||{}).nota;
    if (!v) return '<div class="pt-item vazio"><div class="aviso">'+L({pt:'ainda não existe',en:'does not exist yet',es:'todavía no existe'})+'</div></div>';
    return '<div class="patch-uno"><div class="bandas"><div class="banda"><span class="cod">JP</span></div></div>' +
      '<div class="corpo"><div>' +
        '<h4>'+L({pt:'Um patch, o jogo em japonês',en:'One patch, the game stays in Japanese',es:'Un parche, el juego sigue en japonés'})+'</h4>' +
        '<p class="ficha"><b>'+e(v.arquivo)+'</b> · IPS · '+e(v.tamanho) + (nota ? '<br>'+L(nota) : '') + '</p></div>' +
      (destinoPatch(g)
        ? '<a class="bt patreon" href="'+e(destinoPatch(g))+'" target="_blank" rel="noopener">&hearts; '+L({pt:'No Patreon',en:'On Patreon',es:'En Patreon'})+'</a>'
        : '<a class="bt" href="'+pastaPatch(g)+'/'+e(v.arquivo)+'" download>&#9654; '+L({pt:'Baixar o patch',en:'Download the patch',es:'Descargar el parche'})+'</a>') +
      '</div></div>';
  }
  function gradeIdiomas(versoes, pasta, tipo, destino, nota){
    if (arquivoUnico(versoes)) return cartaoUnico(versoes, pasta, tipo, destino, nota);
    return '<div class="patches">' + IDI.map(function(x){
      var v = (versoes||{})[x[0]];
      var cab = '<div class="idi"><span class="fl" aria-hidden="true">'+x[1]+'</span>'+L(x[2])+'</div>';
      if (!v) {
        return '<div class="pt-item vazio">'+cab+'<div class="aviso">' +
          L({pt:'ainda não existe',en:'does not exist yet',es:'todavía no existe'})+'</div></div>';
      }
      if (destino) {
        return '<div class="pt-item">'+cab +
          '<div class="tam">'+tipo+' · '+e(v.tamanho)+'</div>' +
          '<a class="bt patreon" href="'+e(destino)+'" target="_blank" rel="noopener">♥ ' +
          L({pt:'No Patreon',en:'On Patreon',es:'En Patreon'})+'</a></div>';
      }
      return '<div class="pt-item">'+cab +
        '<div class="tam">'+tipo+' · '+e(v.tamanho)+'</div>' +
        '<a class="bt" href="'+pasta+'/'+e(v.arquivo)+'" download>▶ ' +
        L({pt:'Baixar',en:'Download',es:'Descargar'})+'</a></div>';
    }).join('') + '</div>';
  }
  /* De ONDE o botão baixa, e por que isso não é detalhe: o GitHub Pages serve
     patches/ sem contar nada — não há log nem contador por arquivo. O GitHub
     Releases conta cada download do asset (campo `download_count` na API), venha
     do botão, de link direto ou de espelho em fórum. Jogo que declara
     `patch.release` baixa de lá; sem isso, continua saindo de patches/.
     A tag carrega a VERSÃO de propósito: versão nova é release nova, para que a
     contagem da anterior não seja zerada nem o arquivo trocado em silêncio.
     Ler a contagem: `python3 build/contagem_downloads.py`. */
  var REPO_RELEASES = 'https://github.com/albertodellisola/patchclan-site/releases/download/';
  function pastaPatch(g){
    return (g.patch && g.patch.release) ? REPO_RELEASES + g.patch.release : 'patches';
  }
  /* Onde o patch de um projeto inacabado vive: a postagem do Patreon daquele jogo,
     e o Patreon da casa enquanto a postagem não tiver link próprio. */
  function destinoPatch(g){
    if (g.nivel === 'release') return '';
    return g.patreon || ((D.content.patreon||{}).url) || 'https://www.patreon.com/patchclan';
  }
  /* Manual e GUIA são o mesmo mecanismo: texto escrito em build/, lido no site, nos três
     idiomas, e que entra em toda versão do jogo. Nenhum dos dois se baixa — o PDF saiu do
     ar em 10/09/2026; o que fica é o link ao lado do download do patch. Um link só existe
     quando o documento existe, pela mesma regra da bandeira: nada se anuncia sem lastro. */
  var DOCS = {
    manual: { colecao:'manuais', rota:'manual',
      ler:  {pt:'Leia o manual',en:'Read the manual',es:'Lee el manual'},
      rot:  {pt:'Manual',en:'Manual',es:'Manual'},
      sub:  {pt:'Os comandos do jogo, escritos sobre o patch — cada palavra citada é a que está na tela.',
             en:'The game’s commands, written over the patch — every word quoted is the one on screen.',
             es:'Los comandos del juego, escritos sobre el parche — cada palabra citada es la que está en pantalla.'},
      espera:{pt:'O manual deste jogo está em preparação.',
              en:'The manual for this game is being prepared.',
              es:'El manual de este juego está en preparación.'} },
    guia: { colecao:'guias', rota:'guia',
      ler:  {pt:'Leia o guia',en:'Read the guide',es:'Lee la guía'},
      rot:  {pt:'Guia',en:'Guide',es:'Guía'},
      sub:  {pt:'Como jogar bem: o que priorizar, o que evitar e as armadilhas do cartucho.',
             en:'How to play it well: what to prioritise, what to avoid, and the cartridge’s traps.',
             es:'Cómo jugarlo bien: qué priorizar, qué evitar y las trampas del cartucho.'},
      espera:{pt:'O guia deste jogo está em preparação.',
              en:'The guide for this game is being prepared.',
              es:'La guía de este juego está en preparación.'} }
  };
  function doc(tipo, slug){ return (D[DOCS[tipo].colecao] || {})[slug]; }
  /* O cartão de um documento. Um só desenho, usado nos dois lugares onde se convida a ler:
     abaixo do patch, na ficha do jogo, e no fim do outro documento. */
  function cartaoDoc(slug, tipo){
    return '<a class="leitura" href="#/'+DOCS[tipo].rota+'/'+e(slug)+'">' +
      '<span class="idi">'+L(DOCS[tipo].rot)+'</span>' +
      '<b>'+L(doc(tipo, slug).titulo)+'</b>' +
      '<span class="sub">'+L(DOCS[tipo].sub)+'</span>' +
      '<span class="cta">'+L(DOCS[tipo].ler)+' →</span></a>';
  }
  /* A faixa de leitura, logo abaixo do patch: o manual ensina a jogar, o guia ensina a
     jogar bem. Os dois moram no site — não há arquivo, e por isso não há idioma faltando:
     quem trocar a bandeira do topo troca o texto inteiro junto. */
  function leituras(g){
    var ls = ['manual','guia'].filter(function(t){ return doc(t, g.slug); });
    if (!ls.length) return '';
    return '<h3 style="margin:44px 0 14px">'+L({pt:'Para jogar',en:'To play it',es:'Para jugarlo'})+'</h3>' +
      '<div class="leituras">' + ls.map(function(t){ return cartaoDoc(g.slug, t); }).join('') + '</div>';
  }
  function linkDoc(g, tipo, cls){
    if (!doc(tipo, g.slug)) return '';
    return '<a class="'+cls+'" href="#/'+DOCS[tipo].rota+'/'+e(g.slug)+'">'+L(DOCS[tipo].ler)+'</a>';
  }

  /* Três níveis, e só três. O nível de um projeto é o mesmo que os apoiadores
     recebem: alfa no Seventh Hero, beta no Bank Switch, release para todo mundo. */
  var NIVEIS = {
    release: { marca:'✓', cls:'on',   rot:{pt:'Release',en:'Release',es:'Release'} },
    beta:    { marca:'●', cls:'beta', rot:{pt:'Beta',   en:'Beta',   es:'Beta'} },
    alfa:    { marca:'○', cls:'alfa', rot:{pt:'Alfa',   en:'Alpha',  es:'Alfa'} }
  };
  function nivel(g){ return NIVEIS[g.nivel] || NIVEIS.alfa; }
  function selo(g){
    var n = nivel(g);
    return '<span class="pill '+n.cls+'">'+n.marca+' '+L(n.rot)+'</span>' + bandeiras(g);
  }
  /* As bandeiras saem do que existe em patches/, não de uma lista escrita à mão:
     um idioma só aparece quando o arquivo dele existe. */
  function bandeiras(g){
    var v = (g.patch||{}).versoes||{};
    var tem = IDI.filter(function(x){ return v[x[0]]; });
    if (!tem.length) return '';
    return '<span class="idiomas" role="list">' + tem.map(function(x){
      return '<span role="listitem" class="fl" title="'+txt(x[2],'en')+'">' + x[1] +
        '<span class="cod">'+x[0].toUpperCase()+'</span></span>';
    }).join('') + '</span>';
  }

  /* ---------------- HOME ---------------- */
  function home(){
    var c = D.content, h = c.hero||{}, jogos = D.games||[];
    function conta(n){ return jogos.filter(function(g){ return g.nivel === n; }).length; }
    var prontos = conta('release'), betas = conta('beta'), alfas = conta('alfa');
    var d = jogos.filter(function(g){ return g.destaque; })[0] || jogos[0];
    var out = '<div class="hero"><div class="hero-txt">' +
      '<p class="kicker">'+L(h.eyebrow)+'</p>' +
      '<h1>'+L(h.title)+'<em>'+L(h.accent)+'</em></h1>' +
      '<p class="lede">'+L(h.curta)+'</p>' +
      '<div class="hero-ctas">' +
        '<a class="bt" href="#/traducoes">'+L((h.ctas||{}).projetos)+'</a>' +
        '<div class="cta-apoio">' +
          '<a class="bt fora" href="#/apoie">♥ '+L((h.ctas||{}).apoiar)+'</a>' +
          '<span class="nota">'+L((h.ctas||{}).apoiarNota)+'</span>' +
        '</div>' +
      '</div>' +
      '<p class="hero-regra">'+L((h.ctas||{}).regra)+'</p></div>';

    /* o showcase: o visitante vê um jogo antes de rolar */
    if (d) {
      out += '<a class="vitrine" href="#/jogo/'+e(d.slug)+'">' +
        '<div class="tela">'+capa(d.capa, d.nome+' — '+txt(d.linha,'en'), 'eager')+'</div>' +
        '<div class="corpo">' +
          '<div class="topo">'+selo(d)+'</div>' +
          '<h2>'+e(d.nome)+'</h2>' +
          '<p class="ficha-card">'+e(d.sistema)+' · '+e(d.ano)+' · '+L({pt:'inglês',en:'English',es:'inglés'})+'</p>' +
          '<p class="cat">'+L(d.categoria)+'</p>' +
          '<p class="ir">'+L({pt:'Ver o projeto →',en:'View project →',es:'Ver el proyecto →'})+'</p>' +
        '</div></a>';
    }
    out += '</div>';

    /* rodapé da dobra: o placar, com a atividade em destaque */
    out += '<div class="placar">' +
      '<div class="nums">' +
        '<span><b>'+jogos.length+'</b> '+L({pt:'projetos',en:'projects',es:'proyectos'})+'</span>' +
        '<span><b>'+prontos+'</b> release</span>' +
        '<span><b>'+betas+'</b> beta</span>' +
        '<span><b>'+alfas+'</b> '+L({pt:'alfa',en:'alpha',es:'alfa'})+'</span>' +
      '</div>' +
      ((D.posts||[])[0] ? '<div class="vivo"><span class="bolinha" aria-hidden="true"></span>' +
        L(h.ativo)+' — '+L({pt:'build',en:'build',es:'build'})+' '+L(data(D.posts[0].date))+'</div>' : '') +
    '</div>';

    /* projetos */
    out += '<section><p class="label">'+L({pt:'Traduções',en:'Translations',es:'Traducciones'})+'</p><div class="projetos">' +
      jogos.filter(function(g){ return secao(g) === 'traducoes'; }).map(cardProjeto).join('') + '</div>' +
      '<p class="ver-todas"><a href="#/traducoes">' +
        L({pt:'Ver as traduções por estado →', en:'See the translations by stage →', es:'Ver las traducciones por estado →'}) +
      '</a></p></section>';

    /* nao e so traducao */
    out += secaoProvas();

    /* ultimas atualizacoes */
    var ps = (D.posts||[]).slice(0,3);
    if (ps.length) {
      out += '<section><p class="label">'+L({pt:'Últimas atualizações',en:'Latest updates',es:'Últimas novedades'})+'</p>' +
        '<div class="updates">' + ps.map(cardUpdate).join('') + '</div>' +
        '<p class="ver-todas"><a href="#/atualizacoes">'+L({pt:'Ver todas →',en:'View all →',es:'Ver todas →'})+'</a></p></section>';
    }

    out += patreonResumo();
    out += secaoPromessas();
    return out;
  }

  function cardProjeto(g){
    return '<article class="proj">' +
      '<a class="tela" href="#/jogo/'+e(g.slug)+'" tabindex="-1" aria-hidden="true">'+capa(g.capa, '')+'</a>' +
      '<div class="corpo">' +
        '<div>'+selo(g)+'</div>' +
        '<h3><a href="#/jogo/'+e(g.slug)+'">'+e(g.nome)+'</a></h3>' +
        '<div class="ficha">'+e(g.publisher)+' · '+e(g.ano)+' · '+e(g.sistema)+'</div>' +
        '<div class="cat">'+L(g.categoria)+'</div>' +
        '<p class="linha">'+L(g.linha)+'</p>' +
        '<div class="ir"><a href="#/jogo/'+e(g.slug)+'">'+L({pt:'Ver projeto →',en:'View project →',es:'Ver proyecto →'})+'</a></div>' +
      '</div></article>';
  }

  function resumo(o, l){
    var b = (o['body_'+l] && o['body_'+l].length ? o['body_'+l] : o.body_en) || [];
    var t = b[0] || '';
    return t.length > 165 ? t.slice(0,162).replace(/\s+\S*$/,'') + '…' : t;
  }
  function cardUpdate(o){
    return '<article class="upd">' +
      '<div class="quando">'+L(data(o.date))+(o.tag?' · '+e(o.tag):'')+'</div>' +
      '<h3>'+L({pt:o.title_pt,en:o.title_en,es:o.title_es})+'</h3>' +
      '<p>'+L({pt:resumo(o,'pt'),en:resumo(o,'en'),es:resumo(o,'es')})+'</p>' +
      '<div class="ler"><a href="#/atualizacoes">'+L({pt:'Ler o devlog →',en:'Read the devlog →',es:'Leer el devlog →'})+'</a></div>' +
      '</article>';
  }

  function secaoProvas(){
    var p = (D.content.provas||{}).itens||[];
    if (!p.length) return '';
    return '<section><p class="label">'+L({pt:'Não é só tradução',en:'Not just translation',es:'No es solo traducción'})+'</p>' +
      '<div class="col"><h2>'+L({pt:'O que muda dentro do cartucho.',en:'What changes inside the cartridge.',es:'Lo que cambia dentro del cartucho.'})+'</h2></div>' +
      '<div class="provas" style="margin-top:34px">' + p.map(function(x){
        var g = jogo(x.jogo);
        return '<div class="prova"><p class="et">'+L(x.etiqueta)+'</p>' +
          '<b class="n">'+L(x.numero)+'</b><span class="u">'+L(x.unidade)+'</span>' +
          '<p>'+L(x.texto)+'</p>' +
          (g ? '<p class="onde"><a href="#/jogo/'+e(g.slug)+'">'+e(g.nome)+' →</a></p>' : '') +
          '</div>';
      }).join('') + '</div></section>';
  }
  /* A equipe: cinco cargos sem nome e as seis etapas com o critério de cada uma
     (o estado por jogo mora em build/etapas.mjs). */
  function secaoEquipe(){
    var q = D.content.equipe; if (!q || !(q.cargos||[]).length) return '';
    var marca = {feito:'✓', andamento:'◐', nao:'○'};
    return '<section><p class="label">'+L({pt:'A equipe',en:'The team',es:'El equipo'})+'</p>' +
      '<div class="col"><p>'+L(q.intro)+'</p></div><dl class="rules">' +
      q.cargos.map(function(c){
        return '<div class="rule"><dt>'+L(c.nome)+'</dt><dd>'+L(c.texto)+'</dd></div>'; }).join('') +
      '</dl></section>' +
      '<section><p class="label">'+L({pt:'As etapas',en:'The stages',es:'Las etapas'})+'</p>' +
      '<p class="legenda-etapas">' + ['feito','andamento','nao'].map(function(s){
        return '<span><span aria-hidden="true">'+marca[s]+'</span> '+L(q.estados[s])+'</span>'; }).join('') + '</p>' +
      '<dl class="rules">' + (q.etapas||[]).map(function(x, i){
        return '<div class="rule"><dt>'+(i+1)+'. '+L(x.curto)+'</dt><dd>'+L(x.criterio)+'</dd></div>'; }).join('') +
      '</dl></section>';
  }
  function faixaEtapas(g){
    var q = D.content.equipe, et = g.etapas;
    if (!q || !et) return '';
    var marca = {feito:'✓', andamento:'◐', nao:'○'};
    return '<ol class="etapas">' +
      (q.etapas||[]).filter(function(x){ return x.id in et; }).map(function(x){   /* hack: só as dele */
        var s = et[x.id] || 'nao';
        return '<li class="etapa '+s+'">' +
          '<span aria-hidden="true">'+marca[s]+'</span> '+L(x.curto) +
          '<span class="vh"> — '+L(q.estados[s])+'</span></li>'; }).join('') +
      '<li class="etapa-mais"><a href="#/sobre">'+L({pt:'o que cada etapa exige',en:'what each stage requires',es:'qué exige cada etapa'})+' →</a></li></ol>';
  }
  function secaoPromessas(){
    var p = (D.content.promessas||{}).itens||[];
    if (!p.length) return '';
    return '<section style="border-bottom:0"><div class="promessas">' + p.map(function(x){
      return '<div class="promessa"><h4>'+L(x.titulo)+'</h4><p>'+L(x.texto)+'</p></div>';
    }).join('') + '</div></section>';
  }

  /* ---------------- TRADUÇÕES e HACKS/FIXES ---------------- */
  /* Dois menus, a mesma página. `tipo: 'hack'` no arquivo do jogo põe o projeto em
     Hacks/Fixes: versão sem tradução, só com correções (ex.: o cartucho japonês sem
     os bugs). Sem o campo, é tradução. */
  function secao(g){ return g && g.tipo === 'hack' ? 'hacks' : 'traducoes'; }
  function paginaHacks(){
    var lista = (D.games||[]).filter(function(g){ return secao(g) === 'hacks'; });
    var out = '<section><p class="label">Hacks/Fixes</p>' +
      '<div class="col"><h1 style="font-size:clamp(32px,4.6vw,48px)">Hacks/Fixes</h1>' +
      '<p class="lede">'+L({pt:'O jogo no idioma original, sem os bugs de fábrica. Nada é traduzido aqui: o que muda é o cartucho que trava, congela ou perde o save.',
                            en:'The game in its original language, minus the factory bugs. Nothing is translated here: what changes is the cartridge that crashes, freezes or loses its save.',
                            es:'El juego en su idioma original, sin los bugs de fábrica. Aquí no se traduce nada: lo que cambia es el cartucho que se cuelga, se congela o pierde la partida.'})+'</p></div>';
    if (!lista.length) {
      return out + '<p class="intro" style="margin-top:34px">'+L({pt:'Nenhum ainda. O primeiro está a caminho.',
        en:'None yet. The first one is on its way.', es:'Ninguno todavía. El primero está en camino.'})+'</p></section>';
    }
    ['release','beta','alfa'].forEach(function(n){
      var gr = lista.filter(function(g){ return g.nivel === n; });
      if (!gr.length) return;
      out += '<div class="grupo-status" style="margin-top:44px"><h3>'+L(NIVEIS[n].rot)+' <span style="color:var(--accent)">'+gr.length+'</span></h3>' +
        '<div class="projetos">' + gr.map(cardProjeto).join('') + '</div></div>';
    });
    return out + '</section>';
  }
  function paginaProjetos(){
    var jogos = (D.games||[]).filter(function(g){ return secao(g) === 'traducoes'; });
    var grupos = ['release','beta','alfa'].map(function(n){
      return { n:n, t:NIVEIS[n].rot, f:function(g){ return g.nivel === n; } };
    });
    var out = '<section><p class="label">'+L({pt:'Traduções',en:'Translations',es:'Traducciones'})+'</p>' +
      '<div class="col"><h1 style="font-size:clamp(32px,4.6vw,48px)">'+L({pt:'Traduções',en:'Translations',es:'Traducciones'})+'</h1>' +
      '<p class="lede">'+L({pt:'O Patch Clan não é um site sobre alguns jogos: é uma oficina de projetos, e estes são os que existem hoje.',
                            en:'Patch Clan is not a site about a few games: it is a workshop of projects, and these are the ones that exist today.',
                            es:'Patch Clan no es un sitio sobre unos juegos: es un taller de proyectos, y estos son los que existen hoy.'})+'</p></div>';
    var nv = D.content.niveis;
    if (nv) {
      out += '<div class="regua"><h3>'+L(nv.titulo)+'</h3><p class="intro">'+L(nv.intro)+'</p><dl>' +
        (nv.itens||[]).map(function(x){
          var n = NIVEIS[x.chave];
          return '<div><dt><span class="pill '+n.cls+'">'+x.marca+' '+L(n.rot)+'</span></dt>' +
            '<dd>'+L(x.texto)+'</dd></div>';
        }).join('') + '</dl>' +
        (nv.fecho ? '<p class="fecho">'+L(nv.fecho)+'</p>' : '') + '</div>';
    }
    grupos.forEach(function(gr){
      var lista = jogos.filter(gr.f);
      if (!lista.length) return;
      out += '<div class="grupo-status" style="margin-top:44px"><h3>'+L(gr.t)+' <span style="color:var(--accent)">'+lista.length+'</span></h3>' +
        '<div class="projetos">' + lista.map(cardProjeto).join('') + '</div></div>';
    });
    var fl = D.content.fila;
    if (fl && (fl.itens||[]).length) {
      out += '<div class="fila"><h3>'+L(fl.titulo)+' <span>'+fl.itens.length+'</span></h3>' +
        '<p class="intro">'+L(fl.intro)+'</p>' +
        '<p class="intro">'+L(fl.criterio)+'</p>' +
        '<ol>' + fl.itens.map(function(x){
          return '<li><div class="jogo"><b>'+e(x.nome)+'</b>' +
            '<span class="ficha">'+e(x.sistema)+' · '+e(x.ano)+'</span></div>' +
            '<p>'+L(x.porque)+'</p></li>';
        }).join('') + '</ol>' +
        '<p class="aviso">'+L(fl.aviso)+'</p></div>';
    }
    return out + '</section>';
  }

  /* ---------------- PÁGINA DO PROJETO ---------------- */
  function paginaJogo(slug){
    var g = jogo(slug); if(!g) return paginaProjetos();   /* projeto que saiu da lista */
    var out = '<div class="jogo-cab"><div>' +
      '<div class="selos">' +
        (g.primeiro?'<span class="pill gold">'+L({pt:'A primeira tradução do clã',en:'The clan’s first translation',es:'La primera traducción del clan'})+'</span>':'') +
        selo(g) + '<span class="pill">'+L(g.categoria)+'</span></div>' +
      '<p class="jp">'+e(g.jp)+'</p>' +
      '<h1>'+e(g.nome)+'</h1>' +

      '<p style="color:var(--ink-2);max-width:32em">'+L(g.linha)+'</p>' +
      '<p class="ficha">'+e(g.publisher)+(g.dev&&g.dev!==g.publisher?' · '+e(g.dev):'')+' · '+e(g.data)+' · '+e(g.sistema)+'<br>'+e(g.mapper) +

      '<div class="acoes-jogo">' +
        '<a class="bt" href="#/jogo/'+e(g.slug)+'" data-ir="baixar">▶ '+L({pt:'Baixar o patch',en:'Download the patch',es:'Descargar el parche'})+'</a>' +
        linkDoc(g, 'manual', 'bt fora') + linkDoc(g, 'guia', 'bt fora') +
      '</div></div><div>'+'<div class="crt">'+capa(g.capa, txt(g.linha,'en'))+'</div>'+'</div></div>';

    out += '<nav class="abas" aria-label="'+e(g.nome)+'">' +
      '<a class="on" href="#/jogo/'+e(g.slug)+'" data-ir="sobre">'+L({pt:'Visão geral',en:'Overview',es:'Vista general'})+'</a>' +
      (g.nivel === 'release' ? '<a href="#/jogo/'+e(g.slug)+'" data-ir="tudo">'+L({pt:'O que mudou',en:'What changed',es:'Qué cambió'})+'</a>' : '') +
      '<a href="#/jogo/'+e(g.slug)+'" data-ir="telas">'+L({pt:'Telas',en:'Screens',es:'Pantallas'})+'</a>' +
      '<a href="#/jogo/'+e(g.slug)+'" data-ir="baixar">'+L({pt:'Baixar',en:'Download',es:'Descargar'})+'</a>' +
      ['manual','guia'].map(function(t){
        return doc(t, g.slug) ? '<a href="#/'+DOCS[t].rota+'/'+e(g.slug)+'">'+L(DOCS[t].rot)+'</a>' : ''; }).join('') +
      '</nav>';

    out += faixaEtapas(g);

    var completa = g.nivel === 'release';   /* só release documenta o trabalho inteiro */
    if (completa) {
      out += '<div class="numeros">' + (g.numeros||[]).map(function(n){
        return '<div class="num"><b>'+e(n.v)+'</b><span>'+L(n.r)+'</span></div>'; }).join('') + '</div>';
    }

    out += '<section id="sobre"><div class="col">' + (g.resumo ?
      (g.resumo.en||g.resumo.pt||[]).map(function(_,i){
        return '<p>'+L({pt:(g.resumo.pt||[])[i], en:(g.resumo.en||[])[i], es:(g.resumo.es||[])[i]})+'</p>'; }).join('') : '') + '</div></section>';

    if (completa) {
      out += '<section id="tudo"><p class="label">'+L({pt:'O que mudou',en:'What changed',es:'Qué cambió'})+'</p>';
      (g.grupos||[]).forEach(function(gr){
        out += '<div class="grupo"><h3>'+L(gr.titulo)+'</h3>' + (gr.itens||[]).map(function(it){
          return '<div class="feat'+(it.foto?'':' solo')+'"><p>'+L(it.t)+'</p>' +
            (it.foto ? crt(it.foto, '') : '') + '</div>'; }).join('') + '</div>';
      });
      out += '</section>';
    } else {
      out += '<section><div class="em-obra">' +
        '<p>'+L({pt:'Este projeto ainda está em andamento. <b>A lista completa do que entrou é publicada quando ele vira release</b> — até lá, o que está aqui é o jogo, não o relatório do trabalho.',
                 en:'This project is still under way. <b>The full list of what went in is published when it becomes a release</b> — until then, what is here is the game, not the report on the work.',
                 es:'Este proyecto sigue en marcha. <b>La lista completa de lo que entró se publica cuando pasa a release</b> — hasta entonces, lo que hay aquí es el juego, no el informe del trabajo.'})+'</p>' +
        '<p class="onde"><a href="#/traducoes">'+L({pt:'Como as traduções são classificadas →',en:'How the translations are classified →',es:'Cómo se clasifican las traducciones →'})+'</a></p>' +
        '</div></section>';
    }

    out += '<section id="telas"><p class="label">'+L({pt:'As telas',en:'The screens',es:'Las pantallas'})+'</p><div class="galeria">' +
      (g.fotos||[]).map(function(f){
        return '<figure>'+crt(f.f, e(g.nome)+' — '+txt(f.t,'en'))+
          '<figcaption><b>'+L(f.t)+'</b>'+L(f.c)+'</figcaption></figure>'; }).join('') + '</div></section>';

    out += '<section id="baixar"><p class="label">'+L({pt:'Baixar',en:'Download',es:'Descargar'})+'</p>' +
      '<h3 style="margin-bottom:14px">'+L({pt:'O patch',en:'The patch',es:'El parche'})+'</h3>' +
      '<div class="baixar-cab">' +
        L({pt:'<b>Aplique sobre a ROM japonesa original.</b> Nenhuma ROM é distribuída aqui — só a diferença.',
           en:'<b>Apply over the original Japanese ROM.</b> No ROM is distributed here — only the difference.',
           es:'<b>Aplícalo sobre la ROM japonesa original.</b> Aquí no se distribuye ninguna ROM — solo la diferencia.'}) +
        (g.versao ? '<br>'+L({pt:'Versão do patch',en:'Patch version',es:'Versión del parche'})+': <b>'+e(g.versao)+'</b>' : '') +
        '<br>ROM: <b>'+e(g.patch.rom)+'</b><br>MD5: <b>'+e(g.patch.rom_md5)+'</b>' +
        (destinoPatch(g) ? '<br><b>'+L({pt:'Enquanto o projeto não fecha, o patch sai pelo Patreon.',
                                        en:'While the project is open, the patch goes out through Patreon.',
                                        es:'Mientras el proyecto sigue abierto, el parche sale por Patreon.'})+'</b>' : '') +
        '</div>' +
      (secao(g) === 'hacks' ? cartaoHack(g) : gradeIdiomas(g.patch.versoes, pastaPatch(g), 'IPS', destinoPatch(g), (g.patch||{}).nota)) +
      leituras(g);
    out += '</div></section>';
    out += secao(g) === 'hacks'
      ? '<a class="voltar" href="#/hacks">← Hacks/Fixes</a>'
      : '<a class="voltar" href="#/traducoes">'+L({pt:'← Todas as traduções',en:'← All translations',es:'← Todas las traducciones'})+'</a>';
    return out;
  }

  /* ---------------- MANUAL E GUIA ---------------- */
  /* Um renderizador só para os dois: mesma estrutura de dados (titulo, intro, secoes com
     paras/lista/foto), mesma folha de estilo, mesma impressão. O que muda é a coleção de
     onde o documento vem e o rótulo — nunca o desenho. */
  function paginaDoc(slug, tipo){
    var g = jogo(slug); if(!g) return paginaProjetos();
    var cfg = DOCS[tipo], m = doc(tipo, slug);
    if(!m){
      return '<section><p class="label">'+L(cfg.rot)+'</p><div class="col">' +
        '<h2>'+e(g.nome)+'</h2><p>'+L(cfg.espera)+'</p></div>' +
        '<a class="voltar" href="#/jogo/'+e(g.slug)+'">←&nbsp;'+e(g.nome)+'</a></section>';
    }
    var out = '<div id="capa-pdf">' +
      '<p class="marca">Patch Clan</p>' +
      '<p class="kicker">'+L(m.titulo)+'</p>' +
      '<h1>'+e(g.nome)+'</h1>' +
      '<p class="sub" style="font-family:var(--sans);font-weight:600;font-size:15pt;color:var(--accent);margin:2mm 0 6mm">' +
        e(g.subtitulo)+(g.traducao_titulo?' · '+e(g.traducao_titulo):'')+'</p>' +
      '<p class="lede">'+L(m.intro)+'</p>' +
      '<p class="rodape">'+e(g.publisher)+' · '+e(g.data)+' · '+e(g.sistema)+'<br>' +
        L({pt:'Tradução e romhacking: Patch Clan · patchclan.com',en:'Translation and romhacking: Patch Clan · patchclan.com',es:'Traducción y romhacking: Patch Clan · patchclan.com'})+'<br>' +
        L({pt:'Patch de fã, sem fins lucrativos. Não afiliado a nenhuma das empresas originais.',
           en:'A non-profit fan patch. Not affiliated with any of the original companies.',
           es:'Parche de fan, sin ánimo de lucro. No afiliado a ninguna de las empresas originales.'})+'</p>' +
      '</div>' +
      '<section style="border-bottom:0;padding-bottom:22px"><p class="label">'+L(m.titulo)+' · '+e(g.nome)+'</p>' +
      '<div class="col"><h1 style="font-size:clamp(30px,4.4vw,46px);margin-bottom:18px">'+e(g.nome)+'</h1>' +
      '<p class="lede">'+L(m.intro)+'</p></div>' +
      '<nav class="man-idx" aria-label="'+txt(m.titulo,'en')+'">' + m.secoes.map(function(sec,i){
        return '<a href="#/'+cfg.rota+'/'+e(slug)+'" data-ir="sec-'+e(sec.id)+'"><span class="n">'+(i+1)+'</span>'+L(sec.titulo)+'</a>';
      }).join('') + '</nav></section>';
    out += m.secoes.map(function(sec,i){
      var corpo = '<div class="man-txt">' +
        (sec.paras ? (sec.paras.en||sec.paras.pt||[]).map(function(_,k){
          return '<p>'+L({pt:(sec.paras.pt||[])[k], en:(sec.paras.en||[])[k], es:(sec.paras.es||[])[k]})+'</p>'; }).join('') : '') +
        (sec.lista ? '<dl class="man-lista">' + sec.lista.map(function(it){
          var chave = (typeof it.k === 'string') ? '<code>'+e(it.k)+'</code>' : L(it.k);
          return '<div><dt>'+chave+'</dt><dd>'+L(it.v)+'</dd></div>';
        }).join('') + '</dl>' : '') +
        /* html: seção escrita em blocos (tabela, subtítulo, várias figuras) — o manual
           localizado do Rayearth 2. Um bloco por idioma; sem a língua, cai no inglês. */
        (sec.html ? ['en','pt','es'].map(function(l){
          var h = sec.html[l] || sec.html.en || sec.html.pt || sec.html.es;
          return '<div class="'+l+'" lang="'+LANG_ATTR[l]+'">'+h+'</div>';
        }).join('') : '') + '</div>';
      return '<section class="man-sec" id="sec-'+e(sec.id)+'">' +
        '<p class="label"><span style="color:var(--accent)">'+(i+1)+'</span> '+L(sec.titulo)+'</p>' +
        '<div class="man-corpo'+(sec.foto?'':' solo')+'">' + corpo +
        (sec.foto ? '<div>'+crt(sec.foto,'')+'</div>' : '') + '</div></section>';
    }).join('');
    /* O outro documento do mesmo jogo fecha a página: quem terminou o manual encontra o
       guia sem voltar para a ficha. Nada para baixar — o texto é o produto. */
    var outro = (tipo === 'manual') ? 'guia' : 'manual';
    if (doc(outro, slug)) {
      out += '<section class="so-tela"><p class="label">'+L(DOCS[outro].rot)+'</p>' +
        '<div class="leituras">' + cartaoDoc(slug, outro) + '</div></section>';
    }
    return out + '<a class="voltar" href="#/jogo/'+e(g.slug)+'">←&nbsp;'+e(g.nome)+'</a>';
  }

  /* ---------------- PATREON ---------------- */

          '<div class="topo"><h3>'+e(t.nome)+'</h3>' +
          '<div class="preco">'+e(t.preco)+'<small>'+L(t.periodo)+'</small></div></div>' +
          '<p class="nota">'+L(t.nota)+'</p>' +
          '<ul>'+(t.itens||[]).map(function(i){ return '<li>'+L(i)+'</li>'; }).join('')+'</ul></div>';
      }).join('') + '</div>' +
      '<div class="hero-ctas" style="margin-top:34px">' +
        '<a class="bt" href="'+e(p.url)+'" target="_blank" rel="noopener">♥ '+L({pt:'Apoiar no Patreon',en:'Support on Patreon',es:'Apoyar en Patreon'})+'</a>' +
        '<p style="margin:0;font-size:15.5px;color:var(--ink-2);max-width:30em">'+L(p.rodape)+'</p></div></section>';

  /* ---------------- ATUALIZAÇÕES / SOBRE ---------------- */
  function paginaAtualizacoes(){
    return '<section><p class="label">'+L({pt:'Atualizações',en:'Updates',es:'Novedades'})+'</p>' +
      '<div class="col"><h1 style="font-size:clamp(32px,4.6vw,48px)">'+L({pt:'Atualizações',en:'Updates',es:'Novedades'})+'</h1></div>' +
      '<div class="posts" style="margin-top:40px">' + (D.posts||[]).map(function(o){
        var pts=(o.body_pt&&o.body_pt.length?o.body_pt:o.body_en)||[];
        var ens=(o.body_en&&o.body_en.length?o.body_en:o.body_pt)||[];
        var ess=(o.body_es&&o.body_es.length?o.body_es:ens)||[];
        var corpo='';
        for(var i=0;i<Math.max(pts.length,ens.length);i++)
          corpo += '<p>'+L({pt:pts[i]||ens[i],en:ens[i]||pts[i],es:ess[i]||ens[i]})+'</p>';

  function paginaSobre(){
    var c = D.content, w = c.who||{};

      (w.paras||[]).map(function(x){ return '<p>'+L(x)+'</p>'; }).join('') +
      '<p class="sign"><b>Patch Clan</b> · '+L(w.sign)+'</p></div></section>' +
      secaoEquipe() +
      '<section><p class="label">'+L({pt:'Regras da casa',en:'House rules',es:'Reglas de la casa'})+'</p><dl class="rules">' +
      ((c.rules||{}).items||[]).map(function(r){
        return '<div class="rule"><dt>'+L(r.title)+'</dt><dd>'+L(r.text)+'</dd></div>'; }).join('') +
      '</dl></section>' + secaoPromessas();
  }

  /* ---------------- ROTEADOR ---------------- */
  function rota(){
    var h = (location.hash || '#/').replace(/^#/, '');
    var p = h.split('/').filter(Boolean);
    if (p[0] === 'jogo' && p[1]) return { tipo:'jogo', slug:p[1] };
    if (p[0] === 'manual' && p[1]) return { tipo:'manual', slug:p[1] };
    if (p[0] === 'guia' && p[1]) return { tipo:'guia', slug:p[1] };
    if (p[0] === 'traducoes' || p[0] === 'projetos') return { tipo:'projetos' };   /* #/projetos: links antigos */
    if (p[0] === 'hacks') return { tipo:'hacks' };
    if (p[0] === 'atualizacoes') return { tipo:'atualizacoes' };
    if (p[0] === 'sobre') return { tipo:'sobre' };
    if (p[0] === 'apoie') return { tipo:'apoie' };
    return { tipo:'home' };
  }
  var TITULOS = {
    home:'Patch Clan', projetos:'Translations · Patch Clan', hacks:'Hacks/Fixes · Patch Clan', atualizacoes:'Updates · Patch Clan',
    sobre:'About · Patch Clan', apoie:'Support · Patch Clan'
  };
  function desenha(){
    var r = rota(), app = document.getElementById('conteudo');
    if (r.tipo === 'jogo') app.innerHTML = paginaJogo(r.slug);
    else if (r.tipo === 'manual' || r.tipo === 'guia') app.innerHTML = paginaDoc(r.slug, r.tipo);
    else if (r.tipo === 'projetos') app.innerHTML = paginaProjetos();
    else if (r.tipo === 'hacks') app.innerHTML = paginaHacks();
    else if (r.tipo === 'atualizacoes') app.innerHTML = paginaAtualizacoes();
    else if (r.tipo === 'sobre') app.innerHTML = paginaSobre();
    else if (r.tipo === 'apoie') app.innerHTML = paginaApoie();
    else app.innerHTML = home();
    var g = (r.slug && jogo(r.slug));
    document.title = g ? g.nome + ' · Patch Clan' : (TITULOS[r.tipo] || 'Patch Clan');
    document.getElementById('mark').innerHTML = pix(T_MARK);
    document.getElementById('selo-marca').innerHTML = L((D.content.marca||{}).selo);
    document.getElementById('tagline').innerHTML = L((D.content.footer||{}).tagline);
    menu(r);
    document.body.classList.remove('menu-aberto');
    document.getElementById('burger').setAttribute('aria-expanded','false');
    window.scrollTo(0, 0);
  }
  function menu(r){
    /* a ficha, o manual e o guia acendem o menu da seção do jogo */
    var dele = r.slug ? secao(jogo(r.slug)) : '';
    var t = dele === 'hacks' ? [] : ['jogo','manual','guia'], hk = dele === 'hacks' ? ['jogo','manual','guia'] : [];
    var itens = [
      ['#/traducoes', {pt:'Traduções',en:'Translations',es:'Traducciones'}, ['projetos'].concat(t)],
      ['#/hacks', {pt:'Hacks/Fixes',en:'Hacks/Fixes',es:'Hacks/Fixes'}, ['hacks'].concat(hk)],
      ['aplicador/', {pt:'Aplicar patch',en:'Apply a patch',es:'Aplicar parche'}, ['aplicar']],
      ['#/atualizacoes', {pt:'Atualizações',en:'Updates',es:'Novedades'}, ['atualizacoes']],
      ['#/sobre', {pt:'Sobre',en:'About',es:'Sobre'}, ['sobre']]
    ];
    var out = itens.map(function(i){
      var aqui = i[2].indexOf(r.tipo) >= 0;
      return '<a href="'+i[0]+'"'+(aqui?' aria-current="page"':'')+'>'+L(i[1])+'</a>';
    }).join('');
    out += '<a class="apoie" href="#/apoie"'+(r.tipo==='apoie'?' aria-current="page"':'')+'>♥ '+L({pt:'Apoie',en:'Support',es:'Apoya'})+'</a>';
    document.getElementById('nav').innerHTML = out;
  }
  window.addEventListener('hashchange', desenha);

  /* rolagem interna sem trocar de rota */
  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('[data-ir]');
    if(!a) return;
    var alvo = document.getElementById(a.getAttribute('data-ir'));
    if(alvo){
      ev.preventDefault();
      alvo.scrollIntoView({behavior:'smooth', block:'start'});
      if (a.parentNode && a.parentNode.classList.contains('abas')) {
        Array.prototype.forEach.call(a.parentNode.children, function(x){ x.classList.remove('on'); });
        a.classList.add('on');
      }
    }
  });

  /* ---------------- idioma ---------------- */
  var IDIOMAS = [['en','🇺🇸','English'],['pt','🇧🇷','Português'],['es','🇪🇸','Español']];
  var langsw = document.getElementById('langsw');
  function pintaSeletor(l){
    var atual = IDIOMAS.filter(function(x){ return x[0]===l; })[0] || IDIOMAS[0];
    langsw.innerHTML = '<summary aria-label="'+atual[2]+'"><span aria-hidden="true">'+atual[1]+'</span>' +
      atual[0].toUpperCase()+' ▾</summary><ul>' + IDIOMAS.map(function(x){
        return '<li><button type="button" data-lang="'+x[0]+'" lang="'+LANG_ATTR[x[0]]+'" ' +
          'aria-current="'+(x[0]===l)+'"><span aria-hidden="true">'+x[1]+'</span>'+x[2]+'</button></li>';
      }).join('') + '</ul>';
  }
  function idioma(l, salvar){
    if (['en','pt','es'].indexOf(l) < 0) l = 'en';
    LANG_ATUAL = l;
    document.body.setAttribute('data-lang', l);
    repintaFotos();
    document.documentElement.lang = LANG_ATTR[l];
    pintaSeletor(l);
    if (salvar) { try { localStorage.setItem('pc-lang', l); } catch(x){} }
  }
  langsw.addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-lang]');
    if (b) { idioma(b.getAttribute('data-lang'), true); langsw.removeAttribute('open'); }
  });
  document.addEventListener('click', function(ev){
    if (langsw.hasAttribute('open') && !langsw.contains(ev.target)) langsw.removeAttribute('open');
  });
  var salvo = null; try { salvo = localStorage.getItem('pc-lang'); } catch(x){}
  if (!salvo) {
    var nav = (navigator.language || '').toLowerCase();
    salvo = nav.indexOf('pt') === 0 ? 'pt' : nav.indexOf('es') === 0 ? 'es' : 'en';
  }
  idioma(salvo, false);

  desenha();

  /* menu no celular */
  var burger = document.getElementById('burger');
  burger.addEventListener('click', function(){
    var aberto = document.body.classList.toggle('menu-aberto');
    burger.setAttribute('aria-expanded', String(aberto));
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') langsw.removeAttribute('open');
    if (ev.key === 'Escape' && document.body.classList.contains('menu-aberto')) {
      document.body.classList.remove('menu-aberto');
      burger.setAttribute('aria-expanded','false'); burger.focus();
    }
  });


  /* ---------------- conteúdo ao vivo ---------------- */
  if (CFG && CFG.url && CFG.anon) {
    var H = { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon };
    Promise.all([
      fetch(CFG.url+'/rest/v1/content?select=key,value',{headers:H}).then(function(r){return r.json();}),
      fetch(CFG.url+'/rest/v1/posts?select=*&published=is.true&order=date.desc',{headers:H}).then(function(r){return r.json();}),
      fetch(CFG.url+'/rest/v1/games?select=slug,data&order=ord.asc',{headers:H}).then(function(r){return r.json();})
    ]).then(function(res){
      var conteudo=res[0], posts=res[1], games=res[2];
      if(!Array.isArray(conteudo)||!conteudo.length) return;
      var novo={}; conteudo.forEach(function(l){ novo[l.key]=l.value; });
      Object.keys(novo).forEach(function(k){ D.content[k]=novo[k]; });
      if(Array.isArray(posts)) D.posts=posts;
      if(Array.isArray(games) && games.length){
        games.forEach(function(linha){
          var alvo = jogo(linha.slug); if(!alvo || !linha.data) return;
          ['status','linha','resumo','nome','subtitulo','categoria'].forEach(function(k){
            if(linha.data[k] != null) alvo[k] = linha.data[k];
          });
        });
      }
      desenha();
      document.documentElement.setAttribute('data-fonte','supabase');
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
