<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Patch Clan — a one-person rom hacking workshop. English patches for Famicom and Super Famicom games that never left Japan.">
<meta name="color-scheme" content="light dark">
<title>Patch Clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* o plastico do Famicom de 1983: creme, bordo e dourado */
  --ground:#e3dbc8; --ground-2:#eee8d9; --ground-3:#f5f1e6;
  --ink:#191412; --ink-2:#544a3e;          /* escurecido: 7.1:1 sobre o creme */
  --rule:#c5bca5; --rule-soft:#d5ccb8;
  --accent:#96251a;                         /* vermelho Famicom, 6.4:1 sobre o creme */
  --accent-2:#701a12; --gold:#7d5f0d; --chip:#d5cbb4; --flag:#96251a;
  --crt:#0b0b10;
  --sobre-accent:#fff;          /* tinta sobre o vermelho */
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pixel:"Press Start 2P","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
    --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
    --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
  }
}
:root[data-theme="dark"]{
  --ground:#14110e; --ground-2:#1d1915; --ground-3:#25201b;
  --ink:#efe9dc; --ink-2:#a9a08e; --rule:#352e26; --rule-soft:#282219;
  --accent:#f0705c; --accent-2:#d8503c; --gold:#d9b04a; --chip:#2a241d; --flag:#f0705c;
    --sobre-accent:#14110e; --sobre-gold:#14110e;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--sans);letter-spacing:-.025em;text-wrap:balance;margin:0}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
code{font-family:var(--mono);font-size:.88em;background:var(--chip);padding:1px 5px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--sobre-accent);padding:12px 20px;
  font-family:var(--mono);font-size:13px;z-index:99;text-decoration:none}
.skip:focus{left:0}

/* escala tipografica */
h1{font-weight:800;font-size:clamp(34px,4.7vw,54px);line-height:1.04}
h2{font-weight:800;font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 16px}
h3{font-weight:700;font-size:clamp(21px,2.4vw,26px);line-height:1.2;margin:0 0 10px}
h4{font-weight:700;font-size:16px;margin:0 0 10px}
.meta{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}

.faixa{height:7px;background:linear-gradient(90deg,var(--accent-2) 0 62%,var(--gold) 62% 100%)}
.page{max-width:1120px;margin:0 auto;padding:0 28px 96px}
.col{max-width:34em}

/* ---- masthead ---- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.marca-txt{display:flex;flex-direction:column;gap:3px}
.wordmark{font-family:var(--sans);font-weight:800;font-size:21px;letter-spacing:-.035em;
  text-transform:uppercase;line-height:1}
.selo-marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--ink-2);line-height:1}
.mhright{display:flex;align-items:center;gap:26px}
.masthead nav{display:flex;gap:24px;font-family:var(--mono);font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.masthead nav a{color:var(--ink-2);text-decoration:none;padding:4px 0;
  border-bottom:2px solid transparent}
.masthead nav a:hover{color:var(--ink)}
.masthead nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.masthead nav a.apoie{color:var(--sobre-accent);background:var(--accent);border:0;padding:7px 14px;border-radius:3px}
.masthead nav a.apoie:hover{background:var(--accent-2);color:#fff}
.masthead nav a.apoie[aria-current="page"]{background:var(--accent-2);color:#fff}
.langsw{position:relative;font-family:var(--mono);font-size:12px}
.langsw summary{list-style:none;cursor:pointer;color:var(--ink-2);padding:6px 9px;
  border:1px solid var(--rule);border-radius:3px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.langsw summary::-webkit-details-marker{display:none}
.langsw summary:hover{color:var(--ink);border-color:var(--ink-2)}
.langsw ul{position:absolute;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:5px;
  list-style:none;background:var(--ground-2);border:1px solid var(--rule);border-radius:4px;
  min-width:148px;box-shadow:0 10px 26px rgba(25,20,18,.18)}
.langsw li button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;
  color:var(--ink);cursor:pointer;padding:9px 11px;border-radius:2px;font-family:var(--mono);
  font-size:12.5px;text-align:left;letter-spacing:.03em}
.langsw li button:hover{background:var(--chip)}
.langsw li button[aria-current="true"]{color:var(--accent);font-weight:600}
.langsw li button[aria-current="true"]::after{content:"✓";margin-left:auto}
.burger{display:none;border:1px solid var(--rule);background:transparent;color:var(--ink);
  border-radius:3px;padding:8px 11px;font-size:16px;line-height:1;cursor:pointer}

/* ---- tile 8x8 ---- */
.tile{display:grid;grid-template-columns:repeat(8,var(--px));grid-auto-rows:var(--px);flex:none}
.tile i{display:block;background:transparent}
.tile i.on{background:var(--tile-ink,var(--accent))}
.mark-tile{--px:3px}

/* ---- hero ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:68px;
  align-items:center;padding:58px 0 44px}
.hero-txt{max-width:34em}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 22px}
h1 em{font-style:normal;color:var(--accent);display:block}
.lede{font-size:20px;line-height:1.5;margin:24px 0 0;max-width:31em;color:var(--ink)}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:32px}
.cta-apoio{display:flex;flex-direction:column;gap:8px;flex:1 1 260px}
.cta-apoio .bt{align-self:flex-start}
.cta-apoio .nota{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.5;
  letter-spacing:.02em;max-width:34em;white-space:nowrap}
@media (max-width:1080px){.cta-apoio .nota{white-space:normal}}
.hero-regra{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin:18px 0 0;letter-spacing:.03em}
.vitrine{display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--ground-2);border:1px solid var(--ink);border-radius:2px;overflow:hidden;
  box-shadow:5px 5px 0 rgba(25,20,18,.09);transition:transform .16s ease,box-shadow .16s ease}
.vitrine:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(25,20,18,.13)}
.vitrine .tela{background:var(--crt);padding:12px}
.vitrine .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:1px;
  aspect-ratio:256/232;object-fit:contain;background:var(--crt)}
.vitrine .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:7px}
.vitrine .ficha-card{font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);margin:0}
.vitrine .topo{display:flex;gap:8px;flex-wrap:wrap}
.vitrine h2{font-size:clamp(22px,2.4vw,28px);margin:0}
.vitrine .cat{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:0;font-weight:500}
.vitrine .ir{margin:6px 0 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent)}

.placar{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;
  padding:16px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding-bottom:16px;margin-bottom:0}
.placar .nums{display:flex;gap:26px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.placar b{color:var(--ink);font-weight:600}
.placar .vivo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.placar .bolinha{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* ---- botoes ---- */
.bt{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;
  letter-spacing:.08em;text-transform:uppercase;padding:14px 24px;border-radius:3px;
  background:var(--accent);color:var(--sobre-accent);text-decoration:none;border:1px solid var(--accent);
  white-space:nowrap;cursor:pointer}
.bt:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.bt.fora{background:transparent;color:var(--accent)}
.bt.fora:hover{background:var(--accent);color:var(--sobre-accent)}
.bt.pq{padding:10px 17px;font-size:12px}

/* ---- secoes ---- */
section{padding:64px 0;border-bottom:1px solid var(--rule)}
.label{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 30px;display:flex;align-items:center;gap:14px}
.label::after{content:"";height:1px;background:var(--rule);flex:1}

/* ---- projeto em destaque ---- */
.destaque{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:52px;align-items:center}
.destaque .tags{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.destaque h2{margin-bottom:6px}
.destaque .sub{font-family:var(--sans);font-weight:600;font-size:20px;color:var(--accent);margin:0 0 18px}
.destaque ul{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.destaque li{font-family:var(--mono);font-size:14px;color:var(--ink-2);padding-left:22px;position:relative}
.destaque li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:600}
.destaque .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* ---- tela de TV ---- */
.crt{background:var(--crt);padding:11px;border-radius:5px;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 10px 30px rgba(25,20,18,.2)}
.crt img{display:block;width:100%;image-rendering:pixelated;border-radius:2px}

/* ---- cards de projeto ---- */
.projetos{display:grid;gap:24px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.projetos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.projetos{grid-template-columns:minmax(0,1fr)}}
.proj{display:flex;flex-direction:column;background:var(--ground-2);border:1px solid var(--rule);
  border-radius:5px;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
.proj:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,20,18,.15)}
.proj .tela{display:block;background:var(--crt);padding:9px}
.proj .tela img{display:block;width:100%;image-rendering:pixelated;border-radius:2px;
  aspect-ratio:256/240;object-fit:contain;background:var(--crt)}
.proj .corpo{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.proj h3{margin:0;font-size:21px}
.proj h3 a{color:inherit;text-decoration:none}
.proj h3 a:hover{color:var(--accent)}
.proj .ficha{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.03em}
.proj .cat{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:500}
.proj .linha{font-size:15.5px;line-height:1.5;color:var(--ink-2);margin:6px 0 0}
.proj .ir{margin-top:auto;padding-top:16px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase}
.proj .ir a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.proj .ir a:hover{border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:2px;
  background:var(--chip);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);font-weight:500}
.pill.on{background:var(--accent);color:var(--sobre-accent)}
.pill.beta{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
/* as bandeiras dos idiomas em que o patch existe */
.idiomas{display:inline-flex;align-items:center;gap:0;vertical-align:middle}
.idiomas .fl{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1;
  padding:3px 8px 3px 7px;border:1px solid var(--rule);border-right-width:0;background:var(--ground)}
.idiomas .fl:first-child{border-radius:2px 0 0 2px}
.idiomas .fl:last-child{border-right-width:1px;border-radius:0 2px 2px 0}
.idiomas .fl:only-child{border-radius:2px}
.idiomas .cod{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-2);
  font-weight:500;padding-top:1px}
.pill.alfa{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pill.gold{background:var(--gold);color:var(--sobre-gold,#fff)}
.grupo-status{margin-bottom:44px}
.grupo-status:last-child{margin-bottom:0}
.grupo-status > h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 20px;display:flex;align-items:center;gap:14px}
.grupo-status > h3::after{content:"";height:1px;background:var(--rule-soft);flex:1}

.regua{margin:36px 0 8px;padding:26px 28px 22px;border:1px solid var(--rule);border-radius:2px;
  background:var(--ground-2)}
.regua h3{font-size:19px;margin:0 0 8px}
.regua .intro{font-size:16px;color:var(--ink-2);margin:0 0 20px;max-width:44em}
.regua dl{margin:0;display:flex;flex-direction:column;gap:0}
.regua dl > div{display:grid;grid-template-columns:126px minmax(0,1fr);gap:22px;
  padding:14px 0;border-top:1px solid var(--rule-soft)}
.regua dt{margin:0}
.regua dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:52em}
.regua .fecho{margin:22px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.regua dl > div{grid-template-columns:minmax(0,1fr);gap:8px}}

.fila{margin-top:56px;padding-top:32px;border-top:1px solid var(--rule)}
.fila h3{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;margin:0 0 14px}
.fila h3 span{color:var(--accent)}
.fila .intro{font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;max-width:44em}
.fila ol{margin:26px 0 0;padding:0;list-style:none;counter-reset:fila}
.fila li{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;
  padding:16px 0;border-top:1px solid var(--rule-soft);counter-increment:fila}
.fila li .jogo{display:flex;flex-direction:column;gap:5px}
.fila li .jogo b{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.015em;
  color:var(--ink);display:flex;gap:9px}
.fila li .jogo b::before{content:counter(fila,decimal-leading-zero);font-family:var(--mono);
  font-weight:400;font-size:12px;color:var(--accent);flex:none;padding-top:3px}
.fila li .ficha{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-left:26px}
.fila li p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.fila .aviso{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--rule-soft);
  font-size:15.5px;line-height:1.6;color:var(--ink-2);max-width:52em}
@media (max-width:760px){.fila li{grid-template-columns:minmax(0,1fr);gap:8px}
  .fila li .ficha{padding-left:0}}

/* ---- nao e so traducao ---- */
.provas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;
  border-top:1px solid var(--rule)}
.prova{padding:30px 30px 30px 0;border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column}
.prova:last-child{border-right:0}
.prova .et{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px}
.prova .n{font-family:var(--sans);font-weight:800;font-size:clamp(26px,3.4vw,36px);
  letter-spacing:-.035em;line-height:1.06;color:var(--ink);display:block;
  min-height:2.12em;display:flex;align-items:flex-end}
.prova .u{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);display:block;margin:9px 0 16px}
.prova p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.prova .onde{margin-top:auto;padding-top:18px;font-family:var(--mono);font-size:11.5px}
.prova .onde a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.prova .onde a:hover{border-bottom-color:var(--accent)}

/* ---- promessas ---- */
.promessas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
.promessa h4{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px}
.promessa p{font-family:var(--sans);font-weight:700;font-size:19px;color:var(--ink);margin:0;letter-spacing:-.02em}

/* ---- updates ---- */
.updates{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}
.upd{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:2px solid var(--ink)}
.upd .quando{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.upd h3{font-size:20px;margin:0;min-height:2.4em;display:flex;align-items:flex-start}
.upd p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.upd .ler{margin-top:auto;padding-top:12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.upd .ler a{color:var(--accent);text-decoration:none}
.upd .ler a:hover{text-decoration:underline}
.ver-todas{margin-top:34px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ver-todas a{color:var(--accent);text-decoration:none}
.ver-todas a:hover{text-decoration:underline}

/* lista completa de atualizacoes */
.posts{display:flex;flex-direction:column}
.post{display:grid;grid-template-columns:160px minmax(0,1fr);gap:34px;padding:30px 0;
  border-top:1px solid var(--rule-soft)}
.post:first-child{border-top:0;padding-top:0}
.post-meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.05em;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.post-build{display:inline-block;padding:2px 7px;background:var(--chip);color:var(--ink);
  border-radius:2px;font-size:11px;letter-spacing:.08em}
.post-body{max-width:34em}
.post-body p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0 0 12px}

/* ---- pagina do projeto ---- */
.jogo-cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:48px;
  align-items:center;padding:50px 0;border-bottom:1px solid var(--rule)}
.jp{font-family:var(--mono);font-size:15px;color:var(--ink-2);margin:0 0 12px;letter-spacing:.04em}
.jogo-cab .sub{font-family:var(--sans);font-weight:600;font-size:21px;color:var(--accent);margin:0 0 18px}
.ficha{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.8;margin:18px 0 0}
.ficha .versao{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:2px;
  background:var(--chip);font-size:12px;letter-spacing:.05em}
.ficha .versao b{color:var(--ink);font-weight:500}
.selos{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 20px}
.acoes-jogo{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.abas{display:flex;gap:26px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.abas a{color:var(--ink-2);text-decoration:none;padding-bottom:4px;border-bottom:2px solid transparent}
.abas a:hover{color:var(--ink)}
.abas a.on{color:var(--accent);border-bottom-color:var(--accent)}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;
  border-top:1px solid var(--rule)}
.num{padding:24px 24px 24px 0;border-right:1px solid var(--rule-soft)}
.num:last-child{border-right:0}
.num b{display:block;font-family:var(--sans);font-weight:800;font-size:clamp(28px,3.4vw,36px);
  letter-spacing:-.035em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.num span{display:block;margin-top:9px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.grupo{padding:38px 0;border-top:1px solid var(--rule-soft)}
.grupo:first-child{border-top:0;padding-top:0}
.grupo > h3{color:var(--accent);font-family:var(--mono);font-size:13px;letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:20px;font-weight:500}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,310px);gap:36px;
  align-items:start;padding:20px 0;border-top:1px solid var(--rule-soft)}
.feat:first-of-type{border-top:0}
.feat.solo{grid-template-columns:minmax(0,1fr)}
.feat p{font-size:16.5px;line-height:1.6;color:var(--ink-2);margin:0;max-width:34em}
.feat p b{color:var(--ink)}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.galeria figure{margin:0;display:flex;flex-direction:column;gap:11px}
.galeria .crt img{aspect-ratio:256/240;object-fit:contain;background:var(--crt)}
.galeria figcaption{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.galeria figcaption b{display:block;color:var(--ink);font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;font-size:11.5px;margin-bottom:5px}

/* ---- download ---- */
.baixar-cab{font-family:var(--mono);font-size:13px;color:var(--ink-2);line-height:1.85;margin-bottom:24px}
.baixar-cab b{color:var(--ink);font-weight:500}
.patches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pt-item{display:flex;flex-direction:column;gap:11px;padding:20px;border-radius:4px;
  border:1px solid var(--rule);background:var(--ground-2)}
.pt-item .idi{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink)}
.pt-item .idi .fl{font-size:16px}
.pt-item .tam{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pt-item .bt{justify-content:center;padding:11px 16px;font-size:12px}
.pt-item.vazio{opacity:.55;border-style:dashed;background:transparent}
.pt-item.vazio .aviso{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2);
  border:1px dashed var(--rule);border-radius:3px;padding:11px 12px;text-align:center}

/* um patch so para varios idiomas: um cartao, nao tres links iguais */
.patch-uno{border:1px solid var(--accent);border-radius:4px;background:var(--ground-2);overflow:hidden}
.patch-uno .bandas{display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--accent);gap:1px;border-bottom:1px solid var(--accent)}
.patch-uno .banda{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:16px 8px 14px;background:var(--ground-3)}
.patch-uno .banda .fl{font-size:30px;line-height:1}
.patch-uno .banda .cod{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);font-weight:500}
.patch-uno .corpo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;
  align-items:center;padding:24px 26px}
.patch-uno h4{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}
.patch-uno .ficha{font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink-2);margin:0}
.patch-uno .ficha b{color:var(--ink);font-weight:500}
.patch-uno .bt{justify-content:center}
@media (max-width:720px){
  .patch-uno .corpo{grid-template-columns:minmax(0,1fr);gap:18px}
  .patch-uno .bt{width:100%}
}

/* ---- leituras: manual e guia, ao lado do patch. Nao se baixam, entao nao ha grade de
   idioma nem tamanho de arquivo -- o cartao anuncia texto, nao download. ---- */
.leituras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){ .leituras{grid-template-columns:minmax(0,1fr)} }
.leitura{display:flex;flex-direction:column;gap:9px;padding:20px;border-radius:4px;
  border:1px solid var(--rule);background:var(--ground-2);text-decoration:none;color:inherit;
  transition:border-color .16s,background .16s}
.leitura:hover{border-color:var(--accent);background:var(--ground-3)}
.leitura .idi{font-family:var(--mono);font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent)}
.leitura b{font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink)}
.leitura .sub{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.leitura .cta{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px}

/* ---- manual ---- */
.man-idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;
  margin-top:36px;border-top:1px solid var(--rule)}
.man-idx a{display:flex;align-items:baseline;gap:12px;padding:15px 20px 15px 0;
  border-bottom:1px solid var(--rule-soft);text-decoration:none;color:var(--ink);
  font-family:var(--sans);font-weight:600;font-size:16px}
.man-idx a:hover{color:var(--accent)}
.man-idx .n{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none}
.man-sec{padding:48px 0}
.man-corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:44px;align-items:start}
.man-corpo.solo{grid-template-columns:minmax(0,1fr)}
.man-txt{max-width:34em}
.man-txt p{font-size:17px;line-height:1.64}
.man-lista{margin:24px 0 0;display:flex;flex-direction:column;gap:0}
.man-lista > div{display:grid;grid-template-columns:126px minmax(0,1fr);gap:20px;
  padding:13px 0;border-top:1px solid var(--rule-soft)}
.man-lista dt{font-family:var(--sans);font-weight:700;font-size:15px}
.man-lista dt code{background:var(--accent);color:var(--sobre-accent);font-size:12.5px;padding:3px 8px;
  border-radius:2px;font-weight:500;letter-spacing:.04em}
.man-lista dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2)}

/* ---- patreon ---- */
.horas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;
  padding:34px 0 0}
.horas .big{font-family:var(--sans);font-weight:800;font-size:clamp(56px,9vw,104px);
  letter-spacing:-.05em;line-height:.9;color:var(--accent)}
.horas .rot{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink-2);
  margin-top:14px;max-width:20em}
.passos{margin-top:22px;font-family:var(--mono);font-size:13px;line-height:2;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.passos span + span::before{content:"·";color:var(--rule);margin:0 12px;display:inline-block}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;margin-top:44px}
.tier{border:1px solid var(--rule);border-radius:5px;padding:24px;background:var(--ground-2);
  display:flex;flex-direction:column;gap:13px;position:relative}
.tier.destaque{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tier .fita{position:absolute;top:-11px;left:24px;background:var(--accent);color:var(--sobre-accent);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 11px;border-radius:2px;font-weight:500}
.tier .topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tier h3{margin:0;font-size:19px}
.tier .preco{font-family:var(--sans);font-weight:800;font-size:26px;color:var(--accent);
  letter-spacing:-.035em;white-space:nowrap}
.tier .preco small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.tier .nota{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.5;
  padding-bottom:13px;border-bottom:1px solid var(--rule-soft);margin:0}
.tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.tier li{font-size:15px;line-height:1.5;color:var(--ink-2);padding-left:19px;position:relative}
.tier li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;
  background:var(--accent);border-radius:1px}
.tier li b{color:var(--ink)}

/* ---- regras / quem ---- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0}
.rule{padding:24px 28px 26px 0;border-top:1px solid var(--rule-soft)}
.rule dt{font-family:var(--sans);font-weight:700;font-size:17px;margin:0 0 7px}
.rule dd{margin:0;color:var(--ink-2);font-size:16px;line-height:1.55}
.sign{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);margin-top:24px;letter-spacing:.02em}
.sign b{color:var(--ink);font-weight:500}
footer{padding:40px 0 0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:var(--mono);font-size:13px;color:var(--ink-2);letter-spacing:.03em}
.voltar{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;margin:26px 0 0}
.voltar:hover{color:var(--accent)}

.en,.pt,.es{display:inline}
body[data-lang="en"] .pt,body[data-lang="en"] .es{display:none}
body[data-lang="pt"] .en,body[data-lang="pt"] .es{display:none}

  .prova{border-right:0;border-bottom:1px solid var(--rule-soft);padding:24px 0}

 acertei uma.","en":"Three things that never change: <b>no ROMs are distributed</b>, only patches. <b>Every finished patch is free</b> for everyone, patron or not. And <b>no dates are promised</b>, because I have never once been right about one.","es":"Tres cosas que no cambian: <b>no se distribuye ninguna ROM</b>, solo parches. <b>Todo parche terminado es gratis</b> para todo el mundo, mecenas o no. Y <b>no se promete ninguna fecha</b>, porque nunca he acertado una."},"rodape":{"pt":"O patch pronto é sempre gratuito para todo mundo. O que a assinatura antecipa é o build <b>inacabado</b> — o beta com defeitos conhecidos, o alfa com telas ainda meio japonesas — e o relato de como ele está sendo feito. Ninguém paga para poder jogar a versão final.","en":"The finished patch is always free for everyone. What a pledge brings forward is the <b>unfinished</b> build — the beta with its known issues, the alpha with screens still half Japanese — and the account of how it is being made. Nobody pays to play the finished version.","es":"El parche terminado siempre es gratis para todo el mundo. Lo que la suscripción adelanta es la build <b>inacabada</b> — la beta con sus defectos conocidos, la alfa con pantallas aún medio japonesas — y el relato de cómo se está haciendo. Nadie paga por jugar la versión final."},"tiers":[{"nome":"Two Bytes","preco":"$3","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"os dois bytes que consertaram o Famicom Jump II","en":"the two bytes that fixed Famicom Jump II","es":"los dos bytes que arreglaron Famicom Jump II"},"itens":[{"pt":"<b>Só quero ajudar.</b> É exatamente isto: nenhuma contrapartida, nenhuma fila, nada exclusivo.","en":"<b>I just want to help.</b> That is exactly it: no perks, no queue, nothing exclusive.","es":"<b>Solo quiero ayudar.</b> Es exactamente eso: ninguna contrapartida, ninguna fila, nada exclusivo."},{"pt":"Todo patch continua <b>gratuito para todo mundo</b>, apoiador ou não.","en":"Every patch stays <b>free for everyone</b>, patron or not.","es":"Todo parche sigue siendo <b>gratis para todo el mundo</b>, mecenas o no."}]},{"nome":"Bank Switch","preco":"$10","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"recomendado":true,"nota":{"pt":"a troca de banco, que é como um cartucho de 1988 guarda mais do que devia","en":"bank switching, which is how a 1988 cartridge holds more than it should","es":"el cambio de banco, que es cómo un cartucho de 1988 guarda más de lo que debería"},"itens":[{"pt":"<b>Patches beta antes do lançamento público</b>, com a lista de defeitos conhecidos — o build que já se joga inteiro, mas ainda não passou pela última leitura.","en":"<b>Beta patches before public release</b>, with the known-issues list — the build you can already play through, but which has not had its final read-through.","es":"<b>Parches beta antes del lanzamiento público</b>, con la lista de defectos conocidos — la build que ya se juega entera, pero que aún no ha pasado la última lectura."},{"pt":"<b>Participe das pesquisas sobre os próximos jogos.</b> Qual cartucho vale a pena abrir, em que ordem, e o que se procura antes de decidir — a conversa acontece com você dentro.","en":"<b>Take part in the research on the next games.</b> Which cartridge is worth opening, in what order, and what gets measured before deciding — the conversation happens with you in it.","es":"<b>Participa en la investigación sobre los próximos juegos.</b> Qué cartucho vale la pena abrir, en qué orden, y qué se mide antes de decidir — la conversación ocurre contigo dentro."},{"pt":"<b>Seu nome nos agradecimentos do site</b>, enquanto o apoio durar.","en":"<b>Your name in the site’s thanks</b>, for as long as the pledge lasts.","es":"<b>Tu nombre en los agradecimientos del sitio</b>, mientras dure el apoyo."}]},{"nome":"The Seventh Hero","preco":"$25","periodo":{"pt":"/mês","en":"/month","es":"/mes"},"nota":{"pt":"o sétimo escolhido do Famicom Jump II é você","en":"the seventh champion in Famicom Jump II is you","es":"el séptimo elegido de Famicom Jump II eres tú"},"itens":[{"pt":"Tudo do <b>Bank Switch</b>.","en":"Everything in <b>Bank Switch</b>.","es":"Todo lo de <b>Bank Switch</b>."},{"pt":"<b>Acesso a todas as versões alfa das traduções</b> — as builds em montagem, antes mesmo do beta, com o texto ainda mudando e as telas ainda meio japonesas. É ver o trabalho acontecendo, não o resultado dele.","en":"<b>Access to every alpha build of the translations</b> — the builds still being assembled, before the beta, with the text still moving and the screens still half Japanese. It is watching the work happen, not its result.","es":"<b>Acceso a todas las versiones alfa de las traducciones</b> — las builds aún en montaje, antes del beta, con el texto todavía cambiando y las pantallas aún medio japonesas. Es ver el trabajo ocurriendo, no su resultado."}]}],"horas":{"numero":"200+","rotulo":{"pt":"horas antes de uma palavra chegar à tela","en":"hours before one word reaches the screen","es":"horas antes de que una palabra llegue a la pantalla"},"passos":[{"pt":"Desmontar","en":"Disassemble","es":"Desensamblar"},{"pt":"Entender","en":"Understand","es":"Entender"},{"pt":"Programar","en":"Program","es":"Programar"},{"pt":"Testar","en":"Test","es":"Probar"},{"pt":"Reescrever","en":"Rewrite","es":"Reescribir"}]}},"rules":{"items":[{"title":{"pt":"Patches, nunca ROMs","en":"Patches, never ROMs","es":"Parches, nunca ROMs"},"text":{"pt":"Você traz o seu próprio dump. Nada com direito autoral fica hospedado aqui, nunca.","en":"You bring your own dump. Nothing copyrighted is hosted here, ever.","es":"Tú traes tu propio volcado. Aquí no se aloja nada con derechos de autor, nunca."}},{"title":{"pt":"Todo patch pronto é de graça","en":"Every finished patch is free","es":"Todo parche terminado es gratis"},"text":{"pt":"Para todo mundo, apoiador ou não. O que apoiador recebe antes é build inacabado — nunca a versão final.","en":"For everyone, patron or not. What patrons get early is an unfinished build — never the finished version.","es":"Para todo el mundo, mecenas o no. Lo que reciben antes los mecenas es una build inacabada — nunca la versión final."}},{"title":{"pt":"Nenhuma data prometida","en":"No dates promised","es":"Ninguna fecha prometida"},"text":{"pt":"Nem em post, nem em resposta. Sai quando estiver lendo certo.","en":"Not in posts, not in replies. It ships when it reads right.","es":"Ni en publicaciones ni en respuestas. Sale cuando se lee bien."}},{"title":{"pt":"Uma pessoa, devagar de propósito","en":"One person, slow on purpose","es":"Una persona, lenta a propósito"},"text":{"pt":"E cada linha é lida em voz alta antes de sair — no hardware, no tamanho real.","en":"And every line gets read out loud before it ships — on hardware, at size.","es":"Y cada línea se lee en voz alta antes de salir — en hardware, a tamaño real."}}]},"who":{"paras":[{"pt":"O Patch Clan é o <b>Sonix</b> — ex-<b>Central Brasileira de Traduções</b>, a CBT, um dos grupos que construíram a cena de tradução brasileira quando patch andava por post de fórum e todo mundo aprendia hex editing num arquivo de texto que outro alguém escreveu às duas da manhã.","en":"Patch Clan is <b>Sonix</b> — formerly of <b>Central Brasileira de Traduções</b>, the CBT, one of the groups that built the Brazilian translation scene back when a patch travelled by forum post and everyone learned hex editing from a text file somebody else wrote at two in the morning.","es":"Patch Clan es <b>Sonix</b> — ex-<b>Central Brasileira de Traduções</b>, la CBT, uno de los grupos que construyeron la escena de traducción brasileña cuando un parche viajaba por mensaje de foro y todo el mundo aprendía hex editing en un archivo de texto que otro escribió a las dos de la mañana."},{"pt":"Escrevo minhas próprias ferramentas para cada jogo, porque as de uso geral param na parte interessante: um desmontador 6502 com mapa de bancos por mapper, desempacotadores de texto a nível de bit, um montador 6502 em Python, e um emulador sem janela dirigido por Lua que dá boot na ROM e fotografa a tela sem abrir nada.","en":"I write my own tools for every game, because the general-purpose ones stop at the interesting part: a 6502 disassembler with a per-mapper bank map, bit-level text unpackers, a 6502 assembler in Python, and a headless emulator driven by Lua that boots the ROM and screenshots it with no window open.","es":"Escribo mis propias herramientas para cada juego, porque las de uso general se detienen en la parte interesante: un desensamblador 6502 con mapa de bancos por mapper, desempaquetadores de texto a nivel de bit, un ensamblador 6502 en Python, y un emulador sin ventana dirigido por Lua que arranca la ROM y fotografía la pantalla sin abrir nada."},{"pt":"Um clã de um só, o que é piada até você reparar que é também o cronograma, o controle de qualidade e o gerente de lançamento.","en":"A clan of one, which is a joke until you notice it is also the schedule, the QA department and the release manager.","es":"Un clan de uno solo, lo que es un chiste hasta que notas que también es el cronograma, el control de calidad y el responsable de lanzamiento."}],"sign":{"pt":"tradutor, hacker, revisor, clã","en":"translator, hacker, proofreader, clan","es":"traductor, hacker, revisor, clan"},"abertura":{"pt":"O Patch Clan é um grupo de rom hacking de uma pessoa só. A gente traduz jogos que nunca tiveram lançamento em inglês — ponteiros, fonte, quebra de linha e tudo — e não para aí: telas que o original não tinha, bugs de trinta e cinco anos consertados, e o que mais couber num cartucho que sempre teve espaço.","en":"Patch Clan is a one-person rom hacking group. We translate games that never had an English release — pointers, font, line breaks and all — and then keep going: screens the original never had, thirty-five-year-old bugs fixed, and whatever else the cartridge always had room for.","es":"Patch Clan es un grupo de rom hacking de una sola persona. Traducimos juegos que nunca tuvieron lanzamiento en inglés — punteros, fuente, saltos de línea y todo lo demás — y no paramos ahí: pantallas que el original no tenía, errores de treinta y cinco años corregidos, y todo lo que quepa en un cartucho que siempre tuvo sitio."}},"footer":{"tagline":{"pt":"Patches para jogos que nunca falaram inglês","en":"Patches for games that never spoke English","es":"Parches para juegos que nunca hablaron inglés"}},"provas":{"itens":[{"jogo":"famicom-jump-2","etiqueta":{"pt":"Correção de bug","en":"Bug fix","es":"Corrección de bug"},"numero":"35","unidade":{"pt":"anos depois","en":"years later","es":"años después"},"texto":{"pt":"O jogo tinha sete variantes de uma fala e seis nunca apareciam, por causa de um registrador trocado. A correção foram <b>dois bytes</b>.","en":"The game had seven variants of one line and six never appeared, because of a swapped register. The fix was <b>two bytes</b>.","es":"El juego tenía siete variantes de una frase y seis nunca aparecían, por un registro cambiado. La corrección fueron <b>dos bytes</b>."}},{"jogo":"famicom-jump-2","etiqueta":{"pt":"Engenharia","en":"Engineering","es":"Ingeniería"},"numero":"6,25 → 3,90","unidade":{"pt":"bits por caractere","en":"bits per character","es":"bits por carácter"},"texto":{"pt":"O inglês não cabia. Em vez de cortar texto, troquei a compressão por um Huffman de ordem 1 — decodificador de <b>89 bytes</b> de 6502.","en":"English did not fit. Rather than trim text, I replaced the compression with an order-1 Huffman coder — an <b>89-byte</b> 6502 decoder.","es":"El inglés no cabía. En vez de cortar texto, cambié la compresión por un Huffman de orden 1 — decodificador de <b>89 bytes</b> de 6502."}},{"jogo":"captain-tsubasa","etiqueta":{"pt":"Função nova","en":"New feature","es":"Función nueva"},"numero":{"pt":"senha → bateria","en":"password → battery","es":"contraseña → pila"},"unidade":{"pt":"progresso salvo","en":"progress saved","es":"progreso guardado"},"texto":{"pt":"O jogo de 1988 só guardava por senha. Agora grava em bateria — os mesmos 24 bytes que a senha carregava, em <b>97 bytes</b> de código novo.","en":"The 1988 game only kept progress by password. Now it writes to battery — the same 24 bytes the password carried, in <b>97 bytes</b> of new code.","es":"El juego de 1988 solo guardaba por contraseña. Ahora graba con pila — los mismos 24 bytes que llevaba la contraseña, en <b>97 bytes</b> de código nuevo."}}]},"promessas":{"itens":[{"titulo":{"pt":"Só patches","en":"Patches only","es":"Solo parches"},"texto":{"pt":"Nunca ROMs.","en":"Never ROMs.","es":"Nunca ROMs."}},{"titulo":{"pt":"Lançamentos livres","en":"Free releases","es":"Lanzamientos libres"},"texto":{"pt":"Para todo mundo.","en":"For everyone.","es":"Para todo el mundo."}},{"titulo":{"pt":"Nenhum prazo falso","en":"No fake deadlines","es":"Ningún plazo falso"},"texto":{"pt":"Sai quando estiver pronto.","en":"It ships when it is ready.","es":"Sale cuando esté listo."}}]},"marca":{"selo":{"pt":"Um clã de um só","en":"A clan of one","es":"Un clan de uno solo"}},"niveis":{"titulo":{"pt":"Release, beta e alfa","en":"Release, beta and alpha","es":"Release, beta y alfa"},"intro":{"pt":"Três níveis, e só três. O nível não mede <b>quanto trabalho já foi feito</b> — mede <b>o que já foi provado na tela</b>. São coisas diferentes, e confundir as duas é como quase toda tradução amadora se anuncia pronta antes de estar.","en":"Three levels, and only three. The level does not measure <b>how much work is done</b> — it measures <b>what has been proved on screen</b>. They are different things, and confusing them is how almost every amateur translation announces itself finished before it is.","es":"Tres niveles, y solo tres. El nivel no mide <b>cuánto trabajo se ha hecho</b> — mide <b>qué se ha probado en pantalla</b>. Son cosas distintas, y confundirlas es como casi toda traducción amateur se anuncia terminada antes de estarlo."},"itens":[{"chave":"release","marca":"✓","texto":{"pt":"O jogo inteiro em inglês, <b>jogado do começo ao fim</b> e lido linha a linha antes de sair. É o único nível em que o site publica a lista completa do que entrou — porque é o único em que essa lista está fechada. Gratuito para todo mundo, sempre.","en":"The whole game in English, <b>played start to finish</b> and read line by line before shipping. It is the only level where the site publishes the full list of what went in — because it is the only one where that list is closed. Free for everyone, always.","es":"El juego entero en inglés, <b>jugado de principio a fin</b> y leído línea por línea antes de salir. Es el único nivel en el que el sitio publica la lista completa de lo que entró — porque es el único en el que esa lista está cerrada. Gratis para todo el mundo, siempre."}},{"chave":"beta","marca":"●","texto":{"pt":"Alguém já <b>atravessou o jogo inteiro em inglês</b>: ele funciona do início ao fim. O que ainda não aconteceu é a leitura final — aquela em que cada linha é lida procurando o erro que medição nenhuma pega, porque o som está certo e só a grafia está errada. Vai antes para quem apoia no <b>Bank Switch</b>.","en":"Someone has already <b>crossed the whole game in English</b>: it works start to finish. What has not happened is the final read-through — the one where every line is read hunting the error no measurement catches, because the sound is right and only the spelling is wrong. It goes first to <b>Bank Switch</b> patrons.","es":"Alguien ya <b>atravesó el juego entero en inglés</b>: funciona de principio a fin. Lo que aún no ha ocurrido es la lectura final — esa en la que cada línea se lee buscando el error que ninguna medición atrapa, porque el sonido está bien y solo la ortografía está mal. Va antes a quien apoya en <b>Bank Switch</b>."}},{"chave":"alfa","marca":"○","texto":{"pt":"<b>Ainda não se sabe se o jogo atravessa em inglês.</b> Pode ser texto incompleto, telas ainda em japonês, ou uma build montada que ninguém jogou até o fim. <b>Medição não é travessia:</b> provar que os bytes certos estão na ROM é diferente de provar que o jogo se joga — e um projeto pode ter o roteiro inteiro traduzido e continuar aqui. Vai antes para quem apoia no <b>The Seventh Hero</b>.","en":"<b>It is not yet known whether the game can be crossed in English.</b> It may be incomplete text, screens still in Japanese, or an assembled build nobody has played to the end. <b>Measurement is not a crossing:</b> proving the right bytes are in the ROM is not proving the game plays — and a project can have its entire script translated and still sit here. It goes first to <b>The Seventh Hero</b> patrons.","es":"<b>Todavía no se sabe si el juego se atraviesa en inglés.</b> Puede ser texto incompleto, pantallas aún en japonés, o una build montada que nadie ha jugado hasta el final. <b>Medir no es atravesar:</b> probar que los bytes correctos están en la ROM no es probar que el juego se juega — y un proyecto puede tener el guion entero traducido y seguir aquí. Va antes a quien apoya en <b>The Seventh Hero</b>."}}],"fecho":{"pt":"O nível de um projeto sobe quando alguma coisa foi <b>provada</b>, não quando parece estar quase. É por isso que o site não lista o que falta num alfa ou num beta: enquanto o trabalho não fechou, a lista mudaria toda semana e não ajudaria ninguém a decidir se vale baixar.","en":"A project’s level goes up when something has been <b>proved</b>, not when it looks nearly there. That is why the site does not list what is missing from an alpha or a beta: while the work is open, the list would change every week and would help nobody decide whether it is worth downloading.","es":"El nivel de un proyecto sube cuando algo se ha <b>probado</b>, no cuando parece que casi. Por eso el sitio no lista lo que falta en un alfa o un beta: mientras el trabajo esté abierto, la lista cambiaría cada semana y no ayudaría a nadie a decidir si vale la pena descargarlo."}},"fila":{"titulo":{"pt":"Na fila","en":"Next in line","es":"En la cola"},"intro":{"pt":"O que vem depois. Nenhum destes cartuchos foi aberto ainda — quando um deles for, ganha página própria e sai desta lista. Todos passaram pela mesma pergunta, feita <b>antes</b> de qualquer entusiasmo: “este jogo já tem patch em inglês?” — e em todos a resposta foi não.","en":"What comes next. None of these cartridges has been opened yet — the day one is, it gets its own page and leaves this list. All of them went through the same question, asked <b>before</b> any enthusiasm: “does this game already have an English patch?” — and for all of them the answer was no.","es":"Lo que viene después. Ninguno de estos cartuchos se ha abierto todavía — el día que uno se abra, tendrá página propia y saldrá de esta lista. Todos pasaron por la misma pregunta, hecha <b>antes</b> que cualquier entusiasmo: “¿este juego ya tiene parche en inglés?” — y en todos la respuesta fue no."},"criterio":{"pt":"O padrão que organiza a lista é o <b>órfão de série</b>: a comunidade traduz o primeiro jogo e para. Foi o caso do Famicom Jump, e é o caso de quase tudo aqui.","en":"The pattern that organises this list is the <b>orphan sequel</b>: the community translates the first game and stops. That was the case with Famicom Jump, and it is the case with almost everything here.","es":"El patrón que organiza esta lista es el <b>huérfano de serie</b>: la comunidad traduce el primer juego y se detiene. Fue el caso de Famicom Jump, y es el caso de casi todo lo que hay aquí."},"itens":[{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 2","sistema":"Famicom","ano":1991,"porque":{"pt":"O primeiro foi traduzido e a série parou aí. RPG, IP de primeira linha, nenhum projeto público em andamento.","en":"The first was translated and the series stopped there. An RPG, a first-rank IP, and no public project under way.","es":"El primero fue traducido y la serie se detuvo ahí. RPG, IP de primera línea, ningún proyecto público en marcha."}},{"nome":"SD Gundam Gaiden: Knight Gundam Monogatari 3","sistema":"Famicom","ano":1992,"porque":{"pt":"O mesmo caso do 2, e pela mesma razão: as resenhas do primeiro pedem os dois sequels.","en":"The same case as 2, for the same reason: reviews of the first ask for both sequels.","es":"El mismo caso que el 2, por la misma razón: las reseñas del primero piden ambas secuelas."}},{"nome":"Hokuto no Ken 4: Shichisei Haken Den","sistema":"Famicom","ano":1991,"porque":{"pt":"Órfão desde que o terceiro saiu em inglês, em 2024. <b>A conferir antes de começar:</b> há sinal de projeto pessoal ativo no fórum.","en":"Orphaned since the third came out in English in 2024. <b>To check before starting:</b> there is a sign of an active personal project on the forum.","es":"Huérfano desde que el tercero salió en inglés, en 2024. <b>A comprobar antes de empezar:</b> hay señal de un proyecto personal activo en el foro."}},{"nome":"Slam Dunk 2: IH Yuushou e no Michi","sistema":"Super Famicom","ano":1995,"porque":{"pt":"Nenhum dos quatro jogos de Slam Dunk tem patch em inglês. Um projeto de fórum procurou gente em 2017 e morreu ali.","en":"None of the four Slam Dunk games has an English patch. A forum project looked for people in 2017 and died there.","es":"Ninguno de los cuatro juegos de Slam Dunk tiene parche en inglés. Un proyecto de foro buscó gente en 2017 y murió ahí."}},{"nome":"Hokuto no Ken 6 · 7","sistema":"Super Famicom","ano":1992,"porque":{"pt":"O sétimo aparece em listas públicas de “SNES ainda sem tradução”. Nenhum patch encontrado para os dois.","en":"The seventh shows up in public lists of “SNES still untranslated”. No patch found for either.","es":"El séptimo aparece en listas públicas de “SNES aún sin traducir”. Ningún parche encontrado para los dos."}}],"aviso":{"pt":"Estar na fila <b>não é promessa</b>, e a ordem não está decidida. É nessa lista que a conversa acontece com quem apoia no <b>Bank Switch</b>: qual cartucho vale a pena abrir, e em que ordem.","en":"Being in the queue is <b>not a promise</b>, and the order is not decided. This list is where the conversation happens with <b>Bank Switch</b> patrons: which cartridge is worth opening, and in what order.","es":"Estar en la cola <b>no es una promesa</b>, y el orden no está decidido. En esta lista ocurre la conversación con quien apoya en <b>Bank Switch</b>: qué cartucho vale la pena abrir, y en qué orden."}}},"games":[{"slug":"guevara","nome":"Guevara","subtitulo":"","jp":"ゲバラ","traducao_titulo":"Guerrilla War","publisher":"SNK","dev":"SNK","ano":1988,"data":"1988","sistema":"Famicom","mapper":"MMC1 · 128 KB PRG expandido para 256 KB · 128 KB CHR","categoria":{"pt":"Tradução + melhorias","en":"Translation + improvement","es":"Traducción + mejoras"},"nivel":"release","versao":"v2.0 — uma ROM, três idiomas","capa":"guevara/01-titulo.png","linha":{"pt":"Neste run-and-gun de 1988 os dois jogadores chamam-se GUEVARA e CASTRO — e um menu novo escolhe idioma, vidas e dificuldade.","en":"In this 1988 run-and-gun the two players are named GUEVARA and CASTRO — and a new menu sets language, lives and difficulty.","es":"En este run-and-gun de 1988 los dos jugadores se llaman GUEVARA y CASTRO — y un menú nuevo ajusta idioma, vidas y dificultad."},"resumo":{"pt":["SNK, 1988: tiro de cima para baixo, dois jogadores lado a lado, um dedo no gatilho e outro na granada. No Ocidente ele saiu como <i>Guerrilla War</i> — nome que o próprio cartucho japonês já imprime em letra latina no boot, na tela <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code>. Mas a ROM japonesa faz duas coisas antes de a partida começar: logo depois do logo da SNK aparece o <b>retrato do Che</b> com uma dedicatória de duas linhas, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, que aqui se lê <code>A CHE GUEVARA / HERÓI DA REVOLUÇÃO CUBANA</code>; depois vem um prólogo de <b>nove linhas</b> sobre 1956 — o Batista, os impostos, a polícia secreta, o desembarque. E os dois jogadores têm nome: <b>GUEVARA</b> e <b>CASTRO</b>.","Esta ROM ganhou um <b>menu de opções</b>, na terceira entrada do menu inicial, e ele muda o que se faz com o cartucho: escolhe o <b>idioma</b>, as <b>vidas</b>, a <b>dificuldade</b> e traz um <b>sound test</b>. Num run-and-gun de 1988 poder ajustar as vidas é a diferença entre atravessar a ilha e desistir nela — e há o teto <b>infinito</b>, com o decremento desligado, conferido ao longo de <b>13.400 quadros</b>. O número de vidas parou em <b>4</b> por uma razão que só a fotografia contou: o menu deixava escolher até nove, mas retratado com <b>seis</b> o indicador da tela mostrava <b>quatro cruzes</b>, porque a rotina da HUD tem quatro lugares de sprite. Prometer o que a tela não mostra seria mentir, então o teto virou o mesmo <b>4</b> que o jogo dá de fábrica. Duas correções são de conteúdo, não de idioma: o texto original põe <b>Cuba na América do Sul</b>, e aqui ela está na América Central; e o menu que dizia <code>TWO PLAYERS MODE</code> passou a dizer <code>TWO PLAYER MODE</code>.","É <b>uma ROM só, com os três idiomas dentro</b>. Todo o texto localizado vive no banco 5, e trocar de idioma é trocar qual banco é mapeado ali — uma variável em <code>$0400</code> guarda o número. Para isso o cartucho foi <b>expandido de 128 para 256 KB</b>, e aí está a armadilha: no MMC1 o banco fixo é sempre o último, então ele deixa de ser o 7 e passa a ser o 15 — e o 15 tem de ser cópia do 7, aplicada <b>depois</b> de todos os patches, ou o jogo roda código antigo sem dar erro visível. Os blocos mortos do banco fixo entraram em uso, e cada gancho <b>afirma os bytes originais antes de escrever</b>. Nada disso vale sem prova: um teste de canário enche os bytes candidatos de <code>$AA</code> e compara com a ROM original em <b>14 quadros</b> — boot, prólogo, título, demo e jogo —, com <b>0 pixel de diferença</b>. E o prólogo é onde estava o atrito: a fonte japonesa desenha cada caractere num bloco de <b>2×2 tiles</b>, com dois glifos empacotados no mesmo grupo, e a tela tem nove linhas de texto; em letra latina de largura cheia o mesmo prólogo pediria <b>vinte e uma</b>. Com uma fonte latina de meia largura numa caixa de <b>28 colunas</b>, os três idiomas fecham em <b>oito linhas</b>, com o texto inteiro. Um patch, três idiomas, e a versão queimada na tela de créditos."],"en":["SNK, 1988: a top-down shooter, two players side by side, one finger on the trigger and the other on the grenade. In the West it shipped as <i>Guerrilla War</i> — a name the Japanese cartridge itself already prints in Latin letters at boot, on the <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code> screen. But the Japanese ROM does two things before play begins: right after the SNK logo, <b>Che's portrait</b> appears with a two-line dedication, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, which here reads <code>TO CHE GUEVARA / HERO OF THE CUBAN REVOLUTION</code>; then comes a <b>nine-line</b> prologue about 1956 — Batista, the taxes, the secret police, the landing. And the two players have names: <b>GUEVARA</b> and <b>CASTRO</b>.","This ROM gained an <b>options menu</b>, as a third entry on the start menu, and it changes what you can do with the cartridge: it sets the <b>language</b>, the <b>lives</b>, the <b>difficulty</b>, and carries a <b>sound test</b>. In a 1988 run-and-gun, being able to set your lives is the difference between crossing the island and giving up on it — and there is an <b>infinite</b> setting, with the decrement switched off, checked across <b>13,400 frames</b>. The lives count stops at <b>4</b> for a reason only the photograph told: the menu let you pick up to nine, but photographed with <b>six</b>, the on-screen indicator showed <b>four crosses</b>, because the HUD routine has four sprite slots. Promising what the screen does not show would be a lie, so the ceiling became the same <b>4</b> the game gives from the factory. Two corrections are of content rather than language: the original text places <b>Cuba in South America</b>, and here it sits in Central America; and the menu that read <code>TWO PLAYERS MODE</code> now reads <code>TWO PLAYER MODE</code>.","It is <b>a single ROM, with all three languages inside</b>. Every localised string lives in bank 5, and switching language means switching which bank is mapped there — a variable at <code>$0400</code> holds the number. For that the cartridge was <b>expanded from 128 to 256 KB</b>, and there lies the trap: on MMC1 the fixed bank is always the last one, so it stops being 7 and becomes 15 — and 15 has to be a copy of 7, applied <b>after</b> every patch, or the game runs old code with no visible error. The dead blocks of the fixed bank came into use, and each hook <b>asserts the original bytes before writing</b>. None of it counts without proof: a canary test fills the candidate bytes with <code>$AA</code> and compares against the original ROM across <b>14 frames</b> — boot, prologue, title, demo and gameplay — at <b>0 pixels of difference</b>. And the prologue is where the friction was: the Japanese font draws each character in a <b>2×2 tile</b> block, with two glyphs packed into the same group, and the screen holds nine lines of text; in full-width Latin the same prologue would want <b>twenty-one</b>. With a half-width Latin font in a box of <b>28 columns</b>, all three languages close in <b>eight lines</b>, with the whole text. One patch, three languages, and the version burned into the credits screen."],"es":["SNK, 1988: disparos con vista cenital, dos jugadores hombro con hombro, un dedo en el gatillo y otro en la granada. En Occidente salió como <i>Guerrilla War</i> — un nombre que el propio cartucho japonés ya imprime en letra latina al arrancar, en la pantalla <code>SNK WAR GAME PROJECT / GUERRILLA WAR</code>. Pero la ROM japonesa hace dos cosas antes de que empiece la partida: justo después del logo de SNK aparece el <b>retrato del Che</b> con una dedicatoria japonesa de dos líneas, <code>キューバ革命の英雄 / チェ・ゲバラに捧ぐ</code>, que aquí se lee <code>A CHE GUEVARA / HÉROE DE LA REVOLUCIÓN CUBANA</code>; después viene un prólogo de <b>nueve líneas</b> sobre 1956 — Batista, los impuestos, la policía secreta, el desembarco. Y los dos jugadores tienen nombre: <b>GUEVARA</b> y <b>CASTRO</b>.","Esta ROM ganó un <b>menú de opciones</b>, en la tercera entrada del menú inicial, y cambia lo que se puede hacer con el cartucho: elige el <b>idioma</b>, las <b>vidas</b>, la <b>dificultad</b> y trae un <b>sound test</b>. En un run-and-gun de 1988, poder ajustar las vidas es la diferencia entre cruzar la isla y rendirse en ella — y hay un tope <b>infinito</b>, con el decremento apagado, comprobado a lo largo de <b>13.400 fotogramas</b>. El número de vidas se paró en <b>4</b> por una razón que solo contó la fotografía: el menú dejaba elegir hasta nueve, pero retratado con <b>seis</b> el indicador de la pantalla mostraba <b>cuatro cruces</b>, porque la rutina del HUD tiene cuatro sitios de sprite. Prometer lo que la pantalla no enseña sería mentir, así que el tope pasó a ser el mismo <b>4</b> que el juego da de fábrica. Dos correcciones son de contenido, no de idioma: el texto original pone <b>Cuba en América del Sur</b>, y aquí está en América Central; y el menú que decía <code>TWO PLAYERS MODE</code> pasó a decir <code>TWO PLAYER MODE</code>.","Es <b>una sola ROM, con los tres idiomas dentro</b>: el español no es otro archivo, es una opción del menú. Todo el texto localizado vive en el banco 5, y cambiar de idioma es cambiar qué banco se mapea ahí — una variable en <code>$0400</code> guarda el número. Para eso el cartucho se <b>amplió de 128 a 256 KB</b>, y ahí está la trampa: en el MMC1 el banco fijo es siempre el último, así que deja de ser el 7 y pasa a ser el 15 — y el 15 tiene que ser copia del 7, aplicada <b>después</b> de todos los parches, o el juego corre código viejo sin dar error visible. Los bloques muertos del banco fijo entraron en uso, y cada gancho <b>afirma los bytes originales antes de escribir</b>. Nada de eso vale sin prueba: un test de canario llena los bytes candidatos de <code>$AA</code> y compara con la ROM original en <b>14 fotogramas</b> — arranque, prólogo, título, demo y partida —, con <b>0 píxeles de diferencia</b>. Y el prólogo es donde estaba la fricción: la fuente japonesa dibuja cada carácter en un bloque de <b>2×2 tiles</b>, con dos glifos empaquetados en el mismo grupo, y la pantalla tiene nueve líneas de texto; en letra latina de ancho completo el mismo prólogo pediría <b>veintiuna</b>. Con una fuente latina de media anchura en una caja de <b>28 columnas</b>, los tres idiomas cierran en <b>ocho líneas</b>, con el texto entero. Un parche, tres idiomas, y la versión grabada en la pantalla de créditos."]},"numeros":[{"v":"3","r":{"pt":"idiomas dentro da mesma ROM","en":"languages inside the same ROM","es":"idiomas dentro de la misma ROM"}},{"v":"13","r":{"pt":"telas que estavam em japonês","en":"screens that were in Japanese","es":"pantallas que estaban en japonés"}},{"v":"59","r":{"pt":"glifos da fonte latina nova","en":"glyphs in the new Latin font","es":"glifos de la nueva fuente latina"}},{"v":"128→256","r":{"pt":"KB, a ROM expandida","en":"KB, the ROM expanded","es":"KB, la ROM ampliada"}}],"grupos":[{"titulo":{"pt":"As treze telas que estavam em japonês","en":"The thirteen screens that were in Japanese","es":"Las trece pantallas que estaban en japonés"},"itens":[{"t":{"pt":"A <b>dedicatória ao Che</b> e o <b>prólogo de 1956</b> abrem o cartucho antes de qualquer partida, e eram as duas telas que o Ocidente nunca viu: a versão americana, <i>Guerrilla War</i>, tirou o retrato, o prólogo e os nomes dos jogadores. Aqui estão os três, em letra latina.","en":"The <b>dedication to Che</b> and the <b>1956 prologue</b> open the cartridge before any game starts, and they were the two screens the West never saw: the American release, <i>Guerrilla War</i>, took out the portrait, the prologue and the players' names. Here all three are, in Latin script.","es":"La <b>dedicatoria al Che</b> y el <b>prólogo de 1956</b> abren el cartucho antes de cualquier partida, y eran las dos pantallas que Occidente nunca vio: la versión americana, <i>Guerrilla War</i>, quitó el retrato, el prólogo y los nombres de los jugadores. Aquí están los tres, en letra latina."},"foto":"guevara/03-dedicatoria.png"},{"t":{"pt":"<b>As nove aberturas de fase</b> — uma antes de cada área, com o relatório do que acabou de acontecer — estavam em japonês na ROM e continuaram em japonês em tudo o que se publicou até aqui.","en":"<b>The nine stage openings</b> — one before each area, reporting what has just happened — were in Japanese in the ROM and stayed in Japanese in everything published until now.","es":"<b>Las nueve aperturas de fase</b> — una antes de cada área, con el parte de lo que acaba de pasar — estaban en japonés en la ROM y siguieron en japonés en todo lo publicado hasta ahora."},"foto":"guevara/09-abertura-fase.png"},{"t":{"pt":"<b>O final inteiro</b>: a tela de <code>CONGRATULATION</code> e a narração de cinco linhas que conta o que veio depois — o Che feito <b>comandante</b>, a morte na Bolívia, o Castro no poder. É a recompensa de atravessar a ilha, e ninguém que não lesse japonês a tinha lido.","en":"<b>The whole ending</b>: the <code>CONGRATULATION</code> screen and the five-line narration telling what came next — Che made <b>comandante</b>, the death in Bolivia, Castro in power. It is the reward for crossing the island, and nobody who could not read Japanese had ever read it.","es":"<b>El final entero</b>: la pantalla de <code>CONGRATULATION</code> y la narración de cinco líneas que cuenta lo que vino después — el Che hecho <b>comandante</b>, la muerte en Bolivia, Castro en el poder. Es la recompensa de cruzar la isla, y nadie que no leyera japonés la había leído."},"foto":"guevara/10-final.png"},{"t":{"pt":"O japonês não é ASCII: é <b>índice de tile de uma fonte sob medida</b>, com os silabários parciais e só os kanji daquelas telas. Antes de traduzir foi preciso <b>redesenhar cada tela a partir do dado da ROM</b> para poder lê-la — nenhum editor de texto mostra o que ali está escrito.","en":"The Japanese is not ASCII: it is a <b>tile index into a bespoke font</b>, carrying partial syllabaries and only the kanji those screens use. Before translating, each screen had to be <b>redrawn from the ROM data</b> so it could be read at all — no text editor shows what is written there.","es":"El japonés no es ASCII: es <b>índice de tile de una fuente a medida</b>, con los silabarios parciales y solo los kanji de esas pantallas. Antes de traducir hubo que <b>redibujar cada pantalla a partir del dato de la ROM</b> para poder leerla — ningún editor de texto muestra lo que hay escrito ahí."}},{"t":{"pt":"<b>少佐</b> é literalmente <i>major</i>. A patente que o Castro deu ao Che em 1957 foi <b>comandante</b>, que é como o mundo o conhece — e é o que a narração diz.","en":"<b>少佐</b> literally means <i>major</i>. The rank Castro gave Che in 1957 was <b>comandante</b>, which is how the world knows him — and it is what the narration says.","es":"<b>少佐</b> es literalmente <i>mayor</i>. El grado que Castro dio al Che en 1957 fue <b>comandante</b>, que es como el mundo lo conoce — y es lo que dice la narración."}}]},{"titulo":{"pt":"A fonte que fez o texto caber","en":"The font that made the text fit","es":"La fuente que hizo que el texto cupiera"},"itens":[{"t":{"pt":"A fonte japonesa desenha cada caractere num bloco de <b>2×2 tiles</b>, com dois glifos empacotados no mesmo grupo, e a tela do prólogo tem <b>nove linhas</b>. Em letra latina de largura cheia o mesmo prólogo pediria <b>vinte e uma</b> — cortaria três quintos do texto.","en":"The Japanese font draws each character in a <b>2×2 tile</b> block, with two glyphs packed into the same group, and the prologue screen holds <b>nine lines</b>. In full-width Latin the same prologue would want <b>twenty-one</b> — it would cut three fifths of the text.","es":"La fuente japonesa dibuja cada carácter en un bloque de <b>2×2 tiles</b>, con dos glifos empaquetados en el mismo grupo, y la pantalla del prólogo tiene <b>nueve líneas</b>. En letra latina de ancho completo el mismo prólogo pediría <b>veintiuna</b> — cortaría tres quintos del texto."},"foto":"guevara/04-prologo.png"},{"t":{"pt":"A fonte nova é de <b>meia largura, 8×16, 59 glifos</b> desenhados pixel a pixel, e a caixa foi alargada para <b>28 colunas</b>. Assim os três idiomas fecham em <b>oito linhas</b>, com o texto inteiro e <b>com acento</b>.","en":"The new font is <b>half-width, 8×16, 59 glyphs</b> drawn pixel by pixel, and the box was widened to <b>28 columns</b>. All three languages then close in <b>eight lines</b>, with the whole text and <b>with accents</b>.","es":"La fuente nueva es de <b>media anchura, 8×16, 59 glifos</b> dibujados píxel a píxel, y la caja se amplió a <b>28 columnas</b>. Así los tres idiomas cierran en <b>ocho líneas</b>, con el texto entero y <b>con acentos</b>."}},{"t":{"pt":"Duas telas obrigaram o texto a <b>crescer</b>, não a encolher. A do <code>CONGRATULATION</code> são cinco listas de endereço fixo — em quatro linhas a quinta ficaria sem dado — e o bloco da narração tem <b>344 bytes exatos</b>, que só fecham com cinco linhas de 28. O português foi alongado para caber.","en":"Two screens forced the text to <b>grow</b>, not shrink. The <code>CONGRATULATION</code> screen is five lists at fixed addresses — in four lines the fifth would be left without data — and the narration block is <b>exactly 344 bytes</b>, which only add up with five lines of 28. The Portuguese was lengthened to fit.","es":"Dos pantallas obligaron al texto a <b>crecer</b>, no a encoger. La de <code>CONGRATULATION</code> son cinco listas de dirección fija — en cuatro líneas la quinta se quedaría sin dato — y el bloque de la narración tiene <b>344 bytes exactos</b>, que solo cuadran con cinco líneas de 28. El portugués se alargó para caber."}},{"t":{"pt":"A dedicatória em espanhol não cabia em duas linhas: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> tem 29 caracteres e a caixa tinha 28. A largura da caixa passou a ser <b>medida pela linha mais longa</b>, e o espanhol saiu em três linhas de 17.","en":"The Spanish dedication did not fit in two lines: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> is 29 characters and the box was 28. The box width is now <b>measured from the longest line</b>, and the Spanish came out in three lines of 17.","es":"La dedicatoria en español no cabía en dos líneas: <code>HÉROE DE LA REVOLUCIÓN CUBANA</code> tiene 29 caracteres y la caja tenía 28. La anchura de la caja pasó a <b>medirse por la línea más larga</b>, y el español salió en tres líneas de 17."}}]},{"titulo":{"pt":"Uma ROM, três idiomas","en":"One ROM, three languages","es":"Una ROM, tres idiomas"},"itens":[{"t":{"pt":"O espanhol não é outro arquivo: é uma opção do menu. <b>Todo o texto localizado vive no banco 5</b>, e trocar de idioma é trocar qual banco é mapeado ali. Para caberem os três, a ROM foi <b>expandida de 128 para 256 KB</b>.","en":"Spanish is not another file: it is a menu option. <b>Every localised string lives in bank 5</b>, and switching language means switching which bank is mapped there. To hold all three, the ROM was <b>expanded from 128 to 256 KB</b>.","es":"El español no es otro archivo: es una opción del menú. <b>Todo el texto localizado vive en el banco 5</b>, y cambiar de idioma es cambiar qué banco se mapea ahí. Para que quepan los tres, la ROM se <b>amplió de 128 a 256 KB</b>."}},{"t":{"pt":"No MMC1 o banco fixo é sempre o <b>último</b>: dobrar a ROM faz o banco 7 deixar de ser o fixo e o <b>15</b> tomar o lugar. O 15 é cópia do 7, aplicada <b>depois</b> de todos os remendos — na ordem inversa o jogo roda código antigo sem dar erro visível.","en":"On the MMC1 the fixed bank is always the <b>last</b> one: doubling the ROM stops bank 7 from being fixed and puts <b>15</b> in its place. Bank 15 is a copy of 7, applied <b>after</b> every patch — the other way round, the game runs old code with no visible error.","es":"En el MMC1 el banco fijo es siempre el <b>último</b>: doblar la ROM hace que el banco 7 deje de ser el fijo y el <b>15</b> ocupe su lugar. El 15 es copia del 7, aplicada <b>después</b> de todos los parches — al revés, el juego corre código viejo sin dar error visible."}},{"t":{"pt":"<b>O preço de haver uma ROM só:</b> as cinco palavras que o jogo desenha como <i>sprite</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> e a despedida — moram no banco fixo, que é o mesmo para os três idiomas, e ficaram <b>em inglês</b>. Também ficaram como estavam <code>PUSH START</code> e <code>© SNK CORP. 1988</code>, que já vêm em letra latina no cartucho japonês.","en":"<b>The price of a single ROM:</b> the five words the game draws as <i>sprites</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> and the farewell — live in the fixed bank, which is the same for all three languages, and stayed <b>in English</b>. So did <code>PUSH START</code> and <code>© SNK CORP. 1988</code>, which the Japanese cartridge already prints in Latin script.","es":"<b>El precio de que haya una sola ROM:</b> las cinco palabras que el juego dibuja como <i>sprites</i> — <code>BEST</code>, <code>GAME OVER</code>, <code>DEAD</code>, <code>REST</code> y la despedida — viven en el banco fijo, que es el mismo para los tres idiomas, y se quedaron <b>en inglés</b>. También quedaron como estaban <code>PUSH START</code> y <code>© SNK CORP. 1988</code>, que el cartucho japonés ya imprime en letra latina."}}]},{"titulo":{"pt":"O menu de opções, que o jogo não tinha","en":"The options menu the game never had","es":"El menú de opciones que el juego no tenía"},"itens":[{"t":{"pt":"O menu inicial ganhou uma <b>terceira entrada</b>, <code>OPTIONS</code>, ao lado de um e dois jogadores. A porta tem placa: antes as opções abriam por SELECT na tela de título, e quem não soubesse não descobria.","en":"The start menu gained a <b>third entry</b>, <code>OPTIONS</code>, beside one and two players. The door has a sign now: options used to open with SELECT on the title screen, and anyone who did not know never found them.","es":"El menú inicial ganó una <b>tercera entrada</b>, <code>OPTIONS</code>, junto a uno y dos jugadores. La puerta tiene cartel: antes las opciones se abrían con SELECT en la pantalla de título, y quien no lo supiera no las encontraba."},"foto":"guevara/06-menu-modo.png"},{"t":{"pt":"Quatro ajustes: <b>LANGUAGE</b> (inglês, português, espanhol), <b>LIVES</b>, <b>DIFFICULTY</b> e um <b>SOUND TEST</b> que toca a trilha inteira. Num run-and-gun de 1988, poder escolher as vidas é a diferença entre atravessar a ilha e desistir nela.","en":"Four settings: <b>LANGUAGE</b> (English, Portuguese, Spanish), <b>LIVES</b>, <b>DIFFICULTY</b> and a <b>SOUND TEST</b> that plays the whole soundtrack. In a 1988 run-and-gun, being able to set your lives is the difference between crossing the island and giving up on it.","es":"Cuatro ajustes: <b>LANGUAGE</b> (inglés, portugués, español), <b>LIVES</b>, <b>DIFFICULTY</b> y un <b>SOUND TEST</b> que suena la banda sonora entera. En un run-and-gun de 1988, poder elegir las vidas es la diferencia entre cruzar la isla y rendirse en ella."},"foto":"guevara/07-opcoes.png"},{"t":{"pt":"As vidas vão de <b>1 a 4</b>, e há <b>infinito</b> — o decremento fica desligado, conferido ao longo de <b>13.400 quadros</b>. O teto parou em 4, e não em 9, porque a fotografia contou o que a medição não contava: escolhidas seis, a tela mostrava <b>quatro cruzes</b>, que é quanto o indicador tem lugar para desenhar. Prometer o que a tela não mostra seria mentir.","en":"Lives run from <b>1 to 4</b>, and there is <b>infinite</b> — the decrement is switched off, checked across <b>13,400 frames</b>. The ceiling stopped at 4 rather than 9 because the photograph told what measurement did not: set to six, the screen showed <b>four crosses</b>, which is all the indicator has room to draw. Promising what the screen does not show would be a lie.","es":"Las vidas van de <b>1 a 4</b>, y hay <b>infinito</b> — el decremento queda apagado, comprobado a lo largo de <b>13.400 fotogramas</b>. El tope se quedó en 4, y no en 9, porque la fotografía contó lo que la medición no contaba: puestas seis, la pantalla mostraba <b>cuatro cruces</b>, que es lo que el indicador tiene sitio para dibujar. Prometer lo que la pantalla no enseña sería mentir."}},{"t":{"pt":"O <b>sound test</b> não precisou de rotina nova: o jogo já tinha uma que toca por número, e o menu passou a chamá-la. A primeira tentativa chamava a escrita serial do banco de gráficos — não travava, não dava tela preta, <b>só não tocava nota nenhuma</b>, e ainda reprogramava um banco de CHR.","en":"The <b>sound test</b> needed no new routine: the game already had one that plays by number, and the menu now calls it. The first attempt called the serial write of the graphics bank instead — it did not crash, it did not blank the screen, it <b>simply played nothing</b>, and reprogrammed a CHR bank on the way.","es":"El <b>sound test</b> no necesitó rutina nueva: el juego ya tenía una que suena por número, y el menú pasó a llamarla. El primer intento llamaba a la escritura serial del banco de gráficos — no colgaba, no daba pantalla negra, <b>simplemente no sonaba nada</b>, y encima reprogramaba un banco de CHR."}}]},{"titulo":{"pt":"O que passou a aparecer na tela de jogo","en":"What now shows on the game screen","es":"Lo que pasó a verse en la pantalla de juego"},"itens":[{"t":{"pt":"<b>Quatro cruzes no canto</b>, uma por vida. O jogo original não mostrava as vidas em lugar nenhum: só se sabia quantas restavam quando a tela entre mortes dizia.","en":"<b>Four crosses in the corner</b>, one per life. The original game showed the lives nowhere: you only learned how many were left when the screen between deaths told you.","es":"<b>Cuatro cruces en la esquina</b>, una por vida. El juego original no mostraba las vidas en ninguna parte: solo se sabía cuántas quedaban cuando lo decía la pantalla entre muertes."},"foto":"guevara/08-vidas.png"},{"t":{"pt":"Não é <code>VIDAS: 3</code> porque não caberia: na tela de jogo cada letra é um <i>sprite</i>, e o NES só desenha <b>oito por linha de varredura</b>. Medido em 3.031 quadros da ROM original, o próprio jogo já usa cinco ali em cima — <code>VIDAS: 3</code> são oito sozinhos.","en":"It is not <code>LIVES: 3</code> because that would not fit: on the game screen each letter is a <i>sprite</i>, and the NES only draws <b>eight per scanline</b>. Measured across 3,031 frames of the original ROM, the game itself already uses five up there — <code>LIVES: 3</code> is eight on its own.","es":"No es <code>VIDAS: 3</code> porque no cabría: en la pantalla de juego cada letra es un <i>sprite</i>, y la NES solo dibuja <b>ocho por línea de barrido</b>. Medido en 3.031 fotogramas de la ROM original, el propio juego ya usa cinco ahí arriba — <code>VIDAS: 3</code> son ocho él solo."}},{"t":{"pt":"E <b>nenhum gráfico novo foi gravado</b> para isso. O banco de sprites muda a cada fase, são cinco, e a cruz já existia <b>idêntica nos cinco</b> — é o sinal de mais que o jogo usa nos itens. Com as vidas infinitas, o mesmo laço mostra <b>um símbolo só</b>.","en":"And <b>no new graphics were written</b> for it. The sprite bank changes with each stage — there are five — and the cross already existed <b>identically in all five</b>: it is the plus sign the game uses on items. With infinite lives, the same loop shows <b>a single symbol</b>.","es":"Y <b>no se grabó ningún gráfico nuevo</b> para eso. El banco de sprites cambia en cada fase, son cinco, y la cruz ya existía <b>idéntica en los cinco</b> — es el signo de más que el juego usa en los objetos. Con las vidas infinitas, el mismo bucle muestra <b>un solo símbolo</b>."}}]},{"titulo":{"pt":"Correções, e a ROM original intacta","en":"Corrections, and the original ROM untouched","es":"Correcciones, y la ROM original intacta"},"itens":[{"t":{"pt":"<b>Duas corre
