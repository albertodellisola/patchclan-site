avio.png","t":{"pt":"Caixa alta e baixa","en":"Upper and lower case","es":"Mayúsculas y minúsculas"},"c":{"pt":"A fala de quem jurou nunca mais viajar de navio, escrita em caixa de frase: cada minúscula é um glifo que o cartucho não tinha, desenhado por cima do kana.","en":"The line of someone swearing off sea travel, written in sentence case: every lowercase letter is a glyph the cartridge did not have, drawn over the kana.","es":"La frase de quien jura no volver a viajar en barco, escrita en caja alta y baja: cada minúscula es un glifo que el cartucho no tenía, dibujado encima del kana."}},{"f":"sfg/05-creditos.png","t":{"pt":"A abertura do patch","en":"The patch opening","es":"La apertura del parche"},"c":{"pt":"A tela que roda antes do logo da Sega, cinco segundos, e sai com um toque de botão. Ela é escrita com a fonte do próprio cartucho — e só a assinatura <code>SONIX</code> já usa cinco letras que a fonte de fábrica não tinha.","en":"The screen that runs before the Sega logo, five seconds, and exits on a button press. It is written with the cartridge's own font — and the <code>SONIX</code> signature alone uses five letters the factory font did not have.","es":"La pantalla que corre antes del logo de Sega, cinco segundos, y sale con un toque de botón. Está escrita con la fuente del propio cartucho — y solo la firma <code>SONIX</code> ya usa cinco letras que la fuente de fábrica no tenía."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"andamento","testes":"andamento","longplay":"nao"}},{"slug":"phantasy-star-gaiden","nome":"Phantasy Star Gaiden","subtitulo":"ファンタシースター外伝","jp":"ファンタシースター外伝","publisher":"Sega","dev":"Japan System Supply","ano":1992,"data":"1992","sistema":"Game Gear","mapper":"Mapper Sega padrão · 256 KB expandido para 512 KB","categoria":{"pt":"Tradução","en":"Translation","es":"Traducción"},"nivel":"alfa","capa":"psg/01-titulo.png","linha":{"pt":"Minina cresceu sem pais na aldeia de Tedo. Perto do fim se descobre quem era a mãe dela — e o planeta já tem o nome dessa mãe.","en":"Minina grew up with no parents in the village of Tedo. Near the end you learn who her mother was — and the planet already bears that name.","es":"Minina creció sin padres en la aldea de Tedo. Cerca del final se descubre quién era su madre — y el planeta ya lleva el nombre de esa madre."},"resumo":{"pt":["<b>Sega, 1992, Game Gear.</b> Quem espera espadas e dragões pela capa leva um susto na primeira caixa de texto: no planeta Copto, a um ano-luz do <b>sistema Algol</b>, nasce um demônio chamado <b>Cablon</b>, e depois de uma batalha feroz ele é selado num mundo-colônia. Esse mundo é um planeta pequeno que se diz descoberto por <b>Alis</b>, e foi por isso batizado <b>Alisaland</b>. Corre o ano <b>AW813</b>, os feitos de Alis e Odin já viraram lenda, e na aldeia de Tedo vivem dois amigos: Alec, entediado de tomar conta da loja de ferramentas do pai, e <b>Minina</b>, que não tem pais e foi criada pelo ancião. Phantasy Star é ficção científica — planetas, colônias, um sistema estelar com nome próprio —, e a série principal seguiu nos consoles de mesa com nomes que a Sega fixou em inglês: ジルコニアメイル é <code>ZIR.ARMR</code>, ドヒール é <code>CURE</code>, フレエリ é <code>FIRE</code>. É essa nomenclatura, e não a transliteração, que esta tradução segue — o roteiro foi reescrito <b>a partir do japonês</b>, entrada por entrada.","O que aperta neste cartucho é a tela, e é nela que o trabalho aparece. Na de status o jogo empacota os tiles em fila — retrato, nome, e logo em seguida a palavra <code>LEVEL</code> —, então um nome de seis letras era comido pelo rótulo seguinte e saía <code>MiniLEMP</code>; o nome passou a começar num tile fora da fila e recuou uma coluna, e agora sai <b>Minina</b> inteiro, com o <code>MP</code> ao lado. Os dois painéis de escolher personagem cresceram duas colunas — para a <b>esquerda</b>, que é onde havia espaço, porque já encostavam na borda da tela —, o espaçamento entre as entradas subiu de quatro para seis tiles, e o realce do cursor foi junto. O campo de nome de item foi medido com <b>régua na tela</b>, escrevendo o alfabeto dentro dele: cabem <b>11</b> caracteres, com corte limpo no seguinte — e com essa folga <b>nove</b> nomes foram escritos por extenso, cada um conferido contra o katakana, de <code>Short Swd</code> para <code>Short Sword</code>. Nenhuma frase precisou ser amputada para caber, e isso foi medido antes de ser resolvido: as tabelas de ponteiros mais o texto inglês pedem <b>21.536</b> bytes contra os <b>16.384</b> de um banco. A ROM foi de <b>256 KB</b> para <b>512 KB</b> e o texto mudou de banco, o que se provou destruindo o original — com o banco japonês preenchido de <code>0xAA</code> o jogo continua falando, e <b>sete de sete</b> quadros saíram idênticos ao pixel. Voltaram também os <b>créditos originais do jogo</b>: os cargos o cartucho já imprimia em letra latina, e os apelidos com que a equipe assinou estavam em kana — TECO no plano original, Hogeroh nos monstros, Nishiyan e Moriyan nos mapas, Katchan na direção.","O cartucho japonês entrega de graça o que costuma ser metade do trabalho num cartucho de 8 bits: a fonte, de <b>1</b> bit por pixel e <b>8×8</b>, mora no banco 15 com um glifo a cada oito bytes, e isso faz os bytes <code>0x20</code> a <code>0x7E</code> caírem exatamente em cima do <b>ASCII</b> — maiúsculas, minúsculas, dígitos e pontuação, desenhados de fábrica e no lugar certo. Escrever inglês nesta ROM é escrever ASCII puro, e o mérito é do cartucho, não do patch. O resto teve de ser inventado. O roteiro são <b>628</b> entradas, <b>13.907</b> bytes, endereçadas por <b>oito tabelas</b> de ponteiros de <b>16</b> bits, e para caber ganhou um <b>dicionário de 120 tokens</b> em duas faixas, <code>0x80</code>-<code>0xBD</code> e <code>0xC4</code>-<code>0xFD</code> — duas, e não uma, porque os bytes do meio o motor já usa para o dakuten e para destacar nome de item. A rotina que os expande tem <b>69 bytes</b> e se pendura num gancho escolhido por contagem de chamadores: <code>$1DB3</code>, o resolvedor por onde passam <b>11</b>, e não o caminho de <b>4</b> que parecia óbvio e que o diálogo nem usa. Antes de a ROM tocar num emulador, as <b>628</b> entradas foram expandidas em software e comparadas com o esperado: <b>0</b> divergências, e o que chega à tela é byte a byte o texto que foi escrito. A caixa tem <b>3</b> linhas de <b>18</b>, e o renderizador corta no <b>18</b>º caractere sem olhar a palavra — o código diz <b>19</b>, a tela diz 18 —, então a quebra vem escrita no roteiro, e não da sorte. E o inventário do texto não parou nas oito tabelas: há uma <b>nona</b>, noutro banco, com os <b>62</b> nomes de monstro. Um deles, em <code>0x3F449</code>, é ほげろー — o mesmo apelido que os créditos do jogo dão ao design de monstros, com duas falas de batalha próprias, em que ele pede desculpa e foge. O designer se pôs no bestiário. O que vier a seguir neste cartucho fica registrado aqui."],"en":["<b>Sega, 1992, Game Gear.</b> Anyone expecting swords and dragons from the cover gets a jolt at the first text box: on the planet Copto, a full light-year from the <b>Algol system</b>, a demon named <b>Cablon</b> is born, and after a fierce battle he is sealed away on a colony world. That world is a small planet said to have been found by <b>Alis</b>, and it was named <b>Alisaland</b> after her. The year is <b>AW813</b>, the deeds of Alis and Odin have already passed into legend, and in the village of Tedo live two friends: Alec, bored of minding his father's tool shop, and <b>Minina</b>, who has no parents and was raised by the village elder. Phantasy Star is science fiction — planets, colonies, a star system with a name of its own — and the main series carried on across the home consoles with names Sega fixed in English: ジルコニアメイル is <code>ZIR.ARMR</code>, ドヒール is <code>CURE</code>, フレエリ is <code>FIRE</code>. It is that naming, and not transliteration, that this translation follows — the script was rewritten <b>from the Japanese</b>, entry by entry.","What is tight in this cartridge is the screen, and that is where the work shows. On the status screen the game packs its tiles in a row — portrait, name, and immediately after it the word <code>LEVEL</code> — so a six-letter name was eaten by the label that followed and came out <code>MiniLEMP</code>; the name now starts at a tile outside the row and stepped back one column, and <b>Minina</b> appears whole, with <code>MP</code> beside it. The two character-select panels grew two columns wider — to the <b>left</b>, which is where the room was, since they already touched the edge of the screen — the spacing between entries went from four tiles to six, and the cursor highlight went with it. The item name field was measured with a <b>ruler on the screen</b>, by writing the alphabet inside it: <b>11</b> characters fit, with a clean cut at the next one — and with that slack <b>nine</b> names were spelled out in full, each checked against the katakana, from <code>Short Swd</code> to <code>Short Sword</code>. No sentence had to be amputated to fit, and that was measured before it was solved: the pointer tables plus the English text ask for <b>21,536</b> bytes against the <b>16,384</b> of one bank. The ROM went from <b>256 KB</b> to <b>512 KB</b> and the text moved bank, which was proven by destroying the original — with the Japanese bank filled with <code>0xAA</code> the game keeps talking, and <b>seven of seven</b> frames came out pixel-identical. The game's <b>original credits</b> are back too: the job titles the cartridge already printed in Latin letters, and the nicknames the team signed with were in kana — TECO on original plan, Hogeroh on monsters, Nishiyan and Moriyan on maps, Katchan directing.","The Japanese cartridge gives away for free what is usually half the job on an 8-bit cartridge: the font, <b>1</b> bit per pixel and <b>8×8</b>, lives in bank 15 with one glyph every eight bytes, and that drops bytes <code>0x20</code> through <code>0x7E</code> exactly onto <b>ASCII</b> — capitals, lower case, digits and punctuation, drawn at the factory and in the right slot. Writing English into this ROM is writing plain ASCII, and the credit belongs to the cartridge, not to the patch. The rest had to be invented. The script is <b>628</b> entries, <b>13,907</b> bytes, addressed by <b>eight tables</b> of <b>16</b>-bit pointers, and to fit it gained a <b>dictionary of 120 tokens</b> in two ranges, <code>0x80</code>-<code>0xBD</code> and <code>0xC4</code>-<code>0xFD</code> — two, not one, because the bytes in between are already used by the engine for the dakuten and for highlighting an item name. The routine that expands them is <b>69 bytes</b> and hangs off a hook chosen by counting callers: <code>$1DB3</code>, the resolver <b>11</b> of them pass through, rather than the <b>4</b>-caller path that looked obvious and that dialogue does not even use. Before the ROM touched an emulator, all <b>628</b> entries were expanded in software and compared against the expected output: <b>0</b> discrepancies, and what reaches the screen is byte for byte the text that was written. The box is <b>3</b> lines of <b>18</b>, and the renderer cuts at the <b>18</b>th character without looking at the word — the code says <b>19</b>, the screen says 18 — so the line break is written into the script rather than left to luck. And the inventory of the text did not stop at those eight tables: there is a <b>ninth</b>, in another bank, holding the <b>62</b> monster names. One of them, at <code>0x3F449</code>, is ほげろー — the very nickname the game's credits give to monster design, with two battle lines of its own, in which he apologises and runs away. The designer put himself in the bestiary. Whatever comes next for this cartridge gets recorded here."],"es":["<b>Sega, 1992, Game Gear.</b> Quien espera espadas y dragones por la portada se lleva un susto en la primera caja de texto: en el planeta Copto, a un año luz del <b>sistema Algol</b>, nace un demonio llamado <b>Cablon</b>, y tras una batalla feroz queda sellado en un mundo-colonia. Ese mundo es un planeta pequeño del que se dice que lo descubrió <b>Alis</b>, y por eso se llamó <b>Alisaland</b>. Corre el año <b>AW813</b>, las hazañas de Alis y Odin ya son leyenda, y en la aldea de Tedo viven dos amigos: Alec, aburrido de atender la tienda de herramientas de su padre, y <b>Minina</b>, que no tiene padres y a la que ha criado el anciano del pueblo. Phantasy Star es ciencia ficción — planetas, colonias, un sistema estelar con nombre propio — y la serie principal siguió en las consolas de sobremesa con nombres que Sega fijó en inglés: ジルコニアメイル es <code>ZIR.ARMR</code>, ドヒール es <code>CURE</code>, フレエリ es <code>FIRE</code>. Es esa nomenclatura, y no la transliteración, la que sigue esta traducción — el guion se reescribió <b>a partir del japonés</b>, entrada por entrada.","Lo que aprieta en este cartucho es la pantalla, y es ahí donde se ve el trabajo. En la de estado el juego empaqueta los tiles en fila — retrato, nombre, y justo detrás la palabra <code>LEVEL</code> —, así que un nombre de seis letras se lo comía la etiqueta siguiente y salía <code>MiniLEMP</code>; el nombre pasó a empezar en un tile fuera de la fila y retrocedió una columna, y ahora sale <b>Minina</b> entera, con el <code>MP</code> al lado. Los dos paneles de elegir personaje crecieron dos columnas — hacia la <b>izquierda</b>, que es donde había sitio, porque ya tocaban el borde de la pantalla —, el espaciado entre entradas subió de cuatro a seis tiles, y el realce del cursor acompañó el cambio. El campo de nombre de objeto se midió con <b>regla en la pantalla</b>, escribiendo el alfabeto dentro: caben <b>11</b> caracteres, con corte limpio en el siguiente — y con esa holgura se escribieron <b>nueve</b> nombres enteros, cada uno cotejado con el katakana, de <code>Short Swd</code> a <code>Short Sword</code>. No hubo que amputar ninguna frase para que cupiera, y eso se midió antes de resolverlo: las tablas de punteros más el texto inglés piden <b>21.536</b> bytes contra los <b>16.384</b> de un banco. La ROM pasó de <b>256 KB</b> a <b>512 KB</b> y el texto cambió de banco, lo que se probó destruyendo el original — con el banco japonés relleno de <code>0xAA</code> el juego sigue hablando, y <b>siete de siete</b> fotogramas salieron idénticos al píxel. Volvieron también los <b>créditos originales del juego</b>: los cargos ya los imprimía el cartucho en letra latina, y los apodos con los que firmó el equipo estaban en kana — TECO en el plan original, Hogeroh en los monstruos, Nishiyan y Moriyan en los mapas, Katchan en la dirección.","El cartucho japonés regala lo que suele ser la mitad del trabajo en un cartucho de 8 bits: la fuente, de <b>1</b> bit por píxel y <b>8×8</b>, vive en el banco <b>15</b> con un glifo cada ocho bytes, y eso hace que los bytes <code>0x20</code> a <code>0x7E</code> caigan exactamente encima del <b>ASCII</b> — mayúsculas, minúsculas, cifras y puntuación, dibujadas de fábrica y en su sitio. Escribir inglés en esta ROM es escribir ASCII puro, y el mérito es del cartucho, no del parche. Lo demás hubo que inventarlo. El guion son <b>628</b> entradas, <b>13.907</b> bytes, direccionadas por <b>ocho tablas</b> de punteros de <b>16</b> bits, y para que cupiera ganó un <b>diccionario de 120 tokens</b> en dos franjas, <code>0x80</code>-<code>0xBD</code> y <code>0xC4</code>-<code>0xFD</code> — dos, y no una, porque los bytes de en medio ya los usa el motor para el dakuten y para destacar el nombre de un objeto. La rutina que los expande tiene <b>69 bytes</b> y se cuelga de un gancho elegido contando llamadores: <code>$1DB3</code>, el resolvedor por el que pasan <b>11</b>, y no el camino de <b>4</b> que parecía lo obvio y que el diálogo ni siquiera usa. Antes de que la ROM tocara un emulador, las <b>628</b> entradas se expandieron por software y se compararon con lo esperado: <b>0</b> divergencias, y lo que llega a la pantalla es byte a byte el texto que se escribió. La caja tiene <b>3</b> líneas de <b>18</b>, y el renderizador corta en el carácter <b>18</b> sin mirar la palabra — el código dice <b>19</b>, la pantalla dice 18 —, así que el salto de línea viene escrito en el guion, y no lo decide la suerte. Y el inventario del texto no se quedó en las ocho tablas: hay una <b>novena</b>, en otro banco, con los <b>62</b> nombres de monstruo. Uno de ellos, en <code>0x3F449</code>, es ほげろー — el mismo apodo que los créditos del juego le dan al diseño de monstruos, con dos frases de combate propias, en las que pide perdón y huye. El diseñador se metió en el bestiario. Lo que venga después en este cartucho queda anotado aquí."]},"numeros":[],"grupos":[],"patch":{"versoes":{"en":{"arquivo":"phantasy-star-gaiden-en.ips","tamanho":"19 KB"},"pt":null,"es":null},"rom":"Phantasy Star Gaiden (Japan).gg","rom_md5":"54be96ca21885145108f1c02e4d88eba"},"fotos":[{"f":"psg/01-titulo.png","t":{"pt":"Tela de título","en":"Title screen","es":"Pantalla de título"},"c":{"pt":"<code>PHANTASY STAR</code> com o subtítulo <b>外伝</b> desenhado na imagem, o mapa do mundo ocupando o meio da tela e <code>©1992 SEGA</code> embaixo.","en":"<code>PHANTASY STAR</code> with the subtitle <b>外伝</b> drawn into the artwork, the world map filling the middle of the screen and <code>©1992 SEGA</code> below.","es":"<code>PHANTASY STAR</code> con el subtítulo <b>外伝</b> dibujado en la propia ilustración, el mapa del mundo ocupando el centro de la pantalla y <code>©1992 SEGA</code> abajo."}},{"f":"psg/02-prologo.png","t":{"pt":"O prólogo","en":"The prologue","es":"El prólogo"},"c":{"pt":"A narração de abertura, com a arte do título logo acima: <i>and it was given the name Alisaland</i> — o mundo-colônia batizado em homenagem a Alis.","en":"The opening narration, with the title artwork just above it: <i>and it was given the name Alisaland</i> — the colony world named after Alis.","es":"La narración de apertura, con la ilustración del título justo encima: <i>and it was given the name Alisaland</i> — el mundo-colonia bautizado en homenaje a Alis."}},{"f":"psg/03-dialogo.png","t":{"pt":"Minina, na aldeia de Tedo","en":"Minina, in the village of Tedo","es":"Minina, en la aldea de Tedo"},"c":{"pt":"<i>Look what I found</i>, com o retrato dela centrado acima da caixa. O texto sai em ASCII puro, usando as minúsculas que a ROM japonesa já trazia desenhadas.","en":"<i>Look what I found</i>, with her portrait centred above the box. The text comes out as plain ASCII, using the lowercase the Japanese ROM already had drawn.","es":"<i>Look what I found</i>, con su retrato encima de la caja. El texto sale en ASCII puro, con las minúsculas que la ROM japonesa ya traía dibujadas."}},{"f":"psg/04-status.png","t":{"pt":"A ficha do personagem","en":"The character sheet","es":"La ficha del personaje"},"c":{"pt":"<b>Minina</b> aparece inteira, com o <code>MP</code> ao lado em vez de comer o rótulo; o campo do dinheiro diz <code>GOLD</code>, e a última linha traz <code>To next lv. 15EXP</code>, com o espaço no lugar.","en":"<b>Minina</b> appears whole, with <code>MP</code> beside it instead of eating the label; the money field reads <code>GOLD</code>, and the last line shows <code>To next lv. 15EXP</code>, space in place.","es":"<b>Minina</b> aparece entera, con el <code>MP</code> al lado en vez de comerse la etiqueta; el campo del dinero dice <code>GOLD</code>, y la última línea trae <code>To next lv. 15EXP</code>, con el espacio en su sitio."}},{"f":"psg/05-creditos.png","t":{"pt":"A abertura do patch","en":"The patch opening","es":"La apertura del parche"},"c":{"pt":"A tela branca que roda antes do logo da Sega, cinco segundos, e sai com um toque de botão. Ela é escrita com o ASCII que o cartucho japonês já trazia desenhado: nenhum glifo novo foi preciso.","en":"The white screen that runs before the Sega logo, five seconds, and exits on a button press. It is written with the ASCII the Japanese cartridge already had drawn: no new glyph was needed.","es":"La pantalla blanca que corre antes del logo de Sega, cinco segundos, y sale con un toque de botón. Está escrita con el ASCII que el cartucho japonés ya traía dibujado: no se dibujó ni un glifo nuevo."}}],"etapas":{"direcao":"andamento","traducao":"andamento","revisao":"andamento","arte":"andamento","testes":"andamento","longplay":"nao"}}],"posts":[{"date":"2026-09-12","build":"v1.3.6","tag":"Magic Knight Rayearth 2","title_pt":"Rayearth 2 em inglês: minúsculas, o japonês que faltava e a narração apertada","title_en":"Rayearth 2 in English: lowercase, the missing Japanese, and the narration tightened","body_pt":["Um jogador mandou três queixas sobre a versão 1.2 em inglês: o prólogo estava quebrado, as falas de uma linha ora caíam na linha de cima, ora na de baixo, e a fonte era toda em maiúscula. As três eram verdade, e foram consertadas. O prólogo foi reescrito contra o japonês, as falas de uma linha agora caem sempre no mesmo lugar, e o nome que você digita no começo aparece nas falas pela primeira vez (na 1.2 ele não aparecia).","A maiúscula não era escolha: o jogo original não tem letra minúscula nenhuma. Os cerca de 176 códigos da tabela de caracteres já estão ocupados, quase todos por kana. Com o jogo em inglês, porém, a maior parte dos kana não aparece mais em lugar nenhum. <b>Vinte e seis deles viraram a–z</b>, desenhados na mesma grade da fonte de largura variável, com g, j, p, q e y descendo abaixo da linha. Os 2.100 textos passaram para caixa de frase, com maiúscula em nome próprio.","Isso teve um efeito colateral útil. Todo trecho que ainda estava em japonês passou a sair como letra solta, e ficou impossível não ver. Jogando até o final, junto com a versão em espanhol que está em andamento, apareceram os que faltavam: os <b>finais</b> e a mensagem depois dos créditos, <b>70 falas da aventura</b>, o <b>menu de viagem</b>, a <b>tela de batalha</b> e os <b>nomes dos lutadores</b>. Na 1.2 tudo isso já estava em japonês; agora está em inglês.","De quebra, saíram os defeitos que só se viam no fim do jogo. Uma letra solta aparecia no começo de linha nos créditos e numa fala do Clef, os créditos partiam nomes ao meio, e na batalha o número de dano saía separado. O cursor dos menus também não apaga mais o texto das opções.","A <b>1.3.6 conserta a última parte do jogo que ainda escrevia torto: as telas de narração</b> — a abertura sob o céu estrelado, os quatro finais e a mensagem depois dos créditos. Elas têm rotina de desenho própria, separada da caixa de diálogo, e essa rotina dava a cada letra um quadrado igual de 8 pixels. O resultado era um texto esparramado, em que o <code>i</code>, de um pixel de tinta, ocupava o mesmo espaço do <code>d</code>: uma palavra como <i>dying</i> se desmanchava em letras soltas.","Agora essas telas usam a mesma fonte de largura variável do resto do jogo, com cada letra ocupando só a largura dela. O texto ficou mais fácil de ler e passou a caber muito mais: a narração de abertura, que antes precisava de duas telas, <b>cabe em uma só</b>. Nada foi redesenhado — a fonte é a mesma; o que mudou foi quem a escreve na tela. A versão em espanhol, ainda em andamento, já nasce com o mesmo conserto.","O patch se aplica na ROM japonesa original, não em cima de uma versão anterior: <code>Magic Knight Rayearth 2 (Japan).gg</code>, MD5 <code>b19256c6716147a9744f5bd528f14450</code>."],"body_en":["A player sent three complaints about the English version 1.2: the opening prologue was broken, one-line dialogues landed sometimes on the top line and sometimes on the bottom one, and the whole font was uppercase. All three were true, and all three were fixed. The prologue was rewritten against the Japanese, one-line dialogues now always land in the same place, and the name you type at the start shows up in the dialogue for the first time (in 1.2 it never did).","The uppercase was not a choice: the original game has no lowercase letters at all. The roughly 176 codes in its character table are all taken, almost all of them by kana. With the game in English, though, most of the kana never appear anywhere any more. <b>Twenty-six of them became a–z</b>, drawn on the same grid as the variable-width font, with g, j, p, q and y dropping below the line. The 2,100 texts were moved to sentence case, with capitals on proper names.","That had a useful side effect. Any stretch still in Japanese now came out as stray letters, and became impossible to miss. Playing through to the ending, alongside the Spanish version now in progress, turned up the ones left: the <b>endings</b> and the post-credits message, <b>70 adventure lines</b>, the <b>travel menu</b>, the <b>battle screen</b> and the <b>fighters' names</b>. In 1.2 all of that was already in Japanese; now it is in English.","Along the way, the defects you could only see at the end of the game went too. A stray letter appeared at the start of lines in the credits and in one of Clef's lines, the credits split names in half, and in battle the damage number came out broken apart. The menu cursor no longer erases the options' text either.","<b>1.3.6 fixes the last part of the game that still wrote its text on a grid: the narration screens</b> — the opening under the starry sky, the four endings and the message after the credits. They have their own drawing routine, separate from the dialogue box, and that routine gave every letter the same 8-pixel square. The text came out sprawling, with an <code>i</code> one pixel wide taking as much room as a <code>d</code>: a word like <i>dying</i> fell apart into loose letters.","Those screens now use the same variable-width font as the rest of the game, each letter taking only its own width. The text reads better and far more of it fits: the opening narration, which used to need two screens, <b>now fits in one</b>. Nothing was redrawn — the font is the same; what changed is what writes it to the screen. The Spanish version, still in progress, is being built with the same fix.","Apply the patch to the original Japanese ROM, not on top of an earlier version: <code>Magic Knight Rayearth 2 (Japan).gg</code>, MD5 <code>b19256c6716147a9744f5bd528f14450</code>."]}],"manuais":{"famicom-jump-2":{"slug":"famicom-jump-2","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Todo comando citado aqui é a palavra exata que está na tela — não é tradução do manual japonês, é o jogo que você vai jogar.","en":"This manual describes the game <b>as it appears in the English patch</b>. Every command named here is the exact word on screen — this is not a translation of the Japanese manual, it is the game you are going to play.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Todo comando citado aquí es la palabra exacta que está en pantalla — no es una traducción del manual japonés, es el juego que vas a jugar."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"fj2/05-espirito-jump-world.png","paras":{"pt":["O mundo dos mangás da Jump foi invadido. Um espírito chama você e diz que <b>sete campeões</b> foram escolhidos para enfrentar o que vem — e nomeia os seis que faltam encontrar, fechando com “e você também”.","Você começa com um dos sete e sai atrás dos outros. Antes disso, o patch acrescenta um <b>prólogo de cinco páginas</b> que conta o primeiro jogo de 1989 — quem nunca jogou o <i>Eiyuu Retsuden</i> não perde nada da história."],"en":["The world of the Jump manga has been invaded. A spirit calls you and says <b>seven champions</b> have been chosen to face what is coming — then names the six you still have to find, closing with “and you as well.”","You start as one of the seven and go looking for the others. Before that, the patch adds a <b>five-page prologue</b> recapping the 1989 first game — anyone who never played <i>Eiyuu Retsuden</i> misses nothing of the story."],"es":["El mundo de los mangas de la Jump ha sido invadido. Un espíritu te llama y dice que se han elegido <b>siete campeones</b> para enfrentar lo que viene — y nombra a los seis que faltan por encontrar, cerrando con “y tú también”.","Empiezas con uno de los siete y sales a buscar a los demás. Antes de eso, el parche añade un <b>prólogo de cinco páginas</b> que cuenta el primer juego de 1989 — quien nunca jugó <i>Eiyuu Retsuden</i> no se pierde nada."]}},{"id":"heroes","titulo":{"pt":"Os sete heróis","en":"The seven heroes","es":"Los siete héroes"},"paras":{"pt":["Sete séries da Weekly Shōnen Jump dividem o mesmo campo de batalha. <b>Três lutam por vez</b>; do quarto em diante, os que ficam de fora treinam e continuam ganhando experiência."],"en":["Seven Weekly Shōnen Jump series share one battlefield. <b>Three fight at a time</b>; from the fourth onward, whoever sits out trains and keeps earning experience."],"es":["Siete series de la Weekly Shōnen Jump comparten el mismo campo de batalla. <b>Tres luchan a la vez</b>; del cuarto en adelante, los que quedan fuera entrenan y siguen ganando experiencia."]},"lista":[{"k":"Goku","v":{"pt":"Dragon Ball","en":"Dragon Ball"}},{"k":"JoJo","v":{"pt":"JoJo's Bizarre Adventure — Jotaro Kujo","en":"JoJo's Bizarre Adventure — Jotaro Kujo"}},{"k":"Ryotsu","v":{"pt":"KochiKame — o policial","en":"KochiKame — the policeman"}},{"k":"Taruruto","v":{"pt":"Magical Taruruto-kun","en":"Magical Taruruto-kun"}},{"k":"Ta-chan","v":{"pt":"Jungle King Tar-chan","en":"Jungle King Tar-chan"}},{"k":"Momotaro","v":{"pt":"Sakigake!! Otokojuku","en":"Sakigake!! Otokojuku"}},{"k":"Taison","v":{"pt":"Rokudenashi Blues","en":"Rokudenashi Blues"}}]},{"id":"start","titulo":{"pt":"Começar a jogar","en":"Starting the game","es":"Empezar a jugar"},"foto":"fj2/02-creditos.png","paras":{"pt":["A tela de créditos do patch abre antes do título e sai sozinha em cinco segundos — <b>A</b> ou <b>START</b> pula na hora.","No título, <b><code>New Game</code></b> começa do zero e <b><code>Continue</code></b> carrega um dos três diários salvos. Ao começar, o jogo pede <b><code>Begin with</code></b>: é a escolha de qual dos sete heróis você controla primeiro. <b>Essa escolha muda a fala de abertura</b> — e é ela que estava quebrada no cartucho original desde 1991."],"en":["The patch credits screen opens before the title and clears itself in five seconds — <b>A</b> or <b>START</b> skips it immediately.","At the title, <b><code>New Game</code></b> starts fresh and <b><code>Continue</code></b> loads one of three saved diaries. On starting, the game asks <b><code>Begin with</code></b>: this is the choice of which of the seven heroes you control first. <b>That choice changes the opening speech</b> — and it is the thing that was broken in the original cartridge since 1991."],"es":["La pantalla de créditos del parche abre antes del título y se va sola en cinco segundos — <b>A</b> o <b>START</b> la salta al momento.","En el título, <b><code>New Game</code></b> empieza de cero y <b><code>Continue</code></b> carga uno de los tres diarios guardados. Al empezar, el juego pide <b><code>Begin with</code></b>: es la elección de cuál de los siete héroes controlas primero. <b>Esa elección cambia el discurso de apertura</b> — y es lo que estaba roto en el cartucho original desde 1991."]}},{"id":"field","titulo":{"pt":"No mapa","en":"On the map","es":"En el mapa"},"foto":"fj2/03-menu-ingles.png","paras":{"pt":["Você anda com a cruz direcional. Porta, escada e pegar item são <b>automáticos</b> — não existem comandos para isso.","<b>No patch, o botão B é ação coringa:</b> ele fala com quem estiver à frente e, não havendo ninguém, examina o chão sob os seus pés. É a mesma divisão que os dois comandos do menu fazem, num aperto só. Os comandos continuam no menu para quem preferir."],"en":["You walk with the D-pad. Doors, stairs and picking things up are <b>automatic</b> — there are no commands for them.","<b>In this patch, B is a wildcard action button:</b> it talks to whoever is in front of you and, when nobody is, examines the ground under your feet. It is the same split the two menu commands make, in a single press. The menu commands are still there for anyone who prefers them."],"es":["Caminas con la cruceta. Puertas, escaleras y recoger objetos son <b>automáticos</b> — no hay comandos para eso.","<b>En este parche, la B es un botón de acción comodín:</b> habla con quien tengas delante y, si no hay nadie, examina el suelo bajo tus pies. Es la misma división que hacen los dos comandos del menú, en una sola pulsación. Los comandos siguen en el menú para quien los prefiera."]},"lista":[{"k":"Talk","v":{"pt":"Conversa com o personagem à sua frente","en":"Talks to the character in front of you"}},{"k":"Look","v":{"pt":"Examina o lugar onde você está parado","en":"Examines the place you are standing on"}},{"k":"Item","v":{"pt":"Abre a mochila — <code>Use</code>, <code>Give</code>, <code>Drop</code>","en":"Opens the bag — <code>Use</code>, <code>Give</code>, <code>Drop</code>"}},{"k":"Stat","v":{"pt":"Mostra a ficha do herói: corações, atributos e nível","en":"Shows a hero’s card: hearts, stats and level"}},{"k":"Gear","v":{"pt":"Equipamento","en":"Equipment"}},{"k":"Plan","v":{"pt":"Salvar, velocidade de texto, ordem do grupo e diário","en":"Saving, text speed, party order and the diary"}}]},{"id":"battle","titulo":{"pt":"A batalha — o sistema S·A·S","en":"Battle — the S·A·S system","es":"El combate — el sistema S·A·S"},"paras":{"pt":["Não é um RPG de menu. O manual original chama o sistema de <b>S·A·S, Simulation Action System</b>, e ele é tático: a luta acontece <b>em cima do próprio cenário</b>, em tela cheia, sem janela de comando permanente e sem número de vida nenhum na tela.","<b>O turno é por lado:</b> o seu grupo inteiro age, depois os inimigos. Cada herói se move livremente dentro do <b>alcance</b> dele — e alcance é um atributo que <b>sobe de nível</b>, ao lado de ataque e defesa.","<b>Não existe passo de escolher alvo.</b> A mira é a posição: você ataca quem estiver ao alcance de onde você parou. Apertar <b>A</b> sozinho já ataca. O <b>B</b> cicla o balão entre atacar, defender, mover e <b><code>Special</code></b>, e o <b>A</b> confirma."],"en":["This is not a menu RPG. The original manual calls the system <b>S·A·S, Simulation Action System</b>, and it is tactical: the fight happens <b>on the scenery itself</b>, full screen, with no permanent command window and no health number anywhere.","<b>Turns are by side:</b> your whole party acts, then the enemies. Each hero moves freely within their own <b>range</b> — and range is a stat that <b>levels up</b>, alongside attack and defence.","<b>There is no target-selection step.</b> Aim is position: you attack whoever is within reach of where you stopped. Pressing <b>A</b> on its own already attacks. <b>B</b> cycles the balloon between attack, defend, move and <b><code>Special</code></b>, and <b>A</b> confirms."],"es":["No es un RPG de menú. El manual original llama al sistema <b>S·A·S, Simulation Action System</b>, y es táctico: la lucha ocurre <b>sobre el propio escenario</b>, a pantalla completa, sin ventana de comandos permanente y sin ningún número de vida.","<b>El turno es por bando:</b> actúa todo tu grupo, después los enemigos. Cada héroe se mueve libremente dentro de su <b>alcance</b> — y el alcance es un atributo que <b>sube de nivel</b>, junto al ataque y la defensa.","<b>No existe un paso de elegir objetivo.</b> La puntería es la posición: atacas a quien esté al alcance de donde te paraste. Pulsar <b>A</b> a secas ya ataca. La <b>B</b> cicla el globo entre atacar, defender, mover y <b><code>Special</code></b>, y la <b>A</b> confirma."]},"lista":[{"k":{"pt":"Vida","en":"Health"},"v":{"pt":"Contada em <b>corações</b>, não em números. Começa com cinco e sobe de nível.","en":"Counted in <b>hearts</b>, not numbers. You start with five, and they grow with levels."}},{"k":{"pt":"Cor do herói","en":"Hero colour"},"v":{"pt":"A cor <b>é</b> o estado: dois corações restantes fica roxo, um coração fica vermelho, envenenado fica azul.","en":"The colour <b>is</b> the state: two hearts left turns purple, one heart turns red, poisoned turns blue."}},{"k":"Special","v":{"pt":"O golpe especial custa <b>um coração</b> — não existe barra de magia.","en":"The special move costs <b>one heart</b> — there is no magic bar."}},{"k":{"pt":"Fugir","en":"Escaping"},"v":{"pt":"Não há comando: você <b>anda até a borda da tela</b>. Falhar dá <code>Enemy circled you!</code> — o inimigo cortou seu caminho. Alcance de movimento alto ajuda a escapar.","en":"There is no command: you <b>walk to the edge of the screen</b>. Failing gives <code>Enemy circled you!</code> — the enemy cut you off. A high movement range helps you get away."}},{"k":{"pt":"Derrota","en":"Defeat"},"v":{"pt":"Se o grupo inteiro cai, você volta ao Grande Santuário e perde <b>metade do dinheiro</b>. Se um herói sobreviver, todos são curados de graça.","en":"If the whole party falls you return to the Great Shrine and lose <b>half your money</b>. If one hero survives, everyone is healed for free."}}]},{"id":"stronger","titulo":{"pt":"Ficar mais forte","en":"Getting stronger","es":"Hacerse más fuerte"},"foto":"fj2/08-soulring.png","paras":{"pt":["Subir de nível aumenta os corações, o ataque, a defesa e o <b>alcance de movimento</b>. Não há barra de experiência na tela — o jogo avisa quando sobe.","Os heróis que <b>não estão no grupo ativo</b> não ficam parados: eles treinam e ganham experiência sozinhos. Trocar de favorito não custa nada, e é a razão pela qual vale recrutar todo mundo.","Dinheiro se chama <b><code>Zeni</code></b>. Nas lojas você usa <b><code>Buy</code></b> e <b><code>Sell</code></b>, e o jogo pergunta a quantidade em <b><code>Qty</code></b>."],"en":["Levelling raises hearts, attack, defence and <b>movement range</b>. There is no experience bar on screen — the game tells you when you go up.","Heroes <b>outside the active party</b> are not idle: they train and earn experience on their own. Switching favourites costs nothing, which is why recruiting everyone is worth it.","Money is called <b><code>Zeni</code></b>. In shops you use <b><code>Buy</code></b> and <b><code>Sell</code></b>, and the game asks how many in <b><code>Qty</code></b>."],"es":["Subir de nivel aumenta los corazones, el ataque, la defensa y el <b>alcance de movimiento</b>. No hay barra de experiencia en pantalla — el juego avisa cuando subes.","Los héroes <b>fuera del grupo activo</b> no están parados: entrenan y ganan experiencia solos. Cambiar de favorito no cuesta nada, y por eso vale la pena reclutar a todos.","El dinero se llama <b><code>Zeni</code></b>. En las tiendas usas <b><code>Buy</code></b> y <b><code>Sell</code></b>, y el juego pregunta la cantidad en <b><code>Qty</code></b>."]}},{"id":"save","titulo":{"pt":"Salvar, e a velocidade do texto","en":"Saving, and text speed","es":"Guardar, y la velocidad del texto"},"paras":{"pt":["Entre em <b><code>Plan</code></b> e escolha <b><code>Save</code></b>. Você pode salvar <b>em qualquer lugar do mapa</b> — a exceção são dungeons e o interior das cidades. São <b>três diários</b>, e <b><code>Diary</code></b> copia e apaga.","<b><code>Speed</code></b> ajusta a velocidade do texto. <code>Fast</code> e <code>Slow</code> são as pontas de uma escala de <b>oito níveis</b>, não as duas únicas opções — vale mexer nisso antes de encarar o roteiro inteiro.","<b><code>Order</code></b> muda a ordem do grupo, e é assim que você escolhe quais três dos sete entram na próxima luta."],"en":["Go into <b><code>Plan</code></b> and choose <b><code>Save</code></b>. You can save <b>anywhere on the overworld</b> — the exceptions are dungeons and the insides of towns. There are <b>three diaries</b>, and <b><code>Diary</code></b> copies and erases them.","<b><code>Speed</code></b> sets the text speed. <code>Fast</code> and <code>Slow</code> are the ends of an <b>eight-level</b> scale, not the only two options — worth setting before you take on the whole script.","<b><code>Order</code></b> changes the party order, and that is how you pick which three of the seven go into the next fight."],"es":["Entra en <b><code>Plan</code></b> y elige <b><code>Save</code></b>. Puedes guardar <b>en cualquier parte del mapa</b> — las excepciones son mazmorras e interiores de ciudad. Hay <b>tres diarios</b>, y <b><code>Diary</code></b> los copia y los borra.","<b><code>Speed</code></b> ajusta la velocidad del texto. <code>Fast</code> y <code>Slow</code> son los extremos de una escala de <b>ocho niveles</b>, no las dos únicas opciones — conviene ajustarlo antes de enfrentar el guion entero.","<b><code>Order</code></b> cambia el orden del grupo, y así eliges cuáles tres de los siete entran en la próxima pelea."]}},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"fj2/06-lista-sete-campeoes.png","paras":{"pt":["<b>A lista dos sete campeões está certa.</b> No cartucho original o espírito nomeia sempre os mesmos seis heróis, seja qual for o seu. Começar como Taison mandava você procurar o Taison; o Goku nunca era citado. O código correto já estava na ROM e nunca era executado. Aqui ele executa.","<b>Um prólogo de cinco páginas</b> foi acrescentado antes da primeira fala, recapitulando o jogo de 1989.","<b>O botão B virou ação coringa</b> no mapa, como descrito acima. Nada foi tirado: os comandos continuam no menu.","<b>Nada mais foi alterado.</b> Dificuldade, taxa de encontro, tabelas de item, economia e balanceamento são os de 1991. Esta é uma tradução, não um remaster."],"en":["<b>The champion list is correct.</b> In the original cartridge the spirit always names the same six heroes, whichever one is yours. Starting as Taison sent you off to find Taison; Goku was never named at all. The correct code was in the ROM and never ran. Here it runs.","<b>A five-page prologue</b> was added before the first line of dialogue, recapping the 1989 game.","<b>The B button became a wildcard action</b> on the map, as described above. Nothing was removed: the commands are still in the menu.","<b>Nothing else was changed.</b> Difficulty, encounter rate, item tables, economy and balance are the 1991 ones. This is a translation, not a remaster."],"es":["<b>La lista de los siete campeones es correcta.</b> En el cartucho original el espíritu nombra siempre a los mismos seis héroes, sea cual sea el tuyo. Empezar como Taison te mandaba a buscar a Taison; a Goku no lo nombraba nunca. El código correcto estaba en la ROM y no se ejecutaba. Aquí se ejecuta.","<b>Un prólogo de cinco páginas</b> se añadió antes de la primera línea de diálogo, recapitulando el juego de 1989.","<b>El botón B pasó a ser una acción comodín</b> en el mapa, como se describe arriba. No se quitó nada: los comandos siguen en el menú.","<b>Nada más fue alterado.</b> Dificultad, tasa de encuentros, tablas de objetos, economía y balance son los de 1991. Esto es una traducción, no un remaster."]}}]},"dragon-ball-3":{"slug":"dragon-ball-3","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Os símbolos das cartas citados aqui são as abreviações latinas que substituíram os kanji desenhados — é o que você vai ver na tela.","en":"This manual describes the game <b>as it appears in the English patch</b>. The card symbols named here are the Latin abbreviations that replaced the drawn kanji — they are what you will see on screen.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Los símbolos de las cartas citados aquí son las abreviaturas latinas que sustituyeron a los kanji dibujados — es lo que verás en pantalla."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"db3/04-dialogo.png","paras":{"pt":["Goku e Bulma têm apenas a Esfera de Quatro Estrelas e o Radar do Dragão. O jogo segue a saga desde a busca pelas esferas até o Torneio das Artes Marciais e o Rei Demônio Piccolo.","Você avança por um <b>tabuleiro</b>, tira cartas e luta com elas. Não é um RPG de menu: a carta decide quanto você anda, quem ataca primeiro e qual golpe sai."],"en":["Goku and Bulma have only the 4-Star Ball and the Dragon Radar. The game follows the saga from the search for the balls through the Martial Arts Tournament and King Piccolo.","You move across a <b>board</b>, draw cards and fight with them. This is not a menu RPG: the card decides how far you move, who attacks first, and which move comes out."],"es":["Goku y Bulma solo tienen la Bola de Cuatro Estrellas y el Radar del Dragón. El juego sigue la saga desde la búsqueda de las bolas hasta el Torneo de Artes Marciales y el Rey Demonio Piccolo.","Avanzas por un <b>tablero</b>, robas cartas y luchas con ellas. No es un RPG de menú: la carta decide cuánto te mueves, quién ataca primero y qué técnica sale."]}},{"id":"card","titulo":{"pt":"Como ler uma carta","en":"How to read a card","es":"Cómo leer una carta"},"foto":"db3/05-cartas.png","paras":{"pt":["<b>Esta é a peça central do jogo.</b> Fora do modo aventura, tudo é feito com cartas — e cada carta tem <b>três campos</b>, que servem para coisas diferentes."],"en":["<b>This is the heart of the game.</b> Outside adventure mode everything is done with cards — and every card has <b>three fields</b>, each used for something different."],"es":["<b>Esta es la pieza central del juego.</b> Fuera del modo aventura todo se hace con cartas — y cada carta tiene <b>tres campos</b>, cada uno para algo distinto."]},"lista":[{"k":{"pt":"Estrelas (1–7)","en":"Stars (1–7)","es":"Estrellas (1–7)"},"v":{"pt":"No tabuleiro, Goku anda <b>tantas casas quantas forem as estrelas</b>. Na batalha, <b>quem tem o número maior ataca</b>, e esse número também é a força do ataque. <b>Exceção que decide partidas: o 1 do Goku vence o 7 do inimigo.</b>","en":"On the board, Goku moves <b>as many squares as there are stars</b>. In battle, <b>the higher number attacks</b>, and that number is also the attack power. <b>The exception that decides fights: Goku’s 1 beats the enemy’s 7.</b>","es":"En el tablero, Goku avanza <b>tantas casillas como estrellas</b>. En combate, <b>ataca quien tenga el número mayor</b>, y ese número es también la fuerza del ataque. <b>La excepción que decide partidas: el 1 de Goku vence al 7 del enemigo.</b>"}},{"k":{"pt":"Símbolo","en":"Symbol","es":"Símbolo"},"v":{"pt":"Diz <b>qual golpe sai</b> quando você ataca. No original era um kanji desenhado; aqui é uma abreviação latina — a tabela está na próxima seção.","en":"Says <b>which move comes out</b> when you attack. In the original this was a drawn kanji; here it is a Latin abbreviation — the table is in the next section.","es":"Dice <b>qué técnica sale</b> cuando atacas. En el original era un kanji dibujado; aquí es una abreviatura latina — la tabla está en la sección siguiente."}},{"k":{"pt":"Número de defesa","en":"Defence number","es":"Número de defensa"},"v":{"pt":"De 1 a 7, é a <b>força de quem defende</b>. No original vinha em algarismo kanji (一 a 七) e é <b>coisa diferente do símbolo</b> — confundir os dois é o erro clássico neste jogo.","en":"From 1 to 7, this is <b>the defending side’s strength</b>. In the original it was written in kanji numerals (一 to 七) and it is <b>a different thing from the symbol</b> — mixing the two up is the classic mistake in this game.","es":"De 1 a 7, es <b>la fuerza de quien defiende</b>. En el original venía en numeral kanji (一 a 七) y es <b>algo distinto del símbolo</b> — confundir ambos es el error clásico de este juego."}}]},{"id":"symbols","titulo":{"pt":"Os dez símbolos","en":"The ten symbols","es":"Los diez símbolos"},"paras":{"pt":["Cada um destes era um <b>kanji desenhado à mão</b> num tile de 16×16. Não são texto e não existe tabela de caracteres para trocá-los: foram <b>redesenhados um a um</b> como abreviações latinas."],"en":["Each of these was a <b>hand-drawn kanji</b> in a 16×16 tile. They are not text and there is no character table to swap them: they were <b>redrawn one by one</b> as Latin abbreviations."],"es":["Cada uno de estos era un <b>kanji dibujado a mano</b> en un tile de 16×16. No son texto y no hay tabla de caracteres para cambiarlos: fueron <b>redibujados uno a uno</b> como abreviaturas latinas."]},"lista":[{"k":"PCH","v":{"pt":"拳 — soco","en":"拳 — punch","es":"拳 — puñetazo"}},{"k":"KCK","v":{"pt":"蹴 — chute","en":"蹴 — kick","es":"蹴 — patada"}},{"k":"CMB","v":{"pt":"連 — combo de socos e chutes","en":"連 — a combo of punches and kicks","es":"連 — combo de puñetazos y patadas"}},{"k":"FIN","v":{"pt":"必 — golpe especial, gasta pontos","en":"必 — special move, spends points","es":"必 — técnica especial, gasta puntos"}},{"k":"WPN","v":{"pt":"武 — arma: o Bastão Mágico","en":"武 — weapon: the Power Pole","es":"武 — arma: el Bastón Sagrado"}},{"k":"BDY","v":{"pt":"体 — investida com o corpo. <b>É ataque</b>, não defesa: foi o manual que corrigiu esta leitura no meio do projeto","en":"体 — a body slam. <b>It is an attack</b>, not a defence: the manual corrected this reading mid-project","es":"体 — embestida con el cuerpo. <b>Es ataque</b>, no defensa: el manual corrigió esta lectura a mitad del proyecto"}},{"k":"RUN","v":{"pt":"逃 — fugir da luta","en":"逃 — escape the fight","es":"逃 — huir del combate"}},{"k":"SPC","v":{"pt":"特 — técnica especial <b>do inimigo</b>","en":"特 — the <b>enemy’s</b> special technique","es":"特 — técnica especial <b>del enemigo</b>"}},{"k":"MAG","v":{"pt":"術 — magia <b>do inimigo</b>","en":"術 — the <b>enemy’s</b> magic","es":"術 — magia <b>del enemigo</b>"}}]},{"id":"hud","titulo":{"pt":"A tela","en":"The screen","es":"La pantalla"},"foto":"db3/07-mapa.png","paras":{"pt":["A barra de baixo mostra tudo o que importa, e não há tela de status separada no meio da luta."],"en":["The bottom bar shows everything that matters, and there is no separate status screen in the middle of a fight."],"es":["La barra inferior muestra todo lo que importa, y no hay pantalla de estado aparte en mitad del combate."]},"lista":[{"k":{"pt":"Vida","en":"Life","es":"Vida"},"v":{"pt":"Atual / máxima. A máxima sobe com o nível; a atual se recupera com comida e itens.","en":"Current / maximum. The maximum grows with level; the current is restored by food and items.","es":"Actual / máxima. La máxima sube con el nivel; la actual se recupera con comida y objetos."}},{"k":{"pt":"Pontos de especial","en":"Special points","es":"Puntos de especial"},"v":{"pt":"O que os golpes <code>FIN</code> gastam. Recupera com o livro de segredos.","en":"What <code>FIN</code> moves spend. Restored by the book of secrets.","es":"Lo que gastan las técnicas <code>FIN</code>. Se recupera con el libro de secretos."}},{"k":{"pt":"Treino","en":"Training","es":"Entrenamiento"},"v":{"pt":"Pontos ganhos em luta e em treino. Acumular sobe o <b>nível</b>.","en":"Points earned in fights and training. Accumulating them raises your <b>level</b>.","es":"Puntos ganados en combate y entrenamiento. Acumularlos sube el <b>nivel</b>."}},{"k":{"pt":"Nível","en":"Level","es":"Nivel"},"v":{"pt":"Aumenta <b>Speed, Power, Technique e Toughness</b> — e com eles a força do ataque e da defesa.","en":"Raises <b>Speed, Power, Technique and Toughness</b> — and with them attack and defence strength.","es":"Aumenta <b>Speed, Power, Technique y Toughness</b> — y con ellos la fuerza de ataque y defensa."}}]},{"id":"training","titulo":{"pt":"Os três treinos","en":"The three trainings","es":"Los tres entrenamientos"},"paras":{"pt":["Treinar é um jogo de cartas contra um mestre, e <b>cada mestre compara um campo diferente</b> da carta. Saber qual é qual é a diferença entre treinar e perder tempo."],"en":["Training is a card game against a master, and <b>each master compares a different field</b> of the card. Knowing which is which is the difference between training and wasting time."],"es":["Entrenar es un juego de cartas contra un maestro, y <b>cada maestro compara un campo distinto</b> de la carta. Saber cuál es cuál es la diferencia entre entrenar y perder el tiempo."]},"lista":[{"k":"Roshi","v":{"pt":"Compara as <b>estrelas</b>","en":"Compares the <b>stars</b>","es":"Compara las <b>estrellas</b>"}},{"k":"Korin","v":{"pt":"Compara o <b>número de defesa</b>","en":"Compares the <b>defence number</b>","es":"Compara el <b>número de defensa</b>"}},{"k":"Mr.Popo","v":{"pt":"Compara <b>os três campos</b> — estrelas, número de defesa e símbolo. É o treino mais duro e o que mais rende.","en":"Compares <b>all three fields</b> — stars, defence number and symbol. The hardest training, and the one that pays most.","es":"Compara <b>los tres campos</b> — estrellas, número de defensa y símbolo. El entrenamiento más duro y el que más rinde."}}]},{"id":"adventure","titulo":{"pt":"Modo aventura","en":"Adventure mode","es":"Modo aventura"},"foto":"db3/03-menu.png","paras":{"pt":["É o único modo sem cartas. Dentro de vilas e cenários você usa comandos para investigar e conversar. As mensagens cabem em <b>três linhas por vinte e quatro colunas</b> — o jogo não tem código de \"continua na próxima caixa\", e é por isso que a tradução foi comprimida onde precisou."],"en":["This is the only mode without cards. Inside towns and locations you use commands to investigate and talk. Messages fit in <b>three lines by twenty-four columns</b> — the game has no \"continues in the next box\" code, which is why the translation was compressed where it had to be."],"es":["Es el único modo sin cartas. Dentro de pueblos y escenarios usas comandos para investigar y hablar. Los mensajes caben en <b>tres líneas por veinticuatro columnas</b> — el juego no tiene código de \"continúa en la siguiente caja\", y por eso la traducción se comprimió donde hizo falta."]}},{"id":"help","titulo":{"pt":"Cartas de ajuda e itens","en":"Help cards and items","es":"Cartas de ayuda y objetos"},"paras":{"pt":["Além das cartas de ataque existem <b>dezesseis cartas de ajuda</b>, cada uma com um personagem que faz uma coisa: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> e <b>Baba</b>.","Os itens curam, protegem ou transportam — comida, o casco de tartaruga, a roupa pesada de treino, o feijão mágico, a Nuvem Voadora e o livro de segredos que devolve os pontos de especial."],"en":["Besides the attack cards there are <b>sixteen help cards</b>, each a character who does one thing: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> and <b>Baba</b>.","Items heal, protect or carry you — food, the turtle shell, the heavy training gi, the magic bean, the Flying Nimbus, and the book of secrets that gives special points back."],"es":["Además de las cartas de ataque hay <b>dieciséis cartas de ayuda</b>, cada una con un personaje que hace una cosa: <b>Bulma, Korin, Kami, Krillin, Obo, Puar, Gatch, Oolong, Chaozu, Arale, Yajiro, Roshi, Popo, Yamcha, Tien</b> y <b>Baba</b>.","Los objetos curan, protegen o transportan — comida, el caparazón de tortuga, el gi de entrenamiento pesado, la judía mágica, la Nube Voladora y el libro de secretos que devuelve los puntos de especial."]}},{"id":"password","titulo":{"pt":"A senha","en":"The password","es":"La contraseña"},"foto":"db3/06-senha.png","paras":{"pt":["O jogo não tem bateria: o progresso volta por <b>senha</b>, escolhida em <code>CONTINUE</code>. A grade agora é de letras latinas, maiúsculas e minúsculas, sem símbolos que se confundam.","<b>As senhas antigas continuam valendo.</b> Se você tem uma anotada desde 1989, pode digitá-la aqui — a codificação não foi mexida, só o desenho das teclas."],"en":["The game has no battery: progress comes back by <b>password</b>, chosen at <code>CONTINUE</code>. The grid is now Latin letters, upper and lower case, with no symbols that can be confused.","<b>Old passwords still work.</b> If you have one written down since 1989, you can type it in here — the encoding was not touched, only the drawing of the keys."],"es":["El juego no tiene pila: el progreso vuelve por <b>contraseña</b>, elegida en <code>CONTINUE</code>. La rejilla ahora es de letras latinas, mayúsculas y minúsculas, sin símbolos que se confundan.","<b>Las contraseñas antiguas siguen valiendo.</b> Si tienes una anotada desde 1989, puedes escribirla aquí — la codificación no se tocó, solo el dibujo de las teclas."]}},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"db3/01-titulo.png","paras":{"pt":["<b>O título</b> 悟空伝 foi redesenhado como <code>LEGEND OF GOKU</code>, dentro dos mesmos 96×32 pixels de arte.","<b>Os dez símbolos de carta e os seis números de defesa</b> eram desenhos, não texto, e foram redesenhados. É por isso que a \"carta de kanji\" virou <b>symbol card</b> na tradução: depois de trocar o desenho, chamar de kanji seria mentira na tela.","<b>Uma tela de créditos do patch</b> abre antes do título e sai com A ou START.","<b>Cinco mensagens de batalha continuam em japonês de propósito.</b> Elas carregam um número no meio, disfarçado de espaço, e ainda não está medido se o jogo o posiciona por deslocamento fixo. Encurtar o texto em inglês antes de saber disso poria o número no meio de uma palavra — trocaria um defeito legível por um ilegível."],"en":["<b>The title</b> 悟空伝 was redrawn as <code>LEGEND OF GOKU</code>, inside the same 96×32 pixels of artwork.","<b>The ten card symbols and the six defence numbers</b> were drawings, not text, and were redrawn. That is why the \"kanji card\" became a <b>symbol card</b> in the translation: once the drawing changed, calling it kanji would be a lie on screen.","<b>A patch credits screen</b> opens before the title and clears with A or START.","<b>Five battle messages are still in Japanese on purpose.</b> They carry a number in the middle, disguised as a space, and it is not yet measured whether the game places it by fixed offset. Shortening the English before knowing that would put the number in the middle of a word — trading a legible defect for an illegible one."],"es":["<b>El título</b> 悟空伝 fue redibujado como <code>LEGEND OF GOKU</code>, dentro de los mismos 96×32 píxeles de ilustración.","<b>Los diez símbolos de carta y los seis números de defensa</b> eran dibujos, no texto, y fueron redibujados. Por eso la \"carta de kanji\" pasó a ser <b>symbol card</b> en la traducción: una vez cambiado el dibujo, llamarlo kanji sería mentira en pantalla.","<b>Una pantalla de créditos del parche</b> abre antes del título y se salta con A o START.","<b>Cinco mensajes de combate siguen en japonés a propósito.</b> Llevan un número en medio, disfrazado de espacio, y todavía no está medido si el juego lo coloca por desplazamiento fijo. Acortar el inglés sin saberlo pondría el número en mitad de una palabra — cambiaría un defecto legible por uno ilegible."]}}]},"captain-tsubasa":{"slug":"captain-tsubasa","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Este manual descreve o jogo <b>como ele aparece no patch em inglês</b>. Todo comando e todo atributo citado aqui é a palavra exata que está na tela.","en":"This manual describes the game <b>as it appears in the English patch</b>. Every command and every stat named here is the exact word on screen.","es":"Este manual describe el juego <b>tal como aparece en el parche en inglés</b>. Todo comando y todo atributo citado aquí es la palabra exacta que está en pantalla."},"secoes":[{"id":"story","titulo":{"pt":"A história","en":"The story","es":"La historia"},"foto":"ct/01-titulo.png","paras":{"pt":["Você comanda o <b>Nankatsu</b> de Tsubasa Ozora pelo campeonato nacional de escolas, e depois pela seleção japonesa Jr. Youth. Cada adversário é um time real do mangá, com os craques e os golpes deles.","A campanha vai da fase de grupos às oitavas, quartas, semifinal e final — e o técnico avisa antes de cada jogo o que esperar do próximo adversário."],"en":["You manage Tsubasa Ozora’s <b>Nankatsu</b> through the national schools championship, and then the Japanese Jr. Youth side. Every opponent is a real team from the manga, with their aces and their signature moves.","The run goes from the group stage to the last 16, the quarters, the semi-final and the final — and the coach tells you before each match what to expect from the next opponent."],"es":["Diriges al <b>Nankatsu</b> de Tsubasa Ozora por el campeonato nacional escolar, y después a la selección japonesa Jr. Youth. Cada rival es un equipo real del manga, con sus cracks y sus técnicas.","La campaña va de la fase de grupos a octavos, cuartos, semifinal y final — y el entrenador avisa antes de cada partido qué esperar del siguiente rival."]}},{"id":"two","titulo":{"pt":"Dois jogos num só","en":"Two games in one","es":"Dos juegos en uno"},"foto":"ct/02-sala.png","paras":{"pt":["<b>Fora de campo</b> o jogo é uma aventura: você anda por cenários, conversa e procura gente. É assim que Misaki é encontrado em Paris, com os comandos <code>Move</code>, <code>Ask</code>, <code>Look</code> e <code>Quit</code>.","<b>Em campo</b> o jogo vira outra coisa. Você não controla o chute: escolhe a ação e vê a animação decidir. É futebol por menu, e foi este jogo que o inventou.","Na sala do técnico você escolhe <code>Info</code> para saber do adversário, <code>Salvar</code> para gravar o progresso e receber a senha, e <code>Jogar</code> para começar a partida."],"en":["<b>Off the pitch</b> the game is an adventure: you walk around locations, talk and look for people. That is how Misaki is found in Paris, with the commands <code>Move</code>, <code>Ask</code>, <code>Look</code> and <code>Quit</code>.","<b>On the pitch</b> the game becomes something else. You do not control the shot: you pick the action and watch the animation decide. This is menu football, and this is the game that invented it.","In the coach’s room you pick <code>SCOUT</code> to hear about the opponent, <code>SAVE</code> to store your progress and read your password, and <code>PLAY</code> to start the match."],"es":["<b>Fuera del campo</b> el juego es una aventura: recorres escenarios, hablas y buscas gente. Así se encuentra a Misaki en París, con los comandos <code>Move</code>, <code>Ask</code>, <code>Look</code> y <code>Quit</code>.","<b>En el campo</b> el juego se convierte en otra cosa. No controlas el disparo: eliges la acción y ves cómo la animación decide. Es fútbol por menú, y fue este juego quien lo inventó.","En la sala del entrenador eliges <code>DATOS</code> para saber del rival, <code>GRABAR</code> para guardar el progreso y recibir la contraseña, y <code>JUGAR</code> para empezar el partido."]}},{"id":"match","titulo":{"pt":"Durante a partida","en":"During a match","es":"Durante el partido"},"foto":"ct/05-jogo.png","paras":{"pt":["Quando a bola é sua, o jogo pergunta <b><code>Action?</code></b> e para. À direita fica a ficha de quem está com a bola — posição, nome e os atributos que importam naquele instante.","À esquerda ficam o <b>relógio</b> e o <b>placar</b>, com os dois times abreviados em quatro letras. A partida corre em tempo de jogo: cada ação consome segundos do relógio.","A <b>narradora</b> comenta cada lance numa caixa de fala. No original essa caixa tinha uma fileira de texto por linha de roteiro; neste patch são <b>duas</b>, o que é o que permite a narração em inglês caber sem virar telegrama."],"en":["When the ball is yours, the game asks <b><code>Action?</code></b> and stops. On the right is the card of whoever has the ball — position, name, and the stats that matter at that moment.","On the left are the <b>clock</b> and the <b>score</b>, with both sides abbreviated to four letters. The match runs on game time: every action spends seconds off the clock.","The <b>commentator</b> calls each play in a speech box. In the original that box held one row of text per script line; in this patch it holds <b>two</b>, which is what lets English commentary fit without turning into a telegram."],"es":["Cuando la pelota es tuya, el juego pregunta <b><code>Action?</code></b> y se detiene. A la derecha está la ficha de quien lleva el balón — posición, nombre y los atributos que importan en ese instante.","A la izquierda están el <b>reloj</b> y el <b>marcador</b>, con ambos equipos abreviados en cuatro letras. El partido corre en tiempo de juego: cada acción consume segundos del reloj.","La <b>narradora</b> comenta cada jugada en un bocadillo. En el original ese bocadillo tenía una fila de texto por línea de guion; en este parche tiene <b>dos</b>, que es lo que permite que la narración en inglés quepa sin volverse telegrama."]}},{"id":"guts","titulo":{"pt":"Guts — o recurso que decide tudo","en":"Guts — the resource that decides everything","es":"Guts — el recurso que lo decide todo"},"paras":{"pt":["<b>Guts é a coisa mais importante do jogo.</b> Cada jogador tem uma reserva, e <b>toda ação gasta</b>: driblar, passar, chutar, desarmar, cortar. Quanto mais Guts você põe num lance, maior a chance de ele dar certo.","Quando acaba, o jogo diz <b><code>Not enough Guts!!</code></b> e a jogada não sai. Um craque sem Guts perde a bola para um zagueiro comum — e é por isso que o jogo é de administração, não de reflexo.","Guts não volta durante o tempo. Gastar tudo no primeiro tempo é como se perde uma final."],"en":["<b>Guts is the most important thing in the game.</b> Every player has a reserve, and <b>every action spends it</b>: dribbling, passing, shooting, tackling, cutting. The more Guts you put into a play, the better its chance of coming off.","When it runs out, the game says <b><code>Not enough Guts!!</code></b> and the play does not happen. An ace with no Guts loses the ball to an ordinary defender — which is why this is a game of management, not reflexes.","Guts does not come back during play. Spending it all in the first half is how finals are lost."],"es":["<b>Guts es lo más importante del juego.</b> Cada jugador tiene una reserva, y <b>toda acción la gasta</b>: regatear, pasar, disparar, entrar, cortar. Cuanto más Guts pongas en una jugada, mayor su probabilidad de salir bien.","Cuando se acaba, el juego dice <b><code>Not enough Guts!!</code></b> y la jugada no sale. Un crack sin Guts pierde el balón ante un defensa cualquiera — y por eso este es un juego de gestión, no de reflejos.","El Guts no se recupera durante el tiempo de juego. Gastarlo todo en la primera parte es como se pierden las finales."]}},{"id":"card","titulo":{"pt":"A ficha do jogador","en":"The player card","es":"La ficha del jugador"},"foto":"ct/04-ficha.png","paras":{"pt":["Cada jogador tem um nível e sete números. Ganhar partidas sobe o nível de todo o elenco — o técnico avisa: <i>“Well done, men! You have all leveled up.”</i>"],"en":["Every player has a level and seven numbers. Winning matches raises the whole squad — the coach says so: <i>“Well done, men! You have all leveled up.”</i>"],"es":["Cada jugador tiene un nivel y siete números. Ganar partidos sube el nivel de toda la plantilla — el entrenador lo dice: <i>“Well done, men! You have all leveled up.”</i>"]},"lista":[{"k":"Level","v":{"pt":"O nível do jogador. Sobe ao vencer.","en":"The player’s level. It rises when you win.","es":"El nivel del jugador. Sube al ganar."}},{"k":"Max Guts","v":{"pt":"O tanque cheio de Guts daquele jogador — o teto do que ele pode gastar numa partida.","en":"That player’s full Guts tank — the ceiling on what he can spend in a match.","es":"El depósito lleno de Guts de ese jugador — el techo de lo que puede gastar en un partido."}},{"k":"Run","v":{"pt":"Drible: passar pelo marcador com a bola.","en":"Dribbling: getting past your marker with the ball.","es":"Regate: superar al marcador con el balón."}},{"k":"Pass","v":{"pt":"Passe: fazer a bola chegar a quem você quer.","en":"Passing: getting the ball to who you meant.","es":"Pase: hacer que el balón llegue a quien quieres."}},{"k":"Shoot","v":{"pt":"Chute a gol.","en":"Shooting at goal.","es":"Disparo a puerta."}},{"k":"Steal","v":{"pt":"Desarme: tomar a bola de quem a tem.","en":"Tackling: taking the ball off whoever has it.","es":"Entrada: quitarle el balón a quien lo tiene."}},{"k":"Cut","v":{"pt":"Corte: interceptar um passe no caminho.","en":"Cutting: intercepting a pass in flight.","es":"Corte: interceptar un pase en el camino."}},{"k":"Mark","v":{"pt":"Marcação: grudar no homem e tirar o espaço dele.","en":"Marking: sticking to your man and taking his space away.","es":"Marcaje: pegarte a tu hombre y quitarle el espacio."}}]},{"id":"moves","titulo":{"pt":"Os golpes especiais","en":"The special moves","es":"Las técnicas especiales"},"paras":{"pt":["Cada craque tem um golpe próprio, que custa muito Guts e vale a pena quando vai decidir. Eles são do mangá, e o adversário também os tem — o técnico avisa qual esperar."],"en":["Every ace has a move of their own, which costs a lot of Guts and is worth it when it decides something. They come from the manga, and the opposition has them too — the coach tells you which to expect."],"es":["Cada crack tiene una técnica propia, que cuesta mucho Guts y vale la pena cuando va a decidir. Vienen del manga, y el rival también las tiene — el entrenador avisa cuál esperar."]},"lista":[{"k":"Drive Shot","v":{"pt":"O chute do Tsubasa, com a bola descendo no fim.","en":"Tsubasa’s shot, with the ball dipping at the end.","es":"El disparo de Tsubasa, con el balón cayendo al final."}},{"k":"Overhead Kick","v":{"pt":"A bicicleta do Tsubasa.","en":"Tsubasa’s bicycle kick.","es":"La chilena de Tsubasa."}},{"k":"Tiger Shot","v":{"pt":"O petardo do Hyuga — o chute mais forte do torneio.","en":"Hyuga’s cannon — the hardest shot in the tournament.","es":"El cañonazo de Hyuga — el disparo más fuerte del torneo."}},{"k":"Razor Shot","v":{"pt":"O chute rasteiro do Soda, o “matador de craques”.","en":"Soda’s low shot — he is called the Ace Killer.","es":"El disparo raso de Soda, el “matador de cracks”."}},{"k":"Twin Shot","v":{"pt":"O chute a dois dos gêmeos Tachibana.","en":"The Tachibana twins’ two-man shot.","es":"El disparo a dos de los gemelos Tachibana."}},{"k":"Skylab Hurricane","v":{"pt":"A jogada aérea dos gêmeos, um subindo no outro.","en":"The twins’ aerial move, one launching off the other.","es":"La jugada aérea de los gemelos, uno subiendo sobre el otro."}},{"k":"Diving Header","v":{"pt":"O cabeceio mergulhado do Izawa, do Oda e do Takei.","en":"The diving header of Izawa, Oda and Takei.","es":"El cabezazo en plancha de Izawa, Oda y Takei."}},{"k":"Face Block","v":{"pt":"A defesa de cara do Ishizaki, o “gutsman” do time.","en":"Ishizaki’s face block — he is the team’s gutsman.","es":"El bloqueo con la cara de Ishizaki, el “gutsman” del equipo."}}]},{"id":"save","titulo":{"pt":"Guardar o progresso","en":"Keeping your progress","es":"Guardar el progreso"},"foto":"ct/07-memo.png","paras":{"pt":["O jogo de 1988 guarda progresso por <b>senha</b>. Abra <code>Salvar</code> na sala do técnico e a Sanae dita a sua — a grade agora é de letras latinas, maiúsculas, minúsculas e algarismos, e a senha gerada passa pela rotina de validação original do jogo.","<b>Neste patch o jogo também grava em bateria.</b> Ele salva no mesmo instante em que mostra a senha, e carrega no <code>CONTINUE</code> da tela de título. Não é um save novo: é exatamente o que a senha já guardava, escrito na memória do cartucho.","Com um save presente, <b>segurar B no <code>CONTINUE</code></b> abre a tela de senha mesmo assim. <code>KICK OFF</code> começa jogo novo e <b>não apaga</b> o que estava salvo."],"en":["The 1988 game keeps progress by <b>password</b>. Open <code>SAVE</code> in the coach’s room and Sanae reads yours out — the grid is now Latin capitals, lower case and digits, and the generated password passes the game’s own validation routine.","<b>In this patch the game also writes to battery.</b> It saves at the very moment it shows you the password, and loads on <code>CONTINUE</code> at the title screen. This is not a new save: it is exactly what the password already carried, written into the cartridge’s memory.","With a save present, <b>holding B on <code>CONTINUE</code></b> opens the password screen anyway. <code>KICK OFF</code> starts a new game and <b>does not erase</b> what was saved."],"es":["El juego de 1988 guarda el progreso por <b>contraseña</b>. Abre <code>GRABAR</code> en la sala del entrenador y Sanae te dicta la tuya — la rejilla ahora es de letras latinas, mayúsculas, minúsculas y cifras, y la contraseña generada pasa por la rutina de validación original del juego.","<b>En este parche el juego también graba con pila.</b> Guarda en el mismo instante en que muestra la contraseña, y carga en el <code>CONTINUE</code> de la pantalla de título. No es un guardado nuevo: es exactamente lo que la contraseña ya llevaba, escrito en la memoria del cartucho.","Con una partida guardada, <b>mantener B en <code>CONTINUE</code></b> abre la pantalla de contraseña igualmente. <code>KICK OFF</code> empieza partida nueva y <b>no borra</b> lo guardado."]}},{"id":"options","titulo":{"pt":"Opções","en":"Options","es":"Opciones"},"paras":{"pt":["O patch acrescenta um menu de opções com duas coisas que mudam muito como o jogo se lê."],"en":["The patch adds an options menu with two things that change a lot about how the game reads."],"es":["El parche añade un menú de opciones con dos cosas que cambian mucho cómo se lee el juego."]},"lista":[{"k":"Text speed","v":{"pt":"Cinco velocidades: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> e <code>Full</code>. A última põe a frase inteira na tela de uma vez.","en":"Five speeds: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> and <code>Full</code>. The last one puts the whole line on screen at once.","es":"Cinco velocidades: <code>Slow</code>, <code>Normal</code>, <code>Quick</code>, <code>Fast</code> y <code>Full</code>. La última pone la frase entera de golpe."}},{"k":"Narration","v":{"pt":"Liga e desliga o comentário jogada a jogada. Desligado, a partida corre bem mais rápido.","en":"Turns the play-by-play commentary on and off. With it off, the match runs a good deal faster.","es":"Activa y desactiva el comentario jugada a jugada. Desactivado, el partido corre bastante más rápido."}}]},{"id":"patch","titulo":{"pt":"O que é diferente neste patch","en":"What is different in this patch","es":"Qué cambia en este parche"},"foto":"ct/08-save.png","paras":{"pt":["<b>Save com bateria</b>, descrito acima. O jogo original não tinha nenhum.","<b>Duas fileiras de texto por linha de roteiro</b> na narração da partida — de 14 e 18 colunas para 28 e 36.","<b>Menu de opções</b> com velocidade de texto e narração.","<b>Logo do título redesenhado</b>, e o logo pequeno da sala de aula também.","<b>Uma fonte inglesa inteira</b>: no cartucho existiam dezesseis letras latinas, e as outras foram desenhadas do zero.","<b>Isto é uma beta.</b> Faltam a tela de créditos e a tela de erro de senha, e a lista de nomes do final ainda precisa mudar de coluna. Nada disso impede jogar a campanha inteira."],"en":["<b>Battery save</b>, described above. The original game had none.","<b>Two rows of text per script line</b> in match commentary — from 14 and 18 columns to 28 and 36.","<b>An options menu</b> with text speed and narration.","<b>The title logo redrawn</b>, and the small classroom logo with it.","<b>A whole English font</b>: the cartridge held sixteen Latin letters, and the rest were drawn from nothing.","<b>This is a beta.</b> The credits screen and the password-error screen are still missing, and the ending name list has yet to move a column. None of that stops you playing the whole campaign."],"es":["<b>Guardado con pila</b>, descrito arriba. El juego original no tenía ninguno.","<b>Dos filas de texto por línea de guion</b> en la narración del partido — de 14 y 18 columnas a 28 y 36.","<b>Un menú de opciones</b> con velocidad de texto y narración.","<b>El logo del título redibujado</b>, y el logo pequeño del aula con él.","<b>Una fuente inglesa entera</b>: en el cartucho había dieciséis letras latinas, y las demás se dibujaron de la nada.","<b>Esto es una beta.</b> Faltan la pantalla de créditos y la de error de contraseña, y la lista de nombres del final aún debe cambiar de columna. Nada de eso impide jugar la campaña entera."]}}]},"magic-knight-rayearth-2":{"slug":"magic-knight-rayearth-2","titulo":{"pt":"Manual do jogador","en":"Player's manual","es":"Manual del jugador"},"intro":{"pt":"Um manual novo, escrito a partir do original japonês e ampliado, com as palavras que aparecem na tela do patch. Por enquanto ele existe só em inglês e espanhol.","en":"A new manual, written from the Japanese original and expanded, using the words you see on screen in the patch.","es":"Un manual nuevo, escrito a partir del original japonés y ampliado, con las palabras que aparecen en pantalla en el parche."},"secoes":[{"id":"before-you-play","titulo":{"en":"Before You Play","es":"Antes de jugar"},"html":{"en":"<h3>Epilepsy Warning</h3>\n<p><strong>Please read before using this video game system or allowing your children to use it.</strong></p>\n<p>A very small number of people may have seizures or blackouts when exposed to certain light patterns or flashing lights. This can happen while watching TV or playing video games, even to people who have never had a seizure before.</p>\n<p>If you or anyone in your family has ever had epilepsy, consult your doctor before playing.</p>\n<p>Stop playing at once and see a doctor if you feel any of the following while playing:</p>\n<ul>\n<li>dizziness or blurred vision</li>\n<li>eye or muscle twitches</li>\n<li>loss of awareness</li>\n<li>disorientation</li>\n<li>any involuntary movement or convulsion</li>\n</ul>\n<h3>Play Safely</h3>\n<ul>\n<li>Play in a well-lit room and sit as far from the screen as you comfortably can.</li>\n<li>Do not play when you are tired or short on sleep.</li>\n<li>Take a 10 to 20 minute break every hour.</li>\n</ul>\n<h3>Handling Your Cartridge</h3>\n<ul>\n<li>Always turn the power OFF before you insert or remove the cartridge.</li>\n<li>Do not bend the cartridge, drop it or take it apart.</li>\n<li>Do not touch the contacts or get them wet.</li>\n<li>Keep the cartridge away from very high or very low temperatures.</li>\n<li>Never clean it with paint thinner, benzine or other solvents.</li>\n</ul>\n<p>The health advice above applies to all video games.</p>","es":"<h3>Advertencia sobre la epilepsia</h3>\n<p><strong>Lee esto antes de usar este sistema de videojuegos o de dejar que tus hijos lo usen.</strong></p>\n<p>Un número muy pequeño de personas puede sufrir convulsiones o pérdidas del conocimiento al ver ciertos patrones de luz o luces intermitentes. Puede pasar al ver televisión o al jugar videojuegos, y puede pasarles incluso a personas que nunca han tenido una convulsión.</p>\n<p>Si tú o alguien de tu familia ha tenido epilepsia alguna vez, consulta a tu médico antes de jugar.</p>\n<p>Deja de jugar de inmediato y consulta a un médico si mientras juegas sientes cualquiera de estos síntomas:</p>\n<ul>\n<li>mareo o visión borrosa</li>\n<li>tics en los ojos o en los músculos</li>\n<li>pérdida del conocimiento</li>\n<li>desorientación</li>\n<li>cualquier movimiento involuntario o convulsión</li>\n</ul>\n<h3>Juega con seguridad</h3>\n<ul>\n<li>Juega en un cuarto bien iluminado y siéntate tan lejos de la pantalla como te resulte cómodo.</li>\n<li>No juegues si tienes sueño o dormiste poco.</li>\n<li>Descansa de 10 a 20 minutos por cada hora de juego.</li>\n</ul>\n<h3>Cuidado del cartucho</h3>\n<ul>\n<li>Apaga siempre la consola (OFF) antes de meter o sacar el cartucho.</li>\n<li>No dobles el cartucho, no lo
