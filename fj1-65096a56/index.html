<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Famicom Jump Notes</title><style>:root{--bg:#f6f4ef;--fg:#1d1d1f;--mut:#666;--card:#fff;--line:#ddd8cc;--acc:#c0392b;--ok:#1e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16161a;--fg:#ececec;--mut:#9a9a9a;--card:#202026;--line:#33333a;--acc:#ff6b5b;--ok:#4cc38a}}
body{background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,system-ui,sans-serif;margin:0}
main,#gate{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
#gate{max-width:420px;padding-top:15vh} #gate input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:8px 0}
button{background:var(--ok);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer} #err{color:var(--acc)}
h1{font-size:28px;margin:0 0 4px} h2{margin:40px 0 6px;font-size:22px;border-bottom:2px solid var(--line);padding-bottom:4px}
.lead,.sub{color:var(--mut)} .hello{background:var(--card);border-left:4px solid var(--ok);padding:4px 16px;border-radius:6px;margin:16px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.item header{display:flex;justify-content:space-between;gap:8px;align-items:baseline} .ref{color:var(--mut);font:12px ui-monospace,monospace}
.item p{margin:6px 0} .demo{font-size:13px;color:var(--mut);font-style:italic} code{font:13px ui-monospace,monospace}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;max-width:820px} figure{margin:0} figure.one{max-width:520px;margin-top:8px}
img{width:100%;image-rendering:pixelated;border-radius:6px;display:block} figcaption{font-size:13px;color:var(--mut);margin-top:4px}
table{border-collapse:collapse;width:100%;max-width:520px} td,th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left} .bad{color:var(--acc)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px} .num{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px} .num b{display:block;font-size:24px}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
</style></head><body>
