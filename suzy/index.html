const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function abre(senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.sal),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.iv)},k,u(P.c)));
  document.open();document.write(h);document.close();
}
async function tenta(senha,lembra){
  document.getElementById("m").textContent="Opening…";
  try{ await abre(senha); try{ if(lembra) localStorage.setItem("suzy:senha",senha); }catch(e){} }
  catch(e){ try{localStorage.removeItem("suzy:senha");}catch(_){} document.getElementById("m").textContent="Wrong password."; }
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();tenta(document.getElementById("s").value,document.getElementById("lembra").checked);};
try{ const s=localStorage.getItem("suzy:senha"); if(s) tenta(s,true); }catch(e){}
